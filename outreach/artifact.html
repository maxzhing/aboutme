<title>Outreach Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{
  --paper:#eceff0; --surface:#fff; --surface-2:#f6f8f8; --sunk:#e2e7e8; --veil:rgba(255,255,255,.72);
  --ink:#0f1718; --ink-2:#3f5459; --ink-3:#6f868b;
  --rule:#d5dedd; --rule-2:#bfcccb;
  --accent:#0b6e77; --accent-ink:#08535a; --accent-wash:#dbeced; --accent-line:#96c5c8;
  --ochre:#9a5f16; --ochre-wash:#f6e9d7; --ochre-line:#dcbf93;
  --ok:#2b6f4c; --on-accent:#fff;
  --sh-1:0 1px 2px rgba(15,23,24,.05);
  --sh-2:0 1px 2px rgba(15,23,24,.05),0 8px 20px -12px rgba(15,23,24,.28);
  --sh-3:0 2px 4px rgba(15,23,24,.06),0 18px 40px -20px rgba(15,23,24,.4);
  --c-Demo:#0b6e77; --c-Workshop:#2c62a8; --c-Mentoring:#6a4a9c; --c-Volunteering:#1d7355;
  --c-Equity:#a83f66; --c-Community:#9a5f16; --c-CommunityService:#4a7029; --c-Accessibility:#8241a0;
  --c-Fundraising:#8a6a10; --c-Camp:#b8542a; --c-Speaking:#2f6875; --c-Competition:#7a5aa8;
  --c-OutreachMedia:#55636e;
  --f-display:'Archivo',system-ui,sans-serif; --f-body:'Source Sans 3',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0a1112; --surface:#131c1e; --surface-2:#182123; --sunk:#0e1718; --veil:rgba(19,28,30,.75);
  --ink:#e7efee; --ink-2:#9cb0b3; --ink-3:#70878b;
  --rule:#243335; --rule-2:#304648;
  --accent:#54c2cc; --accent-ink:#82d8e0; --accent-wash:#0c3236; --accent-line:#1c5257;
  --ochre:#e0a355; --ochre-wash:#38290f; --ochre-line:#5c451e;
  --ok:#63bd8c; --on-accent:#06191b;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 1px 2px rgba(0,0,0,.45),0 8px 20px -12px rgba(0,0,0,.8);
  --sh-3:0 2px 4px rgba(0,0,0,.5),0 18px 40px -20px rgba(0,0,0,.9);
  --c-Demo:#57c3cd; --c-Workshop:#7aaeea; --c-Mentoring:#b199e0; --c-Volunteering:#5cc297;
  --c-Equity:#e88bab; --c-Community:#e0a355; --c-CommunityService:#96c76a; --c-Accessibility:#c592dc;
  --c-Fundraising:#d4b155; --c-Camp:#ef9068; --c-Speaking:#6fb6c4; --c-Competition:#b9a0e6;
  --c-OutreachMedia:#a4b4c0;
}}
:root[data-theme="dark"]{
  --paper:#0a1112; --surface:#131c1e; --surface-2:#182123; --sunk:#0e1718; --veil:rgba(19,28,30,.75);
  --ink:#e7efee; --ink-2:#9cb0b3; --ink-3:#70878b;
  --rule:#243335; --rule-2:#304648;
  --accent:#54c2cc; --accent-ink:#82d8e0; --accent-wash:#0c3236; --accent-line:#1c5257;
  --ochre:#e0a355; --ochre-wash:#38290f; --ochre-line:#5c451e;
  --ok:#63bd8c; --on-accent:#06191b;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 1px 2px rgba(0,0,0,.45),0 8px 20px -12px rgba(0,0,0,.8);
  --sh-3:0 2px 4px rgba(0,0,0,.5),0 18px 40px -20px rgba(0,0,0,.9);
  --c-Demo:#57c3cd; --c-Workshop:#7aaeea; --c-Mentoring:#b199e0; --c-Volunteering:#5cc297;
  --c-Equity:#e88bab; --c-Community:#e0a355; --c-CommunityService:#96c76a; --c-Accessibility:#c592dc;
  --c-Fundraising:#d4b155; --c-Camp:#ef9068; --c-Speaking:#6fb6c4; --c-Competition:#b9a0e6;
  --c-OutreachMedia:#a4b4c0;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;letter-spacing:-.015em;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}

/* masthead */
.mast{background:var(--surface);border-bottom:1px solid var(--rule)}
.mast-in{max-width:1320px;margin:0 auto;padding:18px 20px 16px;display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:34px;height:34px;flex:none;border-radius:8px;background:var(--accent);display:grid;place-items:center;box-shadow:var(--sh-1)}
.logo svg{width:19px;height:19px;stroke:var(--on-accent);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.brand h1{font-size:21px;font-weight:700;letter-spacing:-.028em;line-height:1.1}
.brand p{margin:1px 0 0;font-size:12.5px;color:var(--ink-3)}
.mast-act{display:flex;gap:7px;align-items:center;flex-wrap:wrap}

/* ribbon */
.ribbon{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--rule);border-radius:10px;background:var(--surface);box-shadow:var(--sh-2);overflow:hidden;margin:18px 0 0}
.rib{flex:1 1 108px;padding:10px 14px 11px;border-right:1px solid var(--rule);min-width:0}
.rib:last-child{border-right:0}
.rib .n{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;display:block}
.rib.on .n{color:var(--accent)}
.rib .k{margin-top:1px}

/* step blocks */
.step{margin-top:16px}
.step-h{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.step-n{width:19px;height:19px;flex:none;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-mono);font-size:10.5px;font-weight:500}
.step-h h2{font-size:14.5px;font-weight:600}
.step-h .hint{font-size:12.5px;color:var(--ink-3)}

.areabar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 13px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);box-shadow:var(--sh-2)}
.areabar select{flex:1 1 178px;min-width:0;padding:9px 11px;border:1px solid var(--rule-2);border-radius:8px;background:var(--surface-2);cursor:pointer}
.areabar select:disabled{opacity:.45;cursor:default}
.areabar .now{font-size:13px;color:var(--ink-2);padding:0 3px}
.areabar .now b{color:var(--accent-ink)}

.chips-row{display:flex;flex-wrap:wrap;gap:7px}
.qchip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--rule-2);border-radius:20px;background:var(--surface);cursor:pointer;font-size:13.5px;transition:.15s}
.qchip:hover{border-color:var(--accent);background:var(--surface-2)}
.qchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.qchip svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.8}

/* toolbar */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.search{flex:1 1 250px;min-width:190px;position:relative}
.search input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--rule-2);border-radius:9px;background:var(--surface);box-shadow:var(--sh-1)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:2}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border:1px solid var(--rule-2);background:var(--surface);border-radius:9px;cursor:pointer;font-size:14px;white-space:nowrap;transition:.15s;box-shadow:var(--sh-1)}
.btn:hover{border-color:var(--accent);background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:7px;box-shadow:none}
.btn[aria-pressed="true"]{background:var(--accent-wash);border-color:var(--accent-line);color:var(--accent-ink)}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* advanced facets */
.adv{margin-top:10px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:16px;box-shadow:var(--sh-1)}
.fgroup > .eyebrow{display:flex;justify-content:space-between;padding-bottom:5px;border-bottom:1px solid var(--rule);margin-bottom:5px}
.fgroup .clear{border:0;background:none;color:var(--accent-ink);cursor:pointer;font:inherit;font-size:10px;letter-spacing:.06em;padding:0}
.opt{display:flex;align-items:center;gap:7px;width:100%;border:0;background:none;padding:3px 4px;border-radius:5px;cursor:pointer;text-align:left;font-size:13.5px;color:var(--ink-2)}
.opt:hover{background:var(--surface-2);color:var(--ink)}
.opt .tick{width:12px;height:12px;flex:none;border:1px solid var(--rule-2);border-radius:3px;background:var(--surface)}
.opt[aria-pressed="true"]{color:var(--ink);font-weight:600}
.opt[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent)}
.opt .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .ct{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.opt[disabled]{opacity:.34;cursor:default}
.more{font-family:var(--f-mono);font-size:10.5px;color:var(--accent-ink);background:none;border:0;cursor:pointer;padding:3px 4px;letter-spacing:.05em}

/* results */
.count{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:18px 0 9px}
.count strong{font-family:var(--f-display);font-size:16px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(316px,1fr));gap:12px;align-items:start}
.card{border:1px solid var(--rule);border-radius:11px;background:var(--surface);box-shadow:var(--sh-2);overflow:hidden;transition:box-shadow .18s,border-color .18s;--cat:var(--accent)}
.card:hover{box-shadow:var(--sh-3);border-color:var(--rule-2)}
.card.open{box-shadow:var(--sh-3);grid-column:1/-1}
.chead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;padding:13px 14px 11px;cursor:pointer;align-items:start;width:100%;border:0;background:none;text-align:left;font:inherit;color:inherit;border-radius:11px 11px 0 0}
.chead:hover .ct-title{color:var(--accent-ink)}
.badge{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--cat) 14%,transparent);border:1px solid color-mix(in srgb,var(--cat) 32%,transparent)}
.badge svg{width:17px;height:17px;stroke:var(--cat);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ct-title{font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.28;letter-spacing:-.012em;display:block}
.ct-sub{font-size:12.5px;color:var(--ink-2);margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.ct-sub .pin{width:11px;height:11px;stroke:var(--ink-3);fill:none;stroke-width:1.9;flex:none}
.caret{width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s;margin-top:6px}
.card.open .caret{transform:rotate(180deg)}
.crow{display:flex;gap:5px;flex-wrap:wrap;padding:0 14px 10px 57px}
.chip{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.02em;padding:2px 7px;border-radius:5px;border:1px solid var(--rule-2);color:var(--ink-2);white-space:nowrap;background:var(--surface-2)}
.chip.cat{background:color-mix(in srgb,var(--cat) 12%,transparent);border-color:color-mix(in srgb,var(--cat) 30%,transparent);color:var(--cat);font-weight:500}
.chip.ok{background:var(--accent-wash);border-color:var(--accent-line);color:var(--accent-ink)}

/* the real-link block: the point of the whole page */
.link{display:flex;align-items:center;gap:10px;margin:0 14px 13px;padding:9px 11px;border:1px solid var(--rule-2);border-left:3px solid var(--cat);border-radius:8px;background:var(--surface-2);text-decoration:none;color:inherit;transition:.15s}
.link:hover{background:var(--accent-wash);border-color:var(--accent-line);border-left-color:var(--cat)}
.link .dom{font-family:var(--f-mono);font-size:12.5px;font-weight:500;color:var(--accent-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link .what{font-size:11.5px;color:var(--ink-3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link .go{margin-left:auto;width:15px;height:15px;stroke:var(--accent-ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.link .kind{font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--rule-2);border-radius:4px;padding:1px 5px;flex:none}

.det{border-top:1px dashed var(--rule);padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(288px,1fr));gap:16px;align-items:start}
.det.lean{grid-template-columns:minmax(0,1fr)}
.det.lean > div:last-child{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;align-items:start}
.det.lean > div:last-child .panel + .panel{margin-top:0}
.det p.lede{margin:0 0 12px;color:var(--ink-2);max-width:62ch}
.dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 13px;font-size:13.5px}
.dl dt{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);padding-top:3px}
.dl dd{margin:0;color:var(--ink-2)}
.dl dd b{color:var(--ink);font-weight:600}
.need{margin:11px 0 0;padding:0;list-style:none}
.need li{position:relative;padding-left:17px;font-size:13px;color:var(--ink-2);margin-bottom:3px}
.need li::before{content:"";position:absolute;left:2px;top:7px;width:6px;height:6px;border:1.5px solid var(--cat);border-radius:1px;opacity:.75}
.need.bring li::before{border-radius:50%}
.panel{background:var(--surface-2);border:1px solid var(--rule);border-radius:9px;padding:12px 13px}
.panel + .panel{margin-top:11px}
.panel h4{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px;font-weight:500}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.statusbar{display:flex;margin-top:9px;border:1px solid var(--rule-2);border-radius:8px;overflow:hidden}
.statusbar button{flex:1;border:0;border-right:1px solid var(--rule);background:var(--surface);padding:6px 2px;cursor:pointer;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.statusbar button:last-child{border-right:0}
.statusbar button:hover{background:var(--accent-wash);color:var(--accent-ink)}
.statusbar button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:500}
.prof{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.prof input{flex:1 1 108px;min-width:0;padding:6px 9px;border:1px solid var(--rule-2);border-radius:7px;background:var(--surface);font-size:13px}
.draft{width:100%;min-height:170px;padding:10px 11px;border:1px solid var(--rule-2);border-radius:8px;background:var(--surface);font-family:var(--f-mono);font-size:11.5px;line-height:1.6;resize:vertical}
.pager{display:flex;justify-content:center;padding:18px}
.empty{grid-column:1/-1;padding:44px 20px;text-align:center;color:var(--ink-2);border:1px dashed var(--rule-2);border-radius:11px}
.empty h3{font-size:17px;margin-bottom:6px}

/* notes + ask */
.note{display:flex;gap:11px;align-items:flex-start;background:var(--ochre-wash);border:1px solid var(--ochre-line);border-radius:10px;padding:11px 14px;margin-top:16px;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.note b{color:var(--ink);font-weight:600}
.note .k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ochre);flex:none;padding-top:3px;font-weight:500}
.ask{border:1px solid var(--rule);border-radius:11px;background:var(--surface);box-shadow:var(--sh-2);overflow:hidden}
.ask-head{display:flex;flex-wrap:wrap;gap:9px 14px;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--rule);background:var(--surface-2)}
.ask-head h2{font-size:14.5px;display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.dot.off{background:var(--ink-3)}
.ask-body{padding:13px 14px 15px}
.modes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ask textarea{width:100%;min-height:62px;padding:10px 12px;border:1px solid var(--rule-2);border-radius:8px;background:var(--surface-2);resize:vertical;line-height:1.5}
.ask .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px}
.out{margin-top:12px;border-top:1px solid var(--rule);padding-top:12px}
.out:empty{display:none}
.think{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.think::after{content:"";display:inline-block;width:1ch;animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.stream{white-space:pre-wrap;font-size:14px;color:var(--ink-2);line-height:1.65;max-width:74ch}
.err{background:var(--ochre-wash);border:1px solid var(--ochre-line);border-radius:8px;padding:10px 12px;font-size:13.5px;color:var(--ink-2)}
.areagrp{margin-top:12px}
.areagrp > h4{font-family:var(--f-display);font-size:13px;font-weight:600;color:var(--ink);padding-bottom:5px;border-bottom:1px solid var(--rule);margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.areagrp > h4 span{font-family:var(--f-mono);font-size:10px;color:var(--ink-3);letter-spacing:.08em}
.sugg{display:grid;gap:8px}
.scard{border:1px solid var(--rule-2);border-left:3px solid var(--ochre);border-radius:8px;padding:11px 12px;background:var(--surface-2)}
.scard h5{font-family:var(--f-display);font-size:14px;font-weight:600;margin:0 0 2px}
.scard p{margin:0;font-size:13px;color:var(--ink-2)}
.foot{margin:24px 0 0;padding-top:15px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink-3);max-width:80ch;line-height:1.65}
.foot b{color:var(--ink-2);font-weight:600}
.pad{padding-bottom:80px}
@media (max-width:640px){.crow{padding-left:14px}.ribbon .rib{flex-basis:50%;border-bottom:1px solid var(--rule)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<header class="mast">
  <div class="mast-in">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="8" width="16" height="11" rx="2"></rect><path d="M12 8V4M9 4h6M9 13h.01M15 13h.01M9 16h6"></path></svg></span>
      <div>
        <h1>Outreach Bench</h1>
        <p id="tagline">&nbsp;</p>
      </div>
    </div>
    <div class="mast-act">
      <button class="btn sm" id="themeBtn">Theme</button>
      <button class="btn sm" id="csvBtn">Export CSV</button>
      <button class="btn sm" id="mineBtn" aria-pressed="false">My pipeline</button>
    </div>
  </div>
</header>

<div class="wrap pad">

  <section class="ribbon" id="ribbon" aria-label="Pipeline summary"></section>

  <section class="step">
    <div class="step-h"><span class="step-n">1</span><h2>Where are you?</h2>
      <span class="hint">Everything below filters to your area.</span></div>
    <div class="areabar">
      <select id="aCountry" aria-label="Country"></select>
      <select id="aState" aria-label="State or province"></select>
      <select id="aMetro" aria-label="Metro area"></select>
      <span class="now" id="areaNow"></span>

ow judging actually works from the other side, which changes how your own team presents."],["Girls in STEM day","Equity","Middle school (6-8)","In person","3 hours","Medium","$60-150",["Women mentors and alumnae on the floor, not just on a slide","Activity that ends in something they keep"],["Take-home kits","Alumnae contact cards","Name tags with first names only"],"A half-day event for girls who have not been told robotics is for them. The mentors on the floor matter more than the activity."],["Intro to CAD session","Workshop","High school (9-12)","Hybrid","2 hours","Medium","$0",["A computer lab or laptops","Free accounts set up before the session, not during"],["A part file that prints in 20 minutes","Printed step-by-step handout","USB drive with the software installer"],"Teach enough CAD that someone can model a bracket and print it. Two hours gets a beginner to a real part."],["Beginner programming class","Workshop","Elementary (K-5)","Hybrid","1 hour","Low","$0",["Devices with a browser","An unplugged backup for when the wifi dies"],["Printed Hour of Code cards","Stickers","A robot to show what the code eventually drives"],"An hour of block or text programming for beginners. Bring the robot so they see where the code eventually goes."],["3D printing demo","Demo","All ages","In person","2 hours","Low","$15-30 filament",["A printer that survives transport","A print that finishes inside the session"],["Failed prints (people love these)","A benchy and a printed gear train","Filament samples to hand out"],"A printer, a table, and a bin of failed prints. People will watch a whole print finish, which is more attention than you can usually buy."],["Career talk or classroom visit","Speaking","High school (9-12)","Hybrid","50 minutes","Low","$0",["Students who can talk about failure, not just trophies","A slide count under 12"],["One physical part to pass around","Team business cards","The QR code for your team site"],"Fifty minutes in a classroom. Talk about the season you lost, not the one you won -- it lands better and it is more useful."],["Robot petting zoo at a public event","Demo","All ages","In person","4 hours","Medium","$0",["Booth space and a load-in time","A driver rotation so nobody burns out","Certificate of insurance if the venue asks"],["10x10 canopy and weights","Zip ties, gaffer tape, spare fuses","Two tables and a trash bin","Cash box only if you are selling"],"A booth at a public event with the robot driveable all day. High reach, hard on the drivers, worth a rotation schedule."],["Parade entry with the robot","Community","All ages","In person","Half day","Medium","$0-50 entry",["A trailer or a cart that survives 2 miles","Walkers who hand out flyers"],["Flyers with your recruiting QR code","Water for the walkers","A tow plan for when the battery dies"],"The robot on a trailer, students walking alongside with flyers. Pure visibility; plan for the battery dying at mile two."],["Adapt a ride-on car for a child with limited mobility","Accessibility","Family","In person","Full day build","High","$150-300 per car",["A physical or occupational therapist signing off on the fit","A specific child, measured, not a generic build"],["Ride-on car, PVC, pool noodles, big arcade button","Soldering station","Seatbelt hardware rated for the child's size"],"Modify a ride-on toy car so a toddler with limited mobility can drive it independently. A therapist measures the child; you build to that."],["Switch-adapt toys for kids with disabilities","Accessibility","Family","In person","3 hours","Medium","$10-20 per toy",["Soldering irons and ventilation","Toys bought new, in the box"],["3.5mm mono jacks and wire","Heat-shrink and a heat gun","Small screwdrivers","A tested example toy"],"Wire a 3.5mm switch jack into a battery toy so a child using an adaptive switch can play with it. Cheap, fast, and genuinely used."],["Shop safety and tool basics","Workshop","High school (9-12)","In person","90 minutes","Low","$0",["Real PPE for everyone in the room","A tool you are genuinely qualified to teach"],["Safety glasses in a bin","A cut-off drill bit and a chewed-up piece of stock","Your team's safety manual"],"PPE, tool basics, and what actually happens when you skip a step. Teach only tools you are certified on."],["Sponsorship pitch and shop tour","Fundraising","Adults","In person","45 minutes","Medium","$0",["A one-page budget that shows where the money goes","Two students who lead the meeting, not the mentor","A tiered sponsorship sheet"],["Printed one-pager and last year's impact numbers","A part the robot actually uses","A thank-you plan in writing"],"Forty-five minutes with a company. Students present, the mentor stays quiet, and you leave a one-pager with real numbers on it."],["Run a summer camp session","Camp","Elementary (K-5)","In person","Week-long, 3 hrs/day","High","$200-500 materials",["Adult supervision ratios that meet the host's policy","A curriculum written down before June","Registration handled by the host, not you"],["Kits for every day plus 20% spares","Nametags and a roster","A rainy-day indoor plan","Snacks cleared for allergies"],"A week of camp you plan and run. The largest single commitment here and the one that produces the most repeat families."],["Family STEM night","Community","Family","In person","2 hours","Medium","$50-120",["Stations that run without a facilitator lecturing","Materials in the languages families actually speak"],["6-8 station kits","Passport cards kids get stamped","Translated instructions","A raffle prize"],"Six stations, two hours, parents included. Translate the handouts or half the room cannot participate."],["Host an offseason scrimmage","Competition","High school (9-12)","In person","Full day","High","$300-800",["A gym or field house booked months out","Field elements borrowed or built","An FTA-type volunteer who knows the control system"],["Field elements and scoring materials","Extension cords and a network switch","Pit tables","Lunch plan ires.org","category":"Volunteering","audience":"All ages","format":"In person","season":"Competition","window":"Regional and district events run January-April","deadline":"Register 4-6 weeks before the event; popular roles fill first","applyType":"Portal","applyNote":"Create a FIRST account, complete youth-protection screening, then apply to specific event roles","hours":10,"reach":250,"effort":"Low","impact":4,"notes":"The single highest-yield thing an outreach lead can schedule. Judge Advisor, Queuing, Field Reset and Pit Admin all take students where local rules allow.","tags":["FIRST","competition","recurring"]},{"org":"FIRST","program":"National Robotics Week events","url":"https://www.nationalroboticsweek.org","category":"Demo","audience":"All ages","format":"In person","season":"Offseason","window":"First full week of April, every year","deadline":"List your own event 4-8 weeks ahead; attend anything nearby with no lead time","applyType":"Web form","applyNote":"Register your event on the National Robotics Week site, then invite local press","hours":16,"reach":300,"effort":"Medium","impact":4,"notes":"You can both attend listed events and register your own. Registering yours puts your team on a national map, which reads well in an Impact Award submission.","tags":["FIRST","recurring","april"]},{"org":"FIRST","program":"FIRST LEGO League volunteer and coach roles","url":"https://www.firstinspires.org","category":"Mentoring","audience":"Elementary (K-5)","format":"Hybrid","season":"Fall","window":"Season runs August-February; qualifiers November-January","deadline":"Coaches commit by September; event volunteers 4 weeks out","applyType":"Portal","applyNote":"Contact your FIRST Program Delivery Partner (listed by state on the FIRST site)","hours":24,"reach":15,"effort":"High","impact":5,"notes":"Your Program Delivery Partner is the person who knows which local FLL teams have no coach. One email to them beats twenty cold emails to schools.","tags":["FIRST","FLL","m he facilitator what they need before proposing what you want to teach.","tags":["national","equity","clubs"]},{"org":"Boys & Girls Clubs of America","program":"Club STEM programming","url":"https://www.bgca.org","category":"Workshop","audience":"Elementary (K-5)","format":"In person","season":"Offseason","window":"Year-round; summer programming is hungriest for volunteers","deadline":"3-5 weeks; individual clubs decide locally","applyType":"Email","applyNote":"Find your local club on bgca.org and email the Program Director directly -- national will just redirect you","hours":12,"reach":35,"effort":"Medium","impact":5,"notes":"Clubs serve the kids least likely to already have a robotics team. Summer is when they most need programming and have the fewest volunteers.","tags":["national","equity","summer"]},{"org":"Girl Scouts of the USA","program":"Robotics badges and Journey support","url":"https://www.girlscouts.org","category":"Equity","audience":"Elementary (K-5)","format":"In person","season":"Winter","window":"Troop years run September-May; badge days cluster January-March","deadline":"6-8 weeks through a council; 2-3 weeks for a single troop","applyType":"Web form","applyNote":"Contact your regional council's Program department, or ask a troop leader you already know","hours":16,"reach":30,"effort":"Medium","impact":5,"notes":"Girl Scouts has an existing robotics badge structure -- you are helping them earn something specific, which is much easier to say yes to than a generic offer.","tags":["national","equity","badges"]},{"org":"Scouting America","program":"Robotics merit badge and Nova STEM awards","url":"https://www.scouting.org","category":"Workshop","audience":"Middle school (6-8)","format":"In person","season":"Fall","window":"Troop meetings year-round; merit badge midways in spring and fall","deadline":"3-4 weeks; merit badge counselors must be registered adults","applyType":"Email","applyNote":"Email a local Scoutmaster, or contact the council office about merit badge midway slots","hours":10,"reach":25,"effort":"Medium","impact":4,"notes":"The Robotics merit badge requirements are published and specific. A registered adult mentor must counsel it, but students do the teaching.","tags":["national","badges","scouts"]},{"org":"4-H","program":"4-H STEM and county extension programs","url":"https://4-h.org","category":"Workshop","audience":"Middle school (6-8)","format":"In person","season":"Summer","window":"Club year runs September-August; fair season peaks July-September","deadline":"4-6 weeks; county fair exhibits book 4-6 months ahead","applyType":"Email","applyNote":"Find your county extension office and email the 4-H Youth Development Agent","hours":14,"reach":40,"effort":"Medium","impact":4,"notes":"The strongest single channel for rural outreach. County agents are paid to connect youth programs and will actively find you an audience.","tags":["national","rural","fairs"]},{"org":"Society of Women Engineers","program":"SWENext and outreach events","url":"https://swe.org","category":"Equity","audience":"High school (9-12)","format":"Hybrid","season":"Winter","window":"Year-round; Introduce a Girl to Engineering Day in February","deadline":"6-8 weeks through a professional section","applyType":"Web form","applyNote":"Contact your regional SWE section about co-hosting, or register students as SWENext members (free)","hours":10,"reach":40,"effort":"Low","impact":5,"notes":"Co-hosting with a professional SWE section gets you adult engineers on the floor, which is what actually changes a middle schooler's mind.","tags":["national","equity","february"]},{"org":"National Society of Black Engineers","program":"NSBE Jr. chapters","url":"https://www.nsbe.org","category":"Equity","audience":"High school (9-12)","format":"Hybrid","season":"Fall","window":"Chapter year September-May; national convention in spring","deadline":"6-10 weeks through a professional chapter","applyType":"Web form","applyNote":"Contact your regional NSBE professional chapter about supporting or starting an NSBE Jr. chapter","hours":20,"reach":30,"effort":"High","impact":5,"notes":"Support an existing NSBE Jr. chapter before proposing a new one. Their members often already want robotics and have no equipment.","tags":["national","equity","chapters"]},{"org":"SHPE","program":"Noche de Ciencias family science nights","url":"https://www.shpe.org","category":"Equity","audience":"Family","format":"In person","season":"Fall","window":"Events run through the school year, concentrated in fall","deadline":"8-10 weeks through a professional chapter","applyType":"Web form","applyNote":"Contact a SHPE professional or student chapter about joining a Noche de Ciencias event","hours":12,"reach":100,"effort":"Medium","impact":5,"notes":"Bilingual family science nights. If your team has Spanish speakers, this is where they are most valuable -- and translated materials count as outreach too.","tags":["national","equity","bilingual"]},{"org":"DiscoverE","program":"Engineers Week and Introduce a Girl to Engineering Day","url":"https://discovere.org","category":"Equity","audience":"Middle school (6-8)","format":"Hybrid","season":"Winter","window":"Engineers Week is the week of Washington's birthday, late February","deadline":"Plan 8-10 weeks out; free activity materials available any time","applyType":"Web form","applyNote":"Download the free event toolkits and register your event on the DiscoverE site","hours":10,"reach":60,"effort":"Low","impact":4,"notes":"Free, ready-made event kits with a national date attached. The fixed date makes it easy to get a school to commit.","tags":["national","equity","february","free-materials"]},{"org":"Association of Science and Technology Centers","program":"Find a science center near you","url":"https://www.astc.org","category":"Demo","audience":"Family","format":"In person","season":"Offseason","window":"Year-round; family-science weekends cluster in spring and fall","deadline":"8-12 weeks -- museums plan public programs far ahead","applyType":"Web form","applyNote":"Use the ASTC member directory to find your nearest center, then contact Public Programs","hours":16,"reach":400,"effort":"Medium","impact":5,"notes":"Highest attendance per hour of any venue on this list. They will ask for a certificate of insurance and a load-in plan, so start early.","tags":["national","museums","high-reach"]},{"org":"Maker Faire","program":"Exhibit at a Maker Faire","url":"https://makerfaire.com","category":"Demo","audience":"All ages","format":"In person","season":"Summer","window":"Faires run spring through fall, dates vary by city","deadline":"Call for Makers usually closes 8-12 weeks before the event","applyType":"Web form","applyNote":"Find your regional faire and submit through its Call for Makers","hours":20,"reach":500,"effort":"Medium","impact":4,"notes":"Apply as a Maker, not a sponsor -- Maker booths are usually free. The crowd is technical and asks real questions, which is good practice for judges.","tags":["national","high-reach","makers"]},{"org":"VolunteerMatch","program":"Search local volunteer needs","url":"https://www.volunteermatch.org","category":"Community Service","audience":"All ages","format":"Hybrid","season":"Offseason","window":"Year-round, updated continuously","deadline":"Varies by listing; many are same-week","applyType":"Web form","applyNote":"Search by ZIP code and filter to Children & Youth or Education","hours":8,"reach":30,"effort":"Low","impact":3,"notes":"Use this to fill gaps in a slow month. Filter to youth and education so the hours connect to your team's mission rather than being generic service.","tags":["national","search-engine"]},{"org":"Idealist","program":"Search nonprofit volunteer openings","url":"https://www.idealist.org","category":"Community Service","audience":"All ages","format":"Hybrid","season":"Offseason","window":"Year-round","deadline":"Varies by listing","applyType":"Web form","applyNote":"Search volunteer opportunities by location and cause area","hours":8,"reach":30,"effort":"Low","impact":3,"notes":"Better than VolunteerMatch for finding organizations to partner with long-term rather than one-off shifts.","tags":["national","search-engine"]},{"org":"JustServe","program":"Search community service projects","url":"https://www.justserve.org","category":"Community Service","audience":"All ages","format":"In person","season":"Offseason","window":"Year-round","deadline":"Varies; many projects accept same-week signups","applyType":"Web form","applyNote":"Search projects by ZIP code; no account needed to browse","hours":6,"reach":25,"effort":"Low","impact":3,"notes":"Strong coverage of small community projects that never make it onto bigger platforms. Useful for filling a weekend.","tags":["national","search-engine"]},{"org":"Special Olympics","program":"Volunteer at local competitions","url":"https://www.specialolympics.org","category":"Accessibility","audience":"All ages","format":"In person","season":"Offseason","window":"Competitions run year-round by sport and region","deadline":"3-6 weeks; large games recruit months ahead","applyType":"Web form","applyNote":"Find your state or regional program and register as a volunteer","hours":10,"reach":60,"effort":"Low","impact":5,"notes":"Not robotics, and that is fine -- FIRST's Impact Award asks what your team does for the community, not only what it does with robots.","tags":["national","accessibility"]},{"org":"Habitat for Humanity","program":"Volunteer with a local affiliate","url":"https://www.habitat.org","category":"Community Service","audience":"Adults","format":"In person","season":"Offseason","window":"Build days year-round, weather permitting","deadline":"2-4 weeks; age minimums vary by affiliate (often 16 for the site, lower for ReStore)","applyType":"Web form","applyNote":"Find your local affiliate and register a group through their volunteer page","hours":16,"reach":20,"effort":"Low","impact":3,"notes":"Check the age minimum before you recruit students. ReStore shifts usually accept younger volunteers than the build site does.","tags":["national","service","age-limits"]},{"org":"Feeding America","program":"Volunteer at a member food bank","url":"https://www.feedingamerica.org","category":"Community Service","audience":"All ages","format":"In person","season":"Winter","window":"Year-round; November-December demand spikes hard","deadline":"1-3 weeks; holiday shifts fill by October","applyType":"Web form","applyNote":"Use the food bank locator, then register your group with that food bank directly","hours":12,"reach":40,"effort":"Low","impact":3,"notes":"The easiest large group activity to book. Sort shifts take 10-20 people at once, which most venues cannot handle.","tags":["national","service","groups"]},{"org":"Ronald McDonald House Charities","program":"Support families near a children's hospital","url":"https://www.rmhc.org","category":"Community Service","audience":"Family","format":"In person","season":"Winter","window":"Year-round; meal programs run continuously","deadline":"4-8 weeks; some chapters require an orientation","applyType":"Web form","applyNote":"Find your local chapter and ask about group volunteer or Meals-from-the-Heart programs","hours":10,"reach":30,"effort":"Medium","impact":4,"notes":"Cooking a meal for families is a real commitment and reads as genuine rather than performative in an award submission.","tags":["national","service","families"]},{"org":"Meals on Wheels America","program":"Deliver meals with a local program","url":"https://www.mealsonwheelsamerica.org","category":"Community Service","audience":"Seniors","format":"In person","season":"Offseason","window":"Weekday routes year-round","deadline":"2-4 weeks; requires a driver and often a background check","applyType":"Web form","applyNote":"Find your local program through the site and ask about student volunteers","hours":8,"reach":20,"effort":"Low","impact":3,"notes":"Needs a licensed driver, so this is a mentor-plus-students activity. Routes are short and consistent, which makes recurring hours easy to log.","tags":["national","service","seniors"]},{"org":"Science Olympiad","program":"Volunteer at a regional tournament","url":"https://www.soinc.org","category":"Volunteering","audience":"Middle school (6-8)","format":"In person","season":"Competition","window":"Invitationals January-February, regionals and states February-April","deadline":"4-8 weeks; event supervisors recruited earlier","applyType":"Email","applyNote":"Contact your state or regional tournament director through the state chapter page","hours":10,"reach":150,"effort":"Low","impact":4,"notes":"Event running and scoring are a natural fit for robotics students and put you in front of hundreds of STEM-interested middle schoolers.","tags":["national","competition","stem"]},{"org":"MATHCOUNTS","program":"Volunteer at a chapter competition","url":"https://www.mathcounts.org","category":"Volunteering","audience":"Middle school (6-8)","format":"In person","season":"Competition","window":"Chapter competitions in February, state in March","deadline":"6-8 weeks","applyType":"Web form","applyNote":"Contact your chapter coordinator through the MATHCOUNTS volunteer page","hours":8,"reach":100,"effort":"Low","impact":3,"notes":"Proctoring and scoring. Low effort, and it puts your team's name in front of exactly the middle schoolers you want recruiting next year.","tags":["national","competition","february"]},{"org":"Destination Imagination","program":"Volunteer as an appraiser","url":"https://www.destinationimagination.org","category":"Volunteering","audience":"Elementary (K-5)","format":"In person","season":"Competition","window":"Regional tournaments February-March, Globals in May","deadline":"6-8 weeks; appraiser training required","applyType":"Web form","applyNote":"Find your regional affiliate and register as an appraiser","hours":12,"reach":120,"effort":"Medium","impact":3,"notes":"Requires a short training. Judging creative problem-solving is genuinely good preparation for talking to your own judges.","tags":["national","competition","judging"]},{"org":"Technology Student Association","program":"Support a local TSA chapter","url":"https://tsaweb.org","category":"Mentoring","audience":"High school (9-12)","format":"Hybrid","season":"Winter","window":"Chapter year runs with the school year; state conferences in spring","deadline":"6-8 weeks through a chapter advisor","applyType":"Email","applyNote":"Contact a chapter advisor at a school with TSA but no robotics team","hours":16,"reach":25,"effort":"Medium","impact":4,"notes":"TSA schools already have a STEM-committed advisor and students. It is the shortest path from 'school with nothing' to 'school with a team'.","tags":["national","chapters","teams"]},{"org":"SkillsUSA","program":"Support a local SkillsUSA chapter","url":"https://www.skillsusa.org","category":"Mentoring","audience":"High school (9-12)","format":"In person","season":"Winter","window":"Regional and state competitions February-April","deadline":"6-8 weeks","applyType":"Email","applyNote":"Contact a CTE instructor who advises a chapter at a nearby school","hours":14,"reach":30,"effort":"Medium","impact":4,"notes":"CTE programs have machine tools you may not. Partnerships here often run both directions -- you teach controls, they teach machining.","tags":["national","CTE","tools"]},{"org":"Project Lead The Way","program":"Partner with a PLTW school","url":"https://www.pltw.org","category":"Mentoring","audience":"Middle school (6-8)","format":"In person","season":"Fall","window":"School year; teacher training happens in summer","deadline":"6-10 weeks through the school","applyType":"Email","applyNote":"Find a PLTW school near you and email the engineering pathway teacher","hours":12,"reach":60,"effort":"Medium","impact":4,"notes":"PLTW teachers already run engineering curriculum and are usually short on real hardware. Offer to bring the robot to their classroom.","tags":["national","schools","curriculum"]},{"org":"REC Foundation","program":"Volunteer at a VEX event","url":"https://www.roboticseducation.org","category":"Volunteering","audience":"Middle school (6-8)","format":"In person","season":"Winter","window":"VEX season runs roughly May-April, events densest November-February","deadline":"4-6 weeks","applyType":"Portal","applyNote":"Register as a volunteer through RobotEvents and pick a local event","hours":10,"reach":150,"effort":"Low","impact":3,"notes":"Yes, it is a different program. Judges notice teams that help the whole robotics ecosystem rather than only their own league.","tags":["competition","cross-program"]},{"org":"AbleGamers","program":"Accessible gaming and adaptive controllers","url":"https://ablegamers.org","category":"Accessibility","audience":"All ages","format":"Hybrid","season":"Offseason","window":"Year-round","deadline":"Varies; equipment programs are rolling","applyType":"Web form","applyNote":"Read their guidance on accessible play, then contact them about local partnership options","hours":14,"reach":15,"effort":"High","impact":5,"notes":"Pair this with an adaptive-controller build. Their published design guidance keeps you from building something that looks helpful but does not fit anyone.","tags":["national","accessibility","builds"]},{"org":"American Library Association","program":"Find and pitch a public library","url":"https://www.ala.org","category":"Demo","audience":"All ages","format":"In person","season":"Offseason","window":"Year-round; Summer Reading programming June-August is the biggest opening","deadline":"4-6 weeks; summer programming is planned by February","applyType":"Email","applyNote":"Find your library system's branch list and email the Youth Services or Programming Librarian","hours":8,"reach":50,"effort":"Low","impact":4,"notes":"Libraries are the single most reliable yes on this whole board. Ask in January about summer and you will get a slot; ask in June and you will not.","tags":["libraries","reliable","summer"]},{"org":"Girlstart","program":"Girls in STEM programming and curriculum","url":"https://girlstart.org","category":"Equity","audience":"Elementary (K-5)","format":"Hybrid","season":"Winter","window":"Programs run through the school year; camps in summer","deadline":"Varies by program","applyType":"Web form","applyNote":"Contact them about program models and free activity resources you can adapt locally","hours":10,"reach":40,"effort":"Medium","impact":4,"notes":"Strongest in Texas but publishes activity designs any team can adapt. Credit them if you use their material.","tags":["equity","curriculum","texas"]},{"org":"Black Girls Code","program":"Support workshops and chapters","url":"https://wearebgc.org","category":"Equity","audience":"Middle school (6-8)","format":"Hybrid","season":"Offseason","window":"Workshops run through the year in chapter cities","deadline":"8-12 weeks","applyType":"Web form","applyNote":"Check whether they have a chapter in your city, then apply as a volunteer","hours":12,"reach":40,"effort":"Medium","impact":5,"notes":"Chapter cities only. If there is no chapter near you, the honest move is to partner with a local equivalent rather than claim a connection you do not have.","tags":["equity","chapters","workshops"]},{"org":"AmeriCorps","program":"Find service opportunities and partners","url":"https://americorps.gov","category":"Community Service","audience":"Adults","format":"Hybrid","season":"Offseason","window":"Year-round; service terms start in fall and summer","deadline":"Varies widely by program","applyType":"Web form","applyNote":"Use the site to find local service programs your team can support as volunteers","hours":10,"reach":40,"effort":"Low","impact":3,"notes":"More useful as a way to find organized local partners than as a place your students apply directly.","tags":["national","service","partners"]},{"org":"United Way","program":"Connect with local nonprofits","url":"https://www.unitedway.org","category":"Community Service","audience":"All ages","format":"In person","season":"Fall","window":"Year-round; Day of Caring events in September","deadline":"3-6 weeks; Day of Caring registration opens in summer","applyType":"Web form","applyNote":"Find your local United Way and ask their volunteer center for youth-appropriate projects","hours":10,"reach":50,"effort":"Low","impact":3,"notes":"Their volunteer center already knows which local nonprofits will say yes to a high school group. Ask them instead of guessing.","tags":["national","service","september"]},{"org":"Local library summer reading program","program":"Book a summer reading slot","url":"https://www.ala.org","category":"Demo","audience":"Elementary (K-5)","format":"In person","season":"Summer","window":"Programs run June-August; slots are assigned in late winter","deadline":"Ask in January or February -- by April the schedule is set","applyType":"Email","applyNote":"Email the Youth Services Librarian with a specific date range and a one-paragraph description","hours":8,"reach":55,"effort":"Low","impact":5,"notes":"Listed separately from the general library entry because the timing is completely different and teams miss it every single year.","tags":["libraries","summer","timing-critical"]},{"org":"FIRST","program":"Apply for the FIRST Impact Award","url":"https://www.firstinspires.org","category":"Fundraising","audience":"Adults","format":"Virtual","season":"Build season","window":"Submission window falls in the weeks after Kickoff in January","deadline":"Check the current season manual -- the deadline is in February and it is hard","applyType":"Portal","applyNote":"Submit the essay, executive summary and video through the FIRST dashboard","hours":20,"reach":0,"effort":"High","impact":5,"notes":"This is the award your outreach work is for. Write it from the log you kept all year, not from memory in February. Start the essay in November.","tags":["FIRST","award","deadline"]},{"org":"FIRST","program":"Find your local FIRST Program Delivery Partner","url":"https://www.firstinspires.org","category":"Mentoring","audience":"Adults","format":"Hybrid","season":"Fall","window":"Useful year-round; most valuable August-October","deadline":"None -- just email them","applyType":"Email","applyNote":"Find your state's Program Delivery Partner on the FIRST site and introduce your team","hours":2,"reach":5,"effort":"Low","impact":5,"notes":"One email. They know every school in your state that wants a team and has no one to help. This is the highest-leverage thirty minutes on this entire board.","tags":["FIRST","high-leverage","start-here"]},{"org":"STEM Learning Ecosystems","program":"Join a regional STEM ecosystem","url":"https://stemecosystems.org","category":"Community","audience":"All ages","format":"Hybrid","season":"Fall","window":"Ecosystems meet through the year; new members welcomed continuously","deadline":"Rolling","applyType":"Web form","applyNote":"Check whether your region has an ecosystem and ask to join the youth partner network","hours":8,"reach":100,"effort":"Low","impact":4,"notes":"A room with every STEM organization in your region in it. Joining once produces partner leads for years.","tags":["regional","partners","network"]}]};

const presetOn = new Set();
let query = "", mineOnly = false, sortBy = "fit", shown = 24;

const $ = s => document.querySelector(s);

function areaPass(o) {
  const a = store.area;
  if (o.region === "Nationwide") return true;   // runs everywhere, so it survives any area filter
  if (a.metro && o.area !== a.metro) return false;
  if (a.state && o.state !== a.state) return false;
  if (a.country && o.country !== a.country) return false;
  return true;
}
function passes(o, skip) {
  if (mineOnly && !store.status[o.id]) return false;
  if (!areaPass(o)) return false;
  if (query && !o.hay.includes(query)) return false;
  for (const k of presetOn) if (!PRESETS[k].test(o)) return false;
  for (const f of FACETS) {
    if (f.key === skip) continue;
    const s = sel[f.key];
    if (s.size && !s.has(o[f.key])) return false;
  }
  return true;
}
function results() {
  const cmp = {
    fit:    (a,b) => b.fit - a.fit,
    area:   (a,b) => (a.state||"ZZ").localeCompare(b.state||"ZZ") || a.area.localeCompare(b.area) || b.fit - a.fit,
    impact: (a,b) => b.impact - a.impact || b.fit - a.fit,
    effort: (a,b) => EFFORT_RANK[b.effort] - EFFORT_RANK[a.effort] || a.hours - b.hours,
    reach:  (a,b) => b.reach - a.reach,
    hours:  (a,b) => a.hours - b.hours,
  }[sortBy];
  return ALL.filter(o => passes(o, null)).sort(cmp);
}

/* ---------- area selector ---------- */

    const opts = [...counts.entries()].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0])));
    const open = f.expanded || opts.length <= 6;

/* ---------- the email, composed locally ---------- */
const AUD_PHRASE = { "All ages":"all ages", "Family":"families doing it together", "Adults":"adults",
  "Seniors":"seniors", "Elementary (K-5)":"elementary students", "Middle school (6-8)":"middle schoolers",
  "High school (9-12)":"high schoolers" };
const HOST_ASK = { "In person":"a room with tables and a power outlet, plus a rough idea of how many people to expect",
  "Virtual":"a video link and a rough headcount",
  "Hybrid":"either a room or a video link, plus a rough headcount" };
const inline = x => /^[A-Z][^A-Z]/.test(x) ? x[0].toLowerCase() + x.slice(1) : x;
const sig = t => `\n\nThank you for your time,\n\n[YOUR NAME]\nOutreach Lead, ${t}\n[EMAIL] · [PHONE]`;

function emailFor(o) {
  const team = store.team || "[TEAM NUMBER AND NAME]";
  const city = store.city || "[YOUR CITY]";
  const intro = `I'm a student on ${team}, a high school robotics team in ${city}. We compete in FIRST, and part of what our team does is bring hands-on engineering to people who don't otherwise get to see it up close.`;

  if (o.tier === "programme") return `Subject: ${team} — taking part in ${o.title}

Hi there,

I'm the outreach lead on ${team}, a high school FIRST robotics team in ${city}. I'm writing about ${o.title}.

${o.applyNote ? o.applyNote.replace(/^./, c => c.toUpperCase()) + "." : "I'd like to find out how a team like ours takes part."}

Three things I'd like to understand:

  • What you need from a student team before we can take part
  • Whether there's a deadline or window we should be working toward
  • Who locally we should be talking to, if it isn't you

We're planning roughly ${o.hours} hours of our season around this.${sig(team)}`;

  if (o.tier === "university") return `Subject: High school robotics team in ${o.city} — ${o.title}

Hi there,

${intro}

I'm writing to your K-12 outreach office because we'd like to work together on ${o.title.toLowerCase()}. We can bring students, mentors and our own equipment; what we don't have is your reach or your space.

Two ways this could work:

  • We run it, you host and publicise it to the schools you already work with
  • We join something you already run and supply the robotics half

It's about ${o.duration.toLowerCase()}, built for ${AUD_PHRASE[o.audience] || o.audience.toLowerCase()}, and there's no cost to you.

Would you be open to a short call?${sig(team)}`;

  const bring = o.bring.length ? o.bring.slice(0, 3).map(inline).join(", ")
    : "our robot and everything we need to run it";
  const when = o.window && o.window !== "Varies"
    ? ` We're aiming for ${o.window}, but tell us what works.` : "";
  return `Subject: Free from a local robotics team: ${o.title}

Hi ${o.role.split(" or ")[0]},

${intro}

I'd like to offer you something at no cost: ${o.title}. Here's what that looks like:

  • ${o.duration === "Varies" ? "Timing is flexible" : "About " + o.duration}, run by students with an adult mentor present
  • Built for ${AUD_PHRASE[o.audience] || o.audience.toLowerCase()}
  • We bring ${bring}
  • ${o.cost === "$0" ? "No cost to you" : "Materials run about " + o.cost + " — we cover that"}
  • All we need from you is ${HOST_ASK[o.format] || HOST_ASK["In person"]}

We're flexible on dates and can work around your schedule.${when}

Would you be open to a short call to see whether this fits what you already have planned?${sig(team)}`;
}

    o.cost, o.linkKind, o.link.url, o.link.what].map(cell).join(","))).join("\r\n");
  const name = ids.length ? "my-outreach-pipeline.csv" : "outreach-shortlist.csv";
  const dl = window.claude?.use ? await window.claude.use("downloads").catch(() => null) : null;
  if (dl) { try { await dl.save({ filename: name, data: csv }); return; } catch (e) { if (e?.code === "cancelled") return; } }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
});

/* ---------- ask claude ---------- */
const MODES = {
  find: { hint:"Claude answers from what it knows — it does not browse the web. Check every link opens.",
    ph:"Your team, your area and your limits. e.g. \"Team 4321 in Tacoma WA. Six students, no van, two free Saturdays before March. We want elementary kids and something an Impact Award judge would notice.\"" },
  draft: { hint:"Open a card and press “Rewrite with Claude”, or describe who you're writing to.",
    ph:"Anything specific for the email — a date you want, a past event to mention, who referred you." },
  plan: { hint:"Uses whatever you've saved to your pipeline, plus what you write here.",
    ph:"Your build season dates, how many students you can field, transport limits, when Impact is due." },
};
const ERRCOPY = { not_granted:"You turned the request down. Press Ask again to run it.",
  rate_limited:"Too many requests just now. Give it a minute.",
  prompt_too_large:"That's more text than one request can carry. Shorten it.",
  invalid_json:"The answer came back in a shape this page couldn't read. Ask again, more specifically.",
  refused:"Claude declined that one. Try rephrasing.", empty_completion:"Nothing came back. Ask again.",
  upstream_error:"The connection dropped partway. Ask again.",
  session_expired:"Your session expired. Reload the page.",
  sampling_disabled:"AI features are switched off for this view.",
  not_declared:"AI features aren't available on this copy of the page.",
  capability_disabled:"AI features are switched off for this view.",
  capability_removed:"AI features were switched off. Reload the page." };

const CATS = [...new Set(ALL.map(o => o.category))];
const AUDS = [...new Set(ALL.map(o => o.audience))];
const SEAS = [...new Set(ALL.map(o => o.season))];
const DIRS = DATA.finders.map(f => f[0]);
const DIR_URL = Object.fromEntries(DATA.finders.map(f => [f[0], { url:f[1], what:f[2], todo:f[3] }]));

let sample = null, mode = "find", ctl = null, aiTarget = null;
const out = () => $("#aiOut");
const setHint = () => { $("#aiHint").textContent = MODES[mode].hint; $("#aiIn").placeholder = MODES[mode].ph; };
setHint();

(async () => {
  if (!window.claude || typeof window.claude.use !== "function") {
    $("#aiState").textContent = "not available on this copy";
    $("#aiHint").textContent = "This page is running outside claude.ai, so it can't reach Claude. Everything else works; the published version has AI search on.";
    $("#aiGo").disabled = true; $("#aiGo").style.opacity = ".5"; return;
  }
  sample = await window.claude.use("sample").catch(() => null);
  if (sample) { $("#aiDot").classList.remove("off"); $("#aiState").textContent = "ready"; }
  else { $("#aiState").textContent = "not available in this view";
         $("#aiGo").disabled = true; $("#aiGo").style.opacity = ".5"; }
})();

$("#modes").addEventListener("click", e => {
  const b = e.target.closest("[data-mode]"); if (!b) return;
  mode = b.dataset.mode;
  [...$("#modes").children].forEach(x => x.setAttribute("aria-pressed", x === b));
  setHint(); out().innerHTML = "";
});
$("#aiStop").addEventListener("click", () => ctl?.abort());
$("#aiGo").addEventListener("click", () => run());
function aiDraftFor(id) {
  aiTarget = ALL.find(o => o.id === id); mode = "draft";
  [...$("#modes").children].forEach(x => x.setAttribute("aria-pressed", x.dataset.mode === "draft"));
  setHint(); $("#aiHint").textContent = "Rewriting for: " + aiTarget.title + " — " + aiTarget.host;
  $("#ask").scrollIntoView({ behavior:"smooth", block:"start" }); run();
}
function busy(on) { $("#aiGo").disabled = on; $("#aiStop").hidden = !on;
  $("#aiGo").textContent = on ? "Asking…" : "Ask"; }
const areaWord = () => { const a = store.area;
  return a.metro || a.state || a.country || "(they have not set an area — ask them for one)"; };

async function run() {
  if (!sample) return;
  const extra = $("#aiIn").value.trim();
  ctl = new AbortController(); busy(true);
  out().innerHTML = `<div class="think">Thinking</div>`;
  try {
    if (mode === "find") await runFind(extra);
    else if (mode === "draft") await runDraft(extra);
    else await runPlan(extra);
  } catch (e) {
    if (e?.code === "cancelled")
      out().innerHTML = `<div class="stream">${esc(e.text || "")}</div><div class="err">Stopped.</div>`;
    else out().innerHTML = (e?.text ? `<div class="stream">${esc(e.text)}</div>` : "")
      + `<div class="err">${esc(ERRCOPY[e?.code] || "Something went wrong. Ask again.")}</div>`;
  } finally { busy(false); ctl = null; }
}

async function runFind(extra) {
  const list = await sample.json(
    `A high school FIRST robotics team's outreach lead needs places to contact.\n\n` +
    `Their area: ${areaWord()}\nWhat they told you: ${extra || "(nothing else)"}\n\n` +
    `Reply with ONLY a JSON array of up to 10 objects, ordered by area then by usefulness, keys:\n` +
    `{"org": the organisation's name, "area": "City, ST" (use their area unless the organisation is national, then "Nationwide"), ` +
    `"site": the organisation's official website URL — ONLY if you are confident it is real and current, otherwise null, ` +
    `"directory": if "site" is null, exactly one label from ${JSON.stringify(DIRS)} that would find this organisation, otherwise null, ` +
    `"category": one of ${JSON.stringify(CATS)}, "audience": one of ${JSON.stringify(AUDS)}, ` +
    `"season": one of ${JSON.stringify(SEAS)}, "effort": "Low"|"Medium"|"High", ` +
    `"hours": integer, "reach": integer, "why": one sentence on why it fits this team, ` +
    `"how": one sentence naming the role to contact}\n\n` +
    `Rules: prefer organisations that really exist in their area. Never invent a URL, street address, ` +
    `phone number or staff member's name. If you are not certain a website URL is real, set "site" to null ` +
    `and pick a "directory" instead — that is always the better answer than a guess.`,
    { signal: ctl.signal, modelTier: "complex" });
  const arr = (Array.isArray(list) ? list : []).map(s => {
    const d = s.directory && DIR_URL[s.directory];
    const url = (typeof s.site === "string" && /^https?:\/\//.test(s.site)) ? s.site : (d ? d.url : null);
    return { ...s, url, kind: url && url === s.site ? "their site" : "directory",
             what: url === s.site ? "Website Claude supplied — check it opens." : (d ? d.what : "") };
  }).filter(s => s.url);
  if (!arr.length) { out().innerHTML = `<div class="err">Nothing usable came back. Set your area above and try again.</div>`; return; }
  const groups = {};
  arr.forEach(s => (groups[s.area || "Unspecified"] ||= []).push(s));
  out().innerHTML = `<div class="eyebrow">${arr.length} suggestions, grouped by area — Claude did not browse the web, so open each link before you rely on it</div>`
    + Object.keys(groups).sort().map(area => `<div class="areagrp">
      <h4>${esc(area)}<span>${groups[area].length}</span></h4>
      <div class="sugg">${groups[area].map(s => `<div class="scard">
        <h5>${esc(s.org || "Unnamed")}</h5>
        <p>${esc(s.why || "")}</p>
        <p style="margin-top:5px"><b>${esc(s.how || "")}</b></p>
        <div class="crow" style="padding:8px 0 0">
          ${s.category ? `<span class="chip">${esc(s.category)}</span>` : ""}
          ${s.season ? `<span class="chip">${esc(s.season)}</span>` : ""}
          ${s.effort ? `<span class="chip">${esc(s.effort)} effort</span>` : ""}
          ${s.hours ? `<span class="chip">${esc(s.hours)}h</span>` : ""}
        </div>
        <a class="link" style="margin:9px 0 0" href="${esc(s.url)}" target="_blank" rel="noopener">
          <span style="min-width:0"><span class="dom">${esc((s.url.match(/^https?:\/\/(?:www\.)?([^/]+)/)||[,s.url])[1])}</span>
          <span class="what">${esc(s.what)}</span></span>
          <span class="kind">${esc(s.kind)}</span>
          <svg class="go" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"></path></svg></a>
      </div>`).join("")}</div></div>`).join("");
}

async function runDraft(extra) {
  const o = aiTarget || current[0];
  const ta = o ? document.querySelector(`[data-draft="${o.id}"]`) : null;
  const base = ta ? ta.value : (o ? emailFor(o) : "");
  const box = document.createElement("div"); box.className = "stream";
  out().innerHTML = ""; out().appendChild(box);
  const { text } = await sample(
    `Rewrite this outreach email so a busy person says yes. Under 200 words, plain and specific, ` +
    `no corporate filler, no exclamation marks. Keep any [BRACKETED] placeholders exactly as they are. ` +
    `Return only the email, starting with the Subject line.\n\n` +
    (o ? `Context: a high school robotics team is proposing "${o.title}" to ${o.host}` +
         `${o.area && o.area !== "Nationwide" ? " in " + o.area : ""}. The reader is the ${o.role}.\n` : "") +
    (extra ? `The team adds: ${extra}\n` : "") + `\nCurrent draft:\n${base}`,
    { signal: ctl.signal, cache: false, onText: ({ text }) => { box.textContent = text; } });
  if (ta) { ta.value = text; ta.dataset.touched = "1";
    const b = document.createElement("div"); b.className = "eyebrow";
    b.style.marginTop = "8px"; b.textContent = "Put back into the email box on that card";
    out().appendChild(b); }
}

async function runPlan(extra) {
  const mine = ALL.filter(o => store.status[o.id]);
  const box = document.createElement("div"); box.className = "stream";
  out().innerHTML = ""; out().appendChild(box);
  await sample(
    `You are helping the outreach lead of a high school FIRST robotics team turn a shortlist into a season plan.\n\n` +
    `Their area: ${areaWord()}\n\n` +
    (mine.length ? `Their pipeline (${mine.length}):\n` + mine.slice(0, 40).map(o =>
        `- [${store.status[o.id]}] ${o.title} — ${o.host}, ${o.area} · ${o.season} · ${o.effort} effort · ~${o.hours}h · reaches ~${o.reach}`).join("\n")
      : `Their pipeline is empty. Use these strong starting options instead:\n` +
        current.slice(0, 12).map(o => `- ${o.title} — ${o.host}, ${o.area} · ${o.season} · ${o.effort} effort · ~${o.hours}h`).join("\n")) +
    `\n\nWhat they told you: ${extra || "(nothing extra)"}\n\n` +
    `Give them, in plain prose with short headed sections:\n` +
    `1. A month-by-month order of operations keyed to the FIRST calendar (Kickoff in January, ` +
    `competition February to April, offseason May to August, recruiting in the fall).\n` +
    `2. Which items to drop, and why — be blunt if they have taken on too much.\n` +
    `3. Three concrete actions for the next seven days.\n` +
    `4. What to write down as they go so the Impact Award submission writes itself in February.\n\n` +
    `Be specific and short. Never invent a URL, address, phone number or person's name.`,
    { signal: ctl.signal, modelTier: "complex", onText: ({ text }) => { box.textContent = text; } });
}

/* ---------- go ---------- */
const C = DATA.counts;
$("#tagline").textContent = C.total.toLocaleString() + " ways to get your robot in front of people — every one with a real link";
$("#linkNote").innerHTML = `<b>Every link goes somewhere real.</b> `
  + `${(C.verified + C.universities).toLocaleString()} cards link straight to the organisation's own site — `
  + `${C.verified} national programmes and ${DATA.unis.length} universities, whose addresses come from a public dataset of real institutions. `
  + `The other ${C.local.toLocaleString()} link to one of ${C.finders} official national directories — the government or trade-body page whose whole job is to hand you the local contact. `
  + `<b>There are no search-engine links anywhere on this board.</b> What no card can promise is that a slot is free: confirm every date before you promise it to your team.`;
$("#foot").innerHTML = `<b>${C.total.toLocaleString()} opportunities across ${C.metros} metro areas in ${C.states} states and provinces.</b> `
  + `Hours, reach and impact are planning estimates, not measurements — replace them with your real numbers as you go, `
  + `because those are the numbers a judge will ask you about. `
  + `Links were recorded from a public dataset and from known organisations; they could not be fetched to confirm they still resolve, so if one has moved, tell us and it gets fixed at the source. `
  + `Your area, pipeline and team details are saved in this browser only.`;
renderArea(); render();
</script>
