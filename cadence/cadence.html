/* ========================================================================
   css/base.css
   ======================================================================== */
/* Cadence — design tokens, reset and typography.
   One accent colour, a neutral scale, and generous but not wasteful spacing.
   Colour never carries meaning on its own; every state also has a label,
   an icon or a shape. */

:root {
  color-scheme: light;

  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --surface-3: #e7eaef;
  --border: #e2e5ea;
  --border-strong: #cbd1da;
  --text: #14161a;
  --text-2: #4c545f;
  --text-3: #78808d;
  --text-inverse: #ffffff;

  --accent: #4a63d8;
  --accent-strong: #3a51bd;
  --accent-soft: rgba(74, 99, 216, 0.1);
  --accent-text: #ffffff;

  --danger: #cc4038;
  --danger-soft: rgba(204, 64, 56, 0.1);
  --warn: #b3730f;
  --warn-soft: rgba(179, 115, 15, 0.12);
  --ok: #2f8256;
  --ok-soft: rgba(47, 130, 86, 0.12);

  --shadow-1: 0 1px 2px rgba(16, 18, 22, 0.05);
  --shadow-2: 0 4px 14px rgba(16, 18, 22, 0.08);
  --shadow-3: 0 18px 48px rgba(16, 18, 22, 0.16);

  --radius-sm: 5px;
  --radius: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-7: 32px;
  --sp-8: 44px;

  --sidebar-w: 232px;
  --dock-w: 260px;
  --topbar-h: 56px;

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
    Arial, "Noto Sans", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

  --fs-xs: 11px;
  --fs-sm: 12.5px;
  --fs-base: 14px;
  --fs-md: 15px;
  --fs-lg: 17px;
  --fs-xl: 21px;
  --fs-2xl: 27px;

  --speed: 140ms;
  --ease: cubic-bezier(0.2, 0, 0.13, 1);
}

[data-theme="dark"] {
  color-scheme: dark;

  --bg: #0f1114;
  --surface: #171a1e;
  --surface-2: #1d2126;
  --surface-3: #262b32;
  --border: #272c33;
  --border-strong: #3a4048;
  --text: #e9ebee;
  --text-2: #a9b1bc;
  --text-3: #79818d;
  --text-inverse: #14161a;

  --accent-soft: rgba(122, 143, 240, 0.16);
  --danger: #e2635a;
  --danger-soft: rgba(226, 99, 90, 0.14);
  --warn: #d99b3c;
  --warn-soft: rgba(217, 155, 60, 0.14);
  --ok: #4fb583;
  --ok-soft: rgba(79, 181, 131, 0.14);

  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-2: 0 4px 16px rgba(0, 0, 0, 0.45);
  --shadow-3: 0 22px 54px rgba(0, 0, 0, 0.6);
}

/* Accents */
[data-accent="indigo"] { --accent: #4a63d8; --accent-strong: #3a51bd; }
[data-accent="blue"]   { --accent: #2f7fd8; --accent-strong: #2568b4; }
[data-accent="teal"]   { --accent: #22887c; --accent-strong: #1b6f65; }
[data-accent="green"]  { --accent: #2f8c68; --accent-strong: #257356; }
[data-accent="amber"]  { --accent: #a9750f; --accent-strong: #8e610b; }
[data-accent="rose"]   { --accent: #b34a86; --accent-strong: #973c71; }
[data-accent="slate"]  { --accent: #56607a; --accent-strong: #444d63; }

[data-theme="dark"][data-accent="indigo"] { --accent: #7a8ff0; --accent-strong: #93a4f5; --accent-text: #10131c; }
[data-theme="dark"][data-accent="blue"]   { --accent: #62a6ee; --accent-strong: #7fb8f3; --accent-text: #0d1620; }
[data-theme="dark"][data-accent="teal"]   { --accent: #4cc0b0; --accent-strong: #6ad0c2; --accent-text: #0a1a18; }
[data-theme="dark"][data-accent="green"]  { --accent: #55c48f; --accent-strong: #71d3a3; --accent-text: #0a1a13; }
[data-theme="dark"][data-accent="amber"]  { --accent: #dda63f; --accent-strong: #e8b862; --accent-text: #1d1508; }
[data-theme="dark"][data-accent="rose"]   { --accent: #de7fb5; --accent-strong: #e89ac6; --accent-text: #1e0f18; }
[data-theme="dark"][data-accent="slate"]  { --accent: #98a3bd; --accent-strong: #adb6cc; --accent-text: #121620; }

/* Higher contrast: stronger borders and text, never a different meaning. */
.is-contrast {
  --border: var(--border-strong);
  --text-2: var(--text);
  --text-3: var(--text-2);
}
.is-contrast [data-theme="dark"] { --border: #4c525c; }

.is-large-text { --fs-xs: 12.5px; --fs-sm: 14px; --fs-base: 16px; --fs-md: 17px; --fs-lg: 19px; --fs-xl: 24px; --fs-2xl: 31px; }

*, *::before, *::after { box-sizing: border-box; }

html, body { height: 100%; }

html.is-locked { overflow: hidden; }

body {
  margin: 0;
  font-family: var(--font);
  font-size: var(--fs-base);
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

h1, h2, h3, h4, p, figure, dl, dd { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
}
button:disabled { cursor: not-allowed; opacity: 0.5; }

input, textarea, select { font: inherit; color: inherit; }

a { color: var(--accent); }

kbd {
  font-family: var(--font-mono);
  font-size: 0.85em;
  padding: 1px 5px;
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: 4px;
  background: var(--surface-2);
  color: var(--text-2);
  white-space: nowrap;
}

mark {
  background: var(--accent-soft);
  color: inherit;
  border-radius: 3px;
  padding: 0 1px;
  font-weight: 600;
}

svg.icon { display: block; flex: none; }

/* Focus: always visible, never only a colour change. */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  top: -60px;
  left: var(--sp-3);
  z-index: 200;
  padding: var(--sp-2) var(--sp-4);
  background: var(--accent);
  color: var(--accent-text);
  border-radius: var(--radius);
  transition: top var(--speed) var(--ease);
}
.skip-link:focus { top: var(--sp-3); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 8px;
  border: 3px solid var(--bg);
}
::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

::selection { background: var(--accent-soft); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}
.is-reduced-motion *, .is-reduced-motion *::before, .is-reduced-motion *::after {
  animation-duration: 0.001ms !important;
  transition-duration: 0.001ms !important;
}

/* Shared typography helpers */
.section-title {
  font-size: var(--fs-sm);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-3);
  margin: var(--sp-6) 0 var(--sp-3);
}
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-3);
}
.section-head .section-title { margin-bottom: var(--sp-3); }

.page__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--sp-4);
  flex-wrap: wrap;
  margin-bottom: var(--sp-5);
}
.page__title {
  font-size: var(--fs-2xl);
  font-weight: 650;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
}
.page__subtitle { color: var(--text-3); font-size: var(--fs-md); margin-top: 2px; }
.page__lead { color: var(--text-2); max-width: 62ch; margin-bottom: var(--sp-4); }
.page__head-actions { display: flex; gap: var(--sp-2); flex-wrap: wrap; }

.link {
  color: var(--accent);
  text-align: left;
  text-decoration: none;
  border-bottom: 1px solid transparent;
}
.link:hover { border-bottom-color: currentColor; }

.card__note {
  color: var(--text-3);
  font-size: var(--fs-sm);
  padding: var(--sp-3) 0;
}


/* ========================================================================
   css/layout.css
   ======================================================================== */
/* Cadence — the shell: sidebar, top bar, main column, task dock, mobile nav. */

.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
}
.has-dock .app { grid-template-columns: var(--sidebar-w) minmax(0, 1fr) var(--dock-w); }

/* ------------------------------------------------------------- sidebar */

.sidebar {
  grid-row: 1;
  border-right: 1px solid var(--border);
  background: var(--surface);
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: var(--sp-3) var(--sp-3) var(--sp-7);
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
}

.nav { display: flex; flex-direction: column; gap: 1px; }
.nav__item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: 7px var(--sp-3);
  border-radius: var(--radius);
  color: var(--text-2);
  font-size: var(--fs-base);
  text-align: left;
  transition: background var(--speed) var(--ease), color var(--speed) var(--ease);
}
.nav__item:hover { background: var(--surface-2); color: var(--text); }
.nav__item.is-active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav__item.is-active .nav__icon { color: var(--accent); }
.nav__icon { color: var(--text-3); display: flex; }
.nav__label { flex: 1; }
.nav__badge {
  min-width: 20px;
  padding: 0 6px;
  border-radius: 10px;
  background: var(--surface-3);
  color: var(--text-2);
  font-size: var(--fs-xs);
  font-weight: 600;
  text-align: center;
  line-height: 18px;
}
.nav__item.is-active .nav__badge { background: var(--accent); color: var(--accent-text); }

.sidebar__block { border-top: 1px solid var(--border); padding-top: var(--sp-4); }
.sidebar__title {
  font-size: var(--fs-xs);
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-3);
  margin: var(--sp-3) 0 var(--sp-2);
}
.sidebar__block:first-of-type .sidebar__title:first-child { margin-top: 0; }

.sidebar__actions { display: flex; flex-direction: column; gap: 2px; }
.sidebar__action {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: 6px var(--sp-3);
  border-radius: var(--radius);
  color: var(--text-2);
  font-size: var(--fs-sm);
  text-align: left;
}
.sidebar__action:hover { background: var(--surface-2); color: var(--text); }

.layer {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  padding: 5px var(--sp-3);
  border-radius: var(--radius);
  font-size: var(--fs-sm);
  color: var(--text-2);
  text-align: left;
}
.layer:hover { background: var(--surface-2); }
.layer__box {
  width: 15px; height: 15px;
  border-radius: 4px;
  border: 1.5px solid var(--border-strong);
  display: flex; align-items: center; justify-content: center;
  color: #fff;
  flex: none;
}
.layer.is-on .layer__box {
  background: var(--layer-color, var(--accent));
  border-color: var(--layer-color, var(--accent));
}
.layer:not(.is-on) .layer__label { color: var(--text-3); text-decoration: line-through; text-decoration-thickness: 1px; }

/* -------------------------------------------------------------- topbar */

.main { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }

.topbar {
  height: var(--topbar-h);
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: 0 var(--sp-4);
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.topbar__left { display: flex; align-items: center; gap: var(--sp-2); }
.topbar__menu { display: none; }
.topbar__brand {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  font-weight: 650;
  letter-spacing: -0.01em;
  padding: var(--sp-1) var(--sp-2);
  border-radius: var(--radius);
}
.topbar__brand:hover { background: var(--surface-2); }
.brand__mark {
  width: 26px; height: 26px;
  display: grid; place-items: center;
  border-radius: 7px;
  background: var(--accent);
  color: var(--accent-text);
}

.topbar__search {
  flex: 1;
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  height: 34px;
  padding: 0 var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-2);
  color: var(--text-3);
  font-size: var(--fs-sm);
  transition: border-color var(--speed) var(--ease);
}
.topbar__search:hover { border-color: var(--border-strong); }
.topbar__search-text { flex: 1; text-align: left; }
.topbar__kbd { font-size: var(--fs-xs); }

.topbar__actions { display: flex; align-items: center; gap: var(--sp-2); margin-left: auto; }

.view {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: var(--sp-6) var(--sp-7) var(--sp-8);
}
.view--calendar { padding: 0; display: flex; flex-direction: column; overflow: hidden; }

/* ---------------------------------------------------------------- dock */

.dock {
  border-left: 1px solid var(--border);
  background: var(--surface);
  overflow-y: auto;
  padding: var(--sp-4) var(--sp-3) var(--sp-7);
}
.dock[hidden] { display: none; }
.dock__head { display: flex; align-items: center; justify-content: space-between; }
.dock__title {
  font-size: var(--fs-xs);
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-3);
}
.dock__hint { font-size: var(--fs-xs); color: var(--text-3); margin: var(--sp-2) 0 var(--sp-3); }
.dock__list { display: flex; flex-direction: column; gap: var(--sp-2); }
.dock__task {
  padding: var(--sp-2) var(--sp-3);
  border: 1px solid var(--border);
  border-left: 3px solid var(--task-color, var(--accent));
  border-radius: var(--radius);
  background: var(--surface);
  cursor: grab;
  display: flex;
  flex-direction: column;
  gap: 2px;
  transition: box-shadow var(--speed) var(--ease), transform var(--speed) var(--ease);
}
.dock__task:hover { box-shadow: var(--shadow-1); transform: translateY(-1px); }
.dock__task.is-dragging-src { opacity: 0.35; }
.dock__task-title { font-size: var(--fs-sm); font-weight: 550; }
.dock__task-meta { font-size: var(--fs-xs); color: var(--text-3); }

/* ---------------------------------------------------------- mobile nav */

.mobilenav { display: none; }
.fab { display: none; }

@media (max-width: 1179px) {
  .has-dock .app { grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
  .dock { display: none; }
}

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: 264px;
    z-index: 60;
    transform: translateX(-100%);
    transition: transform 180ms var(--ease);
    box-shadow: var(--shadow-3);
  }
  .nav-open .sidebar { transform: none; }
  .nav-open::after {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.35);
    z-index: 55;
  }
  .topbar__menu { display: inline-flex; }
  .topbar__search-text { display: none; }
  .topbar__search { max-width: none; flex: 0 0 34px; padding: 0; justify-content: center; }
  .topbar__kbd { display: none; }
  .topbar__label { display: none; }
  .topbar__whatnow { display: none; }
  .topbar__undo { display: none; }
  .view { padding: var(--sp-4) var(--sp-4) 96px; }

  .mobilenav {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    position: fixed;
    inset: auto 0 0 0;
    z-index: 50;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .mobilenav__item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 8px 0 6px;
    color: var(--text-3);
    font-size: 10.5px;
  }
  .mobilenav__item.is-active { color: var(--accent); }
  .mobilenav__icon { display: flex; }

  .fab {
    display: grid;
    place-items: center;
    position: fixed;
    right: 18px;
    bottom: calc(66px + env(safe-area-inset-bottom));
    z-index: 51;
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-text);
    box-shadow: var(--shadow-2);
  }
  .fab:active { transform: scale(0.94); }
}

@media (max-width: 620px) {
  .brand__name { display: none; }
  .page__head { flex-direction: column; align-items: stretch; }
  .page__head-actions .btn { flex: 1; justify-content: center; }
}


/* ========================================================================
   css/components.css
   ======================================================================== */
/* Cadence — buttons, inputs, chips, cards, dialogs, menus, toasts, charts. */

/* ------------------------------------------------------------- buttons */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 34px;
  padding: 0 var(--sp-4);
  border-radius: var(--radius);
  border: 1px solid transparent;
  font-size: var(--fs-sm);
  font-weight: 550;
  white-space: nowrap;
  transition: background var(--speed) var(--ease), border-color var(--speed) var(--ease),
    color var(--speed) var(--ease), transform var(--speed) var(--ease);
}
.btn:active { transform: translateY(0.5px); }
.btn--sm { height: 28px; padding: 0 var(--sp-3); font-size: var(--fs-sm); }
.btn--primary { background: var(--accent); color: var(--accent-text); }
.btn--primary:hover { background: var(--accent-strong); }
.btn--ghost { background: var(--surface); border-color: var(--border); color: var(--text-2); }
.btn--ghost:hover { background: var(--surface-2); color: var(--text); border-color: var(--border-strong); }
.btn--danger { background: var(--danger); color: #fff; }
.btn--danger:hover { filter: brightness(1.08); }
.btn--danger-text { color: var(--danger); }
.btn--danger-text:hover { background: var(--danger-soft); color: var(--danger); }
.btn__kbd { margin-left: 4px; opacity: 0.75; border: none; background: none; }

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px; height: 32px;
  border-radius: var(--radius);
  color: var(--text-3);
  transition: background var(--speed) var(--ease), color var(--speed) var(--ease);
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn.is-active { color: var(--accent); }

/* --------------------------------------------------------------- chips */

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 26px;
  padding: 0 10px;
  border-radius: 13px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
  font-size: var(--fs-sm);
  transition: background var(--speed) var(--ease), border-color var(--speed) var(--ease);
}
.chip:hover { border-color: var(--border-strong); color: var(--text); }
.chip[aria-pressed="true"] {
  background: var(--accent-soft);
  border-color: transparent;
  color: var(--accent);
  font-weight: 600;
}
.chip__count { font-size: var(--fs-xs); color: var(--text-3); }
.chip--clear { border-style: dashed; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.chip-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.chip-group__label {
  font-size: var(--fs-xs);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-3);
  margin-right: 2px;
}

/* --------------------------------------------------------------- forms */

.field { margin-bottom: var(--sp-4); }
.field--inline { display: flex; align-items: center; gap: var(--sp-3); }
.field__label {
  display: block;
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--text-2);
  margin-bottom: 5px;
}
.field__hint { font-size: var(--fs-sm); color: var(--text-3); margin-top: 5px; }
.field--title { margin-bottom: var(--sp-3); }

.input {
  width: 100%;
  height: 36px;
  padding: 0 var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  transition: border-color var(--speed) var(--ease), box-shadow var(--speed) var(--ease);
}
.input:hover { border-color: var(--border-strong); }
.input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
  outline: none;
}
.input::placeholder { color: var(--text-3); }
.input--area { height: auto; min-height: 68px; padding: var(--sp-2) var(--sp-3); resize: vertical; line-height: 1.55; }
.input--num { width: 84px; }
.input--date, .input--time { width: auto; min-width: 128px; }
.input--time { min-width: 108px; }
.input--select { appearance: none; padding-right: 30px;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 15px) 15px, calc(100% - 10px) 15px;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
}
.input--title {
  height: 42px;
  font-size: var(--fs-lg);
  font-weight: 600;
  border-color: transparent;
  background: var(--surface-2);
  padding: 0 var(--sp-3);
}
.input--title:focus { background: var(--surface); }

.inline-num { display: flex; align-items: center; gap: var(--sp-2); color: var(--text-2); font-size: var(--fs-sm); }
.when__inputs { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
.when__dash { color: var(--text-3); }
.when-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); margin-bottom: var(--sp-2); }
.when-grid__cell { display: flex; flex-direction: column; gap: 5px; }
.when__label { font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); }
.when__meta { font-size: var(--fs-sm); color: var(--text-3); margin-bottom: var(--sp-4); min-height: 18px; }
.when__duration.is-error { color: var(--danger); font-weight: 600; }

.checkline { display: inline-flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-base); cursor: pointer; }

.toggle {
  width: 38px; height: 22px;
  border-radius: 11px;
  background: var(--surface-3);
  border: 1px solid var(--border);
  position: relative;
  flex: none;
  transition: background var(--speed) var(--ease), border-color var(--speed) var(--ease);
}
.toggle__knob {
  position: absolute;
  top: 2px; left: 2px;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--surface);
  box-shadow: var(--shadow-1);
  transition: transform var(--speed) var(--ease);
}
.toggle[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.toggle[aria-checked="true"] .toggle__knob { transform: translateX(16px); background: #fff; }

.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-4);
  padding: var(--sp-3) 0;
  border-bottom: 1px solid var(--border);
}
.toggle-row:last-child { border-bottom: none; }
.toggle-row__text { display: flex; flex-direction: column; gap: 2px; }
.toggle-row__label { font-weight: 550; }
.toggle-row__hint { font-size: var(--fs-sm); color: var(--text-3); }

.segmented {
  display: inline-flex;
  padding: 2px;
  border-radius: var(--radius);
  background: var(--surface-2);
  border: 1px solid var(--border);
  gap: 2px;
}
.segmented__btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 28px;
  padding: 0 var(--sp-3);
  border-radius: 6px;
  font-size: var(--fs-sm);
  color: var(--text-2);
  white-space: nowrap;
  transition: background var(--speed) var(--ease), color var(--speed) var(--ease);
}
.segmented__btn:hover { color: var(--text); }
.segmented__btn[aria-checked="true"] {
  background: var(--surface);
  color: var(--text);
  font-weight: 600;
  box-shadow: var(--shadow-1);
}

.check {
  width: 19px; height: 19px;
  flex: none;
  border-radius: 5px;
  border: 1.5px solid var(--border-strong);
  display: grid;
  place-items: center;
  color: #fff;
  transition: background var(--speed) var(--ease), border-color var(--speed) var(--ease), transform var(--speed) var(--ease);
}
.check:hover { border-color: var(--check-color, var(--accent)); }
.check[aria-checked="true"] {
  background: var(--check-color, var(--accent));
  border-color: var(--check-color, var(--accent));
  animation: pop 200ms var(--ease);
}
.check--sm { width: 16px; height: 16px; border-radius: 4px; }
@keyframes pop { 0% { transform: scale(0.8); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }

.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.swatch {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 2px solid transparent;
  display: grid; place-items: center;
  color: #fff;
}
.swatch[aria-checked="true"] { border-color: var(--text); }
.swatch--auto {
  background: var(--surface-2);
  border: 1px dashed var(--border-strong);
  color: var(--text-3);
  width: auto; padding: 0 10px; border-radius: 13px;
  font-size: var(--fs-xs);
}

.tags-input {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  padding: 6px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  min-height: 36px;
}
.tags-input:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tags-input__list { display: contents; }
.tags-input__field { flex: 1; min-width: 110px; border: none; outline: none; background: none; height: 22px; }
.tag-chip, .reminder-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 24px;
  padding: 0 4px 0 9px;
  border-radius: 12px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  font-size: var(--fs-sm);
  color: var(--text-2);
}
.tag-chip__x {
  display: grid; place-items: center;
  width: 17px; height: 17px;
  border-radius: 50%;
  color: var(--text-3);
}
.tag-chip__x:hover { background: var(--surface-3); color: var(--text); }
.reminders__list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--sp-2); }
.reminders__empty { font-size: var(--fs-sm); color: var(--text-3); }

.duration { display: flex; flex-direction: column; gap: var(--sp-2); }
.duration__custom-wrap { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-sm); color: var(--text-3); }
.duration__custom { width: 76px; }

.recur { display: flex; flex-direction: column; gap: var(--sp-2); }
.recur__adv {
  display: flex; flex-direction: column; gap: var(--sp-2);
  padding: var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-2);
}
.recur__row { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
.recur__lead { font-size: var(--fs-sm); color: var(--text-2); }
.recur__days { display: flex; gap: 4px; flex-wrap: wrap; }
.recur__day {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: var(--fs-sm);
  color: var(--text-2);
}
.recur__day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.recur__count { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-sm); color: var(--text-2); }
.recur__end-extra { display: flex; align-items: center; }

.attachments__list { display: flex; flex-direction: column; gap: 4px; margin-bottom: var(--sp-2); }
.attachment {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: 5px var(--sp-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: var(--fs-sm);
  background: var(--surface-2);
}
.attachment__name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); text-decoration: none; }
.attachment__size { font-size: var(--fs-xs); color: var(--text-3); }
.attachments__actions { display: flex; gap: var(--sp-2); }

.participants__list { display: flex; flex-direction: column; gap: 4px; margin-bottom: var(--sp-2); }
.participant { display: flex; align-items: center; gap: var(--sp-2); }
.participant__name { flex: 1; font-size: var(--fs-sm); }
.participants__rsvp { width: auto; height: 28px; font-size: var(--fs-sm); }
.avatar {
  width: 24px; height: 24px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: var(--fs-xs);
  font-weight: 700;
  flex: none;
}

.subtasks__list { display: flex; flex-direction: column; gap: 2px; margin-bottom: var(--sp-2); }
.subtask { display: flex; align-items: center; gap: var(--sp-2); }
.subtask__input {
  flex: 1;
  border: none;
  background: none;
  outline: none;
  height: 30px;
  border-bottom: 1px solid transparent;
}
.subtask__input:focus { border-bottom-color: var(--border); }
.subtask.is-done .subtask__input { color: var(--text-3); text-decoration: line-through; }
.milestone__num {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--surface-2);
  color: var(--text-3);
  font-size: var(--fs-xs);
  display: grid; place-items: center;
  flex: none;
}

.disclosure { border-top: 1px solid var(--border); margin-top: var(--sp-4); }
.disclosure__toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: var(--sp-3) 0;
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--text-2);
}
.disclosure__toggle:hover { color: var(--text); }
.disclosure__chev { color: var(--text-3); display: flex; }
.disclosure__body { padding-bottom: var(--sp-3); }

.editor__grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
@media (max-width: 560px) {
  .editor__grid, .when-grid { grid-template-columns: 1fr; }
}

/* ------------------------------------------------------------- dialogs */

.backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(12, 14, 18, 0.42);
  backdrop-filter: blur(2px);
  display: grid;
  place-items: center;
  padding: var(--sp-5);
  animation: fade 160ms var(--ease);
}
.backdrop.is-leaving { animation: fadeOut 160ms var(--ease) forwards; }
.backdrop--sheet { place-items: stretch; justify-content: flex-end; padding: 0; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; } }

.dialog {
  width: 100%;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-3);
  overflow: hidden;
  animation: rise 180ms var(--ease);
}
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(0.99); } to { opacity: 1; transform: none; } }
.dialog--sm { max-width: 440px; }
.dialog--md { max-width: 620px; }
.dialog--lg { max-width: 840px; }
.dialog--xl { max-width: 1040px; }

.dialog__head {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-3);
  padding: var(--sp-5) var(--sp-5) var(--sp-3);
}
.dialog__titles { flex: 1; }
.dialog__title { font-size: var(--fs-lg); font-weight: 650; letter-spacing: -0.01em; }
.dialog__subtitle { font-size: var(--fs-sm); color: var(--text-3); margin-top: 2px; }
.dialog__close { margin: -4px -4px 0 0; }
.dialog__body { padding: 0 var(--sp-5) var(--sp-5); overflow-y: auto; flex: 1; }
.dialog__foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-5);
  border-top: 1px solid var(--border);
  background: var(--surface-2);
}
.confirm__msg { color: var(--text-2); }

/* Drawer on desktop, bottom sheet on mobile. */
.sheet {
  width: min(560px, 100%);
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-left: 1px solid var(--border);
  box-shadow: var(--shadow-3);
  animation: slideIn 200ms var(--ease);
}
@keyframes slideIn { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet__head {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-3);
  padding: var(--sp-5) var(--sp-5) var(--sp-3);
  border-bottom: 1px solid var(--border);
}
.sheet__grip { display: none; }
.sheet__titles { flex: 1; }
.sheet__title { font-size: var(--fs-lg); font-weight: 650; }
.sheet__subtitle { font-size: var(--fs-sm); color: var(--text-3); margin-top: 2px; }
.sheet__body { flex: 1; overflow-y: auto; padding: var(--sp-5); }
.sheet__foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-5);
  border-top: 1px solid var(--border);
  background: var(--surface-2);
}
.sheet__foot-left, .sheet__foot-right { display: flex; align-items: center; gap: var(--sp-2); }

@media (max-width: 700px) {
  .backdrop--sheet { align-items: flex-end; }
  .sheet {
    width: 100%;
    height: auto;
    max-height: 92vh;
    border-left: none;
    border-top-left-radius: var(--radius-xl);
    border-top-right-radius: var(--radius-xl);
    animation: slideUp 200ms var(--ease);
  }
  @keyframes slideUp { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet__grip {
    display: block;
    position: absolute;
    top: 8px; left: 50%;
    transform: translateX(-50%);
    width: 36px; height: 4px;
    border-radius: 2px;
    background: var(--border-strong);
  }
  .sheet__head { padding-top: var(--sp-6); }
  .dialog { max-height: 92vh; }
  .backdrop { padding: var(--sp-3); align-items: flex-end; }
}

.scope-choices { display: flex; flex-direction: column; gap: var(--sp-2); }
.scope-choice {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: var(--sp-3) var(--sp-4);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  text-align: left;
  transition: border-color var(--speed) var(--ease), background var(--speed) var(--ease);
}
.scope-choice:hover { border-color: var(--accent); background: var(--accent-soft); }
.scope-choice__label { font-weight: 600; }
.scope-choice__hint { font-size: var(--fs-sm); color: var(--text-3); }

/* --------------------------------------------------------------- menus */

.menu-scrim { position: fixed; inset: 0; z-index: 120; }
.menu {
  position: fixed;
  z-index: 121;
  min-width: 208px;
  max-width: 320px;
  padding: var(--sp-1);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-3);
  animation: rise 120ms var(--ease);
}
.menu__item {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  width: 100%;
  padding: 7px var(--sp-2);
  border-radius: var(--radius-sm);
  font-size: var(--fs-sm);
  color: var(--text-2);
  text-align: left;
}
.menu__item:hover { background: var(--surface-2); color: var(--text); }
.menu__item.is-danger { color: var(--danger); }
.menu__item.is-danger:hover { background: var(--danger-soft); }
.menu__icon { width: 18px; display: flex; justify-content: center; color: var(--text-3); flex: none; }
.menu__item:hover .menu__icon { color: inherit; }
.menu__label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu__kbd { font-size: var(--fs-xs); }
.menu__sep { height: 1px; background: var(--border); margin: var(--sp-1) 0; }
.menu__heading {
  padding: 6px var(--sp-2) 3px;
  font-size: var(--fs-xs);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-3);
}

/* -------------------------------------------------------------- toasts */

.toast-stack {
  position: fixed;
  left: var(--sp-5);
  bottom: var(--sp-5);
  z-index: 150;
  display: flex;
  flex-direction: column-reverse;
  gap: var(--sp-2);
  max-width: min(420px, calc(100vw - 40px));
}
.toast {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-3) var(--sp-3) var(--sp-4);
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-2);
  font-size: var(--fs-sm);
  transition: opacity 180ms var(--ease), transform 180ms var(--ease);
}
.toast--enter { opacity: 0; transform: translateY(8px); }
.toast--leave { opacity: 0; transform: translateY(6px); }
.toast--warn { border-left-color: var(--warn); }
.toast__msg { flex: 1; }
.toast__actions { display: flex; gap: var(--sp-1); }
.toast__action {
  padding: 3px 9px;
  border-radius: var(--radius-sm);
  font-weight: 600;
  color: var(--accent);
}
.toast__action:hover { background: var(--accent-soft); }
.toast__close { width: 26px; height: 26px; }

@media (max-width: 900px) {
  .toast-stack { left: var(--sp-3); right: var(--sp-3); bottom: calc(74px + env(safe-area-inset-bottom)); max-width: none; }
}

/* ---------------------------------------------------------- empty state */

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: var(--sp-2);
  padding: var(--sp-7) var(--sp-4);
  color: var(--text-3);
}
.empty__icon {
  width: 46px; height: 46px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--surface-2);
  color: var(--text-3);
  margin-bottom: var(--sp-1);
}
.empty__title { font-size: var(--fs-md); font-weight: 600; color: var(--text); }
.empty__body { max-width: 46ch; font-size: var(--fs-sm); }
.empty__actions { display: flex; gap: var(--sp-2); margin-top: var(--sp-3); flex-wrap: wrap; justify-content: center; }

/* ------------------------------------------------------------- notices */

.notice {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--radius);
  font-size: var(--fs-sm);
  margin-bottom: var(--sp-3);
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-2);
}
.notice--warn { background: var(--warn-soft); border-color: transparent; color: var(--text); }
.notice--info { background: var(--accent-soft); border-color: transparent; color: var(--text); }
.notice .btn { margin-left: auto; }

/* ------------------------------------------------------------ progress */

.progress {
  position: relative;
  height: 6px;
  border-radius: 3px;
  background: var(--surface-3);
  overflow: hidden;
  margin: var(--sp-2) 0;
}
.progress__fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; transition: width 260ms var(--ease); }
.progress__label { position: absolute; inset: 0; opacity: 0; }

.ring__track { stroke: var(--surface-3); }
.ring__bar { stroke: var(--accent); transition: stroke-dashoffset 320ms var(--ease); }
.ring__text { fill: var(--text); font-size: 19px; font-weight: 650; }

/* -------------------------------------------------------------- charts */

.barchart { display: flex; flex-direction: column; gap: 7px; }
.barchart__row { display: grid; grid-template-columns: minmax(90px, 150px) 1fr auto; align-items: center; gap: var(--sp-3); }
.barchart__label { font-size: var(--fs-sm); color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barchart__track { height: 9px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.barchart__bar { display: block; height: 100%; border-radius: 5px; background: var(--accent); transition: width 260ms var(--ease); }
.barchart__value { font-size: var(--fs-sm); color: var(--text-3); min-width: 62px; text-align: right; }

.sparkline { display: flex; align-items: flex-end; gap: var(--sp-2); height: 130px; padding-top: var(--sp-3); }
.sparkline__col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; }
.sparkline__value { font-size: var(--fs-xs); color: var(--text-3); }
.sparkline__bar { width: 100%; max-width: 40px; border-radius: 4px 4px 0 0; background: var(--accent-soft); border-top: 2px solid var(--accent); }
.sparkline__label { font-size: var(--fs-xs); color: var(--text-3); white-space: nowrap; }

.statcard {
  padding: var(--sp-3) var(--sp-4);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  display: flex; flex-direction: column; gap: 2px;
}
.statcard__value { font-size: var(--fs-xl); font-weight: 650; letter-spacing: -0.02em; }
.statcard__label { font-size: var(--fs-sm); color: var(--text-3); }

.statblock { display: flex; flex-direction: column; gap: 2px; }
.statblock__value { font-size: var(--fs-xl); font-weight: 650; letter-spacing: -0.02em; }
.statblock__label { font-size: var(--fs-sm); color: var(--text-3); }

/* ------------------------------------------------------- drag feedback */

.is-dragging, .is-dragging * { cursor: grabbing !important; user-select: none !important; }
.drag-ghost {
  position: fixed;
  top: 0; left: 0;
  z-index: 200;
  pointer-events: none;
  display: flex;
  align-items: center;
  gap: 6px;
  max-width: 260px;
  padding: 5px 10px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  box-shadow: var(--shadow-2);
  font-size: var(--fs-sm);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.drag-ghost__dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }


/* ========================================================================
   css/calendar.css
   ======================================================================== */
/* Cadence — calendar surfaces: time grid, month, year, agenda, timeline, mini. */

.cal__toolbar {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-4);
  padding: var(--sp-3) var(--sp-5);
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.cal__toolbar-left { display: flex; align-items: center; gap: var(--sp-3); min-width: 0; }
.cal__toolbar-right { display: flex; align-items: center; gap: var(--sp-2); }
.cal__nav { display: flex; align-items: center; gap: var(--sp-1); }
.cal__today { margin-right: var(--sp-1); }
.cal__title {
  font-size: var(--fs-lg);
  font-weight: 650;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: baseline;
  gap: var(--sp-2);
}
.cal__week-no { font-size: var(--fs-sm); font-weight: 500; color: var(--text-3); }
.cal__views .seg-short { display: none; }
.cal__body { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }

@media (max-width: 1080px) {
  .cal__views .seg-full { display: none; }
  .cal__views .seg-short { display: inline; }
}
@media (max-width: 900px) {
  .cal__toolbar { padding: var(--sp-2) var(--sp-3); flex-wrap: wrap; }
  .cal__title { font-size: var(--fs-md); }
  .cal__views { overflow-x: auto; max-width: 100%; }
}

/* ----------------------------------------------------------- time grid */

.tg { display: flex; flex-direction: column; height: 100%; min-height: 0; --gutter: 62px; }

.tg__header {
  display: flex;
  flex: none;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.tg__gutter-head { width: var(--gutter); flex: none; display: grid; place-items: center; }
.tg__weekno { font-size: var(--fs-xs); color: var(--text-3); }
.tg__head-cols { flex: 1; display: flex; }
.tg__head-col {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  padding: var(--sp-2) 0;
  border-left: 1px solid var(--border);
  color: var(--text-3);
}
.tg__head-col:hover { background: var(--surface-2); }
.tg__head-dow { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.06em; }
.tg__head-num { font-size: var(--fs-lg); font-weight: 600; color: var(--text); }
.tg__head-col.is-today .tg__head-dow { color: var(--accent); }
.tg__head-col.is-today .tg__head-num {
  background: var(--accent);
  color: var(--accent-text);
  width: 30px; height: 30px;
  border-radius: 50%;
  display: grid; place-items: center;
}

.tg__allday {
  display: flex;
  flex: none;
  max-height: 96px;
  overflow-y: auto;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.tg__allday.is-empty { max-height: 0; border-bottom-color: transparent; overflow: hidden; }
.tg__gutter-allday {
  width: var(--gutter);
  flex: none;
  padding: 6px var(--sp-2) 0 0;
  text-align: right;
  font-size: var(--fs-xs);
  color: var(--text-3);
}
.tg__allday-grid {
  flex: 1;
  display: grid;
  grid-auto-rows: 22px;
  gap: 2px;
  padding: 4px 2px;
}
.allday-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 0 7px;
  border-radius: var(--radius-sm);
  border-left: 3px solid currentColor;
  font-size: var(--fs-sm);
  color: var(--text);
  overflow: hidden;
  min-width: 0;
}
.allday-chip__dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.allday-chip__title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.allday-chip--deadline {
  background: var(--surface-2);
  border-left-color: var(--warn);
  color: var(--text);
  font-weight: 550;
}
.allday-chip--deadline.is-overdue, .allday-chip--deadline.is-today { border-left-color: var(--danger); background: var(--danger-soft); }
.allday-chip--deadline.is-tomorrow, .allday-chip--deadline.is-soon { background: var(--warn-soft); }

.tg__scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; position: relative; }
.tg__grid { display: flex; position: relative; }
.tg__times { width: var(--gutter); flex: none; }
.tg__time { position: relative; }
.tg__time span {
  position: absolute;
  top: -8px; right: var(--sp-2);
  font-size: var(--fs-xs);
  color: var(--text-3);
  background: var(--bg);
  padding-left: 3px;
}
.tg__time:first-child span { top: 0; }

.tg__cols { flex: 1; display: flex; position: relative; }
.tg__col {
  flex: 1;
  min-width: 0;
  position: relative;
  border-left: 1px solid var(--border);
}
.tg__col.is-today { background: color-mix(in srgb, var(--accent) 3%, transparent); }
.tg__work { position: absolute; left: 0; right: 0; background: var(--surface); pointer-events: none; }
[data-theme="dark"] .tg__work { background: rgba(255, 255, 255, 0.022); }
.tg__lines { position: absolute; inset: 0; pointer-events: none; }
.tg__line { border-top: 1px solid var(--border); }
.tg__line:first-child { border-top-color: transparent; }

.tg__now { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid var(--danger); z-index: 6; pointer-events: none; }
.tg__now-dot {
  position: absolute;
  left: -4px; top: -5px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--danger);
}

.tg__select {
  position: absolute;
  left: 2px; right: 4px;
  border-radius: var(--radius-sm);
  background: var(--accent-soft);
  border: 1.5px dashed var(--accent);
  color: var(--accent);
  font-size: var(--fs-xs);
  padding: 2px 5px;
  z-index: 7;
  pointer-events: none;
}

/* --------------------------------------------------------------- event */

.ev {
  position: absolute;
  border-radius: var(--radius-sm);
  border-left: 3px solid var(--ev-color, var(--accent));
  padding: 3px 6px;
  overflow: hidden;
  cursor: grab;
  z-index: 3;
  transition: box-shadow var(--speed) var(--ease), transform var(--speed) var(--ease), opacity var(--speed) var(--ease);
}
.ev:hover { box-shadow: var(--shadow-2); z-index: 8; }
.ev:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; z-index: 9; }
.ev.is-selected { box-shadow: 0 0 0 2px var(--accent); z-index: 9; }
.ev.is-dragging-src { opacity: 0.3; }
.ev.is-resizing { z-index: 10; box-shadow: var(--shadow-2); }
.ev.is-done { opacity: 0.6; }
.ev.is-done .ev__title { text-decoration: line-through; }
.ev.is-block { border-left-style: double; border-left-width: 5px; }
.ev.is-conflict { box-shadow: inset 0 0 0 1.5px var(--danger); }

.ev__body { display: flex; flex-direction: column; gap: 0; min-width: 0; height: 100%; }
.ev__title {
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--text);
  line-height: 1.25;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  display: flex;
  align-items: center;
  gap: 4px;
}
.ev__time, .ev__loc { font-size: var(--fs-xs); color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev__loc { display: flex; align-items: center; gap: 3px; }
.ev.is-short { padding: 1px 6px; display: flex; align-items: center; }
.ev.is-short .ev__body { flex-direction: row; align-items: center; gap: 5px; }
.ev.is-short .ev__title { -webkit-line-clamp: 1; }

.ev__badges { position: absolute; top: 3px; right: 4px; display: flex; gap: 3px; }
.ev__badge { color: var(--text-3); display: flex; }
.ev.is-conflict .ev__badge:last-child { color: var(--danger); }

.ev__resize {
  position: absolute;
  left: 0; right: 0;
  height: 7px;
  cursor: ns-resize;
  z-index: 4;
}
.ev__resize--top { top: -2px; }
.ev__resize--bottom { bottom: -2px; }
.ev:hover .ev__resize::after {
  content: "";
  position: absolute;
  left: 50%; transform: translateX(-50%);
  width: 22px; height: 3px;
  border-radius: 2px;
  background: var(--ev-color, var(--accent));
  opacity: 0.6;
}
.ev__resize--top::after { top: 1px; }
.ev__resize--bottom::after { bottom: 1px; }
.ev__resize-label {
  position: absolute;
  right: 5px; bottom: 3px;
  font-size: var(--fs-xs);
  font-weight: 600;
  background: var(--surface);
  border-radius: 4px;
  padding: 0 5px;
  border: 1px solid var(--border);
}

.ev__travel {
  position: absolute;
  left: -3px; right: 0;
  background: repeating-linear-gradient(45deg,
    color-mix(in srgb, var(--ev-color) 22%, transparent) 0 4px,
    transparent 4px 8px);
  border-left: 3px dotted var(--ev-color);
  pointer-events: none;
  border-radius: 2px;
}

.ev--habit { border-left-style: dashed; }
.ev--habit.is-done .ev__title { text-decoration: none; opacity: 0.75; }

.ev-preview {
  position: absolute;
  left: 2px; right: 6px;
  border-radius: var(--radius-sm);
  background: var(--accent-soft);
  border: 1.5px solid var(--accent);
  color: var(--accent);
  padding: 2px 6px;
  font-size: var(--fs-xs);
  z-index: 12;
  pointer-events: none;
  display: flex;
  flex-direction: column;
}
.ev-preview__time { font-weight: 700; }
.ev-preview__title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* --------------------------------------------------------------- month */

.month { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.month__weekdays {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.month__grid.has-weekno { grid-template-columns: 40px repeat(7, minmax(0, 1fr)); }
.month__weekdays:has(+ .month__grid.has-weekno) { grid-template-columns: 40px repeat(7, minmax(0, 1fr)); }
.month__weekday, .month__wk-head {
  padding: var(--sp-2) var(--sp-3);
  font-size: var(--fs-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-3);
}
.month__grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  grid-auto-rows: minmax(88px, 1fr);
  overflow-y: auto;
  min-height: 0;
}
.month__wk {
  display: grid; place-items: start center;
  padding-top: var(--sp-2);
  font-size: var(--fs-xs);
  color: var(--text-3);
  border-top: 1px solid var(--border);
}
.month__cell {
  border-top: 1px solid var(--border);
  border-left: 1px solid var(--border);
  padding: 4px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
  overflow: hidden;
}
.month__cell.is-outside { background: var(--surface-2); }
.month__cell.is-outside .month__num { color: var(--text-3); }
.month__cell.is-today { background: color-mix(in srgb, var(--accent) 4%, transparent); }
.month__cell-head { display: flex; align-items: center; justify-content: flex-end; }
.month__num {
  width: 24px; height: 24px;
  border-radius: 50%;
  font-size: var(--fs-sm);
  font-weight: 600;
  display: grid; place-items: center;
  color: var(--text-2);
}
.month__num:hover { background: var(--surface-3); }
.month__cell.is-today .month__num { background: var(--accent); color: var(--accent-text); }
.month__items { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
.month__chip {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 1px 5px;
  border-radius: 4px;
  font-size: var(--fs-xs);
  color: var(--text-2);
  text-align: left;
  min-width: 0;
  cursor: grab;
}
.month__chip:hover { background: var(--surface-3); }
.month__chip.is-dragging-src { opacity: 0.35; }
.month__dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.month__time { font-variant-numeric: tabular-nums; color: var(--text-3); flex: none; }
.month__chip-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; color: var(--text); }
.month__chip--deadline { background: var(--warn-soft); font-weight: 600; }
.month__chip--deadline.is-overdue, .month__chip--deadline.is-today { background: var(--danger-soft); color: var(--danger); }
.month__chip--task { color: var(--text-2); }
.month__more { font-size: var(--fs-xs); color: var(--text-3); padding: 0 5px; text-align: left; }
.month__more:hover { color: var(--accent); }

/* ---------------------------------------------------------------- year */

.year {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(214px, 1fr));
  gap: var(--sp-5);
  padding: var(--sp-5);
  overflow-y: auto;
}
.year__month { display: flex; flex-direction: column; gap: 4px; }
.year__title { font-size: var(--fs-md); font-weight: 650; text-align: left; padding: 2px 0; }
.year__title:hover { color: var(--accent); }
.year__dows, .year__grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
.year__dows span { font-size: 10px; color: var(--text-3); text-align: center; }
.year__day {
  aspect-ratio: 1;
  border-radius: 5px;
  font-size: var(--fs-xs);
  color: var(--text-2);
  display: grid; place-items: center;
}
.year__day:hover { background: var(--surface-3); }
.year__day.is-outside { color: transparent; pointer-events: none; }
.year__day.has-items { background: color-mix(in srgb, var(--accent) calc(var(--load) * 40%), var(--surface-2)); }
.year__day.is-today { outline: 2px solid var(--accent); font-weight: 700; color: var(--accent); }

/* -------------------------------------------------------------- agenda */

.agenda { padding: var(--sp-5); overflow-y: auto; }
.agenda__day { display: flex; gap: var(--sp-4); padding: var(--sp-3) 0; border-top: 1px solid var(--border); }
.agenda__day:first-child { border-top: none; }
.agenda__date {
  width: 96px;
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  position: sticky;
  top: 0;
  align-self: flex-start;
}
.agenda__dow { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); }
.agenda__num { font-size: var(--fs-xl); font-weight: 650; line-height: 1.1; }
.agenda__rel { font-size: var(--fs-xs); color: var(--text-3); }
.agenda__day.is-today .agenda__num { color: var(--accent); }
.agenda__list { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.agenda__row {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: 7px var(--sp-3);
  border-radius: var(--radius);
  text-align: left;
  width: 100%;
}
.agenda__row:hover { background: var(--surface-2); }
.agenda__time { width: 72px; flex: none; font-size: var(--fs-sm); color: var(--text-3); font-variant-numeric: tabular-nums; }
.agenda__bar { width: 3px; align-self: stretch; border-radius: 2px; flex: none; }
.agenda__title { flex: 1; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agenda__title--btn { text-align: left; }
.agenda__meta { font-size: var(--fs-sm); color: var(--text-3); white-space: nowrap; }
.agenda__row.is-done .agenda__title { text-decoration: line-through; color: var(--text-3); }
.agenda__row--deadline .agenda__time { color: var(--warn); }
.agenda__row--deadline.is-overdue .agenda__time, .agenda__row--deadline.is-today .agenda__time { color: var(--danger); }
.agenda__row--deadline .agenda__title { font-weight: 650; }

/* ------------------------------------------------------------ timeline */

.timeline { padding: var(--sp-4) var(--sp-5); overflow: auto; }
.timeline__head { display: flex; position: sticky; top: 0; background: var(--bg); z-index: 2; padding-bottom: var(--sp-2); }
.timeline__label-head { width: 150px; flex: none; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); }
.timeline__scale { flex: 1; display: grid; min-width: 640px; }
.timeline__tick { text-align: center; font-size: var(--fs-xs); color: var(--text-3); border-left: 1px solid var(--border); padding-bottom: 2px; }
.timeline__tick.is-weekend { background: var(--surface-2); }
.timeline__tick.is-today { color: var(--accent); font-weight: 700; }
.timeline__month { display: block; font-size: 10px; text-transform: uppercase; }
.timeline__dow { display: block; }
.timeline__day { display: block; font-weight: 600; color: var(--text-2); }
.timeline__body { display: flex; flex-direction: column; gap: var(--sp-2); }
.timeline__row { display: flex; align-items: stretch; border-top: 1px solid var(--border); padding-top: var(--sp-2); }
.timeline__label { width: 150px; flex: none; display: flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--text-2); padding-right: var(--sp-2); }
.timeline__swatch { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.timeline__lane { flex: 1; display: grid; grid-auto-rows: 24px; gap: 3px; min-width: 640px; }
.timeline__bar {
  border-radius: var(--radius-sm);
  border-left: 3px solid;
  padding: 0 6px;
  font-size: var(--fs-xs);
  display: flex;
  align-items: center;
  overflow: hidden;
  min-width: 0;
}
.timeline__bar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.timeline__marker {
  display: grid; place-items: center;
  color: var(--warn);
  background: var(--warn-soft);
  border-radius: var(--radius-sm);
}
.timeline__mark {
  display: grid;
  place-items: center;
  margin: 3px 4px;
  border-radius: var(--radius-sm);
  border: 1px solid;
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--text-2);
}
.timeline__mark:hover { filter: brightness(1.06); }

/* ---------------------------------------------------------------- mini */

.mini { user-select: none; }
.mini__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-2); }
.mini__title { font-size: var(--fs-sm); font-weight: 650; padding: 2px 6px; border-radius: var(--radius-sm); }
.mini__title:hover { background: var(--surface-2); }
.mini__dows { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 2px; }
.mini__dows span { font-size: 10px; color: var(--text-3); text-align: center; }
.mini__grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
.mini__day {
  position: relative;
  aspect-ratio: 1;
  border-radius: 50%;
  font-size: var(--fs-xs);
  color: var(--text-2);
  display: grid; place-items: center;
}
.mini__day:hover { background: var(--surface-3); }
.mini__day.is-outside { color: var(--text-3); opacity: 0.5; }
.mini__day.is-today { color: var(--accent); font-weight: 700; }
.mini__day.is-selected { background: var(--accent); color: var(--accent-text); font-weight: 600; }
.mini__dot {
  position: absolute;
  bottom: 2px; left: 50%;
  transform: translateX(-50%);
  width: 3px; height: 3px;
  border-radius: 50%;
  background: var(--text-3);
}
.mini__day.is-selected .mini__dot { background: var(--accent-text); }


/* ========================================================================
   css/views.css
   ======================================================================== */
/* Cadence — per-view styling: Today, tasks, notes, projects, goals, habits,
   planning, insights, search, settings, plus focus mode and the assistant. */

/* --------------------------------------------------------------- today */

.today__head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-4); flex-wrap: wrap; margin-bottom: var(--sp-5); }
.today__greeting { font-size: var(--fs-2xl); font-weight: 650; letter-spacing: -0.02em; }
.today__date { color: var(--text-3); margin-top: 2px; }
.today__head-actions { display: flex; gap: var(--sp-2); flex-wrap: wrap; }

.today__grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
  gap: var(--sp-4);
  align-items: start;
}
.card {
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  overflow: hidden;
}
.card--wide { grid-column: span 2; }
@media (max-width: 780px) { .card--wide { grid-column: span 1; } }
.card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--border);
}
.card__title { font-size: var(--fs-sm); font-weight: 650; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-3); }
.card__action { display: flex; align-items: center; gap: 3px; font-size: var(--fs-sm); color: var(--accent); }
.card__action:hover { text-decoration: underline; }
.card__body { padding: var(--sp-4); }
.card__hint { font-size: var(--fs-sm); color: var(--text-3); margin-top: var(--sp-2); }

.nextup { display: flex; flex-direction: column; gap: 3px; }
.nextup__label {
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--accent);
}
.nextup__title { font-size: var(--fs-lg); font-weight: 650; letter-spacing: -0.01em; }
.nextup__meta { color: var(--text-2); font-size: var(--fs-sm); }
.nextup__loc, .nextup__travel { display: flex; align-items: center; gap: 5px; font-size: var(--fs-sm); color: var(--text-3); }
.nextup__actions { display: flex; gap: var(--sp-2); margin-top: var(--sp-3); flex-wrap: wrap; }

.glance { display: flex; align-items: center; gap: var(--sp-5); }
.glance__stats { display: flex; flex-direction: column; gap: var(--sp-2); }
.glance__stat { display: flex; align-items: baseline; gap: 6px; }
.glance__value { font-size: var(--fs-md); font-weight: 650; }
.glance__label { font-size: var(--fs-sm); color: var(--text-3); }

.mini-schedule { display: flex; flex-direction: column; gap: 1px; }
.mini-schedule__row {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: 6px var(--sp-2);
  border-radius: var(--radius-sm);
  width: 100%;
  text-align: left;
}
.mini-schedule__row:hover { background: var(--surface-2); }
.mini-schedule__time { width: 66px; flex: none; font-size: var(--fs-sm); color: var(--text-3); font-variant-numeric: tabular-nums; }
.mini-schedule__bar { width: 3px; height: 18px; border-radius: 2px; flex: none; }
.mini-schedule__title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-schedule__meta { font-size: var(--fs-sm); color: var(--text-3); }
.mini-schedule__row.is-past { opacity: 0.55; }
.mini-schedule__row.is-current { background: var(--accent-soft); }
.mini-schedule__row.is-current .mini-schedule__title { font-weight: 650; }

.priority-list { display: flex; flex-direction: column; gap: 2px; counter-reset: p; }
.priority-row { display: flex; align-items: flex-start; gap: var(--sp-3); padding: var(--sp-2); border-radius: var(--radius); }
.priority-row:hover { background: var(--surface-2); }
.priority-row__main { flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.priority-row__title { text-align: left; font-weight: 550; }
.priority-row__title:hover { color: var(--accent); }
.priority-row__why { font-size: var(--fs-sm); color: var(--text-3); }
.priority-row__actions { display: flex; gap: 2px; opacity: 0; transition: opacity var(--speed) var(--ease); }
.priority-row:hover .priority-row__actions,
.priority-row:focus-within .priority-row__actions { opacity: 1; }

.deadline-list { display: flex; flex-direction: column; gap: 1px; }
.deadline-row { display: flex; align-items: center; gap: var(--sp-3); padding: 7px var(--sp-2); border-radius: var(--radius-sm); }
.deadline-row:hover { background: var(--surface-2); }
.deadline-row__marker { color: var(--text-3); display: flex; }
.deadline-row__title { flex: 1; text-align: left; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.deadline-row__title:hover { color: var(--accent); }
.deadline-row__when { font-size: var(--fs-sm); color: var(--text-3); white-space: nowrap; }
.deadline-row.is-overdue .deadline-row__marker, .deadline-row.is-overdue .deadline-row__when { color: var(--danger); font-weight: 600; }
.deadline-row.is-today .deadline-row__marker, .deadline-row.is-today .deadline-row__when { color: var(--danger); }
.deadline-row.is-tomorrow .deadline-row__when, .deadline-row.is-soon .deadline-row__when { color: var(--warn); }

.free__total { font-weight: 650; margin-bottom: var(--sp-2); }
.free__list { display: flex; flex-direction: column; gap: 2px; }
.free__slot { display: flex; align-items: center; gap: var(--sp-2); padding: 4px var(--sp-2); border-radius: var(--radius-sm); }
.free__slot:hover { background: var(--surface-2); }
.free__time { flex: 1; font-size: var(--fs-sm); font-variant-numeric: tabular-nums; }
.free__len { font-size: var(--fs-sm); color: var(--text-3); }
.free__use { width: 24px; height: 24px; border-radius: var(--radius-sm); display: grid; place-items: center; color: var(--text-3); }
.free__use:hover { background: var(--accent-soft); color: var(--accent); }

.habit-today { display: flex; flex-direction: column; gap: 1px; }
.habit-today__row { display: flex; align-items: center; gap: var(--sp-3); padding: 5px var(--sp-2); border-radius: var(--radius-sm); }
.habit-today__row:hover { background: var(--surface-2); }
.habit-today__name { flex: 1; }
.habit-today__row.is-done .habit-today__name { color: var(--text-3); }
.habit-today__time, .habit-today__streak { font-size: var(--fs-sm); color: var(--text-3); }
.habit-today__streak { font-weight: 600; }

.capture {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  color: var(--text-3);
  margin-bottom: var(--sp-4);
}
.capture:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.capture__input { flex: 1; border: none; outline: none; background: none; height: 30px; color: var(--text); }
.card--capture .capture { margin-bottom: 0; }

.suggestions { display: flex; flex-direction: column; gap: var(--sp-2); }
.suggestion {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding: var(--sp-3);
  border: 1px solid var(--border);
  border-left: 3px solid var(--text-3);
  border-radius: var(--radius);
  background: var(--surface-2);
  flex-wrap: wrap;
}
.suggestion.is-urgent { border-left-color: var(--danger); }
.suggestion.is-warn { border-left-color: var(--warn); }
.suggestion__body { flex: 1; min-width: 220px; }
.suggestion__text { font-weight: 550; }
.suggestion__why { display: flex; align-items: flex-start; gap: 5px; font-size: var(--fs-sm); color: var(--text-3); margin-top: 2px; }
.suggestion__actions { display: flex; gap: var(--sp-2); }

/* --------------------------------------------------------------- tasks */

.tasks__head { display: flex; flex-direction: column; gap: var(--sp-3); margin-bottom: var(--sp-5); }
.tasks__quick {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  color: var(--text-3);
}
.tasks__quick:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tasks__quick-input { flex: 1; border: none; outline: none; background: none; height: 30px; color: var(--text); }
.tasks__filters { display: flex; flex-wrap: wrap; gap: var(--sp-4); }

.tgroup { margin-bottom: var(--sp-6); }
.tgroup__title {
  display: flex; align-items: center; gap: var(--sp-2);
  font-size: var(--fs-sm); font-weight: 650; text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--text-3); margin-bottom: var(--sp-2);
}
.tgroup__dot { width: 8px; height: 8px; border-radius: 50%; }
.tgroup__count {
  min-width: 18px; padding: 0 5px;
  border-radius: 9px; background: var(--surface-2);
  font-size: var(--fs-xs); text-align: center; line-height: 17px;
}

.tlist { display: flex; flex-direction: column; gap: 1px; }
.trow {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-2);
  border-radius: var(--radius);
  border: 1px solid transparent;
}
.trow:hover { background: var(--surface); border-color: var(--border); }
.trow.is-dragging-src { opacity: 0.35; }
.trow-placeholder { height: 40px; border: 1.5px dashed var(--accent); border-radius: var(--radius); background: var(--accent-soft); }
.trow__handle { color: var(--text-3); opacity: 0; cursor: grab; padding-top: 3px; touch-action: none; }
.trow:hover .trow__handle { opacity: 0.6; }
.trow__check { margin-top: 1px; }
.trow__main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.trow__title { text-align: left; font-weight: 550; line-height: 1.35; }
.trow__title:hover { color: var(--accent); }
.trow.is-done .trow__title { text-decoration: line-through; color: var(--text-3); }
.trow.is-blocked { opacity: 0.8; }
.trow__meta { display: flex; flex-wrap: wrap; gap: 5px; }
.trow__chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: var(--fs-xs);
  color: var(--text-3);
  padding: 1px 6px;
  border-radius: 10px;
  background: var(--surface-2);
}
.trow__chip.is-overdue { color: var(--danger); background: var(--danger-soft); font-weight: 600; }
.trow__chip.is-scheduled { color: var(--ok); background: var(--ok-soft); }
.trow__chip.is-blocked { color: var(--warn); background: var(--warn-soft); }
.trow__chip--project { color: var(--text-2); }
.trow__chip--tag:hover, .trow__chip--project:hover { background: var(--surface-3); }
.trow__dot { width: 6px; height: 6px; border-radius: 50%; }
.trow__priority { width: 16px; display: grid; place-items: center; color: var(--p-color); }
.trow__actions { display: flex; gap: 1px; opacity: 0; transition: opacity var(--speed) var(--ease); }
.trow:hover .trow__actions, .trow:focus-within .trow__actions { opacity: 1; }

@media (max-width: 700px) {
  .trow__handle { display: none; }
  .trow__actions { opacity: 1; }
}

/* --------------------------------------------------------------- notes */

.notes__filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--sp-4); }
.notes__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(248px, 1fr)); gap: var(--sp-3); }
.note {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  padding: var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  transition: box-shadow var(--speed) var(--ease), transform var(--speed) var(--ease);
}
.note:hover { box-shadow: var(--shadow-1); transform: translateY(-1px); }
.note.is-pinned { border-color: var(--accent); }
.note__head { display: flex; align-items: center; justify-content: space-between; }
.note__kind { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); }
.note__head-actions { display: flex; gap: 1px; }
.note__title { font-weight: 650; text-align: left; line-height: 1.3; }
.note__title:hover { color: var(--accent); }
.note__body { font-size: var(--fs-sm); color: var(--text-2); white-space: pre-wrap; line-height: 1.55; }
.note__checklist { display: flex; flex-direction: column; gap: 3px; }
.note__check { display: flex; align-items: center; gap: 6px; font-size: var(--fs-sm); }
.note__check.is-done span { text-decoration: line-through; color: var(--text-3); }
.note__more { font-size: var(--fs-xs); color: var(--text-3); }
.note__foot { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: auto; padding-top: var(--sp-2); }
.note__tag { font-size: var(--fs-xs); color: var(--text-3); padding: 1px 6px; border-radius: 10px; background: var(--surface-2); }
.note__tag:hover { background: var(--surface-3); }
.note__tag--project { color: var(--chip-color, var(--accent)); }
.note__date { margin-left: auto; font-size: var(--fs-xs); color: var(--text-3); }

.captures { display: flex; flex-direction: column; gap: var(--sp-2); }
.capture-row {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding: var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  flex-wrap: wrap;
}
.capture-row__main { flex: 1; min-width: 200px; }
.capture-row__text { line-height: 1.5; }
.capture-row__when { font-size: var(--fs-xs); color: var(--text-3); }
.capture-row__actions { display: flex; gap: var(--sp-2); align-items: center; }

/* ------------------------------------------------------------ projects */

.projects__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: var(--sp-3); }
.project {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: var(--sp-4);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  border-top: 3px solid var(--proj-color, var(--accent));
}
.project__head { display: flex; align-items: center; gap: var(--sp-2); }
.project__swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.project__name { flex: 1; font-weight: 650; text-align: left; }
.project__name:hover { color: var(--accent); }
.project__desc { font-size: var(--fs-sm); color: var(--text-3); line-height: 1.5; }
.project__meta { display: flex; justify-content: space-between; font-size: var(--fs-sm); color: var(--text-3); }
.project__meta .is-overdue { color: var(--danger); font-weight: 600; }

.detail__back { margin-bottom: var(--sp-3); }
.detail__overview {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: var(--sp-4);
  padding: var(--sp-4);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  margin-bottom: var(--sp-4);
}
.detail__link { display: flex; align-items: center; gap: 5px; font-size: var(--fs-sm); color: var(--text-3); margin-bottom: var(--sp-3); }

.ptimeline { padding: var(--sp-4) var(--sp-3); border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); }
.ptimeline__track { position: relative; height: 44px; border-radius: var(--radius); background: var(--surface-2); }
.ptimeline__bar { position: absolute; top: 8px; height: 12px; border-radius: 6px; }
.ptimeline__marker { position: absolute; top: 24px; transform: translateX(-50%); color: var(--warn); display: flex; }
.ptimeline__marker.is-done { color: var(--ok); }
.ptimeline__target { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--danger); }
.ptimeline__axis { display: flex; justify-content: space-between; font-size: var(--fs-xs); color: var(--text-3); margin-top: 6px; }

/* --------------------------------------------------------------- goals */

.goals__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--sp-3); }
.goal {
  display: flex; flex-direction: column; gap: 4px;
  padding: var(--sp-4);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  border-left: 3px solid var(--goal-color, var(--accent));
}
.goal__head { display: flex; align-items: center; gap: var(--sp-2); }
.goal__name { flex: 1; font-weight: 650; text-align: left; }
.goal__name:hover { color: var(--accent); }
.goal__desc { font-size: var(--fs-sm); color: var(--text-3); line-height: 1.5; }
.goal__meta { display: flex; gap: var(--sp-3); font-size: var(--fs-sm); color: var(--text-3); flex-wrap: wrap; }
.goal__next { display: flex; align-items: center; gap: 5px; font-size: var(--fs-sm); color: var(--text-2); margin-top: 2px; }

.milestones { display: flex; flex-direction: column; gap: 2px; }
.milestone { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-2); border-radius: var(--radius); }
.milestone:hover { background: var(--surface-2); }
.milestone__title { flex: 1; }
.milestone.is-done .milestone__title { text-decoration: line-through; color: var(--text-3); }

/* -------------------------------------------------------------- habits */

.habits__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: var(--sp-3); }
.habit {
  display: flex; flex-direction: column; gap: var(--sp-2);
  padding: var(--sp-4);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
}
.habit__head { display: flex; align-items: center; gap: var(--sp-2); }
.habit__name { flex: 1; font-weight: 650; text-align: left; }
.habit__schedule { font-size: var(--fs-sm); color: var(--text-3); }
.habit__grid { display: flex; gap: 3px; }
.habit__week { display: flex; flex-direction: column; gap: 3px; flex: 1; }
.habit__cell {
  aspect-ratio: 1;
  border-radius: 3px;
  background: var(--surface-2);
  border: 1px solid transparent;
}
.habit__cell.is-done { background: var(--habit-color, var(--accent)); }
.habit__cell.is-off { background: transparent; border-color: var(--border); }
.habit__cell.is-future { opacity: 0.4; }
.habit__stats { display: flex; justify-content: space-between; font-size: var(--fs-sm); color: var(--text-3); }
.habit__streak { font-weight: 650; color: var(--habit-color, var(--accent)); }
.habit__streak.is-quiet { color: var(--text-3); font-weight: 400; }

/* ------------------------------------------------------------ planning */

.planning__tabs { margin-bottom: var(--sp-5); }
.review__nav { display: flex; align-items: center; justify-content: center; gap: var(--sp-3); margin-bottom: var(--sp-4); }
.review__range { font-size: var(--fs-md); font-weight: 650; }
.review__stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--sp-3); margin-bottom: var(--sp-4); }
.review__list { display: flex; flex-direction: column; gap: 1px; }
.review__row { display: flex; align-items: center; gap: var(--sp-3); padding: 5px var(--sp-2); border-radius: var(--radius-sm); }
.review__row:hover { background: var(--surface-2); }
.review__tick { color: var(--ok); display: flex; }
.review__tick.is-open { color: var(--text-3); }
.review__swatch { width: 9px; height: 9px; border-radius: 3px; }
.review__meta { margin-left: auto; font-size: var(--fs-sm); color: var(--text-3); }
.review__priorities { display: flex; flex-direction: column; gap: var(--sp-2); counter-reset: rp; }
.review__priority {
  display: flex; align-items: baseline; gap: var(--sp-3);
  padding: var(--sp-2) var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
}
.review__priority::before {
  counter-increment: rp;
  content: counter(rp);
  font-size: var(--fs-sm);
  font-weight: 700;
  color: var(--accent);
}
.review__projects { display: flex; flex-direction: column; gap: var(--sp-3); }
.review__project { display: flex; flex-direction: column; gap: 2px; }

.matrix { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
@media (max-width: 760px) { .matrix { grid-template-columns: 1fr; } }
.matrix__cell { padding: var(--sp-3); border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); }
.matrix__cell--do { border-top: 3px solid var(--danger); }
.matrix__cell--schedule { border-top: 3px solid var(--accent); }
.matrix__cell--delegate { border-top: 3px solid var(--warn); }
.matrix__cell--later { border-top: 3px solid var(--text-3); }
.matrix__head { display: flex; align-items: baseline; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-2); }
.matrix__title { font-size: var(--fs-base); font-weight: 650; }
.matrix__hint { font-size: var(--fs-sm); color: var(--text-3); }
.matrix__count { margin-left: auto; font-size: var(--fs-sm); color: var(--text-3); }
.matrix__list { display: flex; flex-direction: column; gap: 1px; }
