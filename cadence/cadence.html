/* Cadence — quick add, quick capture and the Organize review flow.

   The path from a messy thought to a scheduled action runs through here, and it
   always ends in a review step: the app shows exactly what it understood before
   anything is written. */
(function (global) {
  'use strict';
  var UI = global.UI = global.UI || {};
  var F = UI.F;

  var TYPE_OPTIONS = [
    { value: 'event', label: 'Event', icon: 'calendar', hint: 'Happens at a specific time' },
    { value: 'task', label: 'Task', icon: 'checkSquare', hint: 'Something to get done' },
    { value: 'deadline', label: 'Deadline', icon: 'flag', hint: 'A point something is due by' },
    { value: 'note', label: 'Note', icon: 'note', hint: 'Information to keep' },
    { value: 'habit', label: 'Habit', icon: 'repeat', hint: 'Something you repeat' },
    { value: 'project', label: 'Project', icon: 'folder', hint: 'A body of related work' },
    { value: 'goal', label: 'Goal', icon: 'target', hint: 'A long-term outcome' }
  ];

  var EXAMPLES = [
    'Study biology tomorrow from 4-6',
    'Doctor appointment Friday at 3',
    'Finish history project before Monday',
    'Practice piano for 45 minutes every weekday',
    'Remind me to submit the application next Thursday'
  ];

  /* ------------------------------------------------------------- quick add */

  function quickAdd(opts) {
    opts = opts || {};
    var parsed = null;
    var typeOverride = opts.type || null;

    var input = D.h('input.qa__input', {
      type: 'text',
      placeholder: EXAMPLES[Math.floor(Math.random() * EXAMPLES.length)],
      'aria-label': 'Describe what you want to add',
      value: opts.text || '',
      autocomplete: 'off',
      spellcheck: 'false',
      'data-autofocus': ''
    });

    var preview = D.h('div.qa__preview', { 'aria-live': 'polite' });
    var typeRow = D.h('div.qa__types', { role: 'radiogroup', 'aria-label': 'What kind of item is this?' });

    function reparse() {
      var text = input.value.trim();
      if (!text) { parsed = null; renderEmpty(); return; }
      parsed = NLP.parse(text, opts.now ? { now: opts.now } : null);
      if (typeOverride) parsed.type = typeOverride;
      if (opts.projectId && !parsed.projectId) parsed.projectId = opts.projectId;
      NLP.toPayload(parsed); // keeps materialised fields in step with the type
      renderPreview();
    }

    function renderEmpty() {
      D.clear(preview);
      D.clear(typeRow);
      preview.appendChild(D.h('div.qa__hints', [
        D.h('p.qa__hints-title', { text: 'Try typing something like:' }),
        D.h('ul.qa__hints-list', EXAMPLES.map(function (e) {
          return D.h('li', D.h('button.qa__hint', {
            type: 'button',
            onclick: function () { input.value = e; reparse(); input.focus(); }
          }, e));
        }))
      ]));
    }

    function renderPreview() {
      D.clear(preview);
      D.clear(typeRow);

      TYPE_OPTIONS.forEach(function (t) {
        var active = parsed.type === t.value;
        var btn = D.h('button.qa__type', {
          type: 'button', role: 'radio', 'aria-checked': active ? 'true' : 'false',
          title: t.hint,
          onclick: function () {
            typeOverride = t.value;
            reparseAsType(t.value);
          }
        }, [D.icon(t.icon, 15), D.h('span', { text: t.label })]);
        typeRow.appendChild(btn);
      });

      var card = D.h('div.qa__card');
      card.appendChild(D.h('div.qa__card-title', { text: parsed.title || 'Untitled' }));

      var chips = D.h('div.qa__chips');
      summaryChips(parsed).forEach(function (c) {
        chips.appendChild(D.h('span.qa__chip' + (c.inferred ? '.is-inferred' : ''), [
          D.icon(c.icon, 13), D.h('span', { text: c.text })
        ]));
      });
      card.appendChild(chips);

      var assumptions = [];
      if (parsed.inferredDate) assumptions.push('No date was given, so this is set for ' + T.relativeDay(parsed.startWall || parsed.dueWall || T.nowWall()).toLowerCase() + '.');
      if (parsed.type === 'event' && parsed.allDay) assumptions.push('No time was given, so this is all day.');
      if (parsed.vagueDate) assumptions.push('“Next week” was read as ' + T.fmtDate(parsed.dayWall) + '.');
      if (parsed.type === 'task' && !parsed.dueWall) assumptions.push('No date — this goes to your inbox.');
      if (assumptions.length) {
        card.appendChild(D.h('p.qa__assume', [D.icon('alert', 13), D.h('span', { text: assumptions.join(' ') })]));
      }
      preview.appendChild(card);
    }

    function reparseAsType(type) {
      var text = input.value.trim();
      parsed = NLP.parse(text, opts.now ? { now: opts.now } : null);
      parsed.type = type;
      // Re-derive dates for the newly chosen shape.
      rematerialize(parsed);
      renderPreview();
    }

    function rematerialize(p) {
      var st = S.settings();
      var now = T.nowWall();
      var day = p.dayWall;
      if (p.type === 'event' || p.type === 'habit') {
        if (!day) { day = T.startOfDay(now); p.inferredDate = true; }
        var startMin = p.startMinutes;
        if (startMin === null) { p.allDay = p.type === 'event'; startMin = st.workingHours.start; }
        else p.allDay = false;
        p.startWall = T.atMinutes(day, startMin);
        var dur = p.durationMinutes || st.defaultEventDuration;
        p.endWall = p.endMinutes !== null ? T.atMinutes(day, p.endMinutes) : T.addMinutes(p.startWall, dur);
      } else if (p.type === 'deadline') {
        if (!day) { day = T.startOfDay(T.addDays(now, 7)); p.inferredDate = true; }
        p.dueWall = T.atMinutes(day, p.startMinutes !== null ? p.startMinutes : 23 * 60 + 59);
        p.hasDueTime = p.startMinutes !== null;
      } else if (p.type === 'task') {
        if (day) {
          p.dueWall = T.atMinutes(day, p.startMinutes !== null ? p.startMinutes : 23 * 60 + 59);
          p.hasDueTime = p.startMinutes !== null;
        } else p.dueWall = null;
        p.estimate = p.durationMinutes || null;
      } else {
        p.dueWall = day ? T.atMinutes(day, 23 * 60 + 59) : null;
      }
    }

    input.addEventListener('input', D.debounce(reparse, 90));
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commit(false); }
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); commit(true); }
    });

    var layer = UI.modal({
      size: 'md',
      class: 'dialog--qa',
      title: 'Add something',
      subtitle: 'Write it however you think of it.',
      body: D.h('div.qa', [
        D.h('div.qa__inputwrap', [D.icon('sparkle', 17), input]),
        typeRow,
        preview
      ]),
      footer: function (l) {
        return [
          D.h('div.sheet__foot-left', D.h('button.btn.btn--ghost.btn--sm', {
            type: 'button', onclick: function () { commit(true); }
          }, 'Open full editor')),
          D.h('div.sheet__foot-right', [
            D.h('button.btn.btn--ghost', { type: 'button', onclick: function () { l.close(); } }, 'Cancel'),
            D.h('button.btn.btn--primary', { type: 'button', onclick: function () { commit(false); } },
              ['Add', D.h('kbd.btn__kbd', { text: '↵' })])
          ])
        ];
      }
    });

    function commit(openEditor) {
      if (!parsed || !input.value.trim()) {
        if (openEditor) { layer.close(); UI.editEvent(null); }
        return;
      }
      var payload = NLP.toPayload(parsed);
      layer.close();
      if (openEditor) {
        openEditorFor(parsed.type, payload);
        return;
      }
      createFrom(parsed.type, payload);
    }

    reparse();
    if (opts.text) setTimeout(reparse, 0);
    return layer;
  }

  function summaryChips(p) {
    var st = S.settings();
    var chips = [];
    // A habit has a rhythm and a length, not a date — describing it like an
    // event ("all day, Aug 28") would be actively misleading.
    if (p.type === 'habit') {
      chips.push({ icon: 'repeat', text: p.recurrence ? R.describe(p.recurrence) : 'Every day', inferred: !p.recurrence });
      chips.push({
        icon: 'clock',
        text: p.startMinutes !== null
          ? 'around ' + T.fmtTime(T.atMinutes(T.nowWall(), p.startMinutes), st.use24Hour)
          : 'no set time',
        inferred: p.startMinutes === null
      });
      chips.push({ icon: 'zap', text: T.humanDuration(p.durationMinutes || 20), inferred: !p.durationMinutes });
      (p.tags || []).forEach(function (t) { chips.push({ icon: 'tag', text: '#' + t }); });
      return chips;
    }
    if (p.type === 'event') {
      if (p.startWall) {
        chips.push({ icon: 'calendar', text: T.relativeDay(p.startWall) + ' · ' + T.fmtDateShort(p.startWall), inferred: p.inferredDate });
        if (!p.allDay) {
          chips.push({ icon: 'clock', text: T.fmtTime(p.startWall, st.use24Hour) + ' – ' + T.fmtTime(p.endWall, st.use24Hour) });
        } else chips.push({ icon: 'clock', text: 'All day', inferred: true });
      }
    } else if (p.dueWall) {
      chips.push({
        icon: 'flag',
        text: 'Due ' + T.relativeDay(p.dueWall).toLowerCase() + (p.hasDueTime ? ' at ' + T.fmtTime(p.dueWall, st.use24Hour) : ''),
        inferred: p.inferredDate
      });
    } else if (p.type === 'task') {
      chips.push({ icon: 'inbox', text: 'No date — goes to Inbox' });
    }
    if (p.estimate || (p.type !== 'event' && p.durationMinutes)) {
      chips.push({ icon: 'clock', text: T.humanDuration(p.estimate || p.durationMinutes) });
    }
    if (p.recurrence) chips.push({ icon: 'repeat', text: R.describe(p.recurrence) });
    if (p.priority) {
      var pr = M.PRIORITIES.filter(function (x) { return x.id === p.priority; })[0];
      chips.push({ icon: 'zap', text: pr ? pr.label : p.priority });
    }
    if (p.location) chips.push({ icon: 'pin', text: p.location });
    if (p.people && p.people.length) chips.push({ icon: 'users', text: p.people.join(', ') });
    if (p.projectId) {
      var proj = S.get('projects', p.projectId);
      if (proj) chips.push({ icon: 'folder', text: proj.name });
    }
    if (p.categoryId) {
      var cat = S.get('categories', p.categoryId);
      if (cat) chips.push({ icon: 'tag', text: cat.name, inferred: true });
    }
    (p.tags || []).forEach(function (t) { chips.push({ icon: 'tag', text: '#' + t }); });
    return chips;
  }

  function createFrom(type, payload) {
    switch (type) {
      case 'event': {
        var ev = A.createEvent(payload);
        UI.warnAboutConflicts(ev);
        return ev;
      }
      case 'task': return A.createTask(payload);
      case 'deadline': return A.createDeadline(payload);
      case 'note': return A.createNote(payload);
      case 'habit': return A.createHabit(payload);
      case 'project': return A.createProject(payload);
      case 'goal': return A.createGoal(payload);
    }
  }

  function openEditorFor(type, payload) {
    switch (type) {
      case 'event': return UI.editEvent(payload);
      case 'task': return UI.editTask(payload);
      case 'deadline': return UI.editDeadline(payload);
      case 'note': return UI.editNote(payload);
      case 'habit': return UI.editHabit(payload);
      case 'project': return UI.editProject(payload);
      case 'goal': return UI.editGoal(payload);
    }
  }

  /* --------------------------------------------------------- quick capture */

  /* Deliberately frictionless: type, press Enter, it is saved. Nothing to fill in. */
  function captureBox(opts) {
    opts = opts || {};
    var input = D.h('input.capture__input', {
      type: 'text',
      placeholder: opts.placeholder || 'Capture a thought…',
      'aria-label': 'Quick capture',
      autocomplete: 'off'
    });
    function submit() {
      var text = input.value.trim();
      if (!text) return;
      A.addCapture(text);
      input.value = '';
      UI.toast('Captured — organize it whenever you like', {
        actions: [{ label: 'Organize now', onClick: function () { organizeDialog({ text: text }); } }]
      });
      if (opts.onAdd) opts.onAdd();
    }
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
    });
    var wrap = D.h('div.capture', [
      D.icon('zap', 16),
      input,
      D.h('button.btn.btn--sm.btn--primary', { type: 'button', onclick: submit }, 'Save')
    ]);
    wrap.focusInput = function () { input.focus(); };
    return wrap;
  }

  /* ------------------------------------------------------------- organize */

  function organizeDialog(opts) {
    opts = opts || {};
    var stage = opts.text ? 'review' : 'input';
    var rows = [];

    var textarea = D.h('textarea.organize__input', {
      placeholder: 'Dump everything here. For example:\n\nMath test Friday, need to buy poster board, meeting with Sarah Wednesday at 4, science project due next month.',
      rows: 7,
      'aria-label': 'Text to organize',
      'data-autofocus': ''
    });
    textarea.value = opts.text || '';

    var bodyNode = D.h('div.organize');
    var footNode = D.h('div.organize__foot');

    var layer = UI.modal({
      size: 'lg',
      class: 'dialog--organize',
      title: 'Organize this',
      subtitle: 'Paste anything. Nothing is saved until you approve it.',
      body: bodyNode,
      footer: footNode
    });

    function renderInput() {
      D.clear(bodyNode);
      D.clear(footNode);
      bodyNode.appendChild(textarea);
      bodyNode.appendChild(D.h('p.organize__tip', [
        D.icon('sparkle', 14),
        D.h('span', { text: 'Separate items with commas, “and”, or new lines. Dates, times and repeats are picked up automatically.' })
      ]));
      footNode.appendChild(D.h('div.sheet__foot-right', [
        D.h('button.btn.btn--ghost', { type: 'button', onclick: function () { layer.close(); } }, 'Cancel'),
        D.h('button.btn.btn--primary', {
          type: 'button',
          onclick: function () {
            var text = textarea.value.trim();
            if (!text) { UI.toast('Write something first'); return; }
            rows = NLP.organize(text).map(function (r) {
              return { parsed: r.parsed, type: r.type, source: r.source, include: true };
            });
            if (!rows.length) { UI.toast('Nothing to organize there'); return; }
            renderReview();
          }
        }, ['Organize', D.icon('arrowRight', 15)])
      ]));
      setTimeout(function () { textarea.focus(); }, 30);
    }

    function renderReview() {
      D.clear(bodyNode);
      D.clear(footNode);

      var summary = D.h('div.organize__summary', { 'aria-live': 'polite' });
      var list = D.h('div.organize__list', { role: 'list' });

      function refreshSummary() {
        var counts = {};
        rows.filter(function (r) { return r.include; }).forEach(function (r) {
          counts[r.type] = (counts[r.type] || 0) + 1;
        });
        var keys = Object.keys(counts);
        D.clear(summary);
        if (!keys.length) {
          summary.appendChild(D.h('span.organize__summary-empty', { text: 'Nothing selected' }));
          return;
        }
        keys.forEach(function (k) {
          var meta = TYPE_OPTIONS.filter(function (t) { return t.value === k; })[0] || { label: k, icon: 'circle' };
          summary.appendChild(D.h('span.organize__count', [
            D.icon(meta.icon, 14),
            D.h('span', { text: counts[k] + ' ' + (counts[k] === 1 ? meta.label.toLowerCase() : meta.label.toLowerCase() + 's') })
          ]));
        });
      }

      rows.forEach(function (row, i) {
        list.appendChild(reviewRow(row, i, refreshSummary));
      });

      bodyNode.appendChild(D.h('div.organize__head', [
        D.h('p.organize__lead', { text: 'Here is what that looks like. Change anything before adding.' }),
        summary
      ]));
      bodyNode.appendChild(list);
      refreshSummary();

      footNode.appendChild(D.h('div.sheet__foot-left', [
        D.h('button.btn.btn--ghost.btn--sm', {
          type: 'button', onclick: function () { stage = 'input'; renderInput(); }
        }, [D.icon('chevronLeft', 15), 'Back to text'])
      ]));
      footNode.appendChild(D.h('div.sheet__foot-right', [
        D.h('button.btn.btn--ghost', { type: 'button', onclick: function () { layer.close(); } }, 'Cancel'),
        D.h('button.btn.btn--primary', {
          type: 'button',
          onclick: function () {
            var items = rows.filter(function (r) { return r.include; }).map(function (r) {
              return { type: r.type, payload: NLP.toPayload(r.parsed) };
            });
            if (!items.length) { UI.toast('Nothing selected to add'); return; }
            A.applyOrganized(items, opts.captureId);
            layer.close();
            if (opts.onDone) opts.onDone();
          }
        }, 'Add selected')
      ]));
    }

    function reviewRow(row, index, onChange) {
      var node = D.h('div.orow', { role: 'listitem' });

      var include = D.h('button.check.orow__check', {
        type: 'button', role: 'checkbox', 'aria-checked': row.include ? 'true' : 'false',
        'aria-label': 'Include “' + row.parsed.title + '”',
        onclick: function () {
          row.include = !row.include;
          include.setAttribute('aria-checked', row.include ? 'true' : 'false');
          node.classList.toggle('is-excluded', !row.include);
          onChange();
        }
      }, row.include ? D.icon('check', 13) : null);

      var typeSel = F.select({
        value: row.type, ariaLabel: 'Item type',
        options: TYPE_OPTIONS.map(function (t) { return { value: t.value, label: t.label }; })
      });
      typeSel.classList.add('orow__type');
      typeSel.addEventListener('change', function () {
        row.type = typeSel.getValue();
        row.parsed.type = row.type;
        rematerializeRow(row.parsed);
        paintDetail();
        onChange();
      });

      var titleInput = D.h('input.orow__title', {
        type: 'text', value: row.parsed.title, 'aria-label': 'Title',
        oninput: function (e) { row.parsed.title = e.target.value; }
      });

      var detail = D.h('div.orow__detail');
      function paintDetail() {
        D.clear(detail);
        summaryChips(row.parsed).forEach(function (c) {
          detail.appendChild(D.h('span.qa__chip.qa__chip--sm' + (c.inferred ? '.is-inferred' : ''), [
            D.icon(c.icon, 12), D.h('span', { text: c.text })
          ]));
        });
        if (!detail.childNodes.length) {
          detail.appendChild(D.h('span.orow__nodetail', { text: 'No date — you can add one later' }));
        }
      }
      paintDetail();

      var editBtn = D.h('button.btn.btn--ghost.btn--sm.orow__edit', {
        type: 'button', title: 'Adjust details',
        onclick: function () { openRowEditor(row, paintDetail); }
      }, D.icon('edit', 14));

      node.appendChild(include);
      node.appendChild(D.h('div.orow__main', [
        D.h('div.orow__top', [typeSel, titleInput, editBtn]),
        detail,
        D.h('p.orow__source', { text: '“' + row.source + '”' })
      ]));
      return node;
    }

    function rematerializeRow(p) {
      var st = S.settings();
      var now = T.nowWall();
      var day = p.dayWall;
      if (p.type === 'event' || p.type === 'habit') {
        if (!day) { day = T.startOfDay(now); p.inferredDate = true; }
        var sm = p.startMinutes;
        if (sm === null) { p.allDay = p.type === 'event'; sm = st.workingHours.start; } else p.allDay = false;
        p.startWall = T.atMinutes(day, sm);
        p.endWall = p.endMinutes !== null ? T.atMinutes(day, p.endMinutes)
          : T.addMinutes(p.startWall, p.durationMinutes || st.defaultEventDuration);
      } else if (p.type === 'deadline') {
        if (!day) { day = T.startOfDay(T.addDays(now, 7)); p.inferredDate = true; }
        p.dueWall = T.atMinutes(day, p.startMinutes !== null ? p.startMinutes : 23 * 60 + 59);
        p.hasDueTime = p.startMinutes !== null;
      } else if (p.type === 'task') {
        p.dueWall = day ? T.atMinutes(day, p.startMinutes !== null ? p.startMinutes : 23 * 60 + 59) : null;
        p.hasDueTime = day ? p.startMinutes !== null : false;
        p.estimate = p.durationMinutes || null;
      } else {
        p.dueWall = day ? T.atMinutes(day, 23 * 60 + 59) : null;
      }
    }

    /* A compact inline editor so a row can be corrected without leaving review. */
    function openRowEditor(row, repaint) {
      var p = row.parsed;
      var isTimed = p.type === 'event' || p.type === 'habit';
      var dayInput = F.date({ value: p.dayWall || (isTimed ? p.startWall : p.dueWall) || null });
      var startInput = F.time({ value: isTimed && p.startWall && !p.allDay ? p.startWall : (p.hasDueTime && p.dueWall ? p.dueWall : null) });
      var endInput = F.time({ value: isTimed && p.endWall && !p.allDay ? p.endWall : null });
      var durInput = F.duration({ value: p.durationMinutes || p.estimate || null });
      var prioritySel = F.select({
        value: p.priority || '', ariaLabel: 'Priority',
        options: [{ value: '', label: 'No priority' }].concat(M.PRIORITIES.map(function (x) { return { value: x.id, label: x.label }; }))
      });
      var projectSel = F.projectSelect(p.projectId);

      var sub = UI.modal({
        size: 'sm',
        title: 'Adjust',
        subtitle: p.title,
        body: D.h('div.editor', [
          F.field('Date', dayInput),
          isTimed
            ? F.field('Time', D.h('div.when__inputs', [startInput, D.h('span.when__dash', { text: '–' }), endInput]))
            : F.field('Time (optional)', startInput),
          isTimed ? null : F.field('How long', durInput),
          F.field('Priority', prioritySel),
          F.field('Project', projectSel)
        ]),
        footer: function (l) {
          return D.h('div.sheet__foot-right', [
            D.h('button.btn.btn--ghost', { type: 'button', onclick: function () { l.close(); } }, 'Cancel'),
            D.h('button.btn.btn--primary', {
              type: 'button',
              onclick: function () {
                p.dayWall = dayInput.getValue();
                p.startMinutes = startInput.getValue();
                p.endMinutes = isTimed ? endInput.getValue() : null;
                if (!isTimed) p.durationMinutes = durInput.getValue();
                else if (p.startMinutes != null && p.endMinutes != null) p.durationMinutes = p.endMinutes - p.startMinutes;
                p.priority = prioritySel.getValue();
                p.projectId = projectSel.getValue();
                p.inferredDate = false;
                rematerializeRow(p);
                repaint();
                l.close();
              }
            }, 'Apply')
          ]);
        }
      });
    }

    if (stage === 'review' && opts.text) {
      rows = NLP.organize(opts.text).map(function (r) {
        return { parsed: r.parsed, type: r.type, source: r.source, include: true };
      });
      renderReview();
    } else renderInput();

    return layer;
  }

  /* The "+ Add" menu: one obvious entry point for all seven concepts. */
  function addMenu(anchor) {
    UI.menu(anchor, [
      { label: 'Quick add', icon: 'sparkle', shortcut: 'C', onClick: function () { quickAdd(); } },
      { separator: true },
      { label: 'Event', icon: 'calendar', shortcut: 'N', onClick: function () { UI.editEvent(null); } },
      { label: 'Task', icon: 'checkSquare', shortcut: 'T', onClick: function () { UI.editTask(null); } },
      { label: 'Deadline', icon: 'flag', onClick: function () { UI.editDeadline(null); } },
      { label: 'Note', icon: 'note', onClick: function () { UI.editNote(null); } },
      { label: 'Habit', icon: 'repeat', onClick: function () { UI.editHabit(null); } },
      { separator: true },
      { label: 'Project', icon: 'folder', onClick: function () { UI.editProject(null); } },
      { label: 'Goal', icon: 'target', onClick: function () { UI.editGoal(null); } },
      { separator: true },
      { label: 'Organize a brain dump', icon: 'zap', onClick: function () { organizeDialog(); } }
    ], { align: 'right' });
  }

  Object.assign(UI, {
    quickAdd: quickAdd,
    captureBox: captureBox,
    organizeDialog: organizeDialog,
    addMenu: addMenu,
    summaryChips: summaryChips,
    createFrom: createFrom
  });
})(window);

/* Cadence — the assistant surfaces.
   Find Time, Plan My Day, What Should I Do Now, conflict resolution and missed-
   task recovery. Every one of these proposes and waits for a yes. */
(function (global) {
  'use strict';
  var UI = global.UI = global.UI || {};
  var F = UI.F;

  function use24() { return S.settings().use24Hour; }

  /* ------------------------------------------------------------- find time */

  function findTimeDialog(opts) {
    opts = opts || {};
    var minutes = opts.minutes || 60;
    var before = opts.before ? T.w(opts.before) : null;
    var anyTime = false;

    var durationInput = F.duration({ value: minutes, onChange: function (v) { minutes = v || 60; refresh(); } });
    var beforeInput = F.date({ value: before, onchange: function () { before = beforeInput.getValue(); refresh(); } });
    var anyToggle = F.toggle({ value: false, onChange: function (v) { anyTime = v; refresh(); } });
    var results = D.h('div.slots', { 'aria-live': 'polite' });

    function refresh() {
      var list = SCHED.findTime(minutes, {
        days: 14, limit: 6,
        before: before ? T.iso(T.endOfDay(before)) : null,
        anyTime: anyTime
      });
      D.clear(results);
      if (!list.length) {
        results.appendChild(emptyState({
          icon: 'clock',
          title: 'No block that long is free',
          body: before
            ? 'Nothing of ' + T.humanDuration(minutes) + ' fits before ' + T.fmtDate(before) + '. Try a shorter block, a later date, or allow times outside your working hours.'
            : 'Try a shorter block, or allow times outside your working hours.',
          actions: [
            { label: 'Try ' + T.humanDuration(Math.max(15, Math.round(minutes / 2 / 15) * 15)), onClick: function () { minutes = Math.max(15, Math.round(minutes / 2 / 15) * 15); durationInput.setValue(minutes); refresh(); } },
            { label: 'Allow any time of day', onClick: function () { anyTime = true; anyToggle.setValue(true); refresh(); } }
          ]
        }));
        return;
      }
      list.forEach(function (slot, i) {
        results.appendChild(slotRow(slot, i === 0));
      });
    }

    function slotRow(slot, isBest) {
      var reason = slot.reasons.length ? slot.reasons.join(', ') : 'fits your free time';
      return D.h('div.slot' + (isBest ? '.is-best' : ''), [
        D.h('div.slot__main', [
          D.h('div.slot__when', [
            D.h('strong', { text: T.relativeDay(slot.start) + ', ' + T.fmtDateShort(slot.start) }),
            D.h('span.slot__time', { text: T.fmtTime(slot.start, use24()) + ' – ' + T.fmtTime(slot.end, use24()) })
          ]),
          D.h('p.slot__why', { text: isBest ? 'Best match — ' + reason : reason })
        ]),
        D.h('button.btn.btn--primary.btn--sm', {
          type: 'button',
          onclick: function () {
            layer.close();
            if (opts.onPick) opts.onPick(slot);
          }
        }, isBest ? 'Schedule' : 'Pick')
      ]);
    }

    var layer = UI.modal({
      size: 'md',
      title: 'Find time',
      subtitle: opts.title ? 'For “' + opts.title + '”' : 'Nothing is booked until you pick one.',
      body: D.h('div.findtime', [
        F.field('How long do you need?', durationInput),
        D.h('div.editor__grid', [
          F.field('Needs to be before', beforeInput, { hint: 'Optional.' }),
          F.field('Outside working hours', D.h('label.checkline', [anyToggle, D.h('span', { text: 'Allow evenings and weekends' })]))
        ]),
        D.h('h3.section-title', { text: 'Options' }),
        results
      ])
    });
    refresh();
    return layer;
  }

  /* ---------------------------------------------------------- plan my day */

  function planDayDialog(dayWall, opts) {
    opts = opts || {};
    dayWall = dayWall || T.nowWall();
    var plan = SCHED.planDay(dayWall, { now: T.nowWall() });
    var body = D.h('div.plan');
    var foot = D.h('div.plan__foot');

    var layer = UI.modal({
      size: 'lg',
      class: 'dialog--plan',
      title: 'Plan ' + (T.sameDay(dayWall, T.nowWall()) ? 'my day' : T.fmtDateLong(dayWall)),
      subtitle: 'A proposal. Nothing moves until you accept it.',
      body: body,
      footer: foot
    });

    function render() {
      D.clear(body);
      D.clear(foot);

      if (!plan.proposed.length) {
        body.appendChild(emptyState({
          icon: 'coffee',
          title: plan.stats.totalFree < 30 ? 'Your day is already full' : 'Nothing to schedule',
          body: plan.stats.totalFree < 30
            ? 'There is under half an hour of open time left, so there is nothing sensible to add.'
            : 'Every task that fits is already scheduled, or your list is clear. Enjoy the space.',
          actions: [{ label: 'Add a task', onClick: function () { layer.close(); UI.editTask(null); } }]
        }));
        foot.appendChild(D.h('div.sheet__foot-right',
          D.h('button.btn.btn--ghost', { type: 'button', onclick: function () { layer.close(); } }, 'Close')));
        return;
      }

      var stats = D.h('div.plan__stats', [
        stat('Free today', T.humanDuration(plan.stats.totalFree)),
        stat('This plan uses', T.humanDuration(plan.stats.scheduled)),
        stat('Left unscheduled', T.humanDuration(Math.max(0, plan.stats.remainingFree)), plan.stats.remainingFree < 60 ? 'warn' : null)
      ]);
      body.appendChild(stats);

      plan.warnings.forEach(function (w) {
        body.appendChild(D.h('div.notice.notice--' + (w.level === 'warn' ? 'warn' : 'info'), [
          D.icon(w.level === 'warn' ? 'alert' : 'sparkle', 15),
          D.h('span', { text: w.text })
        ]));
      });

      var timeline = D.h('ol.plan__list');
      var items = plan.fixed.concat(plan.proposed).sort(function (a, b) { return a.start - b.start; });
      items.forEach(function (item) {
        timeline.appendChild(planRow(item));
      });
      body.appendChild(timeline);

      foot.appendChild(D.h('div.sheet__foot-left',
        D.h('button.btn.btn--ghost.btn--sm', {
          type: 'button', onclick: function () { plan = SCHED.planDay(dayWall, { now: T.nowWall() }); render(); }
        }, [D.icon('repeat', 15), 'Rebuild'])));

      foot.appendChild(D.h('div.sheet__foot-right', [
        D.h('button.btn.btn--ghost', { type: 'button', onclick: function () { layer.close(); } }, 'Reject'),
        D.h('button.btn.btn--primary', { type: 'button', onclick: accept }, 'Accept selected')
      ]));
    }

    function stat(label, value, tone) {
      return D.h('div.plan__stat' + (tone ? '.is-' + tone : ''), [
        D.h('span.plan__stat-value', { text: value }),
        D.h('span.plan__stat-label', { text: label })
      ]);
    }

    function planRow(item) {
      var fixed = item.kind === 'fixed';
      var row = D.h('li.plan__row' + (fixed ? '.is-fixed' : '') + (item.kind === 'break' ? '.is-break' : ''));
      row.appendChild(D.h('span.plan__time', {
        text: T.fmtTime(item.start, use24()) + ' – ' + T.fmtTime(item.end, use24())
      }));

      var main = D.h('div.plan__main', [
        D.h('span.plan__title', { text: item.title }),
        fixed
          ? D.h('span.plan__tag', { text: 'Already scheduled' })
          : item.kind === 'break'
            ? D.h('span.plan__tag', { text: 'Breathing room' })
            : D.h('span.plan__why', {
              text: (item.partial ? 'A first ' + T.humanDuration(item.minutes) + ' — ' : '') +
                (item.reasons && item.reasons.length ? item.reasons.join(', ') : 'fits your free time')
            })
      ]);
      row.appendChild(main);

      if (!fixed) {
        var check = D.h('button.check', {
          type: 'button', role: 'checkbox', 'aria-checked': item.selected ? 'true' : 'false',
          'aria-label': 'Include ' + item.title,
          onclick: function () {
            item.selected = !item.selected;
            check.setAttribute('aria-checked', item.selected ? 'true' : 'false');
            row.classList.toggle('is-excluded', !item.selected);
            D.clear(check);
            if (item.selected) check.appendChild(D.icon('check', 13));
          }
        }, item.selected ? D.icon('check', 13) : null);
        row.appendChild(check);
      } else {
        row.appendChild(D.h('span.plan__lock', { 'aria-hidden': 'true' }, D.icon('clock', 14)));
      }
      return row;
    }

    function accept() {
      var chosen = plan.proposed.filter(function (p) { return p.selected; });
      if (!chosen.length) { UI.toast('Nothing selected'); return; }
      var created = 0;
      S.commit('Accept day plan', function (st) {
        chosen.forEach(function (item) {
          if (item.kind === 'break') {
            st.events.push(M.makeEvent({
              title: 'Break', start: T.iso(item.start), end: T.iso(item.end),
              type: 'block', categoryId: 'cat_relax'
            }));
            created++;
            return;
          }
          var ev = M.makeEvent({
            title: item.task.title,
            start: T.iso(item.start), end: T.iso(item.end),
            type: 'block',
            categoryId: item.task.categoryId,
            projectId: item.task.projectId,
            goalId: item.task.goalId,
            taskId: item.task.id,
            priority: item.task.priority,
            tags: item.task.tags
          });
          st.events.push(ev);
          for (var i = 0; i < st.tasks.length; i++) {
            if (st.tasks[i].id === item.task.id) {
              st.tasks[i].scheduledEventId = ev.id;
              if (st.tasks[i].status === 'inbox') st.tasks[i].status = 'planned';
            }
          }
          created++;
        });
      }, ['events', 'tasks']);

      UI.toast('Added ' + created + ' block' + (created === 1 ? '' : 's') + ' to ' + T.relativeDay(dayWall).toLowerCase(), { undo: true });
      layer.close();
      if (opts.onDone) opts.onDone();
    }

    render();
    return layer;
  }

  /* ------------------------------------------------------------ plan week */

  function planWeekDialog(startWall) {
    var start = T.startOfWeek(startWall || T.nowWall(), S.settings().firstDayOfWeek);
    var days = SCHED.planWeek(start, { now: T.nowWall() });
    var body = D.h('div.plan');

    var layer = UI.modal({
      size: 'lg',
      class: 'dialog--plan',
      title: 'Plan the week',
      subtitle: 'Week of ' + T.fmtDateShort(start) + '. Review each day, then accept.',
      body: body,
      footer: function (l) {
        return [
          D.h('div.sheet__foot-left', D.h('span.plan__hint', { text: 'Days you leave unchecked stay as they are.' })),
          D.h('div.sheet__foot-right', [
            D.h('button.btn.btn--ghost', { type: 'button', onclick: function () { l.close(); } }, 'Cancel'),
            D.h('button.btn.btn--primary', { type: 'button', onclick: acceptAll }, 'Accept selected')
          ])
        ];
      }
    });

    if (!days.some(function (d) { return d.proposed.length; })) {
      body.appendChild(emptyState({
        icon: 'coffee',
        title: 'Nothing left to place',
        body: 'Every task that fits this week already has time set aside.'
      }));
    }

    days.forEach(function (plan) {
      if (!plan.proposed.length) return;
      var section = D.h('section.plan__day');
      section.appendChild(D.h('h3.plan__day-title', [
        D.h('span', { text: T.DAY_NAMES[plan.day.getDay()] + ' ' + T.fmtDateShort(plan.day) }),
        D.h('span.plan__day-meta', { text: T.humanDuration(plan.stats.scheduled) + ' planned · ' + T.humanDuration(Math.max(0, plan.stats.remainingFree)) + ' free' })
      ]));
      var list = D.h('ol.plan__list');
      plan.proposed.forEach(function (item) {
        var row = D.h('li.plan__row' + (item.kind === 'break' ? '.is-break' : ''), [
          D.h('span.plan__time', { text: T.fmtTime(item.start, use24()) + ' – ' + T.fmtTime(item.end, use24()) }),
          D.h('div.plan__main', [
            D.h('span.plan__title', { text: item.title }),
            D.h('span.plan__why', { text: item.reasons && item.reasons.length ? item.reasons.join(', ') : 'fits your free time' })
          ])
        ]);
        var check = D.h('button.check', {
          type: 'button', role: 'checkbox', 'aria-checked': 'true',
          'aria-label': 'Include ' + item.title,
          onclick: function () {
            item.selected = !item.selected;
            check.setAttribute('aria-checked', item.selected ? 'true' : 'false');
            row.classList.toggle('is-excluded', !item.selected);
            D.clear(check);
            if (item.selected) check.appendChild(D.icon('check', 13));
          }
        }, D.icon('check', 13));
        row.appendChild(check);
        list.appendChild(row);
      });
      section.appendChild(list);
      body.appendChild(section);
    });

    function acceptAll() {
      var chosen = [];
      days.forEach(function (plan) {
        plan.proposed.forEach(function (item) { if (item.selected) chosen.push(item); });
      });
      if (!chosen.length) { UI.toast('Nothing selected'); return; }
      S.commit('Accept week plan', function (st) {
        chosen.forEach(function (item) {
          if (item.kind === 'break') {
            st.events.push(M.makeEvent({
              title: 'Break', start: T.iso(item.start), end: T.iso(item.end),
              type: 'block', categoryId: 'cat_relax'
            }));
            return;
          }
          var ev = M.makeEvent({
            title: item.task.title, start: T.iso(item.start), end: T.iso(item.end),
            type: 'block', categoryId: item.task.categoryId, projectId: item.task.projectId,
            goalId: item.task.goalId, taskId: item.task.id, priority: item.task.priority
          });
          st.events.push(ev);
          for (var i = 0; i < st.tasks.length; i++) {
            if (st.tasks[i].id === item.task.id) {
              st.tasks[i].scheduledEventId = ev.id;
              if (st.tasks[i].status === 'inbox') st.tasks[i].status = 'planned';
            }
          }
        });
      }, ['events', 'tasks']);
      UI.toast('Week planned — ' + chosen.length + ' blocks added', { undo: true });
      layer.close();
    }
    return layer;
  }

  /* ------------------------------------------------- what should I do now */

  function whatNowDialog() {
    var now = T.nowWall();
    var result = SCHED.whatNow(now);
    var body = D.h('div.whatnow');

    var layer = UI.modal({
      size: 'md',
      class: 'dialog--whatnow',
      title: 'What should I do now?',
      body: body
    });

    function render() {
      D.clear(body);
      body.appendChild(D.h('p.whatnow__headline', { text: result.headline }));

      if (result.mode === 'in-event') {
        body.appendChild(D.h('div.whatnow__card', [
          D.h('h3.whatnow__title', { text: result.event.title }),
          D.h('p.whatnow__meta', {
            text: T.fmtTime(result.event.startWall, use24()) + ' – ' + T.fmtTime(result.event.endWall, use24()) +
              ' · ' + T.humanDuration(result.untilMinutes) + ' left'
          }),
          D.h('div.whatnow__actions', [
            D.h('button.btn.btn--primary', {
              type: 'button', onclick: function () { layer.close(); UI.startFocus({ event: result.event }); }
            }, [D.icon('focus', 15), 'Focus on this']),
            result.next ? D.h('button.btn.btn--ghost', {
              type: 'button', onclick: function () { layer.close(); UI.go('calendar', { date: T.key(now), view: 'day' }); }
            }, 'See the rest of today') : null
          ])
        ]));
        return;
      }

      if (result.mode === 'no-time') {
        body.appendChild(D.h('div.whatnow__card', [
          D.h('p.whatnow__meta', { text: result.detail }),
          D.h('div.whatnow__actions', [
            D.h('button.btn.btn--ghost', {
              type: 'button', onclick: function () { layer.close(); UI.go('today'); }
            }, 'Open Today')
          ])
        ]));
        return;
      }

      if (result.mode === 'free') {
        body.appendChild(emptyState({
          icon: 'coffee',
          title: 'Nothing is asking for you',
          body: 'You have ' + T.humanDuration(result.usable) + ' and no task that needs doing right now. That is allowed.',
          actions: [
            { label: 'Capture a thought', onClick: function () { layer.close(); UI.go('capture'); } },
            { label: 'Plan my day', onClick: function () { layer.close(); planDayDialog(); } }
          ]
        }));
        return;
      }

      var rec = result.recommendation || result.partial;
      var task = rec.task;
      var estimate = Q.taskEstimate(task);
      var minutes = result.mode === 'partial' ? Math.min(result.usable, estimate) : estimate;

      body.appendChild(D.h('div.whatnow__card', [
        D.h('span.whatnow__label', { text: 'Recommended' }),
        D.h('h3.whatnow__title', { text: task.title }),
        D.h('p.whatnow__meta', {
          text: T.humanDuration(minutes) + (result.mode === 'partial' ? ' to make a start (' + T.humanDuration(estimate) + ' in total)' : '')
        }),
        D.h('div.whatnow__why', [
          D.h('span.whatnow__why-label', { text: 'Why' }),
          D.h('span', { text: capitalize(rec.reasons.join(', ')) + (rec.reasons.length ? ', and it fits the ' : 'It fits the ') + T.humanDuration(result.usable) + ' you have.' })
        ]),
        D.h('div.whatnow__actions', [
          D.h('button.btn.btn--primary', {
            type: 'button',
            onclick: function () {
              layer.close();
              UI.startFocus({ task: task, minutes: minutes });
            }
          }, [D.icon('play', 15), 'Start']),
          D.h('button.btn.btn--ghost', {
            type: 'button',
            onclick: function () {
              layer.close();
              findTimeDialog({
                minutes: estimate, title: task.title, before: task.due,
                onPick: function (slot) { A.scheduleTask(task.id, slot.start, slot.minutes); }
              });
            }
          }, 'Schedule for later'),
          result.alternatives.length ? D.h('button.btn.btn--ghost', {
            type: 'button', onclick: showAlternatives
          }, 'Something else') : null
        ])
      ]));

      if (result.next) {
        body.appendChild(D.h('p.whatnow__next', [
          D.icon('calendar', 14),
          D.h('span', { text: 'Next: ' + result.next.title + ' at ' + T.fmtTime(result.next.startWall, use24()) })
        ]));
      }
    }

    function showAlternatives() {
      D.clear(body);
      body.appendChild(D.h('p.whatnow__headline', { text: 'Other things that fit your ' + T.humanDuration(result.usable) }));
      var list = D.h('div.whatnow__alts');
      result.alternatives.forEach(function (alt) {
        list.appendChild(D.h('button.whatnow__alt', {
          type: 'button',
          onclick: function () { layer.close(); UI.startFocus({ task: alt.task, minutes: Q.taskEstimate(alt.task) }); }
        }, [
          D.h('span.whatnow__alt-title', { text: alt.task.title }),
          D.h('span.whatnow__alt-meta', { text: T.humanDuration(Q.taskEstimate(alt.task)) + (alt.reasons.length ? ' · ' + alt.reasons[0] : '') })
        ]));
      });
      body.appendChild(list);
      body.appendChild(D.h('button.btn.btn--ghost.btn--sm', { type: 'button', onclick: render }, [D.icon('chevronLeft', 14), 'Back']));
    }

    render();
    return layer;
  }

  function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  /* -------------------------------------------------------------- conflict */

  function conflictDialog(pair) {
    var a = pair[0], b = pair[1];
    var overlapStart = new Date(Math.max(a.startWall, b.startWall));
    var overlapEnd = new Date(Math.min(a.endWall, b.endWall));

    var layer = UI.modal({
      size: 'md',
      title: 'Schedule conflict',
      subtitle: 'These two overlap by ' + T.humanDuration(T.diffMinutes(overlapStart, overlapEnd)) + '. Nothing has been changed.',
      body: D.h('div.conflict', [
        D.h('div.conflict__pair', [conflictCard(a), D.h('span.conflict__vs', { text: 'overlaps' }), conflictCard(b)]),
        D.h('div.conflict__options', [
          option('Keep both', 'Leave the overlap as it is — sometimes that is genuinely fine.', function () {
            layer.close();
            UI.toast('Left as they are');
          }),
          option('Move “' + trim(a.title) + '”', 'Find another time for the first one.', function () {
            layer.close();
            findTimeDialog({
              minutes: T.diffMinutes(a.startWall, a.endWall), title: a.title,
              onPick: function (slot) { A.moveEvent(a, slot.start, T.addMinutes(slot.start, slot.minutes), a.isInstance ? 'this' : 'all'); }
            });
          }),
          option('Move “' + trim(b.title) + '”', 'Find another time for the second one.', function () {
            layer.close();
            findTimeDialog({
              minutes: T.diffMinutes(b.startWall, b.endWall), title: b.title,
              onPick: function (slot) { A.moveEvent(b, slot.start, T.addMinutes(slot.start, slot.minutes), b.isInstance ? 'this' : 'all'); }
            });
          }),
          option('Shorten the first one', 'End “' + trim(a.title) + '” when the other begins.', function () {
            A.updateEvent(a, { end: T.iso(b.startWall) }, a.isInstance ? 'this' : 'all', { message: 'Shortened' });
            layer.close();
          })
        ])
      ])
    });

    function option(label, hint, onClick) {
      return D.h('button.scope-choice', { type: 'button', onclick: onClick }, [
        D.h('span.scope-choice__label', { text: label }),
        D.h('span.scope-choice__hint', { text: hint })
      ]);
    }
    function trim(s) { return s.length > 24 ? s.slice(0, 23) + '…' : s; }
    function conflictCard(ev) {
      return D.h('div.conflict__card', {
        style: { borderLeftColor: Q.eventColor(ev) }
      }, [
        D.h('strong', { text: ev.title }),
        D.h('span', { text: T.fmtTime(ev.startWall, use24()) + ' – ' + T.fmtTime(ev.endWall, use24()) })
      ]);
    }
    return layer;
  }

  /* -------------------------------------------------------------- recovery */

  /* Missing something should feel like a fork in the road, not a failure. */
  function recoveryDialog(opts) {
    opts = opts || {};
    var now = T.nowWall();
    var tasks = opts.tasks || Q.overdueTasks(now);
    var body = D.h('div.recovery');

    var layer = UI.modal({
      size: 'md',
      title: tasks.length === 1 ? 'One thing slipped' : tasks.length + ' things slipped',
      subtitle: 'Plans change. Pick what to do with each one.',
      body: body
    });

    function render() {
      D.clear(body);
      var remaining = tasks.filter(function (t) {
        var live = S.get('tasks', t.id);
        return live && live.status !== 'completed' && live.status !== 'archived';
      });
      if (!remaining.length) {
        body.appendChild(emptyState({
          icon: 'check', title: 'All caught up',
          body: 'Nothing is overdue any more.'
        }));
        return;
      }
      remaining.forEach(function (task) {
        body.appendChild(recoveryRow(task, render, layer));
      });
      if (remaining.length > 1) {
        body.appendChild(D.h('div.recovery__bulk', [
          D.h('button.btn.btn--ghost.btn--sm', {
            type: 'button',
            onclick: function () {
              var tomorrow = T.startOfDay(T.addDays(now, 1));
              S.commit('Move overdue tasks', function (st) {
                st.tasks.forEach(function (t) {
                  if (remaining.some(function (r) { return r.id === t.id; })) {
                    var d = new Date(tomorrow);
                    d.setHours(23, 59, 0, 0);
                    t.due = T.iso(d);
                    t.hasDueTime = false;
                  }
                });
              }, ['tasks']);
              UI.toast('Moved ' + remaining.length + ' tasks to tomorrow', { undo: true });
              render();
            }
          }, 'Move all to tomorrow')
        ]));
      }
    }

    render();
    return layer;
  }

  function recoveryRow(task, refresh, layer) {
    var due = task.due ? T.w(task.due) : null;
    var row = D.h('div.recovery__row');
    row.appendChild(D.h('div.recovery__head', [
      D.h('span.recovery__title', { text: task.title }),
      due ? D.h('span.recovery__due', { text: T.relativeTime(due) }) : null
    ]));

    var actions = D.h('div.recovery__actions', [
      act('Do today', function () {
        A.rescheduleTask(task.id, T.endOfDay(T.nowWall()), 'Moved to today');
        refresh();
      }),
      act('Tomorrow', function () {
        A.rescheduleTask(task.id, T.endOfDay(T.addDays(T.nowWall(), 1)), 'Moved to tomorrow');
        refresh();
      }),
      act('Next free slot', function () {
        var slots = SCHED.findTime(Q.taskEstimate(task), { days: 7, limit: 1 });
        if (!slots.length) { UI.toast('No free block that long in the next week'); return; }
        A.scheduleTask(task.id, slots[0].start, slots[0].minutes);
        refresh();
      }),
      act('Break it up', function () {
        layer.close();
        breakDownDialog(task);
      }),
      act('Mark done', function () { A.completeTask(task.id, true); refresh(); }),
      act('Drop it', function () {
        UI.confirm({
          title: 'Delete this task?', message: '“' + task.title + '” will be removed.',
          confirmLabel: 'Delete', tone: 'danger'
        }).then(function (ok) { if (ok) { A.deleteTask(task.id); refresh(); } });
      }, true)
    ]);
    row.appendChild(actions);
    return row;

    function act(label, onClick, danger) {
      return D.h('button.btn.btn--ghost.btn--sm' + (danger ? '.btn--danger-text' : ''), { type: 'button', onclick: onClick }, label);
    }
  }

  /* Splitting an intimidating task into steps is often the whole fix. */
  function breakDownDialog(task) {
    var lines = D.h('textarea.input.input--area', {
      rows: 5, 'data-autofocus': '',
      placeholder: 'One step per line, e.g.\nOutline the argument\nWrite the introduction\nFind three sources'
    });
    lines.value = suggestSteps(task).join('\n');

    return UI.modal({
      size: 'sm',
      title: 'Break it into steps',
      subtitle: '“' + task.title + '”',
      body: D.h('div.editor', [
        UI.F.field('Steps', lines, { hint: 'The original task is replaced by these.' })
      ]),
      footer: function (l) {
        return D.h('div.sheet__foot-right', [
          D.h('button.btn.btn--ghost', { type: 'button', onclick: function () { l.close(); } }, 'Cancel'),
          D.h('button.btn.btn--primary', {
            type: 'button',
            onclick: function () {
              var titles = lines.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
              if (titles.length < 2) { UI.toast('Give it at least two steps'); return; }
              A.breakDownTask(task.id, titles);
              l.close();
            }
          }, 'Split it up')
        ]);
      }
    });
  }

  /* Generic starting points — the user edits them; nothing is invented as fact. */
  function suggestSteps(task) {
    var t = String(task.title).toLowerCase();
    if (/essay|paper|report|writ/.test(t)) return ['Outline it', 'Write a first draft', 'Revise and check sources'];
    if (/study|revise|test|exam|quiz/.test(t)) return ['Review the notes', 'Make practice questions', 'Do a timed run-through'];
    if (/present|slide|deck/.test(t)) return ['Sketch the structure', 'Build the slides', 'Practise it out loud'];
    if (/project/.test(t)) return ['Plan the steps', 'Do the main work', 'Review and finish'];
    return ['First part', 'Second part'];
  }

  /* ----------------------------------------------------------- suggestions */

  function suggestionCard(s, onRefresh) {
    var card = D.h('article.suggestion' + (s.tone === 'urgent' ? '.is-urgent' : s.tone === 'warn' ? '.is-warn' : ''));
    card.appendChild(D.h('div.suggestion__body', [
      D.h('p.suggestion__text', { text: s.text }),
      D.h('p.suggestion__why', [D.icon('compass', 13), D.h('span', { text: s.why })])
    ]));
    var actions = D.h('div.suggestion__actions');
    if (s.action) {
      actions.appendChild(D.h('button.btn.btn--sm.btn--primary', {
        type: 'button', onclick: function () { runSuggestion(s.action); }
      }, s.action.label));
    }
    actions.appendChild(D.h('button.btn.btn--sm.btn--ghost', {
      type: 'button',
      onclick: function () {
        SCHED.dismissSuggestion(s.id);
        UI.toast('Suggestion dismissed for today');
        if (onRefresh) onRefresh();
      }
    }, 'Dismiss'));
    card.appendChild(actions);
    return card;
  }

  function runSuggestion(action) {
    switch (action.type) {
      case 'find-time':
        findTimeDialog({
          minutes: action.minutes || 60, title: action.title,
          before: action.deadlineId ? (S.get('deadlines', action.deadlineId) || {}).due : null,
          onPick: function (slot) {
            var dl = action.deadlineId ? S.get('deadlines', action.deadlineId) : null;
            A.createEvent({
              title: dl ? 'Work on ' + dl.title : action.title,
              start: T.iso(slot.start),
              end: T.iso(T.addMinutes(slot.start, slot.minutes)),
              type: 'block',
              categoryId: 'cat_homework',
              projectId: dl ? dl.projectId : null
            });
          }
        });
        break;
      case 'recover': recoveryDialog(); break;
      case 'goto-day': UI.go('calendar', { date: action.day, view: 'day' }); break;
      case 'goto': UI.go(action.route); break;
      case 'schedule-task':
        A.scheduleTask(action.taskId, new Date(action.start));
        break;
    }
  }

  /* -------------------------------------------------------------- helpers */

  /* An empty state should teach, not apologise. */
  function emptyState(opts) {
    var node = D.h('div.empty');
    node.appendChild(D.h('span.empty__icon', D.icon(opts.icon || 'sparkle', 26)));
    node.appendChild(D.h('h3.empty__title', { text: opts.title }));
    if (opts.body) node.appendChild(D.h('p.empty__body', { text: opts.body }));
    if (opts.actions && opts.actions.length) {
      node.appendChild(D.h('div.empty__actions', opts.actions.map(function (a, i) {
        return D.h('button.btn.btn--sm' + (i === 0 ? '.btn--primary' : '.btn--ghost'), {
          type: 'button', onclick: a.onClick
        }, a.label);
      })));
    }
    return node;
  }

  Object.assign(UI, {
    findTimeDialog: findTimeDialog,
    planDayDialog: planDayDialog,
    planWeekDialog: planWeekDialog,
    whatNowDialog: whatNowDialog,
    conflictDialog: conflictDialog,
    recoveryDialog: recoveryDialog,
    breakDownDialog: breakDownDialog,
    suggestionCard: suggestionCard,
    runSuggestion: runSuggestion,
    emptyState: emptyState
  });
})(window);

/* Cadence — focus mode. One thing, the time left, and a way out. */
(function (global) {
  'use strict';
  var UI = global.UI = global.UI || {};

  var session = null;
  var overlay = null;
  var tick = null;

  function startFocus(opts) {
    opts = opts || {};
    var task = opts.task || null;
    var event = opts.event || null;
    var minutes = opts.minutes ||
      (event ? Math.max(5, T.diffMinutes(T.nowWall(), event.endWall)) :
        (task ? Q.taskEstimate(task) : 25));

    session = {
      taskId: task ? task.id : null,
      eventId: event ? (event.seriesId || event.id) : null,
      title: task ? task.title : (event ? event.title : 'Focus'),
      plannedMinutes: minutes,
      startedAt: Date.now(),
      elapsedBefore: 0,
      running: true
    };
    render();
    D.announce('Focus mode started for ' + session.title);
  }

  function elapsedMs() {
    if (!session) return 0;
    return session.elapsedBefore + (session.running ? Date.now() - session.startedAt : 0);
  }

  function render() {
    if (overlay) teardown();
    overlay = D.h('div.focus', { role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Focus mode' });

    var next = nextEvent();
    var ring = buildRing();

    var titleNode = D.h('h1.focus__title', { text: session.title });
    var remainNode = D.h('div.focus__remaining', { 'aria-live': 'off' });
    var stateNode = D.h('p.focus__state');
    var progressLabel = D.h('p.focus__progress-label');

    var controls = D.h('div.focus__controls');
    var pauseBtn = D.h('button.btn.btn--ghost.focus__btn', {
      type: 'button',
      onclick: function () {
        if (session.running) {
          session.elapsedBefore = elapsedMs();
          session.running = false;
        } else {
          session.startedAt = Date.now();
          session.running = true;
        }
        paintControls();
        update();
      }
    });
    var completeBtn = D.h('button.btn.btn--primary.focus__btn', {
      type: 'button', onclick: complete
    }, [D.icon('check', 16), 'Complete']);
    var extendBtn = D.h('button.btn.btn--ghost.focus__btn', {
      type: 'button',
      onclick: function () {
        session.plannedMinutes += 10;
        UI.toast('Ten more minutes');
        update();
      }
    }, [D.icon('plus', 16), '10 min']);
    var rescheduleBtn = D.h('button.btn.btn--ghost.focus__btn', {
      type: 'button', onclick: reschedule
    }, [D.icon('calendar', 16), 'Reschedule']);

    function paintControls() {
      D.clear(pauseBtn);
      D.append(pauseBtn, [D.icon(session.running ? 'pause' : 'play', 16), session.running ? 'Pause' : 'Resume']);
      pauseBtn.setAttribute('aria-label', session.running ? 'Pause the timer' : 'Resume the timer');
    }
    paintControls();

    controls.appendChild(pauseBtn);
    controls.appendChild(completeBtn);
    controls.appendChild(extendBtn);
    if (session.taskId) controls.appendChild(rescheduleBtn);

    overlay.appendChild(D.h('div.focus__inner', [
      D.h('div.focus__top', [
        D.h('span.focus__eyebrow', { text: 'Focusing' }),
        D.h('button.btn.btn--ghost.btn--sm', {
          type: 'button', onclick: exit, 'aria-label': 'Leave focus mode'
        }, [D.icon('x', 15), 'Exit'])
      ]),
      ring.node,
      titleNode,
      remainNode,
      stateNode,
      progressLabel,
      controls,
      next ? D.h('p.focus__next', [
        D.icon('calendar', 14),
        D.h('span', { text: 'Next: ' + next.title + ' at ' + T.fmtTime(next.startWall, S.settings().use24Hour) })
      ]) : null
    ]));

    document.body.appendChild(overlay);
    document.documentElement.classList.add('is-focus');
    var release = D.trapFocus(overlay, exit);
    overlay._release = release;

    function update() {
      var totalMs = session.plannedMinutes * 60000;
      var used = elapsedMs();
      var remaining = totalMs - used;
      var over = remaining < 0;
      var show = Math.abs(remaining);
      var mins = Math.floor(show / 60000);
      var secs = Math.floor((show % 60000) / 1000);
      remainNode.textContent = (over ? '+' : '') + mins + ':' + T.pad(secs);
      remainNode.classList.toggle('is-over', over);
      stateNode.textContent = session.running
        ? (over ? 'Past the time you set — finish when you are ready.' : 'Time remaining')
        : 'Paused';
      var pct = Math.max(0, Math.min(1, used / totalMs));
      ring.set(pct, over);
      progressLabel.textContent = T.humanDuration(Math.round(used / 60000)) + ' of ' + T.humanDuration(session.plannedMinutes) + ' done';
      progressLabel.setAttribute('aria-label', Math.round(pct * 100) + ' per cent of the planned time used');
    }

    update();
    tick = setInterval(update, 500);
    setTimeout(function () { completeBtn.focus(); }, 40);
  }

  function buildRing() {
    var size = 190, stroke = 8, r = (size - stroke) / 2, c = 2 * Math.PI * r;
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 ' + size + ' ' + size);
    svg.setAttribute('width', size);
    svg.setAttribute('height', size);
    svg.setAttribute('class', 'focus__ring');
    svg.setAttribute('aria-hidden', 'true');
    var track = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    track.setAttribute('cx', size / 2); track.setAttribute('cy', size / 2); track.setAttribute('r', r);
    track.setAttribute('class', 'focus__ring-track');
    track.setAttribute('stroke-width', stroke);
    track.setAttribute('fill', 'none');
    var bar = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    bar.setAttribute('cx', size / 2); bar.setAttribute('cy', size / 2); bar.setAttribute('r', r);
    bar.setAttribute('class', 'focus__ring-bar');
    bar.setAttribute('stroke-width', stroke);
    bar.setAttribute('fill', 'none');
    bar.setAttribute('stroke-dasharray', c);
    bar.setAttribute('stroke-dashoffset', c);
    bar.setAttribute('transform', 'rotate(-90 ' + size / 2 + ' ' + size / 2 + ')');
    svg.appendChild(track); svg.appendChild(bar);
    return {
      node: D.h('div.focus__ring-wrap', svg),
      set: function (pct, over) {
        bar.setAttribute('stroke-dashoffset', String(c * (1 - Math.min(1, pct))));
        bar.classList.toggle('is-over', !!over);
      }
    };
  }

  function nextEvent() {
    var now = T.nowWall();
    return Q.eventsInRange(now, T.endOfDay(T.addDays(now, 1)), { ignoreLayers: true })
      .filter(function (e) { return !e.allDay && e.startWall > now; })
      .sort(function (a, b) { return a.startWall - b.startWall; })[0];
  }

  function complete() {
    var minutes = Math.round(elapsedMs() / 60000);
    if (session.taskId) {
      A.completeTask(session.taskId, true);
    } else if (session.eventId) {
      var ev = S.get('events', session.eventId);
      if (ev) S.update('events', ev.id, { done: true }, 'Complete event');
      UI.toast('Marked done');
    }
    D.announce('Completed after ' + T.humanDuration(minutes));
    exit();
  }

  function reschedule() {
    var taskId = session.taskId;
    exit();
    var task = S.get('tasks', taskId);
    if (!task) return;
    UI.findTimeDialog({
      minutes: Q.taskEstimate(task), title: task.title, before: task.due,
      onPick: function (slot) { A.scheduleTask(task.id, slot.start, slot.minutes); }
    });
  }

  function exit() {
    teardown();
    session = null;
  }

  function teardown() {
    if (tick) { clearInterval(tick); tick = null; }
    if (overlay) {
      if (overlay._release) overlay._release();
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      overlay = null;
    }
    document.documentElement.classList.remove('is-focus');
  }

  /* Entry point when nothing specific was chosen: pick the best next thing. */
  function focusEntry() {
    if (session) { render(); return; }
    var result = SCHED.whatNow();
    if (result.mode === 'in-event') { startFocus({ event: result.event }); return; }
    var rec = result.recommendation || result.partial;
    if (rec) { startFocus({ task: rec.task, minutes: Math.min(result.usable || 25, Q.taskEstimate(rec.task)) }); return; }
    UI.whatNowDialog();
  }

  UI.startFocus = startFocus;
  UI.focusEntry = focusEntry;
  UI.exitFocus = exit;
  UI.focusActive = function () { return !!session; };
})(window);

/* Cadence — the command palette (⌘K). Commands and universal search in one
   box, because power users should never have to remember which is which. */
(function (global) {
  'use strict';
  var UI = global.UI = global.UI || {};

  var open = false;
  var layer = null;

  function commands() {
    return [
      { id: 'add-quick', label: 'Quick add', hint: 'Write it in plain language', icon: 'sparkle', shortcut: 'C', run: function () { UI.quickAdd(); } },
      { id: 'add-event', label: 'New event', icon: 'calendar', shortcut: 'N', run: function () { UI.editEvent(null); } },
      { id: 'add-task', label: 'New task', icon: 'checkSquare', shortcut: 'T', run: function () { UI.editTask(null); } },
      { id: 'add-deadline', label: 'New deadline', icon: 'flag', run: function () { UI.editDeadline(null); } },
      { id: 'add-note', label: 'New note', icon: 'note', run: function () { UI.editNote(null); } },
      { id: 'add-project', label: 'New project', icon: 'folder', run: function () { UI.editProject(null); } },
      { id: 'add-goal', label: 'New goal', icon: 'target', run: function () { UI.editGoal(null); } },
      { id: 'add-habit', label: 'New habit', icon: 'repeat', run: function () { UI.editHabit(null); } },
      { id: 'organize', label: 'Organize a brain dump', hint: 'Turn messy text into a plan', icon: 'zap', run: function () { UI.organizeDialog(); } },
      { id: 'what-now', label: 'What should I do now?', icon: 'compass', shortcut: 'W', run: function () { UI.whatNowDialog(); } },
      { id: 'plan-day', label: 'Plan my day', icon: 'sparkle', shortcut: 'P', run: function () { UI.planDayDialog(); } },
      { id: 'plan-week', label: 'Plan my week', icon: 'grid', run: function () { UI.planWeekDialog(); } },
      { id: 'find-time', label: 'Find time…', icon: 'search', run: function () { UI.findTimeDialog({ minutes: 60 }); } },
      { id: 'focus', label: 'Start focus mode', icon: 'focus', shortcut: 'F', run: function () { UI.focusEntry(); } },
      { id: 'recover', label: 'Reschedule what I missed', icon: 'undo', run: function () { UI.recoveryDialog(); } },
      { id: 'go-today', label: 'Go to today', icon: 'home', shortcut: 'D', run: function () { UI.go('today'); } },
      { id: 'go-calendar', label: 'Go to calendar', icon: 'calendar', run: function () { UI.go('calendar'); } },
      { id: 'go-tasks', label: 'Go to tasks', icon: 'checkSquare', run: function () { UI.go('tasks'); } },
      { id: 'go-notes', label: 'Go to notes', icon: 'note', run: function () { UI.go('notes'); } },
      { id: 'go-projects', label: 'Go to projects', icon: 'folder', run: function () { UI.go('projects'); } },
      { id: 'go-goals', label: 'Go to goals', icon: 'target', run: function () { UI.go('goals'); } },
      { id: 'go-habits', label: 'Go to habits', icon: 'repeat', run: function () { UI.go('habits'); } },
      { id: 'go-planning', label: 'Go to planning', icon: 'compass', run: function () { UI.go('planning'); } },
      { id: 'go-insights', label: 'Go to insights', icon: 'chart', run: function () { UI.go('insights'); } },
      { id: 'go-capture', label: 'Open the capture inbox', icon: 'inbox', run: function () { UI.go('capture'); } },
      { id: 'go-settings', label: 'Open settings', icon: 'settings', run: function () { UI.go('settings'); } },
      { id: 'view-day', label: 'Calendar: day view', icon: 'list', run: function () { UI.go('calendar', { view: 'day' }); } },
      { id: 'view-week', label: 'Calendar: week view', icon: 'grid', run: function () { UI.go('calendar', { view: 'week' }); } },
      { id: 'view-month', label: 'Calendar: month view', icon: 'grid', run: function () { UI.go('calendar', { view: 'month' }); } },
      { id: 'view-agenda', label: 'Calendar: agenda view', icon: 'list', run: function () { UI.go('calendar', { view: 'agenda' }); } },
      { id: 'view-year', label: 'Calendar: year view', icon: 'grid', run: function () { UI.go('calendar', { view: 'year' }); } },
      { id: 'view-timeline', label: 'Calendar: timeline view', icon: 'chart', run: function () { UI.go('calendar', { view: 'timeline' }); } },
      { id: 'theme', label: 'Switch light / dark', icon: 'moon', run: function () { UI.cycleTheme(); } },
      { id: 'undo', label: 'Undo', icon: 'undo', shortcut: '⌘Z', run: function () { A.undo(); } },
      { id: 'review-week', label: 'Weekly review', icon: 'chart', run: function () { UI.go('planning', { tab: 'week' }); } },
      { id: 'review-month', label: 'Monthly review', icon: 'chart', run: function () { UI.go('planning', { tab: 'month' }); } }
    ];
  }

  function paletteOpen(initial) {
    if (open) return;
    open = true;

    var input = D.h('input.palette__input', {
      type: 'text',
      placeholder: 'Search everything, or type a command…',
      'aria-label': 'Search or run a command',
      'aria-controls': 'palette-list',
      'aria-expanded': 'true',
      role: 'combobox',
      autocomplete: 'off',
      spellcheck: 'false',
      value: initial || '',
      'data-autofocus': ''
    });

    var list = D.h('div.palette__list', { id: 'palette-list', role: 'listbox' });
    var rows = [];
    var active = 0;

    function render() {
      var q = input.value.trim();
      rows = [];
      D.clear(list);

      var groups = [];

      // Jump to a date when the query looks like one.
      var dateGuess = q ? parseDateQuery(q) : null;
      if (dateGuess) {
        groups.push({
          title: 'Jump to', items: [{
            label: 'Go to ' + T.fmtDateLong(dateGuess),
            icon: 'calendar',
            run: function () { UI.go('calendar', { date: T.key(dateGuess) }); }
          }]
        });
      }

      var cmds = commands();
      if (q) {
        var scored = [];
        cmds.forEach(function (c) {
          var res = SEARCH.search ? null : null;
          var idx = c.label.toLowerCase().indexOf(q.toLowerCase());
          var sub = subsequence(q.toLowerCase(), c.label.toLowerCase());
          if (idx >= 0) scored.push({ cmd: c, score: 1000 - idx });
          else if (sub) scored.push({ cmd: c, score: 400 });
        });
        scored.sort(function (a, b) { return b.score - a.score; });
        if (scored.length) {
          groups.push({ title: 'Commands', items: scored.slice(0, 6).map(toCmdItem) });
        }
      } else {
        groups.push({ title: 'Actions', items: cmds.slice(0, 8).map(function (c) { return toCmdItem({ cmd: c }); }) });
      }

      if (q) {
        var results = SEARCH.search(q, { limit: 24 });
        var byType = {};
        results.forEach(function (r) {
          (byType[r.doc.type] || (byType[r.doc.type] = [])).push(r);
        });
        ['event', 'task', 'deadline', 'note', 'project', 'goal', 'habit', 'person', 'location', 'tag'].forEach(function (type) {
          var items = byType[type];
          if (!items || !items.length) return;
          var meta = SEARCH.typeMeta(type);
          groups.push({
            title: meta.label + 's',
            items: items.slice(0, 5).map(function (r) {
              return {
                label: r.doc.title,
                positions: r.positions,
                hint: r.doc.subtitle,
                icon: meta.icon,
                run: function () { UI.openSearchResult(r.doc); }
              };
            })
          });
        });
      }

      if (!groups.length || !groups.some(function (g) { return g.items.length; })) {
        list.appendChild(D.h('p.palette__empty', { text: 'Nothing matches “' + q + '”.' }));
        list.appendChild(D.h('div.palette__empty-actions', [
          D.h('button.btn.btn--sm.btn--primary', {
            type: 'button', onclick: function () { close(); UI.quickAdd({ text: q }); }
          }, 'Add “' + q + '”')
        ]));
        return;
      }

      groups.forEach(function (group) {
        if (!group.items.length) return;
        list.appendChild(D.h('div.palette__group', { text: group.title }));
        group.items.forEach(function (item) {
          var row = D.h('button.palette__row', {
            type: 'button', role: 'option', 'aria-selected': 'false',
            onclick: function () { close(); item.run(); }
          });
          row.appendChild(D.h('span.palette__icon', D.icon(item.icon || 'circle', 16)));
          var labelNode = D.h('span.palette__label');
          if (item.positions && item.positions.length) {
            SEARCH.highlight(item.label, item.positions).forEach(function (part) {
              labelNode.appendChild(part.hit ? D.h('mark', { text: part.text }) : document.createTextNode(part.text));
            });
          } else labelNode.textContent = item.label;
          row.appendChild(labelNode);
          if (item.hint) row.appendChild(D.h('span.palette__hint', { text: item.hint }));
          if (item.shortcut) row.appendChild(D.h('kbd.palette__kbd', { text: item.shortcut }));
          rows.push(row);
          list.appendChild(row);
        });
      });

      active = 0;
      paint();
    }

    function toCmdItem(entry) {
      var c = entry.cmd;
      return {
        label: c.label, hint: c.hint, icon: c.icon, shortcut: c.shortcut,
        run: function () { c.run(); }
      };
    }

    function paint() {
      rows.forEach(function (r, i) {
        var on = i === active;
        r.classList.toggle('is-active', on);
        r.setAttribute('aria-selected', on ? 'true' : 'false');
        if (on) {
          input.setAttribute('aria-activedescendant', r.id || (r.id = 'pal-row-' + i));
          r.scrollIntoView({ block: 'nearest' });
        }
      });
    }

    input.addEventListener('input', D.debounce(render, 60));
    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { e.preventDefault(); if (rows.length) { active = (active + 1) % rows.length; paint(); } }
      else if (e.key === 'ArrowUp') { e.preventDefault(); if (rows.length) { active = (active - 1 + rows.length) % rows.length; paint(); } }
      else if (e.key === 'Enter') {
        e.preventDefault();
        if (rows[active]) rows[active].click();
      } else if (e.key === 'Escape') { e.preventDefault(); close(); }
    });

    layer = UI.modal({
      size: 'md',
      class: 'dialog--palette',
      dismissible: true,
      body: D.h('div.palette', [
        D.h('div.palette__head', [D.icon('search', 17), input]),
        list,
        D.h('div.palette__foot', [
          hintKey('↑↓', 'navigate'), hintKey('↵', 'select'), hintKey('esc', 'close')
        ])
      ]),
      onClose: function () { open = false; layer = null; }
    });
    // The palette is a search box, not a titled dialog.
    var head = D.qs('.dialog__head', layer.node);
    if (head) head.remove();

    render();
    return layer;
  }

  function hintKey(key, label) {
    return D.h('span.palette__foot-item', [D.h('kbd', { text: key }), D.h('span', { text: label })]);
  }

  function close() { if (layer) layer.close(); open = false; }

  function subsequence(needle, hay) {
    var i = 0;
    for (var j = 0; j < hay.length && i < needle.length; j++) {
      if (hay.charAt(j) === needle.charAt(i)) i++;
    }
    return i === needle.length;
  }

  /* "go to march 3", "tomorrow", "next friday" → a date to jump to. */
  function parseDateQuery(q) {
    var cleaned = q.replace(/^(?:go\s+to|jump\s+to|open)\s+/i, '');
    if (!/\d|today|tomorrow|monday|tuesday|wednesday|thursday|friday|saturday|sunday|jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec|next|week/i.test(cleaned)) return null;
    var parsed = NLP.parse(cleaned);
    return parsed.dayWall || null;
  }

  UI.palette = paletteOpen;
  UI.paletteOpen = function () { return open; };
