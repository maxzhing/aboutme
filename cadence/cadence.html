    }, priority && priority.rank <= 1 ? D.icon('zap', 12) : null);

    var actions = D.h('div.trow__actions', [
      D.iconButton('calendar', 'Find time for ' + task.title, function () {
        UI.findTimeDialog({
          minutes: Q.taskEstimate(task), title: task.title, before: task.due,
          onPick: function (slot) { A.scheduleTask(task.id, slot.start, slot.minutes); }
        });
      }, { size: 15 }),
      D.iconButton('more', 'More actions for ' + task.title, function (e) { taskMenu(e.currentTarget, task); }, { size: 15 })
    ]);

    row.appendChild(handle);
    row.appendChild(check);
    row.appendChild(D.h('div.trow__main', [titleBtn, meta]));
    row.appendChild(flag);
    row.appendChild(actions);

    attachTaskDrag(row, handle, task, group, index);
    return row;
  }

  /* Dragging a task does two things depending on where it lands: reorder inside
     the list, or schedule it if it is dropped on the calendar dock. */
  function attachTaskDrag(row, handle, task, group, index) {
    handle.addEventListener('pointerdown', function (e) {
      var list = row.parentElement;
      var siblings = D.qsa('.trow', list);
      var placeholder = null;

      DND.drag(e, {
        onStart: function () {
          DND.setPayload({ kind: 'task', id: task.id, minutes: Q.taskEstimate(task), title: task.title });
          DND.showGhost(task.title, Q.taskColor(task));
          row.classList.add('is-dragging-src');
          placeholder = D.h('li.trow-placeholder');
          placeholder.style.height = row.offsetHeight + 'px';
          list.insertBefore(placeholder, row.nextSibling);
        },
        onMove: function (st) {
          var over = document.elementFromPoint(st.x, st.y);
          var target = over && over.closest ? over.closest('.trow') : null;
          if (target && target !== row && target.parentElement === list) {
            var rect = target.getBoundingClientRect();
            var after = st.y > rect.top + rect.height / 2;
            list.insertBefore(placeholder, after ? target.nextSibling : target);
          }
        },
        onEnd: function (st) {
          row.classList.remove('is-dragging-src');
          var zone = DND.zoneAt(st.x, st.y);
          if (zone && zone.dataset.dropzone === 'timegrid') {
            if (placeholder && placeholder.parentNode) placeholder.parentNode.removeChild(placeholder);
            return; // the calendar column handles the drop
          }
          if (placeholder && placeholder.parentNode) {
            list.insertBefore(row, placeholder);
            placeholder.parentNode.removeChild(placeholder);
          }
          var ids = D.qsa('.trow', list).map(function (n) { return n.dataset.task; });
          A.reorderTasks(ids);
        },
        onCancel: function () {
          row.classList.remove('is-dragging-src');
          if (placeholder && placeholder.parentNode) placeholder.parentNode.removeChild(placeholder);
        }
      });
    });
  }

  function taskMenu(anchor, task) {
    var now = T.nowWall();
    UI.menu(anchor, [
      { label: 'Edit', icon: 'edit', onClick: function () { UI.editTask(task); } },
      { label: task.status === 'completed' ? 'Reopen' : 'Mark complete', icon: 'check', onClick: function () { A.completeTask(task.id); } },
      { separator: true },
      { heading: 'Move to' },
      { label: 'Today', onClick: function () { A.rescheduleTask(task.id, T.endOfDay(now)); } },
      { label: 'Tomorrow', onClick: function () { A.rescheduleTask(task.id, T.endOfDay(T.addDays(now, 1))); } },
      { label: 'Next week', onClick: function () { A.rescheduleTask(task.id, T.endOfDay(T.addDays(now, 7))); } },
      { label: 'No date', onClick: function () { A.updateTask(task.id, { due: null, hasDueTime: false }, 'Date removed'); } },
      { separator: true },
      {
        label: 'Find time', icon: 'search', onClick: function () {
          UI.findTimeDialog({
            minutes: Q.taskEstimate(task), title: task.title, before: task.due,
            onPick: function (slot) { A.scheduleTask(task.id, slot.start, slot.minutes); }
          });
        }
      },
      task.scheduledEventId ? { label: 'Remove from calendar', icon: 'x', onClick: function () { A.unscheduleTask(task.id); } } : null,
      { label: 'Break into steps', icon: 'list', onClick: function () { UI.breakDownDialog(task); } },
      { label: 'Start focus', icon: 'focus', onClick: function () { UI.startFocus({ task: task }); } },
      { separator: true },
      {
        label: 'Delete', icon: 'trash', danger: true, onClick: function () {
          UI.confirm({
            title: 'Delete this task?', message: '“' + task.title + '” will be removed.',
            confirmLabel: 'Delete', tone: 'danger'
          }).then(function (ok) { if (ok) A.deleteTask(task.id); });
        }
      }
    ].filter(Boolean), { align: 'right' });
  }

  function emptyForFilter() {
    var messages = {
      open: { title: 'Nothing open', body: 'Every task is done or archived.' },
      today: { title: 'Nothing due today', body: 'No task carries today’s date.' },
      week: { title: 'Nothing due this week', body: 'Your week is clear of dated tasks.' },
      overdue: { title: 'Nothing overdue', body: 'You are caught up.' },
      inbox: { title: 'Inbox empty', body: 'Everything has been given a date or a project.' },
      completed: { title: 'Nothing completed yet', body: 'Finished tasks collect here.' },
      all: { title: 'No tasks yet', body: 'Add the first one — or dump a list and let the app sort it.' }
    };
    var m = messages[view.filter] || messages.all;
    return UI.emptyState({
      icon: 'checkSquare',
      title: m.title,
      body: m.body,
      actions: [
        { label: 'New task', onClick: function () { UI.editTask(null); } },
        { label: 'Organize a brain dump', onClick: function () { UI.organizeDialog(); } }
      ]
    });
  }

  Views.tasks = { render: render, rerender: rerender, view: view };
})(window);

/* Cadence — notes, ideas and the capture inbox. */
(function (global) {
  'use strict';
  var Views = global.Views = global.Views || {};

  var view = { type: 'all', query: '', tag: null };
  var root = null;
  function rerender() { if (root) render(root); }

  function render(container, params) {
    root = container;
    if (params && params.type) view.type = params.type;
    D.clear(container);

    container.appendChild(D.h('header.page__head', [
      D.h('div.page__head-main', [
        D.h('h1.page__title', { text: 'Notes & ideas' }),
        D.h('p.page__subtitle', { text: 'Somewhere to put things before you know what they are.' })
      ]),
      D.h('div.page__head-actions', [
        D.h('button.btn.btn--ghost', {
          type: 'button', onclick: function () { UI.organizeDialog(); }
        }, [D.icon('zap', 16), 'Organize a dump']),
        D.h('button.btn.btn--primary', {
          type: 'button', onclick: function () { UI.editNote(null); }
        }, [D.icon('plus', 16), 'New note'])
      ])
    ]));

    container.appendChild(UI.captureBox({ onAdd: rerender }));

    var filters = D.h('div.notes__filters');
    var types = [{ value: 'all', label: 'All' }].concat(M.NOTE_KINDS.map(function (k) {
      return { value: k.id, label: k.label };
    }));
    types.forEach(function (t) {
      filters.appendChild(D.h('button.chip', {
        type: 'button', 'aria-pressed': view.type === t.value ? 'true' : 'false',
        onclick: function () { view.type = t.value; rerender(); }
      }, t.label));
    });
    if (view.tag) {
      filters.appendChild(D.h('button.chip.chip--clear', {
        type: 'button', onclick: function () { view.tag = null; rerender(); }
      }, ['#' + view.tag, D.icon('x', 13)]));
    }
    container.appendChild(filters);

    var notes = S.all('notes').filter(function (n) {
      if (n.archived) return false;
      if (view.type !== 'all' && n.type !== view.type) return false;
      if (view.tag && (n.tags || []).indexOf(view.tag) < 0) return false;
      return true;
    }).sort(function (a, b) {

  /* A simple span chart: where the project's work sits between now and its date. */
  function projectTimeline(p, tasks, deadlines, events, now) {

    var candidates = [p.due ? T.w(p.due) : null]
      .concat(deadlines.map(function (d) { return T.w(d.due); }))
      .concat(tasks.map(function (t) { return t.due ? T.w(t.due) : null; }))
      .concat(events.map(function (e) { return e.endWall; }))
      .filter(Boolean);
    var end = candidates.length ? new Date(Math.max.apply(null, candidates.map(function (d) { return d.getTime(); }))) : T.addDays(start, 30);

    events.filter(function (e) { return e.endWall >= start; }).forEach(function (e) {
      var offset = Math.max(0, T.diffDays(start, e.startWall)) / span * 100;
      var width = Math.max(1.5, (T.diffDays(e.startWall, e.endWall) + 1) / span * 100);
      track.appendChild(D.h('span.ptimeline__bar', {
        title: e.title + ' · ' + T.fmtDateShort(e.startWall),
        style: { left: offset + '%', width: width + '%', background: D.mix(p.color, 0.5) }
      }));
    });

    deadlines.forEach(function (d) {
      var due = T.w(d.due);
      if (due < start) return;
      var offset = T.diffDays(start, due) / span * 100;
      track.appendChild(D.h('span.ptimeline__marker' + (d.done ? '.is-done' : ''), {
        title: d.title + ' · ' + T.fmtDateShort(due),
        style: { left: offset + '%' }
      }, D.icon('flag', 12)));
    });

    if (p.due) {
      var target = T.w(p.due);
      track.appendChild(D.h('span.ptimeline__target', {
        title: 'Target: ' + T.fmtDateShort(target),
        style: { left: (T.diffDays(start, target) / span * 100) + '%' }
      }));
    }

    wrap.appendChild(track);
    wrap.appendChild(D.h('div.ptimeline__axis', [
      D.h('span', { text: 'Today' }),
      D.h('span', { text: T.fmtDateShort(end) })
    ]));
    return wrap;
  }

        D.h('p.page__subtitle', { text: 'Outcomes worth months, broken into things you can do this week.' })
      ]),
      D.h('div.page__head-actions', [
        D.h('button.btn.btn--primary', { type: 'button', onclick: function () { UI.editGoal(null); } },

      ])

  function goalCard(g) {
    var progress = Q.goalProgress(g.id);
    var now = T.nowWall();
    var card = D.h('article.goal', { style: { '--goal-color': g.color } });

    card.appendChild(D.h('div.goal__head', [
      D.h('button.goal__name', {
        type: 'button', onclick: function () { openId = g.id; rerenderGoals(); }
      }, g.name),
      D.iconButton('more', 'Goal actions', function (e) { goalMenu(e.currentTarget, g); }, { size: 15 })
    ]));
    if (g.description) card.appendChild(D.h('p.goal__desc', { text: g.description }));

    card.appendChild(Views.projects.progressBar(progress.pct, g.color));

    var meta = D.h('div.goal__meta');
    if (progress.total) meta.appendChild(D.h('span', { text: progress.done + ' of ' + progress.total + ' milestones' }));
    if (progress.projects.length) meta.appendChild(D.h('span', { text: progress.projects.length + ' project' + (progress.projects.length === 1 ? '' : 's') }));
    if (g.due) meta.appendChild(D.h('span', { text: T.relativeTime(T.w(g.due), now) }));
    card.appendChild(meta);

    if ((g.milestones || []).length) {
      var next = g.milestones.filter(function (m) { return !m.done; })[0];
      if (next) {
        card.appendChild(D.h('p.goal__next', [
          D.icon('arrowRight', 13),
          D.h('span', { text: 'Next: ' + next.title })
        ]));
      }
    }
    return card;
  }

  function goalMenu(anchor, g) {
    UI.menu(anchor, [
      { label: 'Open', icon: 'arrowRight', onClick: function () { openId = g.id; rerenderGoals(); } },
      { label: 'Edit', icon: 'edit', onClick: function () { UI.editGoal(g); } },
      { label: 'Add a project', icon: 'folder', onClick: function () { UI.editProject({ goalId: g.id }); } },
      { label: 'Add a habit', icon: 'repeat', onClick: function () { UI.editHabit({ goalId: g.id }); } },
      { separator: true },
      {
        label: 'Delete', icon: 'trash', danger: true, onClick: function () {
          UI.confirm({ title: 'Delete “' + g.name + '”?', message: 'Linked projects, tasks and habits are kept.', confirmLabel: 'Delete', tone: 'danger' })
            .then(function (ok) { if (ok) { A.deleteGoal(g.id); openId = null; rerenderGoals(); } });
        }
      }
    ], { align: 'right' });
  }

  function goalDetail(container, g) {
    var progress = Q.goalProgress(g.id);
    var now = T.nowWall();
    var habits = S.all('habits').filter(function (h) { return h.goalId === g.id && !h.archived; });
    var tasks = Q.tasksForGoal(g.id);

    container.appendChild(D.h('div.detail__back',
      D.h('button.btn.btn--ghost.btn--sm', {
        type: 'button', onclick: function () { openId = null; rerenderGoals(); }
      }, [D.icon('chevronLeft', 15), 'All goals'])));

    container.appendChild(D.h('header.page__head', [
      D.h('div.page__head-main', [
        D.h('h1.page__title', { text: g.name }),
        g.description ? D.h('p.page__subtitle', { text: g.description }) : null
      ]),
      D.h('div.page__head-actions', [
        D.h('button.btn.btn--ghost', { type: 'button', onclick: function () { UI.editGoal(g); } }, [D.icon('edit', 15), 'Edit'])
      ])
    ]));

    container.appendChild(D.h('div.detail__overview', [
      D.h('div.statblock', [
        D.h('span.statblock__value', { text: progress.pct + '%' }),
        D.h('span.statblock__label', { text: 'overall' }),
        Views.projects.progressBar(progress.pct, g.color)
      ]),
      D.h('div.statblock', [
        D.h('span.statblock__value', { text: progress.done + '/' + progress.total }),
        D.h('span.statblock__label', { text: 'milestones' })
      ]),
      D.h('div.statblock', [
        D.h('span.statblock__value', { text: g.due ? T.relativeTime(T.w(g.due), now).replace('in ', '') : '—' }),
        D.h('span.statblock__label', { text: g.due ? 'until the target date' : 'no target date' })
      ])
    ]));

    container.appendChild(D.h('h2.section-title', { text: 'Milestones' }));
    if (!(g.milestones || []).length) {
      container.appendChild(UI.emptyState({
        icon: 'list', title: 'No milestones yet',
        body: 'Milestones turn a goal into a sequence you can see yourself moving through.',
        actions: [{ label: 'Add milestones', onClick: function () { UI.editGoal(g); } }]
      }));
    } else {
      var list = D.h('ol.milestones');
      g.milestones.forEach(function (m, i) {
        list.appendChild(D.h('li.milestone' + (m.done ? '.is-done' : ''), [
          D.h('button.check', {
            type: 'button', role: 'checkbox', 'aria-checked': m.done ? 'true' : 'false',
            'aria-label': m.title,
            style: { '--check-color': g.color },
            onclick: function () { A.toggleMilestone(g.id, m.id); rerenderGoals(); }
          }, m.done ? D.icon('check', 13) : null),
          D.h('span.milestone__num', { text: String(i + 1) }),
          D.h('span.milestone__title', { text: m.title })
        ]));
      });
      container.appendChild(list);
    }

    container.appendChild(D.h('div.section-head', [
      D.h('h2.section-title', { text: 'Projects' }),
      D.h('button.btn.btn--ghost.btn--sm', {
        type: 'button', onclick: function () { UI.editProject({ goalId: g.id }); }
      }, [D.icon('plus', 14), 'Add project'])
    ]));
    if (!progress.projects.length) {
      container.appendChild(D.h('p.card__note', { text: 'No projects linked yet.' }));
    } else {
      var pg = D.h('div.projects__grid');
      progress.projects.forEach(function (p) {
        var pr = Q.projectProgress(p.id);
        pg.appendChild(D.h('article.project', { style: { '--proj-color': p.color } }, [
          D.h('div.project__head', [
            D.h('span.project__swatch', { style: { background: p.color } }),
            D.h('button.project__name', { type: 'button', onclick: function () { UI.go('projects', { id: p.id }); } }, p.name)
          ]),
          Views.projects.progressBar(pr.pct, p.color),
          D.h('div.project__meta', [D.h('span', { text: pr.done + ' of ' + pr.total + ' tasks' })])
        ]));
      });
      container.appendChild(pg);
    }

    container.appendChild(D.h('div.section-head', [
      D.h('h2.section-title', { text: 'Habits' }),
      D.h('button.btn.btn--ghost.btn--sm', {
        type: 'button', onclick: function () { UI.editHabit({ goalId: g.id }); }
      }, [D.icon('plus', 14), 'Add habit'])
    ]));
    if (!habits.length) {
      container.appendChild(D.h('p.card__note', { text: 'No habits linked to this goal.' }));
    } else {
      var hl = D.h('div.habits__grid');
      habits.forEach(function (h) { hl.appendChild(habitCard(h, rerenderGoals)); });
      container.appendChild(hl);
    }

    if (tasks.length) {
      container.appendChild(D.h('h2.section-title', { text: 'Tasks' }));
      var tl = D.h('ul.tlist');
      tasks.forEach(function (t) {
        var done = t.status === 'completed';
        tl.appendChild(D.h('li.trow' + (done ? '.is-done' : ''), [
          D.h('button.check.trow__check', {
            type: 'button', role: 'checkbox', 'aria-checked': done ? 'true' : 'false',
            'aria-label': t.title, onclick: function () { A.completeTask(t.id); rerenderGoals(); }
          }, done ? D.icon('check', 13) : null),
          D.h('div.trow__main', D.h('button.trow__title', { type: 'button', onclick: function () { UI.editTask(t); } }, t.title))
        ]));
      });
      container.appendChild(tl);
    }
  }

  /* ------------------------------------------------------------ habits */

  var habitRoot = null;
  function rerenderHabits() { if (habitRoot) renderHabits(habitRoot); }

  function renderHabits(container) {
    habitRoot = container;
    D.clear(container);

    container.appendChild(D.h('header.page__head', [
      D.h('div.page__head-main', [
        D.h('h1.page__title', { text: 'Habits' }),
        D.h('p.page__subtitle', { text: 'Small things, often. A missed day is just a missed day.' })
      ]),
      D.h('div.page__head-actions', [
        D.h('button.btn.btn--primary', { type: 'button', onclick: function () { UI.editHabit(null); } },
          [D.icon('plus', 16), 'New habit'])
      ])
    ]));

    var habits = S.all('habits').filter(function (h) { return !h.archived; });
    if (!habits.length) {
      container.appendChild(UI.emptyState({
        icon: 'repeat',
        title: 'No habits yet',
        body: 'Reading twenty minutes, practising an instrument, reviewing the day’s notes — the things that only work by repetition.',
        actions: [{ label: 'Add a habit', onClick: function () { UI.editHabit(null); } }]
      }));
      return;
    }

    var today = T.nowWall();
    var due = habits.filter(function (h) { return R.habitDueOn(h, today); });
    if (due.length) {
      container.appendChild(D.h('h2.section-title', { text: 'Today' }));
      var todayList = D.h('ul.habit-today');
      due.forEach(function (h) {
        var key = T.key(today);
        var done = !!(h.log || {})[key];
        var streak = R.habitStreak(h, today);
        todayList.appendChild(D.h('li.habit-today__row' + (done ? '.is-done' : ''), [
          D.h('button.check', {
            type: 'button', role: 'checkbox', 'aria-checked': done ? 'true' : 'false',
            'aria-label': (done ? 'Undo ' : 'Mark done: ') + h.name,
            style: { '--check-color': h.color },
            onclick: function () { A.toggleHabit(h.id, key); rerenderHabits(); }
          }, done ? D.icon('check', 13) : null),
          D.h('span.habit-today__name', { text: h.name }),
          h.time != null ? D.h('span.habit-today__time', { text: T.fmtTime(T.atMinutes(today, h.time), S.settings().use24Hour) }) : null,
          streak.value > 0 ? D.h('span.habit-today__streak', { text: streak.value + ' ' + streak.unit }) : null
        ]));
      });
      container.appendChild(todayList);
    }

    container.appendChild(D.h('h2.section-title', { text: 'All habits' }));
    var grid = D.h('div.habits__grid');
    habits.forEach(function (h) { grid.appendChild(habitCard(h, rerenderHabits)); });
    container.appendChild(grid);
  }

  function habitCard(h, refresh) {
    var today = T.nowWall();
    var streak = R.habitStreak(h, today);
    var target = R.habitTargetPerWeek(h);
    var card = D.h('article.habit', { style: { '--habit-color': h.color } });

    card.appendChild(D.h('div.habit__head', [
      D.h('button.habit__name', { type: 'button', onclick: function () { UI.editHabit(h); } }, h.name),
      D.iconButton('more', 'Habit actions', function (e) {
        UI.menu(e.currentTarget, [
          { label: 'Edit', icon: 'edit', onClick: function () { UI.editHabit(h); } },
          {
            label: 'Schedule it today', icon: 'calendar', onClick: function () {
              var start = h.time != null ? T.atMinutes(today, h.time) : T.snap(T.nowWall(), 30);
              A.createEvent({
                title: h.name, start: T.iso(start), end: T.iso(T.addMinutes(start, h.duration || 20)),
                type: 'block', color: h.color, habitId: h.id, categoryId: h.categoryId
              });
            }
          },
          { separator: true },
          {
            label: 'Delete', icon: 'trash', danger: true, onClick: function () {
              UI.confirm({ title: 'Delete “' + h.name + '”?', message: 'Its history goes too.', confirmLabel: 'Delete', tone: 'danger' })
                .then(function (ok) { if (ok) { A.deleteHabit(h.id); refresh(); } });
            }
          }
        ], { align: 'right' });
      }, { size: 15 })
    ]));

    card.appendChild(D.h('p.habit__schedule', { text: scheduleLabel(h) }));

    /* Last eight weeks, one dot per day. Absence is shown quietly. */
    var gridWrap = D.h('div.habit__grid', { role: 'img', 'aria-label': historyLabel(h) });
    var start = T.addDays(T.startOfWeek(today, 0), -7 * 7);
    for (var w = 0; w < 8; w++) {
      var col = D.h('div.habit__week');
      for (var d = 0; d < 7; d++) {
        var day = T.addDays(start, w * 7 + d);
        var future = day > today;
        var key = T.key(day);
        var done = !!(h.log || {})[key];
        var due = R.habitDueOn(h, day);
        var cell = D.h('span.habit__cell' +
          (done ? '.is-done' : '') +
          (future ? '.is-future' : '') +
          (!due && !done ? '.is-off' : ''), {
          title: T.fmtDate(day) + (done ? ' — done' : future ? '' : due ? ' — not logged' : '')
        });
        col.appendChild(cell);
      }
      gridWrap.appendChild(col);
    }
    card.appendChild(gridWrap);

    var weekDone = 0;
    var weekStart = T.startOfWeek(today, 0);
    for (var i = 0; i < 7; i++) if ((h.log || {})[T.key(T.addDays(weekStart, i))]) weekDone++;

    card.appendChild(D.h('div.habit__stats', [
      D.h('span', { text: weekDone + ' of ' + target + ' this week' }),
      streak.value > 0 ? D.h('span.habit__streak', { text: streak.value + ' ' + streak.unit + ' running' })
        : D.h('span.habit__streak.is-quiet', { text: 'Fresh start' })
    ]));
    return card;
  }

  function scheduleLabel(h) {
    var s = h.schedule || { type: 'daily' };
    var when = h.time != null ? ' · around ' + T.fmtTime(T.atMinutes(T.nowWall(), h.time), S.settings().use24Hour) : '';
    switch (s.type) {
      case 'daily': return 'Every day' + when;
      case 'weekdays': return 'Weekdays' + when;
      case 'weekly': return (s.days || []).map(function (d) { return T.DAY_SHORT[d]; }).join(', ') + when;
      case 'times-per-week': return (s.timesPerWeek || 3) + ' times a week' + when;
      default: return 'Repeats' + when;
    }
  }

  function historyLabel(h) {
    var count = Object.keys(h.log || {}).length;
    return h.name + ': ' + count + ' day' + (count === 1 ? '' : 's') + ' logged in total';
  }

  Views.goals = { render: renderGoals, rerender: rerenderGoals };
  Views.habits = { render: renderHabits, rerender: rerenderHabits, habitCard: habitCard };
})(window);

/* Cadence — planning: the weekly and monthly review, the priority matrix, and
   the entry points to the planners. Reviews report; they never grade. */
(function (global) {
  'use strict';
  var Views = global.Views = global.Views || {};

  var tab = 'week';
  var weekAnchor = null;
  var monthAnchor = null;
  var root = null;
  function rerender() { if (root) render(root); }

  function render(container, params) {
    root = container;
    if (params && params.tab) tab = params.tab;
    if (!weekAnchor) weekAnchor = T.startOfWeek(T.nowWall(), S.settings().firstDayOfWeek);
    if (!monthAnchor) monthAnchor = T.startOfMonth(T.nowWall());
    D.clear(container);

    container.appendChild(D.h('header.page__head', [
      D.h('div.page__head-main', [
        D.h('h1.page__title', { text: 'Planning' }),
        D.h('p.page__subtitle', { text: 'Look back honestly, then decide what next week is for.' })
      ]),
      D.h('div.page__head-actions', [
        D.h('button.btn.btn--ghost', {
          type: 'button', onclick: function () { UI.planDayDialog(T.nowWall(), { onDone: rerender }); }
        }, [D.icon('sparkle', 16), 'Plan my day']),
        D.h('button.btn.btn--primary', {
          type: 'button', onclick: function () { UI.planWeekDialog(weekAnchor); }
        }, [D.icon('grid', 16), 'Plan the week'])
      ])
    ]));

    var tabs = D.h('div.segmented.planning__tabs', { role: 'radiogroup', 'aria-label': 'Planning view' });
    [{ id: 'week', label: 'Weekly review' }, { id: 'month', label: 'Monthly review' }, { id: 'matrix', label: 'Priorities' }]
      .forEach(function (t) {
        tabs.appendChild(D.h('button.segmented__btn', {
          type: 'button', role: 'radio', 'aria-checked': tab === t.id ? 'true' : 'false',
          onclick: function () { tab = t.id; rerender(); }
        }, t.label));
      });
    container.appendChild(tabs);

    if (tab === 'week') renderWeek(container);
    else if (tab === 'month') renderMonth(container);
    else renderMatrix(container);
  }

  /* --------------------------------------------------------- week review */

  function renderWeek(container) {
    var review = SCHED.weekReview(weekAnchor);
    var now = T.nowWall();
    var isCurrent = T.sameDay(weekAnchor, T.startOfWeek(now, S.settings().firstDayOfWeek));

    container.appendChild(D.h('div.review__nav', [
      D.iconButton('chevronLeft', 'Previous week', function () { weekAnchor = T.addDays(weekAnchor, -7); rerender(); }),
      D.h('h2.review__range', {
        text: T.fmtDateShort(review.start) + ' – ' + T.fmtDateShort(review.end) + (isCurrent ? ' · this week' : '')
      }),
      D.iconButton('chevronRight', 'Next week', function () { weekAnchor = T.addDays(weekAnchor, 7); rerender(); })
    ]));

    var stats = D.h('div.review__stats', [
      statCard(String(review.completed.length), 'tasks completed'),
      statCard(String(review.unfinished.length), 'still open from this week'),
      statCard(T.humanDuration(review.totalMinutes), 'scheduled across ' + review.events.length + ' events'),
      statCard(String(review.upcomingDeadlines.length), 'deadlines in the next two weeks')
    ]);
    container.appendChild(stats);

    /* Where the time went */
    container.appendChild(D.h('h3.section-title', { text: 'Where the time went' }));
    if (!review.byCategory.length) {
      container.appendChild(D.h('p.card__note', { text: 'Nothing was scheduled this week, so there is nothing to break down.' }));
    } else {
      container.appendChild(barChart(review.byCategory.map(function (c) {
        return { label: c.label, value: c.minutes, display: T.humanDuration(c.minutes) };
      })));
    }

    /* Completed */
    container.appendChild(D.h('h3.section-title', { text: 'Finished' }));
    if (!review.completed.length) {
      container.appendChild(D.h('p.card__note', { text: 'No tasks were marked complete in this week.' }));
    } else {
      var doneList = D.h('ul.review__list');
      review.completed.slice(0, 12).forEach(function (t) {
        doneList.appendChild(D.h('li.review__row', [
          D.h('span.review__tick', D.icon('check', 13)),
          D.h('span', { text: t.title }),
          D.h('span.review__meta', { text: T.relativeDay(T.w(t.completedAt), now) })
        ]));
      });
      container.appendChild(doneList);
    }

    /* Unfinished — framed as choices, not failures */
    container.appendChild(D.h('div.section-head', [
      D.h('h3.section-title', { text: 'Still open' }),
      review.unfinished.length ? D.h('button.btn.btn--ghost.btn--sm', {
        type: 'button', onclick: function () { UI.recoveryDialog({ tasks: review.unfinished }); }
      }, 'Decide what to do with these') : null
    ]));
    if (!review.unfinished.length) {
      container.appendChild(D.h('p.card__note', { text: 'Nothing dated in this week is still open.' }));
    } else {
      var openList = D.h('ul.review__list');
      review.unfinished.forEach(function (t) {
        openList.appendChild(D.h('li.review__row', [
          D.h('span.review__tick.is-open', D.icon('circle', 12)),
          D.h('button.link', { type: 'button', onclick: function () { UI.editTask(t); } }, t.title),
          D.h('span.review__meta', { text: t.due ? T.relativeDay(T.w(t.due), now) : '' })
        ]));
      });
      container.appendChild(openList);
    }

    /* Habits */
    if (review.habits.length) {
      container.appendChild(D.h('h3.section-title', { text: 'Habits this week' }));
      var hl = D.h('ul.review__list');
      review.habits.forEach(function (h) {
        hl.appendChild(D.h('li.review__row', [
          D.h('span.review__swatch', { style: { background: h.habit.color } }),
          D.h('span', { text: h.habit.name }),
          D.h('span.review__meta', { text: h.done + ' of ' + h.target })
        ]));
      });
      container.appendChild(hl);
    }

    /* Next week */
    container.appendChild(D.h('div.section-head', [
      D.h('h3.section-title', { text: 'What next week is for' }),
      D.h('button.btn.btn--primary.btn--sm', {
        type: 'button', onclick: function () { UI.planWeekDialog(T.addDays(weekAnchor, 7)); }
      }, [D.icon('sparkle', 14), 'Plan next week'])
    ]));
    if (!review.nextWeekPriorities.length) {
      container.appendChild(D.h('p.card__note', { text: 'Nothing is queued up yet for next week.' }));
    } else {
      var pl = D.h('ol.review__priorities');
      review.nextWeekPriorities.forEach(function (entry) {
        pl.appendChild(D.h('li.review__priority', [
          D.h('button.link', { type: 'button', onclick: function () { UI.editTask(entry.task); } }, entry.task.title),
          D.h('span.review__meta', { text: entry.reasons.join(', ') || T.humanDuration(Q.taskEstimate(entry.task)) })
        ]));
      });
      container.appendChild(pl);
    }
  }

  /* -------------------------------------------------------- month review */

  function renderMonth(container) {
    var review = SCHED.monthReview(monthAnchor);
    var now = T.nowWall();

    container.appendChild(D.h('div.review__nav', [
      D.iconButton('chevronLeft', 'Previous month', function () { monthAnchor = T.addMonths(monthAnchor, -1); rerender(); }),
      D.h('h2.review__range', { text: T.fmtMonthYear(monthAnchor) }),
      D.iconButton('chevronRight', 'Next month', function () { monthAnchor = T.addMonths(monthAnchor, 1); rerender(); })
    ]));

    var totalMinutes = review.byCategory.reduce(function (a, c) { return a + c.minutes; }, 0);
    container.appendChild(D.h('div.review__stats', [
      statCard(String(review.completed.length), 'tasks completed'),
      statCard(String(review.events.length), 'events'),
      statCard(T.humanDuration(totalMinutes), 'scheduled time'),
      statCard(String(review.deadlines.length), 'deadlines this month')
    ]));

    container.appendChild(D.h('h3.section-title', { text: 'Time by category' }));
    if (!review.byCategory.length) container.appendChild(D.h('p.card__note', { text: 'Nothing scheduled this month.' }));
    else container.appendChild(barChart(review.byCategory.map(function (c) {
      return { label: c.label, value: c.minutes, display: T.humanDuration(c.minutes) };
    })));

    container.appendChild(D.h('h3.section-title', { text: 'Tasks completed each week' }));
    container.appendChild(sparkline(review.weeks.map(function (w) {
      return { label: T.fmtDateShort(w.start), value: w.count };
    })));

    container.appendChild(D.h('h3.section-title', { text: 'Deadlines' }));
    if (!review.deadlines.length) container.appendChild(D.h('p.card__note', { text: 'No deadlines fell in this month.' }));
    else {
      var dl = D.h('ul.review__list');
      review.deadlines.forEach(function (d) {
        var status = Q.deadlineStatus(d, now);
        dl.appendChild(D.h('li.review__row', [
          D.h('span.review__tick' + (d.done ? '' : '.is-open'), d.done ? D.icon('check', 13) : D.icon('flag', 12)),
          D.h('button.link', { type: 'button', onclick: function () { UI.editDeadline(d); } }, d.title),
          D.h('span.review__meta', { text: d.done ? 'Completed' : status.label })
        ]));
      });
      container.appendChild(dl);
    }

    container.appendChild(D.h('h3.section-title', { text: 'Project progress' }));
    if (!review.projects.length) container.appendChild(D.h('p.card__note', { text: 'No projects yet.' }));
    else {
      var pl = D.h('div.review__projects');
      review.projects.forEach(function (entry) {
        pl.appendChild(D.h('div.review__project', [
          D.h('button.link', { type: 'button', onclick: function () { UI.go('projects', { id: entry.project.id }); } }, entry.project.name),
          Views.projects.progressBar(entry.progress.pct, entry.project.color)
        ]));
      });
      container.appendChild(pl);
    }

    if (review.goals.length) {
      container.appendChild(D.h('h3.section-title', { text: 'Goal progress' }));
      var gl = D.h('div.review__projects');
      review.goals.forEach(function (entry) {
        gl.appendChild(D.h('div.review__project', [
          D.h('button.link', { type: 'button', onclick: function () { UI.go('goals', { id: entry.goal.id }); } }, entry.goal.name),
          Views.projects.progressBar(entry.progress.pct, entry.goal.color)
        ]));
      });
      container.appendChild(gl);
    }
  }

  /* ------------------------------------------------------ priority matrix */

  function renderMatrix(container) {
    var now = T.nowWall();
    var tasks = Q.activeTasks();
    var buckets = { do: [], schedule: [], delegate: [], later: [] };
    tasks.forEach(function (t) { buckets[SCHED.quadrant(t, now).id].push(t); });

    container.appendChild(D.h('p.page__lead', {
      text: 'A way to see the shape of your list. Nothing here changes how the app behaves — it is a lens, not a rulebook.'
    }));

    var grid = D.h('div.matrix');
    [
      { id: 'do', title: 'Important & urgent', hint: 'Do these first' },
      { id: 'schedule', title: 'Important, not urgent', hint: 'Give these real time' },
      { id: 'delegate', title: 'Urgent, less important', hint: 'Batch or shrink these' },
      { id: 'later', title: 'Neither', hint: 'Fine to leave' }
    ].forEach(function (q) {
      var cell = D.h('section.matrix__cell.matrix__cell--' + q.id);
      cell.appendChild(D.h('div.matrix__head', [
        D.h('h3.matrix__title', { text: q.title }),
        D.h('span.matrix__hint', { text: q.hint }),
        D.h('span.matrix__count', { text: String(buckets[q.id].length) })
      ]));
      if (!buckets[q.id].length) {
        cell.appendChild(D.h('p.matrix__empty', { text: 'Nothing here' }));
      } else {
        var list = D.h('ul.matrix__list');
        buckets[q.id].slice(0, 12).forEach(function (t) {
          list.appendChild(D.h('li', D.h('button.matrix__task', {
            type: 'button', onclick: function () { UI.editTask(t); }
          }, [
            D.h('span', { text: t.title }),
            t.due ? D.h('span.matrix__due', { text: T.relativeDay(T.w(t.due), now) }) : null
          ])));
        });
        if (buckets[q.id].length > 12) {
          list.appendChild(D.h('li.matrix__more', { text: '+' + (buckets[q.id].length - 12) + ' more' }));
        }
        cell.appendChild(list);
      }
      grid.appendChild(cell);
    });
    container.appendChild(grid);
  }

  /* ------------------------------------------------------------- charts */

  function statCard(value, label) {
    return D.h('div.statcard', [
      D.h('span.statcard__value', { text: value }),
      D.h('span.statcard__label', { text: label })
    ]);
  }

  /* Horizontal bars: readable at a glance, honest about scale, and labelled in
     text as well as length so colour is never the only signal. */
  function barChart(rows) {
    var max = Math.max.apply(null, rows.map(function (r) { return r.value; }).concat([1]));
    var chart = D.h('div.barchart', { role: 'list' });
    rows.forEach(function (r) {
      chart.appendChild(D.h('div.barchart__row', { role: 'listitem' }, [
        D.h('span.barchart__label', { text: r.label }),
        D.h('span.barchart__track', D.h('span.barchart__bar', {
          style: { width: Math.max(2, r.value / max * 100) + '%' }
        })),
        D.h('span.barchart__value', { text: r.display || String(r.value) })
      ]));
    });
    return chart;
  }

  function sparkline(points) {
    if (!points.length) return D.h('p.card__note', { text: 'Not enough data yet.' });
    var max = Math.max.apply(null, points.map(function (p) { return p.value; }).concat([1]));
    var wrap = D.h('div.sparkline', {
      role: 'img',
      'aria-label': points.map(function (p) { return p.label + ': ' + p.value; }).join(', ')
    });
    points.forEach(function (p) {
      wrap.appendChild(D.h('div.sparkline__col', [
        D.h('span.sparkline__value', { text: String(p.value) }),
        D.h('span.sparkline__bar', { style: { height: Math.max(4, p.value / max * 100) + '%' } }),
        D.h('span.sparkline__label', { text: p.label })
      ]));
    });
    return wrap;
  }

  Views.planning = { render: render, rerender: rerender, barChart: barChart, sparkline: sparkline, statCard: statCard };
})(window);

   js/views/insights.js

/* Cadence — insights.
   Descriptive, never disciplinary: "you scheduled 7 hours and completed 5" is a
   fact worth knowing; "you were unproductive" is not information. */
(function (global) {
  'use strict';
  var Views = global.Views = global.Views || {};

  var rangeDays = 28;
  var root = null;
  function rerender() { if (root) render(root); }

  function render(container) {
    root = container;
    D.clear(container);
    var now = T.nowWall();
    var start = T.startOfDay(T.addDays(now, -(rangeDays - 1)));
    var end = T.endOfDay(now);

    container.appendChild(D.h('header.page__head', [
      D.h('div.page__head-main', [
        D.h('h1.page__title', { text: 'Insights' }),
        D.h('p.page__subtitle', { text: 'What your time actually looked like. No scores, no streetlights.' })
      ]),
      D.h('div.page__head-actions', [
        D.h('div.segmented', { role: 'radiogroup', 'aria-label': 'Time range' },
          [7, 28, 90].map(function (d) {
            return D.h('button.segmented__btn', {
              type: 'button', role: 'radio', 'aria-checked': rangeDays === d ? 'true' : 'false',
              onclick: function () { rangeDays = d; rerender(); }
            }, d + ' days');
          }))
      ])
    ]));

    var events = Q.eventsInRange(start, end, { ignoreLayers: true }).filter(function (e) { return !e.allDay; });
    var tasks = S.all('tasks');
    var completed = tasks.filter(function (t) {
      if (!t.completedAt) return false;
      var c = T.w(t.completedAt);
      return c >= start && c <= end;
    });

    var scheduledMinutes = events.reduce(function (a, e) { return a + T.diffMinutes(e.startWall, e.endWall); }, 0);
    var completedFromBlocks = events.filter(function (e) { return e.taskId && e.done; })
      .reduce(function (a, e) { return a + T.diffMinutes(e.startWall, e.endWall); }, 0);

    container.appendChild(D.h('div.review__stats', [
      Views.planning.statCard(T.humanDuration(scheduledMinutes), 'scheduled in this period'),
      Views.planning.statCard(String(completed.length), 'tasks completed'),
      Views.planning.statCard(String(events.length), 'events'),
      Views.planning.statCard(T.humanDuration(Math.round(scheduledMinutes / rangeDays)), 'scheduled per day on average')
    ]));

    /* --- where time went --- */
    container.appendChild(D.h('h2.section-title', { text: 'Where your time went' }));
    var byCategory = {};
    events.forEach(function (e) {
      var cat = e.categoryId ? (S.get('categories', e.categoryId) || {}).name : null;
      var label = cat || (S.get('calendars', e.calendarId) || {}).name || 'Other';
      byCategory[label] = (byCategory[label] || 0) + T.diffMinutes(e.startWall, e.endWall);
    });
    var catRows = Object.keys(byCategory).map(function (k) {
      return { label: k, value: byCategory[k], display: T.humanDuration(byCategory[k]) };
    }).sort(function (a, b) { return b.value - a.value; });
    if (!catRows.length) {
      container.appendChild(D.h('p.card__note', { text: 'Nothing was scheduled in this period.' }));
    } else {
      container.appendChild(Views.planning.barChart(catRows));
    }

    /* --- planned vs completed --- */
    container.appendChild(D.h('h2.section-title', { text: 'Planned against finished' }));
    var plannedBlocks = events.filter(function (e) { return e.taskId; });
    if (!plannedBlocks.length) {
      container.appendChild(D.h('p.card__note', {
        text: 'You have not scheduled task blocks in this period, so there is nothing to compare. Scheduling a task turns it into a block you can measure against.'
      }));
    } else {
      var doneBlocks = plannedBlocks.filter(function (e) { return e.done; }).length;
      container.appendChild(D.h('p.insight__sentence', {
        text: 'You set aside ' + T.humanDuration(plannedBlocks.reduce(function (a, e) { return a + T.diffMinutes(e.startWall, e.endWall); }, 0)) +
          ' across ' + plannedBlocks.length + ' blocks, and marked ' + doneBlocks + ' of them done' +
          (completedFromBlocks ? ' (' + T.humanDuration(completedFromBlocks) + ').' : '.')
      }));
      container.appendChild(Views.planning.barChart([
        { label: 'Blocks scheduled', value: plannedBlocks.length, display: String(plannedBlocks.length) },
        { label: 'Blocks completed', value: doneBlocks, display: String(doneBlocks) }
      ]));
    }

    /* --- completions over time --- */
    container.appendChild(D.h('h2.section-title', { text: 'Tasks completed' }));
    var buckets = [];
    var bucketDays = rangeDays <= 7 ? 1 : 7;
    for (var offset = rangeDays - 1; offset >= 0; offset -= bucketDays) {
      var bStart = T.startOfDay(T.addDays(now, -offset));
      var bEnd = T.endOfDay(T.addDays(bStart, bucketDays - 1));
      var count = completed.filter(function (t) {
        var c = T.w(t.completedAt);
        return c >= bStart && c <= bEnd;
      }).length;
      buckets.push({ label: T.fmtDateShort(bStart), value: count });
    }
    container.appendChild(Views.planning.sparkline(buckets));

    /* --- workload ahead --- */
    container.appendChild(D.h('h2.section-title', { text: 'The two weeks ahead' }));
    var ahead = [];
    for (var i = 0; i < 14; i++) {
      var day = T.startOfDay(T.addDays(now, i));
      var load = SCHED.dayLoad(day);
      var dueCount = Q.tasksDueOn(day).filter(function (t) { return t.status !== 'completed'; }).length;
      ahead.push({ day: day, load: load, due: dueCount });
    }
    container.appendChild(loadChart(ahead));

    var busiest = ahead.slice().sort(function (a, b) { return b.load.utilization - a.load.utilization; })[0];
    if (busiest && busiest.load.utilization > 70) {
      container.appendChild(D.h('p.insight__sentence', {
        text: T.fmtDateLong(busiest.day) + ' is your fullest day ahead — about ' +
          T.humanDuration(busiest.load.busyMinutes) + ' committed, leaving ' +
          T.humanDuration(busiest.load.freeMinutes) + ' inside your working hours.'
      }));
    }

    /* --- consistency --- */
    container.appendChild(D.h('h2.section-title', { text: 'Rhythm' }));
    container.appendChild(consistencyBlock(start, end, events));

    /* --- projects --- */
    var projects = S.all('projects').filter(function (p) { return p.status !== 'archived'; });
    if (projects.length) {
      container.appendChild(D.h('h2.section-title', { text: 'Time by project' }));
      var byProject = projects.map(function (p) {
        var mins = events.filter(function (e) { return e.projectId === p.id; })
          .reduce(function (a, e) { return a + T.diffMinutes(e.startWall, e.endWall); }, 0);
        return { label: p.name, value: mins, display: mins ? T.humanDuration(mins) : 'none' };
      }).sort(function (a, b) { return b.value - a.value; });
      container.appendChild(Views.planning.barChart(byProject));
    }
  }

  /* Utilisation per day, with the free portion shown as well as the busy one. */
  function loadChart(rows) {
    var wrap = D.h('div.loadchart', { role: 'list' });
    rows.forEach(function (r) {
      var pct = r.load.utilization;
      wrap.appendChild(D.h('div.loadchart__col', {
        role: 'listitem',
        title: T.fmtDateLong(r.day) + ': ' + T.humanDuration(r.load.busyMinutes) + ' committed, ' +
          T.humanDuration(r.load.freeMinutes) + ' free' + (r.due ? ', ' + r.due + ' tasks due' : ''),
        onclick: function () { UI.go('calendar', { date: T.key(r.day), view: 'day' }); }
      }, [
        D.h('span.loadchart__bar-wrap', D.h('span.loadchart__bar' + (pct > 85 ? '.is-full' : ''), {
          style: { height: Math.max(3, pct) + '%' }
        })),
        r.due ? D.h('span.loadchart__due', { text: String(r.due) }) : D.h('span.loadchart__due.is-empty'),
        D.h('span.loadchart__label', { text: T.DAY_MIN[r.day.getDay()] }),
        D.h('span.loadchart__date', { text: String(r.day.getDate()) })
      ]));
    });
    return wrap;
  }

  function consistencyBlock(start, end, events) {
    var byDow = [0, 0, 0, 0, 0, 0, 0];
    var counts = [0, 0, 0, 0, 0, 0, 0];
    events.forEach(function (e) {
      var d = e.startWall.getDay();
      byDow[d] += T.diffMinutes(e.startWall, e.endWall);
    });
    var days = T.diffDays(start, end) + 1;
    for (var i = 0; i < days; i++) counts[T.addDays(start, i).getDay()]++;

    var rows = byDow.map(function (mins, i) {
      var avg = counts[i] ? Math.round(mins / counts[i]) : 0;
      return { label: T.DAY_NAMES[i], value: avg, display: avg ? T.humanDuration(avg) : 'nothing scheduled' };
    });
    var wrap = D.h('div');
    wrap.appendChild(D.h('p.insight__sentence', { text: 'Average scheduled time on each day of the week.' }));
    wrap.appendChild(Views.planning.barChart(rows));
    return wrap;
  }

  Views.insights = { render: render, rerender: rerender };
})(window);

   js/views/search.js

/* Cadence — the full search page. Same index as the command palette, more room
   to show it, and filters for when you know what kind of thing you are after. */
(function (global) {
  'use strict';
  var Views = global.Views = global.Views || {};

  var query = '';
  var typeFilter = null;
  var root = null;
  function rerender() { if (root) render(root); }

  var TYPES = [
    { id: null, label: 'Everything' },
    { id: 'event', label: 'Events' },
    { id: 'task', label: 'Tasks' },
    { id: 'deadline', label: 'Deadlines' },
    { id: 'note', label: 'Notes' },
    { id: 'project', label: 'Projects' },
    { id: 'goal', label: 'Goals' },
    { id: 'habit', label: 'Habits' },
    { id: 'person', label: 'People' },
    { id: 'location', label: 'Locations' },
    { id: 'tag', label: 'Tags' }
  ];

  function render(container, params) {
    root = container;
    if (params && params.q !== undefined) query = params.q;
    if (params && params.type !== undefined) typeFilter = params.type;
    D.clear(container);

    var input = D.h('input.search__input', {
      type: 'search',
      value: query,
      placeholder: 'Search events, tasks, notes, projects, people…',
      'aria-label': 'Search everything',
      autocomplete: 'off',
      'data-autofocus': ''
    });
    input.addEventListener('input', D.debounce(function () {
      query = input.value;
      paintResults();
    }, 90));

    container.appendChild(D.h('header.page__head', [
      D.h('div.page__head-main', [
        D.h('h1.page__title', { text: 'Search' }),
        D.h('p.page__subtitle', { text: 'One box over everything you have written down.' })
      ])
    ]));
    container.appendChild(D.h('div.search__bar', [D.icon('search', 18), input]));

    var filters = D.h('div.search__filters');
    TYPES.forEach(function (t) {
      filters.appendChild(D.h('button.chip', {
        type: 'button', 'aria-pressed': typeFilter === t.id ? 'true' : 'false',
        onclick: function () { typeFilter = t.id; paintResults(); }
      }, t.label));
    });
    container.appendChild(filters);

    var results = D.h('div.search__results', { 'aria-live': 'polite' });
    container.appendChild(results);

    function paintResults() {
      D.qsa('.chip', filters).forEach(function (c, i) {
        c.setAttribute('aria-pressed', TYPES[i].id === typeFilter ? 'true' : 'false');
      });
      D.clear(results);
      if (!query.trim()) {
        results.appendChild(recentBlock());
        return;
      }
      var found = SEARCH.search(query, { limit: 60, type: typeFilter });
      if (!found.length) {
        results.appendChild(UI.emptyState({
          icon: 'search',
          title: 'Nothing matches “' + query.trim() + '”',
          body: 'Search covers titles, descriptions, notes, tags, people and locations. Try fewer letters.',
          actions: [{ label: 'Add “' + query.trim() + '”', onClick: function () { UI.quickAdd({ text: query.trim() }); } }]
        }));
        return;
      }
      var grouped = {};
      found.forEach(function (r) { (grouped[r.doc.type] || (grouped[r.doc.type] = [])).push(r); });
      Object.keys(grouped).forEach(function (type) {
        var meta = SEARCH.typeMeta(type);
        results.appendChild(D.h('h2.section-title', { text: meta.label + 's' }));
        var list = D.h('ul.search__list');
        grouped[type].forEach(function (r) { list.appendChild(resultRow(r, meta)); });
        results.appendChild(list);
      });
    }

    paintResults();
    setTimeout(function () { input.focus(); }, 40);
  }

  function resultRow(r, meta) {
    var title = D.h('span.search__title');
    SEARCH.highlight(r.doc.title, r.positions).forEach(function (part) {
      title.appendChild(part.hit ? D.h('mark', { text: part.text }) : document.createTextNode(part.text));
    });
    return D.h('li', D.h('button.search__row', {
      type: 'button', onclick: function () { UI.openSearchResult(r.doc); }
    }, [
      D.h('span.search__icon', D.icon(meta.icon || 'circle', 16)),
      D.h('span.search__main', [title, D.h('span.search__sub', { text: r.doc.subtitle || meta.label })]),
      D.h('span.search__type', { text: meta.label })
    ]));
  }

  function recentBlock() {
    var wrap = D.h('div');
    var tags = Q.allTags().slice(0, 14);
    if (tags.length) {
      wrap.appendChild(D.h('h2.section-title', { text: 'Tags' }));
      var chips = D.h('div.search__tags');
      tags.forEach(function (t) {
        chips.appendChild(D.h('button.chip', {
          type: 'button',
          onclick: function () { query = '#' + t.tag; render(root); }
        }, ['#' + t.tag, D.h('span.chip__count', { text: String(t.count) })]));
      });
      wrap.appendChild(chips);
    }

    var now = T.nowWall();
    var upcoming = Q.eventsInRange(now, T.addDays(now, 7), { ignoreLayers: true }).slice(0, 6);
    if (upcoming.length) {
      wrap.appendChild(D.h('h2.section-title', { text: 'Coming up' }));
      var list = D.h('ul.search__list');
      upcoming.forEach(function (e) {
        list.appendChild(D.h('li', D.h('button.search__row', {
          type: 'button', onclick: function () { UI.editEvent(e); }
        }, [
          D.h('span.search__icon', D.icon('calendar', 16)),
          D.h('span.search__main', [
            D.h('span.search__title', { text: e.title }),
            D.h('span.search__sub', { text: T.relativeDay(e.startWall, now) + ' · ' + (e.allDay ? 'all day' : T.fmtTime(e.startWall, S.settings().use24Hour)) })
          ])
        ])));
      });
      wrap.appendChild(list);
    }

    if (!wrap.childNodes.length) {
      wrap.appendChild(UI.emptyState({
        icon: 'search',
        title: 'Search everything at once',
        body: 'Type part of a title, a tag, a person or a place. Partial words work — “bio” finds “Biology test”.'
      }));
    }
    return wrap;
  }

  /* Routing for a search hit: open the right editor or jump to the right place. */
  function openResult(doc) {
    switch (doc.type) {
      case 'event': {
        var base = S.get('events', doc.id);
        if (!base) return;
        var inst = R.nextOccurrence(base, T.addDays(T.nowWall(), -365)) || base;
        UI.go('calendar', { date: T.key(T.w(inst.start)) });
        setTimeout(function () { UI.editEvent(inst.startWall ? inst : base); }, 60);
        break;
      }
      case 'task': UI.editTask(S.get('tasks', doc.id)); break;
      case 'deadline': UI.editDeadline(S.get('deadlines', doc.id)); break;
      case 'note': UI.editNote(S.get('notes', doc.id)); break;
      case 'project': UI.go('projects', { id: doc.id }); break;
      case 'goal': UI.go('goals', { id: doc.id }); break;
      case 'habit': UI.editHabit(S.get('habits', doc.id)); break;
      case 'tag':
        query = doc.title;
        UI.go('search', { q: doc.title });
        break;
      case 'person':
      case 'location':
        query = doc.title;
        UI.go('search', { q: doc.title });
        break;
    }
  }

  Views.search = { render: render, rerender: rerender, openResult: openResult, setQuery: function (q) { query = q; } };
})(window);

/* Cadence — settings. Preferences a person would actually change, grouped the
   way they would look for them. Nothing technical is exposed here. */
(function (global) {
  'use strict';
  var Views = global.Views = global.Views || {};
  var F = null;

  var root = null;
  function rerender() { if (root) render(root); }

  function render(container) {
    F = UI.F;
    root = container;
    var s = S.settings();
    D.clear(container);

    container.appendChild(D.h('header.page__head', [
      D.h('div.page__head-main', [
        D.h('h1.page__title', { text: 'Settings' }),
        D.h('p.page__subtitle', { text: 'Everything saves as you change it.' })
      ])
    ]));

    container.appendChild(section('You', [
      F.field('What should the app call you?', F.text({
        value: s.name, placeholder: 'Your name',
        oninput: D.debounce(function (e) { S.setPref('name', e.target.value.trim()); }, 400)
      }), { hint: 'Used only in the greeting on the Today page.' })
    ]));

    /* ---- appearance ---- */
    container.appendChild(section('Appearance', [
      F.field('Theme', F.segmented({
        value: s.theme, ariaLabel: 'Theme',
        options: [{ value: 'light', label: 'Light' }, { value: 'dark', label: 'Dark' }, { value: 'system', label: 'System' }],
        onChange: function (v) { S.setSetting('theme', v); UI.applyTheme(); }
      })),
      F.field('Accent colour', accentPicker(s.accent)),

  /* ------------------------------------------------------------- data */

  function exportData() {
    try {
      var blob = new Blob([S.exportJSON()], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = D.h('a', { href: url, download: 'cadence-backup-' + T.key(T.nowWall()) + '.json' });
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      UI.toast('Backup downloaded');
    } catch (e) {
      UI.toast('We could not create the backup file. Your data is untouched.', { tone: 'warn' });
    }
  }

  function importData() {
    var input = D.h('input', { type: 'file', accept: 'application/json,.json', class: 'sr-only' });
    document.body.appendChild(input);
    input.addEventListener('change', function () {
      var file = input.files[0];
      document.body.removeChild(input);
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        var parsed;
        try { parsed = JSON.parse(reader.result); }
        catch (e) {
          UI.toast('That file is not a Cadence backup. Nothing was changed.', { tone: 'warn' });
          return;
        }
        UI.confirm({
          title: 'Replace everything with this backup?',
          message: 'Your current events, tasks and notes will be replaced by the contents of the file.',
          confirmLabel: 'Replace', tone: 'danger'
        }).then(function (ok) {
          if (!ok) return;
          S.replaceState(parsed);
          UI.applyTheme();
          UI.refresh();
          UI.toast('Backup restored');
        });
      };
      reader.onerror = function () { UI.toast('We could not read that file. Try again.', { tone: 'warn' }); };
      reader.readAsText(file);
    });
    input.click();
  }

  function loadSample() {

      S.replaceState(sample);
      UI.applyTheme();
      UI.refresh();
      UI.toast('Sample data loaded');
    });
  }

  function resetAll() {
    UI.confirm({
      title: 'Delete everything and start over?',
      message: 'This cannot be undone. Export a backup first if you want to keep any of it.',

    }).then(function (ok) {
      if (!ok) return;
      S.reset();
      UI.applyTheme();
      UI.refresh();
      UI.toast('Everything cleared');
    });
  }

  Views.settings = { render: render, rerender: rerender, shortcutTable: shortcutTable };
})(window);
