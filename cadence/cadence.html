.matrix__task { display: flex; justify-content: space-between; gap: var(--sp-2); width: 100%; padding: 4px var(--sp-2); border-radius: var(--radius-sm); text-align: left; font-size: var(--fs-sm); }
.matrix__task:hover { background: var(--surface-2); }
.matrix__due { color: var(--text-3); white-space: nowrap; }
.matrix__empty, .matrix__more { font-size: var(--fs-sm); color: var(--text-3); padding: var(--sp-2); }

/* ------------------------------------------------------------ insights */

.insight__sentence { color: var(--text-2); max-width: 70ch; margin-bottom: var(--sp-3); }
.loadchart { display: flex; gap: 4px; align-items: flex-end; height: 168px; }
.loadchart__col {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  height: 100%;
  cursor: pointer;
  border-radius: var(--radius-sm);
  padding: 2px;
}
.loadchart__col:hover { background: var(--surface-2); }
.loadchart__bar-wrap { flex: 1; width: 100%; display: flex; align-items: flex-end; }
.loadchart__bar { width: 100%; border-radius: 4px 4px 0 0; background: var(--accent); opacity: 0.8; }
.loadchart__bar.is-full { background: var(--warn); }
.loadchart__due {
  min-width: 17px; height: 17px;
  border-radius: 50%;
  background: var(--surface-3);
  font-size: 10px;
  display: grid; place-items: center;
  color: var(--text-2);
}
.loadchart__due.is-empty { background: transparent; }
.loadchart__label { font-size: var(--fs-xs); color: var(--text-3); }
.loadchart__date { font-size: var(--fs-xs); color: var(--text-2); font-weight: 600; }

/* -------------------------------------------------------------- search */

.search__bar {
  display: flex; align-items: center; gap: var(--sp-3);

.search__filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--sp-4); }
.search__tags { display: flex; flex-wrap: wrap; gap: 6px; }
.search__list { display: flex; flex-direction: column; gap: 1px; }
.search__row { display: flex; align-items: center; gap: var(--sp-3); width: 100%; padding: var(--sp-2) var(--sp-3); border-radius: var(--radius); text-align: left; }

.search__main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.search__title { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search__sub { font-size: var(--fs-sm); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search__type { font-size: var(--fs-xs); color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; }

/* ------------------------------------------------------------ settings */

.view--settings { max-width: 780px; }
.settings__section { padding: var(--sp-5) 0; border-bottom: 1px solid var(--border); }
.settings__section:last-child { border-bottom: none; }
.settings__title { font-size: var(--fs-md); font-weight: 650; margin-bottom: var(--sp-4); }
.settings__body { display: flex; flex-direction: column; }
.settings__list { display: flex; flex-direction: column; gap: 2px; margin-bottom: var(--sp-3); }
.settings__row { display: flex; align-items: center; gap: var(--sp-3); padding: 4px 0; }
.settings__swatch { width: 22px; height: 22px; border-radius: 6px; flex: none; border: 1px solid rgba(0,0,0,0.12); }
.settings__name { flex: 1; height: 32px; border: 1px solid transparent; border-radius: var(--radius-sm); padding: 0 var(--sp-2); background: none; }
.settings__name:hover { border-color: var(--border); }
.settings__name:focus { border-color: var(--accent); background: var(--surface); outline: none; }
.settings__name-static { flex: 1; }
.settings__meta { font-size: var(--fs-sm); color: var(--text-3); }
.settings__buttons { display: flex; flex-wrap: wrap; gap: var(--sp-2); }

.shortcuts { display: flex; flex-direction: column; gap: 2px; }
.shortcuts__row { display: flex; align-items: center; gap: var(--sp-4); padding: 4px 0; }
.shortcuts__row dt { width: 128px; flex: none; }
.shortcuts__row dd { color: var(--text-2); font-size: var(--fs-sm); }

/* ----------------------------------------------------- assistant flows */

.qa__inputwrap {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-2) var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface-2);
  color: var(--accent);
  margin-bottom: var(--sp-3);
}
.qa__inputwrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface); }
.qa__input { flex: 1; border: none; outline: none; background: none; height: 38px; font-size: var(--fs-lg); color: var(--text); }
.qa__types { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: var(--sp-3); }
.qa__type {
  display: inline-flex; align-items: center; gap: 5px;
  height: 30px; padding: 0 10px;
  border-radius: 15px;
  border: 1px solid var(--border);
  font-size: var(--fs-sm);
  color: var(--text-3);
}
.qa__type:hover { color: var(--text); border-color: var(--border-strong); }
.qa__type[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.qa__card { padding: var(--sp-4); border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface-2); }
.qa__card-title { font-size: var(--fs-lg); font-weight: 650; margin-bottom: var(--sp-2); }
.qa__chips { display: flex; flex-wrap: wrap; gap: 5px; }
.qa__chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  font-size: var(--fs-sm);
  color: var(--text-2);
}
.qa__chip--sm { font-size: var(--fs-xs); padding: 1px 7px; }
.qa__chip.is-inferred { border-style: dashed; color: var(--text-3); }
.qa__assume { display: flex; align-items: flex-start; gap: 6px; margin-top: var(--sp-3); font-size: var(--fs-sm); color: var(--warn); }
.qa__hints { padding: var(--sp-2) 0; }
.qa__hints-title { font-size: var(--fs-sm); color: var(--text-3); margin-bottom: var(--sp-2); }
.qa__hints-list { display: flex; flex-direction: column; gap: 2px; }
.qa__hint {
  text-align: left; width: 100%;
  padding: 5px var(--sp-3);
  border-radius: var(--radius-sm);
  font-size: var(--fs-sm);
  color: var(--text-2);
}
.qa__hint:hover { background: var(--surface-2); color: var(--accent); }

.organize__input {
  width: 100%;
  min-height: 150px;
  padding: var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  resize: vertical;
  line-height: 1.6;
}
.organize__input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); outline: none; }
.organize__tip { display: flex; align-items: flex-start; gap: 6px; font-size: var(--fs-sm); color: var(--text-3); margin-top: var(--sp-3); }
.organize__head { margin-bottom: var(--sp-3); }
.organize__lead { color: var(--text-2); margin-bottom: var(--sp-2); }
.organize__summary { display: flex; flex-wrap: wrap; gap: var(--sp-3); }
.organize__count { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-sm); font-weight: 600; color: var(--accent); }
.organize__summary-empty { font-size: var(--fs-sm); color: var(--text-3); }
.organize__list { display: flex; flex-direction: column; gap: var(--sp-2); }
.orow {
  display: flex; gap: var(--sp-3);
  padding: var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
}
.orow.is-excluded { opacity: 0.45; }
.orow__check { margin-top: 5px; }
.orow__main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.orow__top { display: flex; gap: var(--sp-2); align-items: center; }
.orow__type { width: 116px; flex: none; height: 30px; }
.orow__title { flex: 1; min-width: 0; height: 30px; border: 1px solid transparent; border-radius: var(--radius-sm); padding: 0 var(--sp-2); background: var(--surface-2); font-weight: 600; }
.orow__title:focus { border-color: var(--accent); background: var(--surface); outline: none; }
.orow__edit { flex: none; }
.orow__detail { display: flex; flex-wrap: wrap; gap: 4px; }
.orow__nodetail { font-size: var(--fs-xs); color: var(--text-3); }
.orow__source { font-size: var(--fs-xs); color: var(--text-3); font-style: italic; }

.findtime { display: flex; flex-direction: column; }
.slots { display: flex; flex-direction: column; gap: var(--sp-2); }
.slot {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
}
.slot.is-best { border-color: var(--accent); background: var(--accent-soft); }
.slot__main { flex: 1; min-width: 0; }
.slot__when { display: flex; gap: var(--sp-2); align-items: baseline; flex-wrap: wrap; }
.slot__time { color: var(--text-2); }
.slot__why { font-size: var(--fs-sm); color: var(--text-3); margin-top: 2px; }

.plan__stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-3); margin-bottom: var(--sp-3); }
.plan__stat { padding: var(--sp-2) var(--sp-3); border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-2); }
.plan__stat.is-warn { border-color: var(--warn); background: var(--warn-soft); }
.plan__stat-value { display: block; font-size: var(--fs-md); font-weight: 650; }
.plan__stat-label { display: block; font-size: var(--fs-xs); color: var(--text-3); }
.plan__list { display: flex; flex-direction: column; gap: 2px; margin-top: var(--sp-2); }
.plan__row {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
}
.plan__row.is-fixed { background: var(--surface-2); border-style: dashed; }
.plan__row.is-break { background: var(--ok-soft); border-color: transparent; }
.plan__row.is-excluded { opacity: 0.4; }
.plan__time { width: 132px; flex: none; font-size: var(--fs-sm); color: var(--text-3); font-variant-numeric: tabular-nums; }
.plan__main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.plan__title { font-weight: 550; }
.plan__why, .plan__tag { font-size: var(--fs-sm); color: var(--text-3); }
.plan__lock { color: var(--text-3); display: flex; }
.plan__foot { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); width: 100%; }
.plan__day { margin-bottom: var(--sp-4); }
.plan__day-title { display: flex; justify-content: space-between; align-items: baseline; gap: var(--sp-3); font-size: var(--fs-base); font-weight: 650; }
.plan__day-meta { font-size: var(--fs-sm); color: var(--text-3); font-weight: 400; }
.plan__hint { font-size: var(--fs-sm); color: var(--text-3); }

@media (max-width: 620px) {
  .plan__stats { grid-template-columns: 1fr; }
  .plan__time { width: 108px; font-size: var(--fs-xs); }
}

.whatnow__headline { font-size: var(--fs-lg); font-weight: 600; margin-bottom: var(--sp-3); }
.whatnow__card { padding: var(--sp-4); border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface-2); }
.whatnow__label { font-size: var(--fs-xs); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
.whatnow__title { font-size: var(--fs-xl); font-weight: 650; letter-spacing: -0.01em; margin: 2px 0; }
.whatnow__meta { color: var(--text-2); }
.whatnow__why { display: flex; gap: var(--sp-2); margin-top: var(--sp-3); font-size: var(--fs-sm); color: var(--text-2); }
.whatnow__why-label { font-weight: 700; color: var(--text-3); text-transform: uppercase; font-size: var(--fs-xs); letter-spacing: 0.06em; padding-top: 2px; }
.whatnow__actions { display: flex; gap: var(--sp-2); margin-top: var(--sp-4); flex-wrap: wrap; }
.whatnow__next { display: flex; align-items: center; gap: 6px; margin-top: var(--sp-3); font-size: var(--fs-sm); color: var(--text-3); }
.whatnow__alts { display: flex; flex-direction: column; gap: var(--sp-2); margin-bottom: var(--sp-3); }
.whatnow__alt {
  display: flex; flex-direction: column; gap: 2px;
  padding: var(--sp-3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  text-align: left;
}
.whatnow__alt:hover { border-color: var(--accent); background: var(--accent-soft); }
.whatnow__alt-title { font-weight: 600; }
.whatnow__alt-meta { font-size: var(--fs-sm); color: var(--text-3); }

.conflict__pair { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-4); flex-wrap: wrap; }
.conflict__card {
  flex: 1; min-width: 180px;
  display: flex; flex-direction: column; gap: 2px;
  padding: var(--sp-3);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  background: var(--surface-2);
  font-size: var(--fs-sm);
}
.conflict__vs { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--danger); font-weight: 700; }
.conflict__options { display: flex; flex-direction: column; gap: var(--sp-2); }

.recovery { display: flex; flex-direction: column; gap: var(--sp-3); }
.recovery__row { padding: var(--sp-3); border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); }
.recovery__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3); margin-bottom: var(--sp-2); }
.recovery__title { font-weight: 600; }
.recovery__due { font-size: var(--fs-sm); color: var(--danger); white-space: nowrap; }
.recovery__actions { display: flex; flex-wrap: wrap; gap: 5px; }
.recovery__bulk { display: flex; justify-content: flex-end; }

/* ------------------------------------------------------------- palette */

.dialog--palette { max-width: 620px; }
.dialog--palette .dialog__body { padding: 0; }
.palette { display: flex; flex-direction: column; max-height: 66vh; }
.palette__head {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-4) var(--sp-5);
  border-bottom: 1px solid var(--border);
  color: var(--text-3);
}
.palette__input { flex: 1; border: none; outline: none; background: none; font-size: var(--fs-lg); height: 30px; color: var(--text); }
.palette__list { flex: 1; overflow-y: auto; padding: var(--sp-2); }
.palette__group {
  font-size: var(--fs-xs);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-3);
  padding: var(--sp-2) var(--sp-3) 3px;
}
.palette__row {
  display: flex; align-items: center; gap: var(--sp-3);
  width: 100%;
  padding: 7px var(--sp-3);
  border-radius: var(--radius);
  text-align: left;
  color: var(--text-2);
}
.palette__row.is-active { background: var(--accent-soft); color: var(--text); }
.palette__icon { color: var(--text-3); display: flex; }
.palette__row.is-active .palette__icon { color: var(--accent); }
.palette__label { flex: none; max-width: 58%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.palette__hint { flex: 1; font-size: var(--fs-sm); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
.palette__kbd { font-size: var(--fs-xs); }
.palette__empty { padding: var(--sp-5); text-align: center; color: var(--text-3); }
.palette__empty-actions { display: flex; justify-content: center; padding-bottom: var(--sp-4); }
.palette__foot {
  display: flex; gap: var(--sp-4);
  padding: var(--sp-2) var(--sp-5);
  border-top: 1px solid var(--border);
  background: var(--surface-2);
}
.palette__foot-item { display: flex; align-items: center; gap: 5px; font-size: var(--fs-xs); color: var(--text-3); }

/* ---------------------------------------------------------- focus mode */

.is-focus body { overflow: hidden; }
.focus {
  position: fixed;
  inset: 0;
  z-index: 180;
  background: var(--bg);
  display: grid;
  place-items: center;
  padding: var(--sp-5);
}
.focus__inner { width: min(460px, 100%); display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--sp-3); }
.focus__top { width: 100%; display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-5); }
.focus__eyebrow { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-3); }
.focus__ring-wrap { position: relative; }
.focus__ring-track { stroke: var(--surface-3); }
.focus__ring-bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 500ms linear; }
.focus__ring-bar.is-over { stroke: var(--warn); }
.focus__title { font-size: var(--fs-xl); font-weight: 650; letter-spacing: -0.02em; }
.focus__remaining { font-size: 46px; font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1; }
.focus__remaining.is-over { color: var(--warn); }
.focus__state { font-size: var(--fs-sm); color: var(--text-3); }
.focus__progress-label { font-size: var(--fs-sm); color: var(--text-3); }
.focus__controls { display: flex; flex-wrap: wrap; gap: var(--sp-2); justify-content: center; margin-top: var(--sp-3); }
.focus__next { display: flex; align-items: center; gap: 6px; margin-top: var(--sp-5); font-size: var(--fs-sm); color: var(--text-3); }

/* ---------------------------------------------------------- onboarding */

/* These footers are wrappers inside .dialog__foot, so they carry the same
   left/right split rather than letting their buttons stack. */
.onboard__foot, .organize__foot, .plan__foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  width: 100%;
}
.onboard__foot .sheet__foot-right:only-child,
.organize__foot .sheet__foot-right:only-child { margin-left: auto; }

.onboard { display: flex; flex-direction: column; gap: var(--sp-3); min-height: 220px; }
.onboard__progress { display: flex; gap: 5px; }
.onboard__pip { width: 26px; height: 3px; border-radius: 2px; background: var(--surface-3); }
.onboard__pip.is-on { background: var(--accent); }
.onboard__title { font-size: var(--fs-lg); font-weight: 650; margin-top: var(--sp-2); }
.onboard__hint { font-size: var(--fs-sm); color: var(--text-3); margin-top: -6px; }
.onboard__choices { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.onboard__choice {
  padding: var(--sp-2) var(--sp-4);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--text-2);
}
.onboard__choice[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }

  <script>

/* ========================================================================
   js/core/time.js
   ======================================================================== */
/* Cadence — time utilities.
   The app stores every instant as an ISO string in UTC. Everything the user
   sees is "wall time" in the display timezone. T.w(iso) converts an instant to
   a Date whose *local* getters read as wall time; T.u(wallDate) converts back. */
(function (global) {
  'use strict';

  var DISPLAY_TZ = null; // null = use the browser's own zone (the fast path)

  var MIN = 60000, HOUR = 3600000, DAY = 86400000;

  var DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var DAY_SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var DAY_MIN = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
    'August', 'September', 'October', 'November', 'December'];
  var MONTH_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  var offsetCache = Object.create(null);

  /* Minutes east of UTC for `tz` at instant `date`. */
  function zoneOffset(date, tz) {
    var bucket = Math.floor(date.getTime() / HOUR);
    var key = tz + '|' + bucket;
    if (offsetCache[key] !== undefined) return offsetCache[key];
    var parts;
    try {
      parts = new Intl.DateTimeFormat('en-US', {
        timeZone: tz, hour12: false,
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      }).formatToParts(date);
    } catch (e) {
      offsetCache[key] = -date.getTimezoneOffset();
      return offsetCache[key];
    }
    var p = {};
    for (var i = 0; i < parts.length; i++) p[parts[i].type] = parts[i].value;
    var hour = p.hour === '24' ? 0 : +p.hour;
    var asUTC = Date.UTC(+p.year, +p.month - 1, +p.day, hour, +p.minute, +p.second);
    var value = Math.round((asUTC - date.getTime()) / MIN);
    offsetCache[key] = value;
    return value;
  }

  function setZone(tz) {
    DISPLAY_TZ = (!tz || tz === 'local' || tz === localZone()) ? null : tz;
  }
  function zone() { return DISPLAY_TZ || localZone(); }
  function localZone() {
    try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; }
    catch (e) { return 'UTC'; }
  }

  /* instant -> wall-clock Date in the display zone */
  function w(input) {
    var d = toDate(input);
    if (!DISPLAY_TZ) return d;
    var shift = zoneOffset(d, DISPLAY_TZ) + d.getTimezoneOffset();
    return new Date(d.getTime() + shift * MIN);
  }

  /* wall-clock Date in the display zone -> real instant */
  function u(wall) {
    var d = toDate(wall);
    if (!DISPLAY_TZ) return d;
    var guessShift = zoneOffset(d, DISPLAY_TZ) + d.getTimezoneOffset();
    var guess = new Date(d.getTime() - guessShift * MIN);
    var realShift = zoneOffset(guess, DISPLAY_TZ) + d.getTimezoneOffset();
    if (realShift !== guessShift) guess = new Date(d.getTime() - realShift * MIN);
    return guess;
  }

  function iso(wall) { return u(wall).toISOString(); }

  function toDate(v) {
    if (v instanceof Date) return v;
    if (typeof v === 'number') return new Date(v);
    if (typeof v === 'string') {
      var d = new Date(v);
      if (!isNaN(d.getTime())) return d;
    }
    return new Date(NaN);
  }

  function valid(d) { return d instanceof Date && !isNaN(d.getTime()); }

  /* ---- wall-time arithmetic (operates on wall Dates) ---- */
  function startOfDay(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function endOfDay(d) { var x = new Date(d); x.setHours(23, 59, 59, 999); return x; }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function addMinutes(d, n) { return new Date(d.getTime() + n * MIN); }

      return;
    }
    if ((m = cur.find(/\bevery\s+(\d+)\s+(days?|weeks?|months?)\b/i))) {
      cur.take(m.index, m.index + m[0].length);
      var u = m[2].toLowerCase();
      out.recurrence = {
        freq: /^d/.test(u) ? 'daily' : /^w/.test(u) ? 'weekly' : 'monthly',
        interval: Math.max(1, +m[1])
      };
      note('Repeats', R.describe(out.recurrence), out.recurrence);
      return;
    }
    // "every mon and wed", "every tuesday"
    if ((m = cur.find(/\bevery\s+((?:mon|tues?|wed(?:nes)?|thur?s?|fri|sat(?:ur)?|sun)(?:day)?s?(?:\s*(?:,|and|&)\s*(?:mon|tues?|wed(?:nes)?|thur?s?|fri|sat(?:ur)?|sun)(?:day)?s?)*)\b/i))) {
      cur.take(m.index, m.index + m[0].length);
      var days = [];
      m[1].split(/\s*(?:,|and|&)\s*/).forEach(function (d) {
        var key = d.trim().toLowerCase();
        if (WEEKDAYS[key] !== undefined) days.push(WEEKDAYS[key]);
      });
      if (days.length) {
        out.recurrence = { freq: 'weekly', interval: 1, byDay: days };
        note('Repeats', R.describe(out.recurrence), out.recurrence);
      }
      return;
    }
    if ((m = cur.find(/\b(daily|weekly|biweekly|fortnightly|monthly|yearly|annually)\b/i))) {
      cur.take(m.index, m.index + m[0].length);
      var w = m[1].toLowerCase();
      out.recurrence = w === 'daily' ? { freq: 'daily', interval: 1 }
        : w === 'weekly' ? { freq: 'weekly', interval: 1 }
          : (w === 'biweekly' || w === 'fortnightly') ? { freq: 'weekly', interval: 2 }
            : w === 'monthly' ? { freq: 'monthly', interval: 1 }
              : { freq: 'yearly', interval: 1 };
      note('Repeats', R.describe(out.recurrence), out.recurrence);
      return;
    }
    if ((m = cur.find(/\bon\s+weekdays\b/i))) {
      cur.take(m.index, m.index + m[0].length);
      out.recurrence = { freq: 'weekly', interval: 1, byDay: [1, 2, 3, 4, 5] };
      note('Repeats', R.describe(out.recurrence), out.recurrence);
    }
  }

  function parseTime(cur, out, note, settings) {
    var m;
    // 4-6, 4–6pm, from 4 to 6, between 2 and 3:30
    var rangeRe = /\b(?:from\s+|between\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)?\s*(?:-|–|—|to|until|till|thru|through|and)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)?\b/i;
    m = cur.find(rangeRe);
    if (m && plausibleTime(m[1]) && plausibleTime(m[4])) {
      // "between 2 and 3" is a time range; "meet 5 and 6 people" is not — require
      // an explicit meridiem, a colon, or a from/between/dash form.
      var explicit = m[3] || m[6] || m[2] || m[5] || /^(?:from|between)/i.test(m[0]) || /[-–—]/.test(m[0]) || /\bto\b/i.test(m[0]);
      if (explicit) {
        cur.take(m.index, m.index + m[0].length);
        var s = hhmm(m[1], m[2], m[3]);
        var e = hhmm(m[4], m[5], m[6]);
        if (!m[3] && m[6]) s = inferMeridiem(+m[1], s, /p/i.test(m[6]) ? 'pm' : 'am');
        else if (!m[3] && !m[6]) s = inferMeridiem(+m[1], s);
        if (!m[6] && m[3]) e = inferMeridiem(+m[4], e, /p/i.test(m[3]) ? 'pm' : 'am');
        else if (!m[6] && !m[3]) e = inferMeridiem(+m[4], e);
        if (e <= s) e += 12 * 60;            // "4-6" where 6 landed in the morning
        if (e > 24 * 60) e = 24 * 60 - 1;
        out.startMinutes = s;
        out.endMinutes = e;
        out.durationMinutes = e - s;
        note('Time', fmtMin(s, settings) + ' – ' + fmtMin(e, settings), [s, e]);
        return;
      }
    }
    // at 3, @ 3:30pm, 3pm
    m = cur.find(/\b(?:at|@)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)?\b/i);
    if (m && plausibleTime(m[1])) {
      cur.take(m.index, m.index + m[0].length);
      // An explicit am/pm is already applied by hhmm; inferring on top of it
      // would shift "9pm" to 33:00.
      out.startMinutes = m[3] ? hhmm(m[1], m[2], m[3]) : inferMeridiem(+m[1], hhmm(m[1], m[2], null));
      note('Time', fmtMin(out.startMinutes, settings), out.startMinutes);
      return;
    }
    m = cur.find(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)\b/i);
    if (m && plausibleTime(m[1])) {
      cur.take(m.index, m.index + m[0].length);
      out.startMinutes = hhmm(m[1], m[2], m[3]);
      note('Time', fmtMin(out.startMinutes, settings), out.startMinutes);
      return;
    }
    m = cur.find(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);
    if (m) {
      cur.take(m.index, m.index + m[0].length);
      out.startMinutes = hhmm(m[1], m[2], null);
      note('Time', fmtMin(out.startMinutes, settings), out.startMinutes);
      return;
    }
    m = cur.find(/\b(noon|midday|midnight|morning|afternoon|evening|tonight)\b/i);
    if (m) {
      var word = m[1].toLowerCase();
      var mins = word === 'tonight' ? NAMED_TIMES.evening : NAMED_TIMES[word];
      if (mins !== undefined) {
        // "tonight" also carries the day, so leave it for the date parser.
        if (word !== 'tonight') cur.take(m.index, m.index + m[0].length);
        out.startMinutes = mins;
        out.vagueTime = true;
        note('Time', fmtMin(mins, settings) + ' (' + word + ')', mins);
        return;
      }
    }
    // A meal word suggests a time but is almost always part of the title too
    // ("Lunch with Marcus"), so it is read without being consumed.
    m = cur.find(/\b(breakfast|lunch|dinner)\b/i);
    if (m) {
      out.startMinutes = NAMED_TIMES[m[1].toLowerCase()];
      out.vagueTime = true;
      note('Time', fmtMin(out.startMinutes, settings) + ' (around ' + m[1].toLowerCase() + ')', out.startMinutes);
    }
  }

  function plausibleTime(h) { return +h >= 0 && +h <= 24; }

  function fmtMin(mins, settings) {
    var d = new Date(2000, 0, 1, 0, 0, 0, 0);
    d.setMinutes(mins);
    return T.fmtTime(d, settings.use24Hour);
  }

  function parseDate(cur, out, note, now) {
    var m;
    if ((m = cur.find(/\b(today|tonight|tonite)\b/i))) {
      cur.take(m.index, m.index + m[0].length);
      out.dayWall = T.startOfDay(now);
      note('Date', 'Today', T.key(out.dayWall));
      return;
    }
    if ((m = cur.find(/\b(tomorrow|tmrw|tmr|tmw)\b/i))) {
      cur.take(m.index, m.index + m[0].length);
      out.dayWall = T.startOfDay(T.addDays(now, 1));
      note('Date', 'Tomorrow', T.key(out.dayWall));
      return;
    }
    if ((m = cur.find(/\byesterday\b/i))) {
      cur.take(m.index, m.index + m[0].length);
      out.dayWall = T.startOfDay(T.addDays(now, -1));
      note('Date', 'Yesterday', T.key(out.dayWall));
      return;
    }
    if ((m = cur.find(/\bday after tomorrow\b/i))) {
      cur.take(m.index, m.index + m[0].length);
      out.dayWall = T.startOfDay(T.addDays(now, 2));
      note('Date', T.fmtDate(out.dayWall), T.key(out.dayWall));
      return;
    }
    // next monday / this friday / on wednesday
    if ((m = cur.find(/\b(?:(next|this|coming|on)\s+)?(sunday|sun|monday|mon|tuesday|tues|tue|wednesday|weds|wed|thursday|thurs|thur|thu|friday|fri|saturday|sat)\b/i))) {
      var qualifier = (m[1] || '').toLowerCase();
      var dayName = m[2].toLowerCase();
      var target = WEEKDAYS[dayName];
      if (target !== undefined) {
        cur.take(m.index, m.index + m[0].length);
        var d = T.startOfDay(now);
        if (qualifier === 'next') {
          out.dayWall = nextWeekDay(d, target);
        } else {
          var delta = (target - d.getDay() + 7) % 7;
          // A bare weekday name means the next one coming up, not today.
          if (delta === 0 && qualifier !== 'this') delta = 7;
          out.dayWall = T.addDays(d, delta);
        }
        note('Date', T.relativeDay(out.dayWall, now) + ' · ' + T.fmtDateShort(out.dayWall), T.key(out.dayWall));
        return;
      }
    }
    if ((m = cur.find(/\bnext\s+(week|month|year)\b/i))) {
      cur.take(m.index, m.index + m[0].length);
      var unit = m[1].toLowerCase();
      out.dayWall = unit === 'week' ? T.addDays(now, 7) : unit === 'month' ? T.addMonths(now, 1) : T.addYears(now, 1);
      out.dayWall = T.startOfDay(out.dayWall);
      out.vagueDate = true;
      note('Date', 'Next ' + unit + ' · ' + T.fmtDateShort(out.dayWall), T.key(out.dayWall));
      return;
    }
    if ((m = cur.find(/\bin\s+(\d+)\s+(days?|weeks?|months?)\b/i))) {
      cur.take(m.index, m.index + m[0].length);
      var n = +m[1], u = m[2].toLowerCase();
      out.dayWall = T.startOfDay(/^d/.test(u) ? T.addDays(now, n) : /^w/.test(u) ? T.addDays(now, n * 7) : T.addMonths(now, n));
      note('Date', T.fmtDate(out.dayWall), T.key(out.dayWall));
      return;
    }
    // ISO
    if ((m = cur.find(/\b(\d{4})-(\d{2})-(\d{2})\b/))) {
      cur.take(m.index, m.index + m[0].length);
      out.dayWall = new Date(+m[1], +m[2] - 1, +m[3]);
      note('Date', T.fmtDate(out.dayWall), T.key(out.dayWall));
      return;
    }
    // Month name + day  /  day + month name
    var monthNames = Object.keys(MONTHS).join('|');
    if ((m = cur.find(new RegExp('\\b(' + monthNames + ')\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?(?:,?\\s*(\\d{4}))?\\b', 'i')))) {
      cur.take(m.index, m.index + m[0].length);
      out.dayWall = resolveMonthDay(MONTHS[m[1].toLowerCase()], +m[2], m[3] ? +m[3] : null, now);
      note('Date', T.fmtDate(out.dayWall), T.key(out.dayWall));
      return;
    }
    if ((m = cur.find(new RegExp('\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+(?:of\\s+)?(' + monthNames + ')\\.?(?:,?\\s*(\\d{4}))?\\b', 'i')))) {
      cur.take(m.index, m.index + m[0].length);
      out.dayWall = resolveMonthDay(MONTHS[m[2].toLowerCase()], +m[1], m[3] ? +m[3] : null, now);
      note('Date', T.fmtDate(out.dayWall), T.key(out.dayWall));
      return;
    }
    // 10/18 or 10/18/2026
    if ((m = cur.find(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))) {
      cur.take(m.index, m.index + m[0].length);
      var yr = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : null;
      out.dayWall = resolveMonthDay(+m[1] - 1, +m[2], yr, now);
      note('Date', T.fmtDate(out.dayWall), T.key(out.dayWall));
      return;
    }
    // "the 15th"
    if ((m = cur.find(/\bthe\s+(\d{1,2})(?:st|nd|rd|th)\b/i))) {
      cur.take(m.index, m.index + m[0].length);
      var day = +m[1];
      var candidate = new Date(now.getFullYear(), now.getMonth(), Math.min(day, T.daysInMonth(now.getFullYear(), now.getMonth())));
      if (candidate < T.startOfDay(now)) candidate = T.addMonths(candidate, 1);
      out.dayWall = T.startOfDay(candidate);
      note('Date', T.fmtDate(out.dayWall), T.key(out.dayWall));
    }
  }

  /* "next Monday" = the Monday of the following calendar week. */
  function nextWeekDay(from, targetDow) {
    var startNextWeek = T.addDays(T.startOfWeek(from, 0), 7);
    return T.addDays(startNextWeek, targetDow);
  }

  function resolveMonthDay(monthIdx, day, year, now) {
    if (monthIdx < 0 || monthIdx > 11) monthIdx = now.getMonth();
    var y = year || now.getFullYear();
    var d = new Date(y, monthIdx, Math.min(day, T.daysInMonth(y, monthIdx)));
    // Bare "Oct 18" in December means next year.
    if (!year && d < T.startOfDay(T.addDays(now, -1))) d = new Date(y + 1, monthIdx, Math.min(day, T.daysInMonth(y + 1, monthIdx)));
    return T.startOfDay(d);
  }

  function matchProject(name) {
    var lower = String(name).toLowerCase().trim();
    var list = S.all('projects');
    for (var i = 0; i < list.length; i++) {
      if (list[i].name.toLowerCase() === lower) return list[i];
    }
    for (var j = 0; j < list.length; j++) {
      if (list[j].name.toLowerCase().indexOf(lower) >= 0 || lower.indexOf(list[j].name.toLowerCase()) >= 0) return list[j];
    }
    return null;
  }

  function findKnownProject(raw, cur) {
    var lower = raw.toLowerCase();
    var best = null, bestIdx = -1;
    S.all('projects').forEach(function (p) {
      var n = p.name.toLowerCase();
      if (n.length < 4) return;
      var idx = lower.indexOf(n);
      if (idx >= 0 && cur.free(idx, idx + n.length) && (!best || n.length > best.name.length)) {
        best = p; bestIdx = idx;
      }
    });
    // The project name usually *is* part of the title, so don't consume it.
    return best;
  }

  var CATEGORY_HINTS = [
    { re: /\b(class|lecture|school|homeroom|seminar|period)\b/i, cat: 'cat_school' },
    { re: /\b(homework|essay|assignment|worksheet|problem set|pset)\b/i, cat: 'cat_homework' },
    { re: /\b(study|studying|review|revise|exam|test|quiz|midterm|final)\b/i, cat: 'cat_study' },
    { re: /\b(gym|run|running|workout|exercise|soccer|basketball|swim|practice drills|training)\b/i, cat: 'cat_exercise' },
    { re: /\b(piano|guitar|violin|rehearsal|practice|band|choir)\b/i, cat: 'cat_practice' },
    { re: /\b(draw|design|write|writing|paint|compose|edit video|creative)\b/i, cat: 'cat_creative' },
    { re: /\b(family|mom|dad|grandma|grandpa|sister|brother|dinner with)\b/i, cat: 'cat_family' },
    { re: /\b(doctor|dentist|appointment|therapy|checkup|clinic)\b/i, cat: 'cat_health' },
    { re: /\b(relax|rest|break|nap|chill|unwind)\b/i, cat: 'cat_relax' },
    { re: /\b(drive|flight|train|commute|travel|leave for)\b/i, cat: 'cat_travel' }
  ];

  function guessCategory(title, tags) {
    var hay = (title + ' ' + (tags || []).join(' ')).toLowerCase();
    for (var i = 0; i < CATEGORY_HINTS.length; i++) {
      if (CATEGORY_HINTS[i].re.test(hay) && S.get('categories', CATEGORY_HINTS[i].cat)) {
        return CATEGORY_HINTS[i].cat;
      }
    }
    return null;
  }

  var EXAM_WORDS = /\b(test|exam|quiz|midterm|finals?|presentation due|assignment)\b/i;
  var PROJECT_WORDS = /\b(project|portfolio|thesis|dissertation|campaign)\b/i;

  function decideType(out, settings) {
    if (out.type) return;

    // "Math test Friday" is a point in time you must be ready for, not a to-do.
    if (out.dayWall && out.endMinutes === null && EXAM_WORDS.test(out.title) && !/\bstudy|revise|prepare|practice\b/i.test(out.input)) {
      out.type = 'deadline'; return;
    }
    // "Science project due next month" describes a body of work, not one task.
    if (PROJECT_WORDS.test(out.title) && !/\b(finish|submit|hand in|turn in|email|print|buy)\b/i.test(out.input) &&
      (out.vagueDate || (out.dayWall && T.diffDays(T.nowWall(), out.dayWall) > 21))) {
      out.type = 'project'; return;
    }
    if (out.isDeadline && out.startMinutes === null) { out.type = 'deadline'; return; }
    if (out.isDeadline && out.startMinutes !== null && out.endMinutes === null) { out.type = 'deadline'; return; }
    if (out.recurrence && out.endMinutes === null && HABIT_VERBS.test(out.input) && (out.durationMinutes || 0) <= 60) {
      out.type = 'habit'; return;
    }
    if (out.recurrence) { out.type = 'event'; return; }
    if (out.isReminder) { out.type = 'task'; return; }
    if (out.endMinutes !== null) { out.type = 'event'; return; }
    if (out.startMinutes !== null && !out.vagueTime) { out.type = 'event'; return; }
    if (out.dayWall && !out.durationMinutes && /\b(meeting|appointment|class|lunch|dinner|party|concert|game|interview|call)\b/i.test(out.input)) {
      out.type = 'event'; return;
    }
    out.type = 'task';
  }

  /* Turn the parsed fragments into real instants plus a payload per type. */
  function materialize(out, now, settings) {
    var day = out.dayWall;
    var defaultDur = settings.defaultEventDuration || 60;

    if (out.type === 'event' || out.type === 'habit') {
      if (!day) {
        day = T.startOfDay(now);
        // A time already gone today naturally means tomorrow.
        if (out.startMinutes !== null && out.startMinutes < T.minutesOfDay(now)) day = T.addDays(day, 1);
        // "every Mon and Wed" should start on the next Monday or Wednesday,
        // not on whatever day it happens to be typed.
        if (out.recurrence && out.recurrence.byDay && out.recurrence.byDay.length) {
          for (var i = 0; i < 7; i++) {
            var candidate = T.addDays(day, i);
            if (out.recurrence.byDay.indexOf(candidate.getDay()) >= 0) { day = candidate; break; }
          }
        }
        out.inferredDate = true;
      }
      var startMin = out.startMinutes;
      if (startMin === null) {
        // A habit without a time is simply untimed, not an all-day event.
        out.allDay = out.type === 'event';
        startMin = settings.workingHours.start;
      }
      var start = T.atMinutes(day, startMin);
      var dur = out.durationMinutes || defaultDur;
      var end = out.endMinutes !== null ? T.atMinutes(day, out.endMinutes) : T.addMinutes(start, dur);
      out.startWall = start;
      out.endWall = end;
      out.durationMinutes = T.diffMinutes(start, end);
    } else if (out.type === 'deadline') {
      if (!day) { day = T.startOfDay(now); out.inferredDate = true; }
      var dueMin = out.startMinutes !== null ? out.startMinutes : 23 * 60 + 59;
      out.dueWall = T.atMinutes(day, dueMin);
      out.hasDueTime = out.startMinutes !== null;
    } else if (out.type === 'task') {
      if (day) {
        var tm = out.startMinutes !== null ? out.startMinutes : 23 * 60 + 59;
        out.dueWall = T.atMinutes(day, tm);
        out.hasDueTime = out.startMinutes !== null;
      }
      out.estimate = out.durationMinutes || null;
    } else if (day) {
      // Projects, goals and notes keep a target date when one was written.
      out.dueWall = T.atMinutes(day, 23 * 60 + 59);
    }
  }

  /* ---------------- payload builders ---------------- */

  function toPayload(p) {
    switch (p.type) {
      case 'event':
        return {
          title: p.title,
          start: T.iso(p.startWall),
          end: T.iso(p.endWall),
          allDay: !!p.allDay,
          recurrence: p.recurrence,
          categoryId: p.categoryId,
          projectId: p.projectId,
          goalId: p.goalId,
          tags: p.tags,
          location: p.location,
          priority: p.priority,
          participants: (p.people || []).map(function (n) { return { name: n, rsvp: 'none' }; })
        };
      case 'task':
        return {
          title: p.title,
          due: p.dueWall ? T.iso(p.dueWall) : null,
          hasDueTime: !!p.hasDueTime,
          estimate: p.estimate || null,
          priority: p.priority || 'medium',
          categoryId: p.categoryId,
          projectId: p.projectId,
          goalId: p.goalId,
          tags: p.tags,
          recurrence: p.recurrence,
          status: 'inbox'
        };
      case 'deadline':
        return {
          title: p.title,
          due: T.iso(p.dueWall),
          hasDueTime: !!p.hasDueTime,
          type: guessDeadlineKind(p.title),
          projectId: p.projectId,
          goalId: p.goalId,
          tags: p.tags
        };
      case 'habit':
        return {
          name: p.title,
          schedule: recurrenceToSchedule(p.recurrence),
          time: p.startMinutes,
          duration: p.durationMinutes || 20,
          categoryId: p.categoryId,
          goalId: p.goalId
        };
      case 'note':
        return { title: p.title, body: p.body || '', type: 'note', tags: p.tags, projectId: p.projectId };
      case 'project':
        return { name: p.title, due: p.dueWall ? T.iso(p.dueWall) : null, tags: p.tags };
      case 'goal':
        return { name: p.title, due: p.dueWall ? T.iso(p.dueWall) : null, tags: p.tags };
      default:
        return { title: p.title };
    }
  }

  function guessDeadlineKind(title) {
    var t = String(title).toLowerCase();
    if (/\b(test|exam|quiz|midterm|final)\b/.test(t)) return 'exam';
    if (/\b(essay|homework|assignment|problem set|lab report|worksheet)\b/.test(t)) return 'assignment';
    if (/\b(application|apply|admission|scholarship|form)\b/.test(t)) return 'application';
    if (/\b(project|presentation|portfolio)\b/.test(t)) return 'project';
    return 'other';
  }

  function recurrenceToSchedule(rec) {
    if (!rec) return { type: 'daily', days: [0, 1, 2, 3, 4, 5, 6] };
    if (rec.freq === 'daily') return { type: 'daily', days: [0, 1, 2, 3, 4, 5, 6] };
    if (rec.freq === 'weekly' && rec.byDay) {
      var wd = rec.byDay.slice().sort().join(',');
      if (wd === '1,2,3,4,5') return { type: 'weekdays', days: [1, 2, 3, 4, 5] };
      return { type: 'weekly', days: rec.byDay };
    }
    return { type: 'times-per-week', timesPerWeek: 3, days: [] };
  }

  /* ---------------- brain dump splitting ---------------- */

  /* Break a messy paragraph into candidate items without shredding phrases that
     legitimately contain commas or "and". */
  function split(text) {
    var GUARD = '\u0001';
    var lines = String(text).split(/\n+/);
    var pieces = [];
    lines.forEach(function (line) {
      line = line.replace(/^\s*(?:[-*\u2022\u00b7\u2013\u2014]|\d+[.)])\s*/, '').trim();

  /* ---------------- task ranking ---------------- */

  function scoreTask(task, nowWall) {

    var reasons = [];

    var prank = M.PRIORITY_RANK[task.priority] === undefined ? 2 : M.PRIORITY_RANK[task.priority];
    var pScore = (3 - prank) * 12;
    score += pScore;
    if (task.priority === 'critical') reasons.push('critical priority');
    else if (task.priority === 'high') reasons.push('high priority');

    var due = task.due ? T.w(task.due) : null;
    if (due) {

      if (days < 0) { score += 70; reasons.push('overdue'); }
      else if (days === 0) { score += 55; reasons.push('due today'); }
      else if (days === 1) { score += 42; reasons.push('due tomorrow'); }
      else if (days <= 3) { score += 30; reasons.push('due in ' + days + ' days'); }
      else if (days <= 7) { score += 16; reasons.push('due this week'); }
      else { score += 6; }

    if (task.deadlineId) {
      var dl = S.get('deadlines', task.deadlineId);

        var dd = T.diffDays(nowWall, T.w(dl.due));

  /* Eisenhower-style quadrant, used to explain rather than to enforce. */
  function quadrant(task, nowWall) {

    var prank = M.PRIORITY_RANK[task.priority];

    if (task.due) {
      var days = T.diffDays(nowWall, T.w(task.due));
      urgent = days <= 2;
    }
    if (task.priority === 'critical') urgent = true;
    var id = important ? (urgent ? 'do' : 'schedule') : (urgent ? 'delegate' : 'later');
    var labels = {
      do: { label: 'Important & urgent', hint: 'Do these first' },
      schedule: { label: 'Important, not urgent', hint: 'Give these real time' },
      delegate: { label: 'Urgent, less important', hint: 'Batch or shrink these' },
      later: { label: 'Neither', hint: 'Fine to leave for later' }

  function rankedTasks(nowWall, opts) {

      .filter(function (t) {
        if (opts.excludeScheduled && t.scheduledEventId) return false;
        if (Q.taskIsBlocked(t)) return false;

    else if (hour >= 13 && hour <= 17) { score += 5; }
    else if (hour >= 20) { score -= 12; reasons.push('late in the day'); }
    else if (hour < 8) { score -= 10; reasons.push('early morning'); }

  /* Builds a proposed schedule: fixed commitments plus suggested task blocks,

      .map(function (e) {

          var need = Math.min(Q.taskEstimate(candidates[i].task), maxBlock);
          if (need <= remainingSlot && used + need <= budget) { pick = i; break; }
        }
        if (pick < 0) break;

        var estimate = Q.taskEstimate(chosen.task);
        var length = Math.min(estimate, maxBlock, remainingSlot);
        length = Math.max(20, Math.round(length / 5) * 5);
        if (length > remainingSlot) length = remainingSlot;

        var end = T.addMinutes(cursor, length);

          kind: 'task',
          title: chosen.task.title,
          task: chosen.task,
          start: new Date(cursor),

            title: 'Break',

    var warnings = [];
    if (!slots.length) {
      warnings.push({ level: 'info', text: 'No open time left in your day — nothing to schedule into.' });
    } else if (remainingFree < 60 && proposed.length) {
      warnings.push({
        level: 'warn',
        text: 'This plan leaves only ' + T.humanDuration(remainingFree) + ' unscheduled. Consider dropping a lower-priority block.'
      });
    }
    if (skipped.length) {
      warnings.push({
        level: 'info',

    }
    var overdue = Q.overdueTasks(now);
    if (overdue.length && !proposed.some(function (p) { return p.task && overdue.indexOf(p.task) >= 0; })) {
      warnings.push({ level: 'warn', text: 'You have ' + overdue.length + ' overdue task' + (overdue.length === 1 ? '' : 's') + ' that this plan does not cover.' });
    }

      day: dayWall,
      items: items,
      proposed: proposed,
      fixed: fixed,
      skipped: skipped,
      warnings: warnings,
      stats: {
        totalFree: totalFree,
        scheduled: used,
        remainingFree: remainingFree,
        reserve: floor

    };
  }

  /* ---------------- plan my week ---------------- */

  function planWeek(startWall, opts) {
    opts = opts || {};
    var now = opts.now || T.nowWall();
    var days = [];
    var taken = {};

    for (var i = 0; i < 7; i++) {
      var day = T.startOfDay(T.addDays(startWall, i));
      if (day < T.startOfDay(now)) continue;

        if (taken[p.task.id]) return false;
        taken[p.task.id] = true;
        return true;
      });
      plan.items = plan.fixed.concat(plan.proposed).sort(function (a, b) { return a.start - b.start; });
      days.push(plan);
    }

  /* ---------------- what should I do now ---------------- */

  function whatNow(nowWall) {
    nowWall = nowWall || T.nowWall();
    var todayEvents = Q.eventsOnDay(nowWall, { ignoreLayers: true }).filter(function (e) { return !e.allDay; });

    var current = todayEvents.filter(function (e) {
      return e.startWall <= nowWall && e.endWall > nowWall && !e.done;
    })[0];

    var next = todayEvents.filter(function (e) { return e.startWall > nowWall; })
      .sort(function (a, b) { return a.startWall - b.startWall; })[0];

    if (current) {
      return {
        mode: 'in-event',
        event: current,
        untilMinutes: T.diffMinutes(nowWall, current.endWall),
        next: next,
        headline: 'You are in “' + current.title + '” right now',
        detail: T.humanDuration(T.diffMinutes(nowWall, current.endWall)) + ' left'
      };

        mode: 'no-time',
        next: next,
        gap: gap,
        headline: next ? '“' + next.title + '” starts in ' + T.humanDuration(gap) : 'Your day is winding down',
        detail: next ? (travel ? 'Leave in about ' + T.humanDuration(Math.max(0, gap - travel)) + '.' : 'Not enough time to start something new.') : 'Nothing else scheduled.'
      };

    var ranked = rankedTasks(nowWall, { horizonDays: 30 });
    var fits = ranked.filter(function (r) {

      mode: best ? 'recommend' : (partial ? 'partial' : 'free'),
      usable: usable,
      gap: gap,
      next: next,
      recommendation: best,
      partial: partial,
      alternatives: alternatives,
      headline: 'You have ' + T.humanDuration(usable) + (next ? ' before ' + next.title : ' free'),
      detail: best
        ? best.task.title + ' — ' + T.humanDuration(Q.taskEstimate(best.task))

  /* ---------------- suggestions ---------------- */

  /* Observations worth surfacing, each with an explanation and an action.

  function suggestions(nowWall) {

          why: 'No calendar block or task on your schedule references this deadline.',

        text: overdue.length === 1
          ? '“' + overdue[0].title + '” slipped past its date.'
          : overdue.length + ' tasks slipped past their dates.',
        why: 'Their due dates are in the past and they are not marked complete.',
        action: { type: 'recover', label: 'Reschedule them' }
      });
    }

    // 3. Overloaded day.
    for (var i = 0; i < 7; i++) {
      var day = T.startOfDay(T.addDays(nowWall, i));
      var due = Q.tasksDueOn(day).filter(function (t) { return t.status !== 'completed'; });
      if (due.length >= 5) {
        var totalNeeded = due.reduce(function (a, t) { return a + Q.taskEstimate(t); }, 0);
        var free = freeMinutes(day, { after: i === 0 ? nowWall : null });
        if (totalNeeded > free) {
          push({
            id: 'overload-' + T.key(day),
            tone: 'warn',
            text: due.length + ' tasks are due ' + T.relativeDay(day, nowWall).toLowerCase() +
              ' — about ' + T.humanDuration(totalNeeded) + ' of work in ' + T.humanDuration(free) + ' of free time.',
            why: 'Estimated task time exceeds the open time in your day.',
            action: { type: 'goto-day', label: 'Look at that day', day: T.key(day) }
          });
          break;
        }
      }
    }

    // 4. Conflicts in the next week.
    for (var d2 = 0; d2 < 7; d2++) {
      var dayW = T.startOfDay(T.addDays(nowWall, d2));
      var items = Q.eventsOnDay(dayW, { ignoreLayers: true });
      var conflicts = Q.findConflicts(items);
      if (conflicts.length) {
        push({
          id: 'conflict-' + T.key(dayW),
          tone: 'warn',
          text: conflicts.length === 1
            ? '“' + conflicts[0][0].title + '” and “' + conflicts[0][1].title + '” overlap ' + T.relativeDay(dayW, nowWall).toLowerCase() + '.'
            : conflicts.length + ' overlapping commitments ' + T.relativeDay(dayW, nowWall).toLowerCase() + '.',
          why: 'These events share the same time window.',
          action: { type: 'goto-day', label: 'Resolve', day: T.key(dayW) }
        });
        break;
      }
    }

    // 5. A large free block worth claiming.
    for (var d3 = 0; d3 < 5; d3++) {
      var day3 = T.startOfDay(T.addDays(nowWall, d3));
      var slots = freeSlots(day3, { after: d3 === 0 ? nowWall : null, minMinutes: 150 });
      if (!slots.length) continue;
      var unscheduled = rankedTasks(nowWall, { excludeScheduled: true, horizonDays: 14 })[0];
      if (!unscheduled) break;
      push({
        id: 'freeblock-' + T.key(day3),
        tone: 'normal',
        text: 'You have ' + T.humanDuration(slots[0].minutes) + ' free ' +
          T.relativeDay(day3, nowWall).toLowerCase() + ' from ' + T.fmtTime(slots[0].start, st.use24Hour) +
          '. “' + unscheduled.task.title + '” could fit there.',
        why: unscheduled.reasons.length ? 'That task is ' + unscheduled.reasons.join(' and ') + '.' : 'It is the highest-ranked task with no time set aside.',
        action: { type: 'schedule-task', label: 'Schedule it', taskId: unscheduled.task.id, start: slots[0].start.getTime() }
      });
      break;
    }

    // 6. Inbox that has stopped being an inbox.
    var inbox = S.all('tasks').filter(function (t) { return t.status === 'inbox'; });
    if (inbox.length >= 8) {
      push({
        id: 'inbox-' + Math.floor(inbox.length / 5),
        tone: 'normal',
        text: inbox.length + ' tasks are still sitting in your inbox.',
        why: 'They have no date and no plan, so they are easy to lose track of.',
        action: { type: 'goto', label: 'Open tasks', route: 'tasks' }
      });
    }

    // 7. Unprocessed captures.
    var caps = S.all('captures').filter(function (c) { return !c.processed; });
    if (caps.length) {
      push({
        id: 'captures-' + caps.length,
        tone: 'normal',
        text: caps.length + ' captured thought' + (caps.length === 1 ? '' : 's') + ' waiting to be organized.',
        why: 'You wrote these down but have not turned them into anything yet.',
        action: { type: 'goto', label: 'Organize', route: 'capture' }
      });
    }

    return out.slice(0, 5);
  }

  function dismissSuggestion(id) {
    S.quiet(function (st) {
      st.dismissed = st.dismissed || {};
      st.dismissed[id] = Date.now();
    });
  }

  /* ---------------- conflict resolution ---------------- */

  /* Where could this event go instead, keeping its length? */
  function alternativesFor(inst, opts) {
    var minutes = T.diffMinutes(inst.startWall, inst.endWall);
    return findTime(minutes, {
      now: T.nowWall(),
      days: 7,
      limit: 3,
      excludeEventIds: [inst.seriesId || inst.id]
    });
  }

  /* ---------------- reviews ---------------- */

  function weekReview(startWall) {
    var start = T.startOfDay(startWall);
    var end = T.endOfDay(T.addDays(start, 6));
    var tasks = S.all('tasks');

    var completed = tasks.filter(function (t) {
      if (!t.completedAt) return false;
      var c = T.w(t.completedAt);
      return c >= start && c <= end;
    });
    var missed = tasks.filter(function (t) {
      if (t.status === 'completed' || t.status === 'archived' || !t.due) return false;
      var d = T.w(t.due);
      return d >= start && d <= end && d < T.nowWall();
    });
    var unfinished = tasks.filter(function (t) {
      if (t.status === 'completed' || t.status === 'archived' || !t.due) return false;
      var d = T.w(t.due);
      return d >= start && d <= end;
    });

    var events = Q.eventsInRange(start, end, { ignoreLayers: true }).filter(function (e) { return !e.allDay; });
    var byCategory = {};
    var totalMinutes = 0;
    events.forEach(function (e) {
      var mins = T.diffMinutes(e.startWall, e.endWall);
      var cat = e.categoryId ? (S.get('categories', e.categoryId) || {}).name : null;
      var label = cat || (S.get('calendars', e.calendarId) || {}).name || 'Other';
      byCategory[label] = (byCategory[label] || 0) + mins;
      totalMinutes += mins;
    });

    var upcomingDeadlines = Q.deadlinesInRange(T.addDays(end, 0), T.addDays(end, 14));
    var nextWeekPriorities = rankedTasks(T.addDays(start, 7), { horizonDays: 10 }).slice(0, 5);

    var habits = S.all('habits').filter(function (h) { return !h.archived; }).map(function (h) {
      var done = 0, target = R.habitTargetPerWeek(h);
      for (var i = 0; i < 7; i++) {
        if ((h.log || {})[T.key(T.addDays(start, i))]) done++;
      }
      return { habit: h, done: done, target: target };
    });

    return {
      start: start, end: end,
      completed: completed,
      missed: missed,
      unfinished: unfinished,
      events: events,
      byCategory: Object.keys(byCategory).map(function (k) { return { label: k, minutes: byCategory[k] }; })
        .sort(function (a, b) { return b.minutes - a.minutes; }),
      totalMinutes: totalMinutes,
      upcomingDeadlines: upcomingDeadlines,
      nextWeekPriorities: nextWeekPriorities,
      habits: habits
    };
  }

  function monthReview(anchorWall) {
    var start = T.startOfMonth(anchorWall);
    var end = T.endOfMonth(anchorWall);
    var tasks = S.all('tasks');
    var completed = tasks.filter(function (t) {
      if (!t.completedAt) return false;
      var c = T.w(t.completedAt);
      return c >= start && c <= end;
    });
    var events = Q.eventsInRange(start, end, { ignoreLayers: true }).filter(function (e) { return !e.allDay; });
    var byCategory = {};
    events.forEach(function (e) {
      var mins = T.diffMinutes(e.startWall, e.endWall);
      var cat = e.categoryId ? (S.get('categories', e.categoryId) || {}).name : null;
      var label = cat || (S.get('calendars', e.calendarId) || {}).name || 'Other';
      byCategory[label] = (byCategory[label] || 0) + mins;
    });
    var projects = S.all('projects').map(function (p) {
      return { project: p, progress: Q.projectProgress(p.id) };
    });
    var goals = S.all('goals').filter(function (g) { return !g.archived; }).map(function (g) {
      return { goal: g, progress: Q.goalProgress(g.id) };
    });

    // Weekly completion counts, for the trend line.
    var weeks = [];
    var cursor = T.startOfWeek(start, S.settings().firstDayOfWeek);
    while (cursor <= end) {
      var wEnd = T.endOfDay(T.addDays(cursor, 6));
      var count = tasks.filter(function (t) {
        if (!t.completedAt) return false;
        var c = T.w(t.completedAt);
        return c >= cursor && c <= wEnd;
      }).length;
      weeks.push({ start: new Date(cursor), count: count });
      cursor = T.addDays(cursor, 7);
    }

    return {
      start: start, end: end,
      completed: completed,
      events: events,
      deadlines: Q.deadlinesInRange(start, end, true),
      byCategory: Object.keys(byCategory).map(function (k) { return { label: k, minutes: byCategory[k] }; })
        .sort(function (a, b) { return b.minutes - a.minutes; }),
      projects: projects,
      goals: goals,
      weeks: weeks
    };
  }

  global.SCHED = {
    busyIntervals: busyIntervals, freeSlots: freeSlots, freeMinutes: freeMinutes,
    dayWindow: dayWindow, dayLoad: dayLoad,
    scoreTask: scoreTask, rankedTasks: rankedTasks, quadrant: quadrant,
    findTime: findTime, planDay: planDay, planWeek: planWeek, whatNow: whatNow,
    suggestions: suggestions, dismissSuggestion: dismissSuggestion,
    alternativesFor: alternativesFor,
    weekReview: weekReview, monthReview: monthReview
  };
})(window);

/* Cadence — universal search.

   One index over every entity, with subsequence matching so "biolgy" and "bio"
   both find "Biology test". Results carry the matched character positions so the
   UI can highlight exactly what matched. */
(function (global) {
  'use strict';

  var index = null;
  S.on('change', function () { index = null; });

  var TYPE_META = {
    event: { label: 'Event', route: 'calendar', icon: 'calendar' },
    task: { label: 'Task', route: 'tasks', icon: 'check' },
    deadline: { label: 'Deadline', route: 'calendar', icon: 'flag' },
    note: { label: 'Note', route: 'notes', icon: 'note' },
    project: { label: 'Project', route: 'projects', icon: 'folder' },
    goal: { label: 'Goal', route: 'goals', icon: 'target' },
    habit: { label: 'Habit', route: 'habits', icon: 'repeat' },
    person: { label: 'Person', route: 'calendar', icon: 'user' },
    tag: { label: 'Tag', route: 'search', icon: 'tag' },
    location: { label: 'Location', route: 'calendar', icon: 'pin' }
  };

  function build() {
    var docs = [];
    var seenPeople = {}, seenPlaces = {};

    S.all('events').forEach(function (e) {
      docs.push({
        type: 'event', id: e.id, title: e.title,
        text: [e.title, e.description, e.location, (e.tags || []).join(' '),
        (e.participants || []).map(function (p) { return p.name; }).join(' ')].join(' '),
        subtitle: eventSubtitle(e), item: e, when: T.w(e.start)
      });
      (e.participants || []).forEach(function (p) {
        if (p.name && !seenPeople[p.name.toLowerCase()]) {
          seenPeople[p.name.toLowerCase()] = true;
          docs.push({ type: 'person', id: 'person:' + p.name, title: p.name, text: p.name, subtitle: 'Participant', item: p });
        }
      });
      if (e.location && !seenPlaces[e.location.toLowerCase()]) {
        seenPlaces[e.location.toLowerCase()] = true;
        docs.push({ type: 'location', id: 'loc:' + e.location, title: e.location, text: e.location, subtitle: 'Location', item: e });
      }
    });

    S.all('people').forEach(function (p) {
      if (seenPeople[p.name.toLowerCase()]) return;
      seenPeople[p.name.toLowerCase()] = true;
      docs.push({ type: 'person', id: p.id, title: p.name, text: [p.name, p.contact, p.role].join(' '), subtitle: p.role || 'Person', item: p });
    });

    S.all('tasks').forEach(function (t) {
      docs.push({
        type: 'task', id: t.id, title: t.title,
        text: [t.title, t.description, t.notes, (t.tags || []).join(' '),
        (t.subtasks || []).map(function (s) { return s.title; }).join(' ')].join(' '),
        subtitle: taskSubtitle(t), item: t, when: t.due ? T.w(t.due) : null
      });
    });

    S.all('deadlines').forEach(function (d) {
      docs.push({
        type: 'deadline', id: d.id, title: d.title,
        text: [d.title, d.description, (d.tags || []).join(' ')].join(' '),
        subtitle: 'Due ' + T.fmtDateShort(T.w(d.due)), item: d, when: T.w(d.due)
      });
    });

    S.all('notes').forEach(function (n) {
      docs.push({
        type: 'note', id: n.id, title: n.title || firstLine(n.body) || 'Untitled note',
        text: [n.title, n.body, (n.tags || []).join(' '),
        (n.checklist || []).map(function (c) { return c.title; }).join(' ')].join(' '),
        subtitle: (TYPE_META.note.label) + ' · ' + T.fmtDateShort(T.w(n.updatedAt)), item: n, when: T.w(n.updatedAt)
      });
    });

    S.all('projects').forEach(function (p) {
      var pr = Q.projectProgress(p.id);
      docs.push({
        type: 'project', id: p.id, title: p.name,
        text: [p.name, p.description, (p.tags || []).join(' ')].join(' '),
        subtitle: pr.total ? pr.pct + '% · ' + pr.done + '/' + pr.total + ' tasks' : 'Project', item: p
      });
    });

    S.all('goals').forEach(function (g) {
      docs.push({
        type: 'goal', id: g.id, title: g.name,
        text: [g.name, g.description, (g.milestones || []).map(function (m) { return m.title; }).join(' ')].join(' '),
        subtitle: Q.goalProgress(g.id).pct + '% complete', item: g
      });
    });

    S.all('habits').forEach(function (h) {
      docs.push({
        type: 'habit', id: h.id, title: h.name,
        text: [h.name, h.notes].join(' '),
        subtitle: 'Habit', item: h
      });
    });

    Q.allTags().forEach(function (t) {
      docs.push({
        type: 'tag', id: 'tag:' + t.tag, title: '#' + t.tag,
        text: '#' + t.tag + ' ' + t.tag,
        subtitle: t.count + ' item' + (t.count === 1 ? '' : 's'), item: t
      });
    });

    docs.forEach(function (d) { d.lower = (d.text || '').toLowerCase(); d.titleLower = (d.title || '').toLowerCase(); });
    return docs;
  }

  function firstLine(s) {
    return String(s || '').split('\n')[0].slice(0, 60);
  }

  function eventSubtitle(e) {
    var st = S.settings();
    var start = T.w(e.start);
    var base = e.allDay ? T.fmtDateShort(start) : T.fmtDateShort(start) + ' · ' + T.fmtTime(start, st.use24Hour);
    if (e.recurrence) base += ' · repeats';
    return base;
  }

  function taskSubtitle(t) {
    var status = (M.STATUSES.filter(function (s) { return s.id === t.status; })[0] || {}).label || '';
    if (t.due) return status + ' · due ' + T.fmtDateShort(T.w(t.due));
    return status;
  }

  /* Subsequence match with a score that rewards prefixes, word starts and runs. */
  function fuzzyScore(needle, hay) {
    if (!needle) return { score: 0, positions: [] };
    var n = needle.length, h = hay.length;
    if (!h || n > h) return null;

    var exact = hay.indexOf(needle);
    if (exact >= 0) {
      var positions = [];
      for (var k = 0; k < n; k++) positions.push(exact + k);
      var boundary = exact === 0 || /[\s\-_/#(]/.test(hay.charAt(exact - 1));
      return { score: 1000 - exact * 2 + (boundary ? 120 : 0) + (exact === 0 ? 80 : 0), positions: positions };
    }

    var pos = [], hi = 0, score = 0, run = 0;
    for (var i = 0; i < n; i++) {
      var c = needle.charAt(i);
      var found = -1;
      while (hi < h) {
        if (hay.charAt(hi) === c) { found = hi; break; }
        hi++;
      }
      if (found < 0) return null;
      var isBoundary = found === 0 || /[\s\-_/#(]/.test(hay.charAt(found - 1));
      score += 12;
      if (isBoundary) score += 22;
      if (pos.length && found === pos[pos.length - 1] + 1) { run++; score += 10 + run * 4; }
      else run = 0;
      pos.push(found);
      hi = found + 1;
    }
    score -= pos[0] * 1.5;
    score -= (h - n) * 0.15;
    return { score: score, positions: pos };
  }

  function search(query, opts) {
    opts = opts || {};
    var q = String(query || '').trim().toLowerCase();
    if (!index) index = build();
    if (!q) {
      if (!opts.emptyAll) return [];
      return index.slice(0, opts.limit || 50).map(function (d) { return { doc: d, score: 0, positions: [] }; });
    }

    var typeFilter = null;
    var m = q.match(/^(event|task|deadline|note|project|goal|habit|person|tag)s?:\s*(.*)$/);
    if (m) { typeFilter = m[1]; q = m[2].trim(); }
    if (opts.type) typeFilter = opts.type;

    var terms = q.split(/\s+/).filter(Boolean);
    var results = [];

    for (var i = 0; i < index.length; i++) {
      var doc = index[i];
      if (typeFilter && doc.type !== typeFilter) continue;
      if (opts.types && opts.types.indexOf(doc.type) < 0) continue;

      var total = 0, positions = [], ok = true;
      for (var t = 0; t < terms.length; t++) {
        var titleHit = fuzzyScore(terms[t], doc.titleLower);
        var bodyHit = titleHit ? null : fuzzyScore(terms[t], doc.lower);
        if (!titleHit && !bodyHit) { ok = false; break; }
        if (titleHit) { total += titleHit.score * 1.6; positions = positions.concat(titleHit.positions); }
        else total += bodyHit.score * 0.5;
      }
      if (!ok) continue;

      // Nudge things happening soon above things long past.
      if (doc.when) {
        var days = Math.abs(T.diffDays(T.nowWall(), doc.when));
        total += Math.max(0, 40 - days * 0.6);
      }
      if (doc.item && doc.item.status === 'completed') total -= 60;
      if (doc.item && doc.item.done) total -= 60;

      results.push({ doc: doc, score: total, positions: dedupePositions(positions) });
    }

    results.sort(function (a, b) { return b.score - a.score; });
    return results.slice(0, opts.limit || 40);
  }

  function dedupePositions(arr) {
    var seen = {}, out = [];
    arr.forEach(function (p) { if (!seen[p]) { seen[p] = 1; out.push(p); } });
    return out.sort(function (a, b) { return a - b; });
  }

  /* Split a title into matched / unmatched runs for highlighting. */
  function highlight(text, positions) {
    if (!positions || !positions.length) return [{ text: text, hit: false }];
    var set = {};
    positions.forEach(function (p) { set[p] = true; });
    var out = [], buf = '', mode = false;
    for (var i = 0; i < text.length; i++) {
      var hit = !!set[i];
      if (i && hit !== mode) { out.push({ text: buf, hit: mode }); buf = ''; }
      mode = hit;
      buf += text.charAt(i);
    }
    if (buf) out.push({ text: buf, hit: mode });
    return out;
  }

  function typeMeta(type) { return TYPE_META[type] || { label: type, route: 'calendar' }; }

  global.SEARCH = { search: search, highlight: highlight, typeMeta: typeMeta, invalidate: function () { index = null; } };
})(window);

  /* ---- recurrence ---- */
  function recurrence(opts) {
    opts = opts || {};
    var value = opts.value ? R.normalize(opts.value) : null;
    var wrap = D.h('div.recur');

    var presets = [
      { label: 'Does not repeat', value: null },
      { label: 'Daily', value: { freq: 'daily', interval: 1 } },
      { label: 'Every weekday', value: { freq: 'weekly', interval: 1, byDay: [1, 2, 3, 4, 5] } },
      { label: 'Weekly', value: { freq: 'weekly', interval: 1 } },
      { label: 'Every 2 weeks', value: { freq: 'weekly', interval: 2 } },
      { label: 'Monthly', value: { freq: 'monthly', interval: 1 } },

    var freqSel = select({
      value: value ? value.freq : 'weekly',
      options: [
        { value: 'daily', label: 'days' }, { value: 'weekly', label: 'weeks' },
        { value: 'monthly', label: 'months' }, { value: 'yearly', label: 'years' }
      ]
    });
    var dayPicker = D.h('div.recur__days', { role: 'group', 'aria-label': 'Repeat on' });
    var dayState = {};
    T.DAY_SHORT.forEach(function (name, i) {
      var b = D.h('button.recur__day', {
        type: 'button', 'aria-pressed': 'false', 'aria-label': T.DAY_NAMES[i],
        onclick: function () {
          dayState[i] = !dayState[i];
          b.setAttribute('aria-pressed', dayState[i] ? 'true' : 'false');
        }
      }, name.charAt(0));
      dayPicker.appendChild(b);
      b.dataset.day = i;

    var endMode = select({
      value: value && value.until ? 'until' : value && value.count ? 'count' : 'never',
      options: [{ value: 'never', label: 'Never ends' }, { value: 'until', label: 'Ends on date' }, { value: 'count', label: 'Ends after' }]
    });
    var untilInput = date({ value: value && value.until ? T.w(value.until) : null });
    var countInput = number({ value: value && value.count ? value.count : 10, min: 1, max: 999 });
    var endExtra = D.h('div.recur__end-extra');

      D.clear(endExtra);

    }
    endMode.addEventListener('change', paintEnd);

    advanced.appendChild(D.h('div.recur__row', [
      D.h('span.recur__lead', { text: 'Every' }), intervalInput, freqSel
    ]));
    advanced.appendChild(D.h('div.recur__row.recur__row--days', [D.h('span.recur__lead', { text: 'On' }), dayPicker]));
    advanced.appendChild(D.h('div.recur__row', [endMode, endExtra]));

    function syncFromValue() {
      if (!value) { sel.value = '0'; advanced.hidden = true; return; }
      var idx = -1;
      presets.forEach(function (p, i) {

      });
      if (idx >= 0) { sel.value = String(idx); advanced.hidden = true; }
      else {

        byDay: days.length ? days : null

      var mode = endMode.getValue();
      if (mode === 'until') { var d = untilInput.getValue(); if (d) rule.until = T.iso(T.endOfDay(d)); }

      return rule;

  function attachments(opts) {
    opts = opts || {};

        list.appendChild(D.h('div.attachment', [

          f.dataUrl
            ? D.h('a.attachment__name', { href: f.dataUrl, download: f.name, text: f.name, target: '_blank', rel: 'noopener' })
            : D.h('span.attachment__name', { text: f.name }),

/* ========================================================================
   js/ui/dnd.js
   ======================================================================== */
/* Cadence — pointer dragging.

   One low-level helper drives every drag in the app: moving and resizing events,
   dropping tasks onto the calendar, and reordering task lists. It works with
   mouse, touch and pen, starts only after a small threshold so clicks still
   click, and cancels cleanly on Escape. */
(function (global) {
  'use strict';

  var THRESHOLD = 4;
  var current = null;
  var payload = null;
  var ghost = null;

  /* handlers: { onStart, onMove(state), onEnd(state), onCancel } */
  function drag(startEvent, handlers) {
    if (current) return null;
    if (startEvent.button != null && startEvent.button !== 0 && startEvent.pointerType === 'mouse') return null;

    var startX = startEvent.clientX, startY = startEvent.clientY;
    var started = false;
    var target = startEvent.currentTarget || startEvent.target;

    var state = {
      startX: startX, startY: startY, x: startX, y: startY, dx: 0, dy: 0,
      event: startEvent, target: target, cancelled: false
    };

    function move(e) {
      state.x = e.clientX; state.y = e.clientY;
      state.dx = e.clientX - startX; state.dy = e.clientY - startY;
      state.pointerEvent = e;
      if (!started) {
        if (Math.abs(state.dx) < THRESHOLD && Math.abs(state.dy) < THRESHOLD) return;
        started = true;
        document.documentElement.classList.add('is-dragging');
        if (handlers.onStart) handlers.onStart(state);
      }
      e.preventDefault();
      if (handlers.onMove) handlers.onMove(state);
      positionGhost(e.clientX, e.clientY);
    }

    function up(e) {
      state.pointerEvent = e;
      cleanup();
      if (started) {
        if (handlers.onEnd) handlers.onEnd(state);
      } else if (handlers.onClick) {
        handlers.onClick(state);
      }
    }

    function key(e) {
      if (e.key !== 'Escape') return;
      state.cancelled = true;
      cleanup();
      if (handlers.onCancel) handlers.onCancel(state);
    }

    function cleanup() {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', cancel);
      window.removeEventListener('keydown', key, true);
      document.documentElement.classList.remove('is-dragging');
      removeGhost();
      current = null;
      payload = null;
    }

    function cancel(e) {
      state.cancelled = true;
      cleanup();
      if (handlers.onCancel) handlers.onCancel(state);
    }

    window.addEventListener('pointermove', move, { passive: false });
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', cancel);
    window.addEventListener('keydown', key, true);

    current = { state: state, cancel: cancel };
    return current;
  }

  /* ---- ghost element that follows the pointer for cross-view drags ---- */
  function showGhost(label, color) {
    removeGhost();
    ghost = D.h('div.drag-ghost', { 'aria-hidden': 'true' }, [
      color ? D.h('span.drag-ghost__dot', { style: { background: color } }) : null,
      D.h('span', { text: label })
    ]);
    document.body.appendChild(ghost);
  }
  function positionGhost(x, y) {
    if (!ghost) return;
    ghost.style.transform = 'translate(' + (x + 14) + 'px,' + (y + 12) + 'px)';
  }
  function removeGhost() {
    if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
    ghost = null;
  }

  function setPayload(p) { payload = p; }
  function getPayload() { return payload; }

  /* Which registered drop zone is under the pointer right now? */
  function zoneAt(x, y) {
    var el = document.elementFromPoint(x, y);
    while (el && el !== document.body) {
      if (el.dataset && el.dataset.dropzone) return el;
      el = el.parentElement;
    }
    return null;
  }

  function active() { return !!current; }

  global.DND = {
    drag: drag,
    showGhost: showGhost, removeGhost: removeGhost, positionGhost: positionGhost,
    setPayload: setPayload, getPayload: getPayload,
    zoneAt: zoneAt, active: active,
    THRESHOLD: THRESHOLD
  };
})(window);

  function dependencyEditor(task) {
