per results over time' });\n\n  const x = (i) => padL + (points.length === 1 ? (width - padL - 16) / 2 : (i / (points.length - 1)) * (width - padL - 16));\n  const y = (p) => height - padB - clamp01(p) * (height - padB - padT);\n\n  for (const tick of [0, 0.25, 0.5, 0.75, 1]) {\n    svg.appendChild(el('line', { x1: padL, y1: y(tick), x2: width - 10, y2: y(tick), stroke: 'var(--grid)', 'stroke-width': 1 }));\n    svg.appendChild(el('text', { x: padL - 8, y: y(tick) + 4, 'text-anchor': 'end', class: 'viz-value', 'font-size': 10 }, `${tick * 100}%`));\n  }\n\n  if (targetPercent != null) {\n    svg.appendChild(el('line', { x1: padL, y1: y(targetPercent), x2: width - 10, y2: y(targetPercent), stroke: 'var(--brand)', 'stroke-width': 2 }));\n    svg.appendChild(el('text', { x: width - 10, y: y(targetPercent) - 7, 'text-anchor': 'end', 'font-size': 10.5, 'font-weight': 650, fill: 'var(--brand-2)' }, 'target'));\n  }\n\n  if (points.length > 1) {\n    const path = points.map((p, i) => `${i ? 'L' : 'M'} ${x(i).toFixed(1)} ${y(p.percent).toFixed(1)}`).join(' ');\n    svg.appendChild(el('path', { d: path, fill: 'none', stroke: 'var(--s1)', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));\n  }\n\n  points.forEach((point, i) => {\n    const dot = el('circle', { cx: x(i), cy: y(point.percent), r: 5, fill: 'var(--s1)', stroke: 'var(--surface)', 'stroke-width': 2 });\n    hoverable(dot, `<b>${Math.round(point.percent * 100)}%${point.score != null ? ` · score ${point.score}` : ''}</b><span>${new Date(point.at).toLocaleDateString()}</span>`);\n    svg.appendChild(dot);\n  });\n\n  // Direct-label the latest point only; the axis and tooltip carry the rest.\n  const last = points.at(-1);\n  svg.appendChild(\n    el('text', { x: x(points.length - 1), y: y(last.percent) - 13, 'text-anchor': 'middle', class: 'viz-value', 'font-size': 11.5, 'font-weight': 650 }, `${Math.round(last.percent * 100)}%`),\n  );\n\n  return vizShell({\n    title: 'Practice papers',\n    note: `${points.length} sat`,\n    body: h('div', {}, svg),\n    table: {\n      columns: ['Date', 'Percent', 'Score'],\n      rows: [...history].map((p) => [new Date(p.at).toLocaleDateString(), `${Math.round(p.percent * 100)}%`, p.score ?? '—']),\n    },\n  });\n}\n","axiom:public/js/router.js":"const routes = [];\nlet notFound = () => document.createTextNode('Not found');\nlet current = null;\n\nexport function route(pattern, view) {\n  const keys = [];\n  const regex = new RegExp(\n    '^' +\n      pattern\n        .replace(/\\/:([\\w]+)/g, (_, key) => {\n          keys.push(key);\n          return '/([^/]+)';\n        })\n        .replace(/\\//g, '\\\\/') +\n      '$',\n  );\n  routes.push({ regex, keys, view });\n}\n\nexport const setNotFound = (view) => {\n  notFound = view;\n};\n\nexport function navigate(path, { replace = false } = {}) {\n  const target = `#${path}`;\n  if (location.hash === target) {\n    resolve();\n    return;\n  }\n  if (replace) history.replaceState(null, '', target);\n  else location.hash = target;\n}\n\nexport const currentPath = () => location.hash.replace(/^#/, '') || '/';\n\nexport function resolve() {\n  const path = currentPath();\n  for (const { regex, keys, view } of routes) {\n    const match = path.match(regex);\n    if (!match) continue;\n    const params = {};\n    keys.forEach((key, i) => {\n      params[key] = decodeURIComponent(match[i + 1]);\n    });\n    current = { path, params, view };\n    return { view, params, path };\n  }\n  current = { path, params: {}, view: notFound };\n  return { view: notFound, params: {}, path };\n}\n\nexport const activeRoute = () => current;\n\nexport function startRouter(onChange) {\n  window.addEventListener('hashchange', () => onChange(resolve()));\n  onChange(resolve());\n}\n","axiom:public/js/api.js":"const LEARNER_KEY = 'axiom:learner';\n\nexport function learnerId() {\n  let value = localStorage.getItem(LEARNER_KEY);\n  if (!value) {\n    value = 'me';\n    localStorage.setItem(LEARNER_KEY, value);\n  }\n  return value;\n}\n\nfunction headers(extra = {}) {\n  return { 'x-learner-id': learnerId(), ...extra };\n}\n\nexport class ApiError extends Error {\n  constructor(message, status, retryable) {\n    super(message);\n    this.status = status;\n    this.retryable = retryable;\n  }\n}\n\nexport async function get(path) {\n  const res = await fetch(`/api${path}`, { headers: headers() });\n  const body = await res.json().catch(() => ({}));\n  if (!res.ok) throw new ApiError(body.error || res.statusText, res.status, body.retryable);\n  return body;\n}\n\nexport async function post(path, data, method = 'POST') {\n  const res = await fetch(`/api${path}`, {\n    method,\n    headers: headers({ 'content-type': 'application/json' }),\n    body: JSON.stringify(data ?? {}),\n  });\n  const body = await res.json().catch(() => ({}));\n  if (!res.ok) throw new ApiError(body.error || res.statusText, res.status, body.retryable);\n  return body;\n}\n\nexport const patch = (path, data) => post(path, data, 'PATCH');\n\nexport async function upload(files) {\n  const form = new FormData();\n  for (const file of files) form.append('files', file, file.name);\n  const res = await fetch('/api/sources', { method: 'POST', headers: headers(), body: form });\n  const body = await res.json().catch(() => ({}));\n  if (!res.ok) throw new ApiError(body.error || 'Upload failed', res.status);\n  return body;\n}\n\n/**\n * POST that consumes a server-sent event stream.\n * `handlers` maps event names to callbacks; `error` events reject the promise.\n */\nexport function stream(path, data, handlers = {}) {\n  const controller = new AbortController();\n\n  const promise = (async () => {\n    const res = await fetch(`/api${path}`, {\n      method: 'POST',\n      headers: headers({ 'content-type': 'application/json' }),\n      body: JSON.stringify(data ?? {}),\n      signal: controller.signal,\n    });\n\n    if (!res.ok) {\n      const body = await res.json().catch(() => ({}));\n      throw new ApiError(body.error || res.statusText, res.status, body.retryable);\n    }\n    if (!res.body) throw new ApiError('Streaming is not supported by this browser.', 500);\n\n    const reader = res.body.getReader();\n    const decoder = new TextDecoder();\n    let buffer = '';\n    let failure = null;\n\n    for (;;) {\n      const { value, done } = await reader.read();\n      if (done) break;\n      buffer += decoder.decode(value, { stream: true });\n\n      let boundary;\n      while ((boundary = buffer.indexOf('\\n\\n')) !== -1) {\n        const raw = buffer.slice(0, boundary);\n        buffer = buffer.slice(boundary + 2);\n        if (raw.startsWith(':')) continue;\n\n        let event = 'message';\n        const dataLines = [];\n        for (const line of raw.split('\\n')) {\n          if (line.startsWith('event:')) event = line.slice(6).trim();\n          else if (line.startsWith('data:')) dataLines.push(line.slice(5).trim());\n        }\n        if (!dataLines.length) continue;\n\n        let payload;\n        try {\n          payload = JSON.parse(dataLines.join('\\n'));\n        } catch {\n          continue;\n        }\n        if (event === 'error') {\n          failure = new ApiError(payload.message || 'Generation failed', payload.status, payload.retryable);\n          handlers.error?.(failure);\n          continue;\n        }\n        handlers[event]?.(payload);\n      }\n    }\n    if (failure) throw failure;\n  })();\n\n  promise.abort = () => controller.abort();\n  return promise;\n}\n\nexport const api = {\n  health: () => get('/health'),\n  profile: () => get('/profile'),\n  dashboard: () => get('/dashboard'),\n  insights: (force) => get(`/insights${force ? '?force=1' : ''}`),\n  concepts: () => get('/concepts'),\n  history: () => get('/history'),\n  sessions: () => get('/sessions'),\n  session: (id) => get(`/sessions/${id}`),\n  resources: (kind) => get(`/resources${kind ? `?kind=${kind}` : ''}`),\n  resource: (id) => get(`/resources/${id}`),\n  reviewQueue: () => get('/review/queue'),\n  sources: () => get('/sources'),\n  curriculum: () => get('/curriculum'),\n  courses: () => get('/courses'),\n  course: (id) => get(`/courses/${id}`),\n  updateCourse: (id, data) => patch(`/courses/${id}`, data),\n  createCourse: (data, handlers) => stream('/courses', data, handlers),\n  courseNext: (id, handlers) => stream(`/courses/${id}/next`, {}, handlers),\n  courseExam: (id, handlers) => stream(`/courses/${id}/exam`, {}, handlers),\n  goals: () => get('/goals'),\n  createGoal: (data) => post('/goals', data),\n  updateGoal: (id, data) => patch(`/goals/${id}`, data),\n  gradeAnswer: (data) => post('/answers/grade', data),\n  analyzeSource: (id, note) => post(`/sources/${id}/analyze`, { note }),\n  updateSession: (id, data) => patch(`/sessions/${id}`, data),\n  start: (data, handlers) => stream('/learn/start', data, handlers),\n  turn: (id, data, handlers) => stream(`/sessions/${id}/turn`, data, handlers),\n  generate: (data, handlers) => stream('/generate', data, handlers),\n  submit: (id, data, handlers) => stream(`/resources/${id}/submit`, data, handlers),\n  remediate: (id, data, handlers) => stream(`/resources/${id}/remediate`, data, handlers),\n  upload,\n};\n","axiom:public/js/state.js":"/** Tiny shared store — deliberately not a framework. */\nexport const state = {\n  health: null,\n  dashboard: null,\n  pendingStart: null,\n  sessions: [],\n  lastResource: null,\n};\n\nconst listeners = new Set();\n\nexport function subscribe(fn) {\n  listeners.add(fn);\n  return () => listeners.delete(fn);\n}\n\nexport function update(patch) {\n  Object.assign(state, patch);\n  for (const fn of listeners) fn(state);\n}\n","axiom:public/js/views/home.js":"import { h, autosize } from 'axiom:public/js/dom.js';\nimport { icon } from 'axiom:public/js/icons.js';\nimport { navigate } from 'axiom:public/js/router.js';\nimport { api } from 'axiom:public/js/api.js';\nimport { toast } from 'axiom:public/js/ui.js';\nimport { state } from 'axiom:public/js/state.js';\n\nconst EXAMPLES = [\n  'Teach me AP Physics 1 momentum',\n  \"I don't understand derivatives\",\n  'Help me master Spanish irregular verbs',\n  'I have a biology test Friday',\n  'Make me a 20-question worksheet on cellular respiration',\n  'I keep getting APUSH SAQs wrong',\n  'I have 30 minutes — teach me something useful',\n  'Teach me Java inheritance',\n];\n\nexport function homeView() {\n  const attachments = [];\n  const attachmentHost = h('div.attachments');\n\n  const textarea = h('textarea', {\n    placeholder: 'Tell me what you want to learn…',\n    rows: 3,\n    spellcheck: 'true',\n    onKeydown: (event) => {\n      if (event.key === 'Enter' && (event.metaKey || event.ctrlKey || !event.shiftKey)) {\n        event.preventDefault();\n        submit();\n      }\n    },\n  });\n\n  const fileInput = h('input', {\n    type: 'file',\n    multiple: true,\n    accept: '.pdf,.png,.jpg,.jpeg,.webp,.txt,.md,.csv,.json,.tex',\n    style: { display: 'none' },\n    onChange: async (event) => {\n      const chosen = [...event.target.files];\n      if (!chosen.length) return;\n      event.target.value = '';\n      try {\n        const { sources, warning } = await api.upload(chosen);\n        if (warning) toast(warning, 'error');\n        attachments.push(...sources);\n        drawAttachments();\n      } catch (err) {\n        toast(err.message || 'Upload failed.', 'error');\n      }\n    },\n  });\n\n  function drawAttachments() {\n    attachmentHost.replaceChildren(\n      ...attachments.map((source, i) =>\n        h(\n          'span.attachment',\n          {},\n          icon('file', { size: 12 }),\n          source.name,\n          h(\n            'button',\n            {\n              type: 'button',\n              'aria-label': `Remove ${source.name}`,\n              onClick: () => {\n                attachments.splice(i, 1);\n                drawAttachments();\n              },\n            },\n            icon('x', { size: 12 }),\n          ),\n        ),\n      ),\n    );\n  }\n\n  const submitButton = h(\n    'button.btn.primary.lg',\n    { type: 'button', onClick: () => submit() },\n    icon('sparkles', { size: 15 }),\n    'Start learning',\n  );\n\n  async function submit() {\n    const request = textarea.value.trim();\n    if (!request) {\n      textarea.focus();\n      return;\n    }\n    submitButton.disabled = true;\n    submitButton.replaceChildren(h('span.spinner'), document.createTextNode('Thinking…'));\n    state.pendingStart = { request, sourceIds: attachments.map((a) => a.id) };\n    navigate('/session/new');\n  }\n\n  const ready = state.health?.llmReady !== false;\n\n  return h(\n    'div.home',\n    {},\n    h(\n      'header.home-top',\n      {},\n      h(\n        'div.brand',\n        { style: { padding: '0', width: 'auto' } },\n        h('div.brand-mark', {}, icon('sparkles', { size: 17 })),\n        h('span.brand-name', {}, 'Axiom'),\n      ),\n      h(\n        'div.row',\n        {},\n        h('button.btn.sm.ghost', { type: 'button', onClick: () => navigate('/library') }, icon('library', { size: 14 }), 'Library'),\n        h('button.btn.sm', { type: 'button', onClick: () => navigate('/dashboard') }, icon('chart', { size: 14 }), 'Dashboard'),\n      ),\n    ),\n    h(\n      'div.home-body',\n      {},\n      h(\n        'div.hero.fade-up',\n        {},\n        h(\n          'span.hero-eyebrow',\n          {},\n          h('span', { class: `hero-dot${ready ? '' : ' off'}` }),\n          ready\n            ? `Generating live with ${state.health?.model || 'Claude'}`\n            : 'No API key configured — add one to axiom/.env',\n        ),\n        h('h1', {}, 'Tell me what you want to learn.', h('br'), h('em', {}, \"I'll work out how you should learn it.\")),\n        h(\n          'p.lede',\n          {},\n          'Axiom diagnoses what you already know, teaches only the gap, makes you prove it, and keeps adapting until you have actually learned it.',\n        ),\n        h(\n          'div.ask',\n          {},\n          textarea,\n          attachmentHost,\n          h(\n            'div.ask-bar',\n            {},\n            h(\n              'button.btn.sm.ghost',\n              { type: 'button', onClick: () => fileInput.click(), title: 'Attach notes, a worksheet, a chapter…' },\n              icon('upload', { size: 13 }),\n              'Attach material',\n            ),\n            h('span.hint', {}, 'Enter to send'),\n            submitButton,\n          ),\n          fileInput,\n        ),\n        h(\n          'div.row',\n          { style: { justifyContent: 'center', marginTop: '18px' } },\n          h(\n            'button.btn',\n            { type: 'button', onClick: () => navigate('/courses') },\n            icon('route', { size: 14 }),\n            'Or prepare for a whole exam',\n          ),\n        ),\n        h(\n          'div.examples',\n          {},\n          ...EXAMPLES.map((example) =>\n            h(\n              'button.example',\n              {\n                type: 'button',\n                onClick: () => {\n                  textarea.value = example;\n                  textarea.focus();\n                  textarea.dispatchEvent(new Event('input'));\n                },\n              },\n              example,\n            ),\n          ),\n        ),\n        h(\n          'div.home-strip.stagger',\n          {},\n          ...[\n            ['target', 'Diagnoses first', 'Finds what you already have, then teaches only the gap.'],\n            ['brain', 'Remembers your mistakes', 'Names the specific misconception and fixes that, not the topic.'],\n            ['repeat', 'Returns before you forget', 'Every concept comes back on its own schedule.'],\n            ['trophy', 'Mastery is earned', 'Level 5 needs transfer and retention — reading never counts.'],\n          ].map(([name, title, detail]) =>\n            h('div.home-feature', {}, icon(name, { size: 16 }), h('b', {}, title), h('span', {}, detail)),\n          ),\n        ),\n      ),\n    ),\n    (() => {\n      autosize(textarea);\n      queueMicrotask(() => textarea.focus());\n      return null;\n    })(),\n  );\n}\n","axiom:public/js/views/session.js":"import { h, clear, autosize, titleCase, scrollToEnd } from 'axiom:public/js/dom.js';\nimport { icon } from 'axiom:public/js/icons.js';\nimport { prose } from 'axiom:public/js/markdown.js';\nimport { api } from 'axiom:public/js/api.js';\nimport { navigate } from 'axiom:public/js/router.js';\nimport { state } from 'axiom:public/js/state.js';\nimport { toast, masteryMeter, statusLine, modal } from 'axiom:public/js/ui.js';\nimport { renderBlocks } from 'axiom:public/js/render/blocks.js';\nimport { questionCard } from 'axiom:public/js/render/question.js';\nimport { renderResource, resourceLabel } from 'axiom:public/js/render/resource.js';\nimport { refreshSessions } from 'axiom:public/app.js';\n\nconst INTENT_LABEL = {\n  diagnose: 'Diagnosing',\n  teach: 'Teaching',\n  demonstrate: 'Demonstrating',\n  probe: 'Probing',\n  feedback: 'Feedback',\n  reteach: 'Re-teaching',\n  assess: 'Assessing',\n  advance: 'Advancing',\n  plan: 'Planning',\n  wrap_up: 'Wrapping up',\n};\n\nconst STUCK_OPTIONS = [\n  ['hint', 'Hint', 'The smallest possible nudge'],\n  ['bigger_hint', 'Bigger hint', 'Reveal just the next step'],\n  ['explain', 'Explain it', 'Re-teach the idea a different way'],\n  ['worked_example', 'Worked example', 'Show a similar problem solved'],\n  ['start_over', 'Start over', 'Go back to the prerequisite'],\n];\n\n/** §9 teaching modes — the learner can change how the tutor works at any point. */\nconst MODES = [\n  ['learn', 'Learn', 'Teach it to me interactively'],\n  ['practice', 'Practice', 'Give me targeted questions'],\n  ['quiz', 'Quiz', 'Test me without helping'],\n  ['master', 'Master', 'Build a full mastery pathway'],\n  ['homework', 'Homework', 'Help me work through my own assignment'],\n  ['review', 'Review', 'Find and fix my weak spots'],\n  ['exam_prep', 'Exam prep', 'Exam-style preparation'],\n  ['crash_course', 'Crash course', 'Maximum useful material, minimum time'],\n  ['explore', 'Explore', 'Let me follow my curiosity'],\n];\n\nconst QUICK_ACTIONS = [\n  ['practice_set', 'Practice set', 'target'],\n  ['worksheet', 'Worksheet', 'file'],\n  ['quiz', 'Quiz', 'help'],\n  ['flashcards', 'Flashcards', 'cards'],\n  ['study_guide', 'Study guide', 'book'],\n  ['mastery_check', 'Mastery check', 'trophy'],\n];\n\nexport function sessionView({ params }) {\n  const thread = h('div.thread');\n  const composerHost = h('div.composer');\n  const sideHost = h('aside.session-side');\n  const main = h('div.session-main', {}, thread, composerHost);\n  const root = h('div.session', {}, main, sideHost);\n\n  let session = null;\n  let sending = false;\n  let activeCard = null;\n\n  /* ------------------------------------------------------------- rendering */\n\n  function learnerTurn(text) {\n    return h(\n      'div.turn.learner',\n      {},\n      h(\n        'div.turn-head',\n        {},\n        h('div.turn-avatar.learner', {}, icon('brain', { size: 13 })),\n        h('span.turn-label', {}, 'You'),\n      ),\n      h('div.turn-body', {}, h('div.bubble', {}, prose(text))),\n    );\n  }\n\n  function tutorTurnNode(turn, { streaming = false } = {}) {\n    const body = h('div.turn-body.stack');\n\n    if (turn.say) body.appendChild(prose(turn.say, streaming ? 'stream-cursor' : ''));\n    if (turn.strategy_note) {\n      body.appendChild(\n        h('div.strategy-note', {}, icon('compass', { size: 14 }), h('span', {}, turn.strategy_note)),\n      );\n    }\n    const blocks = renderBlocks(turn.blocks || []);\n    if (blocks) body.appendChild(blocks);\n\n    if (turn.activity?.question && !streaming) {\n      if (turn.activity.instructions) {\n        body.appendChild(h('p.tiny.muted', {}, turn.activity.instructions));\n      }\n      const card = questionCard(turn.activity.question, {\n        mode \n              'button.stuck-option',\n              {\n                type: 'button',\n                onClick: () => {\n                  close();\n                  send('', directive);\n                },\n              },\n              h('b', {}, title),\n              h('span', {}, detail),\n            ),\n          ),\n        ),\n      );\n    });\n  }\n\n  /* --------------------------------------------------------------- actions */\n\n  async function generate(kind, topicOverride, extra = {}) {\n    const topic = topicOverride || session?.state?.focusConcept || session?.topic || session?.title;\n    const host = h('div.turn.fade-up', {}, h('div.turn-body', {}, statusLine(`Building a ${resourceLabel(kind).toLowerCase()} on ${topic}…`)));\n    thread.appendChild(host);\n    scrollToEnd(document.scrollingElement || document.documentElement);\n\n    try {\n      await api.generate(\n        {\n          kind,\n          topic,\n          subject: session?.subject,\n          concepts: extra.concepts || session?.plan?.concepts || [],\n          sessionId: session?.id,\n          minutes: extra.minutes,\n          count: extra.count,\n          difficulty: extra.difficulty ?? session?.state?.difficulty,\n          instructions: extra.instructions,\n          sourceIds: session?.state?.sourceIds || [],\n        },\n        {\n          resource: ({ resource }) => {\n            clear(host).appendChild(\n              h(\n                'div.turn-body',\n                {},\n                h(\n                  'button.list-item',\n                  { type: 'button', onClick: () => navigate(`/resource/${resource.id}`) },\n                  h('div', {}, h('b', {}, resource.title), h('span', {}, `${resourceLabel(resource.kind)} · open it`)),\n                  icon('arrowRight', { size: 14 }),\n                ),\n              ),\n            );\n            session.resources = [...(session.resources || []), resource];\n            drawSide();\n          },\n     );\n    try {\n      const insights = await api.insights();\n      clear(insightHost);\n      if (!insights.headline && !insights.patterns?.length) return;\n      insightHost.appendChild(\n        h(\n          'section.card',\n          {},\n          h(\n            'div.card-head',\n            {},\n            icon('trend', { size: 15 }),\n            h('h2', {}, 'What your history shows'),\n            h(\n              'button.btn.sm.ghost',\n              {\n                type: 'button',\n                onClick: async (event) => {\n                  event.currentTarget.disabled = true;\n                  await api.insights(true);\n                  loadInsights();\n                },\n              },\n              icon('refresh', { size: 13 }),\n              'Refresh',\n            ),\n          ),\n          insights.headline\n            ? h('p', { style: { fontSize: '15.5px', marginBottom: '14px', letterSpacing: '-0.012em' } }, insights.headline)\n            : null,\n          insights.patterns?.length\n            ? h(\n                'div.stack.stagger',\n                { style: { gap: '10px' } },\n                ...insights.patterns.map((pattern) =>\n                  h(\n                    'div.block.concept',\n                    {},\n                    h('h4', {}, pattern.observation),\n                    pattern.evidence ? h('p.tiny.dim', {}, pattern.evidence) : null,\n                    pattern.action ? prose(`**Do this:** ${pattern.action}`) : null,\n                  ),\n                ),\n              )\n            : null,\n          insights.recommended?.length\n            ? h(\n                'div.row.wrap',\n                { style: { marginTop: '14px' } },\n                ...insights.recommended.map((rec) =>\n                  h(\n                    'button.btn.sm',\n                    {\n                      type: 'button',\n                      title: rec.why,\n                      onClick: () => startGeneration({ kind: rec.kind, topic: rec.topic, minutes: rec.minutes }),\n                    },\n                    icon('wand', { size: 13 }),\n                    rec.title,\n                  ),\n                ),\n              )\n            : null,\n        ),\n      );\n    } catch {\n      clear(insightHost);\n    }\n  }\n\n  /* ----------------------------------------------------------------- grid */\n\n  function drawGrid(data) {\n    clear(gridHost);\n\n    gridHost.appendChild(\n      card(\n        'Continue learning',\n        'clock',\n        data.continueLearning.length\n          ? h(\n              'div.stack',\n              { style: { gap: '6px' } },\n              ...data.continueLearning.map((session) =>\n                h(\n                  'button.list-item',\n                  { type: 'button', onClick: () => navigate(`/session/${session.id}`) },\n                  h(\n                    'div',\n                    {},\n                    h('b', {}, session.title),\n                    h('span', {}, `${titleCase(session.mode)} · ${session.focus || session.topic || ''} · ${fmtDate(session.updated_at)}`),\n                  ),\n                  icon('arrowRight', { size: 14 }),\n                ),\n              ),\n            )\n          : emptyState('Nothing in progress', 'Start a session and it waits for you here.'),\n      ),\n    );\n\n    gridHost.appendChild(\n      card(\n        'Weak areas',\n        'target',\n        data.weakAreas.length\n          ? h(\n              'div.stack',\n              { style: { gap: '4px' } },\n              ...data.weakAreas.map((concept) =>\n                h(\n                  'div.concept-row',\n                  {},\n                  h(\n                    'div',\n                    {},\n                    h('div.concept-name', {}, concept.name),\n                    h(\n                      'div.concept-sub',\n                      {},\n                      `${concept.subject} · ${Math.rou s schedule themselves.'),\n      ),\n    );\n\n    gridHost.appendChild(\n      card(\n        'Progress by subject',\n        'layers',\n        data.subjects.length\n          ? h(\n              'div.stack',\n              { style: { gap: '20px' } },\n              ...data.subjects.map((subject) =>\n                h(\n                  'div.stack',\n                  { style: { gap: '10px' } },\n                  h(\n                    'div.spread',\n                    {},\n                    h('b', { style: { fontSize: '13.5px' } }, subject.subject),\n                    h('span.tiny.dim', {}, `${subject.mastered}/${subject.total} mastered`),\n                  ),\n                  ...subject.concepts\n                    .slice(0, 5)\n                    .map((concept) => masteryMeter(concept.mastery_level, concept.name)),\n                  subject.concepts.length > 5\n                    ? h('button.btn.sm.ghost', { type: 'button', onClick: () => navigate('/progress') }, `+${subject.concepts.length - 5} more`)\n                    : null,\n                ),\n              ),\n            )\n          : emptyState('No progress yet', 'Your mastery map builds itself as you work.'),\n      ),\n    );\n\n    gridHost.appendChild(card('Learning goals', 'flag', goalsCard(data)));\n\n    gridHost.appendChild(\n      card(\n        'Recent work',\n        'library',\n        data.recentWork.length\n          ? h(\n              'div.stack',\n              { style: { gap: '6px' } },\n              ...data.recentWork.map((resource) =>\n                h(\n                  'button.list-item',\n                  { type: 'button', onClick: () => navigate(`/resource/${resource.id}`) },\n                  h(\n                    'div',\n                    {},\n                    h('b', {}, resource.title),\n                    h('span', {}, `${resourceLabel(resource.kind)} · ${fmtDate(resource.created_at)}`),\n                  ),\n                  resource.score !    'Drill it',\n                    ),\n                  ),\n                ),\n              ),\n            )\n          : emptyState('None open', 'Mistakes get logged here until you clear them.'),\n      ),\n    );\n  }\n\n  /* ---------------------------------------------------------------- goals */\n\n  function goalsCard(data) {\n    const host = h('div.stack', { style: { gap: '14px' } });\n\n    if (!data.goals.length) {\n      host.appendChild(emptyState('No goals set', 'A goal gives Axiom a target to sequence everything else against.'));\n    } else {\n      for (const goal of data.goals) {\n        const pct = Math.round((goal.progress || 0) * 100);\n        host.appendChild(\n          h(\n            'div.stack',\n            { style: { gap: '7px' } },\n            h(\n              'div.spread',\n              {},\n              h('b', { style: { fontSize: '13.5px' } }, goal.title),\n              h('span.tiny.dim', {}, goal.target_date ? `by ${goal.target_date}` : `${goal.tracked} concepts`),\n            ),\n            h(\n              'div.meter-track',\n              {},\n              h('div.meter-fill', { style: { width: `${pct}%`, background: masteryColour(Math.round((goal.progress || 0) * 5)) } }),\n            ),\n            h(\n              'div.spread.tiny.dim',\n              {},\n              h('span', {}, `${goal.mastered}/${goal.tracked || 0} mastered · ${pct}%`),\n              goal.roadmap?.resourceId\n                ? h('button.btn.sm.ghost', { type: 'button', onClick: () => navigate(`/resource/${goal.roadmap.resourceId}`) }, 'Open roadmap')\n                : h('button.btn.sm.ghost', { type: 'button', onClick: (event) => buildRoadmap(goal, event.currentTarget) }, 'Build a roadmap'),\n            ),\n          ),\n        );\n      }\n    }\n\n    host.appendChild(\n      h('button.btn.sm', { type: 'button', style: { justifySelf: 'start' }, onClick: newGoal }, icon('plus', { size: 13 }), 'Add a goal'),\n    );\n    return host; erate(\n        { kind: 'plan', topic: goal.title, subject: goal.subject || 'General', days: Math.min(60, days), minutes: 45, goal: goal.title },\n        {\n          resource: async ({ resource }) => {\n            await api.updateGoal(goal.id, {\n              roadmap: {\n                resourceId: resource.id,\n                concepts: (resource.payload.days || []).flatMap((day) => day.concepts),\n              },\n            });\n            navigate(`/resource/${resource.id}`);\n          },\n        },\n      );\n    } catch (err) {\n      toast(err.message || 'Could not build the roadmap.', 'error');\n      button.disabled = false;\n      button.textContent = 'Build a roadmap';\n    }\n  }\n\n  function card(title, iconName, body) {\n    return h('section.card', {}, h('div.card-head', {}, icon(iconName, { size: 15 }), h('h2', {}, title)), body);\n  }\n\n  return root;\n}\n\nexport { MASTERY_LABELS };\n","axiom:public/js/views/studio.js":"import { h, clear, autosize } from 'axiom:public/js/dom.js';\nimport { icon } from 'axiom:public/js/icons.js';\nimport { api } from 'axiom:public/js/api.js';\nimport { navigate } from 'axiom:public/js/router.js';\nimport { state } from 'axiom:public/js/state.js';\nimport { toast, statusLine, emptyState } from 'axiom:public/js/ui.js';\nimport { renderResource, renderPreview, resourceLabel } from 'axiom:public/js/render/resource.js';\n\nconst KINDS = [\n  ['worksheet', 'Worksheet'],\n  ['practice_set', 'Practice set'],\n  ['quiz', 'Quiz'],\n  ['test', 'Test'],\n  ['homework', 'Homework'],\n  ['lesson', 'Lesson'],\n  ['study_guide', 'Study guide'],\n  ['flashcards', 'Flashcards'],\n  ['plan', 'Study plan'],\n  ['exam_prep', 'Exam prep'],\n  ['mastery_check', 'Mastery check'],\n  ['review', 'Review'],\n  ['coding_exercise', 'Coding exercise'],\n  ['lab', 'Lab activity'],\n  ['project', 'Project'],\n  ['essay_prompt', 'Essay prompt'],\n  ['saq', 'SAQ'],\n  ['dbq', 'DBQ'],\n  ['leq', 'LEQ'],\n];\n\nconst QUESTION_TYPES = [\n  [   'Anything else',\n          (() => {\n            const node = h('textarea.textarea', {\n              rows: 3,\n              placeholder: 'e.g. exam-style, no calculator, focus on the sign conventions I keep missing',\n              value: form.instructions,\n              onInput: (event) => {\n                form.instructions = event.target.value;\n              },\n            });\n            autosize(node, 200);\n            return node;\n          })(),\n        ),\n        h(\n          'button.btn.primary.lg',\n          { type: 'button', style: { width: '100%' }, onClick: generate },\n          icon('wand', { size: 15 }),\n          `Generate ${resourceLabel(form.kind).toLowerCase()}`,\n        ),\n        h('p.tiny.dim', {}, 'Generated material is checked for wrong answer keys, ambiguity and duplicates before you see it.'),\n      ),\n    );\n  }\n\n  async function generate() {\n    if (!form.topic.trim()) {\n      toast('Give it a topic first.', 'info');\n      return;\n    }\n    clear(output).appendChild(statusLine(`Building your ${resourceLabel(form.kind).toLowerCase()}…`));\n    const previewHost = h('div.stack', { style: { opacity: '0.72' } });\n    output.appendChild(previewHost);\n\n    try {\n      await api.generate(\n        {\n          kind: form.kind,\n          topic: form.topic.trim(),\n          subject: form.subject.trim() || 'General',\n          level: form.level.trim(),\n          difficulty: form.difficulty,\n          count: form.count,\n          minutes: form.minutes,\n          days: form.days,\n          types: form.types,\n          instructions: form.instructions.trim(),\n          sourceIds: form.sourceIds,\n        },\n        {\n          status: ({ message }) => {\n            const line = output.querySelector('.status-line span:last-child');\n            if (line) line.textContent = message;\n          },\n          partial: (partial) => {\n            clear(previewHost).appendChild(renderPreview(partial));\n          },\n          resource: ({ resource }) => {\n            state.lastResource = resource;\n            clear(output).appendChild(\n              h(\n                'div.stack',\n                { style: { gap: '16px' } },\n                h(\n                  'div.row.wrap',\n                  {},\n                  h('span.chip.mint', {}, 'Ready'),\n                  h(\n                    'button.btn.sm',\n                    { type: 'button', onClick: () => navigate(`/resource/${resource.id}`) },\n                    icon('arrowRight', { size: 13 }),\n                    'Open on its own page',\n                  ),\n                  resource.payload?.quality?.repaired\n                    ? h('span.chip.amber', {}, `${resource.payload.quality.repaired} question(s) repaired by quality control`)\n                    : null,\n                ),\n                renderResource(resource, {\n                  onGenerateMore: (kind, topic, extra) => startGeneration({ kind, topic, ...extra }),\n                  onGenerated: (made) => navigate(`/resource/${made.id}`),\n                }),\n              ),\n            );\n          },\n        },\n      );\n    } catch (err) {\n      clear(output).appendChild(\n        h(\n          'div.card',\n          {},\n          h('p', { style: { color: 'var(--rose)' } }, err.message || 'Generation failed.'),\n          h('button.btn.sm', { type: 'button', onClick: generate, style: { marginTop: '10px' } }, icon('refresh', { size: 13 }), 'Try again'),\n        ),\n      );\n    }\n  }\n\n  draw();\n  output.appendChild(\n    emptyState(\n      'Nothing generated yet',\n      'Pick what you want on the left. Everything is written fresh against your current mastery level.',\n    ),\n  );\n  if (queued?.autorun && form.topic) queueMicrotask(generate);\n\n  return root;\n}\n","axiom:public/js/views/library.js":"import { h, clear, fmtDate } from 'axiom:public/js/dom.js';\nimport { icon } from 'axiom:public/js/icons.js';\nimport { api } from 'axiom:public/js/api.js';\nimport { navigate } from 'axiom:public/js/router.js';\nimport { skeleton, emptyState } from 'axiom:public/js/ui.js';\nimport { renderResource, resourceLabel } from 'axiom:public/js/render/resource.js';\nimport { startGeneration } from 'axiom:public/js/views/studio.js';\n\nexport function libraryView() {\n  const list = h('div.stack', { style: { gap: '8px' } });\n  const root = h(\n    'div.page.stack',\n    { style: { gap: '18px' } },\n    h(\n      'div.spread',\n      {},\n      h(\n        'div',\n        {},\n        h('h1.page-title', {}, 'Library'),\n        h('p.page-sub', {}, 'Everything Axiom has generated for you, with what you scored on it.'),\n      ),\n      h('button.btn.primary', { type: 'button', onClick: () => navigate('/studio') }, icon('wand', { size: 14 }), 'Make something'),\n    ),\n    list,\n  );\n\n  list.appendChild(skeleton(4, 56));\n  api\n    .resources()\n    .then(({ resources }) => {\n      clear(list);\n      if (!resources.length) {\n        list.appendChild(\n          emptyState(\n            'Nothing here yet',\n            'Lessons, worksheets, quizzes, flashcards and plans all land here once you make them.',\n            h('button.btn.primary', { type: 'button', onClick: () => navigate('/studio') }, 'Open the studio'),\n          ),\n        );\n        return;\n      }\n      for (const resource of resources) {\n        list.appendChild(\n          h(\n            'button.list-item',\n            { type: 'button', onClick: () => navigate(`/resource/${resource.id}`) },\n            h(\n              'div',\n              {},\n              h('b', {}, resource.title),\n              h(\n                'span',\n                {},\n                `${resourceLabel(resource.kind)} · ${resource.topic || ''} · ${fmtDate(resource.created_at)}`,\n              ),\n            ),\n            h(\n              'div.row',\n              { style: { gap: '8px' } },\n              resource.score != n h(\n              'div.stack',\n              { style: { gap: '2px' } },\n              ...attempts.slice(0, 30).map((attempt) =>\n                h(\n                  'div.concept-row',\n                  {},\n                  h(\n                    'div',\n                    {},\n                    h('div.concept-name', {}, attempt.concept_name || 'Unknown concept'),\n                    h(\n                      'div.concept-sub',\n                      {},\n                      `${fmtDate(attempt.created_at)} · difficulty ${attempt.difficulty}` +\n                        (attempt.misconception ? ` · ${attempt.misconception}` : ''),\n                    ),\n                  ),\n                  h(\n                    'div.row',\n                    { style: { gap: '6px' } },\n                    attempt.error_type && attempt.error_type !== 'none'\n                      ? h('span.chip', {}, titleCase(attempt.error_type))\n                      : null,\n                    h(\n                      'span',\n                      { class: `chip ${attempt.verdict === 'correct' ? 'mint' : attempt.verdict === 'partial' ? 'amber' : 'rose'}` },\n                      `${attempt.score}/${attempt.max_score}`,\n                    ),\n                  ),\n                ),\n              ),\n            ),\n          ),\n        );\n      }\n    })\n    .catch((err) => {\n      clear(body).appendChild(h('p', { style: { color: 'var(--rose)' } }, err.message));\n    });\n\n  return root;\n}\n","axiom:public/js/views/sources.js":"import { h, clear, fmtDate } from 'axiom:public/js/dom.js';\nimport { icon } from 'axiom:public/js/icons.js';\nimport { prose } from 'axiom:public/js/markdown.js';\nimport { api } from 'axiom:public/js/api.js';\nimport { navigate } from 'axiom:public/js/router.js';\nimport { state } from 'axiom:public/js/state.js';\nimport { toast, statusLine, emptyState, skeleton } from 'axiom:public/js/ui.js';\nimport { startGeneration } from 'axiom:publi d failed.', 'error');\n    }\n  }\n\n  async function analyse(sourceId) {\n    clear(analysisHost).appendChild(statusLine('Reading the document…'));\n    try {\n      const { analysis, source } = await api.analyzeSource(sourceId);\n      clear(analysisHost).appendChild(\n        h(\n          'section.card.stack',\n          {},\n          h('div.card-head', {}, icon('file', { size: 15 }), h('h2', {}, analysis.title || source.name), h('span.chip', {}, analysis.level)),\n          prose(analysis.summary),\n          analysis.concepts?.length\n            ? h(\n                'div',\n                {},\n                h('p.tiny.dim', { style: { marginBottom: '6px' } }, 'What is in it:'),\n                h('div.row.wrap', {}, ...analysis.concepts.map((c) => h('span.chip', { title: c.summary }, c.name))),\n              )\n            : null,\n          h(\n            'div.row.wrap',\n            { style: { marginTop: '4px' } },\n            ...(analysis.suggested || []).map((suggestion) =>\n              h(\n                'button.btn.sm',\n                {\n                  type: 'button',\n                  title: suggestion.why,\n                  onClick: () =>\n                    startGeneration({\n                      kind: suggestion.kind,\n                      topic: suggestion.title,\n                      subject: analysis.subject,\n                      sourceIds: [source.id],\n                    }),\n                },\n                icon('wand', { size: 13 }),\n                `${resourceLabel(suggestion.kind)}: ${suggestion.title}`,\n              ),\n            ),\n            h(\n              'button.btn.sm.primary',\n              {\n                type: 'button',\n                onClick: () => {\n                  state.pendingStart = { request: `Teach me everything in ${source.name}.`, sourceIds: [source.id] };\n                  navigate('/session/new');\n                },\n              },\n              icon('spark', { size: 13 }),\n              'Teach me this',\n            ),\n          ),\n        ),\n      );\n    } catch (err) {\n      clear(analysisHost);\n      toast(err.message || 'Could not read that document.', 'error');\n    }\n  }\n\n  function load() {\n    clear(list).appendChild(skeleton(2, 52));\n    api\n      .sources()\n      .then(({ sources }) => {\n        clear(list);\n        if (!sources.length) {\n          list.appendChild(emptyState('No material uploaded', 'Anything you upload can be turned into lessons, study guides or tests.'));\n          return;\n        }\n        for (const source of sources) {\n          list.appendChild(\n            h(\n              'div.list-item',\n              {},\n              h(\n                'div',\n                {},\n                h('b', {}, source.name),\n                h('span', {}, `${source.kind.toUpperCase()} · ${(source.bytes / 1024).toFixed(0)} KB · ${fmtDate(source.created_at)}`),\n                source.summary ? h('span', { style: { display: 'block', marginTop: '3px' } }, source.summary.slice(0, 140)) : null,\n              ),\n              h(\n                'div.row',\n                { style: { gap: '6px' } },\n                h('button.btn.sm.ghost', { type: 'button', onClick: () => analyse(source.id) }, icon('eye', { size: 13 }), 'Analyse'),\n                h(\n                  'button.btn.sm',\n                  {\n                    type: 'button',\n                    onClick: () => startGeneration({ kind: 'study_guide', topic: source.name, sourceIds: [source.id] }),\n                  },\n                  icon('book', { size: 13 }),\n                  'Study guide',\n                ),\n              ),\n            ),\n          );\n        }\n      })\n      .catch((err) => clear(list).appendChild(h('p', { style: { color: 'var(--rose)' } }, err.message)));\n  }\n\n  load();\n  return root;\n}\n","axiom:public/js/views/review.js":"import { h, clear } from 'axiom:public/js/dom.js';\nimport { i    try {\n      await api.courseNext(snapshot.course.id, {\n        status: ({ message }) => {\n          const line = host.querySelector('.status-line span:last-child');\n          if (line) line.textContent = message;\n        },\n        resource: ({ resource }) => {\n          clear(host).appendChild(\n            h(\n              'button.list-item',\n              { type: 'button', onClick: () => navigate(`/resource/${resource.id}`) },\n              h('div', {}, h('b', {}, resource.title), h('span', {}, `${resourceLabel(resource.kind)} · open it`)),\n              icon('arrowRight', { size: 14 }),\n            ),\n          );\n        },\n      });\n    } catch (err) {\n      clear(host).appendChild(h('p', { style: { color: 'var(--critical)' } }, err.message || 'Could not build that.'));\n    }\n  }\n\n  async function sitExam() {\n    const host = h('div.card', {}, statusLine('Writing a paper to the real blueprint…'));\n    root.insertBefore(host, root.children[2] || null);\n    host.scrollIntoView({ behavior: 'smooth', block: 'center' });\n    try {\n      await api.courseExam(snapshot.course.id, {\n        resource: ({ resource }) => navigate(`/resource/${resource.id}`),\n      });\n    } catch (err) {\n      clear(host).appendChild(h('p', { style: { color: 'var(--critical)' } }, err.message));\n    }\n  }\n\n  function settings() {\n    modal((panel, close) => {\n      const bands = snapshot.readiness.bands;\n      let target = snapshot.targetScore;\n      const date = h('input.input', { type: 'date', value: snapshot.course.exam_date || '' });\n      const minutes = h('input.input', { type: 'number', min: '10', max: '480', value: String(snapshot.course.state?.minutesPerDay ?? 60) });\n\n      panel.appendChild(h('h3', {}, 'Course settings'));\n      panel.appendChild(\n        h(\n          'div.field',\n          {},\n          h('label', {}, 'Target score'),\n          h(\n            'div.toggle-group',\n            {},\n            ...bands.map((band n  return root;\n}\n\n/* ------------------------------------------------------------------ runtime */\n\nfunction runtimeCard() {\n  const body = h('div.stack', { style: { gap: '10px' } });\n  const card = h(\n    'section.card',\n    {},\n    h('div.card-head', {}, h('h2', {}, 'Engine'), h('span.tiny.dim', {}, state.health?.model || '')),\n    body,\n  );\n\n  const draw = (health) => {\n    clear(body);\n    const ready = health?.llmReady;\n    body.appendChild(\n      h(\n        'div.row',\n        { style: { gap: '8px', flexWrap: 'wrap' } },\n        h(`span.chip${ready ? '.good' : '.warn'}`, {}, ready ? 'Connected' : 'No API key'),\n        h('span.chip', {}, health?.model || 'model'),\n        h('span.chip', {}, health?.runtime === 'browser' ? 'Runs in this browser' : 'Runs on a server'),\n        h('span.chip', {}, `Quality control ${health?.qualityControl ? 'on' : 'off'}`),\n      ),\n    );\n    body.appendChild(\n      h(\n        'p.tiny.dim',\n        { style: { margin: 0 } },\n        health?.runtime === 'browser'\n          ? 'Everything — the learner model, your work, the courses — is computed and stored in this browser. Requests go straight to Anthropic; nothing passes through anyone else.'\n          : 'Generation runs on the server. Your browser never sees the API key.',\n      ),\n    );\n  };\n\n  draw(state.health);\n  api.health().then((health) => { update({ health }); draw(health); }).catch(() => {});\n  return card;\n}\n\n/* ---------------------------------------------------------------- API key */\n\nfunction keyCard() {\n  const api_ = local();\n  const input = h('input.input', {\n    type: 'password',\n    placeholder: 'sk-ant-...',\n    autocomplete: 'off',\n    spellcheck: false,\n    value: api_.getKey() || '',\n  });\n  const status = h('p.tiny.dim', { style: { margin: 0 } });\n\n  const save = async (verify) => {\n    const key = input.value.trim();\n    if (!key) {\n      api_.setKey('');\n      status.textContent = 'Key removed.';\n      api.health().then((health) => update({ health })).catch(() => {});\n      return;\n    }\n    api_.setKey(key);\n    if (!verify) return;\n    status.textContent = 'Checking…';\n    const result = await api_.verifyKey(key);\n    status.textContent = result.ok ? 'Key works.' : result.error;\n    if (result.ok) toast('API key saved and verified.', 'success');\n    else toast(result.error, 'error', 9000);\n    api.health().then((health) => update({ health })).catch(() => {});\n  };\n\n  return h(\n    'section.card',\n    {},\n    h('div.card-head', {}, h('h2', {}, 'Anthropic API key')),\n    h(\n      'div.stack',\n      { style: { gap: '12px' } },\n      h(\n        'p.tiny.dim',\n        { style: { margin: 0 } },\n        'Stored in this browser only, and sent only to api.anthropic.com. Anyone with access to this browser profile can read it, and you should never publish a copy of this file with a key saved in it.',\n      ),\n      field(\n        'Key',\n        'Create one at console.anthropic.com → Settings → API keys.',\n        h('div.row', { style: { gap: '8px' } }, input, h('button.btn.primary', { type: 'button', onClick: () => save(true) }, 'Save and test')),\n      ),\n      status,\n      h(\n        'div.row',\n        { style: { gap: '8px' } },\n        h(\n          'button.btn.sm',\n          {\n            type: 'button',\n            onClick: () => {\n              input.type = input.type === 'password' ? 'text' : 'password';\n            },\n          },\n          'Show / hide',\n        ),\n        h(\n          'button.btn.sm.danger',\n          {\n            type: 'button',\n            onClick: () => {\n              input.value = '';\n              save(false);\n            },\n          },\n          'Remove key',\n        ),\n      ),\n    ),\n  );\n}\n\n/* -------------------------------------------------------------------- data */\n\nfunction dataCard() {\n  const api_ = local();\n  const meter = h('p.tiny.dim', { style: { margin ject) => {\n          const next = (err) => (err ? reject(err) : (advanced = true, resolve()));\n          try {\n            const out = layer.handler(req, res, next);\n            if (out && typeof out.then === 'function') out.then(() => resolve(), reject);\n          } catch (err) {\n            reject(err);\n          }\n        });\n        if (!advanced && res.headersSent) return true;\n        continue;\n      }\n\n      if (layer.method !== req.method) continue;\n      const params = match(layer, req.routePath);\n      if (!params) continue;\n\n      req.params = params;\n      await layer.handler(req, res, (err) => {\n        if (err) throw err;\n      });\n      return true;\n    }\n    return false;\n  }\n}\n\n/** Turn \"/sessions/:id/turn\" into a matcher. */\nfunction compile(path) {\n  const keys = [];\n  const source = String(path)\n    .split('/')\n    .map((part) => {\n      if (!part.startsWith(':')) return part.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');\n      keys.push(part.slice(1));\n      return '([^/]+)';\n    })\n    .join('/');\n  return { regex: new RegExp(`^${source}/?$`), keys };\n}\n\nfunction match(layer, path) {\n  const found = layer.regex.exec(path);\n  if (!found) return null;\n  const params = {};\n  layer.keys.forEach((key, i) => {\n    params[key] = decodeURIComponent(found[i + 1]);\n  });\n  return params;\n}\n\nconst express = () => {\n  throw new Error('The browser build composes routers directly; it does not create an Express app.');\n};\nexpress.Router = () => new Router();\nexpress.json = () => (req, res, next) => next();\nexpress.static = () => (req, res, next) => next();\n\nexport default express;\nexport { Router };\n","axiom:server/llm/index.js":"import { config } from 'axiom:browser/config.js';\nimport { createAnthropicProvider, LLMError } from 'axiom:browser/anthropic.js';\nimport { createMockProvider } from 'axiom:server/llm/mock.js';\n\nlet provider;\n\nexport function llm() {\n  if (provider) return provider;\n  provider = config.provider === 'mock' ? createMockProvider() : createAnthropicProvider();\n  return provider;\n}\n\n/** Reset between tests. */\nexport function resetProvider() {\n  provider = undefined;\n}\n\nexport { LLMError };\n","axiom:browser/prompts.js":"import { PROMPTS } from 'axiom:browser/prompt-data.js';\n\n/**\n * Browser replacement for server/prompts.js. The prompt files are the same\n * markdown, inlined at build time instead of read from disk.\n */\nexport function loadPrompt(name) {\n  const text = PROMPTS[name];\n  if (text === undefined) throw new Error(`Unknown prompt: ${name}`);\n  return text;\n}\n\n/** Fill `${var}` placeholders. Missing values render as an empty string. */\nexport function renderPrompt(name, vars = {}) {\n  return loadPrompt(name)\n    .replace(/\\$\\{(\\w+)\\}/g, (_, key) => {\n      const value = vars[key];\n      if (value == null) return '';\n      return typeof value === 'string' ? value : JSON.stringify(value);\n    })\n    .replace(/\\n{3,}/g, '\\n\\n')\n    .trim();\n}\n\nexport const systemPrompt = () => loadPrompt('system');\n","axiom:server/schemas/index.js":"/**\n * JSON schemas for every structured generation.\n *\n * Structured outputs constrain the model to these shapes, so the frontend can\n * render real components instead of dumping prose. Schemas are written in the\n * strict style (every property required, `additionalProperties: false`);\n * \"optional\" fields are expressed as nullable types or empty arrays.\n */\n\nconst str = (description, extra = {}) => ({ type: 'string', description, ...extra });\nconst nullableStr = (description) => ({ type: ['string', 'null'], description });\nconst num = (description, extra = {}) => ({ type: 'number', description, ...extra });\nconst int = (description, extra = {}) => ({ type: 'integer', description, ...extra });\nconst bool = (description) => ({ type: 'boolean', description });\nconst arr = (items, description) => ({ type: 'array', items, description });\nconst enumOf = (values, description) => ({ type: 'string', enum: values, description });\n\n/** Strict object: all declared properties required, no extras. */\nfunction obj(properties, description) {\n  return {\n    type: 'object',\n    description,\n    properties,\n    required: Object.keys(properties),\n    additionalProperties: false,\n  };\n}\n\n/* ------------------------------------------------------------------ shared */\n\nexport const QUESTION_TYPES = [\n  'multiple_choice',\n  'true_false',\n  'short_answer',\n  'numeric',\n  'free_response',\n  'fill_blank',\n  'coding',\n  'essay',\n  'scenario',\n  'proof',\n];\n\nexport const EVIDENCE_KINDS = ['recall', 'explain', 'solve', 'apply', 'transfer'];\n\nconst choice = obj(\n  {\n    key: str('Single uppercase letter: A, B, C, D...'),\n    text: str('Choice text. Plausible distractors only — no joke options.'),\n  },\n  'One multiple-choice option.',\n);\n\nconst rubricRow = obj(\n  {\n    criterion: str('What earns this point, stated so a grader could apply it consistently.'),\n    points: num('Points available for this criterion.'),\n  },\n  'One rubric line.',\n);\n\nexport const question = obj(\n  {\n    id: str('Stable id, e.g. \"q1\".'),\n    type: enumOf(QUESTION_TYPES, 'Question format.'),\n    concept: str('The single concept this question tests, in 1-5 words.'),\n    difficulty: num('1 = easiest recall, 5 = hardest transfer/synthesis.', {\n      minimum: 1,\n      maximum: 5,\n    }),\n    evidence: enumOf(EVIDENCE_KINDS, 'What a correct answer proves the learner can do.'),\n    context: str('Stimulus the question depends on (passage, data, code, scenario). \"\" if none.'),\n    prompt: str('The question itself, in Markdown. LaTeX in $...$ / $$...$$ where useful.'),\n    choices: arr(choice, 'Options for multiple_choice / true_false. Empty array otherwise.'),\n    answer: str('The correct answer. For multiple_choice this is the choice key only (e.g. \"B\").'),\n    accepted: arr(str('An alternative form of the correct answer that should be marked right.'), 'Equivalent accepted answers. Empty if none.'),\n    tolerance: {\n      type: ['number', 'null'],\n      description: 'Absolute numeric tolerance for numeric answers, else null.',\n    },\n    units: str('Expected units for numeric answers, \"\" if not applicable.'),\n    points: num('Points this question is worth.'),\n    rubric: arr(rubricRow, 'Rubric for free_response/essay/proof/coding. Empty for auto-gradable items.'),\n    solution: str('Complete worked solution in Markdown — the reasoning, not just the answer.'),\n    hints: arr(str('A hint.'), 'Graduated hints, smallest nudge first, at most 3. Never the answer.'),\n    estimated_seconds: int('Realistic solving time in seconds.'),\n  },\n  'A single generated question.',\n);\n\nconst diagramNode = obj(\n  {\n    id: str('Short id used by edges.'),\n    label: str('Node label, kept short.'),\n    detail: str('One-line elaboration, \"\" if none.'),\n    group: str('Optional grouping/colour key, \"\" if none.'),\n  },\n  'Diagram node.',\n);\n\nconst diagramEdge = obj(\n  {\n    from: str('Source node id.'),\n    to: str('Target node id.'),\n    label: str('Edge label, \"\" if none.'),\n  },\n  'Diagram edge.',\n);\n\nexport const diagram = obj(\n  {\n    type: enumOf(\n      ['flow', 'cycle', 'concept_map', 'timeline', 'bar', 'function_graph', 'comparison'],\n      'Diagram family. Choose the one that actually clarifies the idea.',\n    ),\n    title: str('Diagram title.'),\n    caption: str('What the learner should notice in it.'),\n    nodes: arr(diagramNode, 'Nodes for flow / cycle / concept_map. Empty otherwise.'),\n    edges: arr(diagramEdge, 'Edges for flow / cycle / concept_map. Empty otherwise.'),\n    items: arr(\n      obj(\n        {\n          when: str('Time label / stage name.'),\n          label: str('What happens.'),\n          detail: str('Why it matters, \"\" if none.'),\n        },\n        'Timeline entry.',\n      ),\n      'Entries for timeline. Empty otherwise.',\n    ),\n    series: arr(\n      obj({ label: str('Category.'), value: num('Magnitude.') }, 'Bar entry.'),\n      'Bars for bar charts. Empty otherwise.',\n    ),\n    points: arr(\n      obj({ x: num('x value.'), y: num('y value.'), label: str('Point label, \"\" if none.') }, 'Plot point.'),\n      'Points for function_graph, in x order. Empty otherwise.',\n    ),\n    columns: arr(str('Column header.'), 'Headers for comparison tables. Empty otherwise.'),\n    rows: arr(arr(str('Cell.'), 'Row cells.'), 'Rows for comparison tables. Empty otherwise.'),\n    x_label: str('X axis label, \"\" if none.'),\n    y_label: str('Y axis label, \"\" if none.'),\n  },\n  'A diagram that earns its place — never decoration.',\n);\n\nconst block = obj(\n  {\n    kind: enumOf(\n      ['concept', 'intuition', 'analogy', 'example', 'steps', 'warning', 'misconception', 'diagram', 'code', 'table', 'summary'],\n      'Block role in the lesson.',\n    ),\n    heading: str('Short heading.'),\n    markdown: str('Body in Markdown. \"\" when the block is carried by its structured field.'),\n    steps: arr(\n      obj({ title: str('Step name.'), detail: str('What happens in this step and why.') }, 'One step.'),\n      'Ordered steps for `steps` blocks. Empty otherwise.',\n    ),\n    diagram: { anyOf: [diagram, { type: 'null' }], description: 'Diagram for `diagram` blocks, else null.' },\n    code: {\n      anyOf: [\n        obj(\n          {\n            language: str('Language id, e.g. \"java\".'),\n            source: str('The code.'),\n            explanation: str('What to look at in it.'),\n          },\n          'Code sample.',\n        ),\n        { type: 'null' },\n      ],\n      description: 'Code for `code` blocks, else null.',\n    },\n    table: {\n      anyOf: [\n        obj(\n          {\n            columns: arr(str('Header.'), 'Column headers.'),\n            rows: arr(arr(str('Cell.'), 'Row.'), 'Rows.'),\n          },\n          'Table.',\n        ),\n        { type: 'null' },\n      ],\n      description: 'Table for `table` blocks, else null.',\n    },\n  },\n  'One unit of explanation.',\n);\n\n/* ------------------------------------------------------------------- intake */\n\nexport const routeSchema = obj(\n  {\n    understood: str(\"One sentence, addressed to the learner, showing you understood the request.\"),\n    intent: enumOf(\n      [\n        'learn', 'practice', 'quiz', 'test', 'worksheet', 'homework', 'review',\n        'exam_prep', 'crash_course', 'explore', 'plan', 'flashcards', 'study_guide', 'diagnose',\n      ],\n      'The learning experience that should actually be built.',\n    ),\n    mode: enumOf(\n      ['learn', 'practice', 'quiz', 'master', 'homework', 'review', 'exam_prep', 'crash_course', 'explore'],\n      'Teaching mode to run the session in.',\n    ),\n    title: str('Short session title, max 6 words.'),\n    subject: str('Broad subject, e.g. \"Physics\", \"Spanish\", \"Computer Science\".'),\n    course_level: str('Course/level if inferable, e.g. \"AP Physics 1\", \"Year 9\", \"\" if unclear.'),\n    topic: str('The specific topic.'),\n    concepts: arr(str('A single teachable concept name, 1-5 words.'), 'Concepts this breaks into, ordered by teaching order. 1-8 of them.'),\n    prerequisites: arr(str('A prerequisite concept name.'), 'Concepts that must already be solid. Empty if none.'),\n    goal: enumOf(\n      ['understand', 'memorise', 'master', 'test_prep', 'homework_help', 'review', 'practice', 'apply', 'from_scratch', 'advance'],\n      'What the learner actually wants out of this.',\n    ),\n    estimated_level: str('Your estimate of their current level in one short phrase.'),\n    difficulty: num('Starting difficulty 1-5.', { minimum: 1, maximum: 5 }),\n    time_minutes: int('Minutes available for this session. Infer if unstated.'),\n    horizon_days: int('Days until the deadline that matters, 0 if none.'),\n    needs_diagnostic: bool('True when a 2-3 question probe would change how you teach this.'),\n    diagnostic_reason: str('Why the probe is worth the time, or \"\" if not needed.'),\n    clarifying_question: nullableStr(\n      'One short question to ask ONLY if the request is genuinely unteachable without it. Prefer null and a sensible assumption.',\n    ),\n    assumption: str('The assumption you are proceeding on if you did not ask. \"\" if you asked.'),\n    opening_note: str('2-4 sentences to the learner: what you will do and why, in that order. No filler.'),\n  },\n  'Analysis of a learning request.',\n);\n\n/* --------------------------------------------------------------- tutor turn */\n\nexport const tutorTurnSchema = obj(\n  {\n    // `say` is first so it streams first.\n    say: str(\n      'What the tutor says now, in Markdown. Concise. End by putting the learner to work unless you are giving feedback on something they just did.',\n    ),\n    intent: enumOf(\n      ['diagnose', 'teach', 'demonstrate', 'probe', 'feedback', 'reteach', 'assess', 'advance', 'plan', 'wrap_up'],\n      'What this turn is doing in the teaching loop.',\n    ),\n    activity: {\n      anyOf: [\n        obj(\n          {\n            instructions: str('What the learner must do, in one line.'),\n            question: question,\n          },\n          'The thing the learner must now do.',\n        ),\n        { type: 'null' },\n      ],\n      description: 'A question or task for the learner, or null when this turn is pure feedback.',\n    },\n    blocks: arr(block, 'Explanation blocks for this turn. Keep to 0-3; this is a conversation, not a textbook.'),\n    focus_concept: str('The concept currently being worked on.'),\n    difficulty: num('Difficulty of the current activity, 1-5.', { minimum: 1, maximum: 5 }),\n    strategy_note: str('One line, for the learner, on why you are teaching it this way now. \"\" if not useful.'),\n    mastery_signal: enumOf(\n      ['unknown', 'not_yet', 'developing', 'competent', 'strong', 'mastered'],\n      'Your read on where they are with focus_concept right now.',\n    ),\n    suggestions: arr(\n      obj(\n        {\n          label: str('Button label, max 4 words.'),\n          action: enumOf(\n            ['harder', 'easier', 'practice_set', 'worksheet', 'quiz', 'explain_more', 'worked_example', 'next_concept', 'flashcards', 'study_guide', 'plan'],\n            'What the button should do.',\n          ),\n        },\n        'A next-step suggestion.',\n      ),\n      'At most 3 genuinely useful next steps.',\n    ),\n  },\n  'One turn from the tutor.',\n);\n\n/* ---------------------------------------------------------------- resources */\n\nexport const lessonSchema = obj(\n  {\n    title: str('Lesson title.'),\n    subject: str('Subject.'),\n    topic: str('Topic.'),\n    level: str('Who this is pitched at.'),\n    objectives: arr(str('A specific, checkable objective starting with a verb.'), '2-5 learning objectives.'),\n    concepts: arr(str('Concept name.'), 'Concepts covered, in teaching order.'),\n    difficulty: num('1-5.', { minimum: 1, maximum: 5 }),\n    estimated_minutes: int('Realistic reading + working time.'),\n    hook: str('2-3 sentences that make the learner want to know this. No throat-clearing.'),\n    blocks: arr(block, 'The lesson body. Build understanding in order.'),\n    checks: arr(question, '2-4 checkpoint questions embedded in the lesson.'),\n    common_mistakes: arr(\n      obj(\n        {\n          mistake: str('What learners get wrong.'),\n          why: str('The reasoning that leads them there.'),\n          fix: str('The correction, stated so it sticks.'),\n        },\n        'A predictable mistake.',\n      ),\n      '2-4 mistakes specific to this material.',\n    ),\n    summary: str('The lesson in 3-5 bullet lines of Markdown.'),\n    next_steps: arr(str('What to do next.'), '2-3 concrete next steps.'),\n  },\n  'A generated lesson.',\n);\n\nexport const practiceSchema = obj(\n  {\n    title: str('Title of the set.'),\n    kind: enumOf(\n      [\n        'practice_set', 'worksheet', 'quiz', 'test', 'homework', 'exam_prep', 'problem_set',\n        'diagnostic', 'mastery_check', 'review', 'project', 'lab', 'coding_exercise',\n        'essay_prompt', 'saq', 'dbq', 'leq',\n      ],\n      'What kind of assessment this is.',\n    ),\n    subject: str('Subject.'),\n    topic: str('Topic.'),\n    level: str('Level it is pitched at.'),\n    instructions: str('Instructions for the learner.'),\n    objectives: arr(str('Objective.'), 'What this set is measuring.'),\n    difficulty: num('Mean difficulty, 1-5.', { minimum: 1, maximum: 5 }),\n    estimated_minutes: int('Realistic completion time.'),\n    sections: arr(\n      obj(\n        {\n          title: str('Section title.'),\n          instructions: str('Section instructions, \"\" if none.'),\n          question_ids: arr(str('Question id in this section.'), 'Ids, in order.'),\n        },\n        'A section.',\n      ),\n      'Sections for multi-part worksheets/tests. Empty for a flat set.',\n    ),\n    questions: arr(question, 'The questions. Difficulty must rise across the set.'),\n    answer_key_note: str('Anything a grader needs to know beyond the per-question solutions. \"\" if nothing.'),\n  },\n  'A generated practice set, worksheet, quiz or test.',\n);\n\nexport const studyGuideSchema = obj(\n  {\n    title: str('Study guide title.'),\n    subject: str('Subject.'),\n    topic: str('Topic.'),\n    exam_context: str('What it is preparing them for, \"\" if general.'),\n    difficulty: num('1-5.', { minimum: 1, maximum: 5 }),\n    estimated_minutes: int('Time to work through it.'),\n    priorities: arr(\n      obj(\n        {\n          concept: str('Concept name.'),\n          why: str('Why it is this high on the list for THIS learner.'),\n          status: enumOf(['weak', 'shaky', 'solid'], 'Where they currently stand.'),\n        },\n        'A prioritised concept.',\n      ),\n      'Ordered by what will move their score most.',\n    ),\n    blocks: arr(block, 'Condensed explanations of the priority material.'),\n    key_terms: arr(\n      obj({ term: str('Term.'), definition: str('Definition in one or two lines.') }, 'A key term.'),\n      'Terms worth memorising.',\n    ),\n    formulas: arr(\n      obj({ name: str('Name.'), expression: str('LaTeX or plain expression.'), when: str('When to reach for it.') }, 'A formula.'),\n      'Formulas/rules. Empty if the subject has none.',\n    ),\n    self_test: arr(question, '4-8 self-test questions covering the priorities.'),\n    summary: str('Final revision checklist as Markdown bullets.'),\n  },\n  'A personalised study guide.',\n);\n\nexport const flashcardSchema = obj(\n  {\n    title: str('Deck title.'),\n    subject: str('Subject.'),\n    topic: str('Topic.'),\n    cards: arr(\n      obj(\n        {\n          id: str('Stable id.'),\n          front: str('Prompt side. A real retrieval cue, not a heading.'),\n          back: str('Answer side. Complete but tight.'),\n          hint: str('Hint, \"\" if none.'),\n          concept: str('Concept it belongs to.'),\n          difficulty: num('1-5.', { minimum: 1, maximum: 5 }),\n        },\n        'A flashcard.',\n      ),\n      'The deck. One idea per card.',\n    ),\n  },\n  'A generated flashcard deck.',\n);\n\nexport const planSchema = obj(\n  {\n    title: str('Plan title.'),\n    subject: str('Subject.'),\n    goal: str('The outcome this plan delivers.'),\n    horizon_days: int('Number of days the plan spans.'),\n    minutes_per_day: int('Assumed daily study time.'),\n    rationale: str('Why this ordering, in 2-4 sentences, referencing what they already know.'),\n    milestones: arr(\n      obj({ label: str('Milestone.'), day: int('Day index it lands on, 1-based.') }, 'A milestone.'),\n      'Checkpoints across the plan.',\n    ),\n    days: arr(\n      obj(\n        {\n          day: int('1-based day index.'),\n          focus: str('The single focus for the day.'),\n          concepts: arr(str('Concept name.'), 'Concepts touched.'),\n          minutes: int('Planned minutes.'),\n          activities: arr(\n            obj(\n              {\n                type: enumOf(\n                  ['lesson', 'practice_set', 'worksheet', 'quiz', 'test', 'review', 'flashcards', 'study_guide', 'mastery_check'],\n                  'Resource to generate for this activity.',\n                ),\n                title: str('Activity title.'),\n                detail: str('What the learner does and what \"done\" looks like.'),\n                minutes: int('Minutes for this activity.'),\n              },\n              'A single activity.',\n            ),\n            'Activities for the day, in order.',\n          ),\n          checkpoint: str('How they will know the day worked. \"\" if none.'),\n        },\n        'One day of the plan.',\n      ),\n      'The day-by-day plan.',\n    ),\n  },\n  'A multi-day learning plan.',\n);\n\n/* ---------------------------------------------------------------- grading */\n\nexport const gradeSchema = obj(\n  {\n    verdict: enumOf(['correct', 'partial', 'incorrect', 'unscorable'], 'Overall judgement.'),\n    score: num('Points earned.'),\n    max_score: num('Points available.'),\n    error_type: enumOf(\n      ['none', 'conceptual', 'prerequisite_gap', 'procedure', 'reasoning', 'transfer', 'vocabulary', 'memory', 'misread', 'calculation', 'careless', 'incomplete'],\n      'Why it was wrong. \"none\" when correct. Be precise — this drives what happens next.',\n    ),\n    misconception: str(\n      'The specific false belief or slipped step, stated in one line (\"treats velocity as a scalar\"). \"\" when correct.',\n    ),\n    what_went_right: str('What their work genuinely got right. \"\" only if nothing did.'),\n    feedback: str(\n      'Markdown feedback to the learner. Do NOT restate the full solution for a first wrong attempt — point at the exact step that broke and ask them to fix it.',\n    ),\n    reveal_solution: bool('True only when they have already had a real chance to self-correct.'),\n    rubric_scores: arr(\n      obj({ criterion: str('Criterion.'), earned: num('Points earned.'), note: str('Why.') }, 'Rubric line result.'),\n      'Per-criterion scores for rubric items. Empty otherwise.',\n    ),\n    concept: str('The concept this attempt is evidence about.'),\n    mastery_signal: enumOf(['not_yet', 'developing', 'competent', 'strong', 'mastered'], 'What this attempt shows.'),\n    next_move: enumOf(\n      ['advance', 'same_level', 'easier', 'reteach', 'backtrack_prerequisite', 'vary_surface', 'drill_step', 'timed_practice', 'move_on'],\n      'What the tutor should do next.',\n    ),\n  },\n  'Evaluation of one student answer.',\n);\n\n/* ------------------------------------------------------------------- QC */\n\nexport const qcSchema = obj(\n  {\n    verdict: enumOf(['pass', 'repair'], 'Whether the material is fit to show a learner.'),\n    summary: str('One line on the overall quality.'),\n    problems: arr(\n      obj(\n        {\n          question_id: str('Id of the offending question, \"\" if it is a whole-resource issue.'),\n          issue: enumOf(\n            ['wrong_answer', 'ambiguous', 'duplicate', 'off_level', 'off_topic', 'broken_math', 'unsupported_claim', 'no_correct_choice', 'multiple_correct', 'bad_explanation', 'factual_error'],\n            'What is wrong.',\n          ),\n          detail: str('What exactly is wrong.'),\n          corrected_answer: str('The answer that IS correct, if the answer key is wrong. \"\" otherwise.'),\n        },\n        'A defect.',\n      ),\n      'Every defect found. Empty when the material is clean.',\n    ),\n  },\n  'Quality-control review of generated material.',\n);\n\n/* -------------------------------------------------------------- insights */\n\nexport const insightsSchema = obj(\n  {\n    headline: str('One sentence the learner should read first. Specific, never generic praise.'),\n    patterns: arr(\n      obj(\n        {\n          observation: str('The pattern, quantified where possible.'),\n          evidence: str('What in their history supports it.'),\n          action: str('The single most useful thing to do about it.'),\n          concept: str('Concept it concerns, \"\" if cross-cutting.'),\n        },\n        'A detected pattern.',\n      ),\n      '0-4 patterns. Say nothing rather than something obvious.',\n    ),\n    recommended: arr(\n      obj(\n        {\n          title: str('What to do, as a button label.'),\n          kind: enumOf(\n            ['lesson', 'practice_set', 'worksheet', 'quiz', 'review', 'flashcards', 'study_guide', 'mastery_check'],\n            'Resource to generate.',\n          ),\n          topic: str('Exact topic for it.'),\n          why: str('Why this, now.'),\n          minutes: int('Expected minutes.'),\n        },\n        'A recommended next activity.',\n      ),\n      '1-3 recommendations, most valuable first.',\n    ),\n  },\n  'Proactive analysis of a learner’s history.',\n);\n\n/* ------------------------------------------------------- source analysis */\n\nexport const sourceSchema = obj(\n  {\n    title: str('What this document is.'),\n    subject: str('Subject.'),\n    topics: arr(str('Topic present in the document.'), 'Topics actually covered.'),\n    concepts: arr(\n      obj(\n        {\n          name: str('Concept name.'),\n          summary: str('What the document says about it, in one or two lines.'),\n          difficulty: num('1-5.', { minimum: 1, maximum: 5 }),\n        },\n        'A concept found in the source.',\n      ),\n      'Concepts extracted from the document, in document order.',\n    ),\n    level: str('Level the material is written at.'),\n    summary: str('A 3-5 sentence summary of the document.'),\n    suggested: arr(\n      obj(\n        {\n          kind: enumOf(['lesson', 'study_guide', 'practice_set', 'worksheet', 'quiz', 'test', 'flashcards', 'plan'], 'Resource kind.'),\n          title: str('Suggested title.'),\n          why: str('Why this is the useful thing to build from this document.'),\n        },\n        'A suggested resource.',\n      ),\n      '2-4 suggestions.',\n    ),\n  },\n  'Analysis of an uploaded learning source.',\n);\n\n/* --------------------------------------------------------------- courses */\n\nexport const courseSchema = obj(\n  {\n    title: str('Course title as a learner would name it.'),\n    exam: str('The exam it prepares for, e.g. \"AP Physics 1\". \"\" if there is no external exam.'),\n    subject: str('Subject.'),\n    level: str('Level, e.g. \"AP / first-year college\".'),\n    overview: str('3-4 sentences: what the course covers and what the exam actually rewards.'),\n    total_hours: int('Realistic total study hours from a standing start.'),\n    exam_format: obj(\n      {\n        total_minutes: int('Total exam length in minutes.'),\n        description: str('How the paper is structured and marked, in 2-3 sentences.'),\n        sections: arr(\n          obj(\n            {\n              name: str('Section name, e.g. \"Section I: Multiple Choice\".'),\n              question_type: enumOf(QUESTION_TYPES, 'Dominant question type in this section.'),\n              count: int('Number of questions.'),\n              minutes: int('Minutes allowed.'),\n              weight_percent: num('Percent of the total score this section carries.'),\n              notes: str('What this section actually tests, beyond content recall. \"\" if nothing to add.'),\n            },\n            'One exam section.',\n          ),\n          'The sections of the real paper, in order.',\n        ),\n      },\n      'The shape of the real exam.',\n    ),\n    score_bands: arr(\n      obj(\n        {\n          score: int('The reported score, e.g. 5.'),\n          min_percent: num('Minimum percent of the total that typically earns this score.'),\n          meaning: str('What this score means, in a few words.'),\n        },\n        'One score band.',\n      ),\n      'Score bands from highest to lowest. Use the exam’s real reporting scale (1-5 for AP, 1-7 for IB, a grade letter mapped to a number otherwise).',\n    ),\n    units: arr(\n      obj(\n        {\n          idx: int('1-based unit number, in teaching order.'),\n          title: str('Unit title.'),\n          summary: str('What this unit is about, in one or two sentences.'),\n          exam_weight_percent: num('Percent of the exam this unit is worth. Across all units these must sum to about 100.'),\n          hours: int('Study hours this unit realistically needs.'),\n          concepts: arr(\n            obj(\n              {\n                name: str('A single teachable concept, 1-5 words.'),\n                difficulty: num('1-5, the difficulty the exam asks this at.', { minimum: 1, maximum: 5 }),\n                criticality: enumOf(\n                  ['core', 'important', 'peripheral'],\n                  'core = the exam cannot be passed without it; peripheral = occasionally worth a mark.',\n                ),\n                prerequisites: arr(str('Concept name that must come first.'), 'Prerequisite concepts. Empty if none.'),\n              },\n              'A concept in this unit.',\n            ),\n            'Concepts, in teaching order.',\n          ),\n          exam_traps: arr(\n            obj({ trap: str('What examiners exploit here.'), fix: str('How to not fall for it.') }, 'An exam trap.'),\n            '1-3 traps specific to this unit. Empty if none are worth naming.',\n          ),\n        },\n        'One unit of the course.',\n      ),\n      'The whole course, in the order it should be taught.',\n    ),\n  },\n  'A complete course blueprint with its exam weighting.',\n);\n\nexport const RESOURCE_SCHEMAS = {\n  lesson: lessonSchema,\n  practice: practiceSchema,\n  study_guide: studyGuideSchema,\n  flashcards: flashcardSchema,\n  plan: planSchema,\n};\n","axiom:server/engine/validate.js":"/**\n * A small JSON-Sc
