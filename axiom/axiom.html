s.join('\\n');\n}\n\nexport function conceptContext(profile, names = []) {\n  const wanted = names.map((n) => String(n).toLowerCase());\n  return profile.concepts.filter((c) => wanted.includes(c.name.toLowerCase()));\n}\n","axiom:server/engine/mastery.js":"import { errorSeverity, needsReteach } from 'axiom:server/engine/errors.js';\n\nexport const MASTERY_LABELS = [\n  'Not introduced',\n  'Introduced',\n  'Developing',\n  'Competent',\n  'Strong',\n  'Mastered',\n];\n\n/**\n * The five things a learner has to be able to do before we are willing to call\n * a concept mastered. Reading a lesson only ever earns `introduced`.\n */\nexport const EVIDENCE_KINDS = ['recall', 'explain', 'solve', 'apply', 'transfer'];\n\nconst clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));\n\n/** Map a question to the kind of evidence a correct answer provides. */\nexport function evidenceKindFor(question = {}) {\n  const explicit = question.evidence;\n  if (EVIDENCE_KINDS.includes(explicit)) return explicit;\n  switch (question.type) {\n    case 'flashcard':\n    case 'fill_blank':\n      return 'recall';\n    case 'short_answer':\n    case 'free_response':\n    case 'essay':\n      return question.transfer ? 'transfer' : 'explain';\n    case 'numeric':\n    case 'multi_step':\n    case 'coding':\n      return 'solve';\n    case 'application':\n    case 'scenario':\n      return 'apply';\n    case 'multiple_choice':\n      return question.conceptual ? 'explain' : 'recall';\n    default:\n      return 'solve';\n  }\n}\n\n/**\n * Fold one graded attempt into a concept's evidence + continuous mastery score.\n * `attempt`: { ratio 0..1, difficulty 1..5, errorType, evidence }\n */\nexport function applyEvidence(concept, attempt) {\n  const evidence = { ...(concept.evidence || {}) };\n  const kind = attempt.evidence || 'solve';\n  const prior = evidence[kind] || { correct: 0, attempts: 0, bestDifficulty: 0 };\n  const isCorrect = attempt.ratio >= 0.8;\n\n  evidence[kind] = {\n    correct: prior.correct + (isCorrect ? 1 : 0),\n    attempts: prior.attempts + 1,\n    bestDifficulty: isCorrect ? Math.max(prior.bestDifficulty, attempt.difficulty) : prior.bestDifficulty,\n  };\n\n  // Difficulty-weighted EWMA: a hard question moves the estimate more.\n  const weight = clamp(0.18 + 0.07 * (attempt.difficulty - 1), 0.18, 0.46);\n  const target = clamp(attempt.ratio * (0.72 + 0.07 * attempt.difficulty), 0, 1);\n  const blended = (concept.mastery_score ?? 0) * (1 - weight) + target * weight;\n  // The penalty is applied after blending, so a broken mental model costs more\n  // than an arithmetic slip even when both scored zero.\n  const penalty = attempt.ratio >= 0.8 ? 0 : errorSeverity(attempt.errorType) * 0.25;\n  const score = clamp(blended - penalty, 0, 1);\n\n  const attempts = (concept.attempts ?? 0) + 1;\n  const correct = (concept.correct ?? 0) + (isCorrect ? 1 : 0);\n  const streak = isCorrect ? (concept.streak ?? 0) + 1 : 0;\n\n  return { ...concept, evidence, mastery_score: score, attempts, correct, streak };\n}\n\n/** Count evidence kinds demonstrated at or above a difficulty floor. */\nfunction demonstrated(evidence = {}, minDifficulty = 1) {\n  return EVIDENCE_KINDS.filter((k) => {\n    const e = evidence[k];\n    return e && e.correct > 0 && e.bestDifficulty >= minDifficulty;\n  });\n}\n\n/**\n * Derive the discrete 0..5 mastery level. Deliberately conservative: level 5\n * requires breadth of evidence, hard items, and retention over time.\n */\nexport function computeMasteryLevel(concept, { retentionOk = false, masteryCheckPassed = false } = {}) {\n  const attempts = concept.attempts ?? 0;\n  const score = concept.mastery_score ?? 0;\n  const introduced = concept.mastery_level >= 1 || attempts > 0;\n  if (!introduced) return 0;\n  if (attempts === 0) return 1;\n\n  const accuracy = attempts ? (concept.correct ?? 0) / attempts : 0;\n  const kinds = demonstrated(concept.evidence);\n  const hardKinds = demonstrated(concept.evidence, 4);\n  const canSolve = kinds.includes('solve') || kinds.includes('recall');\n  const canApply = kinds.includes('apply') || kinds.includes('transfer');\n  const canExplain = kinds.includes('explain');\n\n  if (\n    (masteryCheckPassed || (retentionOk && attempts >= 6)) &&\n    score >= 0.82 &&\n    accuracy >= 0.8 &&\n    canSolve &&\n    canApply &&\n    (canExplain || kinds.includes('transfer')) &&\n    hardKinds.length >= 1\n  ) {\n    return 5;\n  }\n  if (score >= 0.7 && accuracy >= 0.72 && attempts >= 4 && canSolve && (canApply || canExplain)) return 4;\n  if (score >= 0.55 && accuracy >= 0.6 && attempts >= 3 && canSolve) return 3;\n  if (score >= 0.3 || accuracy >= 0.4) return 2;\n  return 1;\n}\n\n/** Human-readable reason the learner is not yet at the next level. */\nexport function masteryGap(concept) {\n  const evidence = concept.evidence || {};\n  const missing = EVIDENCE_KINDS.filter((k) => !(evidence[k] && evidence[k].correct > 0));\n  const level = concept.mastery_level ?? 0;\n  if (level >= 5) return 'Mastered — retention checks only from here.';\n  if (level === 0) return 'Not started.';\n  const parts = [];\n  if (missing.includes('solve')) parts.push('solve a problem unaided');\n  if (missing.includes('explain')) parts.push('explain it in your own words');\n  if (missing.includes('apply')) parts.push('apply it in an unfamiliar context');\n  if (missing.includes('transfer')) parts.push('transfer it to a different problem type');\n  if (!parts.length) return 'Needs a harder item and a delayed retention check.';\n  return `Still to demonstrate: ${parts.join(', ')}.`;\n}\n\nexport { needsReteach };\n","axiom:server/engine/review.js":"/**\n * Spaced review. The stage ladder follows the classic expanding schedule\n * (learn → 1d → 3d → 7d → 14d → 30d) but each interval is scaled by an ease\n * factor that moves with demonstrated performance, so a shaky concept comes\n * back sooner and a solid one drifts further out.\n */\nconst LADDER = [0, 1, 3, 7, 14, 30, 60];\n\nexport const REVIEW_INTENT = [\n  'Learn',\n  'Quick review',\n  'Practice',\n  'Retrieval',\n  'Mixed application',\n  'Mastery check',\n  'Retention check',\n];\n\nconst clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));\nconst addDays = (from, days) => new Date(from.getTime() + days * 86400000);\n\n/**\n * @param concept current concept row\n * @param quality 0..1 how well the last review/attempt went\n */\nexport function scheduleReview(concept, quality, at = new Date()) {\n  const wasStage = concept.review_stage ?? 0;\n  let ease = concept.ease ?? 2.3;\n\n  if (quality >= 0.85) ease += 0.12;\n  else if (quality >= 0.6) ease += 0.02;\n  else if (quality >= 0.4) ease -= 0.15;\n  else ease -= 0.32;\n  ease = clamp(ease, 1.3, 3.0);\n\n  let stage;\n  if (quality < 0.5) stage = Math.max(0, wasStage - 1); // lapse: step back\n  else if (quality < 0.75) stage = wasStage; // hold\n  else stage = Math.min(LADDER.length - 1, wasStage + 1);\n\n  const base = LADDER[stage] || 1;\n  const days = stage === 0 ? 0.5 : clamp(base * (ease / 2.3), 0.5, 180);\n  return {\n    review_stage: stage,\n    ease,\n    interval_days: days,\n    next_review_at: addDays(at, days).toISOString(),\n    intent: REVIEW_INTENT[stage] || 'Retention check',\n  };\n}\n\n/** First scheduling right after a concept is taught. */\nexport function scheduleFirstReview(at = new Date()) {\n  return {\n    review_stage: 1,\n    ease: 2.3,\n    interval_days: 1,\n    next_review_at: addDays(at, 1).toISOString(),\n    intent: 'Quick review',\n  };\n}\n\nexport function reviewUrgency(concept, at = new Date()) {\n  if (!concept.next_review_at) return 0;\n  const due = new Date(concept.next_review_at).getTime();\n  const overdueDays = (at.getTime() - due) / 86400000;\n  if (overdueDays < 0) return 0;\n  const window = Math.max(1, concept.interval_days || 1);\n  return clamp(overdueDays / window, 0, 3);\n}\n\nexport function describeDue(concept, at = new Date()) {\n  if (!concept.next_review_at) return null;\n  const diffMs = new Date(concept.next_review_at).getTime() - at.getTime();\n  const days = Math.round(diffMs / 86400000);\n  if (diffMs <= 0) return days <= -1 ? `${Math.abs(days)}d overdue` : 'Due now';\n  if (days === 0) return 'Due today';\n  if (days === 1) return 'Due tomorrow';\n  return `Due in ${days}d`;\n}\n","axiom:public/js/markdown.js":"import { escapeHtml } from 'axiom:public/js/dom.js';\n\n/**\n * Compact Markdown renderer with LaTeX support.\n *\n * Code and maths are pulled out before any escaping happens, so a `<` inside a\n * code block or a `$...$` expression never gets mangled by the inline pass.\n */\n\nconst SLOT = (index) => `@@MD${index}@@`;\n\nfunction renderMath(source, display) {\n  if (window.katex) {\n    try {\n      return window.katex.renderToString(source, {\n        displayMode: display,\n        throwOnError: false,\n        strict: false,\n        trust: false,\n        output: 'html',\n      });\n    } catch {\n      /* fall through to plain text */\n    }\n  }\n  const cls = display ? 'math-fallback block' : 'math-fallback';\n  return `<span class=\"${cls}\"><code>${escapeHtml(source)}</code></span>`;\n}\n\nfunction inline(text) {\n  return text\n    .replace(/\\*\\*\\*([^*]+)\\*\\*\\*/g, '<strong><em>$1</em></strong>')\n    .replace(/\\*\\*([^*]+)\\*\\*/g, '<strong>$1</strong>')\n    .replace(/(^|[^*\\w])\\*([^*\\n]+)\\*(?=[^*\\w]|$)/g, '$1<em>$2</em>')\n    .replace(/(^|[^_\\w])_([^_\\n]+)_(?=[^_\\w]|$)/g, '$1<em>$2</em>')\n    .replace(/~~([^~]+)~~/g, '<del>$1</del>')\n    .replace(\n      /\\[([^\\]]+)\\]\\((https?:\\/\\/[^\\s)]+)\\)/g,\n      '<a href=\"$2\" target=\"_blank\" rel=\"noopener noreferrer\">$1</a>',\n    );\n}\n\nfunction tableFrom(lines) {\n  const cells = (line) => line.trim().replace(/^\\||\\|$/g, '').split('|').map((c) => c.trim());\n  const header = cells(lines[0]);\n  const rows = lines.slice(2).map(cells);\n  return [\n    '<table><thead><tr>',\n    header.map((c) => `<th>${inline(c)}</th>`).join(''),\n    '</tr></thead><tbody>',\n    rows\n      .map((row) => `<tr>${header.map((_, i) => `<td>${inline(row[i] ?? '')}</td>`).join('')}</tr>`)\n      .join(''),\n    '</tbody></table>',\n  ].join('');\n}\n\n// Nested render for blockquote bodies (placeholders are already extracted).\nfunction markdownInner(text) {\n  return text\n    .split(/\\n{2,}/)\n    .map((chunk) => `<p>${inline(chunk.replace(/\\n/g, ' '))}</p>`)\n    .join('');\n}\n\nexport function markdown(input) {\n  if (input == null) return '';\n  let text = String(input).replace(/\\r\\n/g, '\\n');\n\n  const slots = [];\n  const blockSlots = new Set();\n  const stash = (html, isBlock = false) => {\n    slots.push(html);\n    if (isBlock) blockSlots.add(slots.length - 1);\n    return SLOT(slots.length - 1);\n  };\n\n  // 1. fenced code\n  text = text.replace(/```([\\w+-]*)\\n?([\\s\\S]*?)```/g, (_, lang, code) =>\n    stash(\n      `<pre><code${lang ? ` class=\"language-${escapeHtml(lang)}\"` : ''}>${escapeHtml(\n        code.replace(/\\n$/, ''),\n      )}</code></pre>`,\n      true,\n    ),\n  );\n  // 2. maths (display first, then inline)\n  text = text\n    .replace(/\\$\\$([\\s\\S]+?)\\$\\$/g, (_, math) => stash(renderMath(math.trim(), true), true))\n    .replace(/\\\\\\[([\\s\\S]+?)\\\\\\]/g, (_, math) => stash(renderMath(math.trim(), true), true))\n    .replace(/\\\\\\(([\\s\\S]+?)\\\\\\)/g, (_, math) => stash(renderMath(math.trim(), false)))\n    .replace(/(?<![\\\\$\\w])\\$(?!\\s)((?:[^$\\n\\\\]|\\\\.)+?)(?<!\\s)\\$(?!\\d)/g, (_, math) =>\n      stash(renderMath(math.trim(), false)),\n    );\n  // 3. inline code\n  text = text.replace(/`([^`\\n]+)`/g, (_, code) => stash(`<code>${escapeHtml(code)}</code>`));\n\n  text = escapeHtml(text);\n\n  const lines = text.split('\\n');\n  const out = [];\n  let i = 0;\n\n  const isTable = (n) =>\n    lines[n]?.includes('|') && /^\\s*\\|?[\\s:-]*-[-\\s:|]*\\|/.test(lines[n + 1] || '');\n\n  while (i < lines.length) {\n    const line = lines[i];\n\n    if (!line.trim()) {\n      i++;\n      continue;\n    }\n\n    const heading = line.match(/^(#{1,6})\\s+(.*)$/);\n    if (heading) {\n      const level = Math.min(6, heading[1].length + 1);\n      out.push(`<h${level}>${inline(heading[2])}</h${level}>`);\n      i++;\n      continue;\n    }\n\n    if (/^\\s*([-*_])(\\s*\\1){2,}\\s*$/.test(line)) {\n      out.push('<hr>');\n      i++;\n      continue;\n    }\n\n    if (isTable(i)) {\n      const block = [];\n      while (i < lines.length && lines[i].includes('|')) block.push(lines[i++]);\n      out.push(tableFrom(block));\n      continue;\n    }\n\n    if (/^\\s*&gt;\\s?/.test(line)) {\n      const block = [];\n      while (i < lines.length && /^\\s*&gt;\\s?/.test(lines[i])) {\n        block.push(lines[i++].replace(/^\\s*&gt;\\s?/, ''));\n      }\n      out.push(`<blockquote>${markdownInner(block.join('\\n'))}</blockquote>`);\n      continue;\n    }\n\n    const bullet = line.match(/^(\\s*)([-*+])\\s+(.*)$/);\n    const ordered = line.match(/^(\\s*)(\\d+)[.)]\\s+(.*)$/);\n    if (bullet || ordered) {\n      const tag = ordered ? 'ol' : 'ul';\n      const pattern = ordered ? /^(\\s*)(\\d+)[.)]\\s+(.*)$/ : /^(\\s*)([-*+])\\s+(.*)$/;\n      const items = [];\n      while (i < lines.length) {\n        const match = lines[i].match(pattern);\n        if (match) {\n          items.push(inline(match[3]));\n          i++;\n        } else if (lines[i].trim() && /^\\s{2,}/.test(lines[i]) && items.length) {\n          items[items.length - 1] += ` ${inline(lines[i].trim())}`;\n          i++;\n        } else break;\n      }\n      out.push(`<${tag}>${items.map((item) => `<li>${item}</li>`).join('')}</${tag}>`);\n      continue;\n    }\n\n    const paragraph = [];\n    while (\n      i < lines.length &&\n      lines[i].trim() &&\n      !/^(#{1,6}\\s|\\s*[-*+]\\s|\\s*\\d+[.)]\\s|\\s*&gt;)/.test(lines[i]) &&\n      !isTable(i)\n    ) {\n      paragraph.push(lines[i++]);\n    }\n    if (paragraph.length) out.push(`<p>${inline(paragraph.join(' '))}</p>`);\n    else i++;\n  }\n\n  // A block-level stash (code fence, display maths) must not sit inside a <p>.\n  return out\n    .join('\\n')\n    .replace(/<p>(@@MD(\\d+)@@)<\\/p>/g, (match, token, index) =>\n      blockSlots.has(Number(index)) ? token : match,\n    )\n    .replace(/@@MD(\\d+)@@/g, (_, index) => slots[Number(index)] ?? '');\n}\n\n/** A <div class=\"prose\"> containing rendered markdown. */\nexport function prose(text, extraClass = '') {\n  const el = document.createElement('div');\n  el.className = `prose ${extraClass}`.trim();\n  el.innerHTML = markdown(text);\n  return el;\n}\n","axiom:public/js/render/blocks.js":"import { h } from 'axiom:public/js/dom.js';\nimport { icon } from 'axiom:public/js/icons.js';\nimport { prose } from 'axiom:public/js/markdown.js';\nimport { renderDiagram } from 'axiom:public/js/render/diagram.js';\n\nconst BLOCK_META = {\n  concept: { icon: 'brain', label: 'Concept' },\n  intuition: { icon: 'lightbulb', label: 'Intuition' },\n  analogy: { icon: 'puzzle', label: 'Analogy' },\n  example: { icon: 'zap', label: 'Worked example' },\n  steps: { icon: 'layers', label: 'Method' },\n  warning: { icon: 'alert', label: 'Watch out' },\n  misconception: { icon: 'alert', label: 'Common mistake' },\n  diagram: { icon: 'chart', label: 'Diagram' },\n  code: { icon: 'file', label: 'Code' },\n  table: { icon: 'library', label: 'Reference' },\n  summary: { icon: 'check', label: 'In short' },\n};\n\nexport function renderBlock(block) {\n  if (!block) return null;\n  const meta = BLOCK_META[block.kind] || BLOCK_META.concept;\n  const parts = [];\n\n  if (block.markdown?.trim()) parts.push(prose(block.markdown));\n\n  if (block.kind === 'steps' && block.steps?.length) {\n    parts.push(\n      h(\n        'ol.steps',\n        {},\n        ...block.steps.map((step, i) =>\n          h(\n            'li.step',\n            {},\n            h('span.step-num', {}, String(i + 1)),\n            h('div', {}, h('b', {}, step.title), step.detail ? prose(step.detail) : null),\n          ),\n        ),\n      ),\n    );\n  }\n\n  if (block.diagram) {\n    const figure = renderDiagram(block.diagram);\n    if (figure) parts.push(figure);\n  }\n\n  if (block.code?.source) {\n    parts.push(prose(['```' + (block.code.language || ''), block.code.source, '```'].join('\\n')));\n    if (block.code.explanation) parts.push(prose(block.code.explanation));\n  }\n\n  if (block.table?.columns?.length) {\n    parts.push(\n      h(\n        'div',\n        { style: { overflowX: 'auto' } },\n        h(\n          'table.cmp-table',\n          {},\n          h('thead', {}, h('tr', {}, ...block.table.columns.map((c) => h('th', {}, c)))),\n          h(\n            'tbody',\n            {},\n            ...(block.table.rows || []).map((row) =>\n              h('tr', {}, ...block.table.columns.map((_, i) => h('td', {}, row[i] ?? ''))),\n            ),\n          ),\n        ),\n      ),\n    );\n  }\n\n  if (!parts.length && !block.heading) return null;\n\n  return h(\n    `div.block.${block.kind || 'concept'}`,\n    {},\n    h('div.block-head', {}, icon(meta.icon, { size: 13 }), meta.label),\n    block.heading ? h('h4', {}, block.heading) : null,\n    ...parts,\n  );\n}\n\nexport function renderBlocks(blocks = []) {\n  const nodes = blocks.map(renderBlock).filter(Boolean);\n  return nodes.length ? h('div.stack', {}, ...nodes) : null;\n}\n\nexport function renderMistakes(mistakes = []) {\n  if (!mistakes.length) return null;\n  return h(\n    'div.stack',\n    {},\n    ...mistakes.map((m) =>\n      h(\n        'div.block.misconception',\n        {},\n        h('div.block-head', {}, icon('alert', { size: 13 }), 'Common mistake'),\n        h('h4', {}, m.mistake),\n        m.why ? prose(`**Why it happens.** ${m.why}`) : null,\n        m.fix ? prose(`**The fix.** ${m.fix}`) : null,\n      ),\n    ),\n  );\n}\n","axiom:public/js/render/question.js":"import { h, clear, autosize, titleCase } from 'axiom:public/js/dom.js';\nimport { icon } from 'axiom:public/js/icons.js';\nimport { prose } from 'axiom:public/js/markdown.js';\nimport { api } from 'axiom:public/js/api.js';\nimport { toast } from 'axiom:public/js/ui.js';\n\nconst ERROR_LABELS = {\n  conceptual: 'Conceptual gap',\n  prerequisite_gap: 'Prerequisite missing',\n  procedure: 'Procedure slip',\n  reasoning: 'Reasoning error',\n  transfer: 'Transfer failure',\n  vocabulary: 'Vocabulary gap',\n  memory: 'Memory lapse',\n  misread: 'Misread the question',\n  calculation: 'Calculation slip',\n  careless: 'Careless slip',\n  incomplete: 'Incomplete',\n  none: '',\n};\n\nconst VERDICT_ICON = { correct: 'checkCircle', partial: 'alert', incorrect: 'xCircle', unscorable: 'info' };\n\nconst OPEN_TYPES = new Set(['free_response', 'essay', 'proof', 'coding', 'scenario', 'short_answer']);\n\n/**\n * One interactive question.\n *\n * `mode: 'immediate'` grades the answer on its own (practice sets, lesson checks).\n * `mode: 'deferred'` collects the answer for a whole-paper submission.\n * `mode: 'callback'` hands the answer to the caller — used inside a tutoring\n *   session, where the answer must go back through the teaching loop so the\n *   tutor can respond to what it revealed.\n */\nexport function questionCard(question, options = {}) {\n  const {\n    index = null,\n    mode = 'immediate',\n    sessionId = null,\n    resourceId = null,\n    subject = 'General',\n    onGraded = null,\n    onStuck = null,\n    onHarder = null,\n    showConcept = true,\n  } = options;\n\n  let answer = '';\n  let attemptNumber = 1;\n  let hintsShown = 0;\n  let result = null;\n  let busy = false;\n  const startedAt = Date.now();\n\n  const root = h('article.question', { dataset: { qid: question.id } });\n  const hintHost = h('div.stack');\n  const feedbackHost = h('div');\n\n  /* ------------------------------------------------------------- answer UI */\n\n  const answerHost = h('div');\n  const choiceButtons = new Map();\n\n  function buildAnswerUI() {\n    clear(answerHost);\n    choiceButtons.clear();\n\n    if ((question.choices || []).length) {\n      const list = h('div.choices');\n      for (const choice of question.choices) {\n        const button = h(\n          'button.choice',\n          {\n            type: 'button',\n            onClick: () => {\n              if (result && mode === 'immediate') return;\n              answer = choice.key;\n              for (const [key, node] of choiceButtons) node.classList.toggle('selected', key === choice.key);\n              options.onChange?.(question.id, answer);\n              refreshActions();\n            },\n          },\n          h('span.choice-key', {}, choice.key),\n          h('span.choice-text', {}, choice.text),\n        );\n        choiceButtons.set(choice.key, button);\n        list.appendChild(button);\n      }\n      answerHost.appendChild(list);\n      return;\n    }\n\n    const isLong = OPEN_TYPES.has(question.type) || question.type === 'coding';\n    const field = isLong\n      ? h('textarea.textarea', {\n          rows: question.type === 'coding' ? 8 : 4,\n          placeholder:\n            question.type === 'coding'\n              ? 'Write your code…'\n              : 'Show your reasoning, not just the answer…',\n          style: question.type === 'coding' ? { fontFamily: 'var(--mono)', fontSize: '13px' } : {},\n        })\n      : h('input.input', {\n          type: 'text',\n          placeholder: question.units ? `Your answer (${question.units})` : 'Your answer…',\n          autocomplete: 'off',\n        });\n\n    field.addEventListener('input', () => {\n      answer = field.value;\n      options.onChange?.(question.id, answer);\n      refreshActions();\n    });\n    field.addEventListener('keydown', (event) => {\n      if (event.key === 'Enter' && !event.shiftKey && !isLong) {\n        event.preventDefault();\n        submit();\n      }\n    });\n    if (isLong) autosize(field, 340);\n    answerHost.appendChild(field);\n  }\n\n  /* ----------------------------------------------------------------- hints */\n\n  function showHint() {\n    const hints = question.hints || [];\n    if (hintsShown >= hints.length) {\n      if (onStuck) onStuck(question, hintsShown);\n      else toast('No more hints — try writing down what you do know.', 'info');\n      return;\n    }\n    const text = hints[hintsShown];\n    hintsShown++;\n    hintHost.appendChild(\n      h('div.hint-box.fade-up', {}, h('b', {}, `Hint ${hintsShown}`), prose(text)),\n    );\n    refreshActions();\n  }\n\n  /* ---------------------------------------------------------------- submit */\n\n  async function submit() {\n    if (busy) return;\n    if (!String(answer).trim()) {\n      toast('Put something down first — a wrong attempt is worth more than a blank.', 'info');\n      return;\n    }\n    if (mode === 'deferred') {\n      options.onChange?.(question.id, answer);\n      return;\n    }\n    if (mode === 'callback') {\n      busy = true;\n      refreshActions();\n      try {\n        await options.onSubmit?.(answer, controls);\n      } finally {\n        busy = false;\n        refreshActions();\n      }\n      return;\n    }\n\n    busy = true;\n    refreshActions();\n    try {\n      const outcome = await api.gradeAnswer({\n        question,\n        answer,\n        sessionId,\n        resourceId,\n        attemptNumber,\n        elapsedMs: Date.now() - startedAt,\n        subject,\n      });\n      applyResult(outcome);\n      onGraded?.(outcome, question);\n    } catch (err) {\n      toast(err.message || 'Could not grade that answer.', 'error');\n    } finally {\n      busy = false;\n      refreshActions();\n    }\n  }\n\n  function applyResult(outcome) {\n    result = outcome;\n    const grade = outcome.grade;\n    root.classList.add('answered', grade.verdict);\n    if (question.choices?.length) {\n      for (const [key, node] of choiceButtons) {\n        node.disabled = true;\n        const isKeyed = key === String(question.answer).trim().toUpperCase();\n        if (isKeyed && (grade.verdict !== 'incorrect' || grade.reveal_solution)) node.classList.add('is-correct');\n        if (key === answer && grade.verdict === 'incorrect') node.classList.add('is-wrong');\n      }\n    }\n    renderFeedback(outcome);\n    refreshActions();\n  }\n\n  function renderFeedback(outcome) {\n    const grade = outcome.grade;\n    const errorLabel = ERROR_LABELS[grade.error_type] || '';\n    const mastery = outcome.concept;\n\n    clear(feedbackHost).appendChild(\n      h(\n        'div.feedback.fade-up',\n        {},\n        h(\n          'div.feedback-head',\n          {},\n          h(\n            'span',\n            { class: `verdict ${grade.verdict}` },\n            icon(VERDICT_ICON[grade.verdict] || 'info', { size: 15 }),\n            grade.verdict === 'correct' ? 'Correct' : grade.verdict === 'partial' ? 'Partly right' : grade.verdict === 'unscorable' ? 'Not scored' : 'Not right yet',\n          ),\n          h('span.tiny.dim', {}, `${grade.score}/${grade.max_score}`),\n          h(\n            'div.feedback-tags',\n            {},\n            errorLabel ? h('span.chip.amber', {}, errorLabel) : null,\n            mastery?.name\n              ? h('span.chip', {}, mastery.mastery_label ? `${mastery.name} · ${mastery.mastery_label}` : mastery.name)\n              : null,\n          ),\n        ),\n        grade.what_went_right ? prose(`**What worked.** ${grade.what_went_right}`) : null,\n        grade.misconception ? h('p.tiny', { style: { color: 'var(--amber)' } }, `You are ${grade.misconception}.`) : null,\n        prose(grade.feedback),\n        grade.rubric_scores?.length\n          ? h(\n              'div.stack',\n              { style: { gap: '4px' } },\n              ...grade.rubric_scores.map((r) =>\n                h(\n                  'div.spread.tiny',\n                  {},\n                  h('span', {}, r.criterion),\n                  h('span.dim', {}, `${r.earned} — ${r.note}`),\n                ),\n              ),\n            )\n          : null,\n        grade.reveal_solution || grade.verdict === 'correct'\n          ? h(\n              'details.solution',\n              {},\n              h('summary', {}, 'Full solution'),\n              prose(question.solution),\n            )\n          : null,\n      ),\n    );\n  }\n\n  /* --------------------------------------------------------------- actions */\n\n  const actionHost = h('div.q-actions');\n\n  function refreshActions() {\n    clear(actionHost);\n    const hintsLeft = (question.hints || []).length - hintsShown;\n    const answered = Boolean(result);\n    const wrong = answered && result.grade.verdict !== 'correct';\n\n    if (!answered && mode !== 'deferred') {\n      if (hintsLeft > 0 || onStuck) {\n        actionHost.appendChild(\n          h('button.btn.sm', { type: 'button', onClick: showHint }, icon('help', { size: 13 }), hintsShown ? 'Bigger hint' : \"I'm stuck\"),\n        );\n      }\n      actionHost.appendChild(\n        h(\n          'button.btn.primary.sm',\n          { type: 'button', disabled: busy || !String(answer).trim(), onClick: submit },\n          busy ? h('span.spinner') : icon('check', { size: 13 }),\n          busy ? 'Checking…' : options.submitLabel || 'Check my answer',\n        ),\n      );\n      return;\n    }\n\n    if (wrong && attemptNumber < 3) {\n      actionHost.appendChild(\n        h(\n          'button.btn.sm',\n          {\n            type: 'button',\n            onClick: () => {\n              attemptNumber++;\n              result = null;\n              answer = '';\n              root.classList.remove('answered', 'correct', 'incorrect', 'partial');\n              clear(feedbackHost);\n              buildAnswerUI();\n              refreshActions();\n            },\n          },\n          icon('refresh', { size: 13 }),\n          'Try again',\n        ),\n      );\n    }\n    if (answered && onHarder) {\n      actionHost.appendChild(\n        h('button.btn.sm' = false;\n              draw();\n            },\n          },\n          icon('check', { size: 14 }),\n          'I knew it',\n        ),\n      ),\n    );\n  }\n\n  draw();\n  return root;\n}\n\n/* -------------------------------------------------------------------- plan */\n\nfunction renderPlan(payload, resource, context) {\n  const root = h('div.stack', { style: { gap: '20px' } });\n  root.appendChild(head(payload, resource));\n\n  if (payload.milestones?.length) {\n    root.appendChild(\n      h(\n        'div.row.wrap',\n        {},\n        ...payload.milestones.map((m) => h('span.chip.accent', {}, `Day ${m.day}: ${m.label}`)),\n      ),\n    );\n  }\n\n  root.appendChild(\n    h(\n      'div.stack',\n      { style: { gap: '18px' } },\n      ...(payload.days || []).map((day) =>\n        h(\n          'div.plan-day.plan-line',\n          {},\n          h('div.plan-daymark', {}, h('b', {}, String(day.day)), h('span', {}, 'day')),\n          h(\n            'div.plan-card',\n            {},\n            h(\n              'div.spread',\n              {},\n              h('b', { style: { fontSize: '14.5px' } }, day.focus),\n              h('span.chip', {}, `${day.minutes} min`),\n            ),\n            day.concepts?.length ? h('div.row.wrap', {}, ...day.concepts.map((c) => h('span.chip', {}, c))) : null,\n            ...(day.activities || []).map((activity) =>\n              h(\n                'div.plan-activity',\n                {},\n                h('span.chip.accent', {}, resourceLabel(activity.type)),\n                h('div', {}, h('b', {}, activity.title), h('p', {}, activity.detail)),\n                h(\n                  'button.btn.sm',\n                  {\n                    type: 'button',\n                    onClick: () =>\n                      context?.onGenerateMore?.(activity.type, activity.title, {\n                        minutes: activity.minutes,\n                        concepts: day.concepts,\n                        instructions: activity.detail,\n                      }),\n                  },\n                  icon('wand', { size: 13 }),\n                  'Build it',\n                ),\n              ),\n            ),\n            day.checkpoint ? h('p.tiny.muted', {}, `Checkpoint: ${day.checkpoint}`) : null,\n          ),\n        ),\n      ),\n    ),\n  );\n  return root;\n}\n\n/* ------------------------------------------------------------------ router */\n\nexport function renderResource(resource, context = {}) {\n  const payload = resource.payload || resource;\n  const kind = resource.kind || payload.kind;\n\n  if (kind === 'lesson') return renderLesson(payload, resource, context);\n  if (kind === 'study_guide') return renderStudyGuide(payload, resource, context);\n  if (kind === 'flashcards') return renderFlashcards(payload, resource, context);\n  if (kind === 'plan') return renderPlan(payload, resource, context);\n  return renderPractice(payload, resource, context);\n}\n\n/** A lightweight preview used while a resource is still streaming in. */\nexport function renderPreview(partial) {\n  const root = h('div.stack', { style: { gap: '14px' } });\n  if (partial.title) root.appendChild(h('h1.serif', { style: { fontSize: '26px', letterSpacing: '-0.02em' } }, partial.title));\n  if (partial.hook) root.appendChild(prose(partial.hook));\n  if (partial.instructions) root.appendChild(prose(partial.instructions));\n  if (partial.rationale) root.appendChild(prose(partial.rationale));\n\n  const blocks = renderBlocks((partial.blocks || []).slice(0, 4));\n  if (blocks) root.appendChild(blocks);\n\n  const questions = partial.questions || partial.self_test || partial.checks || [];\n  if (questions.length) {\n    root.appendChild(\n      h(\n        'div.stack',\n        { style: { gap: '8px' } },\n        h('p.tiny.dim', {}, `${questions.length} question${questions.length > 1 ? 's' : ''} written so far…`),\n        ...questions.slice(-3).map((q) => h('div.block', {}, prose(q.prompt || '…'))),\n      ),\n    );\n  }\n  if (partial.cards?.length) {\n    root.appendChild(h('p.tiny.dim', {}, `${partial.cards.length} cards written…`));\n  }\n  if (partial.days?.length) {\n    root.appendChild(\n      h('div.stack', { style: { gap: '6px' } }, ...partial.days.map((d) => h('div.list-item', {}, h('div', {}, h('b', {}, `Day ${d.day}`), h('span', {}, d.focus || ''))))),\n    );\n  }\n  return root;\n}\n\nexport { masteryPips };\n","axiom:browser/anthropic.js":"import { config } from 'axiom:browser/config.js';\nimport { logger } from 'axiom:server/util/log.js';\nimport { parsePartialJson } from 'axiom:server/llm/partial-json.js';\n\nconst log = logger('llm');\n\n/**\n * Browser replacement for server/llm/anthropic.js.\n *\n * Same surface — { name, model, run } and LLMError — implemented directly on\n * fetch instead of the Node SDK, because there is no server in this build. The\n * `anthropic-dangerous-direct-browser-access` header is what makes the API\n * answer a cross-origin request from a page; it is the supported way to call\n * the API with a key the person using the page owns.\n */\n\nconst API_VERSION = '2023-06-01';\nconst sleep = (ms) => new Promise((r) => setTimeout(r, ms));\n\n/** Bound concurrent upstream calls so a burst of panels cannot trip rate limits. */\nclass Semaphore {\n  constructor(limit) {\n    this.limit = limit;\n    this.active = 0;\n    this.queue = [];\n  }\n  async acquire() {\n    if (this.active < this.limit) {\n      this.active++;\n      return;\n    }\n    await new Promise((resolve) => this.queue.push(resolve));\n    this.active++;\n  }\n  release() {\n    this.active--;\n    const next = this.queue.shift();\n    if (next) next();\n  }\n}\n\nconst gate = new Semaphore(config.concurrency || 4);\n\nexport class LLMError extends Error {\n  constructor(message, { status, retryable, cause, headers } = {}) {\n    super(message);\n    this.name = 'LLMError';\n    this.status = status;\n    this.retryable = Boolean(retryable);\n    this.cause = cause;\n    this.headers = headers;\n  }\n}\n\n/** Turn an HTTP failure into the same shape the server provider produces. */\nasync function httpError(res) {\n  let detail = '';\n  try {\n    const body = await res.json();\n    detail = body?.error?.message || body?.message || '';\n  } catch {\n    detail = await res.text().catch(() => '');\n  }\n\n  const opts = { status: res.status, headers: res.headers };\n  switch (res.status) {\n    case 401:\n      return new LLMError('That API key was rejected. Check it, or paste a new one.', opts);\n    case 403:\n      return new LLMError('This API key is not permitted to use the configured model.', opts);\n    case 404:\n      return new LLMError(`Model \"${config.model}\" was not found for this key.`, opts);\n    case 400:\n      return new LLMError(`The model rejected the request: ${detail || 'bad request'}`, opts);\n    case 429:\n      return new LLMError('The model is rate limited right now. Retrying shortly.', {\n        ...opts,\n        retryable: true,\n      });\n    case 529:\n      return new LLMError('The model is overloaded. Retrying shortly.', { ...opts, retryable: true });\n    default:\n      return new LLMError(\n        `Model API error ${res.status}${detail ? `: ${detail}` : ''}`,\n        { ...opts, retryable: res.status >= 500 },\n      );\n  }\n}\n\nfunction retryDelay(attempt, err) {\n  const header = err?.headers?.get?.('retry-after');\n  const fromHeader = header ? Number(header) * 1000 : 0;\n  const backoff = Math.min(16000, 900 * 2 ** attempt);\n  const jitter = Math.random() * 350;\n  return Math.max(fromHeader, backoff) + jitter;\n}\n\nfunction normaliseSystem(system) {\n  const blocks = Array.isArray(system) ? system : [{ text: String(system || '') }];\n  return blocks\n    .filter((b) => b.text && b.text.trim())\n    .map((b, i, arr) => ({\n      type: 'text',\n      text: b.text,\n      // Cache the stable prefix (everything but the final, per-request block).\n      ...(b.cache || (i < arr.length - 1 && arr.length > 1 && b.cache !== false)\n        ? { cache_control: { type: 'ephemeral' } }\n        : {}),\n    }));\n}\n\n/** Read a Messages API SSE body, feeding text deltas out as they land. */\nasync function readStream(res, onDelta) {\n  const reader = res.body.getReader();\n  const decoder = new TextDecoder();\n  let buffer = '';\n  const final = { stop_reason: null, stop_details: null, usage: {}, model: config.model };\n\n  for (;;) {\n    const { value, done } = await reader.read();\n    if (done) break;\n    buffer += decoder.decode(value, { stream: true });\n\n    let boundary;\n    while ((boundary = buffer.indexOf('\\n\\n')) !== -1) {\n      const raw = buffer.slice(0, boundary);\n      buffer = buffer.slice(boundary + 2);\n      if (!raw.trim() || raw.startsWith(':')) continue;\n\n      const dataLines = [];\n      for (const line of raw.split('\\n')) {\n        if (line.startsWith('data:')) dataLines.push(line.slice(5).trim());\n      }\n      if (!dataLines.length) continue;\n\n      let event;\n      try {\n        event = JSON.parse(dataLines.join('\\n'));\n      } catch {\n        continue;\n      }\n\n      switch (event.type) {\n        case 'message_start':\n          final.model = event.message?.model || final.model;\n          Object.assign(final.usage, event.message?.usage || {});\n          break;\n        case 'content_block_delta':\n          // Thinking deltas are not part of the answer and must not be parsed\n          // as if they were the JSON document being built.\n          if (event.delta?.type === 'text_delta') onDelta(event.delta.text || '');\n          break;\n        case 'message_delta':\n          if (event.delta?.stop_reason) final.stop_reason = event.delta.stop_reason;\n          if (event.delta?.stop_details) final.stop_details = event.delta.stop_details;\n          Object.assign(final.usage, event.usage || {});\n          break;\n        case 'error':\n          throw new LLMError(event.error?.message || 'The model stream failed.', {\n            status: 502,\n            retryable: true,\n          });\n        default:\n          break;\n      }\n    }\n  }\n\n  return final;\n}\n\nexport function createAnthropicProvider() {\n  /**\n   * One streamed request. Returns { text, object, usage, stopReason }.\n   * When `schema` is given the model is constrained to that JSON schema and the\n   * partially-received document is handed to `onPartial` as it arrives.\n   */\n  async function once(opts) {\n    const {\n      system,\n      messages,\n      schema,\n      effort = 'high',\n      maxTokens = 16000,\n      onPartial,\n      onText,\n      signal,\n      label = 'call',\n    } = opts;\n\n    const body = {\n      model: config.model,\n      max_tokens: maxTokens,\n      system: normaliseSystem(system),\n      messages,\n      stream: true,\n      output_config: {\n        effort,\n        ...(schema ? { format: { type: 'json_schema', schema } } : {}),\n      },\n    };\n\n    const controller = new AbortController();\n    const timeout = setTimeout(() => controller.abort(), config.requestTimeoutMs);\n    if (signal) signal.addEventListener('abort', () => controller.abort(), { once: true });\n\n    const started = Date.now();\n    let text = '';\n    let lastPush = 0;\n    let lastPartial;\n\n    try {\n      const res = await fetch(`${config.baseURL}/v1/messages`, {\n        method: 'POST',\n        headers: {\n          'content-type': 'application/json',\n          'x-api-key': config.apiKey,\n          'anthropic-version': API_VERSION,\n          'anthropic-dangerous-direct-browser-access': 'true',\n        },\n        body: JSON.stringify(body),\n        signal: controller.signal,\n      });\n\n      if (!res.ok) throw await httpError(res);\n      if (!res.body) throw new LLMError('This browser cannot stream responses.', { status: 500 });\n\n      const final = await readStream(res, (delta) => {\n        text += delta;\n        if (onText) onText(delta, text);\n        if (!onPartial) return;\n        const at = Date.now();\n        if (at - lastPush < 55) return; // throttle re-parses of a growing document\n        lastPush = at;\n        const obj = parsePartialJson(text);\n        if (obj !== undefined) {\n          lastPartial = obj;\n          onPartial(obj, text);\n        }\n      });\n\n      if (final.stop_reason === 'refusal') {\n        throw new LLMError(\n          `The model declined this request${final.stop_details?.category ? ` (${final.stop_details.category})` : ''}.`,\n          { status: 422 },\n        );\n      }\n      if (final.stop_reason === 'max_tokens') {\n        log.warn(`${label}: hit max_tokens (${maxTokens}) — output may be truncated`);\n      }\n\n      let object;\n      if (schema) {\n        try {\n          object = JSON.parse(text);\n        } catch {\n          object = parsePartialJson(text);\n          if (object === undefined) {\n            throw new LLMError('The model returned malformed JSON.', { status: 502, retryable: true });\n          }\n          log.warn(`${label}: repaired truncated JSON`);\n        }\n        if (onPartial && object !== lastPartial) onPartial(object, text);\n      }\n\n      log.debug(\n        `${label} ok in ${Date.now() - started}ms · in=${final.usage.input_tokens ?? '?'} out=${final.usage.output_tokens ?? '?'} cached=${final.usage.cache_read_input_tokens ?? 0}`,\n      );\n\n      return { text, object, usage: final.usage, stopReason: final.stop_reason, model: final.model };\n    } catch (err) {\n      if (err instanceof LLMError) throw err;\n      if (err?.name === 'AbortError') {\n        throw new LLMError('The request timed out.', { status: 504, retryable: true, cause: err });\n      }\n      // A TypeError from fetch here is a network or CORS failure, not a bug in\n      // the request: say so rather than surfacing \"Failed to fetch\".\n      throw new LLMError('Could not reach the model API. Check your connection.', {\n        status: 502,\n        retryable: true,\n        cause: err,\n      });\n    } finally {\n      clearTimeout(timeout);\n    }\n  }\n\n  async function run(opts) {\n    if (!config.apiKey) {\n      throw new LLMError('No API key yet. Add one to start — Axiom keeps it in this browser only.', {\n        status: 503,\n      });\n    }\n    await gate.acquire();\n    try {\n      let attempt = 0;\n      for (;;) {\n        try {\n          return await once(opts);\n        } catch (err) {\n          if (!err.retryable || attempt >= config.maxRetries) throw err;\n          const wait = retryDelay(attempt, err);\n          log.warn(\n            `${opts.label || 'call'}: ${err.message} — retry ${attempt + 1}/${config.maxRetries} in ${Math.round(wait)}ms`,\n          );\n          await sleep(wait);\n          attempt++;\n        }\n      }\n    } finally {\n      gate.release();\n    }\n  }\n\n  return { name: 'anthropic', model: config.model, run };\n}\n","axiom:server/llm/mock.js":"/**\n * TEST-ONLY deterministic provider.\n *\n * This is not a fallback and it never serves normal traffic: the server refuses\n * to start with it unless AXIOM_LLM_PROVIDER=mock is set explicitly. It exists\n * so the automated suite can drive the *real* application code — routing,\n * schema validation, quality control, grading, mastery updates, spaced review,\n * rendering — end to end without network access. It synthesises objects from\n * the same JSON schemas the live model is constrained to.\n */\nimport { logger } from 'axiom:server/util/log.js';\n\nconst log = logger('llm:mock');\n\nfunction hash(str) {\n  let h = 2166136261;\n  for (let i = 0; i < str.length; i++) {\n    h ^= str.charCodeAt(i);\n    h = Math.imul(h, 16777619);\n  }\n  return Math.abs(h);\n}\n\nconst WORDS = ['vector', 'gradient', 'balance', 'inverse', 'system', 'ratio', 'boundary', 'transfer'];\n\nfunction promptText(messages) {\n  return messages\n    .map((m) => (typeof m.content === 'string' ? m.content : (m.content || []).map((c) => c.text || '').join(' ')))\n    .join('\\n');\n}\n\nfunction pickEnum(values, key, text, seed) {\n  const lower = text.toLowerCase();\n  // Prefer an enum value the prompt actually mentions, so routing is meaningful.\n  const mentioned = values.filter((v) => lower.includes(v.replace(/_/g, ' ')) || lower.includes(v));\n  if (mentioned.length) return mentioned[0];\n  if (key === 'verdict') return lower.includes('quality gate') ? 'pass' : 'correct';\n  return values[seed % values.length];\n}\n\nfunction makeString(key, ctx) {\n  const topic = ctx.topic;\n  const n = ctx.seed % WORDS.length;\n  switch (key) {\n    case 'id':\n      return `${ctx.arrayKey === 'cards' ? 'c' : 'q'}${ctx.index + 1}`;\n    case 'key':\n      return ['A', 'B', 'C', 'D'][ctx.index % 4];\n    case 'answer':\n      return ctx.questionType === 'multiple_choice' || ctx.questionType === 'true_false' ? 'B' : '42';\n    case 'concept':\n      return ctx.concepts[ctx.index % ctx.concepts.length] || topic;\n    case 'criticality':\n      return 'core';\n    case 'name':\n      if (ctx.arrayKey === 'concepts') return `${topic} u${(ctx.unitIndex ?? 0) + 1}c${ctx.index + 1}`;\n      if (ctx.arrayKey === 'sections') return `Section ${ctx.index + 1}`;\n      return `${topic} ${key} ${ctx.index + 1}`;\n    case 'topic':\n      return topic;\n    case 'subject':\n      return ctx.subject;\n    case 'title':\n      if (ctx.arrayKey === 'units') return `${topic} unit ${ctx.index + 1}`;\n      if (ctx.arrayKey === 'score_bands') return `Band ${5 - ctx.index}`;\n      return `${topic} — ${['core ideas', 'practice', 'checkpoint'][ctx.index % 3]}`;\n    case 'prompt':\n      return `Working with ${topic}: determine the ${WORDS[n]} for item ${ctx.index + 1}.`;\n    case 'solution':\n      return `Start from the definition of ${topic}. Apply it step by step; the result is 42.`;\n    case 'markdown':\n    case 'feedback':\n    case 'detail':\n    case 'summary':\n    case 'say':\n      return `Here is what matters about ${topic}: the ${WORDS[n]} determines the result. Now try it yourself.`;\n    case 'text':\n      return `Option ${['A', 'B', 'C', 'D'][ctx.index % 4]} for ${topic}`;\n    case 'units':\n      return '';\n    case 'context':\n    case 'assumption':\n    case 'diagnostic_reason':\n    case 'strategy_note':\n    case 'exam_context':\n    case 'answer_key_note':\n    case 'hint':\n      return '';\n    default:\n      return `${key.replace(/_/g, ' ')} for ${topic}`;\n  }\n}\n\nfunction makeNumber(key, ctx) {\n  switch (key) {\n    case 'difficulty':\n      return ctx.difficulty;\n    case 'points':\n    case 'max_score':\n      return 1;\n    case 'earned':\n      return ctx.correct ? 1 : 0;\n    case 'estimated_seconds':\n      return 90;\n    case 'estimated_minutes':\n    case 'minutes':\n    case 'minutes_per_day':\n      return ctx.minutes;\n    case 'time_minutes':\n      return ctx.minutes;\n    case 'horizon_days':\n    case 'days':\n      return ctx.days;\n    case 'day':\n      return ctx.index + 1;\n    case 'value':\n      return (ctx.index + 1) * 10;\n    case 'exam_weight_percent':\n      return 25;\n    case 'weight_percent':\n      return 50;\n    case 'score':\n      // Score bands descend 5..1 so band lookup has a real ladder to walk.\n      return ctx.arrayKey === 'score_bands' ? 5 - ctx.index : ctx.correct ? 1 : 0;\n    case 'min_percent':\n      return [72, 58, 44, 30, 0][ctx.index] ?? 0;\n    case 'hours':\n      return 8;\n    case 'total_hours':\n      return 40;\n    case 'total_minutes':\n      return 90;\n    case 'idx':\n      return ctx.index + 1;\n    case 'tolerance':\n      return 0.01;\n    default:\n      return ctx.index + 1;\n  }\n}\n\nfunction makeBoolean(key, ctx) {\n  switch (key) {\n    case 'needs_diagnostic':\n      return ctx.text.toLowerCase().includes('diagnos');\n    case 'reveal_solution':\n      return ctx.attemptNumber >= 3;\n    default:\n      return false;\n  }\n}\n\nfunction arrayLength(key, schema, ctx) {\n  if (key === 'units') return 4;\n  if (key === 'score_bands') return 5;\n  // Only the exam-format sections (which name a question type); a practice\n  // set's sections reference question ids the synthesiser cannot invent.\n  if (key === 'sections') return schema?.items?.properties?.question_type ? 2 : 0;\n  if (key === 'exam_traps' || key === 'prerequisites') return 0;\n  if (key === 'questions' || key === 'cards' || key === 'self_test') return ctx.count;\n  if (key === 'days') return ctx.days;\n  if (key === 'choices') return ctx.questionType === 'true_false' ? 2 : 4;\n  if (key === 'problems') return 0;\n  if (key === 'sections' || key === 'rubric' || key === 'accepted' || key === 'rows' || key === 'columns') return 0;\n  if (key === 'nodes' || key === 'edges' || key === 'items' || key === 'series' || key === 'points') return 0;\n  if (key === 'blocks' || key === 'checks' || key === 'steps') return 2;\n  if (key === 'concepts') return ctx.arrayKey === 'units' || schema?.items?.type === 'object' ? 3 : Math.min(3, ctx.concepts.length);\n  return 2;\n}\n\nfunction synth(schema, key, ctx) {\n  if (!schema) return null;\n  if (schema.anyOf) {\n    const objectBranch = schema.anyOf.find((s) => s.type === 'object');\n    const populate = ['activity'].includes(key);\n    return populate && objectBranch ? synth(objectBranch, key, ctx) : null;\n  }\n  const types = Array.isArray(schema.type) ? schema.type : [schema.type];\n  if (types.includes('null') && ['tolerance', 'clarifying_question'].includes(key)) return null;\n\n  if (schema.enum) {\n    if (key === 'error_type') return ctx.correct ? 'none' : 'conceptual';\n    if (key === 'verdict' && ctx.grading) return ctx.correct ? 'correct' : 'incorrect';\n    if (key === 'type' && ctx.arrayKey === 'questions') return ctx.questionType;\n    return pickEnum(schema.enum, key, ctx.text, ctx.seed + ctx.index);\n  }\n  if (types.includes('object')) {\n    const out = {};\n    for (const [prop, sub] of Object.entries(schema.properties || {})) {\n      out[prop] = synth(sub, prop, ctx);\n    }\n    return out;\n  }\n  if (types.includes('array')) {\n    const len = arrayLength(key, schema, ctx);\n    const out = [];\n    for (let i = 0; i < len; i++) {\n      out.push(\n        synth(schema.items, key, {\n          ...ctx,\n          index: i,\n          arrayKey: key,\n          // Concepts are nested inside units, so the unit index has to survive\n          // the descent or every unit ends up with identically-named concepts.\n          unitIndex: key === 'units' ? i : ctx.unitIndex,\n        }),\n      );\n    }\n    return out;\n  }\n  if (types.includes('number') || types.includes('integer')) {\n    const value = makeNumber(key, ctx);\n    return types.includes('integer') ? Math.round(value) : value;\n  }\n  if (types.includes('boolean')) return makeBoolean(key, ctx);\n  return makeString(key, ctx);\n}\n\nfunction contextFrom(opts) {\n  const text = promptText(opts.messages || []);\n  const seed = hash(text);\n  const topicMatch = text.match(/Topic:\\s*(.+)/);\n  const subjectMatch = text.match(/Subject:\\s*(.+)/);\n  const countMatch = text.match(/Question count:\\s*(\\d+)|Card count:\\s*(\\d+)/);\n  const difficultyMatch = text.match(/Difficulty:\\s*([\\d.]+)/);\n  const minutesMatch = text.match(/(?:Time available|Minutes per day):\\s*(\\d+)/);\n  const daysMatch = text.match(/Days available:\\s*(\\d+)/);\n  const conceptsMatch = text.match(/Focus concepts:\\s*(.+)/);\n  const attemptMatch = text.match(/attempt=\"(\\d+)\"/);\n  const typeMatch = text.match(/^Type:\\s*(\\w+)/m);\n\n  const answer = (text.match(/<student_answer[^>]*>([\\s\\S]*?)<\\/student_answer>/) || [])[1] || '';\n\n  return {\n    text,\n    seed,\n    index: 0,\n    arrayKey: '',\n    topic: (topicMatch?.[1] || 'the topic').trim().slice(0, 60),\n    subject: (subjectMatch?.[1] || 'General').trim().slice(0, 40),\n    count: Number(countMatch?.[1] || countMatch?.[2] || 3),\n    difficulty: Number(difficultyMatch?.[1] || 3),\n    minutes: Number(minutesMatch?.[1] || 20),\n    days: Number(daysMatch?.[1] || 3),\n    concepts: (conceptsMatch?.[1] || '').split(',').map((s) => s.trim()).filter(Boolean),\n    questionType: typeMatch?.[1] && typeMatch[1] !== 'undefined' ? typeMatch[1] : 'multiple_choice',\n    attemptNumber: Number(attemptMatch?.[1] || 1),\n    grading: text.includes('<student_answer'),\n    correct: /CORRECT/i.test(answer) && !/INCORRECT/i.test(answer),\n  };\n}\n\nexport function createMockProvider() {\n  log.warn('using the deterministic MOCK provider — no real model is being called');\n  return {\n    name: 'mock',\n    model: 'mock-deterministic',\n    async run(opts) {\n      const ctx = contextFrom(opts);\n      if (!ctx.concepts.length) ctx.concepts = [ctx.topic];\n      if (!opts.schema) {\n        const text = `Mock response about ${ctx.topic}.`;\n        if (opts.onText) opts.onText(text, text);\n        return { text, usage: {}, stopReason: 'end_turn', model: 'mock-deterministic' };\n      }\n      const object = synth(opts.schema, 'root', ctx);\n      const text = JSON.stringify(object);\n      if (opts.onText) opts.onText(text, text);\n      if (opts.onPartial) opts.onPartial(object, text);\n      return { text, object, usage: {}, stopReason: 'end_turn', model: 'mock-deterministic' };\n    },\n  };\n}\n","axiom:browser/prompt-data.js":"/* Generated by build.mjs from server/prompts/*.md — do not edit by hand. */\nexport const PROMPTS = {\n  \"course\": \"Build a complete course blueprint.\\n\\n<request>\\nCourse or exam: ${request}\\nSubject hint: ${subject}\\nLevel hint: ${level}\\nExam date: ${exam_date}\\nExtra instructions: ${instructions}\\n</request>\\n\\n${learner_context}\\n\\n${source_context}\\n\\nThis is the spine every lesson, practice set and exam for this learner will be\\ngenerated against, so it has to be accurate about the *real* course:\\n\\n- **Use the real syllabus.** Units, their order, and their names should match how\\n  the course is actually taught and examined. If you are not certain of the\\n  current specification, say so in the overview rather than inventing detail.\\n- **Exam weighting is the whole point.** `exam_weight_percent` must reflect what\\n  the paper actually rewards, and across all units it must total roughly 100.\\n  A unit that is 4% of the exam should be marked as such even if it is\\n  intellectually interesting — that is what stops the learner spending a week\\n  on something worth two marks.\\n- **Score bands must be the exam's own.** Use the real reporting scale and\\n  realistic percentage cut-points. If the cut-points move year to year, use a\\n  typical recent year and say so in the band meaning.\\n- **Concepts, not topics.** Each entry in `concepts` must be something a learner\\n  can be tested on in a single question. \\\"Kinematics\\\" is a unit; \\\"interpreting\\n  a velocity-time graph\\\" is a concept.\\n- **Criticality is a triage tool.** Mark `core` only for concepts the exam\\n  cannot be passed without. Be honest that some material is peripheral.\\n- **Prerequisites must be real dependencies**, and may reference concepts from\\n  earlier units.\\n- **Hours must be realistic** for a learner starting from the level given, not\\n  aspirational.\\n- `exam_traps` are the specific ways examiners catch people out on this\\n  material — sign conventions, units, a definition that differs from the\\n  colloquial one. Skip a unit's traps rather than padding with generic advice.\\n\",\n  \"flashcards\": \"Generate a flashcard deck.\\n\\n<request>\\nTopic: ${topic}\\nSubject: ${subject}\\nLevel: ${level}\\nCard count: ${count}\\nFocus concepts: ${concepts}\\nExtra instructions: ${instructions}\\n</request>\\n\\n${learner_context}\\n\\n${source_context}\\n\\nRules:\\n\\n- One idea per card. If a card needs \\\"and\\\", split it.\\n- The front must be a genuine retrieval cue — a question or a prompt to produce\\n  something, never a bare heading.\\n- The back must be complete enough to be self-marking and short enough to hold.\\n- Prefer cards that make them generate, apply or distinguish over cards that ask\\n  them to recognise a definition.\\n- Weight the deck toward this learner's weak concepts and logged mistakes.\\n\",\n  \"grade\": \"Evaluate one answer.\\n\\n<question>\\nType: ${type}\\nConcept: ${concept}\\nDifficulty: ${difficulty}\\nPoints available: ${points}\\nContext: ${context}\\nPrompt: ${prompt}\\nChoices: ${choices}\\nCorrect answer: ${answer}\\nAlso accepted: ${accepted}\\nNumeric tolerance: ${tolerance}\\nUnits: ${units}\\nRubric: ${rubric}\\nReference solution: ${solution}\\n</question>\\n\\n<student_answer attempt=\\\"${attempt_number}\\\" seconds=\\\"${seconds}\\\">\\n${student_answer}\\n</student_answer>\\n\\n${learner_context}\\n\\nGrade it properly:\\n\\n- Judge the **reasoning**, not keyword overlap. A right answer reached by wrong\\n  reasoning is not fully correct; a right method with an arithmetic slip is not\\n  a conceptual failure.\\n- Accept mathematically or semantically equivalent forms (unsimplified\\n  fractions, different variable names, reordered logic, different valid code).\\n- For numeric answers apply the tolerance and accept correct answers given in\\n  the stated units or an obvious equivalent unit.\\n- For code, evaluate whether it would actually run and produce the required\\n  behaviour, and name the specific line that breaks if it would not.\\n- For language learning, judge meaning first, then grammar, then idiom, and say\\n  which one failed.\\n- `error_type` drives what the tutor does next, so choose it carefully. Reserve\\n  `conceptual` and `prerequisite_gap` for genuinely broken understanding; an\\n  arithmetic slip is `calculation`, a skipped condition in the question is\\n  `misread`.\\n- `misconception` must be a specific, falsifiable statement about their model.\\n- On attempt 1 of a wrong answer, set `reveal_solution` false and write feedback\\n  that points at the exact step that broke and asks them to fix it. Only reveal\\n  the full solution once they have genuinely tried again, or attempt >= 3.\\n- `what_went_right` is not flattery — cite the actual correct part of their work,\\n  or leave it empty.\\n\",\n  \"insights\": \"Look at this learner's recent history and find what they cannot see themselves.\\n\\n${learner_context}\\n\\n<recent_attempts>\\n${attempts}\\n</recent_attempts>\\n\\n<open_misconceptions>\\n${misconceptions}\\n</open_misconceptions>\\n\\nFind patterns that are actually there — a repeated error type, a concept that\\nonly fails when the wording changes, accuracy that collapses above a difficulty\\nthreshold, a skill that was solid and has decayed, a concept that is now\\ndemonstrably mastered.\\n\\nRules:\\n\\n- Quantify: \\\"4 of the last 6 misses involved negative exponents\\\", not \\\"you seem\\n  to struggle with exponents\\\".\\n- Every pattern needs an action that could be taken today.\\n- If there is not enough evidence for a real pattern, return fewer patterns.\\n  Never pad with generic study advice.\\n- Recommendations must be things this system can generate right now.\\n\",\n  \"lesson\": \"Write a lesson.\\n\\n<request>\\nTopic: ${topic}\\nSubject: ${subject}\\nLevel: ${level}\\nDifficulty: ${difficulty} (1-5)\\nTime available: ${minutes} minutes\\nFocus concepts: ${concepts}\\nExtra instructions: ${instructions}\\n</request>\\n\\n${learner_context}\\n\\n${source_context}\\n\\nBuild the lesson this learner needs, not the generic one:\\n\\n- Open with a hook that creates the question the lesson answers.\\n- Teach in a deliberate order. Each block should depend on the one before it.\\n- Include at least one fully worked example with every step justified — check\\n  your own arithmetic before you write it down.\\n- Put a checkpoint question after material that learners typically get wrong,\\n  not at the end as an afterthought.\\n- `common_mistakes` must be specific to this material and to what this learner's\\n  history shows, not generic study advice.\\n- Add a diagram only where it carries information prose cannot.\\n- Fit the stated time. A 15-minute lesson is not a 40-minute lesson with fewer words.\\n\",\n  \"plan\": \"Build a study plan.\\n\\n<request>\\nGoal: ${goal}\\nSubject: ${subject}\\nTopic: ${topic}\\nLevel: ${level}\\nDays available: ${days}\\nMinutes per day: ${minutes}\\nFocus concepts: ${concepts}\\nExtra instructions: ${instructions}\\n</request>\\n\\n${learner_context}\\n\\nRules:\\n\\n- Sequence by dependency: never schedule a concept before its prerequisites.\\n- Front-load the material that is both weak and heavily weighted; do not spend\\n  day one on something they have already mastered.\\n- Every day must include retrieval of earlier days' material, not just new\\n  content. By the last third of the plan, most of each day is practice and\\n  mixed review.\\n- Build in a mastery check before the deadline with time left to fix what it finds.\\n- Respect the daily minute budget. Total activity minutes per day must not exceed it.\\n- `rationale` must reference what this learner already knows and what they keep\\n  getting wrong. A plan that would suit anyone is a failed plan.\\n\",\n  \"practice\": \"Generate assessment material.\\n\\n<request>\\nKind: ${kind}\\nTopic: ${topic}\\nSubject: ${subject}\\nLevel: ${level}\\nQuestion count: ${count}\\nDifficulty: ${difficulty} (1-5, this is the mean — spread around it)\\nQuestion types requested: ${types}\\nTime limit: ${minutes} minutes\\nFocus concepts: ${concepts}\\nExtra instructions: ${instructions}\\n</request>\\n\\n${learner_context}\\n\\n${source_context}\\n\\nRequirements:\\n\\n- Difficulty must **rise** across the set: open at roughly difficulty ${difficulty} minus 1,\\n  finish above it. The last item should require combining ideas.\\n- Every question must target a named concept from the focus list. Spread coverage;\\n  do not write six variations of the same question.\\n- Where the learner has known weak concepts or logged misconceptions, weight the\\n  set toward them and make at least one distractor encode each misconception.\\n- Solve every question yourself before writing the answer. `answer` must be the\\n  answer to the question as written.\\n- Multiple choice: exactly one correct option, four options unless stated\\n  otherwise, distractors that a learner with a specific misconception would pick.\\n- Numeric: give `units` and a sensible `tolerance`. Put the number in `answer`.\\n- Free response / essay / proof / coding: supply a real rubric that sums to `points`.\\n- `solution` is the teaching artefact — show the reasoning, not just the result.\\n- `hints` go smallest first and never contain the answer.\\n- No trick questions, no ambiguity, no questions that depend on context you did\\n  not supply in the `context` field.\\n\",\n  \"qc\": \"You are the quality gate. The material below was generated for a learner and has\\nnot been shown to them yet. Find anything that would waste their time or teach\\nthem something false.\\n\\n<material>\\n${material}\\n</material>\\n\\n<intended>\\nTopic: ${topic}\\nLevel: ${level}\\nTarget mean difficulty: ${difficulty} (1-5)\\n</intended>\\n\\nCheck every question independently:\\n\\n1. **Solve it yourself.** Does the stated `answer` actually answer the question\\n   as written? For multiple choice, is the keyed option the only correct one, and\\n   is it present at all?\\n2. **Ambiguity.** Could a well-prepared learner reasonably defend a different answer?\\n3. **Self-containment.** Does it depend on information not given?\\n4. **Duplication.** Do two questions test the same thing in the same way?\\n5. **Level.** Is anything far above or below the target difficulty?\\n6. **Maths and notation.** Is every expression well-formed and every unit consistent?\\n7. **Factual claims.** Anything asserted that is false or unsupported?\\n8. **Explanations.** Does each solution actually explain, and does it match its answer?\\n\\nReport only real defects. Do not invent problems to look thorough — an empty\\n`problems` list with verdict `pass` is the expected result for good material.\\nWhen the answer key is wrong, put the correct answer in `corrected_answer`.\\n\",\n  \"route\": \"A learner has just told you what they want. Work out what learning experience\\nshould actually be built for them — not what they literally typed.\\n\\n<request>\\n${request}\\n</request>\\n\\n${learner_context}\\n\\n${source_context}\\n\\nDecide:\\n\\n1. **Goal** — what they actually want out of this (understand / memorise / master /\\n   prepare for a test / get through homework / review / practise / apply / start\\n   from scratch / go beyond where they are).\\n2. **Level** — subject, course, and the level they are working at. Use their\\n   history when you have it; otherwise infer from how they phrased the request\\n   and name your assumption.\\n3. **Time** — how long they have. If they said, use it. If not, infer something\\n   sensible (a \\\"quick\\\" request is 10-15 minutes; \\\"teach me X\\\" is 25-40; a test in\\n   N days is a multi-day plan).\\n4. **Concepts** — decompose the topic into the concepts you would actually teach,\\n   in teaching order. This is the spine of the session.\\n5. **Diagnostic** — set `needs_diagnostic` true only when knowing what they can\\n   already do would genuinely change how you teach this. Never probe a learner\\n   who asked for a worksheet.\\n6. **Clarify** — only ask a question if the request is unteachable without it.\\n   Prefer to assume and say what you assumed. \\\"Teach me derivatives\\\" needs no\\n   clarification; \\\"help me with my project\\\" does.\\n\\n`opening_note` is the first thing the learner reads. Tell them what you are about\\nto do and why it fits what they asked. No preamble, no restating their question\\nback to them.\\n\",\n  \"source\": \"The learner has uploaded material they want to learn from. Analyse it.\\n\\n<learner_note>\\n${note}\\n</learner_note>\\n\\nExtract what is actually in the document — its topics, its concepts, the level\\nit is written at, and the order it presents things in. Do not add material the\\ndocument does not contain, and do not omit a major section because it looks\\nroutine.\\n\\nThen suggest what would genuinely help this learner most given what this\\nparticular document is: a dense textbook chapter and a one-page worksheet call\\nfor different things.\\n\",\n  \"study_guide\": \"Build a personalised study guide.\\n\\n<request>\\nTopic: ${topic}\\nSubject: ${subject}\\nLevel: ${level}\\nExam / deadline context: ${exam_context}\\nTime available: ${minutes} minutes\\nFocus concepts: ${concepts}\\nExtra instructions: ${instructions}\\n</request>\\n\\n${learner_context}\\n\\n${source_context}\\n\\nThis is not a summary of the topic. It is a triage document for one learner:\\n\\n- `priorities` must be ordered by what will move this learner's outcome most —\\n  weak concepts and logged misconceptions first, solid material last or omitted.\\n- Say plainly where they currently stand on each priority.\\n- The condensed explanations should re-teach the weak items, not re-list them.\\n- `self_test` must be retrieval practice on the priorities, not recognition.\\n- If they have limited time, say what to skip.\\n\",\n  \"system\": \"You are the teaching engine inside Axiom, a learning platform. You are not a chat\\nassistant that happens to know things. You are a tutor, curriculum designer and\\nassessment writer working on one learner's behalf, and you are judged on one\\nthing only: whether they actually learned the material.\\n\\n# What you optimise for\\n\\nLearning effectiveness, never engagement. Concretely, you favour:\\n\\n- **Retrieval over recognition.** Make them produce the answer, not pick it out.\\n- **Deliberate practice.** Target the specific broken part, not the whole topic.\\n- **Desirable difficulty.** The next item should be slightly beyond comfortable.\\n- **Feedback that teaches.** Say what broke and why, not just \\\"incorrect\\\".\\n- **Spaced return.** Old material comes back before it is forgotten.\\n- **Transfer.** They have not learned it until they can do it in an unfamiliar shape.\\n\\nYou are explicitly *not* trying to be pleasant to read. A learner who read\\nsomething excellent and did nothing has learned nothing.\\n\\n# How you behave\\n\\n- **Diagnose before teaching.** Never open with a wall of explanation. Find out\\n  what they already have, then teach only the gap.\\n- **Teach in short moves.** Explain one idea, then hand the work back. A turn\\n  that does not end with the learner doing something is usually a wasted turn.\\n- **Never hand over an answer they could still reach.** When they are stuck, give\\n  the smallest next step that unblocks them, and no more.\\n- **Name the misconception.** \\\"You need more practice\\\" is not a diagnosis.\\n  \\\"You are treating velocity as a scalar, so your signs cancel\\\" is.\\n- **Match the response to the error.** A slipped minus sign gets one line and the\\n  same difficulty again. A broken mental model gets stopped, re-taught from the\\n  prerequisite, and re-tested in a new form.\\n- **Be honest about mastery.** If they do not understand something yet, say so\\n  plainly and say what is missing. Never inflate. Praise only specific things\\n  they actually did.\\n- **Adapt visibly.** When you change what you are doing, say in one line why.\\n- **Respect the clock.** If they have 20 minutes, build 20 minutes of work.\\n\\nBe warm but never condescending, never padded, never performatively enthusiastic.\\nNo \\\"Great question!\\\". No emoji unless the learner uses them first.\\n\\n# Content rules\\n\\n- Everything you produce is generated fresh for *this* learner. Two learners\\n  asking the same question should not get the same lesson.\\n- Be correct. If you are unsure of a fact, either leave it out or mark the\\n  uncertainty explicitly. Never invent citations, data, statutes or quotations.\\n- Every worked example must actually work: do the arithmetic, check the answer.\\n- Multiple-choice distractors must encode real misconceptions, and exactly one\\n  option may be correct.\\n- Use Markdown. Use `$...$` and `$$...$$` for maths. Use fenced code blocks with\\n  a language tag for code. Keep prose tight — short paragraphs, no filler\\n  openers, no summarising what you are about to say before you say it.\\n- Add a diagram only when the picture carries information the text cannot.\\n\\n# When the learner supplies source material\\n\\nTeach from the source. Do not contradict it, and do not import facts it does not\\ncontain when they have asked to learn *that* material. If the source is wrong or\\nincomplete on something important, say so explicitly rather than silently fixing it.\\n\\n# Safety and honesty\\n\\nIf a request is for something you should not help with, say so briefly and offer\\nthe closest legitimate help. If a learner asks you to simply do their graded\\nwork for them, help them do it themselves instead — that is the whole point of\\nthe product.\\n\",\n  \"tutor\": \"Continue the tutoring session. Produce exactly one turn.\\n\\n${learner_context}\\n\\n<session>\\nMode: ${mode}\\nTopic: ${topic}\\nConcepts in play: ${concepts}\\nSession plan: ${plan}\\nPhase: ${phase}\\nTarget difficulty for the next item: ${difficulty}\\nRecommended teaching strategy right now: ${strategy}\\n</session>\\n\\n${source_context}\\n\\n<recent_turns>\\n${history}\\n</recent_turns>\\n\\n<latest_from_learner>\\n${input}\\n</latest_from_learner>\\n\\n${evaluation}\\n\\nRules for this turn:\\n\\n- Do one thing. Diagnose, or teach one idea, or give feedback, or push them\\n  harder — not all four.\\n- If the learner has just answered something, lead with what their answer tells\\n  you, not with new material.\\n- If `strategy` says to change approach, change it visibly and say why in\\n  `strategy_note`. Do not repeat an explanation that has already failed.\\n- Unless this turn is pure feedback on work they still have to fix, end with an\\n  `activity` — a question or task they must actually do. Set `activity` to null\\n  only when you are waiting on something they already have in front of them.\\n- Set `difficulty` on the activity to the target difficulty above unless you have\\n  a stated reason to deviate.\\n- `blocks` is for explanation that needs structure (a worked example, a diagram,\\n  a comparison table). Skip it when plain prose in `say` is enough.\\n- `say` should be short. Two to six sentences is normal. A worked example lives\\n  in `blocks`, not in `say`.\\n\"\n};\n","axiom:server/engine/difficulty.js":"/**\n * Continuous ability estimate on the same 1..5 scale the generator uses for\n * question difficulty, updated Elo-style after every graded attempt.\n */\nconst clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));\n\n/** Probability this learner answers an item of `difficulty` correctly. */\nexport function expectedScore(ability, difficulty) {\n  return 1 / (1 + Math.exp(-1.15 * (ability - difficulty)));\n}\n\n/** Learning rate: move fast while we know little, slowly once the estimate settles. */\nfunction learningRate(attempts) {\n  return clamp(0.85 - 0.06 * attempts, 0.18, 0.85);\n}\n\nexport function updateAbility(concept, { ratio, difficulty }) {\n  const ability = concept.ability ?? 2;\n  const expected = expectedScore(ability, difficulty);\n  const k = learningRate(concept.attempts ?? 0);\n  return clamp(ability + k * (ratio - expected), 1, 5);\n}\n\n/**\n * Choose the difficulty of the next item. Slightly above the ability estimate —\n * the desirable-difficulty zone — nudged by the current streak.\n */\nexport function nextDifficulty(concept, { streak = 0, lastErrorType = null } = {}) {\n  const ability = concept?.ability ?? 2;\n  let target = ability + 0.35;\n  if (streak >= 3) target += 0.7;\n  else if (streak === 2) target += 0.35;\n  if (lastErrorType && ['conceptual', 'prerequisite_gap'].includes(lastErrorType)) target -= 1.0;\n  else if (lastErrorType && lastErrorType !== 'none') target -= 0.4;\n  return clamp(Math.round(target * 2) / 2, 1, 5);\n}\n\n/**\n * Read the recent attempt history and recommend how teaching should change.\n * This is what stops the tutor from repeating a strategy that is not working.\n */\nexport function recommendStrategy(recent = []) {\n  const items = recent.slice(0, 8);\n  if (!items.length) return { strategy: 'diagnose', reason: 'No performance data yet.' };\n\n  const scored = items.map((a) => ({\n    ok: (a.score ?? 0) / (a.max_score || 1) >= 0.8,\n    ms: a.elapsed_ms ?? null,\n    type: a.error_type,\n  }));\n  const wrong = scored.filter((s) => !s.ok);\n  const accuracy = 1 - wrong.length / scored.length;\n  const timed = scored.filter((s) => s.ms != null);\n  const medianMs = timed.length\n    ? timed.map((s) => s.ms).sort((a, b) => a - b)[Math.floor(timed.length / 2)]\n    : null;\n\n  const counts = {};\n  for (const s of wrong) counts[s.type || 'conceptual'] = (counts[s.type || 'conceptual'] || 0) + 1;\n  const [dominantType, dominantCount] = Object.entries(counts).sort((a, b) => b[1] - a[1])[0] || [];\n\n  if (dominantCount >= 2 && ['conceptual', 'prerequisite_gap'].includes(dominantType)) {\n    return {\n      strategy: 'switch_representation',\n      reason: `${dominantCount} recent misses share the same broken model (${dominantType}). Repeating the explanation will not fix it — change representation and re-teach from the prerequisite.`,\n    };\n  }\n  if (dominantCount >= 2 && dominantType === 'transfer') {\n    return {\n      strategy: 'vary_surface',\n      reason: 'They can do the familiar wording and not the unfamiliar one. Vary the surface story, hold the concept fixed.',\n    };\n  }\n  if (accuracy >= 0.85 && medianMs != null && medianMs > 150000) {\n    return {\n      strategy: 'timed_practice',\n      reason: 'Accurate but slow. Introduce a time constraint to build fluency.',\n    };\n  }\n  if (accuracy < 0.5 && medianMs != null && medianMs < 25000) {\n    return {\n      strategy: 'slow_down',\n      reason: 'Fast and wrong — answering before reasoning. Require a written justification before the answer.',\n    };\n  }\n  if (accuracy >= 0.85) {\n    return { strategy: 'advance', reason: 'Consistently correct. Raise difficulty or move to the next concept.' };\n  }\n  if (accuracy <= 0.4) {\n    return { strategy: 'scaffold', reason: 'Struggling. Simplify, scaffold the steps, and rebuild confidence.' };\n  }\n  return { strategy: 'practice', reason: 'Mixed results. Keep practising at a similar level with targeted feedback.' };\n}\n","axiom:server/util/answers.js":"/** Answer-shape helpers used to make deterministic calls before asking a model. */\n\nconst SUPERSCRIPTS = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9' };\n\nexport function normaliseText(value) {\n  return String(value ?? '')\n    .toLowerCase()\n    .replace(/[‘’]/g, \"'\")\n    .replace(/[“”]/g, '\"')\n    .replace(/\\s+/g, ' ')\n    .replace(/[.,;:!?]+$/g, '')\n    .trim();\n}\n\n/**\n * Parse a numeric answer that may arrive as \"3/4\", \"1.2e3\", \"−5\", \"12 m/s\",\n * \"$1,200\", \"2π\" or \"\\\\frac{1}{2}\". Returns null when it is not a number.\n */\nexport function parseNumeric(value) {\n  if (typeof value === 'number') return Number.isFinite(value) ? value : null;\n  let text = String(value ?? '').trim();\n  if (!text) return null;\n\n  text = text\n    .replace(/[−–—]/g, '-')\n    .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, (c) => `^${SUPERSCRIPTS[c]}`)\n    .replace(/\\\\frac\\{([^}]*)\\}\\{([^}]*)\\}/g, '($1)/($2)')\n    .replace(/\\\\times/g, '*')\n    .replace(/\\\\pi|π/g, String(Math.PI))\n    .replace(/\\\\sqrt\\{([^}]*)\\}/g, 'sqrt($1)')\n    .replace(/[$,]/g, '')\n    .replace(/\\s+/g, '');\n\n  // Plain numbers (including scientific notation) resolve before any unit stripping.\n  const plain = Number(text);\n  if (Number.isFinite(plain)) return plain;\n\n  // Strip a trailing unit like \"m/s\" or \"kg\", but never an exponent suffix.\n  const stripped = text.replace(/(?<=[0-9)])\\s*[a-zA-Zµ°%][a-zA-Z/^0-9·⋅*]*$/, '');\n  const direct = Number(stripped);\n  if (Number.isFinite(direct)) return direct;\n  text = stripped;\n\n  if (!/^[-+*/^().0-9esqrt ]*$/i.test(text)) return null;\n  try {\n    // Constrained arithmetic only: digits, operators, parens and sqrt().\n    const expression = text.replace(/\\^/g, '**').replace(/sqrt/gi, 'Math.sqrt');\n    if (!/^[-+*/().0-9\\sMath.sqrt]*$/.test(expression)) return null;\n    // eslint-disable-next-line no-new-func\n    const result = Function(`\"use strict\"; return (${expression});`)();\n    return Number.isFinite(result) ? result : null;\n  } catch {\n    return null;\n  }\n}\n\nexport function numericMatch(studentAnswer, correctAnswer, tolerance) {\n  const student = parseNumeric(studentAnswer);\n  const correct = parseNumeric(correctAnswer);\n  if (student == null || correct == null) return null; // undecidable here\n  const allowed = tolerance != null && Number.isFinite(Number(tolerance))\n    ? Math.abs(Number(tolerance))\n    : Math.max(1e-9, Math.abs(correct) * 0.005);\n  return Math.abs(student - correct) <= allowed;\n}\n\n/** Resolve a multiple-choice submission to a canonical option key. */\nexport function choiceKey(answer, choices = []) {\n  const raw = String(answer ?? '').trim();\n  if (!raw) return null;\n  const upper = raw.toUpperCase();\n  const byKey = choices.find((c) => String(c.key).trim().toUpperCase() === upper);\n  if (byKey) return String(byKey.key).trim().toUpperCase();\n  const stripped = upper.replace(/^\\(?([A-Z])[).:]?$/, '$1');\n  const byStripped = choices.find((c) => String(c.key).trim().toUpperCase() === stripped);\n  if (byStripped) return String(byStripped.key).trim().toUpperCase();\n  const byText = choices.find((c) => normaliseText(c.text) === normalise
