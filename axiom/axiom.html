Text(raw));\n  return byText ? String(byText.key).trim().toUpperCase() : null;\n}\n\n/**\n * Decide correctness without a model where that is safe and exact.\n * Returns true/false, or null when judgement is genuinely required.\n */\nexport function deterministicVerdict(question, studentAnswer) {\n  if (studentAnswer == null || String(studentAnswer).trim() === '') return null;\n\n  if (question.type === 'multiple_choice' || question.type === 'true_false') {\n    const submitted = choiceKey(studentAnswer, question.choices || []);\n    const correct = choiceKey(question.answer, question.choices || []) || String(question.answer).trim().toUpperCase();\n    if (!submitted) return null;\n    return submitted === correct;\n  }\n\n  if (question.type === 'numeric') {\n    const direct = numericMatch(studentAnswer, question.answer, question.tolerance);\n    if (direct === true) return true;\n    for (const alternative of question.accepted || []) {\n      if (numericMatch(studentAnswer, alternative, question.tolerance) === true) return true;\n    }\n    return direct; // false or null\n  }\n\n  if (question.type === 'fill_blank' || question.type === 'short_answer') {\n    const student = normaliseText(studentAnswer);\n    const candidates = [question.answer, ...(question.accepted || [])].map(normaliseText);\n    if (candidates.includes(student)) return true;\n    return null; // a near-miss still deserves a real read\n  }\n\n  return null;\n}\n","axiom:server/engine/readiness.js":"import { expectedScore } from 'axiom:server/engine/difficulty.js';\n\n/**\n * Exam readiness.\n *\n * The question this answers is not \"how much have you done\" but \"if you sat the\n * exam today, what would you score, and what is the shortest path to the score\n * you want\". Everything here is derived from demonstrated performance:\n *\n *   1. Per concept, estimate the probability of getting an exam-level item on\n *      that concept right, from the learner's ability estimate against the\n *      difficulty the exam actually asks at.\n *   2. Roll concepts up to a unit, weighted by how central each concept is.\n *   3. Roll units up to a paper, weighted by the exam blueprint — a unit worth\n *      4% of the paper cannot move your score much however shaky it is.\n *   4. Attach a confidence interval driven by how much evidence exists, so a\n *      prediction from three attempts is not dressed up as a measurement.\n *   5. Rank units by *marginal points available*, which is what tells a learner\n *      where the next hour actually goes.\n */\n\nconst clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));\n\n/** How much a concept counts toward its unit. */\nconst CRITICALITY_WEIGHT = { core: 1, important: 0.65, peripheral: 0.3 };\n\n/** What an untaught concept scores: a blind guess on a multiple-choice paper. */\nconst UNTAUGHT_FLOOR = 0.15;\n\n/** The difficulty an exam actually asks at when the blueprint does not say. */\nconst DEFAULT_EXAM_DIFFICULTY = 3.5;\n\n/**\n * Probability this learner answers an exam-level item on `concept` correctly.\n * With no attempts, the mastery level alone gives a weak prior; with attempts,\n * the ability estimate carries it.\n */\nexport function conceptExpectation(concept, examDifficulty = DEFAULT_EXAM_DIFFICULTY) {\n  if (!concept) return { p: UNTAUGHT_FLOOR, confidence: 0, attempts: 0 };\n\n  const attempts = concept.attempts ?? 0;\n  // Confidence saturates: three attempts is a signal, twelve is a measurement.\n  const confidence = 1 - Math.exp(-attempts / 4);\n\n  // Introduced-but-untested sits a little above a blind guess, not much.\n  const prior = clamp(UNTAUGHT_FLOOR + 0.06 * clamp(concept.mastery_level ?? 0, 0, 5), 0, 1);\n  if (attempts === 0) return { p: prior, confidence: 0, attempts: 0 };\n\n  const modelled = expectedScore(concept.ability ?? 2, examDifficulty);\n  const observed = clamp((concept.correct ?? 0) / attempts, 0, 1);\n  // Blend the ability model with raw accuracy, trusting accuracy more as\n  // attempts accumulate.\n  const blend = clamp(attempts / (attempts + 5), 0, 0.8);\n  let p = clamp(modelled * (1 - blend) + observed * blend, UNTAUGHT_FLOOR, 0.99);\n\n  // Demonstrated failure must never project better than never having tried.\n  // Two things lag a run of wrong answers: the ability estimate, which moves in\n  // steps, and the mastery level, which counts an attempt as exposure. Without\n  // this guard a learner who has just got four questions wrong out-projects the\n  // same learner who has never seen the concept — evidence of not knowing\n  // something reading as progress. Accuracy below the guess rate caps the\n  // projection at the guess rate, whatever the model would otherwise say.\n  if (observed < UNTAUGHT_FLOOR) p = Math.min(p, UNTAUGHT_FLOOR);\n\n  return { p, confidence, attempts };\n}\n\n/** Roll a unit's concepts up into one expected accuracy. */\nexport function unitReadiness(unit, conceptLookup, examDifficulty = DEFAULT_EXAM_DIFFICULTY) {\n  const concepts = unit.concepts || [];\n  let weighted = 0;\n  let confidenceWeighted = 0;\n  let total = 0;\n  const detail = [];\n\n  for (const spec of concepts) {\n    const weight = CRITICALITY_WEIGHT[spec.criticality] ?? CRITICALITY_WEIGHT.important;\n    const tracked = conceptLookup(spec.name);\n    const { p, confidence, attempts } = conceptExpectation(tracked, spec.difficulty || examDifficulty);\n    weighted += weight * p;\n    confidenceWeighted += weight * confidence;\n    total += weight;\n    detail.push({\n      name: spec.name,\n      criticality: spec.criticality || 'important',\n      mastery_level: tracked?.mastery_level ?? 0,\n      attempts,\n      expected: p,\n      confidence,\n      weight,\n    });\n  }\n\n  const expected = total ? weighted / total : UNTAUGHT_FLOOR;\n  const confidence = total ? confidenceWeighted / total : 0;\n  return {\n    idx: unit.idx,\n    title: unit.title,\n    exam_weight: Number(unit.exam_weight_percent) || 0,\n    hours: Number(unit.hours) || 0,\n    expected,\n    confidence,\n    concepts: detail.sort((a, b) => a.expected - b.expected),\n    // Marginal points on the whole paper still available in this unit.\n    points_available: ((Number(unit.exam_weight_percent) || 0) / 100) * (1 - expected) * 100,\n  };\n}\n\n/** Turn a raw percentage into the exam's own score, using its published bands. */\nexport function bandFor(percent, bands = []) {\n  const ordered = [...bands].sort((a, b) => b.min_percent - a.min_percent);\n  for (const band of ordered) {\n    if (percent * 100 >= band.min_percent) return band;\n  }\n  return ordered.at(-1) || { score: 1, min_percent: 0, meaning: '' };\n}\n\n/**\n * Full readiness for a course.\n *\n * `examResults` are real practice papers. When they exist the model is\n * calibrated against them — a prediction that disagrees with what the learner\n * actually scored last week should move toward reality, not defend itself.\n */\nexport function courseReadiness({ blueprint, conceptLookup, examResults = [], now = new Date() }) {\n  const units = (blueprint.units || []).map((unit) => unitReadiness(unit, conceptLookup));\n  const bands = blueprint.score_bands || [];\n\n  const weightTotal = units.reduce((sum, u) => sum + u.exam_weight, 0) || 1;\n  const modelledPercent = units.reduce((sum, u) => sum + u.exam_weight * u.expected, 0) / weightTotal;\n  const confidence = units.reduce((sum, u) => sum + u.exam_weight * u.confidence, 0) / weightTotal;\n\n  // Calibration: blend toward the most recent real paper, weighted by how\n  // fresh it is. A paper sat today counts for more than one sat a month ago.\n  let percent = modelledPercent;\n  let calibratedOn = null;\n  if (examResults.length) {\n    const latest = examResults[0];\n    const ageDays = (now.getTime() - new Date(latest.created_at).getTime()) / 86400000;\n    const freshness = clamp(1 - ageDays / 21, 0, 1);\n    const pull = 0.55 * freshness;\n    percent = modelledPercent * (1 - pull) + latest.percent * pull;\n    calibratedOn = { at: latest.created_at, percent: latest.percent, weight: pull };\n  }\n\n  // The interval is honest about thin evidence rather than hiding it.\n  const margin = clamp(0.045 + (1 - confidence) * 0.17, 0.03, 0.22);\n  const band = bandFor(percent, bands);\n  const low = bandFor(clamp(percent - margin, 0, 1), bands);\n  const high = bandFor(clamp(percent + margin, 0, 1), bands);\n\n  const leverage = units\n    .map((unit) => ({\n      idx: unit.idx,\n      title: unit.title,\n      exam_weight: unit.exam_weight,\n      expected: unit.expected,\n      points_available: unit.points_available,\n      weakest: unit.concepts.slice(0, 3).map((c) => c.name),\n    }))\n    .sort((a, b) => b.points_available - a.points_available);\n\n  return {\n    percent,\n    modelled_percent: modelledPercent,\n    confidence,\n    margin,\n    score: band.score,\n    band,\n    range: { low: low.score, high: high.score },\n    calibrated_on: calibratedOn,\n    units,\n    leverage,\n    bands,\n  };\n}\n\n/**\n * The shortest path to a target score: take units in order of points available\n * until the projected total clears the target band's threshold.\n */\nexport function pathToScore(readiness, targetScore) {\n  const target = readiness.bands.find((b) => b.score === targetScore);\n  if (!target) return { reachable: false, gap: 0, units: [], targetPercent: null };\n\n  const targetPercent = target.min_percent / 100;\n  const gap = targetPercent - readiness.percent;\n  if (gap <= 0) {\n    return { reachable: true, alreadyThere: true, gap: 0, units: [], targetPercent };\n  }\n\n  // Getting a unit from where it is to strong-but-not-perfect is realistic;\n  // assuming everyone reaches 100% on everything is not.\n  const ACHIEVABLE = 0.9;\n  const picked = [];\n  let gained = 0;\n\n  for (const unit of readiness.leverage) {\n    if (gained >= gap) break;\n    const headroom = (unit.exam_weight / 100) * Math.max(0, ACHIEVABLE - unit.expected);\n    if (headroom <= 0.0005) continue;\n    picked.push({ ...unit, gain: headroom });\n    gained += headroom;\n  }\n\n  return {\n    reachable: gained >= gap,\n    alreadyThere: false,\n    gap,\n    gain: gained,\n    units: picked,\n    targetPercent,\n  };\n}\n\n/**\n * Whether there is enough time left to get there, given how much of the course\n * is still genuinely unlearned.\n */\nexport function pacing(readiness, { examDate, minutesPerDay = 60, now = new Date() }) {\n  const hoursRemaining = readiness.units.reduce(\n    (sum, unit) => sum + (unit.hours || 2) * Math.max(0, 0.9 - unit.expected),\n    0,\n  );\n  if (!examDate) {\n    return { hoursRemaining, daysLeft: null, hoursPerDayNeeded: null, status: 'no_deadline' };\n  }\n\n  const daysLeft = Math.max(0, Math.ceil((new Date(examDate).getTime() - now.getTime()) / 86400000));\n  const hoursPerDayNeeded = daysLeft > 0 ? hoursRemaining / daysLeft : Infinity;\n  const available = minutesPerDay / 60;\n\n  let status = 'on_track';\n  if (daysLeft === 0) status = 'out_of_time';\n  else if (hoursPerDayNeeded > available * 1.6) status = 'behind';\n  else if (hoursPerDayNeeded > available) status = 'tight';\n\n  return { hoursRemaining, daysLeft, hoursPerDayNeeded, available, status };\n}\n\n/**\n * The single most useful thing to do next.\n *\n * Order matters: forgetting old material costs more than not yet knowing new\n * material, and an unmeasured learner close to their exam needs a real paper\n * before any more targeted practice is worth planning.\n */\nexport function nextBestAction({ readiness, pace, dueCount, examTaken, targetScore = 5 }) {\n  if (dueCount >= 3) {\n    return {\n      kind: 'review',\n      title: `Clear ${dueCount} concepts before they decay`,\n      why: 'Losing what you already had costs more marks than anything you have not learned yet.',\n      resource: 'review',\n    };\n  }\n\n  if (!examTaken && pace.daysLeft != null && pace.daysLeft <= 21) {\n    return {\n      kind: 'exam',\n      title: 'Sit a full practice paper',\n      why: `With ${pace.daysLeft} days left, the prediction needs calibrating against a real paper under real conditions.`,\n      resource: 'exam',\n    };\n  }\n\n  const target = readiness.bands.find((b) => b.score === targetScore);\n  if (target && readiness.percent * 100 >= target.min_percent && !readiness.units.some((u) => u.expected < 0.75)) {\n    return {\n      kind: 'maintain',\n      title: 'Hold the line with mixed retrieval',\n      why: `You are already projecting a ${readiness.score}. Interleaved review protects it better than new content.`,\n      resource: 'review',\n    };\n  }\n\n  const unit = readiness.leverage[0];\n  if (!unit) {\n    return { kind: 'learn', title: 'Start the first unit', why: 'Nothing is underway yet.', resource: 'lesson' };\n  }\n\n  const untouched = readiness.units.find((u) => u.idx === unit.idx)?.concepts.every((c) => c.attempts === 0);\n  return {\n    kind: untouched ? 'learn' : unit.expected < 0.6 ? 'practice' : 'master',\n    title: untouched\n      ? `Learn ${unit.title}`\n      : unit.expected < 0.6\n        ? `Drill ${unit.title}`\n        : `Prove ${unit.title}`,\n    why:\n      `${unit.title} is ${unit.exam_weight}% of the paper and you are projecting ` +\n      `${Math.round(unit.expected * 100)}% on it — worth about ` +\n      `${unit.points_available.toFixed(1)} marks of the total, more than anything else on the table.`,\n    unit: unit.title,\n    concepts: unit.weakest,\n    resource: untouched ? 'lesson' : unit.expected < 0.6 ? 'practice_set' : 'mastery_check',\n  };\n}\n\nexport { CRITICALITY_WEIGHT, UNTAUGHT_FLOOR, DEFAULT_EXAM_DIFFICULTY };\n","axiom:curriculum/ap-biology.js":"import { c, u, apBands, course } from 'axiom:curriculum/kit.js';\n\nexport default course({\n  key: 'ap-biology',\n  title: 'AP Biology',\n  exam: 'AP Biology',\n  subject: 'Biology',\n  level: 'AP / first-year college',\n  aliases: ['ap biology', 'ap bio'],\n  overview:\n    'Eight units built on four big ideas: evolution, energetics, information storage and transmission, and systems interactions. The exam is an experiment-and-data exam more than a recall exam — half the marks are free response, and the two long questions are almost entirely about interpreting an experiment you have never seen. Statistics, controls, and the ability to justify a claim with evidence carry more marks than vocabulary.',\n  total_hours: 170,\n  exam_format: {\n    total_minutes: 180,\n    description:\n      'Section I is 60 multiple-choice questions in 90 minutes, worth 50%. Section II is 6 free-response questions in 90 minutes, worth 50%: two long questions (interpreting and evaluating experimental results, one of them with graphing) and four short questions covering scientific investigation, conceptual analysis, visual representations and data analysis. A four-function calculator and the formula sheet, including chi-square and standard error, are allowed.',\n    sections: [\n      { name: 'Section I: Multiple Choice', question_type: 'mcq', count: 60, minutes: 90, weight_percent: 50, notes: 'Heavy on data sets, graphs and short experimental scenarios rather than isolated recall.' },\n      { name: 'Section II: Free Response', question_type: 'frq', count: 6, minutes: 90, weight_percent: 50, notes: 'Questions 1 and 2 are long (8-10 points each). Marks come from identifying variables and controls, justifying predictions, and connecting a result to a mechanism.' },\n    ],\n  },\n  score_bands: apBands([72, 59, 44, 29]),\n  units: [\n    u(1, 'Chemistry of Life', [8, 11], 14,\n      'Water, macromolecules and the chemical properties that make biological structure possible.',\n      [\n        c('Properties of water', 2, 'core'),\n        c('Hydrogen bonding and polarity', 2, 'core'),\n        c('Carbon skeletons and functional groups', 2, 'core'),\n        c('Monomers, polymers and dehydration synthesis', 3, 'core'),\n        c('Carbohydrate structure and function', 2, 'core'),\n        c('Lipid structure and function', 3, 'core'),\n        c('Protein structure levels', 4, 'core', ['Monomers, polymers and dehydration synthesis']),\n        c('Nucleic acid structure', 3, 'core'),\n        c('Directionality of biological polymers', 3, 'important', ['Nucleic acid structure']),\n      ],\n      [\n        ['Describing a protein\\'s function without reference to its shape.', 'Function follows from tertiary structure; almost every AP answer about a protein should route through shape.'],\n      ]),\n    u(2, 'Cell Structure and Function', [10, 13], 18,\n      'Organelles, membranes, transport and the surface-area-to-volume constraint that shapes cells.',\n      [\n        c('Cell organelles and their functions', 2, 'core'),\n        c('Prokaryotic versus eukaryotic cells', 2, 'core'),\n        c('Endosymbiotic theory', 3, 'core'),\n        c('Surface area to volume ratio', 3, 'core'),\n        c('Fluid mosaic membrane model', 3, 'core'),\n        c('Passive transport and diffusion', 3, 'core', ['Fluid mosaic membrane model']),\n        c('Osmosis and water potential', 4, 'core', ['Passive transport and diffusion']),\n        c('Active transport and pumps', 3, 'core', ['Fluid mosaic membrane model']),\n        c('Tonicity and cell responses', 4, 'core', ['Osmosis and water potential']),\n        c('Compartmentalisation', 3, 'important'),\n      ],\n      [\n        ['Getting the sign of water potential backwards.', 'Water moves from higher (less negative) to lower (more negative) water potential. Solute potential is always negative.'],\n        ['Saying a hypertonic solution makes a cell swell.', 'Hypertonic means more solute outside, so water leaves and the cell shrinks.'],\n      ]),\n    u(3, 'Cellular Energetics', [12, 16], 22,\n      'Enzymes, and the two energy-converting pathways: photosynthesis and cellular respiration.',\n      [\n        c('Enzyme structure and active site', 3, 'core', ['Protein structure levels']),\n        c('Enzyme kinetics and reaction rate', 4, 'core', ['Enzyme structure and active site']),\n        c('Enzyme inhibition', 4, 'core', ['Enzyme kinetics and reaction rate']),\n        c('Environmental effects on enzyme function', 3, 'core', ['Enzyme structure and active site']),\n        c('Cellular energy and ATP', 2, 'core'),\n        c('Glycolysis', 3, 'core'),\n        c('Krebs cycle', 4, 'core', ['Glycolysis']),\n        c('Oxidative phosphorylation and chemiosmosis', 4, 'core', ['Krebs cycle']),\n        c('Anaerobic respiration and fermentation', 3, 'core', ['Glycolysis']),\n        c('Light-dependent reactions', 4, 'core'),\n        c('Calvin cycle', 4, 'core', ['Light-dependent reactions']),\n        c('Photosynthesis and respiration as coupled cycles', 4, 'important', ['Calvin cycle', 'Oxidative phosphorylation and chemiosmosis']),\n      ],\n      [\n        ['Reciting pathway steps rather than tracing energy and electrons.', 'The exam asks what happens to the proton gradient or the electron carriers when something is blocked. Learn the flow, not the list.'],\n        ['Treating a competitive inhibitor as un-outcompetable.', 'Competitive inhibition can be overcome by raising substrate concentration; non-competitive cannot.'],\n      ]),\n    u(4, 'Cell Communication and Cell Cycle', [10, 15], 18,\n      'Signal transduction, feedback, and the regulated cell cycle.',\n      [\n        c('Cell signalling types', 2, 'core'),\n        c('Signal transduction pathways', 4, 'core', ['Cell signalling types']),\n        c('Signal amplification', 4, 'important', ['Signal transduction pathways']),\n        c('Negative and positive feedback', 3, 'core'),\n        c('Homeostasis', 3, 'core', ['Negative and positive feedback']),\n        c('Phases of the cell cycle', 2, 'core'),\n        c('Mitosis', 3, 'core', ['Phases of the cell cycle']),\n        c('Cell cycle checkpoints and regulation', 4, 'core', ['Phases of the cell cycle']),\n        c('Cancer as loss of cell cycle control', 3, 'important', ['Cell cycle checkpoints and regulation']),\n      ],\n      [\n        ['Calling any amplifying loop positive feedback.', 'Positive feedback pushes further from the set point; negative feedback returns toward it, even when the response is large.'],\n      ]),\n    u(5, 'Heredity', [8, 11], 14,\n      'Meiosis, Mendelian inheritance and the sources of genetic variation.',\n      [\n        c('Meiosis', 3, 'core', ['Mitosis']),\n        c('Crossing over and independent assortment', 4, 'core', ['Meiosis']),\n        c('Mendelian genetics and Punnett squares', 3, 'core'),\n        c('Probability rules in genetics', 3, 'core', ['Mendelian genetics and Punnett squares']),\n        c('Non-Mendelian inheritance', 4, 'core', ['Mendelian genetics and Punnett squares']),\n        c('Sex-linked inheritance', 4, 'core', ['Mendelian genetics and Punnett squares']),\n        c('Pedigree analysis', 4, 'core', ['Sex-linked inheritance']),\n        c('Chi-square test for genetic data', 4, 'core', ['Probability rules in genetics']),\n        c('Environmental effects on phenotype', 2, 'important'),\n      ],\n      [\n        ['Reporting a chi-square value without stating degrees of freedom and the conclusion.', 'Marks come from comparing to the critical value and saying whether the null hypothesis is rejected, in context.'],\n      ]),\n    u(6, 'Gene Expression and Regulation', [12, 16], 22,\n      'From DNA to protein, how expression is controlled, and the biotechnology built on it.',\n      [\n        c('DNA and RNA structure', 3, 'core', ['Nucleic acid structure']),\n        c('DNA replication', 4, 'core', ['DNA and RNA structure']),\n        c('Transcription', 4, 'core', ['DNA and RNA structure']),\n        c('RNA processing in eukaryotes', 4, 'core', ['Transcription']),\n        c('Translation', 4, 'core', ['Transcription']),\n        c('The genetic code and reading frames', 3, 'core', ['Translation']),\n        c('Operons and prokaryotic gene regulation', 4, 'core', ['Transcription']),\n        c('Eukaryotic gene regulation', 4, 'core', ['Transcription']),\n        c('Types of mutations and their effects', 4, 'core', ['The genetic code and reading frames']),\n        c('Gel electrophoresis and PCR', 3, 'important'),\n        c('Genetic engineering and transformation', 3, 'important'),\n      ],\n      [\n        ['Assuming a point mutation always changes the protein.', 'The code is redundant; a silent mutation changes the codon but not the amino acid. Frameshifts, by contrast, usually wreck everything downstream.'],\n        ['Mixing up the lac and trp operons.', 'lac is inducible and catabolic; trp is repressible and anabolic. Ask what the cell gains by switching it on.'],\n      ]),\n    u(7, 'Natural Selection', [13, 20], 24,\n      'Evolution as the central explanatory idea: selection, drift, speciation, phylogeny and the evidence for common ancestry.',\n      [\n        c('Natural selection', 3, 'core'),\n        c('Fitness and differential reproduction', 3, 'core', ['Natural selection']),\n        c('Types of selection', 3, 'core', ['Natural selection']),\n        c('Genetic drift and bottleneck effects', 3, 'core'),\n        c('Gene flow', 2, 'core'),\n        c('Hardy-Weinberg equilibrium', 4, 'core', ['Probability rules in genetics']),\n        c('Conditions for Hardy-Weinberg', 4, 'core', ['Hardy-Weinberg equilibrium']),\n        c('Speciation and reproductive isolation', 4, 'core'),\n        c('Phylogenetic trees and cladograms', 4, 'core'),\n        c('Evidence for common ancestry', 3, 'core'),\n        c('Origin of life hypotheses', 2, 'peripheral'),\n      ],\n      [\n        ['Saying a population \"adapted in order to\" survive.', 'Selection acts on existing variation; individuals do not acquire traits because they are needed. Phrase it as differential survival and reproduction.'],\n        ['Using Hardy-Weinberg without checking its assumptions.', 'A question that says the population is evolving is telling you the equilibrium does not hold — and usually asking which condition is violated.'],\n      ]),\n    u(8, 'Ecology', [10, 15], 18,\n      'Behaviour, populations, communities, ecosystems and how disruption propagates through them.',\n      [\n        c('Animal behaviour and communication', 2, 'core'),\n        c('Energy flow and trophic levels', 3, 'core'),\n        c('Ten percent rule and energy loss', 3, 'core', ['Energy flow and trophic levels']),\n        c('Population growth models', 4, 'core'),\n        c('Carrying capacity and limiting factors', 3, 'core', ['Population growth models']),\n        c('Community interactions', 3, 'core'),\n        c('Species diversity and Simpson index', 3, 'important'),\n        c('Ecological succession', 2, 'important'),\n        c('Biogeochemical cycles', 3, 'important'),\n        c('Human impact and invasive species', 3, 'important'),\n      ],\n      [\n        ['Answering a disruption question with one step.', 'Marks come from following the chain: what changes, what that does to the next trophic level, and what that does to the one after.'],\n      ]),\n  ],\n});\n","axiom:curriculum/ap-calculus-ab.js":"import { c, u, apBands, course } from 'axiom:curriculum/kit.js';\n\nexport default course({\n  key: 'ap-calculus-ab',\n  title: 'AP Calculus AB',\n  exam: 'AP Calculus AB',\n  subject: 'Mathematics',\n  level: 'AP / first-semester college calculus',\n  aliases: ['ap calculus ab', 'ap calc ab', 'ap calculus', 'ap calc'],\n  overview:\n    'A first course in single-variable calculus: limits, derivatives, integrals and differential equations, taught through the big ideas of change, limits, and analysis of functions. Units 5 and 6 alone are about a third of the exam. Free response is graded on communication as much as answers — an unsupported number, a missing justification, or an unlabelled integral loses points that the arithmetic already earned.',\n  total_hours: 160,\n  exam_format: {\n    total_minutes: 195,\n    description:\n      'Section I is 45 multiple-choice questions in 105 minutes, worth 50%: Part A is 30 questions in 60 minutes with no calculator, Part B is 15 questions in 45 minutes with a graphing calculator. Section II is 6 free-response questions in 90 minutes, worth 50%: Part A is 2 questions in 30 minutes with a calculator, Part B is 4 questions in 60 minutes without.',\n    sections: [\n      { name: 'Section I Part A: Multiple Choice (no calculator)', question_type: 'mcq', count: 30, minutes: 60, weight_percent: 33.3, notes: 'Rewards fluency with derivative and integral rules done by hand.' },\n      { name: 'Section I Part B: Multiple Choice (calculator)', question_type: 'mcq', count: 15, minutes: 45, weight_percent: 16.7, notes: 'Numerical integration, roots and intersections you are expected to find on the calculator.' },\n      { name: 'Section II Part A: Free Response (calculator)', question_type: 'frq', count: 2, minutes: 30, weight_percent: 16.7, notes: 'Usually a rate-in / rate-out accumulation problem. Answers to three decimal places, with the set-up shown.' },\n      { name: 'Section II Part B: Free Response (no calculator)', question_type: 'frq', count: 4, minutes: 60, weight_percent: 33.3, notes: 'Justifications must cite the theorem or sign change being used, not just assert the conclusion.' },\n    ],\n  },\n  score_bands: apBands([65, 54, 42, 29]),\n  units: [\n    u(1, 'Limits and Continuity', [10, 12], 18,\n      'What a limit is, how to find one, and what continuity buys you.',\n      [\n        c('Introducing calculus: average and instantaneous rate of change', 2, 'core'),\n        c('Limits from graphs and tables', 2, 'core'),\n        c('Algebraic limit properties', 3, 'core', ['Limits from graphs and tables']),\n        c('Indeterminate forms and algebraic manipulation', 3, 'core', ['Algebraic limit properties']),\n        c('Squeeze theorem', 3, 'important', ['Algebraic limit properties']),\n        c('Continuity at a point and on an interval', 3, 'core', ['Limits from graphs and tables']),\n        c('Types of discontinuity', 3, 'core', ['Continuity at a point and on an interval']),\n        c('Limits involving infinity and asymptotes', 3, 'core', ['Algebraic limit properties']),\n        c('Intermediate value theorem', 3, 'core', ['Continuity at a point and on an interval']),\n      ],\n      [\n        ['Concluding a limit does not exist because the function is undefined there.', 'A limit describes approach, not arrival. 0/0 is a signal to factor or rationalise, not a verdict.'],\n      ]),\n    u(2, 'Differentiation: Definition and Fundamental Properties', [10, 12], 18,\n      'The derivative as a limit, and the rules that make it usable.',\n      [\n        c('Derivative as a limit of difference quotients', 4, 'core', ['Algebraic limit properties']),\n        c('Derivative as slope and rate of change', 3, 'core'),\n        c('Differentiability and continuity', 4, 'core', ['Continuity at a point and on an interval']),\n        c('Power rule', 2, 'core'),\n        c('Derivatives of trigonometric functions', 3, 'core'),\n        c('Derivatives of exponential and logarithmic functions', 3, 'core'),\n        c('Product rule', 3, 'core', ['Power rule']),\n        c('Quotient rule', 3, 'core', ['Product rule']),\n      ],\n      [\n        ['Assuming continuity implies differentiability.', 'It goes one way only. |x| is continuous at 0 and has no derivative there.'],\n      ]),\n    u(3, 'Differentiation: Composite, Implicit, and Inverse Functions', [9, 13], 16,\n      'The chain rule and everything that depends on it.',\n      [\n        c('Chain rule', 4, 'core', ['Product rule']),\n        c('Implicit differentiation', 4, 'core', ['Chain rule']),\n        c('Derivatives of inverse functions', 4, 'core', ['Chain rule']),\n        c('Derivatives of inverse trigonometric functions', 4, 'core', ['Derivatives of inverse functions']),\n        c('Higher-order derivatives', 3, 'core', ['Chain rule']),\n        c('Selecting procedures for derivatives', 4, 'core', ['Chain rule']),\n      ],\n      [\n        ['Forgetting the inner derivative on a composite.', 'Every chain-rule slip is the same slip. Name the outside and the inside before differentiating.'],\n      ]),\n    u(4, 'Contextual Applications of Differentiation', [10, 15], 18,\n      'Derivatives as rates in context: motion, related rates, linear approximation and L\\'Hospital\\'s rule.',\n      [\n        c('Interpreting the derivative in context', 3, 'core', ['Derivative as slope and rate of change']),\n        c('Straight-line motion: position, velocity, acceleration', 4, 'core', ['Higher-order derivatives']),\n        c('Rates of change in applied contexts', 3, 'core', ['Interpreting the derivative in context']),\n        c('Related rates', 5, 'core', ['Implicit differentiation']),\n        c('Linear approximation and tangent lines', 3, 'core', ['Derivative as slope and rate of change']),\n        c(\"L'Hospital's rule\", 4, 'core', ['Indeterminate forms and algebraic manipulation']),\n      ],\n      [\n        ['Plugging in the given numbers before differentiating a related-rates equation.', 'Differentiate the general relationship first, then substitute the instant. Substituting early freezes a variable that is changing.'],\n        ['Answering a rate question without units.', 'Interpretation marks require units and a sentence in context.'],\n      ]),\n    u(5, 'Analytical Applications of Differentiation', [15, 18], 24,\n      'Using the derivative to describe a function: extrema, concavity, curve sketching and optimisation.',\n      [\n        c('Mean value theorem', 4, 'core', ['Differentiability and continuity']),\n        c('Extreme value theorem and critical points', 4, 'core', ['Continuity at a point and on an interval']),\n        c('First derivative test', 4, 'core', ['Extreme value theorem and critical points']),\n        c('Second derivative test and concavity', 4, 'core', ['Higher-order derivatives']),\n        c('Points of inflection', 4, 'core', ['Second derivative test and concavity']),\n        c('Connecting f, f prime and f double prime graphically', 5, 'core', ['First derivative test']),\n        c('Sketching curves from derivative information', 5, 'core', ['Connecting f, f prime and f double prime graphically']),\n        c('Optimisation problems', 5, 'core', ['First derivative test']),\n        c('Implicit relations and behaviour', 4, 'important', ['Implicit differentiation']),\n      ],\n      [\n        ['Justifying a maximum by saying the derivative is zero.', 'A justification must show the sign change of f prime, or cite the second derivative test explicitly.'],\n        ['Confusing a graph of f with a graph of f prime.', 'On an f prime graph, a zero crossing is a candidate extremum of f and the sign is where f increases or decreases.'],\n      ]),\n    u(6, 'Integration and Accumulation of Change', [17, 20], 28,\n      'The integral as accumulation, the fundamental theorem, and the techniques for evaluating one.',\n      [\n        c('Riemann sums and definite integral notation', 4, 'core'),\n        c('Left, right, midpoint and trapezoidal sums', 4, 'core', ['Riemann sums and definite integral notation']),\n        c('Accumulation functions', 4, 'core', ['Riemann sums and definite integral notation']),\n        c('Fundamental theorem of calculus, part 1', 5, 'core', ['Accumulation functions']),\n        c('Fundamental theorem of calculus, part 2', 4, 'core', ['Fundamental theorem of calculus, part 1']),\n        c('Properties of definite integrals', 3, 'core', ['Riemann sums and definite integral notation']),\n        c('Antiderivatives and indefinite integrals', 3, 'core'),\n        c('Integration by substitution', 4, 'core', ['Antiderivatives and indefinite integrals', 'Chain rule']),\n        c('Integrating using long division and completing the square', 4, 'important', ['Antiderivatives and indefinite integrals']),\n        c('Improper integrals', 4, 'peripheral', ['Limits involving infinity and asymptotes']),\n      ],\n      [\n        ['Forgetting to change the limits after a u-substitution in a definite integral.', 'Either convert the limits to u, or convert back to x before evaluating. Mixing the two is the classic lost point.'],\n        ['Dropping the constant of integration on an indefinite integral.', 'It is a required part of the answer and is graded.'],\n      ]),\n    u(7, 'Differential Equations', [6, 12], 16,\n      'Slope fields, separable equations and exponential models.',\n      [\n        c('Modelling situations with differential equations', 3, 'core'),\n        c('Verifying solutions to differential equations', 3, 'core'),\n        c('Slope fields', 4, 'core', ['Modelling situations with differential equations']),\n        c('Separation of variables', 4, 'core', ['Integration by substitution']),\n        c('Particular solutions from initial conditions', 4, 'core', ['Separation of variables']),\n        c('Exponential growth and decay models', 4, 'core', ['Particular solutions from initial conditions']),\n      ],\n      [\n        ['Solving for the constant before undoing the logarithm.', 'Apply the initial condition at the stage where it is cleanest, and be consistent about the absolute value.'],\n      ]),\n    u(8, 'Applications of Integration', [10, 15], 20,\n      'What integrals compute: averages, net change, area between curves and volumes.',\n      [\n        c('Average value of a function', 3, 'core', ['Fundamental theorem of calculus, part 2']),\n        c('Net change and accumulation in context', 4, 'core', ['Accumulation functions']),\n        c('Position from velocity, distance from speed', 4, 'core', ['Straight-line motion: position, velocity, acceleration']),\n        c('Area between curves', 4, 'core', ['Fundamental theorem of calculus, part 2']),\n        c('Volumes with cross sections', 5, 'core', ['Area between curves']),\n        c('Volumes of revolution: disc and washer', 5, 'core', ['Area between curves']),\n      ],\n      [\n        ['Computing displacement when the question asked for total distance.', 'Distance needs the integral of speed — the absolute value — which usually means splitting at the sign changes of velocity.'],\n        ['Setting up a washer integral without subtracting the inner radius squared separately.', 'It is R squared minus r squared, not (R minus r) squared.'],\n      ]),\n  ],\n});\n","axiom:curriculum/ap-chemistry.js":"import { c, u, apBands, course } from 'axiom:curriculum/kit.js';\n\nexport default course({\n  key: 'ap-chemistry',\n  title: 'AP Chemistry',\n  exam: 'AP Chemistry',\n  subject: 'Chemistry',\n  level: 'AP / first-year college',\n  aliases: ['ap chemistry', 'ap chem'],\n  overview:\n    'Nine units organised around particle-level explanation: structure, intermolecular forces, reactions, kinetics, thermodynamics, equilibrium and electrochemistry. Unit 3 and Unit 8 are worth roughly a third of the paper between them. The free-response section rewards particulate diagrams and explicit reasoning from data far more than plugging into formulas, and almost every long question is built on an experiment.',\n  total_hours: 180,\n  exam_format: {\n    total_minutes: 195,\n    description:\n      'Section I is 60 multiple-choice questions in 90 minutes, worth 50%, with no calculator. Section II is 7 free-response questions in 105 minutes, worth 50%: 3 long questions of 10 points each and 4 short questions of 4 points each, with a calculator and the equations and constants sheet.',\n    sections: [\n      { name: 'Section I: Multiple Choice', question_type: 'mcq', count: 60, minutes: 90, weight_percent: 50, notes: 'No calculator. Many items are estimation or particulate-diagram reasoning rather than computation.' },\n      { name: 'Section II: Free Response', question_type: 'frq', count: 7, minutes: 105, weight_percent: 50, notes: 'Three long and four short. Marks are lost for answers without justification, missing units, or wrong significant figures on a final answer.' },\n    ],\n  },\n  score_bands: apBands([72, 58, 45, 31]),\n  units: [\n    u(1, 'Atomic Structure and Properties', [7, 9], 16,\n      'Moles, mass spectrometry, electron configuration and the periodic trends that follow from Coulomb\\'s law.',\n      [\n        c('Moles and molar mass', 2, 'core'),\n        c('Mass spectrometry of elements', 3, 'core'),\n        c('Elemental composition of pure substances', 3, 'core', ['Moles and molar mass']),\n        c('Composition of mixtures', 3, 'important', ['Moles and molar mass']),\n        c('Atomic structure and electron configuration', 3, 'core'),\n        c('Photoelectron spectroscopy', 4, 'core', ['Atomic structure and electron configuration']),\n        c('Periodic trends', 3, 'core', ['Atomic structure and electron configuration']),\n        c('Valence electrons and ionic compounds', 3, 'core', ['Periodic trends']),\n      ],\n      [\n        ['Explaining a periodic trend by \"more shells\" alone.', 'Every trend answer should name effective nuclear charge and distance — Coulombic attraction is the mechanism the rubric wants.'],\n      ]),\n    u(2, 'Compound Structure and Properties', [7, 9], 16,\n      'Bonding, Lewis structures, VSEPR geometry and how structure sets properties.',\n      [\n        c('Types of chemical bonds', 2, 'core'),\n        c('Intramolecular force and potential energy', 3, 'core'),\n        c('Structure of ionic solids', 3, 'core'),\n        c('Structure of metals and alloys', 3, 'important'),\n        c('Lewis diagrams', 3, 'core'),\n        c('Resonance and formal charge', 4, 'core', ['Lewis diagrams']),\n        c('VSEPR and molecular geometry', 4, 'core', ['Lewis diagrams']),\n        c('Hybridisation', 3, 'important', ['VSEPR and molecular geometry']),\n        c('Bond polarity and molecular polarity', 4, 'core', ['VSEPR and molecular geometry']),\n      ],\n      [\n        ['Calling a molecule polar because it has polar bonds.', 'Geometry can cancel the dipoles. CO2 has two polar bonds and no net dipole.'],\n      ]),\n    u(3, 'Properties of Substances and Mixtures', [18, 22], 30,\n      'The heaviest unit on the paper: intermolecular forces, states of matter, solutions, gas laws and spectroscopy.',\n      [\n        c('Intermolecular forces', 4, 'core', ['Bond polarity and molecular polarity']),\n        c('Properties of solids', 3, 'core', ['Intermolecular forces']),\n        c('Ideal gas law', 3, 'core'),\n        c('Kinetic molecular theory', 4, 'core', ['Ideal gas law']),\n        c('Maxwell-Boltzmann distributions', 4, 'core', ['Kinetic molecular theory']),\n        c('Deviations from ideal gas behaviour', 4, 'core', ['Ideal gas law']),\n        c('Solutions and mixtures', 3, 'core'),\n        c('Molarity and solution concentration', 3, 'core', ['Moles and molar mass']),\n        c('Separation of solutions and mixtures', 3, 'important', ['Intermolecular forces']),\n        c('Solubility and like-dissolves-like', 4, 'core', ['Intermolecular forces']),\n        c('Spectroscopy and the electromagnetic spectrum', 3, 'important'),\n        c('Beer-Lambert law', 3, 'core', ['Molarity and solution concentration']),\n      ],\n      [\n        ['Ranking boiling points by molar mass without checking for hydrogen bonding.', 'Identify every IMF present first; hydrogen bonding usually outweighs a modest mass difference.'],\n        ['Listing IMFs without saying which dominates.', 'London dispersion exists in everything. The mark is for identifying the strongest force and comparing it across substances.'],\n      ]),\n    u(4, 'Chemical Reactions', [7, 9], 16,\n      'Classifying reactions, writing net ionic equations, and the stoichiometry of solution chemistry.',\n      [\n        c('Physical and chemical changes', 2, 'core'),\n        c('Net ionic equations', 4, 'core', ['Molarity and solution concentration']),\n        c('Representations of reactions', 3, 'core'),\n        c('Precipitation reactions', 3, 'core', ['Net ionic equations']),\n        c('Acid-base reactions', 3, 'core', ['Net ionic equations']),\n        c('Oxidation-reduction reactions', 4, 'core', ['Net ionic equations']),\n        c('Stoichiometry and limiting reactants', 4, 'core', ['Moles and molar mass']),\n        c('Titration calculations', 4, 'core', ['Stoichiometry and limiting reactants']),\n      ],\n      [\n        ['Leaving spectator ions in a net ionic equation.', 'Anything that appears unchanged on both sides comes out. Charge must balance as well as atoms.'],\n      ]),\n    u(5, 'Kinetics', [7, 9], 18,\n      'Reaction rates, rate laws determined from data, and mechanisms consistent with them.',\n      [\n        c('Reaction rates', 3, 'core'),\n        c('Rate law and reaction order', 4, 'core', ['Reaction rates']),\n        c('Determining rate law from initial rates', 4, 'core', ['Rate law and reaction order']),\n        c('Integrated rate laws and half-life', 4, 'core', ['Rate law and reaction order']),\n        c('Collision theory', 3, 'core', ['Maxwell-Boltzmann distributions']),\n        c('Arrhenius equation and activation energy', 4, 'core', ['Collision theory']),\n        c('Reaction mechanisms and rate-determining step', 5, 'core', ['Rate law and reaction order']),\n        c('Catalysis', 3, 'core', ['Arrhenius equation and activation energy']),\n      ],\n      [\n        ['Reading reaction order off the balanced equation coefficients.', 'Order is experimental. Only for an elementary step do coefficients give the order.'],\n        ['Proposing a mechanism whose rate-determining step contradicts the observed rate law.', 'The slow step must reproduce the rate law, and the steps must sum to the overall equation.'],\n      ]),\n    u(6, 'Thermodynamics', [7, 9], 18,\n      'Energy, calorimetry, enthalpy and the bond-energy and Hess\\'s law routes to it.',\n      [\n        c('Endothermic and exothermic processes', 2, 'core'),\n        c('Energy diagrams', 3, 'core', ['Endothermic and exothermic processes']),\n        c('Heat transfer and thermal equilibrium', 3, 'core'),\n        c('Heat capacity and calorimetry', 4, 'core', ['Heat transfer and thermal equilibrium']),\n        c('Enthalpy of reaction', 3, 'core'),\n        c('Bond enthalpies', 4, 'core', ['Enthalpy of reaction']),\n        c('Enthalpy of formation', 3, 'core', ['Enthalpy of reaction']),\n        c(\"Hess's law\", 4, 'core', ['Enthalpy of formation']),\n      ],\n      [\n        ['Getting the sign wrong on a bond-energy calculation.', 'Breaking bonds costs energy, forming them releases it: bonds broken minus bonds formed.'],\n      ]),\n    u(7, 'Equilibrium', [7, 9], 20,\n      'Dynamic equilibrium, the reaction quotient, Le Chatelier\\'s principle and solubility equilibria.',\n      [\n        c('Dynamic equilibrium', 3, 'core'),\n        c('Equilibrium constant expressions', 3, 'core', ['Dynamic equilibrium']),\n        c('Calculating the equilibrium constant', 4, 'core', ['Equilibrium constant expressions']),\n        c('Reaction quotient and direction of shift', 4, 'core', ['Equilibrium constant expressions']),\n        c('ICE tables', 4, 'core', ['Calculating the equilibrium constant']),\n        c(\"Le Chatelier's principle\", 4, 'core', ['Reaction quotient and direction of shift']),\n        c('Solubility product and common ion effect', 4, 'core', ['Equilibrium constant expressions']),\n        c('Free energy and the equilibrium constant', 4, 'important', ['Equilibrium constant expressions']),\n      ],\n      [\n        ['Saying a temperature change shifts equilibrium without treating heat as a reactant or product.', 'Only temperature changes K. Everything else shifts position at constant K.'],\n        ['Including pure solids and liquids in K.', 'They have unit activity and never appear in the expression.'],\n      ]),\n    u(8, 'Acids and Bases', [11, 15], 24,\n      'pH, weak acid and base equilibria, buffers and titration curves — the second-heaviest unit.',\n      [\n        c('Introduction to acids and bases', 3, 'core'),\n        c('pH and pOH of strong acids and bases', 3, 'core', ['Molarity and solution concentration']),\n        c('Weak acid and base equilibria', 4, 'core', ['ICE tables']),\n        c('Acid-base reactions and buffers', 5, 'core', ['Weak acid and base equilibria']),\n        c('Henderson-Hasselbalch equation', 4, 'core', ['Acid-base reactions and buffers']),\n        c('Molecular structure and acid strength', 4, 'core', ['Bond polarity and molecular polarity']),\n        c('pH and solubility', 4, 'important', ['Solubility product and common ion effect']),\n        c('Titration curves and equivalence points', 5, 'core', ['Weak acid and base equilibria']),\n        c('Buffer capacity', 4, 'important', ['Acid-base reactions and buffers']),\n      ],\n      [\n        ['Assuming the equivalence point of a weak-acid titration is at pH 7.', 'The conjugate base makes it basic. Only strong-strong titrations land on 7.'],\n        ['Reading the half-equivalence point as anything other than pH = pKa.', 'That single point on the curve gives the pKa directly and is asked for constantly.'],\n      ]),\n    u(9, 'Applications of Thermodynamics', [7, 9], 18,\n      'Entropy, Gibbs free energy, thermodynamic favourability and electrochemistry.',\n      [\n        c('Entropy', 4, 'core'),\n        c('Gibbs free energy and thermodynamic favourability', 4, 'core', ['Entropy', 'Enthalpy of reaction']),\n        c('Thermodynamic and kinetic control', 4, 'core', ['Gibbs free energy and thermodynamic favourability']),\n        c('Free energy and temperature dependence', 4, 'core', ['Gibbs free energy and thermodynamic favourability']),\n        c('Coupled reactions', 4, 'important', ['Gibbs free energy and thermodynamic favourability']),\n        c('Galvanic and electrolytic cells', 4, 'core', ['Oxidation-reduction reactions']),\n        c('Cell potential and free energy', 4, 'core', ['Galvanic and electrolytic cells']),\n        c('Electrolysis and Faraday\\'s laws', 4, 'core', ['Galvanic and electrolytic cells']),\n      ],\n      [\n        ['Calling a reaction with negative delta-G fast.', 'Favourability says nothing about rate. A thermodynamically favoured reaction can be kinetically frozen.'],\n        ['Mixing up the anode and cathode.', 'Oxidation is always at the anode, in both cell types; only the sign of the electrode flips.'],\n      ]),\n  ],\n});\n","axiom:curriculum/ap-computer-science-a.js":"import { c, u, apBands, course } from 'axiom:curriculum/kit.js';\n\nexport default course({\n  key: 'ap-computer-science-a',\n  title: 'AP Computer Science A',\n  exam: 'AP Computer Science A',\n  subject: 'Computer Science',\n  level: 'AP / first-semester college Java',\n  aliases: ['ap computer science a', 'ap csa', 'ap comp sci a', 'ap computer science'],\n  overview:\n    'Java programming, reorganised for 2025-26 from ten units into four. The standalone inheritance unit is gone and file and dataset work is in. Data Collections is now the heaviest unit at 30-40%, and it is where almost every free-response question ends up: arrays, ArrayLists and 2D arrays. Free response is graded on code that compiles and behaves, so the fastest score gains usually come from writing more code by hand rather than reading more about it.',\n  total_hours: 140,\n  exam_format: {\n    total_minutes: 180,\n    description:\n      'Section I is 42 multiple-choice questions in 90 minutes, worth 55%. Section II is 4 free-response questions in 90 minutes, worth 45%: methods and control structures, class design, array or ArrayList processing, and 2D array processing. All code is written by hand in Java.',\n    sections: [\n      { name: 'Section I: Multiple Choice', question_type: 'mcq', count: 42, minutes: 90, weight_percent: 55, notes: 'Mostly code tracing. Work line by line with a variable table rather than reading for the gist.' },\n      { name: 'Section II: Free Response', question_type: 'frq', count: 4, minutes: 90, weight_percent: 45, notes: 'Points are for correct syntax and behaviour. Partial credit is generous, so never leave a question blank.' },\n    ],\n  },\n  score_bands: apBands([68, 55, 42, 30]),\n  units: [\n    u(1, 'Using Objects and Methods', [15, 25], 26,\n      'Java fundamentals: primitive types, expressions, objects, calling methods, and the String and Math classes.',\n      [\n        c('Primitive types and variables', 2, 'core'),\n        c('Arithmetic expressions and operator precedence', 3, 'core', ['Primitive types and variables']),\n        c('Integer division and modulus', 3, 'core', ['Arithmetic expressions and operator precedence']),\n        c('Casting and numeric overflow', 3, 'core', ['Arithmetic expressions and operator precedence']),\n        c('Compound assignment operators', 2, 'core'),\n        c('Objects, references and null', 4, 'core'),\n        c('Constructors and instantiating objects', 3, 'core', ['Objects, references and null']),\n        c('Calling methods and passing parameters', 3, 'core', ['Objects, references and null']),\n        c('String methods and immutability', 4, 'core', ['Calling methods and passing parameters']),\n        c('The Math class', 2, 'core'),\n        c('Wrapper classes and autoboxing', 3, 'important', ['Objects, references and null']),\n      ],\n      [\n        ['Comparing strings with ==.', 'That compares references. Use .equals for value comparison; this appears on nearly every exam.'],\n        ['Expecting 7 / 2 to be 3.5.', 'Two ints divide to an int. Cast one operand to double first.'],\n      ]),\n    u(2, 'Selection and Iteration', [25, 35], 32,\n      'Boolean logic, conditionals, loops, and the algorithms built from them.',\n      [\n        c('Boolean expressions and comparison operators', 3, 'core'),\n        c('If, else if and else statements', 3, 'core', ['Boolean expressions and comparison operators']),\n        c('Compound boolean expressions and short-circuiting', 4, 'core', ['Boolean expressions and comparison operators']),\n        c('De Morgan and equivalent boolean expressions', 4, 'core', ['Compound boolean expressions and short-circuiting']),\n        c('While loops', 3, 'core', ['If, else if and else statements']),\n        c('For loops', 3, 'core', ['While loops']),\n        c('Nested loops', 4, 'core', ['For loops']),\n        c('Loop analysis and statement execution counts', 4, 'core', ['Nested loops']),\n        c('Writing methods with parameters and returns', 4, 'core'),\n        c('Method decomposition', 4, 'core', ['Writing methods with parameters and returns']),\n        c('Informal runtime comparison', 3, 'important', ['Loop analysis and statement execution counts']),\n      ],\n      [\n        ['Off-by-one errors in loop bounds.', 'Trace the first and last iteration by hand. i <= length is the single most common runtime error in this course.'],\n        ['Returning inside a loop that still has work to do.', 'A return exits the method immediately. Accumulate first, return after.'],\n      ]),\n    u(3, 'Class Creation', [10, 18], 22,\n      'Writing a class from scratch: state, constructors, accessors, mutators, and the object-oriented conventions the rubric expects.',\n      [\n        c('Anatomy of a class', 3, 'core', ['Constructors and instantiating objects']),\n        c('Instance variables and encapsulation', 4, 'core', ['Anatomy of a class']),\n        c('Writing constructors', 3, 'core', ['Anatomy of a class']),\n        c('Accessor and mutator methods', 3, 'core', ['Instance variables and encapsulation']),\n        c('The keyword this', 4, 'core', ['Writing constructors']),\n        c('Static variables and methods', 4, 'core', ['Anatomy of a class']),\n        c('Scope and access modifiers', 4, 'core', ['Instance variables and encapsulation']),\n        c('Writing and using toString', 3, 'core', ['Anatomy of a class']),\n        c('Inheritance and method overriding', 4, 'important', ['Anatomy of a class']),\n        c('Polymorphism at runtime', 4, 'important', ['Inheritance and method overriding']),\n      ],\n      [\n        ['Declaring instance variables public.', 'Encapsulation is a graded expectation: private fields with public accessors.'],\n        ['Shadowing a field with a parameter of the same name and forgetting this.', 'Without this, the assignment does nothing useful.'],\n      ]),\n    u(4, 'Data Collections', [30, 40], 40,\n      'The heaviest unit: arrays, ArrayLists, 2D arrays, text files and the standard traversal algorithms.',\n      [\n        c('Array declaration and initialisation', 3, 'core', ['Primitive types and variables']),\n        c('Traversing arrays with for and enhanced for', 4, 'core', ['For loops', 'Array declaration and initialisation']),\n        c('Standard array algorithms', 4, 'core', ['Traversing arrays with for and enhanced for']),\n        c('ArrayList and its methods', 4, 'core', ['Objects, references and null']),\n        c('Traversing and modifying an ArrayList safely', 5, 'core', ['ArrayList and its methods']),\n        c('Standard ArrayList algorithms', 4, 'core', ['Traversing and modifying an ArrayList safely']),\n        c('2D array declaration and initialisation', 4, 'core', ['Array declaration and initialisation']),\n        c('Row-major traversal of 2D arrays', 5, 'core', ['2D array declaration and initialisation', 'Nested loops']),\n        c('Standard 2D array algorithms', 5, 'core', ['Row-major traversal of 2D arrays']),\n        c('Searching: linear and binary', 4, 'core', ['Standard array algorithms']),\n        c('Sorting: selection, insertion and merge', 4, 'core', ['Standard array algorithms']),\n        c('Reading text files and processing datasets', 4, 'core', ['Standard array algorithms']),\n        c('Recursion', 5, 'important', ['Writing methods with parameters and returns']),\n        c('Array and ArrayList out-of-bounds errors', 4, 'core', ['Traversing arrays with for and enhanced for']),\n      ],\n      [\n        ['Removing from an ArrayList inside a forward for loop.', 'Indices shift and elements get skipped. Iterate backwards, or do not increment after a removal.'],\n        ['Using .length on an ArrayList or .size() on an array.', 'Arrays use the field length; ArrayLists use the method size(); Strings use the method length().'],\n      ]),\n  ],\n});\n","axiom:curriculum/ap-english-language.js":"import { c, u, apBands, course } from 'axiom:curriculum/kit.js';\n\n/**\n * AP English Language is the one course here whose units are not weighted by\n * College Board: its nine units are a skill progression, not a content split,\n * and no per-unit exam percentage is published. Weighting them evenly would be\n * an invention. So the blueprint is built on the exam's own scored parts, whose\n * weights *are* published — 45% multiple choice split between reading and\n * writing questions, and three essays at 55% between them. That is also the\n * split a learner actually needs, because the three essays are three different\n * skills with three different rubrics.\n */\nexport default course({\n  key: 'ap-english-language',\n  title: 'AP English Language and Composition',\n  exam: 'AP English Language and Composition',\n  subject: 'English',\n  level: 'AP / first-year college composition',\n  aliases: ['ap english language', 'ap lang', 'ap english language and composition', 'ap english lang'],\n  source: 'Derived from the published AP exam structure; College Board does not publish per-unit weights for this course.',\n  overview:\n    'Nonfiction rhetoric: reading arguments for how they work, and writing arguments that work. The exam is 45 multiple-choice questions split between reading passages and revising a draft, then three essays in 2 hours 15 minutes — synthesis, rhetorical analysis and argument. Each essay is marked out of 6 on the same shape of rubric: one point for a defensible thesis, four for evidence and commentary, one for sophistication. Commentary is where almost everyone loses marks: explaining how the evidence supports the claim, not just naming a device.',\n  total_hours: 120,\n  exam_format: {\n    total_minutes: 195,\n    description:\n      'Section I is 45 multiple-choice questions in 60 minutes, worth 45%: roughly 23-25 reading questions across passages and 20-22 writing questions on revising a draft. Section II is three essays in 135 minutes including a 15-minute reading period, worth 55%: synthesis, rhetorical analysis and argument, each scored 0-6.',\n    sections: [\n      { name: 'Section I: Multiple Choice', question_type: 'mcq', count: 45, minutes: 60, weight_percent: 45, notes: 'Reading questions ask what a choice accomplishes; writing questions ask which revision best serves a stated purpose.' },\n      { name: 'Section II Q1: Synthesis Essay', question_type: 'essay', count: 1, minutes: 40, weight_percent: 18.33, notes: 'Six sources provided. Take a position and use at least three of them as evidence for your argument, not as a summary.' },\n      { name: 'Section II Q2: Rhetorical Analysis Essay', question_type: 'essay', count: 1, minutes: 40, weight_percent: 18.33, notes: 'Explain the choices a writer makes and the effect on the audience given the rhetorical situation.' },\n      { name: 'Section II Q3: Argument Essay', question_type: 'essay', count: 1, minutes: 40, weight_percent: 18.33, notes: 'No sources. Your own evidence, your own line of reasoning.' },\n    ],\n  },\n  score_bands: apBands([74, 61, 47, 33]),\n  units: [\n    u(1, 'Reading: Rhetorical Analysis (multiple choice)', 24, 24,\n      'The reading half of Section I: analysing passages for the rhetorical situation, the argument being made, and the effect of the writer\\'s choices.',\n      [\n        c('Rhetorical situation: exigence, audience, purpose', 3, 'core'),\n        c('Identifying the writer\\'s claim and line of reasoning', 4, 'core', ['Rhetorical situation: exigence, audience, purpose']),\n        c('Types of evidence and their effect', 4, 'core', [\"Identifying the writer's claim and line of reasoning\"]),\n        c('Appeals: ethos, pathos, logos', 3, 'core', ['Rhetorical situation: exigence, audience, purpose']),\n        c('Organisation and structural choices', 4, 'core'),\n        c('Diction, syntax and tone', 4, 'core'),\n        c('Figurative language and its function', 4, 'core', ['Diction, syntax and tone']),\n        c('Concessions, refutation and counterargument', 4, 'core', [\"Identifying the writer's claim and line of reasoning\"]),\n        c('Answering effect questions rather than identification questions', 5, 'core', ['Appeals: ethos, pathos, logos']),\n      ],\n      [\n        ['Choosing the option that names a real device in the passage.', 'The question usually asks what the device accomplishes. A correct label attached to the wrong effect is a wrong answer.'],\n      ]),\n    u(2, 'Writing: Revision and Composition (multiple choice)', 21, 18,\n      'The writing half of Section I: choosing the revision that best serves a stated purpose in a student draft.',\n      [\n        c('Thesis placement and revision', 4, 'core'),\n        c('Selecting relevant evidence for a purpose', 4, 'core'),\n        c('Transitions and coherence', 3, 'core'),\n        c('Sentence combining and syntactic clarity', 4, 'core'),\n        c('Modifiers, parallelism and precision', 3, 'core'),\n        c('Adjusting for audience and tone', 4, 'core', ['Rhetorical situation: exigence, audience, purpose']),\n        c('Citation and integrating sources', 3, 'important'),\n      ],\n      [\n        ['Picking the most elegant sentence rather than the one that does the stated job.', 'Every writing item names a goal. Answer the goal.'],\n      ]),\n    u(3, 'Synthesis Essay', 18.33, 26,\n      'Building an argument from six provided sources, using them as evidence rather than summarising them.',\n      [\n        c('Reading and annotating source sets under time', 4, 'core'),\n        c('Writing a defensible thesis for a synthesis prompt', 4, 'core'),\n        c('Selecting and integrating at least three sources', 4, 'core', ['Writing a defensible thesis for a synthesis prompt']),\n        c('Commentary that links evidence to the line of reasoning', 5, 'core', ['Selecting and integrating at least three sources']),\n        c('Handling counterargument in synthesis', 4, 'core'),\n        c('Sophistication: complexity and rhetorical control', 5, 'core', ['Commentary that links evidence to the line of reasoning']),\n      ],\n      [\n        ['Writing a source-by-source tour.', 'Organise by idea, not by document. Sources should appear where your argument needs them.'],\n      ]),\n    u(4, 'Rhetorical Analysis Essay', 18.33, 26,\n      'Explaining what a writer does, why, and to what effect — the essay most students score lowest on.',\n      [\n        c('Reading a passage for rhetorical choices', 4, 'core', ['Organisation and structural choices']),\n        c('Writing a thesis that states a line of reasoning about choices', 5, 'core', ['Reading a passage for rhetorical choices']),\n        c('Selecting evidence from the passage', 4, 'core', ['Writing a thesis that states a line of reasoning about choices']),\n        c('Commentary on effect, not identification of devices', 5, 'core', ['Selecting evidence from the passage']),\n        c('Connecting choices to the rhetorical situation', 5, 'core', ['Commentary on effect, not identification of devices']),\n        c('Sophistication in rhetorical analysis', 5, 'core', ['Connecting choices to the rhetorical situation']),\n      ],\n      [\n        ['Device-spotting: listing anaphora, then juxtaposition, then irony.', 'The rubric awards commentary. One choice explained thoroughly beats five named.'],\n      ]),\n    u(5, 'Argument Essay', 18.33, 24,\n      'A position defended with your own evidence — the essay with the most room for a fast score gain.',\n      [\n        c('Interpreting the prompt and taking a position', 3, 'core'),\n        c('Writing a defensible thesis for an argument prompt', 4, 'core', ['Interpreting the prompt and taking a position']),\n        c('Developing a line of reasoning across paragraphs', 4, 'core', ['Writing a defensible thesis for an argument prompt']),\n        c('Choosing specific evidence from knowledge and experience', 4, 'core', ['Developing a line of reasoning across paragraphs']),\n        c('Commentary that explains rather than restates', 5, 'core', ['Choosing specific evidence from knowledge and experience']),\n        c('Qualifying and addressing the other side', 4, 'core', ['Developing a line of reasoning across paragraphs']),\n        c('Sophistication in argument', 5, 'core', ['Commentary that explains rather than restates']),\n      ],\n      [\n        ['Generic evidence: \"throughout history, many people have...\".', 'One specific, named example carries the evidence point. Vagueness carries nothing.'],\n      ]),\n  ],\n});\n","axiom:curriculum/ap-environmental-science.js":"import { c, u, apBands, course } from 'axiom:curriculum/kit.js';\n\nexport default course({\n  key: 'ap-environmental-science',\n  title: 'AP Environmental Science',\n  exam: 'AP Environmental Science',\n  subject: 'Environmental Science',\n  level: 'AP / first-year college',\n  aliases: ['ap environmental science', 'apes', 'ap enviro', 'ap environmental'],\n  overview:\n    'Nine units spanning ecology, populations, earth systems, land and water use, energy, pollution and global change. Unit 9 is the heaviest at 15-20%, and the free-response section is mathematics-forward: three questions, one of which is explicitly a calculation question, all done without a calculator. Practising dimensional analysis by hand is usually worth more marks than rereading content.',\n  total_hours: 130,\n  exam_format: {\n    total_minutes: 160,\n    description:\n      'Section I is 80 multiple-choice questions in 90 minutes, worth 60%, including   []),\n    u(3, 'Populations', [10, 15], 16,\n      'Population ecology and human population dynamics.',\n      [\n        c('Generalist and specialist species', 3, 'core'),\n        c('K-selected and r-selected species', 3, 'core'),\n        c('Survivorship curves', 3, 'core', ['K-selected and r-selected species']),\n        c('Carrying capacity and population growth', 4, 'core'),\n        c('Population growth rate calculations', 4, 'core', ['Carrying capacity and population growth']),\n        c('Rule of 70 and doubling time', 4, 'core', ['Population growth rate calculations']),\n        c('Age structure diagrams', 4, 'core'),\n        c('Total fertility rate and demographic transition', 4, 'core', ['Age structure diagrams']),\n      ],\n      [\n        ['Reading an age structure diagram backwards.', 'A wide base means rapid growth ahead; an even or top-heavy one means a stable or shrinking population.'],\n      ]),\n    u(4, 'Earth Systems and Resources', [10, 15], 16,\n      'Plate tectonics, soil, the atmosphere, weather and global wind patterns.',\n      [\n        c('Plate tectonics', 3, 'core'),\n        c('Soil formation and erosion', 4, 'core'),\n        c('Soil composition and properties', 3, 'core', ['Soil formation and erosion']),\n        c('Earth atmosphere structure', 3, 'core'),\n        c('Global wind patterns', 4, 'core', ['Earth atmosphere structure']),\n        c('Watersheds', 3, 'core'),\n        c('Solar radiation and seasons', 3, 'core'),\n        c('El Nino and La Nina', 4, 'important', ['Global wind patterns']),\n      ],\n      []),\n    u(5, 'Land and Water Use', [10, 15], 18,\n      'Agriculture, forestry, mining, fishing and the sustainability of each.',\n      [\n        c('Tragedy of the commons', 3, 'core'),\n        c('Clearcutting and deforestation', 3, 'core'),\n        c('The Green Revolution', 3, 'core'),\n        c('Irrigation methods and their tradeoffs', 4, 'core'),\n        c('Pest control and integrated pest management', t.', 'Ground-level ozone is a secondary pollutant; stratospheric ozone is protective. Always say which layer.'],\n      ]),\n    u(8, 'Aquatic and Terrestrial Pollution', [7, 10], 14,\n      'Sources of pollution, waste, human health effects and dose-response.',\n      [\n        c('Point and nonpoint source pollution', 3, 'core'),\n        c('Endocrine disruptors and bioaccumulation', 4, 'core'),\n        c('Biomagnification', 4, 'core', ['Endocrine disruptors and bioaccumulation']),\n        c('Eutrophication and dead zones', 4, 'core'),\n        c('Thermal pollution', 3, 'core'),\n        c('Solid waste disposal and landfills', 3, 'core'),\n        c('Sewage treatment', 3, 'core'),\n        c('Dose response curves and LD50', 4, 'core'),\n        c('Pollution and human health: pathogens and disease', 3, 'core'),\n      ],\n      [\n        ['Mixing up bioaccumulation and biomagnification.', 'Accumulation is within one organism over time; magnification is up the food chain across trophic levels.'],\n      ]),\n    u(9, 'Global Change', [15, 20], 20,\n      'The heaviest unit: ozone depletion, climate change, invasive species and loss of biodiversity.',\n      [\n        c('Stratospheric ozone depletion', 4, 'core'),\n        c('Reducing ozone depletion and the Montreal Protocol', 3, 'core', ['Stratospheric ozone depletion']),\n        c('Greenhouse gases and the greenhouse effect', 4, 'core'),\n        c('Increases in the greenhouse gases', 4, 'core', ['Greenhouse gases and the greenhouse effect']),\n        c('Global climate change and feedback loops', 5, 'core', ['Increases in the greenhouse gases']),\n        c('Ocean warming and ocean acidification', 4, 'core', ['Global climate change and feedback loops']),\n        c('Invasive species', 3, 'core'),\n        c('Endangered species and human impacts on biodiversity', 4, 'core', ['Introduction to biodiversity']),\n        c('Sustainability and international agreements', 3, 'core'),\n      ],\n      [\n        ['Confusing ozone depletion with the greenhouse effect.', 'Different gases, different layers, different mechanisms. Examiners test the confusion directly.'],\n      ]),\n  ],\n});\n","axiom:curriculum/ap-macroeconomics.js":"import { c, u, apBands, course } from 'axiom:curriculum/kit.js';\n\nexport default course({\n  key: 'ap-macroeconomics',\n  title: 'AP Macroeconomics',\n  exam: 'AP Macroeconomics',\n  subject: 'Economics',\n  level: 'AP / first-semester college macroeconomics',\n  aliases: ['ap macroeconomics', 'ap macro'],\n  overview:\n    'Six units on how a whole economy behaves: measurement, short-run fluctuations, money and banking, long-run policy consequences, and the open economy. Units 3 to 5 are most of the exam. The free-response section is almost entirely graph-and-explain: draw the correct model, shift the right curve in the right direction, and say what happens to output, price level and interest rates, in that order.',\n  total_hours: 110,\n  exam_format: {\n    total_minutes: 130,\n    description:\n      'Section I is 60 multiple-choice questions in 70 minutes, worth two thirds. Section II is 3 free-response questions in 60 minutes including a 10-minute reading period, worth one third: one long question and two short. A calculator is permitted.',\n    sections: [\n      { name: 'Section I: Multiple Choice', question_type: 'mcq', count: 60, minutes: 70, weight_percent: 66.7, notes: 'Fast pace: just over a minute each. Many are chains of cause and effect through a model.' },\n      { name: 'Section II: Free Response', question_type: 'frq', count: 3, minutes: 60, weight_percent: 33.3, notes: 'Graphs must be labelled correctly to earn the point, including axis labels and the direction of every shift.' },\n    ],\n  },\n  score_bands: apBands([74, 61, 48, 35]),\n  units: [\n    u(1, 'Basic Economic Concepts', [5, 10], 12,\n      'Scarcity, opportunity cost, the production possibilities curve and comparative advantage.',\n      [\n        c('Scarcity and opportunity cost', 2, 'core'),\n        c('Resource allocation and economic systems', 2, 'core'),\n        c('Production possibilities curve', 3, 'core', ['Scarcity and opportunity cost']),\n        c('Comparative advantage and specialisation', 4, 'core', ['Production possibilities curve']),\n        c('Terms of trade', 4, 'core', ['Comparative advantage and specialisation']),\n        c('Supply, demand and market equilibrium', 3, 'core'),\n      ],\n      [\n        ['Confusing absolute and comparative advantage.', 'Comparative advantage is about lowest opportunity cost, and it is what drives gains from trade.'],\n      ]),\n    u(2, 'Economic Indicators and the Business Cycle', [12, 17], 18,\n      'Measuring the economy: GDP, unemployment, inflation and the business cycle.',\n      [\n        c('Circular flow and GDP', 3, 'core'),\n        c('Limitations of GDP', 3, 'core', ['Circular flow and GDP']),\n        c('Unemployment and its types', 3, 'core'),\n        c('Natural rate of unemployment', 4, 'core', ['Unemployment and its types']),\n        c('Price indices and inflation', 4, 'core'),\n        c('Real versus nominal values', 4, 'core', ['Price indices and inflation']),\n        c('Costs of inflation and deflation', 3, 'core', ['Price indices and inflation']),\n        c('Real interest rates and the Fisher equation', 4, 'core', ['Real versus nominal values']),\n        c('Business cycle and output gaps', 4, 'core'),\n      ],\n      [\n        ['Reporting a nominal change as real growth.', 'Deflate first. Nearly every calculation item in this unit turns on the real-versus-nominal distinction.'],\n      ]),\n    u(3, 'National Income and Price Determination', [17, 27], 26,\n      'Aggregate demand and supply, the multiplier, and short-run equilibrium.',\n      [\n        c('Aggregate demand', 4, 'core', ['Business cycle and output gaps']),\n        c('Determinants of aggregate demand', 4, 'core', ['Aggregate demand']),\n        c('Multiplier and spending effects', 4, 'core', ['Determinants of aggregate demand']),\n        c('Short-run aggregate supply', 4, 'core'),\n        c('Long-run aggregate supply', 4, 'core', ['Short-run aggregate supply']),\n        c('Equilibrium in the AD-AS model', 5, 'core', ['Aggregate demand', 'Short-run aggregate supply']),\n        c('Recessionary and inflationary gaps', 5, 'core', ['Equilibrium in the AD-AS model']),\n        c('Fiscal policy', 4, 'core', ['Recessionary and inflationary gaps']),\n        c('Automatic stabilisers', 3, 'core', ['Fiscal policy']),\n      ],\n      [\n        ['Shifting aggregate supply when a demand determinant changed.', 'Sort every shock into a demand or supply determinant before touching the graph.'],\n      ]),\n    u(4, 'Financial Sector', [18, 23], 24,\n      'Money, banking, the money market and monetary policy.',\n      [\n        c('Financial assets and their tradeoffs', 3, 'core'),\n        c('Nominal interest rates and the bond market', 4, 'core'),\n        c('Definitions and functions of money', 3, 'core'),\n        c('Banking and the money supply', 4, 'core', ['Definitions and functions of money']),\n        c('Money multiplier and required reserves', 4, 'core', ['Banking and the money supply']),\n        c('The money market', 5, 'core', ['Banking and the money supply']),\n        c('Monetary policy tools', 4, 'core', ['The money market']),\n        c('The loanable funds market', 5, 'core', ['Nominal interest rates and the bond market']),\n      ],\n      [\n        ['Mixing up the money market and the loanable funds market.', 'The money market has the nominal interest rate on the axis and a vertical money supply; loanable funds has the real rate and slopes.'],\n      ]),\n    u(5, 'Long-Run Consequences of Stabilization Policies', [20, 30], 26,\n      'Where the short run goes: the Phillips curve, crowding out, growth and public debt.',\n      [\n        c('Fiscal and monetary policy actions in the short run', 4, 'core', ['Fiscal policy', 'Monetary policy tools']),\n        c('Long-run self-adjustment', 5, 'core', ['Equilibrium in the AD-AS model']),\n        c('Short-run and long-run Phillips curves', 5, 'core', ['Long-run self-adjustment']),\n        c('Money growth and inflation in the long run', 4, 'core', ['Money multiplier and required reserves']),\n        c('Crowding out', 5, 'core', ['The loanable funds market', 'Fiscal policy']),\n        c('Economic growth and its determinants', 4, 'core', ['Long-run aggregate supply']),\n        c('Public policy, deficits and debt', 4, 'core', ['Crowding out']),\n      ],\n      [\n        ['Treating the long-run Phillips curve as downward sloping.', 'It is vertical at the natural rate. Only the short-run curve trades inflation against unemployment.'],\n      ]),\n    u(6, 'Open Economy: International Trade and Finance', [10, 13], 16,\n      'The balance of payments, foreign exchange markets and how they connect to domestic policy.',\n      [\n        c('Balance of payments accounts', 4, 'core'),\n        c('Foreign exchange market', 5, 'core', ['Balance of payments accounts']),\n        c('Determinants of exchange rates', 5, 'core', ['Foreign exchange market']),\n        c('Effects of exchange rates on net exports', 4, 'core', ['Determinants of exchange rates']),\n        c('Real interest rates and international capital flows', 5, 'core', ['The loanable funds market', 'Foreign exchange market']),\n      ],\n      [\n        ['Labelling the forex graph axes the wrong way round.', 'Choose which currency the market is for, put its price in the other currency on the vertical axis, and keep that consistent.'],\n      ]),\n  ],\n});\n","axiom:curriculum/ap-physics-1.js":"import { c, u, apBands, course } from 'axiom:curriculum/kit.js';\n\nexport default course({\n  key: 'ap-physics-1',\n  title: 'AP Physics 1: Algebra-Based',\n  exam: 'AP Physics 1',\n  subject: 'Physics',\n  level: 'AP / first-year college, algebra-based',\n  aliases: ['ap physics 1', 'ap physics one', 'ap phys 1', 'ap physics'],\n  overview:\n    'Algebra-based mechanics: motion, forces, energy, momentum, rotation, oscillations and — since the 2024-25 redesign — fluids. The exam rewards reasoning far more than plugging numbers in: roughly half the marks come from free response that asks you to justify, translate between representations, and design an experiment. Every free-response paper contains an experimental design and analysis question, and the multiple choice includes questions where more than one answer is correct.',\n  total_hours: 150,\n  exam_format: {\n    total_minutes: 180,\n    description:\n      'Section I is 40 multiple-choice questions in 80 minutes, worth 50%. Section II is 4 free-response questions in 100 minutes, worth the other 50%: Mathematical Routines, Translation Between Representations, Experimental Design and Analysis, and Qualitative/Quantitative Translation. A calculator and the equation sheet are allowed throughout.',\n    sections: [\n      { name: 'Section I: Multiple Choice', question_type: 'mcq', count: 40, minutes: 80, weight_percent: 50, notes: 'Single-select, with some items where you choose two correct options. Many are answerable by reasoning about proportionality without computing anything.' },\n      { name: 'Section II: Free Response', question_type: 'frq', count: 4, minutes: 100, weight_percent: 50, notes: 'Marks are awarded for justification and for connecting representations. An unsupported correct number scores very little.' },\n    ],\n  },\n  score_bands: apBands([70, 56, 41, 27]),\n  units: [\n    u(1, 'Kinematics', [10, 15], 16,\n      'Describing motion in one and two dimensions with position, velocity and acceleration, and moving fluently between the graph, the equation and the physical story.',\n      [\n        c('Scalars and vectors', 2, 'core'),\n        c('Displacement, velocity, acceleration', 2, 'core'),\n        c('Position-time and velocity-time graphs', 3, 'core', ['Displacement, velocity, acc
