hema validator (the subset the generation schemas use) plus\n * the semantic checks that actually matter for educational material.\n */\n\nfunction typeOf(value) {\n  if (value === null) return 'null';\n  if (Array.isArray(value)) return 'array';\n  if (Number.isInteger(value)) return 'integer';\n  return typeof value;\n}\n\nfunction matchesType(value, type) {\n  const actual = typeOf(value);\n  if (type === 'number') return actual === 'number' || actual === 'integer';\n  if (type === 'integer') return actual === 'integer';\n  return actual === type;\n}\n\nexport function validate(value, schema, path = '$') {\n  const errors = [];\n  if (!schema) return errors;\n\n  if (schema.anyOf) {\n    const ok = schema.anyOf.some((sub) => validate(value, sub, path).length === 0);\n    if (!ok) errors.push(`${path}: does not match any allowed shape`);\n    return errors;\n  }\n\n  const types = Array.isArray(schema.type) ? schema.type : schema.type ? [schema.type] : [];\n  if (types.length && !types.some((t) => matchesType(value, t))) {\n    errors.push(`${path}: expected ${types.join('|')}, got ${typeOf(value)}`);\n    return errors;\n  }\n\n  if (schema.enum && !schema.enum.includes(value)) {\n    errors.push(`${path}: \"${value}\" is not one of ${schema.enum.join(', ')}`);\n  }\n  if (typeof value === 'number') {\n    if (schema.minimum != null && value < schema.minimum) errors.push(`${path}: below minimum`);\n    if (schema.maximum != null && value > schema.maximum) errors.push(`${path}: above maximum`);\n  }\n  if (typeOf(value) === 'object' && schema.properties) {\n    for (const key of schema.required || []) {\n      if (!(key in value)) errors.push(`${path}.${key}: missing`);\n    }\n    for (const [key, sub] of Object.entries(schema.properties)) {\n      if (key in value) errors.push(...validate(value[key], sub, `${path}.${key}`));\n    }\n  }\n  if (Array.isArray(value) && schema.items) {\n    value.forEach((item, i) => errors.push(...validate(item, schema.items, `${path}[${i}]`)));\n  }\n  return errors;\n}\n\n/** Fill in structurally missing pieces so one malformed field cannot break a render. */\nexport function coerce(value, schema) {\n  if (!schema) return value;\n  if (schema.anyOf) {\n    for (const sub of schema.anyOf) {\n      if (validate(value, sub).length === 0) return value;\n    }\n    const nullable = schema.anyOf.some((s) => s.type === 'null');\n    if (nullable && (value == null || typeof value !== 'object')) return null;\n    const objectBranch = schema.anyOf.find((s) => s.type === 'object');\n    return objectBranch && value && typeof value === 'object' ? coerce(value, objectBranch) : null;\n  }\n  const types = Array.isArray(schema.type) ? schema.type : schema.type ? [schema.type] : [];\n\n  if (types.includes('object')) {\n    const out = value && typeof value === 'object' && !Array.isArray(value) ? { ...value } : {};\n    for (const [key, sub] of Object.entries(schema.properties || {})) {\n      out[key] = coerce(out[key], sub);\n    }\n    return out;\n  }\n  if (types.includes('array')) {\n    const list = Array.isArray(value) ? value : [];\n    return list.map((item) => coerce(item, schema.items));\n  }\n  if (types.includes('null') && value == null) return null;\n  if (types.includes('string')) {\n    if (typeof value === 'string') return value;\n    if (value == null) return '';\n    return String(value);\n  }\n  if (types.includes('number') || types.includes('integer')) {\n    const n = Number(value);\n    if (!Number.isFinite(n)) return schema.minimum ?? 0;\n    return types.includes('integer') ? Math.round(n) : n;\n  }\n  if (types.includes('boolean')) return Boolean(value);\n  return value;\n}\n\n/* --------------------------------------------------- educational inspection */\n\nconst normalise = (s) =>\n  String(s || '')\n    .toLowerCase()\n    .replace(/[^a-z0-9]+/g, ' ')\n    .trim();\n\n/**\n * Deterministic defects we can catch without asking a model. These are cheap,\n * certain, and run on every generated question set before a learner sees it.\n */\nexport function inspectQuestions(questions = [], { difficulty = 3 } = {}) {\n  const problems = [];\n  const seen = new Map();\n\n  questions.forEach((q, index) => {\n    const at = q.id || `#${index + 1}`;\n    if (!q.prompt || q.prompt.trim().length < 8) {\n      problems.push({ question_id: at, issue: 'ambiguous', detail: 'Question prompt is missing or too short.' });\n    }\n    if (!q.solution || q.solution.trim().length < 8) {\n      problems.push({ question_id: at, issue: 'bad_explanation', detail: 'No worked solution supplied.' });\n    }\n    if (!String(q.answer ?? '').trim()) {\n      problems.push({ question_id: at, issue: 'wrong_answer', detail: 'Answer key is empty.' });\n    }\n\n    if (q.type === 'multiple_choice' || q.type === 'true_false') {\n      const keys = (q.choices || []).map((c) => String(c.key || '').trim().toUpperCase());\n      if (keys.length < 2) {\n        problems.push({ question_id: at, issue: 'no_correct_choice', detail: 'Fewer than two options.' });\n      }\n      if (new Set(keys).size !== keys.length) {\n        problems.push({ question_id: at, issue: 'duplicate', detail: 'Duplicate option keys.' });\n      }\n      const texts = (q.choices || []).map((c) => normalise(c.text));\n      if (new Set(texts).size !== texts.length) {\n        problems.push({ question_id: at, issue: 'duplicate', detail: 'Two options say the same thing.' });\n      }\n      const key = String(q.answer || '').trim().toUpperCase();\n      if (!keys.includes(key)) {\n        problems.push({\n          question_id: at,\n          issue: 'no_correct_choice',\n          detail: `Answer key \"${q.answer}\" is not one of the options (${keys.join(', ')}).`,\n        });\n      }\n    }\n\n    if (q.type === 'numeric') {\n      const value = Number(String(q.answer).replace(/[^0-9eE+\\-.]/g, ''));\n      if (!Number.isFinite(value)) {\n        problems.push({ question_id: at, issue: 'wrong_answer', detail: 'Numeric answer does not parse as a number.' });\n      }\n    }\n\n    if (['free_response', 'essay', 'proof', 'coding'].includes(q.type)) {\n      const total = (q.rubric || []).reduce((sum, r) => sum + (Number(r.points) || 0), 0);\n      if (!q.rubric?.length) {\n        problems.push({ question_id: at, issue: 'bad_explanation', detail: 'Open-response question has no rubric.' });\n      } else if (q.points && Math.abs(total - q.points) > 0.51) {\n        problems.push({\n          question_id: at,\n          issue: 'bad_explanation',\n          detail: `Rubric sums to ${total} but the question is worth ${q.points}.`,\n        });\n      }\n    }\n\n    const answerText = normalise(q.answer);\n    if (answerText.length > 3) {\n      for (const hint of q.hints || []) {\n        if (normalise(hint).includes(answerText)) {\n          problems.push({ question_id: at, issue: 'bad_explanation', detail: 'A hint gives away the answer.' });\n          break;\n        }\n      }\n    }\n\n    if (q.difficulty < 1 || q.difficulty > 5) {\n      problems.push({ question_id: at, issue: 'off_level', detail: 'Difficulty outside 1-5.' });\n    } else if (Math.abs(q.difficulty - difficulty) > 2.5) {\n      problems.push({\n        question_id: at,\n        issue: 'off_level',\n        detail: `Difficulty ${q.difficulty} is far from the requested ${difficulty}.`,\n      });\n    }\n\n    const stem = normalise(q.prompt).slice(0, 90);\n    if (stem && seen.has(stem)) {\n      problems.push({ question_id: at, issue: 'duplicate', detail: `Duplicates question ${seen.get(stem)}.` });\n    } else if (stem) {\n      seen.set(stem, at);\n    }\n  });\n\n  return problems;\n}\n\n/** Ensure ids exist and are unique so the frontend can key on them. */\nexport function normaliseQuestionIds(questions = []) {\n  const used = new Set();\n  return questions.map((q, i) => {\n    let candidate = String(q.id || '').trim() || `q${i + 1}`;\n    while (used.has(candidate)) candidate = `${candidate}b`;\n    used.add(candidate);\n    return { ...q, id: candidate };\n  });\n}\n","axiom:browser/sources.js":"import { getSource } from 'axiom:browser/store.js';\n\nconst MAX_TEXT_CHARS = 120000;\n\n/**\n * Browser replacement for server/engine/sources.js.\n *\n * Same contract, minus the filesystem: binary sources were read into base64\n * when they were uploaded, so they go straight back up as document or image\n * blocks without a round trip through disk.\n */\nexport function sourceBlocks(sourceIds = [], learnerId) {\n  const blocks = [];\n  for (const sourceId of sourceIds) {\n    const source = getSource(sourceId);\n    if (!source || source.learner_id !== learnerId) continue;\n\n    if (source.kind === 'pdf' && source.data) {\n      blocks.push({\n        type: 'document',\n        source: { type: 'base64', media_type: 'application/pdf', data: source.data },\n        title: source.name,\n      });\n    } else if (source.kind === 'image' && source.data) {\n      blocks.push({\n        type: 'image',\n        source: { type: 'base64', media_type: source.mime, data: source.data },\n      });\n    } else if (source.text) {\n      blocks.push({\n        type: 'text',\n        text: `<source name=\"${source.name}\">\\n${source.text.slice(0, MAX_TEXT_CHARS)}\\n</source>`,\n      });\n    }\n  }\n  return blocks;\n}\n\n/** A short prompt fragment naming the attached sources. */\nexport function sourceContext(sourceIds = [], learnerId) {\n  const names = sourceIds\n    .map((sourceId) => getSource(sourceId))\n    .filter((s) => s && s.learner_id === learnerId)\n    .map((s) => s.name);\n  if (!names.length) return '';\n  return [\n    '<source_material>',\n    `The learner attached: ${names.join(', ')}. Everything you teach or assess here must come`,\n    'from that material. Do not introduce facts it does not contain; if it omits something',\n    'important, say so explicitly rather than filling the gap silently.',\n    '</source_material>',\n  ].join('\\n');\n}\n","axiom:server/util/sse.js":"/** Server-sent events helper with heartbeats and safe JSON framing. */\nexport function openStream(res) {\n  res.writeHead(200, {\n    'Content-Type': 'text/event-stream; charset=utf-8',\n    'Cache-Control': 'no-cache, no-transform',\n    Connection: 'keep-alive',\n    'X-Accel-Buffering': 'no',\n  });\n  res.flushHeaders?.();\n\n  const heartbeat = setInterval(() => {\n    if (!res.writableEnded) res.write(': ping\\n\\n');\n  }, 15000);\n\n  let closed = false;\n  const send = (event, data) => {\n    if (closed || res.writableEnded) return;\n    res.write(`event: ${event}\\ndata: ${JSON.stringify(data ?? {})}\\n\\n`);\n  };\n  const close = () => {\n    if (closed) return;\n    closed = true;\n    clearInterval(heartbeat);\n    if (!res.writableEnded) res.end();\n  };\n\n  res.on('close', () => {\n    closed = true;\n    clearInterval(heartbeat);\n  });\n\n  return { send, close, isClosed: () => closed };\n}\n\n/** Wrap a streaming handler so every failure reaches the client as an event. */\nexport async function streamHandler(res, fn) {\n  const stream = openStream(res);\n  try {\n    await fn(stream);\n  } catch (err) {\n    stream.send('error', {\n      message: err?.message || 'Something went wrong.',\n      status: err?.status ?? 500,\n      retryable: Boolean(err?.retryable),\n    });\n  } finally {\n    stream.close();\n  }\n}\n\n/** Throttle partial updates so the browser is not flooded. */\nexport function throttle(fn, ms = 70) {\n  let last = 0;\n  let pending = null;\n  let timer = null;\n  return (...args) => {\n    pending = args;\n    const now = Date.now();\n    if (now - last >= ms) {\n      last = now;\n      fn(...pending);\n      pending = null;\n      return;\n    }\n    if (!timer) {\n      timer = setTimeout(() => {\n        timer = null;\n        if (pending) {\n          last = Date.now();\n          fn(...pending);\n          pending = null;\n        }\n      }, ms - (now - last));\n    }\n  };\n}\n","axiom:server/engine/router.js":"import { llm } from 'axiom:server/llm/index.js';\nimport { renderPrompt, systemPrompt } from 'axiom:browser/prompts.js';\nimport { routeSchema } from 'axiom:server/schemas/index.js';\nimport { coerce } from 'axiom:server/engine/validate.js';\nimport { buildProfile, profileContext } from 'axiom:server/engine/profile.js';\nimport { sourceBlocks, sourceContext } from 'axiom:browser/sources.js';\nimport { createSession, upsertConcept, logEvent } from 'axiom:browser/store.js';\nimport { nextDifficulty } from 'axiom:server/engine/difficulty.js';\n\n/** Work out what learning experience the request actually calls for. */\nexport async function routeRequest({ learnerId, request, sourceIds = [], profile: given }) {\n  const profile = given || buildProfile(learnerId);\n\n  const { object } = await llm().run({\n    label: 'route',\n    system: [{ text: systemPrompt(), cache: true }],\n    messages: [\n      {\n        role: 'user',\n        content: [\n          ...sourceBlocks(sourceIds, learnerId),\n          {\n            type: 'text',\n            text: renderPrompt('route', {\n              request,\n              learner_context: profileContext(profile),\n              source_context: sourceContext(sourceIds, learnerId),\n            }),\n          },\n        ],\n      },\n    ],\n    schema: routeSchema,\n    effort: 'medium',\n    maxTokens: 4000,\n  });\n\n  const route = coerce(object, routeSchema);\n  route.concepts = (route.concepts || []).filter(Boolean).slice(0, 8);\n  return route;\n}\n\n/** Route a request and open a session around it. */\nexport async function startSession({ learnerId, request, sourceIds = [] }) {\n  const profile = buildProfile(learnerId);\n  const route = await routeRequest({ learnerId, request, sourceIds, profile });\n\n  const concepts = route.concepts.map((name) =>\n    upsertConcept(learnerId, { name, subject: route.subject || 'General' }),\n  );\n\n  // Start at the difficulty this learner has actually earned on these concepts.\n  const known = concepts.filter((c) => c.attempts > 0);\n  const difficulty = known.length\n    ? known.reduce((sum, c) => sum + nextDifficulty(c, { streak: c.streak }), 0) / known.length\n    : route.difficulty;\n\n  const session = createSession(learnerId, {\n    title: route.title || request.slice(0, 60),\n    mode: route.mode,\n    subject: route.subject,\n    topic: route.topic,\n    plan: route,\n    state: {\n      phase: route.needs_diagnostic ? 'diagnose' : 'teach',\n      focusConcept: route.concepts[0] || route.topic,\n      conceptIds: concepts.map((c) => c.id),\n      difficulty: Math.round(difficulty * 2) / 2,\n      strategy: profile.strategy?.strategy || 'diagnose',\n      turnCount: 0,\n      sourceIds,\n      timeMinutes: route.time_minutes,\n      pendingQuestion: null,\n      attemptNumber: 1,\n    },\n  });\n\n  logEvent(learnerId, 'session_started', { sessionId: session.id, intent: route.intent, topic: route.topic });\n  return { session, route, concepts };\n}\n","axiom:server/engine/tutor.js":"import { llm } from 'axiom:server/llm/index.js';\nimport { renderPrompt, systemPrompt } from 'axiom:browser/prompts.js';\nimport { tutorTurnSchema } from 'axiom:server/schemas/index.js';\nimport { coerce, normaliseQuestionIds } from 'axiom:server/engine/validate.js';\nimport { buildProfile, profileContext } from 'axiom:server/engine/profile.js';\nimport { sourceBlocks, sourceContext } from 'axiom:browser/sources.js';\nimport { evaluateAnswer } from 'axiom:server/engine/evaluate.js';\nimport { nextDifficulty } from 'axiom:server/engine/difficulty.js';\nimport { addMessage, listMessages, getSession, updateSession, logEvent } from 'axiom:browser/store.js';\nimport { logger } from 'axiom:server/util/log.js';\n\nconst log = logger('tutor');\n\n/** Directives the UI can send that are not the learner speaking. */\nconst DIRECTIVES = {\n  hint: 'The learner pressed \"I\\'m stuck\" and asked for a HINT. Give the smallest possible nudge — one sentence pointing at what to look at next. Do not reveal a step of the solution, and do not re-explain the concept. Keep the same activity open.',\n  bigger_hint:\n    'The learner asked for a BIGGER HINT. Reveal the next single reasoning step only, then hand the problem straight back. Do not finish it for them.',\n  explain:\n    'The learner asked for an EXPLANATION of the underlying idea. Re-teach the specific concept blocking them — using a different representation from the one you already used — then re-ask an equivalent question.',\n  worked_example:\n    'The learner asked for a WORKED EXAMPLE. Show a fully worked *similar* problem (not the one they are on), with every step justified, then hand them back their own problem.',\n  start_over:\n    'The learner asked to START OVER from the prerequisite. Drop down one level, check the prerequisite skill with a quick question, and rebuild from there.',\n  harder:\n    'The learner asked to MAKE IT HARDER. The next activity must be genuinely harder — more steps, an unfamiliar context, two concepts combined, or scaffolding removed. Changing the numbers is not harder.',\n  easier:\n    'The learner is struggling and asked to MAKE IT EASIER. Reduce the load: scaffold the steps, simplify the numbers or context, and rebuild confidence before climbing again.',\n  next_concept:\n    'Move to the next concept in the session plan. Say in one line why the current one is done.',\n  explain_more: 'The learner wants more depth on what you just said. Go deeper, and keep it concrete.',\n  mode_switch:\n    'The learner has changed the teaching mode. Adopt the mode named in their message from this point on, say in one line what changes, and carry on from where the session stands. Do not grade or re-read their message as an answer to the open question.',\n  continue: 'Continue the session from where it stands.',\n};\n\nfunction serialiseHistory(messages, limit = 12) {\n  return messages\n    .slice(-limit)\n    .map((m) => {\n      const body = m.body || {};\n      if (m.role === 'user') return `LEARNER: ${String(body.text || '').slice(0, 1500)}`;\n      const activity = body.activity?.question;\n      return [\n        `TUTOR (${body.intent || 'teach'}): ${String(body.say || '').slice(0, 1500)}`,\n        activity ? `TUTOR ASKED: ${activity.prompt}${activity.choices?.length ? `\\n${activity.choices.map((c) => `${c.key}. ${c.text}`).join('\\n')}` : ''}` : '',\n      ]\n        .filter(Boolean)\n        .join('\\n');\n    })\n    .join('\\n\\n');\n}\n\nfunction serialiseEvaluation(outcome) {\n  if (!outcome) return '';\n  const { grade, concept, next } = outcome;\n  return [\n    '<evaluation of=\"the answer the learner just submitted\">',\n    `Verdict: ${grade.verdict} (${grade.score}/${grade.max_score})`,\n    `Error type: ${grade.error_type}`,\n    grade.misconception ? `Misconception: ${grade.misconception}` : '',\n    grade.what_went_right ? `Got right: ${grade.what_went_right}` : '',\n    `Concept \"${concept.name}\" is now level ${concept.mastery_level}/5, ability ${concept.ability.toFixed(1)}.`,\n    `Recommended next move: ${grade.next_move}. Strategy: ${next.strategy} — ${next.reason}`,\n    `Target difficulty for the next item: ${next.difficulty}.`,\n    'Address this evaluation directly in your turn. Do not grade it again — explain and act on it.',\n    '</evaluation>',\n  ]\n    .filter(Boolean)\n    .join('\\n');\n}\n\n/**\n * Run one turn of the adaptive teaching loop.\n *\n * If a question is open and the learner has answered it, the answer is graded\n * first and the grade is fed to the tutor, so the turn is a *response* to what\n * their answer revealed rather than a fresh monologue.\n */\nexport async function runTutorTurn({ learnerId, sessionId, input = '', directive = null, onPartial, onEvaluation }) {\n  const session = getSession(sessionId);\n  if (!session) throw new Error('Session not found');\n  if (session.learner_id !== learnerId) throw new Error('Session not found');\n\n  const state = session.state || {};\n  const profile = buildProfile(learnerId);\n  const messages = listMessages(sessionId);\n\n  let evaluation = null;\n  const answersOpenQuestion =\n    state.pendingQuestion && input && input.trim() && !directive;\n\n  if (answersOpenQuestion) {\n    try {\n      evaluation = await evaluateAnswer({\n        learnerId,\n        sessionId,\n        question: state.pendingQuestion,\n        answer: input,\n        attemptNumber: state.attemptNumber || 1,\n        elapsedMs: state.questionAskedAt ? Date.now() - state.questionAskedAt : null,\n        subject: session.subject || 'General',\n        profile,\n      });\n      if (onEvaluation) onEvaluation(evaluation);\n    } catch (err) {\n      log.warn(`grading the open question failed, continuing as conversation: ${err.message}`);\n    }\n  }\n\n  addMessage(sessionId, 'user', {\n    text: input,\n    directive,\n    answeredQuestionId: answersOpenQuestion ? state.pendingQuestion.id : null,\n  });\n\n  const directiveText = directive ? `<app_directive>${DIRECTIVES[directive] || DIRECTIVES.continue}</app_directive>` : '';\n  const focusConcept = evaluation?.concept?.name || state.focusConcept || session.topic;\n  const targetDifficulty = evaluation?.next?.difficulty ?? state.difficulty ?? session.plan?.difficulty ?? 3;\n  const strategy = evaluation?.next\n    ? `${evaluation.next.strategy} — ${evaluation.next.reason}`\n    : `${profile.strategy.strategy} — ${profile.strategy.reason}`;\n\n  const promptText = renderPrompt('tutor', {\n    learner_context: profileContext(profile, { focusConcepts: [focusConcept] }),\n    mode: session.mode,\n    topic: session.topic || session.title,\n    concepts: (session.plan?.concepts || []).join(', '),\n    plan: session.plan?.opening_note || '',\n    phase: state.phase || 'teach',\n    difficulty: targetDifficulty,\n    strategy,\n    source_context: sourceContext(state.sourceIds || [], learnerId),\n    history: serialiseHistory(messages),\n    input: input || '(the learner did not type anything — act on the directive)',\n    evaluation: [serialiseEvaluation(evaluation), directiveText].filter(Boolean).join('\\n\\n'),\n  });\n\n  const { object } = await llm().run({\n    label: 'tutor-turn',\n    system: [{ text: systemPrompt(), cache: true }],\n    messages: [\n      {\n        role: 'user',\n        content: [...sourceBlocks(state.sourceIds || [], learnerId), { type: 'text', text: promptText }],\n      },\n    ],\n    schema: tutorTurnSchema,\n    effort: 'high',\n    maxTokens: 12000,\n    onPartial: onPartial ? (partial) => onPartial(partial) : undefined,\n  });\n\n  const turn = coerce(object, tutorTurnSchema);\n  if (turn.activity?.question) {\n    turn.activity.question = normaliseQuestionIds([turn.activity.question])[0];\n    if (!turn.activity.question.concept) turn.activity.question.concept = focusConcept;\n  }\n\n  addMessage(sessionId, 'tutor', turn);\n\n  const repeatedQuestion =\n    state.pendingQuestion && turn.activity?.question?.prompt === state.pendingQuestion.prompt;\n\n  updateSession(sessionId, {\n    state: {\n      ...state,\n      phase: phaseFor(turn.intent, state.phase),\n      focusConcept: turn.focus_concept || focusConcept,\n      difficulty: turn.difficulty || targetDifficulty,\n      strategy: evaluation?.next?.strategy || state.strategy,\n      turnCount: (state.turnCount || 0) + 1,\n      pendingQuestion: turn.activity?.question || null,\n      questionAskedAt: turn.activity?.question ? Date.now() : null,\n      attemptNumber: repeatedQuestion ? (state.attemptNumber || 1) + 1 : 1,\n      lastMastery: turn.mastery_signal,\n    },\n  });\n\n  logEvent(learnerId, 'tutor_turn', { sessionId, intent: turn.intent, concept: turn.focus_concept });\n  return { turn, evaluation };\n}\n\nfunction phaseFor(intent, current) {\n  switch (intent) {\n    case 'diagnose':\n      return 'diagnose';\n    case 'teach':\n    case 'demonstrate':\n    case 'reteach':\n      return 'teach';\n    case 'probe':\n    case 'assess':\n      return 'assess';\n    case 'feedback':\n      return 'adapt';\n    case 'advance':\n      return 'advance';\n    case 'wrap_up':\n      return 'complete';\n    default:\n      return current || 'teach';\n  }\n}\n\nexport function nextTargetDifficulty(concept) {\n  return nextDifficulty(concept, { streak: concept?.streak || 0 });\n}\n\nexport { DIRECTIVES };\n","axiom:server/engine/generate.js":"import { llm } from 'axiom:server/llm/index.js';\nimport { config } from 'axiom:browser/config.js';\nimport { renderPrompt, systemPrompt } from 'axiom:browser/prompts.js';\nimport {\n  lessonSchema,\n  practiceSchema,\n  studyGuideSchema,\n  flashcardSchema,\n  planSchema,\n  qcSchema,\n} from 'axiom:server/schemas/index.js';\nimport { buildProfile, profileContext } from 'axiom:server/engine/profile.js';\nimport { coerce, validate, inspectQuestions, normaliseQuestionIds } from 'axiom:server/engine/validate.js';\nimport { sourceBlocks, sourceContext } from 'axiom:browser/sources.js';\nimport { saveResource, upsertConcept, logEvent } from 'axiom:browser/store.js';\nimport { logger } from 'axiom:server/util/log.js';\n\nconst log = logger('generate');\n\n/** Every resource kind the engine can build, and how it is built. */\nexport const RESOURCE_KINDS = {\n  lesson: { schema: lessonSchema, prompt: 'lesson', family: 'lesson' },\n  practice_set: { schema: practiceSchema, prompt: 'practice', family: 'practice' },\n  worksheet: { schema: practiceSchema, prompt: 'practice', family: 'practice' },\n  quiz: { schema: practiceSchema, prompt: 'practice', family: 'practice' },\n  test: { schema: practiceSchema, prompt: 'practice', family: 'practice' },\n  homework: { schema: practiceSchema, prompt: 'practice', family: 'practice' },\n  exam_prep: { schema: practiceSchema, prompt: 'practice', family: 'practice' },\n  problem_set: { schema: practiceSchema, prompt: 'practice', family: 'practice' },\n  diagnostic: { schema: practiceSchema, prompt: 'practice', family: 'practice' },\n  mastery_check: { schema: practiceSchema, prompt: 'practice', family: 'practice' },\n  review: { schema: practiceSchema, prompt: 'practice', family: 'practice' },\n  project: { schema: practiceSchema, prompt: 'practice', family: 'practice' },\n  lab: { schema: practiceSchema, prompt: 'practice', family: 'practice' },\n  coding_exercise: { schema: practiceSchema, prompt: 'practice', family: 'practice' },\n  essay_prompt: { schema: practiceSchema, prompt: 'practice', family: 'practice' },\n  saq: { schema: practiceSchema, prompt: 'practice', family: 'practice' },\n  dbq: { schema: practiceSchema, prompt: 'practice', family: 'practice' },\n  leq: { schema: practiceSchema, prompt: 'practice', family: 'practice' },\n  study_guide: { schema: studyGuideSchema, prompt: 'study_guide', family: 'study_guide' },\n  flashcards: { schema: flashcardSchema, prompt: 'flashcards', family: 'flashcards' },\n  plan: { schema: planSchema, prompt: 'plan', family: 'plan' },\n};\n\n/**\n * What makes a DBQ a DBQ rather than a quiz with long answers. These are\n * appended to the learner's own instructions, never shown to them.\n */\nconst KIND_BRIEFS = {\n  project: [\n    'This is a PROJECT brief, not a question set. Produce 1-3 items: a build/investigate task with a',\n    'clear deliverable, staged milestones in `context`, and a rubric that a teacher could mark against.',\n    'Use type \"free_response\" and make the rubric the real specification.',\n  ],\n  lab: [\n    'This is a LAB ACTIVITY. Give the aim, apparatus and method in `context`, then items that require',\n    'predicting, recording, analysing and evaluating — including one on sources of error and one that',\n    'asks what the result would be if a stated variable changed. Type \"free_response\" with rubrics.',\n  ],\n  coding_exercise: [\n    'These are CODING exercises. Each `context` carries any starter code or signature; the prompt states',\n    'the required behaviour and the edge cases that must be handled. Type \"coding\". `solution` must be a',\n    'complete, working implementation with the reasoning behind it. Rubrics score correctness, edge-case',\n    'handling and clarity separately.',\n  ],\n  essay_prompt: [\n    'These are ESSAY prompts. Each states a genuinely arguable claim, names the scope, and carries a',\n    'rubric covering thesis, evidence, analysis and structure. Type \"essay\". `solution` is a model',\n    'outline with the line of argument, not a finished essay.',\n  ],\n  saq: [\n    'These are AP-style SHORT ANSWER QUESTIONS. Each has parts (a), (b), (c) in one prompt, each part',\n    'worth one point and demanding a specific historical example — no general commentary. Where a',\n    'stimulus is used, put it in `context`. Type \"free_response\"; the rubric must state exactly what',\n    'earns each point, and `solution` must model a scoring answer for each part.',\n  ],\n  dbq: [\n    'This is a DOCUMENT-BASED QUESTION. Put a numbered set of short primary-source excerpts in `context`',\n    '(attributed, varied in viewpoint), then a single prompt requiring a thesis supported by the',\n    'documents plus outside evidence. Type \"essay\". The rubric must follow the standard DBQ points:',\n    'thesis, contextualisation, evidence from the documents, outside evidence, sourcing, complexity.',\n  ],\n  leq: [\n    'This is a LONG ESSAY QUESTION. One prompt requiring a defensible thesis across a stated period,',\n    'with a rubric for thesis, contextualisation, evidence, analysis and complexity. Type \"essay\".',\n    '`solution` is a model outline with the argument and the evidence it rests on.',\n  ],\n};\n\nconst DEFAULT_COUNTS = {\n  practice_set: 6,\n  worksheet: 10,\n  quiz: 8,\n  test: 15,\n  homework: 8,\n  exam_prep: 12,\n  problem_set: 8,\n  diagnostic: 3,\n  mastery_check: 5,\n  review: 6,\n  flashcards: 12,\n  project: 1,\n  lab: 5,\n  coding_exercise: 4,\n  essay_prompt: 3,\n  saq: 3,\n  dbq: 1,\n  leq: 1,\n};\n\nconst clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));\n\n/**\n * Generate one educational resource, quality-check it, and persist it.\n * This is the single entry point behind every \"make me a ...\" in the product.\n */\nexport async function generateResource(options) {\n  const {\n    learnerId,\n    kind,\n    topic,\n    subject = 'General',\n    level = '',\n    concepts = [],\n    instructions = '',\n    sourceIds = [],\n    sessionId = null,\n    onPartial,\n    profile: providedProfile,\n  } = options;\n\n  const spec = RESOURCE_KINDS[kind];\n  if (!spec) throw new Error(`Unknown resource kind: ${kind}`);\n\n  const profile = providedProfile || buildProfile(learnerId);\n  const difficulty = clamp(Number(options.difficulty) || suggestedDifficulty(profile, concepts), 1, 5);\n  const count = clamp(Number(options.count) || DEFAULT_COUNTS[kind] || 6, 1, 40);\n  const minutes = clamp(Number(options.minutes) || 20, 3, 600);\n  const days = clamp(Number(options.days) || 7, 1, 60);\n\n  const vars = {\n    kind,\n    topic,\n    subject,\n    level: level || profile.learner?.prefs?.level || 'infer from the learner model',\n    difficulty,\n    count,\n    minutes,\n    days,\n    goal: options.goal || topic,\n    exam_context: options.examContext || '',\n    types: (options.types && options.types.length ? options.types : ['a mix appropriate to the subject']).join(', '),\n    concepts: concepts.length ? concepts.join(', ') : topic,\n    instructions: [KIND_BRIEFS[kind]?.join('\\n'), instructions].filter(Boolean).join('\\n\\n'),\n    learner_context: profileContext(profile, { focusConcepts: concepts }),\n    source_context: sourceContext(sourceIds, learnerId),\n  };\n\n  const userBlocks = [\n    ...sourceBlocks(sourceIds, learnerId),\n    { type: 'text', text: renderPrompt(spec.prompt, vars) },\n  ];\n\n  const started = Date.now();\n  const { object } = await llm().run({\n    label: `generate:${kind}`,\n    system: [{ text: systemPrompt(), cache: true }],\n    messages: [{ role: 'user', content: userBlocks }],\n    schema: spec.schema,\n    effort: spec.family === 'practice' || spec.family === 'lesson' ? 'high' : 'medium',\n    maxTokens: estimateTokens(spec.family, count),\n    onPartial: onPartial ? (partial) => onPartial(shape(partial, kind, spec)) : undefined,\n  });\n\n  let payload = coerce(object, spec.schema);\n  const structural = validate(payload, spec.schema);\n  if (structural.length) log.warn(`${kind}: ${structural.length} structural issues after coercion`, structural.slice(0, 3));\n\n  if (payload.questions) payload.questions = normaliseQuestionIds(payload.questions);\n  if (payload.self_test) payload.self_test = normaliseQuestionIds(payload.self_test);\n  if (payload.checks) payload.checks = normaliseQuestionIds(payload.checks);\n\n  const qc = await qualityControl({ payload, kind, spec, vars, learnerId, sourceIds });\n  payload = qc.payload;\n\n  const resource = saveResource(learnerId, {\n    session_id: sessionId,\n    kind,\n    title: payload.title || topic,\n    subject,\n    topic,\n    difficulty,\n    payload: { ...payload, kind, quality: qc.report },\n    status: 'ready',\n    max_score: totalPoints(payload),\n  });\n\n  for (const name of conceptNames(payload, concepts, topic)) {\n    upsertConcept(learnerId, { name, subject });\n  }\n  logEvent(learnerId, 'resource_generated', { kind, topic, resourceId: resource.id, ms: Date.now() - started });\n  log.info(`${kind} \"${payload.title}\" generated in ${Date.now() - started}ms (${qc.report.checked} checked, ${qc.report.repaired} repaired)`);\n\n  return resource;\n}\n\nfunction shape(partial, kind, spec) {\n  if (!partial || typeof partial !== 'object') return null;\n  return { ...partial, kind, family: spec.family };\n}\n\nfunction estimateTokens(family, count) {\n  if (family === 'practice') return clamp(3000 + count * 900, 6000, 60000);\n  if (family === 'lesson') return 20000;\n  if (family === 'plan') return 24000;\n  if (family === 'flashcards') return clamp(2000 + count * 220, 6000, 32000);\n  return 20000;\n}\n\nfunction totalPoints(payload) {\n  const questions = payload.questions || payload.self_test || payload.checks || [];\n  const total = questions.reduce((sum, q) => sum + (Number(q.points) || 1), 0);\n  return total || null;\n}\n\nfunction conceptNames(payload, requested, topic) {\n  const names = new Set(requested.filter(Boolean));\n  for (const c of payload.concepts || []) if (typeof c === 'string') names.add(c);\n  for (const p of payload.priorities || []) if (p?.concept) names.add(p.concept);\n  for (const q of payload.questions || []) if (q?.concept) names.add(q.concept);\n  if (!names.size && topic) names.add(topic);\n  return [...names].filter((n) => n && n.length < 80).slice(0, 12);\n}\n\nfunction suggestedDifficulty(profile, concepts) {\n  const relevant = profile.concepts.filter((c) =>\n    concepts.some((n) => n && c.name.toLowerCase() === String(n).toLowerCase()),\n  );\n  if (!relevant.length) return 3;\n  const mean = relevant.reduce((sum, c) => sum + c.ability, 0) / relevant.length;\n  return clamp(Math.round((mean + 0.35) * 2) / 2, 1, 5);\n}\n\n/* ------------------------------------------------------------ quality control */\n\n/**\n * Two gates before a learner sees anything: deterministic structural checks,\n * then an independent model pass that re-solves every question. Defects that\n * can be fixed in place are fixed; the rest are regenerated once.\n */\nexport async function qualityControl({ payload, kind, spec, vars, learnerId, sourceIds }) {\n  const report = { checked: 0, repaired: 0, dropped: 0, issues: [], ran: false };\n  const listKey = payload.questions ? 'questions' : payload.self_test ? 'self_test' : null;\n  if (!listKey || !payload[listKey]?.length) return { payload, report };\n\n  let questions = payload[listKey];\n  report.checked = questions.length;\n\n  let problems = inspectQuestions(questions, { difficulty: vars.difficulty });\n\n  if (config.qualityControl) {\n    report.ran = true;\n    try {\n      const { object } = await llm().run({\n        label: `qc:${kind}`,\n        system: [{ text: systemPrompt(), cache: true }],\n        messages: [\n          {\n            role: 'user',\n            content: renderPrompt('qc', {\n              material: JSON.stringify({ title: payload.title, questions }, null, 1),\n              topic: vars.topic,\n              level: vars.level,\n              difficulty: vars.difficulty,\n            }),\n          },\n        ],\n        schema: qcSchema,\n        effort: 'medium',\n        maxTokens: 8000,\n      });\n      const found = coerce(object, qcSchema).problems || [];\n      problems = dedupeProblems([...problems, ...found]);\n    } catch (err) {\n      log.warn(`qc pass failed, falling back to structural checks only: ${err.message}`);\n    }\n  }\n\n  if (!problems.length) return { payload, report };\n  report.issues = problems;\n\n  // In-place repairs: a wrong answer key with a stated correction is cheap to fix.\n  const stillBroken = [];\n  for (const problem of problems) {\n    const index = questions.findIndex((q) => q.id === problem.question_id);\n    if (index === -1) continue;\n    if (problem.corrected_answer && problem.issue === 'wrong_answer') {\n      questions[index] = { ...questions[index], answer: problem.corrected_answer };\n      report.repaired++;\n    } else {\n      stillBroken.push({ ...problem, index });\n    }\n  }\n\n  if (stillBroken.length) {\n    const indexes = [...new Set(stillBroken.map((p) => p.index))];\n    const regenerated = await regenerateQuestions({\n      vars,\n      kind,\n      learnerId,\n      sourceIds,\n      broken: indexes.map((i) => ({ question: questions[i], defects: stillBroken.filter((p) => p.index === i) })),\n    });\n    indexes.forEach((questionIndex, n) => {\n      const replacement = regenerated[n];\n      if (replacement) {\n        questions[questionIndex] = { ...replacement, id: questions[questionIndex].id };\n        report.repaired++;\n      }\n    });\n\n    // Anything still failing the deterministic checks is dropped rather than shipped.\n    const recheck = inspectQuestions(questions, { difficulty: vars.difficulty });\n    const fatal = new Set(\n      recheck\n        .filter((p) => ['wrong_answer', 'no_correct_choice', 'multiple_correct'].includes(p.issue))\n        .map((p) => p.question_id),\n    );\n    if (fatal.size && questions.length - fatal.size >= 1) {\n      questions = questions.filter((q) => !fatal.has(q.id));\n      report.dropped = fatal.size;\n    }\n  }\n\n  return { payload: { ...payload, [listKey]: questions }, report };\n}\n\nfunction dedupeProblems(problems) {\n  const seen = new Set();\n  return problems.filter((p) => {\n    const key = `${p.question_id}|${p.issue}`;\n    if (seen.has(key)) return false;\n    seen.add(key);\n    return true;\n  });\n}\n\nasync function regenerateQuestions({ vars, kind, learnerId, sourceIds, broken }) {\n  const instructions = [\n    'REGENERATION PASS. The questions below failed quality control. Write replacements.',\n    'Return exactly ' + broken.length + ' question(s), in the same order, fixing the stated defects.',\n    'Keep the same concept and difficulty for each. Solve each one yourself before writing the answer.',\n    '',\n    ...broken.map(\n      ({ question, defects }, i) =>\n        `--- Replacement ${i + 1} ---\\nConcept: ${question.concept}\\nDifficulty: ${question.difficulty}\\nType: ${question.type}\\n` +\n        `Original: ${question.prompt}\\nDefects: ${defects.map((d) => `${d.issue} — ${d.detail}`).join(' | ')}`,\n    ),\n  ].join('\\n');\n\n  try {\n    const { object } = await llm().run({\n      label: `qc-repair:${kind}`,\n      system: [{ text: systemPrompt(), cache: true }],\n      messages: [\n        {\n          role: 'user',\n          content: [\n            ...sourceBlocks(sourceIds, learnerId),\n            {\n              type: 'text',\n              text: renderPrompt('practice', { ...vars, count: broken.length, instructions }),\n            },\n          ],\n        },\n      ],\n      // Always regenerate through the practice schema: we are replacing\n      // questions, whatever family the parent resource belongs to.\n      schema: practiceSchema,\n      effort: 'high',\n      maxTokens: 4000 + broken.length * 1200,\n    });\n    return coerce(object, practiceSchema).questions || [];\n  } catch (err) {\n    log.warn(`regeneration failed: ${err.message}`);\n    return [];\n  }\n}\n","axiom:server/engine/evaluate.js":"import { llm } from 'axiom:server/llm/index.js';\nimport { renderPrompt, systemPrompt } from 'axiom:browser/prompts.js';\nimport { gradeSchema } from 'axiom:server/schemas/index.js';\nimport { coerce } from 'axiom:server/engine/validate.js';\nimport { buildProfile, profileContext } from 'axiom:server/engine/profile.js';\nimport { applyEvidence, computeMasteryLevel, evidenceKindFor, MASTERY_LABELS } from 'axiom:server/engine/mastery.js';\nimport { updateAbility, nextDifficulty, recommendStrategy } from 'axiom:server/engine/difficulty.js';\nimport { scheduleReview } from 'axiom:server/engine/review.js';\nimport { deterministicVerdict } from 'axiom:server/util/answers.js';\nimport {\n  upsertConcept,\n  saveConcept,\n  recordAttempt,\n  noteMisconception,\n  resolveMisconceptions,\n  conceptAttempts,\n  recentAttempts,\n  logEvent,\n} from 'axiom:browser/store.js';\nimport { logger } from 'axiom:server/util/log.js';\n\nconst log = logger('evaluate');\n\n/**\n * Grade one answer and fold the result into the learner model.\n *\n * Correctness is decided deterministically wherever that is exact (a keyed\n * multiple choice, a numeric answer inside tolerance). The model is still\n * asked — but for the part only it can do: *why* the answer went wrong, and\n * what should happen next.\n */\nexport async function evaluateAnswer({\n  learnerId,\n  sessionId = null,\n  resourceId = null,\n  question,\n  answer,\n  attemptNumber = 1,\n  elapsedMs = null,\n  subject = 'General',\n  profile: providedProfile,\n}) {\n  const profile = providedProfile || buildProfile(learnerId);\n  const certain = deterministicVerdict(question, answer);\n  const points = Number(question.points) || 1;\n\n  const { object } = await llm().run({\n    label: 'grade',\n    system: [{ text: systemPrompt(), cache: true }],\n    messages: [\n      {\n        role: 'user',\n        content: renderPrompt('grade', {\n          type: question.type,\n          concept: question.concept,\n          difficulty: question.difficulty,\n          points,\n          context: question.context || '(none)',\n          prompt: question.prompt,\n          choices: (question.choices || []).map((c) => `${c.key}. ${c.text}`).join('\\n') || '(not multiple choice)',\n          answer: question.answer,\n          accepted: (question.accepted || []).join(' | ') || '(none)',\n          tolerance: question.tolerance ?? '(none)',\n          units: question.units || '(none)',\n          rubric: (question.rubric || []).map((r) => `${r.points} pts — ${r.criterion}`).join('\\n') || '(none)',\n          solution: question.solution,\n          student_answer: String(answer ?? '').slice(0, 8000),\n          attempt_number: attemptNumber,\n          seconds: elapsedMs ? Math.round(elapsedMs / 1000) : 'unknown',\n          learner_context: profileContext(profile, { focusConcepts: [question.concept] }),\n        }),\n      },\n    ],\n    schema: gradeSchema,\n    effort: 'medium',\n    maxTokens: 4000,\n  });\n\n  const grade = coerce(object, gradeSchema);\n\n  // Where we *know* the answer, the deterministic verdict wins over the model's.\n  if (certain === true) {\n    grade.verdict = 'correct';\n    grade.score = points;\n    grade.error_type = 'none';\n    grade.misconception = '';\n  } else if (certain === false && grade.verdict === 'correct') {\n    grade.verdict = 'incorrect';\n    grade.score = 0;\n    if (grade.error_type === 'none') grade.error_type = 'conceptual';\n  }\n  grade.max_score = points;\n  grade.score = Math.max(0, Math.min(points, Number(grade.score) || 0));\n\n  const ratio = points ? grade.score / points : 0;\n  // The question's concept is authoritative. The model may paraphrase it in\n  // `grade.concept`, and trusting that would file the attempt against a\n  // freshly-invented concept — silently detaching it from the syllabus the\n  // course is tracking.\n  const conceptName = question.concept || grade.concept || 'General';\n  grade.concept = conceptName;\n  const concept = upsertConcept(learnerId, { name: conceptName, subject });\n\n  const evidence = evidenceKindFor(question);\n  const withEvidence = applyEvidence(concept, {\n    ratio,\n    difficulty: Number(question.difficulty) || 3,\n    errorType: grade.error_type,\n    evidence,\n  });\n  withEvidence.ability = updateAbility(concept, { ratio, difficulty: Number(question.difficulty) || 3 });\n  withEvidence.last_seen_at = new Date().toISOString();\n\n  const history = conceptAttempts(concept.id, 40);\n  const retentionOk = hasRetention(history, ratio >= 0.8);\n  const masteryCheckPassed = ratio >= 0.8 && Number(question.difficulty) >= 4 && evidence === 'transfer';\n\n  withEvidence.mastery_level = computeMasteryLevel(\n    { ...withEvidence, mastery_level: Math.max(1, concept.mastery_level) },\n    { retentionOk, masteryCheckPassed },\n  );\n  Object.assign(withEvidence, scheduleReview(withEvidence, ratio));\n\n  const updated = saveConcept(withEvidence);\n\n  recordAttempt(learnerId, {\n    resource_id: resourceId,\n    session_id: sessionId,\n    question_id: question.id,\n    concept_id: concept.id,\n    concept_name: conceptName,\n    prompt: question.prompt?.slice(0, 500),\n    answer: String(answer ?? '').slice(0, 4000),\n    verdict: grade.verdict,\n    score: grade.score,\n    max_score: points,\n    difficulty: Number(question.difficulty) || 3,\n    error_type: grade.error_type,\n    misconception: grade.misconception || null,\n    feedback: { feedback: grade.feedback, next_move: grade.next_move },\n    elapsed_ms: elapsedMs,\n  });\n\n  if (grade.misconception && grade.error_type !== 'none') {\n    noteMisconception(learnerId, {\n      conceptId: concept.id,\n      label: grade.misconception.slice(0, 160),\n      detail: grade.feedback?.slice(0, 400),\n      errorType: grade.error_type,\n    });\n  }\n  if (updated.mastery_level >= 5) resolveMisconceptions(learnerId, concept.id);\n\n  const recent = recentAttempts(learnerId, 12).filter((a) => a.concept_id === concept.id);\n  const strategy = recommendStrategy(recent);\n  const nextLevel = nextDifficulty(updated, {\n    streak: updated.streak,\n    lastErrorType: grade.error_type,\n  });\n\n  logEvent(learnerId, 'attempt_graded', {\n    concept: conceptName,\n    verdict: grade.verdict,\n    errorType: grade.error_type,\n    mastery: updated.mastery_level,\n  });\n  log.debug(`${conceptName}: ${grade.verdict} (${grade.error_type}) → level ${updated.mastery_level}, next difficulty ${nextLevel}`);\n\n  return {\n    grade,\n    concept: updated,\n    masteryLabel: MASTERY_LABELS[updated.mastery_level],\n    next: { difficulty: nextLevel, strategy: strategy.strategy, reason: strategy.reason },\n  };\n}\n\n/**\n * Retention: a concept only counts as retained when it has been answered\n * correctly at least ~a day after the first correct attempt — you cannot reach\n * mastery inside a single sitting.\n */\nfunction hasRetention(history, currentCorrect) {\n  const correct = history.filter((a) => (a.score ?? 0) / (a.max_score || 1) >= 0.8);\n  if (!correct.length) return false;\n  const first = new Date(correct[correct.length - 1].created_at).getTime();\n  const latest = currentCorrect ? Date.now() : new Date(correct[0].created_at).getTime();\n  return latest - first >= 20 * 3600 * 1000;\n}\n\n/** Grade a whole submitted resource, question by question. */\nexport async function evaluateSubmission({ learnerId, resource, answers, sessionId = null, elapsed = {} }) {\n  const payload = resource.payload || {};\n  const questions = payload.questions || payload.self_test || payload.checks || [];\n  const profile = buildProfile(learnerId);\n  const results = [];\n\n  for (const question of questions) {\n    const answer = answers[question.id];\n    if (answer == null || String(answer).trim() === '') {\n      results.push({\n        questionId: question.id,\n        skipped: true,\n        grade: {\n          verdict: 'unscorable',\n          score: 0,\n          max_score: Number(question.points) || 1,\n          error_type: 'incomplete',\n          feedback: 'Left blank — attempt it and you will get feedback on your reasoning.',\n          misconception: '',\n          what_went_right: '',\n          reveal_solution: false,\n          rubric_scores: [],\n          concept: question.concept,\n          mastery_signal: 'not_yet',\n          next_move: 'same_level',\n        },\n      });\n      continue;\n    }\n    const outcome = await evaluateAnswer({\n      learnerId,\n      sessionId,\n      resourceId: resource.id,\n      question,\n      answer,\n      elapsedMs: elapsed[question.id] ?? null,\n      subject: resource.subject || 'General',\n      profile,\n    });\n    results.push({ questionId: question.id, ...outcome });\n  }\n\n  const score = results.reduce((sum, r) => sum + (r.grade?.score || 0), 0);\n  const maxScore = questions.reduce((sum, q) => sum + (Number(q.points) || 1), 0);\n\n  return { results, score, maxScore, questions };\n}\n","axiom:server/engine/insights.js":"import { llm } from 'axiom:server/llm/index.js';\nimport { renderPrompt, systemPrompt } from 'axiom:browser/prompts.js';\nimport { insightsSchema } from 'axiom:server/schemas/index.js';\nimport { coerce } from 'axiom:server/engine/validate.js';\nimport { buildProfile, profileContext } from 'axiom:server/engine/profile.js';\nimport { MASTERY_LABELS } from 'axiom:server/engine/mastery.js';\nimport { describeDue, reviewUrgency } from 'axiom:server/engine/review.js';\nimport { logger } from 'axiom:server/util/log.js';\n\nconst log = logger('insights');\nconst cache = new Map(); // learnerId -> { key, value, at }\nconst TTL_MS = 5 * 60 * 1000;\n\n/**\n * Cheap, immediate signals computed from the learner model with no model call.\n * The dashboard renders these instantly; the generated analysis arrives after.\n */\nexport function localSignals(profile) {\n  const signals = [];\n  const due = profile.due.filter((c) => reviewUrgency(c) > 0);\n\n  if (due.length) {\n    signals.push({\n      kind: 'review',\n      title: `${due.length} concept${due.length > 1 ? 's' : ''} due for review`,\n      detail: due.slice(0, 3).map((c) => `${c.name} (${describeDue(c)})`).join(', '),\n      action: { label: 'Start review', kind: 'review', topic: due[0].name },\n    });\n  }\n\n  const weakest = profile.concepts\n    .filter((c) => c.attempts >= 2 && c.mastery_level <= 2)\n    .sort((a, b) => a.correct / a.attempts - b.correct / b.attempts)[0];\n  if (weakest) {\n    signals.push({\n      kind: 'weakness',\n      title: `${weakest.name} is your weakest tracked concept`,\n      detail: `${Math.round((weakest.correct / weakest.attempts) * 100)}% correct across ${weakest.attempts} attempts — ${MASTERY_LABELS[weakest.mastery_level].toLowerCase()}.`,\n      action: { label: 'Fix this', kind: 'lesson', topic: weakest.name },\n    });\n  }\n\n  const repeated = profile.misconceptions.filter((m) => m.count >= 2)[0];\n  if (repeated) {\n    signals.push({\n      kind: 'misconception',\n      title: `Same mistake ${repeated.count} times: \"${repeated.label}\"`,\n      detail: 'Repeating practice at the same level will not clear this — it needs re-teaching.',\n      action: { label: 'Re-teach it', kind: 'lesson', topic: repeated.label },\n    });\n  }\n\n  const ready = profile.concepts.find((c) => c.mastery_level === 4 && c.streak >= 2);\n  if (ready) {\n    signals.push({\n      kind: 'ready',\n      title: `${ready.name} is close to mastered`,\n      detail: 'One transfer problem at difficulty 4+ would settle it.',\n      action: { label: 'Mastery check', kind: 'mastery_check', topic: ready.name },\n    });\n  }\n\n  return signals;\n}\n\n/** Generated analysis of the learner's history. Cached briefly. */\nexport async function generateInsights(learnerId, { force = false } = {}) {\n  const profile = buildProfile(learnerId);\n  const key = `${profile.attempts.length}:${profile.attempts[0]?.id || 'none'}:${profile.misconceptions.length}`;\n  const hit = cache.get(learnerId);\n  if (!force && hit && hit.key === key && Date.now() - hit.at < TTL_MS) return hit.value;\n\n  if (profile.attempts.length < 3) {\n    const value = {\n      headline:\n        profile.attempts.length === 0\n          ? 'No performance data yet — answer a few questions and the analysis starts here.'\n          : 'Not enough attempts yet to see a pattern.',\n      patterns: [],\n      recommended: [],\n      local: localSignals(profile),\n    };\n    cache.set(learnerId, { key, value, at: Date.now() });\n    return value;\n  }\n\n  try {\n    const { object } = await llm().run({\n      label: 'insights',\n      system: [{ text: systemPrompt(), cache: true }],\n      messages: [\n        {\n          role: 'user',\n          content: renderPrompt('insights', {\n            learner_context: profileContext(profile),\n            attempts: profile.attempts\n              .slice(0, 25)\n              .map(\n                (a) =>\n                  `${a.created_at.slice(0, 16)} · ${a.concept_name} · d${a.difficulty} · ${a.verdict}` +\n                  `${a.error_type && a.error_type !== 'none' ? ` · ${a.error_type}` : ''}` +\n                  `${a.misconception ? ` · \"${a.misconception}\"` : ''}` +\n                  `${a.elapsed_ms ? ` · ${Math.round(a.elapsed_ms / 1000)}s` : ''}`,\n              )\n              .join('\\n'),\n            misconceptions: profile.misconceptions\n              .map((m) => `${m.label} (×${m.count}, ${m.error_type || 'unclassified'})`)\n              .join('\\n') || '(none open)',\n          }),\n        },\n      ],\n      schema: insightsSchema,\n      effort: 'medium',\n      maxTokens: 4000,\n    });\n    const value = { ...coerce(object, insightsSchema), local: localSignals(profile) };\n    cache.set(learnerId, { key, value, at: Date.now() });\n    return value;\n  } catch (err) {\n    log.warn(`insight generation failed: ${err.message}`);\n    return { headline: '', patterns: [], recommended: [], local: localSignals(profile), error: err.message };\n  }\n}\n\nexport function clearInsightCache(learnerId) {\n  if (learnerId) cache.delete(learnerId);\n  else cache.clear();\n}\n","axiom:server/engine/course.js":"import { llm } from 'axiom:server/llm/index.js';\nimport { renderPrompt, systemPrompt } from 'axiom:browser/prompts.js';\nimport { courseSchema, practiceSchema } from 'axiom:server/schemas/index.js';\nimport { coerce, normaliseQuestionIds, inspectQuestions } from 'axiom:server/engine/validate.js';\nimport { buildProfile, profileContext } from 'axiom:server/engine/profile.js';\nimport { sourceBlocks, sourceContext } from 'axiom:browser/sources.js';\nimport { courseReadiness, pathToScore, pacing, nextBestAction } from 'axiom:server/engine/readiness.js';\nimport { findCurriculum, cloneBlueprint } from 'axiom:curriculum/index.js';\nimport {\n  saveCourse,\n  getCourse,\n  listCourses,\n  upsertConcept,\n  listConcepts,\n  dueConcepts,\n  listExamResults,\n  recordExamResult,\n  saveResource,\n  logEvent,\n} from 'axiom:browser/store.js';\nimport { logger } from 'axiom:server/util/log.js';\n\nconst log = logger('course');\n\n/**\n * Generate a course blueprint and register every concept in it, so the mastery\n * engine starts tracking the whole syllabus from day one rather than only the\n * parts the learner happens to ask about.\n */\nexport async function createCourse({ learnerId, request, subject, level, examDate, instructions, sourceIds = [], onPartial }) {\n  const profile = buildProfile(learnerId);\n\n  // A real syllabus beats a plausible one. If the learner named a course whose\n  // published framework we hold, teach that framework — the unit weightings the\n  // readiness model runs on are then the exam board's own numbers rather than a\n  // model's guess at them.\n  const match = findCurriculum(request, subject, level);\n  if (match) {\n    log.info(`matched \"${request}\" to verified curriculum ${match.blueprint.key}`);\n    onPartial?.(cloneBlueprint(match.blueprint));\n    return registerCourse({\n      learnerId,\n      blueprint: normaliseBlueprint(cloneBlueprint(match.blueprint)),\n      examDate,\n      sourceIds,\n      instructions,\n      origin: { kind: 'library', key: match.blueprint.key, matched_on: match.matchedOn },\n    });\n  }\n\n  const { object } = await llm().run({\n    label: 'course-blueprint',\n    system: [{ text: systemPrompt(), cache: true }],\n    messages: [\n      {\n        role: 'user',\n        content: [\n          ...sourceBlocks(sourceIds, learnerId),\n          {\n            type: 'text',\n            text: renderPrompt('course', {\n              request,\n              subject: subject || '(infer it)',\n              level: level || '(infer it)',\n              exam_date: examDate || '(none given)',\n              instructions: instructions || '(none)',\n              learner_context: profileContext(profile),\n              source_context: sourceContext(sourceIds, learnerId),\n            }),\n          },\n        ],\n      },\n    ],\n    schema: courseSchema,\n    effort: 'high',\n    maxTokens: 32000,\n    onPartial,\n  });\n\n  const blueprint = normaliseBlueprint(coerce(object, courseSchema));\n  return registerCourse({\n    learnerId,\n    blueprint,\n    examDate,\n    sourceIds,\n    instructions,\n    origin: { kind: 'generated' },\n  });\n}\n\n/** Persist a blueprint and start tracking every concept in it. */\nfunction registerCourse({ learnerId, blueprint, examDate, sourceIds, instructions, origin }) {\n  const course = saveCourse(learnerId, {\n    title: blueprint.title,\n    exam: blueprint.exam,\n    subject: blueprint.subject,\n    level: blueprint.level,\n    exam_date: examDate || null,\n    blueprint,\n    state: {\n      targetScore: topScore(blueprint),\n      minutesPerDay: 60,\n      sourceIds,\n      instructions: instructions || null,\n      origin,\n    },\n  });\n\n  // Every concept in the syllabus becomes a tracked concept immediately.\n  for (const unit of blueprint.units) {\n    for (const concept of unit.concepts) {\n      upsertConcept(learnerId, { name: concept.name, subject: blueprint.subject || 'General' });\n    }\n  }\n\n  const conceptCount = blueprint.units.reduce((n, u) => n + u.concepts.length, 0);\n  logEvent(learnerId, 'course_created', {\n    courseId: course.id,\n    title: blueprint.title,\n    units: blueprint.units.length,\n    concepts: conceptCount,\n    origin: origin.kind,\n  });\n  log.info(`course \"${blueprint.title}\" — ${blueprint.units.length} units, ${conceptCount} concepts (${origin.kind})`);\n\n  return course;\n}\n\n/** The highest score the exam reports — the default target. */\nfunction topScore(blueprint) {\n  return (blueprint.score_bands || []).reduce((best, band) => Math.max(best, band.score || 0), 5);\n}\n\n/**\n * Exam weights are the whole basis of the readiness model, so they are\n * normalised to sum to 100 rather than trusted blindly.\n */\nfunction normaliseBlueprint(blueprint) {\n  const units = (blueprint.units || [])\n    .filter((unit) => unit.title)\n    .map((unit, i) => ({ ...unit, idx: unit.idx || i + 1 }))\n    .sort((a, b) => a.idx - b.idx);\n\n  const total = units.reduce((sum, unit) => sum + (Number(unit.exam_weight_percent) || 0), 0);\n  if (total > 0 && Math.abs(total - 100) > 0.5) {\n    for (const unit of units) {\n      unit.exam_weight_percent = Number(((Number(unit.exam_weight_percent) || 0) * 100) / total).toFixed(2) * 1;\n    }\n    log.debug(`normalised unit weights from ${total.toFixed(1)}% to 100%`);\n  } else if (total === 0 && units.length) {\n    const even = Number((100 / units.length).toFixed(2));\n    for (const unit of units) unit.exam_weight_percent = even;\n  }\n\n  const bands = (blueprint.score_bands || []).slice().sort((a, b) => b.score - a.score);\n  return { ...blueprint, units, score_bands: bands };\n}\n\n/* ------------------------------------------------------------- readiness */\n\n/** Assemble everything the course view needs, in one pass over the learner model. */\nexport function courseSnapshot(learnerId, courseId, { now = new Date() } = {}) {\n  const course = getCourse(courseId);\n  if (!course || course.learner_id !== learnerId) return null;\n\n  const concepts = listConcepts(learnerId);\n  // If a legacy duplicate exists for a name, the row carrying the evidence wins.\n  const byName = new Map();\n  for (const concept of concepts) {\n    const key = concept.name.toLowerCase();\n    const held = byName.get(key);\n    if (!held || (concept.attempts ?? 0) > (held.attempts ?? 0)) byName.set(key, concept);\n  }\n  const lookup = (name) => byName.get(String(name).toLowerCase());\n\n  const examResults = listExamResults(courseId);\n  const readiness = courseReadiness({ blueprint: course.blueprint, conceptLookup: lookup, examResults, now });\n  const targetScore = course.state?.targetScore ?? topScore(course.blueprint);\n  const path = pathToScore(readiness, targetScore);\n  const pace = pacing(readiness, {\n    examDate: course.exam_date,\n    minutesPerDay: course.state?.minutesPerDay ?? 60,\n    now,\n  });\n  const due = dueConcepts(learnerId, now.toISOString()).filter((c) =>\n    course.blueprint.units?.some((u) => u.concepts?.some((x) => x.name.toLowerCase() === c.name.toLowerCase())),\n  );\n\n  const action = nextBestAction({\n    readiness,\n    pace,\n    dueCount: due.length,\n    examTaken: examResults.length > 0,\n    targetScore,\n  });\n\n  return {\n    course: {\n      id: course.id,\n      title: course.title,\n      exam: course.exam,\n      subject: course.subject,\n      level: course.level,\n      exam_date: course.exam_date,\n      overview: course.blueprint.overview,\n      exam_format: course.blueprint.exam_format,\n      total_hours: course.blueprint.total_hours,\n      // Whether this syllabus was transcribed from a published framework or\n      // written by the model. A learner planning around unit weightings should\n      // be able to see which of the two they are trusting.\n      verified: Boolean(course.blueprint.verified),\n      source: course.blueprint.source || null,\n      state: course.state,\n      created_at: course.created_at,\n    },\n    readiness,\n    targetScore,\n    path,\n    pace,\n    dueCount: due.length,\n    action,\n    history: examResults.map((r) => ({ at: r.created_at, percent: r.percent, score: r.score })),\n    units: course.blueprint.units.map((unit) => {\n      const measured = readiness.units.find((u) => u.idx === unit.idx);\n      return {\n        idx: unit.idx,\n        title: unit.title,\n        summary: unit.summary,\n        exam_weight: unit.exam_weight_percent,\n        published_weight: unit.published_weight || null,\n        hours: unit.hours,\n        expected: measured?.expected ?? 0,\n        confidence: measured?.confidence ?? 0,\n        points_available: measured?.points_available ?? 0,\n        concepts: measured?.concepts ?? [],\n        exam_traps: unit.exam_traps || [],\n      };\n    }),\n  };\n}\n\nexport const listCoursesFor = (learnerId) =>\n  listCourses(learnerId).map((course) => ({\n    id: course.id,\n    title: course.title,\n    exam: course.exam,\n    subject: course.subject,\n    exam_date: course.exam_date,\n    units: (course.blueprint.units || []).length,\n    updated_at: course.updated_at,\n  }));\n\n/* ---------------------------------------------------------- full exams */\n\n/**\n * A full practice paper built to the course's own blueprint: the same sections,\n * counts, question types and unit weighting as the real thing, so the score it\n * produces means something.\n */\nexport async function generateExam({ learnerId, courseId, onPartial }) {\n  const course = getCourse(courseId);\n  if (!course || course.learner_id !== learnerId) throw new Error('Course not found');\n\n  const blueprint = course.blueprint;\n  const profile = buildProfile(learnerId);\n  const format = blueprint.exam_format || {};\n  const sections = format.sections?.length ? format.sections : [{ name: 'Paper', question_type: 'multiple_choice', count: 12, minutes: 40, weight_percent: 100 }];\n\n  // Scale the paper down to something sittable while keeping unit proportions.\n  const totalRealQuestions = sections.reduce((n, s) => n + (s.count || 0), 0);\n  const target = Math.min(24, Math.max(10, Math.round(totalRealQuestions / 4)));\n\n  const allocation = blueprint.units\n    .map((unit) => ({\n      title: unit.title,\n      weight: unit.exam_weight_percent,\n      questions: Math.max(1, Math.round((target * unit.exam_weight_percent) / 100)),\n      concepts: unit.concepts.map((c) => c.name),\n    }))\n    .filter((u) => u.weight > 0);\n\n  const instructions = [\n    `This is a scaled-down but faithful mock of ${blueprint.exam || blueprint.title}.`,\n    `Mirror the real paper's structure: ${sections.map((s) => `${s.name} — ${s.question_type}, worth ${s.weight_percent}%`).join('; ')}.`,\n    '',\n    'Distribute questions across units in exam proportion:',\n    ...allocation.map((u) => `- ${u.title} (${u.weight}% of the paper): ${u.questions} question(s), drawn from ${u.concepts.slice(0, 6).join(', ')}`),\n    '',\n    'Write questions at the difficulty the real exam asks at, not at revision difficulty.',\n    'Include the traps the real examiners use. Set each question\\'s `concept` to the concept name it tests, exactly as written above, so the result can be scored by unit.',\n    'Use `sections` to group the questions the way the real paper does.',\n  ].join('\\n');\n\n  const { object } = await llm().run({\n    label: 'course-exam',\n    system: [{ text: systemPrompt(), cache: true }],\n    messages: [\n      {\n        role: 'user',\n        content: renderPrompt('practice', {\n          kind: 'test',\n          topic: blueprint.title,\n          subject: blueprint.subject,\n          level: blueprint.level,\n          difficulty: 4,\n          count: target,\n          minutes: Math.min(120, format.total_minutes || 90),\n          types: sections.map((s) => s.question_type).join(', '),\n          concepts: allocation.flatMap((u) => u.concepts).slice(0, 40).join(', '),\n          instructions,\n          learner_context: profileContext(profile),\n          source_context: '',\n        }),\n      },\n    ],\n    schema: practiceSchema,\n    effort: 'high',\n    maxTokens: 40000,\n    onPartial,\n  });\n\n  const payload = coerce(object, practiceSchema);\n  payload.questions = normaliseQuestionIds(payload.questions || []);\n  payload.kind = 'test';\n  payload.course_id = courseId;\n\n  const defects = inspectQuestions(payload.questions, { difficulty: 4 }).filter((p) =>\n    ['wrong_answer', 'no_correct_choice'].includes(p.issue),\n  );\n  if (defects.length) {\n    const broken = new Set(defects.map((d) => d.question_id));\n    payload.questions = payload.questions.filter((q) => !broken.has(q.id));\n    log.warn(`dropped ${broken.size} defective exam question(s)`);\n  }\n\n  const resource = saveResource(learnerId, {\n    kind: 'test',\n    title: `${blueprint.exam || blueprint.title} — practice paper`,\n    subject: blueprint.subject,\n    topic: blueprint.title,\n    difficulty: 4,\n    payload,\n    max_score: payload.questions.reduce((sum, q) => sum + (Number(q.points) || 1), 0),\n  });\n\n  logEvent(learnerId, 'exam_generated', { courseId, resourceId: resource.id, questions: payload.questions.length });\n  return resource;\n}\n\n/**\n * Score a completed practice paper by unit and store it, so the readiness\n * model is calibrated against a real result rather than only its own estimate.\n */\nexport function recordExam({ learnerId, courseId, resource, results }) {\n  const course = getCourse(courseId);\n  if (!course || course.learner_id !== learnerId) return null;\n\n  const questions = resource.payload?.questions || [];\n  const unitOf = new Map();\n  for (const unit of course.blueprint.units || []) {\n    for (const concept of unit.concepts || []) unitOf.set(concept.name.toLowerCase(), unit);\n  }\n\n  const byUnit = {};\n  let earned = 0;\n  let possible = 0;\n\n  for (const question of questions) {\n    const result = results.find((r) => r.questionId === question.id);\n    const points = Number(question.points) || 1;\n    const score = result?.grade?.score || 0;\n    earned += score;\n    possible += points;\n\n    const unit = unitOf.get(String(question.concept || '').toLowerCase());\n    const key = unit ? unit.title : 'Unassigned';\n    byUnit[key] ||= { earned: 0, possible: 0, exam_weight: unit?.exam_weight_percent ?? 0 };\n    byUnit[key].earned += score;\n    byUnit[key].possible += points;\n  }\n\n  const percent = possible ? earned / possible : 0;\n  const band = (course.blueprint.score_bands || [])\n    .slice()\n    .sort((a, b) => b.min_percent - a.min_percent)\n    .find((b) => percent * 100 >= b.min_percent);\n\n  recordExamResult(learnerId, {\n    course_id: courseId,\n    resource_id: resource.id,\n    percent,\n    score: band?.score ?? null,\n    by_unit: byUnit,\n  });\n  logEvent(learnerId, 'exam_scored', { courseId, percent, score: band?.score });\n\n  return { percent, score: band?.score ?? null, byUnit };\n}\n\nexport { courseReadiness, pathToScore, pacing, nextBestAction };\n","axiom:curriculum/index.js":"import apBiology from 'axiom:curriculum/ap-biology.js';\nimport apCalculusAB from 'axiom:curriculum/ap-calculus-ab.js';\nimport apChemistry from 'axiom:curriculum/ap-chemistry.js';\nimport apComputerScienceA from 'axiom:curriculum/ap-computer-science-a.js';\nimport apEnglishLanguage from 'axiom:curriculum/ap-english-language.js';\nimport apEnvironmentalScience from 'axiom:curriculum/ap-environmental-science.js';\nimport apMacroeconomics from 'axiom:curriculum/ap-macroeconomics.js';\nimport apPhysics1 from 'axiom:curriculum/ap-physics-1.js';\nimport apPsychology from 'axiom:curriculum/ap-psychology.js';\nimport apStatistics from 'axiom:curriculum/ap-statistics.js';\nimport apUsHistory from 'axiom:curriculum/ap-us-history.js';\nimport apWorldHistory from 'axiom:curriculum/ap-world-history.js';\n\n/**\n * The verified curriculum library.\n *\n * Every blueprint here is transcribed from a published course framework: real\n * unit titles, the awarding body's own exam weightings, and the real structure\n * of the paper. When a learner asks for one of these courses we teach the\n * actual syllabus rather than asking a model to guess at one, which is the\n * difference between a course that matches what the exam asks and a course\n * that merely sounds like it does.\n *\n * Anything not in here still works — it falls through to model generation.\n */\nexport const CURRICULA = [\n  apBiology,\n  apCalculusAB,\n  apChemistry,\n  apComputerScienceA,\n  apEnglishLanguage,\n  apEnvironmentalScience,\n  apMacroeconomics,\n  apPhysics1,\n  apPsychology,\n  apStatistics,\n  apUsHistory,\n  apWorldHistory,\n];\n\n/** Requests that name a sibling course must not fall into its neighbour. */\nconst EXCLUSIONS = {\n  'ap-physics-1': ['physics 2', 'physics c', 'physics ii', 'mechanics c', 'electricity and magnetism'],\n  'ap-calculus-ab': ['calc bc', 'calculus bc'],\n  'ap-english-language': ['english literature', 'ap lit', 'english lit'],\n  'ap-computer-science-a': ['principles', 'csp'],\n  'ap-macroeconomics': ['microeconomics', 'ap micro'],\n  'ap-us-history': ['world history', 'european history', 'ap euro'],\n  'ap-world-history': ['us history', 'united states history', 'apush', 'european history'],\n  'ap-statistics': ['statistics for', 'ib statistics'],\n};\n\nconst normalise = (text) =>\n  String(text || '')\n    .toLowerCase()\n    .replace(/[^a-z0-9 ]+/g, ' ')\n    .replace(/\\s+/g, ' ')\n    .trim();\n\n/** Does `needle` occur in `haystack` on word boundaries? */\nfunction containsPhrase(haystack, needle) {\n  const idx = haystack.indexOf(needle);\n  if (idx === -1) return false;\n  const before = idx === 0 ? ' ' : haystack[idx - 1];\n  const after = idx + needle.length >= haystack.length ? ' ' : haystack[idx + needle.length];\n  return before === ' ' && after === ' ';\n}\n\n/**\n * Find the library course a free-text request is asking for.\n *\n * Matching is deliberately conservative: it wants an explicit course name, not\n * a topic. \"Teach me AP Biology\" gets the verified blueprint; \"teach me about\n * cells\" does not, because the learner has not asked for the course and\n * building 81 tracked concepts around a passing question would be wrong.\n */\nexport function findCurriculum(...parts) {\n  const text = normalise(parts.filter(Boolean).join(' '));\n  if (!text) return null;\n\n  let best = null;\n  for (const blueprint of CURRICULA) {\n    const excluded = (EXCLUSIONS[blueprint.key] || []).some((phrase) => containsPhrase(text, normalise(phrase)));\n    if (excluded) continue;\n\n    for (const alias of blueprint.aliases) {\n      const needle = normalise(alias);\n      if (!containsPhrase(text, needle)) continue;\n      // Longest alias wins: \"ap computer science a\" beats \"ap computer science\".\n      if (!best || needle.length > best.length) best = { blueprint, length: needle.length, alias };\n    }\n  }\n\n  return best ? { blueprint: best.blueprint, matchedOn: best.alias } : null;\n}\n\n/** A short catalogue for the interface to offer. */\nexport const catalogue = () =>\n  CURRICULA.map((b) => ({\n    key: b.key,\n    title: b.title,\n    exam: b.exam,\n    subject: b.subject,\n    aliases: b.aliases,\n    units: b.units.length,\n    concepts: b.units.reduce((n, unit) => n + unit.concepts.length, 0),\n    hours: b.total_hours,\n  }));\n\n/** Deep copy, so a learner's course can be edited without touching the library. */\nexport const cloneBlueprint = (blueprint) => JSON.parse(JSON.stringify(blueprint));\n","axiom:server/engine/profile.js":"import {\n  ensureLearner,\n  listConcepts,\n  listMisconceptions,\n  recentAttempts,\n  dueConcepts,\n  listGoals,\n  listSessions,\n} from 'axiom:browser/store.js';\nimport { MASTERY_LABELS, masteryGap } from 'axiom:server/engine/mastery.js';\nimport { describeDue } from 'axiom:server/engine/review.js';\nimport { recommendStrategy } from 'axiom:server/engine/difficulty.js';\n\nconst short = (s, n = 160) => (s && s.length > n ? `${s.slice(0, n - 1)}…` : s || '');\n\n/**\n * The learner model, assembled for the model's context window.\n *\n * Deliberately narrow: learning state only. No personal details, no contact\n * information, nothing that is not evidence about what they can currently do.\n */\nexport function buildProfile(learnerId) {\n  const learner = ensureLearner(learnerId);\n  const concepts = listConcepts(learnerId);\n  const attempts = recentAttempts(learnerId, 40);\n  const misconceptions = listMisconceptions(learnerId, { openOnly: true, limit: 12 });\n  const due = dueConcepts(learnerId);\n  const goals = listGoals(learnerId).filter((g) => g.status === 'active');\n  const sessions = listSessions(learnerId, 5);\n\n  const bucket = (min, max) =>\n    concepts.filter((c) => c.mastery_level >= min && c.mastery_level <= max);\n\n  const subjects = [...new Set(concepts.map((c) => c.subject))];\n  const strategy = recommendStrategy(attempts);\n\n  const errorCounts = {};\n  for (const a of attempts) {\n    if (a.error_type && a.error_type !== 'none') {\n      errorCounts[a.error_type] = (errorCounts[a.error_type] || 0) + 1;\n    }\n  }\n\n  return {\n    learner,\n    concepts,\n    subjects,\n    mastered: bucket(5, 5),\n    strong: bucket(4, 4),\n    developing: bucket(2, 3),\n    weak: concepts.filter((c) => c.attempts > 0 && c.mastery_level <= 2),\n    misconceptions,\n    due,\n    goals,\n    sessions,\n    attempts,\n    strategy,\n    errorCounts,\n    stats: {\n      concepts: concepts.length,\n      attempts: attempts.length,\n      accuracy: attempts.length\n        ? attempts.filter((a) => (a.score ?? 0) / (a.max_score || 1) >= 0.8).length / attempts.length\n        : null,\n      studyMinutes: Math.round(\n        attempts.reduce((sum, a) => sum + (a.elapsed_ms || 0), 0) / 60000,\n      ),\n    },\n  };\n}\n\n/** Serialise the learner model into the block the prompts inject. */\nexport function profileContext(profile, { focusConcepts = [] } = {}) {\n  if (!profile) return '';\n  const lines = [];\n  const {\n    concepts, misconceptions, due, goals, strategy, attempts, errorCounts, stats,\n  } = profile;\n\n  if (!concepts.length && !attempts.length) {\n    return [\n      '<learner_model>',\n      'This is a new learner. Nothing is known about them yet — assume nothing about their',\n      'level beyond what their request implies, and prefer a short diagnostic over a guess.',\n      '</learner_model>',\n    ].join('\\n');\n  }\n\n  lines.push('<learner_model>');\n  lines.push(\n    `Overall: ${stats.concepts} concepts tracked, ${stats.attempts} recent attempts, ` +\n      `${stats.accuracy == null ? 'no accuracy data' : `${Math.round(stats.accuracy * 100)}% recent accuracy`}.`,\n  );\n\n  const focus = new Set(focusConcepts.map((c) => String(c).toLowerCase()));\n  const relevant = concepts\n    .slice()\n    .sort((a, b) => {\n      const af = focus.has(a.name.toLowerCase()) ? 1 : 0;\n      const bf = focus.has(b.name.toLowerCase()) ? 1 : 0;\n      if (af !== bf) return bf - af;\n      return new Date(b.updated_at) - new Date(a.updated_at);\n    })\n    .slice(0, 18);\n\n  if (relevant.length) {\n    lines.push('\\nConcept state (level 0-5, ability = difficulty they can currently handle):');\n    for (const c of relevant) {\n      const acc = c.attempts ? `${Math.round((c.correct / c.attempts) * 100)}% of ${c.attempts}` : 'untested';\n      lines.push(\n        `- ${c.name} [${c.subject}] — ${c.mastery_level}/5 ${MASTERY_LABELS[c.mastery_level]}, ` +\n          `ability ${c.ability.toFixed(1)}, ${acc}. ${masteryGap(c)}`,\n      );\n    }\n  }\n\n  if (misconceptions.length) {\n    lines.push('\\nOpen misconceptions (repeat these back only when relevant, and fix them):');\n    for (const m of misconceptions.slice(0, 8)) {\n      lines.push(`- \"${m.label}\"${m.count > 1 ? ` (seen ${m.count}×)` : ''}${m.detail ? ` — ${short(m.detail, 140)}` : ''}`);\n    }\n  }\n\n  const topErrors = Object.entries(errorCounts).sort((a, b) => b[1] - a[1]).slice(0, 3);\n  if (topErrors.length) {\n    lines.push(\n      `\\nRecent error profile: ${topErrors.map(([k, v]) => `${k} ×${v}`).join(', ')}.`,\n    );\n  }\n\n  if (attempts.length) {\n    lines.push('\\nMost recent attempts (newest first):');\n    for (const a of attempts.slice(0, 6)) {\n      const ratio = (a.score ?? 0) / (a.max_score || 1);\n      lines.push(\n        `- ${a.concept_name || 'unknown concept'} · ${ratio >= 0.8 ? 'correct' : ratio > 0 ? 'partial' : 'wrong'}` +\n          `${a.error_type && a.error_type !== 'none' ? ` (${a.error_type})` : ''}` +\n          `${a.misconception ? ` — ${short(a.misconception, 100)}` : ''}`,\n      );\n    }\n  }\n\n  if (due.length) {\n    lines.push(\n      `\\nDue for review: ${due.slice(0, 6).map((c) => `${c.name} (${describeDue(c)})`).join(', ')}.`,\n    );\n  }\n\n  if (goals.length) {\n    lines.push(\n      `\\nActive goals: ${goals.map((g) => `${g.title}${g.target_date ? ` by ${g.target_date}` : ''}`).join('; ')}.`,\n    );\n  }\n\n  if (strategy?.strategy && strategy.strategy !== 'diagnose') {\n    lines.push(`\\nRecommended teaching adjustment: ${strategy.strategy} — ${strategy.reason}`);\n  }\n\n  lines.push('</learner_model>');\n  return line
