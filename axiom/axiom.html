}),\n  );\n}\n\nexport const listGoals = (learnerId) => byLearner('goals', learnerId).sort(desc('created_at')).map(clone);\nexport const getGoal = (goalId) => clone(findById('goals', goalId));\n\n/* ------------------------------------------------------------------- sources */\n\nexport function saveSource(learnerId, source) {\n  return clone(\n    insert('sources', {\n      id: id('src'),\n      learner_id: learnerId,\n      name: source.name,\n      mime: source.mime,\n      bytes: source.bytes,\n      kind: source.kind,\n      // In the browser there is no filesystem: binary sources are held inline\n      // as base64 so they can go straight back up as a document block.\n      path: null,\n      data: source.data ?? null,\n      text: source.text ?? null,\n      summary: source.summary ?? null,\n      created_at: now(),\n    }),\n  );\n}\n\nexport const getSource = (sourceId) => clone(findById('sources', sourceId));\n\nexport const listSources = (learnerId) =>\n  byLearner('sources', learnerId)\n    .sort(desc('created_at'))\n    .map((s) => pick(s, ['id', 'name', 'mime', 'bytes', 'kind', 'summary', 'created_at']));\n\nexport function updateSourceSummary(sourceId, summary) {\n  const row = findById('sources', sourceId);\n  if (row) {\n    row.summary = summary;\n    persist();\n  }\n}\n\nexport function deleteSource(learnerId, sourceId) {\n  db.sources = db.sources.filter((s) => !(s.id === sourceId && s.learner_id === learnerId));\n  persist();\n}\n\n/* -------------------------------------------------------------------- events */\n\nexport function logEvent(learnerId, kind, detail = {}) {\n  insert('events', { id: id('evt'), learner_id: learnerId, kind, detail, created_at: now() });\n}\n\nexport const listEvents = (learnerId, limit = 40) =>\n  byLearner('events', learnerId).slice().reverse().slice(0, limit).map(clone);\n\n/* ------------------------------------------------------------------ courses */\n\nexport function saveCourse(learnerId, course) {\n  const ts = now();\n  const existing = course.id ? findById('courses', course.id) : null;\n  if (existing && existing.learner_id === learnerId) {\n    Object.assign(existing, {\n      title: course.title,\n      exam: course.exam ?? null,\n      subject: course.subject ?? null,\n      level: course.level ?? null,\n      exam_date: course.exam_date ?? null,\n      blueprint: course.blueprint ?? {},\n      state: course.state ?? {},\n      status: course.status || 'active',\n      updated_at: ts,\n    });\n    persist();\n    return clone(existing);\n  }\n  return clone(\n    insert('courses', {\n      id: course.id || id('crs'),\n      learner_id: learnerId,\n      title: course.title,\n      exam: course.exam ?? null,\n      subject: course.subject ?? null,\n      level: course.level ?? null,\n      exam_date: course.exam_date ?? null,\n      blueprint: course.blueprint ?? {},\n      state: course.state ?? {},\n      status: course.status || 'active',\n      created_at: ts,\n      updated_at: ts,\n    }),\n  );\n}\n\nexport const getCourse = (courseId) => clone(findById('courses', courseId));\n\nexport const listCourses = (learnerId) =>\n  byLearner('courses', learnerId).sort(desc('updated_at')).map(clone);\n\nexport function deleteCourse(learnerId, courseId) {\n  db.courses = db.courses.filter((c) => !(c.id === courseId && c.learner_id === learnerId));\n  persist();\n}\n\nexport function recordExamResult(learnerId, result) {\n  const resultId = id('exm');\n  insert('exam_results', {\n    id: resultId,\n    learner_id: learnerId,\n    course_id: result.course_id,\n    resource_id: result.resource_id ?? null,\n    percent: result.percent,\n    score: result.score ?? null,\n    by_unit: result.by_unit ?? {},\n    created_at: now(),\n  });\n  return resultId;\n}\n\nexport const listExamResults = (courseId, limit = 10) =>\n  db.exam_results\n    .filter((r) => r.course_id === courseId)\n    .sort(desc('created_at'))\n    .slice(0, limit)\n    .map(clone);\n","axiom:public/js/ui.js":"import { h, clear } from 'axiom:public/js/dom.js';\nimport { icon } from 'axiom:public/js/icons.js';\n\nlet toastHost;\n\nexport function toast(message, kind = 'info', ms = 5200) {\n  if (!toastHost) {\n    toastHost = h('div.toast-host');\n    document.body.appendChild(toastHost);\n  }\n  const node = h(\n    `div.toast.${kind}`,\n    {},\n    icon(kind === 'error' ? 'alert' : kind === 'success' ? 'checkCircle' : 'info', { size: 15 }),\n    h('span', {}, message),\n    h('button.close', { type: 'button', onClick: () => node.remove(), 'aria-label': 'Dismiss' }, icon('x', { size: 13 })),\n  );\n  toastHost.appendChild(node);\n  if (ms) setTimeout(() => node.remove(), ms);\n  return node;\n}\n\nexport function modal(build) {\n  const host = h('div.modal-host', {\n    onClick: (event) => {\n      if (event.target === host) close();\n    },\n  });\n  const close = () => {\n    host.remove();\n    document.removeEventListener('keydown', onKey);\n  };\n  const onKey = (event) => {\n    if (event.key === 'Escape') close();\n  };\n  document.addEventListener('keydown', onKey);\n  const panel = h('div.modal');\n  host.appendChild(panel);\n  document.body.appendChild(host);\n  build(panel, close);\n  return close;\n}\n\nexport function statusLine(message) {\n  return h('div.status-line', {}, h('span.spinner'), h('span', {}, message));\n}\n\nexport function skeleton(count = 3, height = 74) {\n  return h(\n    'div.stack',\n    {},\n    ...Array.from({ length: count }, () => h('div.skeleton', { style: { height: `${height}px` } })),\n  );\n}\n\nexport function emptyState(title, detail, action, art = 'compass') {\n  return h(\n    'div.empty',\n    {},\n    h('div.empty-art', {}, emptyArt(art)),\n    h('h3', {}, title),\n    detail ? h('p', {}, detail) : null,\n    action ? h('div', { style: { marginTop: '14px' } }, action) : null,\n  );\n}\n\n/** A quiet piece of geometry rather than a shrugging illustration. */\nfunction emptyArt(kind) {\n  const ns = 'http://www.w3.org/2000/svg';\n  const svg = document.createElementNS(ns, 'svg');\n  svg.setAttribute('viewBox', '0 0 68 68');\n  svg.setAttribute('width', '68');\n  svg.setAttribute('height', '68');\n  svg.setAttribute('fill', 'none');\n  svg.setAttribute('aria-hidden', 'true');\n  const rings = kind === 'grid'\n    ? '<rect x=\"10\" y=\"10\" width=\"20\" height=\"20\" rx=\"5\"/><rect x=\"38\" y=\"10\" width=\"20\" height=\"20\" rx=\"5\"/>' +\n      '<rect x=\"10\" y=\"38\" width=\"20\" height=\"20\" rx=\"5\"/><rect x=\"38\" y=\"38\" width=\"20\" height=\"20\" rx=\"5\" opacity=\".35\"/>'\n    : '<circle cx=\"34\" cy=\"34\" r=\"24\"/><circle cx=\"34\" cy=\"34\" r=\"14\" opacity=\".5\"/><circle cx=\"34\" cy=\"34\" r=\"4\" opacity=\".9\"/>';\n  svg.innerHTML = `<g stroke=\"var(--line-3)\" stroke-width=\"1.5\">${rings}</g>`;\n  return svg;\n}\n\n/* -------------------------------------------------------------------- theme */\n\nconst THEME_KEY = 'axiom:theme';\n\nexport function initTheme() {\n  const saved = localStorage.getItem(THEME_KEY);\n  const theme = saved || (window.matchMedia?.('(prefers-color-scheme: light)').matches ? 'light' : 'dark');\n  document.documentElement.dataset.theme = theme;\n  return theme;\n}\n\nexport function toggleTheme() {\n  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';\n  document.documentElement.dataset.theme = next;\n  localStorage.setItem(THEME_KEY, next);\n  return next;\n}\n\n/* ---------------------------------------------------------------- fragments */\n\n// Chart pieces live in render/charts.js; re-exported so views have one import.\nexport { masteryPips, masteryMeter, scoreRing, barRow, statTile, sparkline } from 'axiom:public/js/render/charts.js';\n\nexport { clear };\n","axiom:public/app.js":"import { h, clear } from 'axiom:public/js/dom.js';\nimport { icon } from 'axiom:public/js/icons.js';\nimport { route, setNotFound, startRouter, navigate, currentPath } from 'axiom:public/js/router.js';\nimport { api } from 'axiom:public/js/api.js';\nimport { state, update } from 'axiom:public/js/state.js';\nimport { initTheme, toggleTheme, toast, emptyState } from 'axiom:public/js/ui.js';\nimport { homeView } from 'axiom:public/js/views/home.js';\nimport { sessionView } from 'axiom:public/js/views/session.js';\nimport { dashboardView } from 'axiom:public/js/views/dashboard.js';\nimport { studioView } from 'axiom:public/js/views/studio.js';\nimport { libraryView, resourceView } from 'axiom:public/js/views/library.js';\nimport { progressView } from 'axiom:public/js/views/progress.js';\nimport { sourcesView } from 'axiom:public/js/views/sources.js';\nimport { reviewView } from 'axiom:public/js/views/review.js';\nimport { coursesView, courseView } from 'axiom:public/js/views/course.js';\nimport { settingsView } from 'axiom:public/js/views/settings.js';\n\nconst NAV = [\n  { path: '/dashboard', label: 'Dashboard', icon: 'home' },\n  { path: '/course', label: 'Courses', icon: 'route', href: '/courses' },\n  { path: '/studio', label: 'Studio', icon: 'wand' },\n  { path: '/review', label: 'Review', icon: 'repeat', badge: () => state.dashboard?.dueNow || 0 },\n  { path: '/progress', label: 'Mastery', icon: 'chart' },\n  { path: '/library', label: 'Library', icon: 'library' },\n  { path: '/sources', label: 'My material', icon: 'file' },\n];\n\nconst app = document.getElementById('app');\n\nroute('/', homeView);\nroute('/dashboard', dashboardView);\nroute('/session/:id', sessionView);\nroute('/studio', studioView);\nroute('/library', libraryView);\nroute('/resource/:id', resourceView);\nroute('/progress', progressView);\nroute('/sources', sourcesView);\nroute('/review', reviewView);\nroute('/courses', coursesView);\nroute('/course/:id', courseView);\nroute('/settings', settingsView);\nsetNotFound(() =>\n  h('div.page', {}, emptyState('That page does not exist', null, h('button.btn.primary', { type: 'button', onClick: () => navigate('/') }, 'Go home'))),\n);\n\n/* ------------------------------------------------------------------- shell */\n\nlet titleNode;\nlet subtitleNode;\nlet railNode;\n\nfunction buildShell(content) {\n  const rail = h('nav.rail');\n  railNode = rail;\n\n  rail.appendChild(\n    h(\n      'button.brand',\n      { type: 'button', onClick: () => navigate('/'), style: { background: 'none', width: '100%' } },\n      h('div.brand-mark', {}, icon('spark', { size: 17 })),\n      h('span.brand-name', {}, h('b', {}, 'Axiom')),\n    ),\n  );\n\n  rail.appendChild(\n    h(\n      'button.btn.primary',\n      { type: 'button', style: { margin: '0 10px 14px', width: 'calc(100% - 20px)' }, onClick: () => navigate('/') },\n      icon('plus', { size: 14 }),\n      'New session',\n    ),\n  );\n\n  const path = currentPath();\n  for (const item of NAV) {\n    const badge = item.badge?.() || 0;\n    rail.appendChild(\n      h(\n        'button',\n        {\n          type: 'button',\n          class: `nav-item${path.startsWith(item.path) ? ' is-active' : ''}`,\n          onClick: () => {\n            navigate(item.href || item.path);\n            rail.classList.remove('open');\n          },\n        },\n        h('span.nav-icon', {}, icon(item.icon, { size: 16 })),\n        item.label,\n        badge ? h('span.nav-badge', {}, String(badge)) : null,\n      ),\n    );\n  }\n\n  rail.appendChild(h('div.nav-group', {}, 'Recent sessions'));\n  const recentHost = h('div.stack', { style: { gap: '1px' } });\n  rail.appendChild(recentHost);\n  drawRecent(recentHost);\n\n  rail.appendChild(\n    h(\n      'div.rail-foot',\n      {},\n      h(\n        'button.nav-item',\n        { type: 'button', onClick: () => { toggleTheme(); render(); } },\n        h('span.nav-icon', {}, icon(document.documentElement.dataset.theme === 'dark' ? 'sun' : 'moon', { size: 16 })),\n        document.documentElement.dataset.theme === 'dark' ? 'Light mode' : 'Dark mode',\n      ),\n      h(\n        'button.nav-item',\n        { type: 'button', class: `nav-item${path.startsWith('/settings') ? ' is-active' : ''}`, onClick: () => { navigate('/settings'); rail.classList.remove('open'); } },\n        h('span.nav-icon', {}, icon('settings', { size: 16 })),\n        'Settings',\n      ),\n      h(\n        'button.tiny.dim',\n        {\n          type: 'button',\n          style: { padding: '8px 11px', background: 'none', border: 0, textAlign: 'left', width: '100%', cursor: 'pointer' },\n          onClick: () => navigate('/settings'),\n        },\n        state.health?.llmReady === false\n          ? h('span', { style: { color: 'var(--warning)' } }, 'No API key — add one')\n          : `${state.health?.model || 'model'} · quality control ${state.health?.qualityControl ? 'on' : 'off'}`,\n      ),\n    ),\n  );\n\n  titleNode = h('h1', {}, 'Axiom');\n  subtitleNode = h('span.topbar-sub', {});\n\n  const topbar = h(\n    'header.topbar',\n    {},\n    h(\n      'button.btn.icon.ghost',\n      {\n        type: 'button',\n        'aria-label': 'Menu',\n        style: { display: 'none' },\n        class: 'menu-button',\n        onClick: () => rail.classList.toggle('open'),\n      },\n      icon('menu', { size: 16 }),\n    ),\n    h('div', {}, titleNode, subtitleNode),\n    h(\n      'div.topbar-actions',\n      {},\n      h('button.btn.sm', { type: 'button', onClick: () => navigate('/studio') }, icon('wand', { size: 13 }), 'Make a worksheet'),\n      h('button.btn.sm.primary', { type: 'button', onClick: () => navigate('/') }, icon('sparkles', { size: 13 }), 'Learn'),\n    ),\n  );\n\n  return h('div.shell', {}, rail, h('div.main', {}, topbar, content));\n}\n\n/** Keep the rail's session list in step with what the learner has started. */\nexport function refreshSessions() {\n  return api\n    .sessions()\n    .then(({ sessions }) => {\n      const changed = sessions.length !== state.sessions.length || sessions[0]?.id !== state.sessions[0]?.id;\n      state.sessions = sessions;\n      const host = railNode?.querySelector('.nav-group + .stack');\n      if (host) drawRecent(host);\n      else if (changed && currentPath() !== '/') render();\n    })\n    .catch(() => {});\n}\n\nfunction drawRecent(host) {\n  const sessions = state.sessions || [];\n  clear(host);\n  if (!sessions.length) {\n    host.appendChild(h('p.tiny.dim', { style: { padding: '4px 11px' } }, 'No sessions yet.'));\n    return;\n  }\n  for (const session of sessions.slice(0, 6)) {\n    host.appendChild(\n      h(\n        'button.nav-item',\n        {\n          type: 'button',\n          title: session.title,\n          onClick: () => {\n            navigate(`/session/${session.id}`);\n            railNode?.classList.remove('open');\n          },\n        },\n        h('span.nav-icon', {}, icon('book', { size: 15 })),\n        h(\n          'span',\n          { style: { overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } },\n          session.title,\n        ),\n      ),\n    );\n  }\n}\n\nfunction setTitle(title, sub) {\n  if (titleNode) titleNode.textContent = title;\n  if (subtitleNode) subtitleNode.textContent = sub || '';\n  document.title = title === 'Axiom' ? 'Axiom — Tell me what you want to learn' : `${title} · Axiom`;\n}\n\ndocument.addEventListener('axiom:title', (event) => setTitle(event.detail.title, event.detail.sub));\n\nconst TITLES = {\n  '/dashboard': ['Dashboard', 'Your learning at a glance'],\n  '/studio': ['Studio', 'Generate anything you need'],\n  '/library': ['Library', 'Everything made for you'],\n  '/progress': ['Mastery', 'Concept by concept'],\n  '/sources': ['My material', 'Learn from your own documents'],\n  '/review': ['Review', 'Spaced retrieval queue'],\n  '/courses': ['Courses', 'Whole syllabuses, weighted by their exam'],\n  '/settings': ['Settings', 'How Axiom runs, and where your work lives'],\n};\n\n/* ------------------------------------------------------------------ render */\n\nlet currentView = null;\n\nfunction render(resolved) {\n  const target = resolved || { view: null, params: {}, path: currentPath() };\n  const isNavigation = Boolean(resolved) && resolved.path !== currentView?.path;\n  if (target.view) currentView = target;\n  if (!currentView) return;\n\n  const { view, params, path } = currentView;\n  const content = view({ params });\n\n  clear(app);\n  if (path === '/') {\n    app.appendChild(content);\n    document.title = 'Axiom — Tell me what you want to learn';\n    if (isNavigation) window.scrollTo({ top: 0, behavior: 'instant' });\n    refreshSessions();\n    return;\n  }\n\n  const holder = h('div', {}, content);\n  app.appendChild(buildShell(holder));\n  if (isNavigation) window.scrollTo({ top: 0, behavior: 'instant' });\n  const [title, sub] = TITLES[path] || ['Axiom', ''];\n  setTitle(title, sub);\n\n  // Mobile menu button visibility is handled by CSS width, not JS.\n  const menuButton = app.querySelector('.menu-button');\n  if (menuButton) menuButton.style.display = window.matchMedia('(max-width: 780px)').matches ? 'inline-flex' : 'none';\n}\n\n/* -------------------------------------------------------------------- boot */\n\nasync function boot() {\n  initTheme();\n  try {\n    update({ health: await api.health() });\n  } catch {\n    update({ health: { llmReady: false } });\n  }\n  refreshSessions();\n  api.dashboard().then((data) => update({ dashboard: data })).catch(() => {});\n\n  startRouter(render);\n\n  if (state.health?.llmReady === false) {\n    toast(\n      state.health?.runtime === 'browser'\n        ? 'No API key yet — open Settings to add one.'\n        : 'No ANTHROPIC_API_KEY is configured — add one to axiom/.env and restart the server.',\n      'error',\n      12000,\n    );\n  }\n}\n\nwindow.addEventListener('resize', () => {\n  const menuButton = app.querySelector('.menu-button');\n  if (menuButton) menuButton.style.display = window.matchMedia('(max-width: 780px)').matches ? 'inline-flex' : 'none';\n});\n\nboot();\n","axiom:browser/files.js":"import express from 'axiom:browser/express.js';\nimport { llm } from 'axiom:server/llm/index.js';\nimport { renderPrompt, systemPrompt } from 'axiom:browser/prompts.js';\nimport { sourceSchema } from 'axiom:server/schemas/index.js';\nimport { coerce } from 'axiom:server/engine/validate.js';\nimport { sourceBlocks } from 'axiom:browser/sources.js';\nimport { saveSource, getSource, updateSourceSummary, deleteSource, ensureLearner, logEvent } from 'axiom:browser/store.js';\nimport { logger } from 'axiom:server/util/log.js';\n\nconst log = logger('files');\nexport const files = express.Router();\n\nfiles.use((req, res, next) => {\n  req.learnerId = String(req.get('x-learner-id') || 'me').slice(0, 64);\n  ensureLearner(req.learnerId);\n  next();\n});\n\n/**\n * Uploads. The transport shim has already read each file in the browser, so\n * this only has to record them. Nothing is sent anywhere at upload time — a\n * document reaches the model only when a request actually cites it.\n */\nfiles.post('/sources', (req, res) => {\n  const incoming = req.files || [];\n  if (!incoming.length) {\n    return res.status(400).json({ error: req.uploadWarning || 'No files were uploaded.' });\n  }\n  const saved = incoming.map((file) => saveSource(req.learnerId, file));\n  logEvent(req.learnerId, 'sources_uploaded', { count: saved.length });\n  res.json({\n    sources: saved.map((s) => ({ id: s.id, name: s.name, kind: s.kind, bytes: s.bytes, mime: s.mime })),\n    warning: req.uploadWarning || null,\n  });\n});\n\nfiles.delete('/sources/:id', (req, res) => {\n  deleteSource(req.learnerId, req.params.id);\n  res.json({ ok: true });\n});\n\n// Read the document and work out what can usefully be built from it.\nfiles.post('/sources/:id/analyze', async (req, res) => {\n  const source = getSource(req.params.id);\n  if (!source || source.learner_id !== req.learnerId) return res.status(404).json({ error: 'Not found' });\n\n  try {\n    const { object } = await llm().run({\n      label: 'source-analysis',\n      system: [{ text: systemPrompt(), cache: true }],\n      messages: [\n        {\n          role: 'user',\n          content: [\n            ...sourceBlocks([source.id], req.learnerId),\n            { type: 'text', text: renderPrompt('source', { note: String(req.body?.note || '').slice(0, 1000) || '(none)' }) },\n          ],\n        },\n      ],\n      schema: sourceSchema,\n      effort: 'medium',\n      maxTokens: 8000,\n    });\n    const analysis = coerce(object, sourceSchema);\n    updateSourceSummary(source.id, analysis.summary);\n    res.json({ analysis, source: { id: source.id, name: source.name, kind: source.kind } });\n  } catch (err) {\n    log.warn(`source analysis failed: ${err.message}`);\n    res.status(err.status || 500).json({ error: err.message, retryable: Boolean(err.retryable) });\n  }\n});\n","axiom:server/routes/api.js":"import express from 'axiom:browser/express.js';\nimport { config, hasLLM } from 'axiom:browser/config.js';\nimport { streamHandler, throttle } from 'axiom:server/util/sse.js';\nimport { startSession, routeRequest } from 'axiom:server/engine/router.js';\nimport { runTutorTurn } from 'axiom:server/engine/tutor.js';\nimport { generateResource, RESOURCE_KINDS } from 'axiom:server/engine/generate.js';\nimport { evaluateAnswer, evaluateSubmission } from 'axiom:server/engine/evaluate.js';\nimport { generateInsights, localSignals, clearInsightCache } from 'axiom:server/engine/insights.js';\nimport { createCourse, courseSnapshot, listCoursesFor, generateExam, recordExam } from 'axiom:server/engine/course.js';\nimport { catalogue } from 'axiom:curriculum/index.js';\nimport { buildProfile } from 'axiom:server/engine/profile.js';\nimport { MASTERY_LABELS, masteryGap } from 'axiom:server/engine/mastery.js';\nimport { describeDue } from 'axiom:server/engine/review.js';\nimport { llm } from 'axiom:server/llm/index.js';\nimport {\n  ensureLearner,\n  updateLearner,\n  listSessions,\n  getSession,\n  listMessages,\n  updateSession,\n  listResources,\n  getResource,\n  saveResource,\n  listSessionResources,\n  listConcepts,\n  weakConcepts,\n  upcomingReviews,\n  dueConcepts,\n  listMisconceptions,\n  listGoals,\n  saveGoal,\n  listEvents,\n  listSources,\n  recentAttempts,\n  logEvent,\n  getCourse,\n  saveCourse,\n  deleteCourse,\n} from 'axiom:browser/store.js';\n\nexport const api = express.Router();\n\napi.use((req, res, next) => {\n  req.learnerId = String(req.get('x-learner-id') || 'me').slice(0, 64);\n  ensureLearner(req.learnerId);\n  next();\n});\n\nconst asyncRoute = (fn) => (req, res, next) => Promise.resolve(fn(req, res, next)).catch(next);\n\n/* --------------------------------------------------------------------- meta */\n\napi.get('/health', (req, res) => {\n  res.json({\n    ok: true,\n    provider: config.provider,\n    runtime: config.runtime,\n    model: llm().model,\n    llmReady: hasLLM(),\n    qualityControl: config.qualityControl,\n  });\n});\n\n// The courses whose syllabus and exam weightings are transcribed rather than\n// generated, so the interface can offer them by name.\napi.get('/curriculum', (req, res) => res.json({ courses: catalogue() }));\n\napi.get('/profile', (req, res) => {\n  const profile = buildProfile(req.learnerId);\n  res.json({\n    learner: { id: profile.learner.id, name: profile.learner.display_name, prefs: profile.learner.prefs },\n    stats: profile.stats,\n    subjects: profile.subjects,\n  });\n});\n\napi.patch('/profile', (req, res) => {\n  const learner = updateLearner(req.learnerId, {\n    display_name: req.body?.name,\n    prefs: req.body?.prefs,\n  });\n  res.json({ learner: { id: learner.id, name: learner.display_name, prefs: learner.prefs } });\n});\n\n/* ------------------------------------------------------------------ sessions */\n\n// Start a session: route the request, then stream the opening tutor turn.\napi.post('/learn/start', (req, res) => {\n  const { request, sourceIds = [] } = req.body || {};\n  if (!request || !String(request).trim()) {\n    return res.status(400).json({ error: 'Tell me what you want to learn.' });\n  }\n  return streamHandler(res, async (stream) => {\n    stream.send('status', { stage: 'routing', message: 'Working out what you need…' });\n    const { session, route } = await startSession({\n      learnerId: req.learnerId,\n      request: String(request).slice(0, 4000),\n      sourceIds,\n    });\n    stream.send('session', { session, route });\n\n    if (route.clarifying_question) {\n      stream.send('clarify', { question: route.clarifying_question, session });\n      return;\n    }\n\n    stream.send('status', { stage: 'teaching', message: 'Building your first move…' });\n    const push = throttle((partial) => stream.send('partial', partial));\n    const { turn } = await runTutorTurn({\n      learnerId: req.learnerId,\n      sessionId: session.id,\n      input: String(request),\n      onPartial: push,\n    });\n    stream.send('turn', { turn, session: getSession(session.id) });\n    stream.send('done', { sessionId: session.id });\n  });\n});\n\napi.post('/route', asyncRoute(async (req, res) => {\n  const route = await routeRequest({ learnerId: req.learnerId, request: String(req.body?.request || '') });\n  res.json({ route });\n}));\n\napi.get('/sessions', (req, res) => {\n  const sessions = listSessions(req.learnerId, 30).map((s) => ({\n    ...s,\n    resources: listSessionResources(s.id),\n  }));\n  res.json({ sessions });\n});\n\napi.get('/sessions/:id', (req, res) => {\n  const session = getSession(req.params.id);\n  if (!session || session.learner_id !== req.learnerId) return res.status(404).json({ error: 'Session not found' });\n  res.json({\n    session,\n    messages: listMessages(session.id),\n    resources: listSessionResources(session.id),\n  });\n});\n\n// One turn of the teaching loop.\napi.post('/sessions/:id/turn', (req, res) => {\n  const session = getSession(req.params.id);\n  if (!session || session.learner_id !== req.learnerId) return res.status(404).json({ error: 'Session not found' });\n  const { input = '', directive = null } = req.body || {};\n  if (!String(input).trim() && !directive) return res.status(400).json({ error: 'Nothing to respond to.' });\n\n  return streamHandler(res, async (stream) => {\n    const push = throttle((partial) => stream.send('partial', partial));\n    const { turn, evaluation } = await runTutorTurn({\n      learnerId: req.learnerId,\n      sessionId: session.id,\n      input: String(input).slice(0, 8000),\n      directive,\n      onPartial: push,\n      onEvaluation: (outcome) => stream.send('evaluation', serialiseOutcome(outcome)),\n    });\n    stream.send('turn', { turn, evaluation: evaluation ? serialiseOutcome(evaluation) : null, session: getSession(session.id) });\n    stream.send('done', {});\n  });\n});\n\napi.patch('/sessions/:id', (req, res) => {\n  const session = getSession(req.params.id);\n  if (!session || session.learner_id !== req.learnerId) return res.status(404).json({ error: 'Session not found' });\n  const updated = updateSession(session.id, {\n    mode: req.body?.mode,\n    status: req.body?.status,\n    state: req.body?.state ? { ...session.state, ...req.body.state } : undefined,\n  });\n  res.json({ session: updated });\n});\n\nfunction serialiseOutcome(outcome) {\n  if (!outcome) return null;\n  return {\n    grade: outcome.grade,\n    concept: {\n      id: outcome.concept.id,\n      name: outcome.concept.name,\n      mastery_level: outcome.concept.mastery_level,\n      mastery_label: MASTERY_LABELS[outcome.concept.mastery_level],\n      ability: outcome.concept.ability,\n      streak: outcome.concept.streak,\n      next_review_at: outcome.concept.next_review_at,\n      gap: masteryGap(outcome.concept),\n    },\n    next: outcome.next,\n  };\n}\n\n/* ----------------------------------------------------------------- resources */\n\napi.get('/resource-kinds', (req, res) => res.json({ kinds: Object.keys(RESOURCE_KINDS) }));\n\n// The one generator behind every \"make me a ...\" in the product.\napi.post('/generate', (req, res) => {\n  const body = req.body || {};\n  if (!RESOURCE_KINDS[body.kind]) return res.status(400).json({ error: `Unknown resource kind: ${body.kind}` });\n  if (!body.topic) return res.status(400).json({ error: 'A topic is required.' });\n\n  return streamHandler(res, async (stream) => {\n    stream.send('status', { stage: 'generating', message: `Building your ${String(body.kind).replace(/_/g, ' ')}…` });\n    const push = throttle((partial) => stream.send('partial', partial), 120);\n    const resource = await generateResource({\n      learnerId: req.learnerId,\n      kind: body.kind,\n      topic: String(body.topic).slice(0, 300),\n      subject: body.subject || 'General',\n      level: body.level || '',\n      difficulty: body.difficulty,\n      count: body.count,\n      minutes: body.minutes,\n      days: body.days,\n      types: body.types,\n      concepts: body.concepts || [],\n      instructions: String(body.instructions || '').slice(0, 2000),\n      sourceIds: body.sourceIds || [],\n      sessionId: body.sessionId || null,\n      examContext: body.examContext,\n      goal: body.goal,\n      onPartial: push,\n    });\n    clearInsightCache(req.learnerId);\n    stream.send('resource', { resource });\n    stream.send('done', { resourceId: resource.id });\n  });\n});\n\napi.get('/resources', (req, res) => {\n  res.json({ resources: listResources(req.learnerId, { limit: Number(req.query.limit) || 40, kind: req.query.kind }) });\n});\n\napi.get('/resources/:id', (req, res) => {\n  const resource = getResource(req.params.id);\n  if (!resource || resource.learner_id !== req.learnerId) return res.status(404).json({ error: 'Not found' });\n  res.json({ resource });\n});\n\n// Submit a whole worksheet / quiz / test and get it graded and analysed.\napi.post('/resources/:id/submit', (req, res) => {\n  const resource = getResource(req.params.id);\n  if (!resource || resource.learner_id !== req.learnerId) return res.status(404).json({ error: 'Not found' });\n\n  return streamHandler(res, async (stream) => {\n    const answers = req.body?.answers || {};\n    const elapsed = req.body?.elapsed || {};\n    const payload = resource.payload || {};\n    const questions = payload.questions || payload.self_test || payload.checks || [];\n    stream.send('status', { stage: 'grading', message: `Grading ${questions.length} answers…` });\n\n    const graded = await evaluateSubmission({\n      learnerId: req.learnerId,\n      resource,\n      answers,\n      elapsed,\n      sessionId: resource.session_id,\n    });\n\n    const results = graded.results.map((r) => ({\n      questionId: r.questionId,\n      skipped: Boolean(r.skipped),\n      grade: r.grade,\n      concept: r.concept\n        ? {\n            name: r.concept.name,\n            mastery_level: r.concept.mastery_level,\n            mastery_label: MASTERY_LABELS[r.concept.mastery_level],\n            ability: r.concept.ability,\n          }\n        : null,\n    }));\n\n    const analysis = analyseSubmission(graded, questions);\n    const missed = graded.results.filter((r) => (r.grade?.score || 0) < (r.grade?.max_score || 1) * 0.8);\n    const remediation = missed.length\n      ? {\n          available: true,\n          concepts: [...new Set(missed.map((r) => r.grade?.concept).filter(Boolean))],\n          questionIds: missed.map((r) => r.questionId),\n        }\n      : { available: false };\n\n    saveResource(req.learnerId, {\n      ...resource,\n      // The analysis is persisted with the submission so reopening a graded\n      // paper shows the same breakdown rather than a bare score.\n      payload: { ...payload, submission: { answers, results, analysis, remediation, at: new Date().toISOString() } },\n      status: 'graded',\n      score: graded.score,\n      max_score: graded.maxScore,\n    });\n    // A paper generated from a course blueprint calibrates that course's\n    // prediction against what the learner actually scored.\n    let examOutcome = null;\n    if (payload.course_id) {\n      examOutcome = recordExam({\n        learnerId: req.learnerId,\n        courseId: payload.course_id,\n        resource,\n        results: graded.results,\n      });\n    }\n\n    clearInsightCache(req.learnerId);\n    logEvent(req.learnerId, 'resource_graded', {\n      resourceId: resource.id,\n      kind: resource.kind,\n      score: graded.score,\n      max: graded.maxScore,\n    });\n\n    stream.send('graded', {\n      score: graded.score,\n      maxScore: graded.maxScore,\n      results,\n      analysis,\n      remediation,\n      exam: examOutcome\n        ? { ...examOutcome, courseId: payload.course_id, snapshot: courseSnapshot(req.learnerId, payload.course_id) }\n        : null,\n    });\n    stream.send('done', {});\n  });\n});\n\nfunction analyseSubmission(graded, questions) {\n  const byConcept = new Map();\n  const byError = {};\n  for (const r of graded.results) {\n    const concept = r.grade?.concept || 'Unknown';\n    const entry = byConcept.get(concept) || { concept, correct: 0, total: 0 };\n    entry.total++;\n    if ((r.grade?.score || 0) >= (r.grade?.max_score || 1) * 0.8) entry.correct++;\n    byConcept.set(concept, entry);\n    const type = r.grade?.error_type;\n    if (type && type !== 'none') byError[type] = (byError[type] || 0) + 1;\n  }\n  const weakest = [...byConcept.values()].filter((c) => c.correct < c.total).sort((a, b) => a.correct / a.total - b.correct / b.total);\n  const dominantError = Object.entries(byError).sort((a, b) => b[1] - a[1])[0];\n  return {\n    byConcept: [...byConcept.values()],\n    byError,\n    weakest: weakest.slice(0, 3),\n    headline: weakest.length\n      ? `${weakest[0].concept} is where this went wrong — ${weakest[0].correct}/${weakest[0].total} correct.`\n      : `Clean sweep: ${graded.score}/${graded.maxScore}.`,\n    dominantError: dominantError ? { type: dominantError[0], count: dominantError[1] } : null,\n    difficultyProfile: questions.map((q) => ({\n      id: q.id,\n      difficulty: q.difficulty,\n      correct: (graded.results.find((r) => r.questionId === q.id)?.grade?.score || 0) >= (Number(q.points) || 1) * 0.8,\n    })),\n  };\n}\n\n// Targeted follow-up built from exactly what they got wrong.\napi.post('/resources/:id/remediate', (req, res) => {\n  const resource = getResource(req.params.id);\n  if (!resource || resource.learner_id !== req.learnerId) return res.status(404).json({ error: 'Not found' });\n\n  return streamHandler(res, async (stream) => {\n    const submission = resource.payload?.submission;\n    const questions = resource.payload?.questions || resource.payload?.self_test || [];\n    const missed = (submission?.results || []).filter(\n      (r) => (r.grade?.score || 0) < (r.grade?.max_score || 1) * 0.8,\n    );\n    if (!missed.length) {\n      stream.send('error', { message: 'Nothing to remediate — everything was correct.' });\n      return;\n    }\n\n    const detail = missed\n      .map((r) => {\n        const q = questions.find((x) => x.id === r.questionId);\n        return `- Concept \"${r.grade?.concept}\": missed \"${q?.prompt?.slice(0, 160)}\" — ${r.grade?.error_type}${r.grade?.misconception ? `, because they ${r.grade.misconception}` : ''}`;\n      })\n      .join('\\n');\n\n    const concepts = [...new Set(missed.map((r) => r.grade?.concept).filter(Boolean))];\n    stream.send('status', { stage: 'generating', message: `Targeting ${concepts.length} weak concept(s)…` });\n    const push = throttle((partial) => stream.send('partial', partial), 120);\n\n    const followUp = await generateResource({\n      learnerId: req.learnerId,\n      kind: 'practice_set',\n      topic: resource.topic || resource.payload?.topic || concepts[0],\n      subject: resource.subject || 'General',\n      concepts,\n      count: Math.min(8, Math.max(3, missed.length * 2)),\n      difficulty: req.body?.difficulty,\n      sessionId: resource.session_id,\n      instructions: [\n        'This is a REMEDIATION set built from a specific failed attempt.',\n        'Target exactly these failures:',\n        detail,\n        '',\n        'For each failed idea: start with one question that isolates the broken step at a slightly',\n        'lower difficulty, then one at the original difficulty, then one that requires the same idea',\n        'in a different surface form so a memorised fix cannot pass.',\n      ].join('\\n'),\n      onPartial: push,\n    });\n\n    stream.send('resource', { resource: followUp });\n    stream.send('done', { resourceId: followUp.id });\n  });\n});\n\n/* -------------------------------------------------------------------- answers */\n\n// Grade a single answer (tutor activities, per-question worksheet checks).\napi.post('/answers/grade', asyncRoute(async (req, res) => {\n  const { question, answer, sessionId = null, resourceId = null, attemptNumber = 1, elapsedMs = null, subject } = req.body || {};\n  if (!question?.prompt) return res.status(400).json({ error: 'A question is required.' });\n  const outcome = await evaluateAnswer({\n    learnerId: req.learnerId,\n    sessionId,\n    resourceId,\n    question,\n    answer,\n    attemptNumber,\n    elapsedMs,\n    subject: subject || 'General',\n  });\n  clearInsightCache(req.learnerId);\n  res.json(serialiseOutcome(outcome));\n}));\n\n/* ------------------------------------------------------------------ dashboard */\n\napi.get('/dashboard', (req, res) => {\n  const learnerId = req.learnerId;\n  const profile = buildProfile(learnerId);\n  const concepts = listConcepts(learnerId);\n\n  const bySubject = {};\n  for (const c of concepts) {\n    const bucket = (bySubject[c.subject] ||= { subject: c.subject, concepts: [], mastered: 0, total: 0, score: 0 });\n    bucket.concepts.push({\n      id: c.id,\n      name: c.name,\n      mastery_level: c.mastery_level,\n      mastery_label: MASTERY_LABELS[c.mastery_level],\n      ability: c.ability,\n      attempts: c.attempts,\n      accuracy: c.attempts ? c.correct / c.attempts : null,\n      next_review_at: c.next_review_at,\n      due: describeDue(c),\n      gap: masteryGap(c),\n    });\n    bucket.total++;\n    bucket.score += c.mastery_level;\n    if (c.mastery_level >= 5) bucket.mastered++;\n  }\n  for (const bucket of Object.values(bySubject)) {\n    bucket.average = bucket.total ? bucket.score / bucket.total : 0;\n    bucket.concepts.sort((a, b) => a.mastery_level - b.mastery_level);\n  }\n\n  res.json({\n    stats: profile.stats,\n    continueLearning: listSessions(learnerId, 6).map((s) => ({\n      id: s.id,\n      title: s.title,\n      mode: s.mode,\n      topic: s.topic,\n      phase: s.state?.phase,\n      focus: s.state?.focusConcept,\n      turns: s.state?.turnCount || 0,\n      updated_at: s.updated_at,\n      status: s.status,\n    })),\n    subjects: Object.values(bySubject).sort((a, b) => b.total - a.total),\n    weakAreas: weakConcepts(learnerId, 8).map((c) => ({\n      id: c.id,\n      name: c.name,\n      subject: c.subject,\n      mastery_level: c.mastery_level,\n      accuracy: c.attempts ? c.correct / c.attempts : null,\n      attempts: c.attempts,\n      gap: masteryGap(c),\n    })),\n    upcomingReviews: upcomingReviews(learnerId, 10).map((c) => ({\n      id: c.id,\n      name: c.name,\n      subject: c.subject,\n      due: describeDue(c),\n      next_review_at: c.next_review_at,\n      overdue: new Date(c.next_review_at) <= new Date(),\n      mastery_level: c.mastery_level,\n    })),\n    dueNow: dueConcepts(learnerId).length,\n    misconceptions: listMisconceptions(learnerId, { openOnly: true, limit: 8 }),\n    recentWork: listResources(learnerId, { limit: 10 }),\n    goals: listGoals(learnerId).map((g) => withProgress(learnerId, g)),\n    signals: localSignals(profile),\n    activity: listEvents(learnerId, 12),\n  });\n});\n\napi.get('/insights', asyncRoute(async (req, res) => {\n  res.json(await generateInsights(req.learnerId, { force: req.query.force === '1' }));\n}));\n\napi.get('/concepts', (req, res) => {\n  res.json({\n    concepts: listConcepts(req.learnerId).map((c) => ({\n      ...c,\n      mastery_label: MASTERY_LABELS[c.mastery_level],\n      accuracy: c.attempts ? c.correct / c.attempts : null,\n      due: describeDue(c),\n      gap: masteryGap(c),\n    })),\n  });\n});\n\napi.get('/history', (req, res) => {\n  res.json({ attempts: recentAttempts(req.learnerId, Number(req.query.limit) || 50) });\n});\n\n/* ---------------------------------------------------------------------- goals */\n\napi.get('/goals', (req, res) => res.json({ goals: listGoals(req.learnerId).map((g) => withProgress(req.learnerId, g)) }));\n\n/**\n * Progress against a goal is measured the same way as everything else: by\n * demonstrated mastery of the concepts the goal covers, never by activity count.\n */\nfunction withProgress(learnerId, goal) {\n  const names = (goal.roadmap?.concepts || []).map((n) => String(n).toLowerCase());\n  const concepts = listConcepts(learnerId).filter((c) =>\n    names.length ? names.includes(c.name.toLowerCase()) : c.subject === goal.subject,\n  );\n  const total = concepts.length;\n  const earned = concepts.reduce((sum, c) => sum + c.mastery_level, 0);\n  return {\n    ...goal,\n    progress: total ? earned / (total * 5) : 0,\n    tracked: total,\n    mastered: concepts.filter((c) => c.mastery_level >= 5).length,\n  };\n}\n\napi.post('/goals', (req, res) => {\n  const { title, subject, targetDate, detail } = req.body || {};\n  if (!title) return res.status(400).json({ error: 'A goal needs a title.' });\n  const goal = saveGoal(req.learnerId, { title, subject, target_date: targetDate, detail });\n  res.json({ goal });\n});\n\napi.patch('/goals/:id', (req, res) => {\n  const goal = listGoals(req.learnerId).find((g) => g.id === req.params.id);\n  if (!goal) return res.status(404).json({ error: 'Not found' });\n  const merged = saveGoal(req.learnerId, {\n    ...goal,\n    ...req.body,\n    roadmap: req.body?.roadmap ? { ...goal.roadmap, ...req.body.roadmap } : goal.roadmap,\n  });\n  res.json({ goal: withProgress(req.learnerId, merged) });\n});\n\n/* --------------------------------------------------------------------- review */\n\napi.get('/review/queue', (req, res) => {\n  const due = dueConcepts(req.learnerId);\n  res.json({\n    due: due.map((c) => ({\n      id: c.id,\n      name: c.name,\n      subject: c.subject,\n      mastery_level: c.mastery_level,\n      stage: c.review_stage,\n      due: describeDue(c),\n    })),\n    upcoming: upcomingReviews(req.learnerId, 12).map((c) => ({\n      id: c.id,\n      name: c.name,\n      subject: c.subject,\n      due: describeDue(c),\n      mastery_level: c.mastery_level,\n    })),\n  });\n});\n\napi.get('/sources', (req, res) => res.json({ sources: listSources(req.learnerId) }));\n\n/* -------------------------------------------------------------------- courses */\n\napi.get('/courses', (req, res) => res.json({ courses: listCoursesFor(req.learnerId) }));\n\n// Build a whole course: the real syllabus, with the exam's own weighting.\napi.post('/courses', (req, res) => {\n  const { request, subject, level, examDate, instructions, sourceIds = [] } = req.body || {};\n  if (!request || !String(request).trim()) {\n    return res.status(400).json({ error: 'Name the course or exam you are preparing for.' });\n  }\n  return streamHandler(res, async (stream) => {\n    stream.send('status', { stage: 'blueprint', message: 'Mapping the syllabus and its exam weighting…' });\n    const push = throttle((partial) => stream.send('partial', partial), 140);\n    const course = await createCourse({\n      learnerId: req.learnerId,\n      request: String(request).slice(0, 400),\n      subject,\n      level,\n      examDate,\n      instructions: String(instructions || '').slice(0, 1500),\n      sourceIds,\n      onPartial: push,\n    });\n    clearInsightCache(req.learnerId);\n    stream.send('course', { snapshot: courseSnapshot(req.learnerId, course.id) });\n    stream.send('done', { courseId: course.id });\n  });\n});\n\napi.get('/courses/:id', (req, res) => {\n  const snapshot = courseSnapshot(req.learnerId, req.params.id);\n  if (!snapshot) return res.status(404).json({ error: 'Course not found' });\n  res.json(snapshot);\n});\n\napi.patch('/courses/:id', (req, res) => {\n  const course = getCourse(req.params.id);\n  if (!course || course.learner_id !== req.learnerId) return res.status(404).json({ error: 'Course not found' });\n  saveCourse(req.learnerId, {\n    ...course,\n    exam_date: req.body?.examDate !== undefined ? req.body.examDate : course.exam_date,\n    state: {\n      ...course.state,\n      ...(req.body?.targetScore != null ? { targetScore: Number(req.body.targetScore) } : {}),\n      ...(req.body?.minutesPerDay != null ? { minutesPerDay: Number(req.body.minutesPerDay) } : {}),\n    },\n  });\n  res.json(courseSnapshot(req.learnerId, req.params.id));\n});\n\napi.delete('/courses/:id', (req, res) => {\n  deleteCourse(req.learnerId, req.params.id);\n  res.json({ ok: true });\n});\n\n// Build the next activity the readiness model says is worth the most marks.\napi.post('/courses/:id/next', (req, res) => {\n  const snapshot = courseSnapshot(req.learnerId, req.params.id);\n  if (!snapshot) return res.status(404).json({ error: 'Course not found' });\n\n  return streamHandler(res, async (stream) => {\n    const action = snapshot.action;\n    stream.send('action', { action });\n\n    if (action.resource === 'exam') {\n      stream.send('status', { stage: 'generating', message: 'Building a full practice paper to the exam blueprint…' });\n      const push = throttle((partial) => stream.send('partial', partial), 140);\n      const resource = await generateExam({ learnerId: req.learnerId, courseId: req.params.id, onPartial: push });\n      stream.send('resource', { resource });\n      stream.send('done', { resourceId: resource.id });\n      return;\n    }\n\n    const unit = snapshot.readiness.leverage[0];\n    stream.send('status', { stage: 'generating', message: action.title });\n    const push = throttle((partial) => stream.send('partial', partial), 140);\n    const resource = await generateResource({\n      learnerId: req.learnerId,\n      kind: action.resource === 'review' ? 'review' : action.resource,\n      topic: action.unit || unit?.title || snapshot.course.title,\n      subject: snapshot.course.subject,\n      concepts: action.concepts?.length ? action.concepts : unit?.weakest || [],\n      difficulty: action.kind === 'master' ? 4.5 : undefined,\n      instructions:\n        `This sits inside \"${snapshot.course.title}\". ${action.why} ` +\n        'Pitch it at the level the real exam asks at, not at revision level.',\n      onPartial: push,\n    });\n    clearInsightCache(req.learnerId);\n    stream.send('resource', { resource });\n    stream.send('done', { resourceId: resource.id });\n  });\n});\n\n// A full mock paper built to the course blueprint.\napi.post('/courses/:id/exam', (req, res) => {\n  const snapshot = courseSnapshot(req.learnerId, req.params.id);\n  if (!snapshot) return res.status(404).json({ error: 'Course not found' });\n\n  return streamHandler(res, async (stream) => {\n    stream.send('status', { stage: 'generating', message: 'Writing a paper to the real blueprint…' });\n    const push = throttle((partial) => stream.send('partial', partial), 140);\n    const resource = await generateExam({ learnerId: req.learnerId, courseId: req.params.id, onPartial: push });\n    stream.send('resource', { resource });\n    stream.send('done', { resourceId: resource.id });\n  });\n});\n","axiom:server/util/log.js":"import { config } from 'axiom:browser/config.js';\n\nconst LEVELS = { debug: 10, info: 20, warn: 30, error: 40, silent: 99 };\nconst threshold = LEVELS[config.logLevel] ?? 20;\n\nfunction emit(level, scope, msg, extra) {\n  if (LEVELS[level] < threshold) return;\n  const stamp = new Date().toISOString().slice(11, 23);\n  const line = `${stamp} ${level.toUpperCase().padEnd(5)} [${scope}] ${msg}`;\n  const stream = level === 'error' || level === 'warn' ? console.error : console.log;\n  if (extra !== undefined) stream(line, extra);\n  else stream(line);\n}\n\nexport function logger(scope) {\n  return {\n    debug: (m, e) => emit('debug', scope, m, e),\n    info: (m, e) => emit('info', scope, m, e),\n    warn: (m, e) => emit('warn', scope, m, e),\n    error: (m, e) => emit('error', scope, m, e),\n  };\n}\n","axiom:browser/ids.js":"/** Browser replacement for server/util/ids.js — same ids, no node:crypto. */\n\nconst hex = (bytes) => Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');\n\nexport const uuid = () =>\n  crypto.randomUUID\n    ? crypto.randomUUID()\n    : hex(crypto.getRandomValues(new Uint8Array(16))).replace(\n        /^(.{8})(.{4})(.{4})(.{4})(.{12})$/,\n        '$1-$2-$3-$4-$5',\n      );\n\n/** Short, URL-safe, sortable-ish id: <prefix>_<time36><rand>. */\nexport function id(prefix = 'x') {\n  return `${prefix}_${Date.now().toString(36)}${hex(crypto.getRandomValues(new Uint8Array(4)))}`;\n}\n\nexport function slug(text) {\n  return String(text || '')\n    .toLowerCase()\n    .normalize('NFKD')\n    .replace(/[^\\w\\s-]/g, '')\n    .trim()\n    .replace(/[\\s_-]+/g, '-')\n    .slice(0, 80) || 'concept';\n}\n","axiom:public/js/render/charts.js":"import { h, clear } from 'axiom:public/js/dom.js';\nimport { icon } from 'axiom:public/js/icons.js';\n\n/**\n * Chart components.\n *\n * Colour here is assigned by the job it does, not by taste:\n *   · mastery 0-5 is ordered magnitude  → one-hue ordinal ramp (--m0..--m5)\n *   · concept identity                  → the validated categorical order (--s1..--s8)\n *   · good / warning / serious / critical → the reserved status palette, always\n *     shipped with an icon or a label so state never rides on colour alone.\n *\n * Marks follow one spec everywhere: bars capped at 24px with a 4px rounded\n * data-end and a square baseline, a 2px surface gap between touching marks,\n * 2px lines, markers of at least 8px carrying a 2px surface ring, hairline\n * recessive gridlines, and selective direct labels rather than a number on\n * every mark.\n */\n\nconst NS = 'http://www.w3.org/2000/svg';\nconst SERIES = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)', 'var(--s7)', 'var(--s8)'];\nexport const MASTERY_STEPS = ['var(--m0)', 'var(--m1)', 'var(--m2)', 'var(--m3)', 'var(--m4)', 'var(--m5)'];\nexport const MASTERY_LABELS = ['Not introduced', 'Introduced', 'Developing', 'Competent', 'Strong', 'Mastered'];\n\nconst BAR_MAX = 24;\nconst GAP = 2; // the surface gap that does the separating\n\nexport const seriesColour = (index) => SERIES[index % SERIES.length];\nexport const masteryColour = (level) => MASTERY_STEPS[Math.max(0, Math.min(5, Math.round(level)))];\n\nfunction el(tag, attrs = {}, ...children) {\n  const node = document.createElementNS(NS, tag);\n  for (const [key, value] of Object.entries(attrs)) {\n    if (value != null) node.setAttribute(key, String(value));\n  }\n  for (const child of children.flat()) {\n    if (child != null) node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);\n  }\n  return node;\n}\n\nfunction svgRoot(width, height, { label } = {}) {\n  return el('svg', {\n    viewBox: `0 0 ${width} ${height}`,\n    width: '100%',\n    style: `max-height:${height}px`,\n    role: 'img',\n    'aria-label': label || '',\n    preserveAspectRatio: 'xMinYMid meet',\n  });\n}\n\n/**\n * A bar whose data-end is rounded 4px and whose baseline end stays square.\n * Drawn as a path so the two ends can differ.\n */\nfunction barPath(x, y, w, hgt, r, horizontal) {\n  const radius = Math.max(0, Math.min(r, horizontal ? w : hgt));\n  if (horizontal) {\n    return `M${x},${y} H${x + w - radius} A${radius},${radius} 0 0 1 ${x + w},${y + radius}\n            V${y + hgt - radius} A${radius},${radius} 0 0 1 ${x + w - radius},${y + hgt} H${x} Z`;\n  }\n  return `M${x},${y + hgt} V${y + radius} A${radius},${radius} 0 0 1 ${x + radius},${y}\n          H${x + w - radius} A${radius},${radius} 0 0 1 ${x + w},${y + radius} V${y + hgt} Z`;\n}\n\n/* ------------------------------------------------------------------ tooltip */\n\nlet tipNode;\n\nfunction showTip(event, html) {\n  if (!tipNode) {\n    tipNode = h('div.viz-tip');\n    document.body.appendChild(tipNode);\n  }\n  tipNode.innerHTML = html;\n  tipNode.style.display = 'block';\n  moveTip(event);\n}\n\nfunction moveTip(event) {\n  if (!tipNode) return;\n  const pad = 14;\n  const rect = tipNode.getBoundingClientRect();\n  let x = event.clientX + pad;\n  let y = event.clientY + pad;\n  if (x + rect.width > window.innerWidth - 8) x = event.clientX - rect.width - pad;\n  if (y + rect.height > window.innerHeight - 8) y = event.clientY - rect.height - pad;\n  tipNode.style.left = `${Math.max(8, x)}px`;\n  tipNode.style.top = `${Math.max(8, y)}px`;\n}\n\nfunction hideTip() {\n  if (tipNode) tipNode.style.display = 'none';\n}\n\n/** Attach the hover layer to a mark. Hit target is the mark plus padding. */\nfunction hoverable(node, html) {\n  node.classList.add('viz-mark');\n  node.addEventListener('pointerenter', (event) => showTip(event, html));\n  node.addEventListener('pointermove', moveTip);\n  node.addEventListener('pointerleave', hideTip);\n  node.addEventListener('pointercancel', hideTip);\n  return node;\n}\n\n/* ------------------------------------------------------------------ shell */\n\nfunction vizShell({ title, note, body, legendItems, table }) {\n  const root = h('figure.viz');\n  if (title || note) {\n    root.appendChild(\n      h('figcaption.viz-head', {}, title ? h('span.viz-title', {}, title) : null, note ? h('span.viz-note', {}, note) : null),\n    );\n  }\n  root.appendChild(body);\n  if (legendItems?.length) root.appendChild(legend(legendItems));\n  if (table) root.appendChild(tableToggle(table));\n  return root;\n}\n\n/** Identity is never colour-alone: every multi-series chart carries a legend. */\nexport function legend(items) {\n  return h(\n    'div.viz-legend',\n    {},\n    ...items.map((item) =>\n      h(\n        'span.viz-legend-item',\n        {},\n        h('span.viz-swatch', { style: { background: item.colour } }),\n        h('span', {}, item.label),\n      ),\n    ),\n  );\n}\n\n/** Every chart ships an equivalent table — the non-visual read of the data. */\nexport function tableToggle({ columns, rows, label = 'Show the numbers' }) {\n  const host = h('div');\n  let open = false;\n  const button = h(\n    'button.btn.sm.ghost',\n    {\n      type: 'button',\n      onClick: () => {\n        open = !open;\n        button.lastChild.textContent = open ? 'Hide the numbers' : label;\n        clear(host);\n        if (open) {\n          host.appendChild(\n            h(\n              'table.viz-table',\n              {},\n              h('thead', {}, h('tr', {}, ...columns.map((c) => h('th', {}, c)))),\n              h('tbody', {}, ...rows.map((row) => h('tr', {}, ...row.map((cell) => h('td', {}, String(cell)))))),\n            ),\n          );\n        }\n      },\n    },\n    icon('library', { size: 12 }),\n    document.createTextNode(label),\n  );\n  return h('div', { style: { display: 'grid', gap: '8px', justifyItems: 'start' } }, button, host);\n}\n\n/* ------------------------------------------------------------- stat tiles */\n\n/**\n * label · value · a neutral supporting line · an optional status flag.\n *\n * `delta` is descriptive text and stays in ink. `status` is the reserved\n * palette and therefore always ships with an icon as well as its colour —\n * state never rides on colour alone. A count is not a delta, so it never\n * gets a direction arrow.\n */\nexport function statTile({ label, value, delta, status, trend, wide = false }) {\n  const STATUS_ICON = { good: 'checkCircle', warning: 'alert', critical: 'alert' };\n  return h(\n    `div.stat${wide ? '.is-wide' : ''}`,\n    {},\n    h('span.stat-label', {}, label),\n    h('span.stat-value', {}, String(value)),\n    delta ? h('span.stat-delta', {}, delta) : null,\n    status\n      ? h(\n          'span',\n          { class: `stat-delta is-${status.kind}` },\n          icon(STATUS_ICON[status.kind] || 'info', { size: 12 }),\n          status.text,\n        )\n      : null,\n    trend?.length > 1 ? h('div.stat-spark', {}, sparkline(trend)) : null,\n  );\n}\n\n/** 12-point trend line: de-emphasised history, accent on the current point. */\nexport function sparkline(values, { width = 132, height = 30, colour = 'var(--brand)' } = {}) {\n  const points = values.slice(-12);\n  if (points.length < 2) return h('div');\n  const min = Math.min(...points);\n  const max = Math.max(...points);\n  const span = max - min || 1;\n  const step = width / (points.length - 1);\n  const x = (i) => i * step;\n  const y = (v) => height - 3 - ((v - min) / span) * (height - 6);\n\n  const svg = svgRoot(width, height, { label: 'Recent trend' });\n  const path = points.map((v, i) => `${i ? 'L' : 'M'} ${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');\n\n  svg.appendChild(\n    el('path', {\n      d: `${path} L ${width} ${height} L 0 ${height} Z`,\n      fill: colour,\n      opacity: 0.1,\n      stroke: 'none',\n    }),\n  );\n  svg.appendChild(\n    el('path', { d: path, fill: 'none', stroke: colour, 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0.55 }),\n  );\n  // Current point: >=8px marker with a 2px surface ring.\n  svg.appendChild(el('circle', { cx: x(points.length - 1), cy: y(points.at(-1)), r: 4, fill: colour, stroke: 'var(--surface)', 'stroke-width': 2 }));\n  return svg;\n}\n\n/* ---------------------------------------------------------------- meters */\n\n/**\n * Mastery meter. The fill is the ordinal step for the level; the track is a\n * lighter step of the same ramp, so state reads across the whole bar.\n */\nexport function masteryMeter(level, label, { detail } = {}) {\n  const clamped = Math.max(0, Math.min(5, level));\n  return h(\n    'div.meter',\n    {},\n    h(\n      'div.meter-top',\n      {},\n      h('b', {}, label),\n      h('span', {}, detail || `${MASTERY_LABELS[Math.round(clamped)]} · ${clamped}/5`),\n    ),\n    h(\n      'div.meter-track',\n      { role: 'meter', 'aria-valuenow': clamped, 'aria-valuemin': 0, 'aria-valuemax': 5, 'aria-label': `${label} mastery` },\n      h('div.meter-fill', { style: { width: `${(clamped / 5) * 100}%`, background: masteryColour(clamped) } }),\n    ),\n  );\n}\n\n/** Five ordinal steps. Filled steps take the ramp colour for the level reached. */\nexport function masteryPips(level) {\n  const clamped = Math.max(0, Math.min(5, Math.round(level)));\n  return h(\n    'span.pips',\n    { title: `${MASTERY_LABELS[clamped]} (${clamped} of 5)`, 'aria-label': `${MASTERY_LABELS[clamped]}, ${clamped} of 5` },\n    ...Array.from({ length: 5 }, (_, i) =>\n      h('span.pip', { style: i < clamped ? { background: masteryColour(clamped) } : {} }),\n    ),\n  );\n}\n\n/* -------------------------------------------------------------- bar chart */\n\n/**\n * Horizontal bars. `rows` is [{ label, value, max?, colour?, note? }].\n * Direct labels are selective: the value sits at the data-end, the category on\n * the left, and nothing else competes.\n */\nexport function barChart(rows, options = {}) {\n  const {\n    title,\n    note,\n    labelWidth = 132,\n    valueWidth = 52,\n    width = 520,\n    max = Math.max(...rows.map((r) => r.max ?? r.value), 1),\n    colour = 'var(--s1)',\n    format = (v) => String(v),\n    tip = (row) => `<b>${row.label}</b><span>${format(row.value)}</span>`,\n    legendItems,\n    table = true,\n  } = options;\n\n  const rowHeight = BAR_MAX + 12;\n  const height = Math.max(rowHeight, rows.length * rowHeight);\n  const plotWidth = Math.max(60, width - labelWidth - valueWidth);\n  const svg = svgRoot(width, height, { label: title || 'Bar chart' });\n\n  rows.forEach((row, i) => {\n    const y = i * rowHeight + 6;\n    const barH = Math.min(BAR_MAX, rowHeight - 12);\n    const value = Math.max(0, row.value);\n    const rowMax = row.max ?? max;\n    const w = rowMax > 0 ? Math.max(GAP, (value / rowMax) * plotWidth) : 0;\n\n    svg.appendChild(\n      el(\n        'text',\n        {\n          x: labelWidth - 12, y: y + barH / 2 + 4, 'text-anchor': 'end',\n          class: 'viz-axis-label', fill: 'var(--ink-3)', 'font-size': 12,\n        },\n        row.label.length > 20 ? `${row.label.slice(0, 19)}…` : row.label,\n      ),\n    );\n    // Track first, then the fill: the 2px surface gap is the track showing through.\n    svg.appendChild(el('rect', { x: labelWidth, y, width: plotWidth, height: barH, rx: 4, fill: 'var(--grid)' }));\n    const bar = el('path', { d: barPath(labelWidth, y, w, barH, 4, true), fill: row.colour || colour });\n    svg.appendChild(hoverable(bar, tip(row)));\n    svg.appendChild(\n      el(\n        'text',\n        { x: labelWidth + plotWidth + 10, y: y + barH / 2 + 4, class: 'viz-value', 'font-size': 11.5 },\n        format(row.value),\n      ),\n    );\n  });\n\n  return vizShell({\n    title,\n    note,\n    body: h('div', {}, svg),\n    legendItems,\n    table: table && rows.length\n      ? { columns: ['Item', 'Value'], rows: rows.map((r) => [r.label, format(r.value)]) }\n      : null,\n  });\n}\n\n/* ------------------------------------------------- mastery distribution */\n\n/**\n * How the learner's concepts are distributed across the six mastery levels.\n * Ordered magnitude, so it uses the ordinal ramp, and level 0 is the neutral\n * \"no data yet\" step rather than a colour on the scale.\n */\nexport function masteryDistribution(counts, { total } = {}) {\n  const sum = total ?? counts.reduce((a, b) => a + b, 0);\n  const width = 520;\n  const columnW = Math.min(BAR_MAX, Math.floor(width / 6) - 18);\n  const height = 168;\n  const base = height - 30;\n  const max = Math.max(...counts, 1);\n  const svg = svgRoot(width, height, { label: 'Concepts by mastery level' });\n\n  // Integer ticks only, de-duplicated: a count axis has no fractional values.\n  const tickStep = Math.max(1, Math.ceil(max / 4));\n  for (let value = 0; value <= max; value += tickStep) {\n    const y = base - (value / max) * (base - 20);\n    svg.appendChild(el('line', { x1: 30, y1: y, x2: width - 8, y2: y, stroke: 'var(--grid)', 'stroke-width': 1 }));\n    svg.appendChild(el('text', { x: 22, y: y + 4, 'text-anchor': 'end', class: 'viz-value', 'font-size': 10.5 }, String(value)));\n  }\n  svg.appendChild(el('line', { x1: 30, y1: base, x2: width - 8, y2: base, stroke: 'var(--axis)', 'stroke-width': 1 }));\n\n  const slot = (width - 46) / 6;\n  counts.forEach((count, level) => {\n    const x = 34 + level * slot + (slot - columnW) / 2;\n    const barH = max > 0 ? Math.max(count ? 3 : 0, (count / max) * (base - 20)) : 0;\n    if (barH > 0) {\n      const bar = el('path', {\n        d: barPath(x, base - barH, columnW, barH, 4, false),\n        fill: masteryColour(level),\n        // Level 0 is the absence of data, so its step recedes toward the\n        // surface; a hairline keeps it legible without promoting it.\n        stroke: level === 0 ? 'var(--axis)' : 'none',\n        'stroke-width': level === 0 ? 1 : 0,\n      });\n      svg.appendChild(\n        hoverable(\n          bar,\n          `<b>${MASTERY_LABELS[level]}</b><span>${count} concept${count === 1 ? '' : 's'}${sum ? ` · ${Math.round((count / sum) * 100)}%` : ''}</span>`,\n        ),\n      );\n    }\n    svg.appendChild(\n      el('text', { x: x + columnW / 2, y: base + 15, 'text-anchor': 'middle', class: 'viz-axis-label', 'font-size': 11 }, String(level)),\n    );\n    if (count > 0) {\n      svg.appendChild(\n        el('text', { x: x + columnW / 2, y: base - barH - 7, 'text-anchor': 'middle', class: 'viz-value', 'font-size': 11.5 }, String(count)),\n      );\n    }\n  });\n  svg.appendChild(\n    el('text', { x: width / 2, y: height - 4, 'text-anchor': 'middle', class: 'viz-axis-label', 'font-size': 10.5 }, 'Mastery level (0 = not introduced, 5 = mastered)'),\n  );\n\n  return vizShell({\n    title: 'Where your concepts sit',\n    note: `${sum} tracked`,\n    body: h('div', {}, svg),\n    table: {\n      columns: ['Level', 'Meaning', 'Concepts'],\n      rows: counts.map((c, i) => [i, MASTERY_LABELS[i], c]),\n    },\n  });\n}\n\n/* --------------------------------------------------------- concept field */\n\n/**\n * A concept field: one dot per concept, radius by attempts, fill by mastery\n * step, ringed in the surface colour so overlaps stay readable. Position is\n * deterministic (subject band × mastery) rather than random, so the picture is\n * stable between renders.\n */\nexport function conceptField(concepts, { onSelect } = {}) {\n  if (!concepts.length) return null;\n  const width = 560;\n  const height = 252;\n  const padX = 54;\n  const padY = 26;\n  const maxAttempts = Math.max(...concepts.map((c) => c.attempts || 0), 1);\n\n  const svg = svgRoot(width, height, { label: 'Concepts by mastery and practice' });\n\n  for (let level = 0; level <= 5; level++) {\n    const x = padX + (level / 5) * (width - padX - 20);\n    svg.appendChild(el('line', { x1: x, y1: padY - 12, x2: x, y2: height - padY, stroke: 'var(--grid)', 'stroke-width': 1 }));\n    svg.appendChild(el('text', { x, y: height - padY + 16, 'text-anchor': 'middle', class: 'viz-axis-label', 'font-size': 10.5 }, String(level)));\n  }\n  svg.appendChild(el('text', { x: (width + padX) / 2, y: height - 3, 'text-anchor': 'middle', class: 'viz-axis-label', 'font-size': 10.5 }, 'Mastery level'));\n  const yLabel = el('text', { class: 'viz-axis-label', 'font-size': 10.5, 'text-anchor': 'middle' }, 'Attempts');\n  yLabel.setAttribute('transform', `translate(13 ${(height - padY) / 2}) rotate(-90)`);\n  svg.appendChild(yLabel);\n\n  concepts.slice(0, 60).forEach((concept, i) => {\n    const level = Math.max(0, Math.min(5, concept.mastery_level || 0));\n    const jitter = ((i * 37) % 11) - 5;\n    const x = padX + (level / 5) * (width - padX - 20) + jitter;\n    const attempts = concept.attempts || 0;\n    const y = height - padY - (attempts / maxAttempts) * (height - padY * 2 - 10) - 8;\n    const r = Math.max(5, Math.min(13, 5 + Math.sqrt(attempts) * 2.2));\n\n    const dot = el('circle', {\n      cx: Math.max(padX, Math.min(width - 24, x)),\n      cy: Math.max(padY, y),\n      r,\n      fill: masteryColour(level),\n      stroke: 'var(--surface)',\n      'stroke-width': 2,\n      style: onSelect ? 'cursor:pointer' : '',\n    });\n    hoverable(\n      dot,\n      `<b>${concept.name}</b><span>${MASTERY_LABELS[level]} · ${attempts} attempt${attempts === 1 ? '' : 's'}` +\n        `${concept.attempts ? ` · ${Math.round(((concept.correct ?? 0) / concept.attempts) * 100)}% correct` : ''}</span>`,\n    );\n    if (onSelect) dot.addEventListener('click', () => onSelect(concept));\n    svg.appendChild(dot);\n  });\n\n  return vizShell({\n    title: 'Concept field',\n    note: 'dot size = practice volume',\n    body: h('div', {}, svg),\n    legendItems: [1, 3, 5].map((level) => ({ colour: masteryColour(level), label: MASTERY_LABELS[level] })),\n    table: {\n      columns: ['Concept', 'Level', 'Attempts', 'Accuracy'],\n      rows: concepts\n        .slice(0, 60)\n        .map((c) => [\n          c.name,\n          MASTERY_LABELS[Math.max(0, Math.min(5, c.mastery_level || 0))],\n          c.attempts || 0,\n          c.attempts ? `${Math.round(((c.correct ?? 0) / c.attempts) * 100)}%` : '—',\n        ]),\n    },\n  });\n}\n\n/* -------------------------------------------------------------- score ring */\n\n/** The hero figure for a graded paper. Sans, proportional figures, one per view. */\nexport function scoreRing(score, max, { size = 104 } = {}) {\n  const ratio = max ? Math.max(0, Math.min(1, score / max)) : 0;\n  const radius = size / 2 - 8;\n  const circumference = 2 * Math.PI * radius;\n  const colour = ratio >= 0.8 ? 'var(--good)' : ratio >= 0.5 ? 'var(--warning)' : 'var(--critical)';\n\n  const svg = svgRoot(size, size, { label: `Score ${score} out of ${max}` });\n  svg.setAttribute('width', String(size));\n  svg.setAttribute('height', String(size));\n\n  svg.appendChild(el('circle', { cx: size / 2, cy: size / 2, r: radius, fill: 'none', stroke: 'var(--grid)', 'stroke-width': 8 }));\n  svg.appendChild(\n    el('circle', {\n      cx: size / 2, cy: size / 2, r: radius, fill: 'none', stroke: colour, 'stroke-width': 8,\n      'stroke-linecap': 'round', 'stroke-dasharray': circumference,\n      'stroke-dashoffset': circumference * (1 - ratio),\n      style: 'transition: stroke-dashoffset .8s cubic-bezier(.16,1,.3,1)',\n    }),\n  );\n\n  return h(\n    'div.score-ring',\n    { style: { width: `${size}px`, height: `${size}px` } },\n    svg,\n    h('div.value', {}, h('b', {}, `${Math.round(ratio * 100)}%`), h('span', {}, `${score}/${max}`)),\n  );\n}\n\n/* ------------------------------------------------------------ difficulty */\n\n/** Which items were right, in the order they were asked, sized by difficulty. */\nexport function itemStrip(items) {\n  if (!items.length) return null;\n  const width = 520;\n  const height = 74;\n  const slot = Math.min(34, (width - 12) / items.length);\n  const svg = svgRoot(width, height, { label: 'Result by question' });\n\n  items.forEach((item, i) => {\n    const x = 6 + i * slot;\n    const w = Math.max(6, slot - GAP);\n    const barH = 14 + (Math.max(1, Math.min(5, item.difficulty || 3)) - 1) * 9;\n    const y = height - 22 - barH;\n    const colour = item.correct ? 'var(--good)' : 'var(--critical)';\n    const bar = el('path', { d: barPath(x, y, w, barH, 4, false), fill: colour, opacity: item.correct ? 1 : 0.9 });\n    svg.appendChild(\n      hoverable(bar, `<b>Question ${i + 1}</b><span>Difficulty ${item.difficulty} · ${item.correct ? 'correct' : 'missed'}</span>`),\n    );\n    if (items.length <= 20) {\n      svg.appendChild(el('text', { x: x + w / 2, y: height - 6, 'text-anchor': 'middle', class: 'viz-axis-label', 'font-size': 10 }, String(i + 1)));\n    }\n  });\n\n  return vizShell({\n    title: 'Result by question',\n    note: 'bar height = difficulty',\n    body: h('div', {}, svg),\n    legendItems: [\n      { colour: 'var(--good)', label: 'Correct' },\n      { colour: 'var(--critical)', label: 'Missed' },\n    ],\n    table: {\n      columns: ['Question', 'Difficulty', 'Result'],\n      rows: items.map((item, i) => [i + 1, item.difficulty, item.correct ? 'Correct' : 'Missed']),\n    },\n  });\n}\n\n/** Small helper for a labelled progress row used outside chart contexts. */\nexport function barRow(label, value, total, colour = 'var(--s1)') {\n  const pct = total ? Math.round((value / total) * 100) : 0;\n  return h(\n    'div.meter',\n    {},\n    h('div.meter-top', {}, h('b', {}, label), h('span', {}, `${value}/${total}`)),\n    h('div.meter-track', {}, h('div.meter-fill', { style: { width: `${pct}%`, background: colour } })),\n  );\n}\n\nexport { hideTip };\n\n/* ------------------------------------------------------ exam readiness */\n\n/**\n * Predicted exam score.\n *\n * Deliberately not a gauge. A gauge shows one number against an arbitrary arc;\n * what a learner actually needs to see is where they sit *relative to the\n * grade boundaries* — how far into a band, how far from the next one, and how\n * wide the uncertainty is. So the scale is the exam's own band ladder, drawn to\n * the percentages that define it, with the interval shown rather than hidden.\n */\nexport function scoreScale({ percent, margin, score, bands, target, calibrated }) {\n  const width = 560;\n  const height = 112;\n  const trackY = 46;\n  const trackH = 26;\n  const padX = 8;\n  const plot = width - padX * 2;\n  const x = (p) => padX + clamp01(p) * plot;\n\n  const svg = svgRoot(width, height, { label: `Projected score ${score}` });\n  const ordered = [...bands].sort((a, b) => a.min_percent - b.min_percent);\n\n  // Labels are collected and drawn last: the interval overlay sits on top of\n  // the bands, and a band label hidden underneath it is a label that does not\n  // exist.\n  const bandLabels = [];\n\n  ordered.forEach((band, i) => {\n    const from = band.min_percent / 100;\n    const to = i < ordered.length - 1 ? ordered[i + 1].min_percent / 100 : 1;\n    const w = Math.max(0, x(to) - x(from) - GAP);\n    if (w <= 0) return;\n    // Ordinal ramp: a higher band sits further along the scale and further\n    // from the surface, so the ladder reads as ordered rather than categorical.\n    const step = Math.round((i / Math.max(1, ordered.length - 1)) * 4) + 1;\n    const current = band.score === score;\n    const seg = el('rect', {\n      x: x(from), y: trackY, width: w, height: trackH, rx: 5,\n      fill: masteryColour(step),\n      opacity: current ? 0.92 : 0.42,\n      stroke: current ? 'var(--ink)' : 'none',\n      'stroke-width': current ? 1.5 : 0,\n    });\n    svg.appendChild(\n      hoverable(seg, `<b>Score ${band.score}</b><span>${band.min_percent}% and above${band.meaning ? ` · ${band.meaning}` : ''}</span>`),\n    );\n    if (w > 18) {\n      // Band numbers sit above the track: inside it they collide with the\n      // marker and the interval, and a number you cannot read is not a label.\n      bandLabels.push(\n        el(\n          'text',\n          {\n            x: x(from) + w / 2, y: trackY - 9, 'text-anchor': 'middle',\n            'font-size': 11.5, 'font-weight': 680,\n            fill: current ? 'var(--ink)' : 'var(--ink-4)',\n          },\n          String(band.score),\n        ),\n      );\n    }\n  });\n\n  // The interval, drawn as a real span rather than implied by a ± in text.\n  const lo = clamp01(percent - margin);\n  const hi = clamp01(percent + margin);\n  svg.appendChild(\n    hoverable(\n      el('rect', {\n        x: x(lo), y: trackY - 7, width: Math.max(2, x(hi) - x(lo)), height: trackH + 14, rx: 7,\n        fill: 'none', stroke: 'var(--ink)', 'stroke-width': 1.5, 'stroke-dasharray': 'none', opacity: 0.55,\n      }),\n      `<b>Likely range</b><span>${Math.round(lo * 100)}% – ${Math.round(hi * 100)}% of the paper</span>`,\n    ),\n  );\n  for (const label of bandLabels) svg.appendChild(label);\n\n  if (target != null) {\n    svg.appendChild(\n      el('line', { x1: x(target), y1: trackY - 4, x2: x(target), y2: trackY + trackH + 10, stroke: 'var(--brand)', 'stroke-width': 2, 'stroke-linecap': 'round' }),\n    );\n    svg.appendChild(\n      el('text', { x: clampLabel(x(target), width), y: 14, 'text-anchor': 'middle', 'font-size': 10.5, 'font-weight': 680, fill: 'var(--brand-2)' }, 'target'),\n    );\n  }\n\n  // Marker: >=8px, 2px surface ring so it reads on top of any band.\n  const marker = el('circle', { cx: x(percent), cy: trackY + trackH / 2, r: 7, fill: 'var(--ink)', stroke: 'var(--surface)', 'stroke-width': 2 });\n  svg.appendChild(\n    hoverable(marker, `<b>Projected ${Math.round(percent * 100)}%</b><span>Score ${score}${calibrated ? ' · calibrated on your last paper' : ''}</span>`),\n  );\n\n  for (const tick of [0, 25, 50, 75, 100]) {\n    svg.appendChild(el('text', { x: x(tick / 100), y: height - 6, 'text-anchor': 'middle', class: 'viz-axis-label', 'font-size': 10 }, `${tick}%`));\n  }\n\n  return vizShell({\n    body: h('div', {}, svg),\n    table: {\n      columns: ['Score', 'Needs', 'Meaning'],\n      rows: [...bands].sort((a, b) => b.score - a.score).map((b) => [b.score, `${b.min_percent}%`, b.meaning || '—']),\n      label: 'Show the grade boundaries',\n    },\n  });\n}\n\nconst clamp01 = (v) => Math.max(0, Math.min(1, v));\n/** Keep a centred label from overflowing the plot on either edge. */\nconst clampLabel = (x, width, half = 20) => Math.max(half, Math.min(width - half, x));\n\n/**\n * Units ranked by the marks still on the table. This is the chart that answers\n * \"where does the next hour go\" — a shaky unit worth 4% of the paper is not\n * the priority however shaky it is.\n */\nexport function leverageChart(units, { onSelect } = {}) {\n  const rows = units\n    .filter((u) => u.points_available > 0.05)\n    .slice(0, 8)\n    .map((unit) => ({\n      label: unit.title,\n      value: Number(unit.points_available.toFixed(1)),\n      colour: 'var(--s2)',\n      unit,\n    }));\n  if (!rows.length) return null;\n\n  const chart = barChart(rows, {\n    title: 'Marks still on the table',\n    note: 'of the whole paper',\n    width: 540,\n    labelWidth: 170,\n    format: (v) => `${v.toFixed(1)}`,\n    tip: (row) =>\n      `<b>${row.label}</b><span>${row.unit.exam_weight}% of the exam · projecting ` +\n      `${Math.round(row.unit.expected * 100)}% · about ${row.value.toFixed(1)} marks available</span>`,\n    table: true,\n  });\n\n  if (onSelect) {\n    chart.querySelectorAll('.viz-mark').forEach((mark, i) => {\n      mark.style.cursor = 'pointer';\n      mark.addEventListener('click', () => onSelect(rows[i].unit));\n    });\n  }\n  return chart;\n}\n\n/**\n * The whole syllabus as one picture: a row per unit, a cell per concept,\n * coloured by the ordinal mastery ramp. Six classes, which is inside the limit\n * where adjacent classes still read apart.\n */\nexport function syllabusMatrix(units, { onSelect } = {}) {\n  if (!units.length) return null;\n  const cell = 20;\n  const gap = 3;\n  const labelW = 168;\n  const maxCols = Math.max(...units.map((u) => u.concepts.length), 1);\n  const width = labelW + maxCols * (cell + gap) + 40;\n  const height = units.length * (cell + gap) + 34;\n  const svg = svgRoot(width, height, { label: 'Syllabus mastery matrix' });\n\n  units.forEach((unit, row) => {\n    const y = row * (cell + gap) + 6;\n    svg.appendChild(\n      el(\n        'text',\n        { x: labelW - 12, y: y + cell / 2 + 4, 'text-anchor': 'end', class: 'viz-axis-label', 'font-size': 11.5, fill: 'var(--ink-3)' },\n        unit.title.length > 24 ? `${unit.title.slice(0, 23)}…` : unit.title,\n      ),\n    );\n    unit.concepts.forEach((concept, col) => {\n      const level = Math.max(0, Math.min(5, concept.mastery_level || 0));\n      const node = el('rect', {\n        x: labelW + col * (cell + gap),\n        y,\n        width: cell,\n        height: cell,\n        rx: 5,\n        fill: masteryColour(level),\n        stroke: level === 0 ? 'var(--axis)' : 'none',\n        'stroke-width': level === 0 ? 1 : 0,\n        style: onSelect ? 'cursor:pointer' : '',\n      });\n      hoverable(\n        node,\n        `<b>${concept.name}</b><span>${MASTERY_LABELS[level]} · ${concept.attempts} attempt${concept.attempts === 1 ? '' : 's'} · ` +\n          `${concept.criticality}${concept.expected != null ? ` · projecting ${Math.round(concept.expected * 100)}%` : ''}</span>`,\n      );\n      if (onSelect) node.addEventListener('click', () => onSelect(concept, unit));\n      svg.appendChild(node);\n    });\n    svg.appendChild(\n      el('text', { x: labelW + unit.concepts.length * (cell + gap) + 8, y: y + cell / 2 + 4, class: 'viz-value', 'font-size': 10.5 }, `${unit.exam_weight}%`),\n    );\n  });\n\n  return vizShell({\n    title: 'The whole syllabus',\n    note: 'one cell per concept · % is exam weight',\n    body: h('div', { style: { overflowX: 'auto' } }, svg),\n    legendItems: [0, 2, 5].map((level) => ({ colour: masteryColour(level), label: MASTERY_LABELS[level] })),\n    table: {\n      columns: ['Unit', 'Concept', 'Mastery', 'Attempts'],\n      rows: units.flatMap((u) =>\n        u.concepts.map((c) => [u.title, c.name, MASTERY_LABELS[Math.max(0, Math.min(5, c.mastery_level || 0))], c.attempts]),\n      ),\n      label: 'Show the syllabus as a table',\n    },\n  });\n}\n\n/** Practice-paper results over time against the score you are aiming at. */\nexport function scoreHistory(history, { targetPercent, bands = [] } = {}) {\n  if (history.length < 1) return null;\n  const width = 520;\n  const height = 190;\n  const padL = 40;\n  const padB = 30;\n  const padT = 16;\n  const points = [...history].reverse();\n  const svg = svgRoot(width, height, { label: 'Practice pa
