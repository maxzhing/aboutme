eleration']),\n        c('Kinematic equations for constant acceleration', 3, 'core'),\n        c('Free fall', 3, 'core', ['Kinematic equations for constant acceleration']),\n        c('Projectile motion', 4, 'core', ['Kinematic equations for constant acceleration', 'Scalars and vectors']),\n        c('Relative motion', 3, 'important'),\n      ],\n      [\n        ['Reading slope off a position-time graph as velocity but slope off a velocity-time graph as displacement.', 'Slope is always the derivative: v-t slope is acceleration, area under v-t is displacement.'],\n        ['Treating the horizontal and vertical parts of projectile motion as coupled.', 'They share only time. Solve vertical for time, then feed that time into horizontal.'],\n      ]),\n    u(2, 'Force and Translational Dynamics', [18, 23], 26,\n      'Newton\\'s laws, free-body diagrams, and the standard force models: gravity, normal, tension, friction, springs and circular motion.',\n      [\n        c('Free-body diagrams', 3, 'core'),\n        c(\"Newton's first law and inertia\", 2, 'core'),\n        c(\"Newton's second law\", 3, 'core', ['Free-body diagrams']),\n        c(\"Newton's third law\", 3, 'core'),\n        c('Gravitational force and weight', 2, 'core'),\n        c('Normal force', 2, 'core', ['Free-body diagrams']),\n        c('Static and kinetic friction', 3, 'core', [\"Newton's second law\"]),\n        c('Tension and connected systems', 4, 'core', [\"Newton's second law\"]),\n        c('Inclined planes', 4, 'core', ['Free-body diagrams', 'Static and kinetic friction']),\n        c(\"Hooke's law and spring force\", 3, 'core'),\n        c('Uniform circular motion and centripetal force', 4, 'core', [\"Newton's second law\"]),\n        c('Newton\\'s law of universal gravitation', 3, 'important'),\n      ],\n      [\n        ['Drawing a \"centripetal force\" arrow as if it were a new force.', 'Centripetal force is a role played by real forces already on the diagram, not an extra one.'],\n        ['Pairing forces that act on the same object as third-law pairs.', 'A third-law pair acts on two different objects and never appears on the same free-body diagram.'],\n      ]),\n    u(3, 'Work, Energy, and Power', [18, 23], 24,\n      'Energy as the accounting system for mechanics: work, kinetic and potential energy, conservation, and the rate at which energy moves.',\n      [\n        c('Work done by a constant force', 3, 'core'),\n        c('Work from a force-distance graph', 3, 'core', ['Work done by a constant force']),\n        c('Kinetic energy and the work-energy theorem', 3, 'core', ['Work done by a constant force']),\n        c('Gravitational potential energy', 2, 'core'),\n        c('Elastic potential energy', 3, 'core', [\"Hooke's law and spring force\"]),\n        c('Conservation of mechanical energy', 4, 'core', ['Kinetic energy and the work-energy theorem', 'Gravitational potential energy']),\n        c('Energy dissipation by friction', 3, 'core', ['Conservation of mechanical energy']),\n        c('Energy bar charts and system definition', 4, 'core', ['Conservation of mechanical energy']),\n        c('Power', 2, 'core'),\n      ],\n      [\n        ['Changing the system boundary halfway through a problem.', 'Declare the system first. Whether gravity does work or shows up as potential energy depends entirely on that choice.'],\n        ['Using W = Fd when the force is not parallel to the displacement.', 'Only the component along the displacement does work; a perpendicular force does none.'],\n      ]),\n    u(4, 'Linear Momentum', [10, 15], 16,\n      'Impulse, momentum conservation, and the difference between collisions that keep kinetic energy and those that do not.',\n      [\n        c('Linear momentum', 2, 'core'),\n        c('Impulse and the impulse-momentum theorem', 3, 'core', ['Linear momentum']),\n        c('Force-time graphs and impulse', 3, 'core', ['Impulse and the impulse-momentum theorem']),\n        c('Conservation of linear momentum', 4, 'core', ['Linear momentum']),\n        c('Elastic collisions', 4, 'core', ['Conservation of linear momentum']),\n        c('Inelastic and perfectly inelastic collisions', 4, 'core', ['Conservation of linear momentum']),\n        c('Centre of mass', 3, 'important'),\n        c('Two-dimensional collisions', 4, 'important', ['Conservation of linear momentum']),\n      ],\n      [\n        ['Assuming kinetic energy is conserved because momentum is.', 'Momentum is conserved in every collision with no external impulse; kinetic energy is only conserved in elastic ones.'],\n        ['Dropping the sign on a velocity after a bounce.', 'Momentum is a vector. Choose a positive direction and keep it for the whole problem.'],\n      ]),\n    u(5, 'Torque and Rotational Dynamics', [10, 15], 18,\n      'The rotational rewrite of Units 1 and 2: angular kinematics, torque, rotational inertia, and rotational equilibrium.',\n      [\n        c('Angular position, velocity and acceleration', 3, 'core'),\n        c('Rotational kinematic equations', 3, 'core', ['Angular position, velocity and acceleration']),\n        c('Torque', 3, 'core'),\n        c('Rotational inertia', 4, 'core'),\n        c('Newton\\'s second law for rotation', 4, 'core', ['Torque', 'Rotational inertia']),\n        c('Rotational equilibrium and balanced beams', 4, 'core', ['Torque']),\n        c('Rolling without slipping', 4, 'important', ['Rotational kinematic equations']),\n      ],\n      [\n        ['Using the full force instead of its perpendicular component when computing torque.', 'Torque is r F sin(theta); a force pointed at the pivot produces none.'],\n        ['Treating rotational inertia as a property of the object alone.', 'It depends on the axis. The same rod has different I about its centre and about its end.'],\n      ]),\n    u(6, 'Energy and Momentum of Rotating Systems', [5, 8], 12,\n      'Rotational kinetic energy, angular momentum and its conservation — including why a spinning skater speeds up when they pull their arms in.',\n      [\n        c('Rotational kinetic energy', 3, 'core', ['Rotational inertia']),\n        c('Angular momentum', 4, 'core', ['Rotational inertia']),\n        c('Conservation of angular momentum', 4, 'core', ['Angular momentum']),\n        c('Angular impulse', 4, 'important', ['Torque']),\n        c('Combined translational and rotational energy', 4, 'important', ['Rolling without slipping', 'Rotational kinetic energy']),\n      ],\n      [\n        ['Conserving angular momentum across an event where an external torque acts.', 'Check the torque about your chosen axis first; a hinge force through the axis contributes none, an off-axis push does.'],\n      ]),\n    u(7, 'Oscillations', [5, 8], 12,\n      'Simple harmonic motion for masses on springs and simple pendulums, and what does and does not change the period.',\n      [\n        c('Simple harmonic motion', 3, 'core', [\"Hooke's law and spring force\"]),\n        c('Period, frequency and amplitude', 2, 'core'),\n        c('Mass-spring system period', 3, 'core', ['Simple harmonic motion']),\n        c('Simple pendulum period', 3, 'core', ['Simple harmonic motion']),\n        c('Energy in simple harmonic motion', 4, 'core', ['Elastic potential energy', 'Simple harmonic motion']),\n        c('Graphs of position, velocity and acceleration in SHM', 4, 'important', ['Simple harmonic motion']),\n      ],\n      [\n        ['Expecting a larger amplitude to lengthen the period.', 'For an ideal spring or a small-angle pendulum the period is amplitude-independent.'],\n        ['Putting mass into the pendulum period.', 'The pendulum period depends on length and g only.'],\n      ]),\n    u(8, 'Fluids', [10, 15], 16,\n      'Added in the 2024-25 redesign: density, pressure, buoyancy and fluid flow.',\n      [\n        c('Density and specific gravity', 2, 'core'),\n        c('Pressure in a static fluid', 3, 'core', ['Density and specific gravity']),\n        c('Gauge pressure and absolute pressure', 3, 'core', ['Pressure in a static fluid']),\n        c(\"Pascal's principle\", 3, 'core', ['Pressure in a static fluid']),\n        c(\"Archimedes' principle and buoyant force\", 4, 'core', ['Pressure in a static fluid']),\n        c('Floating and sinking conditions', 4, 'core', [\"Archimedes' principle and buoyant force\"]),\n        c('Continuity equation', 3, 'core'),\n        c(\"Bernoulli's equation\", 4, 'core', ['Continuity equation', 'Conservation of mechanical energy']),\n      ],\n      [\n        ['Using the object\\'s density in the buoyant force formula.', 'Buoyant force uses the fluid density and the displaced volume; the object density only decides whether it floats.'],\n        ['Thinking a narrower pipe means slower flow.', 'Continuity says the opposite: same volume flow rate through a smaller area means higher speed.'],\n      ]),\n  ],\n});\n","axiom:curriculum/ap-psychology.js":"import { c, u, apBands, course } from 'axiom:curriculum/kit.js';\n\nexport default course({\n  key: 'ap-psychology',\n  title: 'AP Psychology',\n  exam: 'AP Psychology',\n  subject: 'Psychology',\n  level: 'AP / first-year college',\n  aliases: ['ap psychology', 'ap psych'],\n  overview:\n    'Redesigned for 2024-25 into five units of roughly equal weight, each carrying 15-25% of the exam. Research methods are no longer a unit of their own — they run through every unit and through both free-response questions, which is why the exam now leans so hard on reading a study and evaluating it. The two free responses are the Article Analysis Question and the Evidence-Based Question, both of which require applying named concepts to a specific piece of research.',\n  total_hours: 120,\n  exam_format: {\n    total_minutes: 160,\n    description:\n      'Section I is 75 multiple-choice questions in 90 minutes, worth two thirds of the score. Section II is 2 free-response questions in 70 minutes, worth one third: the Article Analysis Question, which gives you a study to evaluate, and the Evidence-Based Question, which asks you to argue a position using two provided sources.',\n    sections: [\n      { name: 'Section I: Multiple Choice', question_type: 'mcq', count: 75, minutes: 90, weight_percent: 66.7, notes: 'Roughly a quarter are scenario-application items: the term is easy, spotting it in a story is the skill.' },\n      { name: 'Section II Q1: Article Analysis Question', question_type: 'frq', count: 1, minutes: 25, weight_percent: 13.3, notes: 'Identify the research method, the operational definition, and a limitation, then explain the finding in context.' },\n      { name: 'Section II Q2: Evidence-Based Question', question_type: 'frq', count: 1, minutes: 45, weight_percent: 20, notes: 'A claim, a defensible argument, and evidence from both sources plus course concepts.' },\n    ],\n  },\n  score_bands: apBands([75, 62, 50, 38]),\n  units: [\n    u(1, 'Biological Bases of Behavior', [15, 25], 24,\n      'Genetics and environment, the nervous and endocrine systems, sleep, sensation and perception.',\n      [\n        c('Nature versus nurture and heritability', 3, 'core'),\n        c('Neurons and neural firing', 4, 'core'),\n        c('Neurotransmitters and their effects', 4, 'core', ['Neurons and neural firing']),\n        c('Structure and function of the brain', 4, 'core'),\n        c('The endocrine system', 3, 'core'),\n        c('Brain imaging and lesion studies', 3, 'core', ['Structure and function of the brain']),\n        c('Sleep stages and theories of sleep', 3, 'core'),\n        c('Psychoactive drugs and tolerance', 3, 'core', ['Neurotransmitters and their effects']),\n        c('Sensation: transduction and thresholds', 4, 'core'),\n        c('Vision and audition', 3, 'core', ['Sensation: transduction and thresholds']),\n        c('Perceptual organisation and constancies', 4, 'core', ['Sensation: transduction and thresholds']),\n        c('Research methods and experimental design', 4, 'core'),\n      ],\n      [\n        ['Confusing sensation with perception.', 'Sensation is the raw signal reaching the brain; perception is what the brain makes of it. Application questions almost always hinge on this line.'],\n      ]),\n    u(2, 'Cognition', [15, 25], 22,\n      'Memory, thinking, problem solving, intelligence and its measurement.',\n      [\n        c('Encoding, storage and retrieval', 4, 'core'),\n        c('Models of memory', 4, 'core', ['Encoding, storage and retrieval']),\n        c('Long-term memory systems', 4, 'core', ['Models of memory']),\n        c('Forgetting and memory distortion', 4, 'core', ['Encoding, storage and retrieval']),\n        c('Biological bases of memory', 3, 'core', ['Structure and function of the brain']),\n        c('Concepts, prototypes and schemas', 3, 'core'),\n        c('Problem solving, heuristics and biases', 4, 'core', ['Concepts, prototypes and schemas']),\n        c('Language acquisition and development', 3, 'core'),\n        c('Theories of intelligence', 3, 'core'),\n        c('Intelligence testing: reliability and validity', 4, 'core', ['Research methods and experimental design']),\n        c('Descriptive statistics and distributions', 4, 'core'),\n      ],\n      [\n        ['Treating availability and representativeness as interchangeable.', 'Availability is judging by what comes to mind easily; representativeness is judging by resemblance to a prototype.'],\n      ]),\n    u(3, 'Development and Learning', [15, 25], 22,\n      'Lifespan development and the three families of learning theory.',\n      [\n        c('Themes and methods in developmental psychology', 3, 'core', ['Research methods and experimental design']),\n        c('Physical development across the lifespan', 3, 'core'),\n        c('Piaget and cognitive development', 4, 'core'),\n        c('Vygotsky and sociocultural development', 3, 'core'),\n        c('Attachment and parenting styles', 3, 'core'),\n        c('Erikson and psychosocial stages', 3, 'core'),\n        c('Kohlberg and moral development', 3, 'important'),\n        c('Classical conditioning', 4, 'core'),\n        c('Operant conditioning and reinforcement schedules', 4, 'core', ['Classical conditioning']),\n        c('Observational and social learning', 3, 'core', ['Operant conditioning and reinforcement schedules']),\n        c('Cognitive processes in learning', 4, 'important', ['Classical conditioning']),\n      ],\n      [\n        ['Calling negative reinforcement a punishment.', 'Negative means something is removed; reinforcement means the behaviour increases. Removing a nuisance to increase a behaviour is negative reinforcement.'],\n      ]),\n    u(4, 'Social Psychology and Personality', [15, 25], 22,\n      'Attribution, attitudes, group behaviour, and the major theories of personality.',\n      [\n        c('Attribution theory and the fundamental attribution error', 4, 'core'),\n        c('Attitude formation and cognitive dissonance', 4, 'core'),\n        c('Conformity, compliance and obedience', 4, 'core'),\n        c('Group behaviour: polarisation and groupthink', 4, 'core', ['Conformity, compliance and obedience']),\n        c('Prejudice, stereotypes and discrimination', 3, 'core'),\n        c('Altruism and aggression', 3, 'core'),\n        c('Psychodynamic theories of personality', 3, 'core'),\n        c('Humanistic theories of personality', 3, 'core'),\n        c('Social-cognitive and trait theories', 4, 'core'),\n        c('Motivation theories', 3, 'core'),\n        c('Theories of emotion', 4, 'core'),\n      ],\n      [\n        ['Explaining a social situation with a personality trait.', 'That is the fundamental attribution error itself; the exam usually wants the situational explanation.'],\n      ]),\n    u(5, 'Mental and Physical Health', [15, 25], 20,\n      'Stress and health, psychological disorders and their treatment.',\n      [\n        c('Stress, coping and health psychology', 3, 'core'),\n        c('Positive psychology and wellbeing', 2, 'important'),\n        c('Defining and classifying psychological disorders', 3, 'core'),\n        c('Anxiety, obsessive-compulsive and trauma disorders', 4, 'core', ['Defining and classifying psychological disorders']),\n        c('Depressive and bipolar disorders', 4, 'core', ['Defining and classifying psychological disorders']),\n        c('Schizophrenic spectrum disorders', 4, 'core', ['Defining and classifying psychological disorders']),\n        c('Dissociative, personality and eating disorders', 3, 'core', ['Defining and classifying psychological disorders']),\n        c('Psychological treatments and therapies', 4, 'core'),\n        c('Biomedical treatments', 3, 'core', ['Neurotransmitters and their effects']),\n        c('Evaluating treatment effectiveness', 4, 'core', ['Research methods and experimental design']),\n      ],\n      [\n        ['Naming a therapy without naming its theoretical orientation.', 'Rubrics want the link: systematic desensitisation is behavioural, and it works by counterconditioning.'],\n      ]),\n  ],\n});\n","axiom:curriculum/ap-statistics.js":"import { c, u, apBands, course } from 'axiom:curriculum/kit.js';\n\nexport default course({\n  key: 'ap-statistics',\n  title: 'AP Statistics',\n  exam: 'AP Statistics',\n  subject: 'Mathematics',\n  level: 'AP / first-semester college statistics',\n  aliases: ['ap statistics', 'ap stats', 'ap stat'],\n  overview:\n    'Restructured for the 2026-27 school year from nine units into five, and fully digital in Bluebook from May 2027. The course is one long argument: describe data, collect it well, model the randomness, then infer. Almost every free-response point is for communication — checking conditions, defining parameters in context, and stating a conclusion that answers the question asked rather than reporting a p-value.',\n  total_hours: 140,\n  exam_format: {\n    total_minutes: 180,\n    description:\n      'Section I is 42 multiple-choice questions worth 50%. Section II is 4 free-response questions worth 10 points each, also 50%, including an investigative task that extends the course into unfamiliar territory. Both sections are taken in the Bluebook app; a graphing calculator and the formula sheet are allowed throughout.',\n    sections: [\n      { name: 'Section I: Multiple Choice', question_type: 'mcq', count: 42, minutes: 90, weight_percent: 50, notes: 'Interpretation-heavy. Many items are answerable by knowing what a statistic means rather than computing one.' },\n      { name: 'Section II: Free Response', question_type: 'frq', count: 4, minutes: 90, weight_percent: 50, notes: 'Graded holistically as essentially correct, partially correct or incorrect. Naming the procedure, checking conditions and concluding in context are separate points.' },\n    ],\n  },\n  score_bands: apBands([70, 58, 45, 33]),\n  units: [\n    u(1, 'Exploring One-Variable Data and Collecting Data', [20, 30], 32,\n      'Describing distributions, comparing groups, and the design of studies that make inference legitimate at all.',\n      [\n        c('Variables and types of data', 2, 'core'),\n        c('Displaying categorical data', 2, 'core', ['Variables and types of data']),\n        c('Displaying quantitative data', 3, 'core', ['Variables and types of data']),\n        c('Shape, centre, spread and outliers', 3, 'core', ['Displaying quantitative data']),\n        c('Mean, median and resistance to outliers', 3, 'core', ['Shape, centre, spread and outliers']),\n        c('Standard deviation and variance', 3, 'core', ['Shape, centre, spread and outliers']),\n        c('Boxplots and the 1.5 IQR rule', 3, 'core', ['Shape, centre, spread and outliers']),\n        c('Z-scores and standardising', 4, 'core', ['Standard deviation and variance']),\n        c('The normal distribution and empirical rule', 4, 'core', ['Z-scores and standardising']),\n        c('Comparing distributions', 4, 'core', ['Shape, centre, spread and outliers']),\n        c('Sampling methods', 3, 'core'),\n        c('Sources of bias in sampling', 4, 'core', ['Sampling methods']),\n        c('Observational studies versus experiments', 4, 'core'),\n        c('Principles of experimental design', 4, 'core', ['Observational studies versus experiments']),\n        c('Blocking, matched pairs and confounding', 4, 'core', ['Principles of experimental design']),\n        c('Scope of inference and generalisability', 5, 'core', ['Sampling methods', 'Principles of experimental design']),\n      ],\n      [\n        ['Describing a distribution without context.', 'Shape, centre, spread and unusual features, all named with the variable and units. Three of the four is not full credit.'],\n        ['Claiming causation from an observational study.', 'Only a randomised experiment supports a causal claim, and only random sampling supports generalising to a population.'],\n      ]),\n    u(2, 'Probability, Random Variables, and Probability Distributions', [15, 25], 26,\n      'The randomness model underneath every inference procedure: probability rules, random variables, and sampling distributions.',\n      [\n        c('Basic probability rules', 3, 'core'),\n        c('Conditional probability', 4, 'core', ['Basic probability rules']),\n        c('Independence and mutually exclusive events', 4, 'core', ['Conditional probability']),\n        c('Two-way tables and probability', 3, 'core', ['Conditional probability']),\n        c('Random variables and expected value', 4, 'core'),\n        c('Combining random variables', 4, 'core', ['Random variables and expected value']),\n        c('Binomial distribution', 4, 'core', ['Random variables and expected value']),\n        c('Geometric distribution', 4, 'important', ['Binomial distribution']),\n        c('Simulation', 3, 'core'),\n        c('Sampling distribution of a statistic', 5, 'core', ['Random variables and expected value']),\n        c('Central limit theorem', 5, 'core', ['Sampling distribution of a statistic']),\n        c('Sampling distribution of a sample proportion', 5, 'core', ['Sampling distribution of a statistic']),\n        c('Sampling distribution of a sample mean', 5, 'core', ['Central limit theorem']),\n      ],\n      [\n        ['Treating mutually exclusive as independent.', 'They are close to opposites: if two events cannot both happen, knowing one happened tells you the other did not.'],\n        ['Applying the normal model to a small skewed sample.', 'The central limit theorem is about the sampling distribution and needs n large enough for the skew present.'],\n      ]),\n    u(3, 'Inference for Categorical Data: Proportions', [15, 25], 24,\n      'Confidence intervals and significance tests for proportions, and the chi-square family.',\n      [\n        c('Confidence intervals for a proportion', 4, 'core', ['Sampling distribution of a sample proportion']),\n        c('Interpreting a confidence interval and confidence level', 5, 'core', ['Confidence intervals for a proportion']),\n        c('Margin of error and sample size', 4, 'core', ['Confidence intervals for a proportion']),\n        c('Logic of significance testing', 5, 'core'),\n        c('Significance test for a proportion', 4, 'core', ['Logic of significance testing']),\n        c('Type I and Type II errors and power', 5, 'core', ['Logic of significance testing']),\n        c('Comparing two proportions', 4, 'core', ['Significance test for a proportion']),\n        c('Chi-square goodness of fit test', 4, 'core', ['Logic of significance testing']),\n        c('Chi-square test for independence and homogeneity', 5, 'core', ['Chi-square goodness of fit test']),\n      ],\n      [\n        ['Interpreting a confidence interval as a probability about the parameter.', 'The parameter is fixed. The confidence level describes the long-run capture rate of the method.'],\n        ['Concluding that the null hypothesis is true.', 'Failing to reject is not evidence of no effect. Say there is not convincing evidence, in context.'],\n      ]),\n    u(4, 'Inference for Quantitative Data: Means', [10, 20], 20,\n      'The t procedures: one sample, paired data, and two independent samples.',\n      [\n        c('The t distribution', 4, 'core', ['Sampling distribution of a sample mean']),\n        c('Confidence interval for a mean', 4, 'core', ['The t distribution']),\n        c('Significance test for a mean', 4, 'core', ['The t distribution', 'Logic of significance testing']),\n        c('Conditions for t procedures', 5, 'core', ['The t distribution']),\n        c('Paired data and matched pairs inference', 5, 'core', ['Significance test for a mean']),\n        c('Comparing two means', 4, 'core', ['Significance test for a mean']),\n      ],\n      [\n        ['Running a two-sample test on paired data.', 'If each observation in one group is tied to a specific observation in the other, analyse the differences. This is the single most common wrong procedure.'],\n      ]),\n    u(5, 'Regression Analysis', [10, 20], 20,\n      'Bivariate relationships, the least-squares line, residual analysis and inference for slope.',\n      [\n        c('Scatterplots and describing association', 3, 'core'),\n        c('Correlation and its properties', 4, 'core', ['Scatterplots and describing association']),\n        c('Least-squares regression line', 4, 'core', ['Correlation and its properties']),\n        c('Interpreting slope and intercept in context', 4, 'core', ['Least-squares regression line']),\n        c('Residuals and residual plots', 5, 'core', ['Least-squares regression line']),\n        c('Coefficient of determination', 4, 'core', ['Least-squares regression line']),\n        c('Outliers, leverage and influential points', 4, 'core', ['Residuals and residual plots']),\n        c('Transformations to achieve linearity', 4, 'important', ['Residuals and residual plots']),\n        c('Confidence interval and test for slope', 5, 'core', ['Least-squares regression line', 'The t distribution']),\n        c('Reading computer regression output', 4, 'core', ['Confidence interval and test for slope']),\n      ],\n      [\n        ['Extrapolating beyond the range of the data.', 'The model is only supported where data exists. Predicting outside it is an automatic loss of credit.'],\n        ['Interpreting r squared as the percentage of points on the line.', 'It is the percentage of variation in the response explained by the linear model with the explanatory variable.'],\n      ]),\n  ],\n});\n","axiom:curriculum/ap-us-history.js":"import { c, u, apBands, course } from 'axiom:curriculum/kit.js';\n\nexport default course({\n  key: 'ap-us-history',\n  title: 'AP United States History',\n  exam: 'AP United States History',\n  subject: 'History',\n  level: 'AP / first-year college',\n  aliases: ['ap us history', 'apush', 'ap united states history', 'ap u.s. history', 'ap american history'],\n  overview:\n    'Nine chronological periods from 1491 to the present, taught through eight themes and a set of historical reasoning skills. Periods 3 through 8 carry roughly 80% of the exam between them. Sixty per cent of the score is writing: three short answers, a document-based question and a long essay, all marked on rubrics that reward a defensible thesis, specific evidence, contextualisation and complexity rather than coverage.',\n  total_hours: 160,\n  exam_format: {\n    total_minutes: 195,\n    description:\n      'Section I Part A is 55 multiple-choice questions in 55 minutes, worth 40%, always in stimulus sets built on a source. Part B is 3 short-answer questions in 40 minutes, worth 20%. Section II Part A is the document-based question in 60 minutes including a 15-minute reading period, worth 25%. Part B is the long essay question in 40 minutes, worth 15%.',\n    sections: [\n      { name: 'Section I Part A: Multiple Choice', question_type: 'mcq', count: 55, minutes: 55, weight_percent: 40, notes: 'Every question hangs off a stimulus: a text excerpt, image, map or chart. Read the source and the attribution before the options.' },\n      { name: 'Section I Part B: Short Answer', question_type: 'saq', count: 3, minutes: 40, weight_percent: 20, notes: 'Three parts each, one point per part. A specific, named piece of evidence and a sentence of explanation is the whole job.' },\n      { name: 'Section II Part A: Document-Based Question', question_type: 'dbq', count: 1, minutes: 60, weight_percent: 25, notes: 'Seven points: thesis, contextualisation, three for evidence, one for sourcing, one for complexity. Use at least six documents and one piece of outside evidence.' },\n      { name: 'Section II Part B: Long Essay', question_type: 'leq', count: 1, minutes: 40, weight_percent: 15, notes: 'Six points on the same shape of rubric, without documents. Choose from three prompts on the same reasoning skill in different periods.' },\n    ],\n  },\n  score_bands: apBands([72, 60, 47, 32]),\n  units: [\n    u(1, 'Period 1: 1491-1607', [4, 6], 8,\n      'Pre-contact societies, European exploration, and the Columbian Exchange.',\n      [\n        c('Native American societies before contact', 3, 'core'),\n        c('European exploration and motives', 2, 'core'),\n        c('Columbian Exchange', 3, 'core', ['European exploration and motives']),\n        c('Spanish colonisation and the encomienda system', 3, 'core'),\n        c('Cultural interactions and the Valladolid debate', 3, 'important'),\n        c('Contextualisation as a reasoning skill', 4, 'core'),\n      ],\n      [\n        ['Treating pre-contact America as one undifferentiated society.', 'Regional variation is the point: environment shaped Pueblo, Iroquois, Great Plains and Mississippian societies differently.'],\n      ]),\n    u(2, 'Period 2: 1607-1754', [6, 8], 12,\n      'Colonial regions, the Atlantic economy, slavery, and the beginnings of self-government.',\n      [\n        c('Chesapeake and southern colonies', 3, 'core'),\n        c('New England colonies', 3, 'core'),\n        c('Middle colonies', 3, 'core'),\n        c('Transatlantic trade and mercantilism', 3, 'core'),\n        c('Development of slavery and slave codes', 4, 'core', ['Transatlantic trade and mercantilism']),\n        c('Colonial self-government and salutary neglect', 3, 'core'),\n        c('First Great Awakening and the Enlightenment', 3, 'core'),\n        c('Comparison as a reasoning skill', 4, 'core'),\n      ],\n      [\n        ['Blurring the colonial regions together.', 'Comparison prompts on this period live or die on regional specifics: labour system, religion, settlement pattern, economy.'],\n      ]),\n    u(3, 'Period 3: 1754-1800', [10, 17], 22,\n      'The imperial crisis, the Revolution, the Constitution and the first party system.',\n      [\n        c('French and Indian War and its consequences', 3, 'core'),\n        c('Taxation without representation and colonial resistance', 3, 'core', ['French and Indian War and its consequences']),\n        c('Declaration of Independence and republican ideology', 3, 'core'),\n        c('The Revolutionary War', 3, 'core'),\n        c('Articles of Confederation and its weaknesses', 4, 'core'),\n        c('Constitutional Convention and compromises', 4, 'core', ['Articles of Confederation and its weaknesses']),\n        c('Federalists and Anti-Federalists', 4, 'core', ['Constitutional Convention and compromises']),\n        c('Washington and Adams administrations', 3, 'core'),\n        c('Emergence of political parties', 4, 'core', ['Federalists and Anti-Federalists']),\n        c('Causation as a reasoning skill', 4, 'core'),\n      ],\n      [\n        ['Explaining the Revolution with ideology alone.', 'Rubrics reward multi-causal answers: imperial debt, enforcement, ideology and economic interest together.'],\n      ]),\n    u(4, 'Period 4: 1800-1848', [10, 17], 22,\n      'Jeffersonian and Jacksonian democracy, market revolution, reform movements and sectionalism.',\n      [\n        c('Jefferson presidency and the Louisiana Purchase', 3, 'core'),\n        c('Marshall Court and judicial review', 4, 'core'),\n        c('War of 1812 and American nationalism', 3, 'core'),\n        c('Market revolution and transportation', 4, 'core'),\n        c('Second Great Awakening and reform movements', 3, 'core'),\n        c('Abolitionism and early womens rights', 4, 'core', ['Second Great Awakening and reform movements']),\n        c('Jacksonian democracy and Indian Removal', 4, 'core'),\n        c('Missouri Compromise and early sectionalism', 4, 'core'),\n        c('Continuity and change as a reasoning skill', 4, 'core'),\n      ],\n      [\n        ['Calling Jacksonian democracy simply a widening of democracy.', 'It expanded white male suffrage while removing Native nations and hardening exclusions. Complexity points come from holding both.'],\n      ]),\n    u(5, 'Period 5: 1844-1877', [10, 17], 22,\n      'Manifest Destiny, the coming of the Civil War, the war itself, and Reconstruction.',\n      [\n        c('Manifest Destiny and westward expansion', 3, 'core'),\n        c('Mexican-American War and the Wilmot Proviso', 4, 'core', ['Manifest Destiny and westward expansion']),\n        c('Compromise of 1850 and Kansas-Nebraska Act', 4, 'core'),\n        c('Rise of the Republican Party and secession', 4, 'core', ['Compromise of 1850 and Kansas-Nebraska Act']),\n        c('Civil War: strategy, emancipation and the home fronts', 4, 'core'),\n        c('Reconstruction amendments', 4, 'core'),\n        c('Presidential versus Congressional Reconstruction', 4, 'core', ['Reconstruction amendments']),\n        c('Failure of Reconstruction and Redemption', 4, 'core', ['Presidential versus Congressional Reconstruction']),\n        c('DBQ document sourcing and HIPP', 5, 'core'),\n      ],\n      [\n        ['Summarising documents instead of using them.', 'A DBQ point comes from using a document to support an argument. Sourcing means explaining how the point of view, purpose, audience or situation affects the argument.'],\n      ]),\n    u(6, 'Period 6: 1865-1898', [10, 17], 20,\n      'Industrialisation, the New South, immigration, urbanisation and Populism.',\n      [\n        c('Westward expansion and the transformation of the West', 3, 'core'),\n        c('Industrialisation and big business', 4, 'core'),\n        c('Labour movements and strikes', 4, 'core', ['Industrialisation and big business']),\n        c('New immigration and nativism', 3, 'core'),\n        c('Urbanisation and the Gilded Age city', 3, 'core'),\n        c('Gilded Age politics and corruption', 3, 'core'),\n        c('Populism and the agrarian revolt', 4, 'core'),\n        c('Jim Crow and Plessy v. Ferguson', 4, 'core', ['Failure of Reconstruction and Redemption']),\n        c('Social Darwinism and the Gospel of Wealth', 3, 'important'),\n      ],\n      []),\n    u(7, 'Period 7: 1890-1945', [10, 17], 24,\n      'Imperialism, Progressivism, the World Wars, the twenties, the Depression and the New Deal.',\n      [\n        c('American imperialism and the Spanish-American War', 3, 'core'),\n        c('Progressive Era reforms', 4, 'core'),\n        c('World War I and the home front', 4, 'core'),\n        c('Red Scare and postwar reaction', 3, 'core', ['World War I and the home front']),\n        c('The 1920s: culture, consumption and conflict', 3, 'core'),\n        c('Causes of the Great Depression', 4, 'core'),\n        c('The New Deal and its critics', 4, 'core', ['Causes of the Great Depression']),\n        c('World War II: mobilisation and the home front', 4, 'core'),\n        c('Japanese American internment and civil liberties', 3, 'core'),\n        c('LEQ thesis, evidence and complexity', 5, 'core'),\n      ],\n      [\n        ['Writing a thesis that restates the prompt.', 'A defensible thesis makes a claim with a line of reasoning. \"To a great extent, because X, Y and Z\" beats \"There were many causes\".'],\n      ]),\n    u(8, 'Period 8: 1945-1980', [10, 17], 22,\n      'The Cold War, the civil rights movement, the Great Society, Vietnam and the conservative turn.',\n      [\n        c('Origins of the Cold War and containment', 4, 'core'),\n        c('Korean War and the second Red Scare', 3, 'core', ['Origins of the Cold War and containment']),\n        c('Postwar prosperity and suburbanisation', 3, 'core'),\n        c('Civil rights movement to 1965', 4, 'core'),\n        c('Black Power and the movements late phase', 4, 'core', ['Civil rights movement to 1965']),\n        c('Great Society and liberalism at its height', 4, 'core'),\n        c('Vietnam War and its domestic effects', 4, 'core', ['Origins of the Cold War and containment']),\n        c('Counterculture and the new social movements', 3, 'core'),\n        c('Watergate and the crisis of confidence', 3, 'core'),\n      ],\n      []),\n    u(9, 'Period 9: 1980-present', [4, 6], 8,\n      'The Reagan realignment, the end of the Cold War, globalisation and the contemporary United States.',\n      [\n        c('Reagan and the conservative resurgence', 3, 'core'),\n        c('End of the Cold War', 3, 'core'),\n        c('Globalisation and the changing economy', 3, 'core'),\n        c('Demographic change and immigration since 1980', 3, 'core'),\n        c('September 11 and the war on terror', 3, 'important'),\n      ],\n      []),\n  ],\n});\n","axiom:curriculum/ap-world-history.js":"import { c, u, apBands, course } from 'axiom:curriculum/kit.js';\n\nexport default course({\n  key: 'ap-world-history-modern',\n  title: 'AP World History: Modern',\n  exam: 'AP World History: Modern',\n  subject: 'History',\n  level: 'AP / first-year college',\n  aliases: ['ap world history', 'ap world', 'apwh', 'ap world history modern'],\n  overview:\n    'Nine units covering roughly 1200 CE to the present, built on six themes and the same historical reasoning skills as the other AP histories. Units 3 through 6 carry the heaviest weight. The exam is 60% writing, and the rubrics reward comparison and causation across societies rather than the story of any one of them.',\n  total_hours: 160,\n  exam_format: {\n    total_minutes: 195,\n    description:\n      'Section I Part A is 55 multiple-choice questions in 55 minutes, worth 40%, in stimulus sets. Part B is 3 short-answer questions in 40 minutes, worth 20%. Section II Part A is the document-based question in 60 minutes including a 15-minute reading period, worth 25%. Part B is the long essay question in 40 minutes, worth 15%.',\n    sections: [\n      { name: 'Section I Part A: Multiple Choice', question_type: 'mcq', count: 55, minutes: 55, weight_percent: 40, notes: 'Source-based sets. The attribution line is often the key to the answer.' },\n      { name: 'Section I Part B: Short Answer', question_type: 'saq', count: 3, minutes: 40, weight_percent: 20, notes: 'Question 1 is always a secondary-source pair; specific evidence beats general description.' },\n      { name: 'Section II Part A: Document-Based Question', question_type: 'dbq', count: 1, minutes: 60, weight_percent: 25, notes: 'Seven points. Always drawn from units 3 to 6 in recent years.' },\n      { name: 'Section II Part B: Long Essay', question_type: 'leq', count: 1, minutes: 40, weight_percent: 15, notes: 'Three prompt choices spanning early, middle and late periods on one reasoning skill.' },\n    ],\n  },\n  score_bands: apBands([70, 58, 45, 31]),\n  units: [\n    u(1, 'The Global Tapestry, c. 1200-1450', [8, 10], 14,\n      'The state of the world before the great connections: Song China, Dar al-Islam, South and Southeast Asia, the Americas, Africa and Europe.',\n      [\n        c('Song China and its economy', 3, 'core'),\n        c('Confucianism, Buddhism and Neo-Confucianism', 3, 'core'),\n        c('Dar al-Islam and Islamic states', 3, 'core'),\n        c('South and Southeast Asian states and religions', 3, 'core'),\n        c('State building in the Americas', 3, 'core'),\n        c('State building in Africa', 3, 'core'),\n        c('European feudalism and the Christian church', 3, 'core'),\n        c('Contextualisation as a reasoning skill', 4, 'core'),\n      ],\n      []),\n    u(2, 'Networks of Exchange, c. 1200-1450', [8, 10], 14,\n      'The Silk Roads, the Mongols, the Indian Ocean and trans-Saharan trade, and what moved along them.',\n      [\n        c('Silk Roads', 3, 'core'),\n        c('The Mongol Empire and its consequences', 4, 'core'),\n        c('Indian Ocean trade network', 4, 'core'),\n        c('Trans-Saharan trade routes', 3, 'core'),\n        c('Cultural and environmental consequences of connectivity', 4, 'core', ['Silk Roads', 'Indian Ocean trade network']),\n        c('Spread of the Black Death', 3, 'important', ['The Mongol Empire and its consequences']),\n      ],\n      [\n        ['Describing a trade route without its technology.', 'Camel saddles, the dhow, monsoon knowledge and paper money are what made each network possible; rubrics reward naming them.'],\n      ]),\n    u(3, 'Land-Based Empires, c. 1450-1750', [12, 15], 16,\n      'The gunpowder empires: Ottoman, Safavid, Mughal, Ming-Qing, Russian, and how they legitimised and administered rule.',\n      [\n        c('Expansion of land-based empires', 3, 'core'),\n        c('Gunpowder and military technology', 3, 'core'),\n        c('Administration of empires and tax systems', 4, 'core', ['Expansion of land-based empires']),\n        c('Legitimising and consolidating power', 4, 'core', ['Administration of empires and tax systems']),\n        c('Belief systems in the land-based empires', 3, 'core'),\n        c('Comparison as a reasoning skill', 4, 'core'),\n      ],\n      []),\n    u(4, 'Transoceanic Interconnections, c. 1450-1750', [12, 15], 18,\n      'Maritime exploration, the Columbian Exchange, the Atlantic system and the internal changes it drove in Europe.',\n      [\n        c('Technological innovations in navigation', 3, 'core'),\n        c('European maritime exploration', 3, 'core', ['Technological innovations in navigation']),\n        c('Columbian Exchange', 4, 'core', ['European maritime exploration']),\n        c('Maritime empires established and maintained', 4, 'core'),\n        c('Atlantic slave trade and its effects', 4, 'core', ['Maritime empires established and maintained']),\n        c('Internal and external challenges to state power', 4, 'core'),\n        c('Changing social hierarchies', 4, 'core', ['Atlantic slave trade and its effects']),\n        c('DBQ document sourcing and HIPP', 5, 'core'),\n      ],\n      [\n        ['Treating the Columbian Exchange as one-directional.', 'Crops, animals, diseases and people moved both ways, and the demographic consequences differed sharply by region.'],\n      ]),\n    u(5, 'Revolutions, c. 1750-1900', [12, 15], 18,\n      'Enlightenment thought, the Atlantic revolutions, industrialisation and the ideologies it produced.',\n      [\n        c('The Enlightenment', 3, 'core'),\n        c('Nationalism and revolutions', 4, 'core', ['The Enlightenment']),\n        c('Industrial Revolution: causes and spread', 4, 'core'),\n        c('Technology of the Industrial Age', 3, 'core', ['Industrial Revolution: causes and spread']),\n        c('Industrial economic development and government roles', 4, 'core', ['Industrial Revolution: causes and spread']),\n        c('Reactions to industrialisation and social change', 4, 'core', ['Industrial Revolution: causes and spread']),\n        c('Capitalism, socialism and economic ideologies', 4, 'core'),\n        c('Causation as a reasoning skill', 4, 'core'),\n      ],\n      []),\n    u(6, 'Consequences of Industrialization, c. 1750-1900', [12, 15], 18,\n      'Imperialism, the global economy it created, migration, and resistance to empire.',\n      [\n        c('Rationales for imperialism', 3, 'core'),\n        c('State expansion and the scramble for Africa', 4, 'core', ['Rationales for imperialism']),\n        c('Indigenous responses to imperialism', 4, 'core', ['State expansion and the scramble for Africa']),\n        c('Global economic development and cash crops', 4, 'core'),\n        c('Economic imperialism', 4, 'core', ['Global economic development and cash crops']),\n        c('Causes and effects of migration', 4, 'core'),\n      ],\n      [\n        ['Reducing colonised societies to victims.', 'Rubrics reward agency: rebellions, reform movements, religious revivals and selective adoption of Western technology.'],\n      ]),\n    u(7, 'Global Conflict, c. 1900-present', [8, 10], 16,\n      'The World Wars, the collapse of empires, mass atrocity and total war.',\n      [\n        c('Shifting power after 1900', 3, 'core'),\n        c('Causes of World War I', 4, 'core', ['Shifting power after 1900']),\n        c('Conducting World War I and total war', 3, 'core', ['Causes of World War I']),\n        c('Economy in the interwar period', 4, 'core'),\n        c('Unresolved tensions and the rise of fascism', 4, 'core', ['Economy in the interwar period']),\n        c('Causes and conduct of World War II', 4, 'core', ['Unresolved tensions and the rise of fascism']),\n        c('Mass atrocities in the twentieth century', 3, 'core'),\n      ],\n      []),\n    u(8, 'Cold War and Decolonization, c. 1900-present', [8, 10], 16,\n      'Superpower rivalry, decolonisation, newly independent states and the movements that shaped them.',\n      [\n        c('Setting the stage for the Cold War', 3, 'core'),\n        c('The Cold War and effects of the conflict', 4, 'core', ['Setting the stage for the Cold War']),\n        c('Spread of communism after 1900', 4, 'core', ['The Cold War and effects of the conflict']),\n        c('Decolonisation after 1900', 4, 'core'),\n        c('Newly independent states and their choices', 4, 'core', ['Decolonisation after 1900']),\n        c('Global resistance to established power structures', 3, 'core'),\n        c('LEQ thesis, evidence and complexity', 5, 'core'),\n      ],\n      []),\n    u(9, 'Globalization, c. 1900-present', [8, 10], 14,\n      'Technology, disease, the environment, economic change and culture in a connected world.',\n      [\n        c('Advances in technology and exchange', 3, 'core'),\n        c('Technological innovations and disease', 3, 'core'),\n        c('Environmental consequences of globalisation', 3, 'core'),\n        c('Economic change and international institutions', 4, 'core'),\n        c('Calls for reform and responses', 3, 'core'),\n        c('Globalised culture', 3, 'important'),\n        c('Continuity and change as a reasoning skill', 4, 'core'),\n      ],\n      []),\n  ],\n});\n","axiom:server/engine/errors.js":"/**\n * Error taxonomy. What the tutor does next depends far more on *why* an answer\n * was wrong than on the fact that it was wrong: a slipped minus sign should not\n * trigger a re-teach, and a broken mental model should not be answered with\n * \"try another one\".\n */\nexport const ERROR_TYPES = {\n  conceptual: {\n    label: 'Conceptual misunderstanding',\n    severity: 1.0,\n    response: 'reteach',\n    guidance:\n      'The mental model itself is wrong. Name the specific false belief, contrast it with the correct idea, show a worked example that makes the difference visible, then re-test the same idea in a new surface form.',\n  },\n  prerequisite_gap: {\n    label: 'Prerequisite gap',\n    severity: 1.0,\n    response: 'backtrack',\n    guidance:\n      'A skill needed *before* this one is missing. Drop down to the prerequisite, fix it quickly, then return to the target concept.',\n  },\n  procedure: {\n    label: 'Procedure error',\n    severity: 0.7,\n    response: 'drill_steps',\n    guidance:\n      'The idea is understood but the method broke down at a specific step. Isolate that step and drill it, not the whole concept.',\n  },\n  reasoning: {\n    label: 'Reasoning error',\n    severity: 0.8,\n    response: 'reason_aloud',\n    guidance:\n      'The inference chain is faulty. Ask the learner to justify each step out loud before computing anything.',\n  },\n  transfer: {\n    label: 'Transfer failure',\n    severity: 0.6,\n    response: 'vary_surface',\n    guidance:\n      'They can do the familiar version and not the unfamiliar one. Keep the concept fixed and vary the surface story until it stops mattering.',\n  },\n  vocabulary: {\n    label: 'Vocabulary / notation gap',\n    severity: 0.5,\n    response: 'define',\n    guidance: 'A term or symbol was not understood. Define it precisely, then re-ask.',\n  },\n  memory: {\n    label: 'Memory failure',\n    severity: 0.5,\n    response: 'retrieval_practice',\n    guidance: 'It was known and is now gone. Use retrieval practice and tighten the review interval.',\n  },\n  misread: {\n    label: 'Misread the question',\n    severity: 0.25,\n    response: 'reread',\n    guidance:\n      'The work was sound but aimed at the wrong target. Point at the words that were skipped; do not re-teach.',\n  },\n  calculation: {\n    label: 'Calculation error',\n    severity: 0.25,\n    response: 'spot_fix',\n    guidance:\n      'Arithmetic or algebra slip only. Point at the exact line, have them fix it, and move on — no re-teaching.',\n  },\n  careless: {\n    label: 'Careless mistake',\n    severity: 0.2,\n    response: 'spot_fix',\n    guidance: 'Point it out in one line and continue at the same difficulty.',\n  },\n  incomplete: {\n    label: 'Incomplete answer',\n    severity: 0.4,\n    response: 'push_further',\n    guidance: 'The start is right but it stops short. Ask for the missing part specifically.',\n  },\n  none: {\n    label: 'No error',\n    severity: 0,\n    response: 'advance',\n    guidance: 'Correct. Raise difficulty or move to the next concept.',\n  },\n};\n\nexport const ERROR_KEYS = Object.keys(ERROR_TYPES);\n\nexport const errorInfo = (key) => ERROR_TYPES[key] || ERROR_TYPES.conceptual;\n\n/** How much a given error type should damage the mastery estimate (0..1). */\nexport const errorSeverity = (key) => errorInfo(key).severity;\n\n/** Whether the mistake justifies stopping and re-teaching rather than pressing on. */\nexport const needsReteach = (key) => ['reteach', 'backtrack'].includes(errorInfo(key).response);\n","axiom:public/js/render/diagram.js":"import { h } from 'axiom:public/js/dom.js';\nimport { seriesColour } from 'axiom:public/js/render/charts.js';\n\n/**\n * Diagrams are rendered from a structured spec, never from model-authored SVG:\n * the model chooses what to show, this file decides how it looks. That keeps\n * markup out of the page and the visual language consistent across every\n * lesson.\n *\n * Marks follow the same rules as the charts — 2px connectors, nodes carrying a\n * 2px surface ring so overlaps stay readable, recessive chrome, and text in ink\n * tokens rather than the mark colour.\n */\nconst NS = 'http://www.w3.org/2000/svg';\n\nlet uid = 0;\nconst nextId = () => `ax${++uid}`;\n\nfunction el(tag, attrs = {}, ...children) {\n  const node = document.createElementNS(NS, tag);\n  for (const [key, value] of Object.entries(attrs)) {\n    if (value != null) node.setAttribute(key, String(value));\n  }\n  for (const child of children.flat()) {\n    if (child != null) node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);\n  }\n  return node;\n}\n\nfunction canvas(width, height) {\n  return el('svg', {\n    viewBox: `0 0 ${width} ${height}`,\n    width: '100%',\n    style: `max-height:${height}px`,\n    role: 'img',\n    preserveAspectRatio: 'xMidYMid meet',\n  });\n}\n\n/** Shared defs: the arrowhead and a soft vertical wash for node fills. */\nfunction defs(ids) {\n  return el(\n    'defs',\n    {},\n    el(\n      'marker',\n      { id: ids.arrow, viewBox: '0 0 10 10', refX: 8.5, refY: 5, markerWidth: 5.5, markerHeight: 5.5, orient: 'auto-start-reverse' },\n      el('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: 'var(--axis)' }),\n    ),\n    el(\n      'linearGradient',\n      { id: ids.wash, x1: '0', y1: '0', x2: '0', y2: '1' },\n      el('stop', { offset: '0%', 'stop-color': 'var(--surface-3)' }),\n      el('stop', { offset: '100%', 'stop-color': 'var(--surface-2)' }),\n    ),\n  );\n}\n\nfunction wrap(text, chars) {\n  const words = String(text || '').split(/\\s+/);\n  const lines = [];\n  let line = '';\n  for (const word of words) {\n    if ((`${line} ${word}`).trim().length > chars && line) {\n      lines.push(line.trim());\n      line = word;\n    } else {\n      line = `${line} ${word}`;\n    }\n  }\n  if (line.trim()) lines.push(line.trim());\n  return lines;\n}\n\nfunction label(text, x, y, opts = {}) {\n  const {\n    size = 12, weight = 500, fill = 'var(--ink)', anchor = 'middle', chars = 18, lineHeight = 14,\n  } = opts;\n  const lines = wrap(text, chars);\n  const node = el('text', {\n    x,\n    y: y - ((lines.length - 1) * lineHeight) / 2,\n    'text-anchor': anchor,\n    'font-size': size,\n    'font-weight': weight,\n    fill,\n    'font-family': 'var(--sans)',\n    'letter-spacing': '-0.01em',\n  });\n  lines.forEach((line, i) => node.appendChild(el('tspan', { x, dy: i === 0 ? 0 : lineHeight }, line)));\n  return node;\n}\n\n/* ------------------------------------------------------------------ flow */\n\nfunction flowDiagram(spec, ids) {\n  const nodes = spec.nodes.slice(0, 8);\n  if (!nodes.length) return null;\n  const boxW = 210;\n  const boxH = 64;\n  const gapY = 38;\n  const width = 440;\n  const height = nodes.length * (boxH + gapY) - gapY + 8;\n  const svg = canvas(width, height);\n  svg.appendChild(defs(ids));\n  const x = (width - boxW) / 2;\n\n  nodes.forEach((node, i) => {\n    const y = i * (boxH + gapY);\n    const colour = seriesColour(i);\n\n    if (i < nodes.length - 1) {\n      const edge = spec.edges.find((e) => e.from === node.id && e.to === nodes[i + 1].id);\n      svg.appendChild(\n        el('line', {\n          x1: width / 2, y1: y + boxH + 4, x2: width / 2, y2: y + boxH + gapY - 5,\n          stroke: 'var(--axis)', 'stroke-width': 2, 'stroke-linecap': 'round', 'marker-end': `url(#${ids.arrow})`,\n        }),\n      );\n      if (edge?.label) {\n        svg.appendChild(\n          label(edge.label, width / 2 + 14, y + boxH + gapY / 2 + 3, {\n            size: 10.5, weight: 500, fill: 'var(--ink-4)', anchor: 'start', chars: 22, lineHeight: 11,\n          }),\n        );\n      }\n    }\n\n    svg.appendChild(el('rect', { x, y, width: boxW, height: boxH, rx: 13, fill: `url(#${ids.wash})`, stroke: 'var(--line-2)', 'stroke-width': 1 }));\n    // A colour spine gives each step identity without tinting the whole card.\n    svg.appendChild(el('rect', { x, y: y + 10, width: 3, height: boxH - 20, rx: 2, fill: colour }));\n    svg.appendChild(\n      label(node.label, x + 20, y + (node.detail ? boxH / 2 - 7 : boxH / 2 + 4), {\n        size: 13, weight: 600, anchor: 'start', chars: 24, lineHeight: 15,\n      }),\n    );\n    if (node.detail) {\n      svg.appendChild(\n        label(node.detail, x + 20, y + boxH / 2 + 14, {\n          size: 11, weight: 400, fill: 'var(--ink-3)', anchor: 'start', chars: 32, lineHeight: 12,\n        }),\n      );\n    }\n  });\n  return svg;\n}\n\n/* ----------------------------------------------------------------- cycle */\n\nfunction cycleDiagram(spec, ids) {\n  const nodes = spec.nodes.slice(0, 7);\n  if (nodes.length < 2) return flowDiagram(spec, ids);\n  const size = 420;\n  const cx = size / 2;\n  const cy = size / 2;\n  const radius = 138;\n  const svg = canvas(size, size);\n  svg.appendChild(defs(ids));\n\n  svg.appendChild(el('circle', { cx, cy, r: radius, fill: 'none', stroke: 'var(--grid)', 'stroke-width': 1 }));\n\n  const points = nodes.map((_, i) => {\n    const angle = (i / nodes.length) * Math.PI * 2 - Math.PI / 2;\n    return { x: cx + radius * Math.cos(angle), y: cy + radius * Math.sin(angle), angle };\n  });\n\n  points.forEach((point, i) => {\n    const next = points[(i + 1) % points.length];\n    const mid = point.angle + Math.PI / nodes.length;\n    svg.appendChild(\n      el('path', {\n        d:\n          `M ${point.x + 38 * Math.cos(point.angle + 0.42)} ${point.y + 38 * Math.sin(point.angle + 0.42)} ` +\n          `Q ${cx + radius * 1.2 * Math.cos(mid)} ${cy + radius * 1.2 * Math.sin(mid)} ` +\n          `${next.x + 38 * Math.cos(next.angle - 0.52)} ${next.y + 38 * Math.sin(next.angle - 0.52)}`,\n        fill: 'none', stroke: 'var(--axis)', 'stroke-width': 2, 'stroke-linecap': 'round',\n        'marker-end': `url(#${ids.arrow})`,\n      }),\n    );\n  });\n\n  points.forEach((point, i) => {\n    const colour = seriesColour(i);\n    svg.appendChild(el('circle', { cx: point.x, cy: point.y, r: 37, fill: 'var(--surface)', stroke: colour, 'stroke-width': 2 }));\n    svg.appendChild(el('circle', { cx: point.x, cy: point.y, r: 37, fill: colour, opacity: 0.1 }));\n    svg.appendChild(label(nodes[i].label, point.x, point.y + 4, { size: 11, weight: 600, chars: 12, lineHeight: 12 }));\n  });\n  return svg;\n}\n\n/* ---------------------------------------------------------- concept map */\n\nfunction conceptMap(spec, ids) {\n  const nodes = spec.nodes.slice(0, 9);\n  if (!nodes.length) return null;\n  const width = 460;\n  const height = 400;\n  const cx = width / 2;\n  const cy = 198;\n  const svg = canvas(width, height);\n  svg.appendChild(defs(ids));\n\n  const [root, ...rest] = nodes;\n  const positions = new Map([[root.id, { x: cx, y: cy }]]);\n  rest.forEach((node, i) => {\n    const angle = (i / Math.max(1, rest.length)) * Math.PI * 2 - Math.PI / 2;\n    positions.set(node.id, { x: cx + 158 * Math.cos(angle), y: cy + 132 * Math.sin(angle) });\n  });\n\n  const edges = spec.edges.length ? spec.edges : rest.map((n) => ({ from: root.id, to: n.id, label: '' }));\n  for (const edge of edges) {\n    const from = positions.get(edge.from);\n    const to = positions.get(edge.to);\n    if (!from || !to) continue;\n    svg.appendChild(el('line', { x1: from.x, y1: from.y, x2: to.x, y2: to.y, stroke: 'var(--line-2)', 'stroke-width': 2, 'stroke-linecap': 'round' }));\n    if (edge.label) {\n      svg.appendChild(\n        label(edge.label, (from.x + to.x) / 2, (from.y + to.y) / 2 - 4, {\n          size: 9.5, fill: 'var(--ink-4)', chars: 15, lineHeight: 10,\n        }),\n      );\n    }\n  }\n\n  nodes.forEach((node, i) => {\n    const point = positions.get(node.id);\n    const isRoot = i === 0;\n    const w = isRoot ? 158 : 126;\n    const hgt = isRoot ? 48 : 40;\n    svg.appendChild(\n      el('rect', {\n        x: point.x - w / 2, y: point.y - hgt / 2, width: w, height: hgt, rx: 12,\n        fill: isRoot ? 'var(--brand-wash)' : `url(#${ids.wash})`,\n        stroke: isRoot ? 'var(--brand)' : 'var(--line-2)',\n        'stroke-width': isRoot ? 1.6 : 1,\n      }),\n    );\n    svg.appendChild(\n      label(node.label, point.x, point.y + 4, {\n        size: isRoot ? 12.5 : 11, weight: isRoot ? 650 : 550, chars: isRoot ? 18 : 16, lineHeight: 12,\n      }),\n    );\n  });\n  return svg;\n}\n\n/* -------------------------------------------------------------- timeline */\n\nfunction timelineDiagram(spec, ids) {\n  const items = spec.items.slice(0, 9);\n  if (!items.length) return null;\n  const rowH = 78;\n  const width = 480;\n  const height = items.length * rowH + 12;\n  const svg = canvas(width, height);\n  svg.appendChild(defs(ids));\n\n  svg.appendChild(el('line', { x1: 86, y1: 16, x2: 86, y2: height - 26, stroke: 'var(--grid)', 'stroke-width': 2, 'stroke-linecap': 'round' }));\n\n  items.forEach((item, i) => {\n    const y = 28 + i * rowH;\n    const colour = seriesColour(i);\n    svg.appendChild(el('circle', { cx: 86, cy: y, r: 6.5, fill: colour, stroke: 'var(--surface)', 'stroke-width': 2 }));\n    svg.appendChild(label(item.when, 68, y + 4, { size: 11, weight: 650, anchor: 'end', fill: 'var(--ink-3)', chars: 13, lineHeight: 12 }));\n    svg.appendChild(label(item.label, 108, y + (item.detail ? -3 : 4), { size: 13, weight: 600, anchor: 'start', chars: 38, lineHeight: 14 }));\n    if (item.detail) {\n      svg.appendChild(\n        label(item.detail, 108, y + 17, { size: 11, weight: 400, anchor: 'start', fill: 'var(--ink-3)', chars: 46, lineHeight: 12 }),\n      );\n    }\n  });\n  return svg;\n}\n\n/* ------------------------------------------------------------------- bar */\n\nfunction barDiagram(spec) {\n  const series = spec.series.slice(0, 10);\n  if (!series.length) return null;\n  const width = 460;\n  const rowH = 36;\n  const height = series.length * rowH + 14;\n  const max = Math.max(...series.map((s) => Math.abs(s.value)), 1);\n  const svg = canvas(width, height);\n  const labelW = 130;\n  const plot = width - labelW - 52;\n\n  series.forEach((entry, i) => {\n    const y = i * rowH + 9;\n    const barW = Math.max(3, (plot * Math.abs(entry.value)) / max);\n    svg.appendChild(label(entry.label, labelW - 12, y + 15, { size: 11.5, anchor: 'end', fill: 'var(--ink-3)', chars: 18, lineHeight: 12 }));\n    svg.appendChild(el('rect', { x: labelW, y: y + 3, width: plot, height: 18, rx: 4, fill: 'var(--grid)' }));\n    svg.appendChild(\n      el('path', {\n        d: `M${labelW},${y + 3} H${labelW + barW - 4} A4,4 0 0 1 ${labelW + barW},${y + 7}\n            V${y + 17} A4,4 0 0 1 ${labelW + barW - 4},${y + 21} H${labelW} Z`,\n        fill: seriesColour(i),\n      }),\n    );\n    svg.appendChild(label(String(entry.value), labelW + barW + 9, y + 16, { size: 11, anchor: 'start', fill: 'var(--ink-3)', chars: 9 }));\n  });\n  return svg;\n}\n\n/* -------------------------------------------------------- function graph */\n\nfunction functionGraph(spec, ids) {\n  const points = spec.points.filter((p) => Number.isFinite(p.x) && Number.isFinite(p.y));\n  if (points.length < 2) return null;\n  const width = 460;\n  const height = 300;\n  const pad = 46;\n  const xs = points.map((p) => p.x);\n  const ys = points.map((p) => p.y);\n  const minX = Math.min(...xs);\n  const maxX = Math.max(...xs);\n  const minY = Math.min(...ys, 0);\n  const maxY = Math.max(...ys, 0);\n  const sx = (x) => pad + ((x - minX) / (maxX - minX || 1)) * (width - pad * 2);\n  const sy = (y) => height - pad - ((y - minY) / (maxY - minY || 1)) * (height - pad * 2);\n  const svg = canvas(width, height);\n\n  const fill = el('linearGradient', { id: ids.fill, x1: '0', y1: '0', x2: '0', y2: '1' });\n  fill.appendChild(el('stop', { offset: '0%', 'stop-color': 'var(--s1)', 'stop-opacity': 0.22 }));\n  fill.appendChild(el('stop', { offset: '100%', 'stop-color': 'var(--s1)', 'stop-opacity': 0 }));\n  svg.appendChild(el('defs', {}, fill));\n\n  for (let i = 0; i <= 4; i++) {\n    const y = pad + (i * (height - pad * 2)) / 4;\n    svg.appendChild(el('line', { x1: pad, y1: y, x2: width - pad, y2: y, stroke: 'var(--grid)', 'stroke-width': 1 }));\n  }\n  if (minY < 0 && maxY > 0) svg.appendChild(el('line', { x1: pad, y1: sy(0), x2: width - pad, y2: sy(0), stroke: 'var(--axis)', 'stroke-width': 1.5 }));\n  if (minX < 0 && maxX > 0) svg.appendChild(el('line', { x1: sx(0), y1: pad, x2: sx(0), y2: height - pad, stroke: 'var(--axis)', 'stroke-width': 1.5 }));\n\n  const ordered = points.slice().sort((a, b) => a.x - b.x);\n  const line = ordered.map((p, i) => `${i === 0 ? 'M' : 'L'} ${sx(p.x).toFixed(1)} ${sy(p.y).toFixed(1)}`).join(' ');\n\n  svg.appendChild(\n    el('path', {\n      d: `${line} L ${sx(ordered.at(-1).x)} ${sy(minY)} L ${sx(ordered[0].x)} ${sy(minY)} Z`,\n      fill: `url(#${ids.fill})`, stroke: 'none',\n    }),\n  );\n  svg.appendChild(el('path', { d: line, fill: 'none', stroke: 'var(--s1)', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));\n\n  for (const point of points) {\n    if (!point.label) continue;\n    svg.appendChild(el('circle', { cx: sx(point.x), cy: sy(point.y), r: 4.5, fill: 'var(--s1)', stroke: 'var(--surface)', 'stroke-width': 2 }));\n    svg.appendChild(label(point.label, sx(point.x), sy(point.y) - 12, { size: 10.5, fill: 'var(--ink-3)', chars: 16 }));\n  }\n\n  svg.appendChild(label(spec.x_label || 'x', width / 2, height - 12, { size: 11, fill: 'var(--ink-4)', chars: 30 }));\n  const yLabel = label(spec.y_label || 'y', 0, 0, { size: 11, fill: 'var(--ink-4)', chars: 30 });\n  yLabel.setAttribute('transform', `translate(16 ${height / 2}) rotate(-90)`);\n  svg.appendChild(yLabel);\n  return svg;\n}\n\n/* ------------------------------------------------------------ comparison */\n\nfunction comparisonTable(spec) {\n  if (!spec.columns.length) return null;\n  return h(\n    'div',\n    { style: { overflowX: 'auto', width: '100%' } },\n    h(\n      'table.cmp-table',\n      {},\n      h('thead', {}, h('tr', {}, ...spec.columns.map((c) => h('th', {}, c)))),\n      h('tbody', {}, ...spec.rows.map((row) => h('tr', {}, ...spec.columns.map((_, i) => h('td', {}, row[i] ?? ''))))),\n    ),\n  );\n}\n\nconst RENDERERS = {\n  flow: flowDiagram,\n  cycle: cycleDiagram,\n  concept_map: conceptMap,\n  timeline: timelineDiagram,\n  bar: barDiagram,\n  function_graph: functionGraph,\n  comparison: comparisonTable,\n};\n\nexport function renderDiagram(spec) {\n  if (!spec || !spec.type) return null;\n  const build = RENDERERS[spec.type] || flowDiagram;\n  const ids = { arrow: nextId(), wash: nextId(), fill: nextId() };\n  let body;\n  try {\n    body = build(spec, ids);\n  } catch {\n    body = null;\n  }\n  if (!body) return null;\n\n  return h(\n    'figure.diagram',\n    {},\n    spec.title ? h('figcaption.diagram-title', {}, spec.title) : null,\n    h('div.diagram-body', {}, body),\n    spec.caption ? h('figcaption.diagram-caption', {}, spec.caption) : null,\n  );\n}\n","axiom:server/llm/partial-json.js":"// Tolerant JSON prefix parser.\n//\n// Structured generations arrive as a stream of text deltas that only become\n// valid JSON on the final chunk. To render a lesson while it is still being\n// written we need the best-effort value of an *incomplete* document, including\n// the half-written string the model is in the middle of emitting.\n\nconst OBJ = 1;\nconst ARR = 2;\nconst CONTROL_CHARS = /[\\u0000-\\u001f]/g;\n\n/** Parse a (possibly truncated) JSON document. Returns undefined if hopeless. */\nexport function parsePartialJson(src) {\n  if (typeof src !== 'string') return undefined;\n  const text = src.trim();\n  if (!text) return undefined;\n  try {\n    return JSON.parse(text);\n  } catch {\n    /* fall through to repair */\n  }\n  for (const candidate of repairCandidates(text)) {\n    try {\n      return JSON.parse(candidate);\n    } catch {\n      /* try the next, more conservative, repair */\n    }\n  }\n  return undefined;\n}\n\nfunction closers(types) {\n  let out = '';\n  for (let i = types.length - 1; i >= 0; i--) out += types[i] === OBJ ? '}' : ']';\n  return out;\n}\n\n/** Remove a trailing comma / dangling `\"key\":` so the prefix can be closed. */\nfunction stripDangling(input) {\n  let out = input.replace(/[\\s,]+$/, '');\n  if (out.endsWith(':')) {\n    out = out.slice(0, -1).replace(/\\s+$/, '');\n    if (out.endsWith('\"')) {\n      let k = out.length - 2;\n      while (k >= 0) {\n        if (out[k] === '\"') {\n          let backslashes = 0;\n          let m = k - 1;\n          while (m >= 0 && out[m] === '\\\\') {\n            backslashes++;\n            m--;\n          }\n          if (backslashes % 2 === 0) break;\n        }\n        k--;\n      }\n      out = out.slice(0, Math.max(0, k)).replace(/[\\s,]+$/, '');\n    }\n  }\n  return out;\n}\n\n/** Produce repair candidates for a truncated document, most informative first. */\nfunction repairCandidates(s) {\n  const stack = [];\n  const top = () => stack[stack.length - 1];\n  let inString = false;\n  let escaped = false;\n  let stringIsKey = false;\n  let cut = 0;\n  let cutTypes = [];\n  const markSafe = (idx) => {\n    cut = idx;\n    cutTypes = stack.map((f) => f.type);\n  };\n\n  let i = 0;\n  while (i < s.length) {\n    const c = s[i];\n\n    if (inString) {\n      if (escaped) {\n        escaped = false;\n        i++;\n        continue;\n      }\n      if (c === '\\\\') {\n        escaped = true;\n        i++;\n        continue;\n      }\n      if (c === '\"') {\n        inString = false;\n        i++;\n        const f = top();\n        if (f && f.type === OBJ && f.phase === 'key') {\n          f.phase = 'afterKey';\n        } else {\n          if (f) f.phase = 'afterValue';\n          markSafe(i);\n        }\n        continue;\n      }\n      i++;\n      continue;\n    }\n\n    if (c === '\"') {\n      const f = top();\n      stringIsKey = Boolean(f && f.type === OBJ && f.phase === 'key');\n      inString = true;\n      escaped = false;\n      i++;\n      continue;\n    }\n    if (c === '{' || c === '[') {\n      stack.push({ type: c === '{' ? OBJ : ARR, phase: c === '{' ? 'key' : 'value' });\n      i++;\n      markSafe(i);\n      continue;\n    }\n    if (c === '}' || c === ']') {\n      stack.pop();\n      i++;\n      const f = top();\n      if (f) f.phase = 'afterValue';\n      markSafe(i);\n      continue;\n    }\n    if (c === ':') {\n      const f = top();\n      if (f) f.phase = 'value';\n      i++;\n      continue;\n    }\n    if (c === ',') {\n      const f = top();\n      if (f) f.phase = f.type === OBJ ? 'key' : 'value';\n      i++;\n      markSafe(i);\n      continue;\n    }\n    if (c === ' ' || c === '\\n' || c === '\\t' || c === '\\r') {\n      i++;\n      continue;\n    }\n\n    // bare literal: number | true | false | null\n    let j = i;\n    while (j < s.length && !',}]: \\n\\t\\r'.includes(s[j])) j++;\n    if (j < s.length) {\n      const f = top();\n      if (f) f.phase = 'afterValue';\n      markSafe(j);\n    }\n    i = j;\n  }\n\n  const candidates = [];\n\n  if (inString && !stringIsKey) {\n    // Keep the half-written string value — this is what makes live rendering work.\n    let body = s;\n    if (escaped) body = body.slice(0, -1);\n    const openQuote = body.lastIndexOf('\"');\n    const head = body.slice(0, openQuote + 1);\n    // Raw control characters are illegal inside JSON strings; escape any that\n    // slipped through so the repaired document still parses.\n    const tail = body\n      .slice(openQuote + 1)\n      .replace(CONTROL_CHARS, (ch) => '\\\\u' + ch.charCodeAt(0).toString(16).padStart(4, '0'));\n    candidates.push(head + tail + '\"' + closers(stack.map((f) => f.type)));\n  }\n\n  candidates.push(stripDangling(s.slice(0, cut)) + closers(cutTypes));\n  return candidates;\n}\n\n/**\n * Extract the value of a top-level string field from a partial document without\n * requiring the rest of the document to be parseable. Used to stream one field.\n */\nexport function partialStringField(src, field) {\n  const obj = parsePartialJson(src);\n  if (obj && typeof obj === 'object' && typeof obj[field] === 'string') return obj[field];\n  return '';\n}\n","axiom:curriculum/kit.js":"/**\n * Helpers for writing course blueprints by hand.\n *\n * Everything in `curriculum/` is transcribed from the published course\n * framework for a real exam — unit titles, unit exam weightings, exam\n * structure. Where the awarding body publishes a weight as a range (AP does,\n * for almost every course) the blueprint stores the midpoint as the working\n * weight and keeps the published range alongside it, so the interface can show\n * the learner what was actually published rather than a number we invented.\n */\n\n/** A concept: the smallest thing mastery is tracked against. */\nexport const c = (name, difficulty, criticality = 'important', prerequisites = []) => ({\n  name,\n  difficulty,\n  criticality,\n  prerequisites,\n});\n\n/** A unit. `weight` is either a number or a published `[min, max]` range. */\nexport function u(idx, title, weight, hours, summary, concepts, traps = []) {\n  const range = Array.isArray(weight) ? weight : null;\n  const percent = range ? (range[0] + range[1]) / 2 : weight;\n  return {\n    idx,\n    title,\n    summary,\n    exam_weight_percent: Number(percent.toFixed(2)),\n    published_weight: range ? `${range[0]}-${range[1]}%` : `${weight}%`,\n    hours,\n    concepts,\n    exam_traps: traps.map(([trap, fix]) => ({ trap, fix })),\n  };\n}\n\n/**\n * AP score bands.\n *\n * College Board does not publish the raw-score cutoffs; they are re-set each\n * year from the actual score distribution. These are the composite percentages\n * that have historically landed on each score for this exam, and they are\n * labelled as approximate wherever the learner sees them.\n */\nexport const apBands = ([five, four, three, two]) => [\n  { score: 5, min_percent: five, meaning: 'Extremely well qualified' },\n  { score: 4, min_percent: four, meaning: 'Well qualified' },\n  { score: 3, min_percent: three, meaning: 'Qualified' },\n  { score: 2, min_percent: two, meaning: 'Possibly qualified' },\n  { score: 1, min_percent: 0, meaning: 'No recommendation' },\n];\n\n/**\n * Assemble a blueprint.\n *\n * Published weights are ranges, and the midpoints of a set of ranges do not\n * add to 100 — AP Chemistry's midpoints add to 89, because its ranges are\n * asymmetric and the real paper sits near the top of each one. The readiness\n * model needs weights that partition the paper, so the working weight is the\n * midpoint scaled to sum to 100, and `published_weight` keeps the range as\n * transcribed so the interface can show a learner what was actually published.\n */\nexport function course(spec) {\n  const blueprint = {\n    ...spec,\n    source: spec.source || 'College Board course and exam description',\n    verified: true,\n  };\n\n  const raw = blueprint.units.reduce((sum, unit) => sum + unit.exam_weight_percent, 0);\n  for (const unit of blueprint.units) {\n    unit.midpoint_weight = unit.exam_weight_percent;\n    unit.exam_weight_percent = Number(((unit.exam_weight_percent * 100) / raw).toFixed(2));\n  }\n  blueprint.weight_total = Number(\n    blueprint.units.reduce((sum, unit) => sum + unit.exam_weight_percent, 0).toFixed(2),\n  );\n  return blueprint;\n}\n"}
</script>
<script>
/* Wire the embedded modules together as real ES modules: each becomes a blob
   URL, and an import map resolves the "axiom:" specifiers between them. This
   keeps module scope, live bindings and cycles working exactly as they do when
   the same files are served over HTTP. */
(function () {
  var sources = JSON.parse(document.getElementById('axiom-modules').textContent);
  var imports = {};
  try {
    for (var id in sources) {
      imports[id] = URL.createObjectURL(new Blob([sources[id]], { type: 'text/javascript' }));
    }
  } catch (err) {
    document.getElementById('app').innerHTML =
      '<div style="padding:48px;font:15px/1.6 system-ui;max-width:60ch;margin:0 auto">' +
      '<h1 style="font-size:22px">This browser cannot start Axiom</h1>' +
      '<p>It blocked the object URLs the app is assembled from. Try Chrome, Edge, Firefox or Safari with default settings.</p></div>';
    return;
  }

  var map = document.createElement('script');
  map.type = 'importmap';
  map.textContent = JSON.stringify({ imports: imports });
  document.head.appendChild(map);

  var boot = document.createElement('script');
  boot.type = 'module';
  boot.textContent = 'import "axiom:browser/main.js";';
  document.head.appendChild(boot);

  window.addEventListener('error', function (event) {
    if (document.querySelector('.gate') || document.querySelector('.shell')) return;
    var app = document.getElementById('app');
    if (app && app.querySelector('.boot')) {
      app.innerHTML =
        '<div style="padding:48px;font:15px/1.6 system-ui;max-width:60ch;margin:0 auto">' +
        '<h1 style="font-size:22px">Axiom failed to start</h1><pre style="white-space:pre-wrap;opacity:.7">' +
        String(event.message || event.error) + '</pre></div>';
    }
  });
})();
</script>
