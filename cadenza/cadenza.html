<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadenza — Music Notation</title>
<meta name="description" content="A notation and composition workstation that runs in the browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8E%BC%3C/text%3E%3C/svg%3E">
<style>
/* Cadenza — application chrome.
 * Dark tooling around a light page, so the score reads as paper. */

:root {
  --bg: #14161b;
  --panel: #1b1e25;
  --panel-2: #22262f;
  --panel-3: #2a2f3a;
  --line: #2e3441;
  --line-soft: #262b35;
  --text: #d3d8e0;
  --text-dim: #868e9e;
  --text-faint: #5d6473;
  --accent: #5b8def;
  --accent-soft: rgba(91, 141, 239, .18);
  --accent-2: #e8a33d;
  --accent-2-soft: rgba(232, 163, 61, .18);
  --danger: #e0564e;
  --ok: #4bbd8a;
  --paper: #fff;
  --ink: #16181c;
  --sel: #2f6fe0;
  --radius: 6px;
  --ribbon-h: 72px;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --serif: Georgia, "Times New Roman", serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 13px/1.45 var(--font);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, select { font: inherit; color: inherit; }
.hidden { display: none !important; }

#app {
  display: grid;
  grid-template-rows: 44px auto 1fr 46px auto 24px;
  height: 100%;
}

/* ------------------------------------------------------------- top bar */

#topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 0 12px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.brand {
  font-weight: 600; letter-spacing: .3px; font-size: 14px;
  display: flex; align-items: center; gap: 7px; white-space: nowrap;
}
.brand-mark { color: var(--accent); font-size: 17px; }
.doc-title-wrap { flex: 1; display: flex; align-items: baseline; gap: 10px; justify-content: center; min-width: 0; }
.doc-title {
  background: transparent; border: 1px solid transparent; border-radius: 5px;
  padding: 3px 8px; font-size: 14px; font-weight: 600; text-align: center;
  max-width: 380px; min-width: 90px; width: 260px;
}
.doc-composer {
  background: transparent; border: 1px solid transparent; border-radius: 5px;
  padding: 3px 8px; font-size: 12px; color: var(--text-dim); text-align: center;
  width: 150px; font-style: italic;
}
.doc-title:hover, .doc-composer:hover { border-color: var(--line); }
.doc-title:focus, .doc-composer:focus { outline: 0; border-color: var(--accent); background: var(--panel-2); }

.tb-group { display: flex; align-items: center; gap: 3px; }
.tb-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px; border-radius: 5px; color: var(--text-dim);
  white-space: nowrap; font-size: 12px;
}
.tb-btn:hover { background: var(--panel-2); color: var(--text); }
.tb-btn:disabled { opacity: .35; cursor: default; }
.tb-btn:disabled:hover { background: none; color: var(--text-dim); }
.tb-btn.on { background: var(--accent-soft); color: #a9c6ff; }
.tb-btn .gi { font-size: 15px; line-height: 1; }

/* -------------------------------------------------------------- ribbon */

#ribbon {
  display: flex; align-items: stretch; flex-wrap: wrap; gap: 0;
  background: var(--panel-2);
  border-bottom: 1px solid var(--line);
}
.grp {
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 4px 9px 2px; border-right: 1px solid var(--line-soft);
  border-bottom: 1px solid var(--line-soft); flex: 0 0 auto;
}
.grp-row { display: flex; align-items: center; gap: 2px; }
.grp-label {
  font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--text-faint); text-align: center; padding-top: 3px; user-select: none;
}
.rb {
  min-width: 27px; height: 29px; padding: 0 4px; border-radius: 5px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--text-dim); position: relative;
}
.rb:hover { background: var(--panel-3); color: var(--text); }
.rb.on { background: var(--accent-soft); color: #a9c6ff; box-shadow: inset 0 0 0 1px rgba(91,141,239,.4); }
.rb.wide { padding: 0 9px; font-size: 12px; gap: 5px; }
.rb svg { display: block; }
.rb .lbl { font-size: 11.5px; }
.rb.dur svg { width: 22px; height: 26px; }
.rb.sym svg { width: 20px; height: 24px; }
.rb:disabled { opacity: .3; cursor: default; }
.rb:disabled:hover { background: none; }
.sepv { width: 1px; background: var(--line-soft); margin: 4px 5px; align-self: stretch; }

/* ------------------------------------------------------------ workspace */

#workspace { display: grid; grid-template-columns: 232px 1fr 250px; min-height: 0; }
#left-panel, #right-panel {
  background: var(--panel); display: flex; flex-direction: column; min-height: 0;
}
#left-panel { border-right: 1px solid var(--line); }
#right-panel { border-left: 1px solid var(--line); }
.panel-tabs { display: flex; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
.ptab {
  flex: 1; padding: 8px 6px; font-size: 11.5px; color: var(--text-faint);
  border-bottom: 2px solid transparent;
}
.ptab:hover { color: var(--text); }
.ptab.active { color: var(--text); border-bottom-color: var(--accent); background: var(--panel-2); }
.panel-body { flex: 1; overflow-y: auto; padding: 8px; min-height: 0; }
.panel-body::-webkit-scrollbar, #score-scroll::-webkit-scrollbar { width: 9px; height: 9px; }
.panel-body::-webkit-scrollbar-thumb, #score-scroll::-webkit-scrollbar-thumb {
  background: var(--panel-3); border-radius: 5px;
}

.sec-title {
  font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--text-faint); margin: 10px 2px 5px;
}
.sec-title:first-child { margin-top: 2px; }

/* instrument list */
.part-row {
  display: flex; align-items: center; gap: 7px; padding: 6px 7px;
  border-radius: 5px; cursor: pointer; margin-bottom: 2px;
}
.part-row:hover { background: var(--panel-2); }
.part-row.sel { background: var(--accent-soft); }
.part-row .pname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.part-row .pfam { font-size: 10px; color: var(--text-faint); }
.mini {
  width: 20px; height: 19px; border-radius: 4px; font-size: 9.5px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--panel-3); color: var(--text-faint);
}
.mini:hover { color: var(--text); }
.mini.on { background: var(--accent); color: #fff; }
.mini.solo.on { background: var(--accent-2); color: #241a08; }

/* mixer */
.mix-row { padding: 7px 6px; border-bottom: 1px solid var(--line-soft); }
.mix-head { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
.mix-head .pname { flex: 1; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mix-ctl { display: flex; align-items: center; gap: 7px; }
.mix-ctl label { font-size: 9.5px; color: var(--text-faint); width: 22px; }
input[type=range] {
  -webkit-appearance: none; appearance: none; height: 3px; border-radius: 2px;
  background: var(--panel-3); flex: 1; outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
  background: var(--text-dim); cursor: pointer; border: 0;
}
input[type=range]::-webkit-slider-thumb:hover { background: var(--accent); }
input[type=range]::-moz-range-thumb {
  width: 12px; height: 12px; border-radius: 50%; background: var(--text-dim); border: 0; cursor: pointer;
}

/* inspector */
.insp-field { margin-bottom: 9px; }
.insp-field > label {
  display: block; font-size: 10px; color: var(--text-faint);
  text-transform: uppercase; letter-spacing: .06em; margin-bottom: 3px;
}
.insp-value { font-size: 12.5px; }
.insp-row { display: flex; gap: 5px; flex-wrap: wrap; }
.chip {
  padding: 4px 8px; border-radius: 4px; background: var(--panel-2);
  font-size: 11.5px; color: var(--text-dim); border: 1px solid var(--line);
}
.chip:hover { color: var(--text); border-color: var(--panel-3); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: #a9c6ff; }
select, input[type=text], input[type=number] {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px;
  padding: 5px 7px; width: 100%; font-size: 12px;
}
select:focus, input[type=text]:focus, input[type=number]:focus { outline: 0; border-color: var(--accent); }
.empty-note { color: var(--text-faint); font-size: 12px; line-height: 1.6; padding: 6px 2px; }
kbd {
  font: 11px/1 var(--mono); background: var(--panel-3); color: var(--text);
  border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
  padding: 3px 5px; white-space: nowrap;
}
.key-table { width: 100%; border-collapse: collapse; }
.key-table td { padding: 3px 2px; font-size: 11.5px; vertical-align: top; }
.key-table td:first-child { width: 88px; }
.key-table tr:hover td { color: #fff; }

/* --------------------------------------------------------------- score */

#score-area { position: relative; min-width: 0; background: #3c414b; }
#score-scroll { position: absolute; inset: 0; overflow: auto; outline: none; padding: 26px 20px 40px; }
#score-pages { display: flex; flex-direction: column; align-items: center; gap: 22px; }
.score-page {
  background: var(--paper); box-shadow: 0 3px 16px rgba(0, 0, 0, .45);
  display: block; flex: 0 0 auto;
}
.score-page .pagebg { fill: var(--paper); }
.score-page .ink { fill: var(--ink); }
.score-page .l { stroke: var(--ink); stroke-linecap: butt; }
.score-page text { fill: var(--ink); }
.score-page .beam, .score-page .tie, .score-page .slur { fill: var(--ink); }
.score-page .rehearsal rect { stroke: var(--ink); fill: none; }
.score-page .measnum { fill: #8d8d93; }
.score-page .multirest, .score-page .multirest-num { fill: var(--ink); }
.score-page .partname { fill: #33373d; }
.score-page .staffline { stroke: #1c1f24; }

.score-page .sel { fill: var(--sel) !important; }
.score-page .sel.l, .score-page line.sel { stroke: var(--sel) !important; }
.score-page .hovered { fill: #6f96e8; }
.cursor-rect { fill: var(--accent-2); opacity: .16; }
.entry-caret { fill: var(--accent-2); opacity: .85; }
.play-line { stroke: var(--danger); stroke-width: .22; opacity: .9; }
.play-measure { fill: var(--danger); opacity: .09; }
.loop-band { fill: var(--accent); opacity: .09; }

#score-empty {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 12px; color: var(--text-dim); pointer-events: none;
}

/* ----------------------------------------------------------- transport */

#transport {
  display: flex; align-items: center; gap: 16px; padding: 0 12px;
  background: var(--panel); border-top: 1px solid var(--line);
}
.tp-left, .tp-right { display: flex; align-items: center; gap: 3px; }
.tp-mid { flex: 1; display: flex; align-items: center; gap: 18px; justify-content: center; }
.tp-btn {
  width: 34px; height: 30px; border-radius: 5px; display: inline-flex;
  align-items: center; justify-content: center; color: var(--text-dim);
}
.tp-btn:hover { background: var(--panel-2); color: var(--text); }
.tp-btn.primary { background: var(--accent); color: #fff; width: 42px; }
.tp-btn.primary:hover { background: #6f9cf5; }
.tp-btn.on { background: var(--accent-soft); color: #a9c6ff; }
.tp-field { display: flex; align-items: center; gap: 8px; }
.tp-field label { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); }
#tempo-slider { width: 128px; }
#tempo-input { width: 54px; text-align: center; padding: 3px; }
.tp-field .unit { font-size: 10.5px; color: var(--text-faint); }
.tp-position {
  font: 600 14px/1 var(--mono); color: var(--text); background: var(--panel-2);
  padding: 6px 11px; border-radius: 5px; min-width: 74px; text-align: center;
  border: 1px solid var(--line);
}
.tp-position .sep { color: var(--text-faint); margin: 0 2px; }

/* --------------------------------------------------------- piano bar */

#piano-bar {
  background: var(--panel-2); border-top: 1px solid var(--line);
  display: flex; align-items: stretch; height: 116px; overflow: hidden;
}
#piano-bar.collapsed { height: 0; border-top: 0; }
.pb-controls {
  width: 190px; flex: 0 0 auto; padding: 8px 10px; border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 6px; justify-content: center;
}
.pb-row { display: flex; align-items: center; gap: 6px; }
.pb-row label { font-size: 10px; color: var(--text-faint); width: 42px; }
.pb-keys { flex: 1; position: relative; overflow: hidden; }
.pkey {
  position: absolute; top: 0; border-radius: 0 0 3px 3px; cursor: pointer;
  user-select: none; -webkit-user-select: none;
}
.pkey.white { background: linear-gradient(#fbfbfa, #e8e7e3); border: 1px solid #9aa0a8; height: 100%; z-index: 1; }
.pkey.black { background: linear-gradient(#3a3f49, #15181d); border: 1px solid #0b0d10; height: 62%; z-index: 2; }
.pkey.white.down, .pkey.white.lit { background: linear-gradient(#bcd3ff, #8fb4f6); }
.pkey.black.down, .pkey.black.lit { background: linear-gradient(#5b8def, #33539a); }
.pkey .kname {
  position: absolute; bottom: 3px; left: 0; right: 0; text-align: center;
  font-size: 8.5px; color: #7a808b; pointer-events: none;
}
.pkey.black .kname { color: #6a7280; }

/* -------------------------------------------------------- status bar */

#status-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 0 12px; background: var(--panel); border-top: 1px solid var(--line);
  font-size: 11.5px; color: var(--text-faint);
}
#status-hint b { color: var(--text-dim); font-weight: 500; }
#status-hint kbd { font-size: 10px; padding: 1px 4px; border-bottom-width: 1px; }

/* ------------------------------------------------------------ tooltip */

#tooltip {
  position: fixed; z-index: 900; background: #0e1014; color: var(--text);
  border: 1px solid var(--line); border-radius: 5px; padding: 6px 9px;
  font-size: 11.5px; pointer-events: none; max-width: 260px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .5); line-height: 1.45;
}
#tooltip .tk { color: var(--text-faint); margin-left: 7px; font-family: var(--mono); font-size: 10.5px; }

/* ------------------------------------------------------------- modals */

.modal-backdrop {
  position: fixed; inset: 0; background: rgba(8, 9, 12, .68); z-index: 1000;
  display: flex; align-items: center; justify-content: center; padding: 24px;
  backdrop-filter: blur(2px);
}
.modal {
  background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
  box-shadow: 0 18px 60px rgba(0, 0, 0, .6); width: 100%; max-width: 620px;
  max-height: 88vh; display: flex; flex-direction: column; overflow: hidden;
}
.modal.wide { max-width: 860px; }
.modal.narrow { max-width: 420px; }
.modal-head {
  padding: 14px 18px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.modal-body { padding: 16px 18px; overflow-y: auto; }
.modal-foot {
  padding: 12px 18px; border-top: 1px solid var(--line);
  display: flex; justify-content: flex-end; gap: 8px; background: var(--panel-2);
}
.btn {
  padding: 7px 15px; border-radius: 5px; background: var(--panel-3);
  color: var(--text); font-size: 12.5px; border: 1px solid var(--line);
}
.btn:hover { background: #333a46; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #6f9cf5; }
.btn.ghost { background: none; border-color: transparent; color: var(--text-dim); }
.btn.ghost:hover { color: var(--text); background: var(--panel-2); }

.field-grid { display: grid; grid-template-columns: 118px 1fr; gap: 9px 12px; align-items: center; }
.field-grid > label { font-size: 12px; color: var(--text-dim); }
.ens-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 7px; }
.ens-card {
  padding: 10px 11px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--panel-2); text-align: left;
}
.ens-card:hover { border-color: var(--panel-3); }
.ens-card.on { border-color: var(--accent); background: var(--accent-soft); }
.ens-card .en { font-size: 12.5px; font-weight: 500; display: block; margin-bottom: 2px; }
.ens-card .ec { font-size: 10.5px; color: var(--text-faint); }

.inst-picker { display: grid; grid-template-columns: 150px 1fr; gap: 12px; min-height: 300px; }
.inst-fams { border-right: 1px solid var(--line); padding-right: 10px; }
.inst-fam { display: block; width: 100%; text-align: left; padding: 6px 8px; border-radius: 5px; font-size: 12px; color: var(--text-dim); }
.inst-fam:hover { background: var(--panel-2); color: var(--text); }
.inst-fam.on { background: var(--accent-soft); color: #a9c6ff; }
.inst-list { max-height: 330px; overflow-y: auto; }
.inst-item { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 7px 9px; border-radius: 5px; font-size: 12.5px; }
.inst-item:hover { background: var(--panel-2); }
.inst-item .rng { font-size: 10px; color: var(--text-faint); font-family: var(--mono); }

#toast-root { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); z-index: 1200; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.toast {
  background: #0e1014; border: 1px solid var(--line); border-radius: 6px;
  padding: 8px 14px; font-size: 12.5px; box-shadow: 0 8px 26px rgba(0,0,0,.5);
  animation: toastin .18s ease;
}
.toast.err { border-color: var(--danger); color: #ffb9b5; }
.toast.ok { border-color: var(--ok); }
@keyframes toastin { from { opacity: 0; transform: translateY(6px); } }

#app.loading #workspace, #app.loading #ribbon { opacity: .3; pointer-events: none; }

/* Compact layout: fold the side panels away on small screens. */
@media (max-width: 1180px) {
  #workspace { grid-template-columns: 196px 1fr 0; }
  #right-panel { display: none; }
}
@media (max-width: 900px) {
  #workspace { grid-template-columns: 0 1fr 0; }
  #left-panel { display: none; }
  .doc-composer { display: none; }
}

@media print {
  #topbar, #ribbon, #left-panel, #right-panel, #transport, #piano-bar, #status-bar { display: none !important; }
  #app { display: block; height: auto; }
  #score-area, #score-scroll { position: static; overflow: visible; background: #fff; padding: 0; }
  #score-pages { gap: 0; }
  .score-page { box-shadow: none; page-break-after: always; }
  body { background: #fff; overflow: visible; }
}

</style>
</head>
<body>
<div id="app" class="loading">

  <header id="topbar">
    <div class="brand"><span class="brand-mark">&#9835;</span> Cadenza</div>
    <div class="tb-group" id="file-actions"></div>
    <div class="doc-title-wrap">
      <input id="doc-title" class="doc-title" value="Untitled Score" spellcheck="false" aria-label="Score title">
      <input id="doc-composer" class="doc-composer" value="" placeholder="composer" spellcheck="false" aria-label="Composer">
    </div>
    <div class="tb-group" id="top-right"></div>
  </header>

  <nav id="ribbon" aria-label="Editing tools"></nav>

  <main id="workspace">
    <aside id="left-panel">
      <div class="panel-tabs" id="left-tabs">
        <button class="ptab active" data-tab="parts">Instruments</button>
        <button class="ptab" data-tab="mixer">Mixer</button>
      </div>
      <div class="panel-body" id="parts-panel"></div>
      <div class="panel-body hidden" id="mixer-panel"></div>
    </aside>

    <div id="score-area">
      <div id="score-scroll" tabindex="0" aria-label="Score">
        <div id="score-pages"></div>
      </div>
      <div id="score-empty" class="hidden"></div>
    </div>

    <aside id="right-panel">
      <div class="panel-tabs">
        <button class="ptab active" data-tab="inspector">Properties</button>
        <button class="ptab" data-tab="help">Shortcuts</button>
      </div>
      <div class="panel-body" id="inspector-panel"></div>
      <div class="panel-body hidden" id="help-panel"></div>
    </aside>
  </main>

  <footer id="transport">
    <div class="tp-left" id="tp-buttons"></div>
    <div class="tp-mid">
      <div class="tp-field">
        <label for="tempo-slider">Tempo</label>
        <input id="tempo-slider" type="range" min="20" max="240" value="96">
        <input id="tempo-input" type="number" min="20" max="300" value="96" aria-label="Tempo in beats per minute">
        <span class="unit">bpm</span>
      </div>
      <div class="tp-position" id="tp-position"><span id="pos-measure">1</span><span class="sep">:</span><span id="pos-beat">1</span></div>
    </div>
    <div class="tp-right" id="tp-toggles"></div>
  </footer>

  <section id="piano-bar">
    <div class="pb-controls" id="pb-controls"></div>
    <div class="pb-keys" id="piano-keys"></div>
  </section>

      row.className = 'grp-row';
      for (const it of grp.items) {
        if (it.sep) {
          const s = document.createElement('span');
          s.className = 'sepv';
          row.appendChild(s);
          continue;
        }
        const b = document.createElement('button');
        b.className = 'rb' + (it.wide ? ' wide' : '');
        b.dataset.act = it.act;
        b.dataset.tip = it.tip;
        if (it.key) b.dataset.key = it.key;
        b.innerHTML = this.iconFor(it.icon) + (it.label ? `<span class="lbl">${it.label}</span>` : '');
        b.onclick = () => this.act(it.act);
        row.appendChild(b);
      }
      const label = document.createElement('div');
      label.className = 'grp-label';
      label.textContent = grp.label;
      g.append(row, label);
      bar.appendChild(g);
    }
    this.refreshChrome();
  }

  iconFor(spec) {
    const [kind, a, b] = String(spec).split(':');
    if (kind === 'note') return noteIcon(a, b ? +b : 0, { size: 24 });
    if (kind === 'glyph') return glyphIcon(a, { size: 21 });
    if (kind === 'dyn') return dynamicIcon(a, { size: 19 });
    return UI[a] || '';
  }

    const left = document.getElementById('tp-buttons');

      const b = document.createElement('button');

      mk('rewind', UI.rewind, 'Return to the beginning', 'Home'),

      mk('stop', UI.stop, 'Stop', 'Esc'),
    );
    this.playBtn = left.querySelector('[data-act=playPause]');
    right.append(
      mk('metronome', UI.metronome, 'Metronome click', 'M'),
      mk('countIn', UI.countin, 'Count-in bar before playback'),
      mk('loop', UI.loop, 'Loop the selected measures', 'L'),
      mk('togglePiano', UI.keyboard, 'Show or hide the piano keyboard'),
      mk('midi', UI.midi, 'Connect a MIDI keyboard'),

    const sync = (v) => {
      const bpm = Math.max(20, Math.min(300, Math.round(v)));
      this.el.tempoSlider.value = bpm;
      this.el.tempoInput.value = bpm;
      Edit.setTempo(this, 0, bpm, this.score.measures[0].tempo?.unit || 'quarter',
        this.score.measures[0].tempo?.text ?? Model.tempoText(bpm));
      this.player.invalidate();
      this.scheduleRender();
    };
    this.el.tempoSlider.addEventListener('input', (e) => sync(+e.target.value));
    this.el.tempoInput.addEventListener('change', (e) => sync(+e.target.value));
  }

  buildPianoBar() {
    const c = this.el.pbControls;
    c.innerHTML = `
      <div class="pb-row"><label>Octave</label>
        <button class="mini" data-oct="-1">&minus;</button>
        <span id="pb-oct" style="font-size:11px;width:34px;text-align:center">C2–C6</span>
        <button class="mini" data-oct="1">+</button></div>
      <div class="pb-row"><label>Level</label>
        <input id="pb-vel" type="range" min="16" max="127" value="88"></div>
      <div class="pb-row">
        <button class="mini" id="pb-mode" style="width:auto;padding:0 8px">Preview</button>
        <span style="font-size:10px;color:var(--text-faint)">click keys to hear</span></div>`;
    this.piano = new PianoKeyboard(this.el.pianoKeys, {
      onNote: (midi, vel, chord) => this.onPianoNote(midi, vel, chord),
    });
    const label = c.querySelector('#pb-oct');
    const syncLabel = () => {
      label.textContent = `C${this.piano.lowOctave}–C${this.piano.lowOctave + this.piano.octaves}`;

      b.onclick = () => { this.piano.shiftOctave(+b.dataset.oct); syncLabel(); };

    const mode = c.querySelector('#pb-mode');
    mode.onclick = () => {
      this.pianoInserts = !this.pianoInserts;

  onPianoNote(midi, velocity, chord) {
    const part = this.score.parts[this.cursor.partIndex] || this.score.parts[0];
    const inst = getInstrument(part.instrumentId);
    this.player.preview(midi, { preset: part.synth || inst.synth, velocity, duration: 0.7 });
    if (this.pianoInserts || this.noteEntry) {
      const written = Model.writtenPitch(part, this.midiToPitch(midi, part));
      this.enterPitch(written, { chord, silent: true });
    }
  }

  /** Spell a MIDI number using the key in force, so entry reads correctly. */
  midiToPitch(midi, part) {
    const fifths = Model.keySigAt(this.score, this.cursor.measure).fifths;
    const pc = ((midi % 12) + 12) % 12;
    const SHARP_PC = { 0: [0, 0], 2: [1, 0], 4: [2, 0], 5: [3, 0], 7: [4, 0], 9: [5, 0], 11: [6, 0], 1: [0, 1], 3: [1, 1], 6: [3, 1], 8: [4, 1], 10: [5, 1] };
    const FLAT_PC = { 0: [0, 0], 2: [1, 0], 4: [2, 0], 5: [3, 0], 7: [4, 0], 9: [5, 0], 11: [6, 0], 1: [1, -1], 3: [2, -1], 6: [4, -1], 8: [5, -1], 10: [6, -1] };
    const [step, alter] = (fifths < 0 ? FLAT_PC : SHARP_PC)[pc];
    const natural = Theory.STEP_SEMITONES[step];
    let octave = Math.floor(midi / 12) - 1;
    if (natural + alter !== pc) octave += (natural + alter > pc) ? -1 : 1;
    return Theory.pitch(step, octave, alter);
  }

  bindPanelTabs() {
    document.querySelectorAll('.panel-tabs').forEach((tabs) => {
      tabs.querySelectorAll('.ptab').forEach((tab) => {
        tab.onclick = () => {
          tabs.querySelectorAll('.ptab').forEach((t) => t.classList.remove('active'));
          tab.classList.add('active');
          const panel = tabs.parentElement;
          panel.querySelectorAll('.panel-body').forEach((b) => b.classList.add('hidden'));
          const map = {
            parts: 'parts-panel', mixer: 'mixer-panel',
            inspector: 'inspector-panel', help: 'help-panel',
          };
          const target = document.getElementById(map[tab.dataset.tab]);
          if (target) target.classList.remove('hidden');
        };
      });
    });
    this.buildParts();
    this.buildMixer();
  }

  bindTitleFields() {
    this.el.title.addEventListener('change', () => {
      this.history.begin('Title');
      this.history.touchAll();
      this.score.title = this.el.title.value;
      this.history.commit();
      this.scheduleRender();
    });
    this.el.composer.addEventListener('change', () => {
      this.history.begin('Composer');
      this.history.touchAll();
      this.score.composer = this.el.composer.value;
      this.history.commit();
      this.scheduleRender();
    });
  }

  initTooltips() {
    const tip = this.el.tooltip;
    let timer = null;
    const show = (el) => {
      const text = el.dataset.tip;
      if (!text) return;
      const key = el.dataset.key;
      tip.innerHTML = `<span></span>${key ? `<span class="tk">${key}</span>` : ''}`;
      tip.firstChild.textContent = text;
      tip.hidden = false;
      const r = el.getBoundingClientRect();
      const t = tip.getBoundingClientRect();
      let x = r.left + r.width / 2 - t.width / 2;
      x = Math.max(6, Math.min(window.innerWidth - t.width - 6, x));
      let y = r.bottom + 7;
      if (y + t.height > window.innerHeight - 6) y = r.top - t.height - 7;
      tip.style.left = x + 'px';
      tip.style.top = y + 'px';
    };
    document.addEventListener('mouseover', (e) => {
      const el = e.target.closest && e.target.closest('[data-tip]');
      clearTimeout(timer);
      if (!el) { tip.hidden = true; return; }
      timer = setTimeout(() => show(el), 320);
    });
    document.addEventListener('mouseout', () => { clearTimeout(timer); tip.hidden = true; });
    document.addEventListener('mousedown', () => { clearTimeout(timer); tip.hidden = true; });
  }

  async initMidi() {
    this.midi = new MidiInput({
      onNoteOn: (midi, vel) => {
        this.midiHeld.add(midi);
        this.piano.light(midi, true);
        this.onPianoNote(midi, vel, this.midiHeld.size > 1);
      },
      onNoteOff: (midi) => {
        this.midiHeld.delete(midi);
        this.piano.light(midi, false);
      },
      onStatus: (s) => {
        this.midiStatus = s;
        const btn = document.querySelector('[data-act=midi]');
        if (btn) btn.classList.toggle('on', s.state === 'ready' && (s.devices || []).length > 0);
        if (s.state === 'ready') Dlg.toast(s.message, (s.devices || []).length ? 'ok' : '');
        else if (s.message) Dlg.toast(s.message, 'err');
      },
    });
  }

  /* ------------------------------------------------------------- panels */

  buildParts() {
    const p = this.el.parts;
    if (!p) return;
    p.innerHTML = '<div class="sec-title">Instruments</div>';
    this.score.parts.forEach((part, i) => {
      const row = document.createElement('div');
      row.className = 'part-row' + (this.cursor.partIndex === i ? ' sel' : '');
      const inst = getInstrument(part.instrumentId);
      row.innerHTML = `<span class="pname"></span><span class="pfam"></span>` +
        `<button class="mini" data-a="up" data-tip="Move up">&uarr;</button>` +
        `<button class="mini" data-a="del" data-tip="Remove instrument">&times;</button>`;
      row.querySelector('.pname').textContent = part.name;
      row.querySelector('.pfam').textContent = inst.family;
      row.onclick = (e) => {
        if (e.target.dataset.a) return;
        this.setCursor({ partIndex: i, staff: 0, voice: 0 });
        this.buildParts();
        if (this.viewPart !== null) { this.viewPart = i; this.render(); }
      };
      row.querySelector('[data-a=up]').onclick = (e) => {
        e.stopPropagation();
        Edit.movePart(this, i, Math.max(0, i - 1));
        this.render();
        this.buildParts();
        this.buildMixer();
      };
      row.querySelector('[data-a=del]').onclick = async (e) => {
        e.stopPropagation();
        if (this.score.parts.length <= 1) { Dlg.toast('A score needs at least one instrument', 'err'); return; }
        const ok = await Dlg.confirmDialog({
          title: 'Remove instrument',
          message: `Remove <b>${part.name}</b> and all of its music?`,
          okLabel: 'Remove', danger: true,
        });
        if (!ok) return;
        Edit.removePart(this, i);
        this.cursor.partIndex = Math.min(this.cursor.partIndex, this.score.parts.length - 1);
        this.render();
        this.buildParts();
        this.buildMixer();
      };
      p.appendChild(row);
    });
    const add = document.createElement('button');
    add.className = 'chip';
    add.style.cssText = 'width:100%;margin-top:8px;padding:7px';
    add.textContent = '+  Add instrument';
    add.onclick = () => this.act('addInstrument');
    p.appendChild(add);
  }

  buildMixer() {
    const m = this.el.mixer;
    if (!m) return;
    m.innerHTML = '<div class="sec-title">Mixer</div>';
    this.score.parts.forEach((part, i) => {
      const row = document.createElement('div');
      row.className = 'mix-row';
      row.innerHTML = `
        <div class="mix-head">
          <span class="pname"></span>
          <button class="mini mute" data-tip="Mute">M</button>
          <button class="mini solo" data-tip="Solo">S</button>
        </div>
        <div class="mix-ctl"><label>Vol</label><input type="range" class="vol" min="0" max="1" step="0.01"></div>
        <div class="mix-ctl"><label>Pan</label><input type="range" class="pan" min="-1" max="1" step="0.02"></div>`;
      row.querySelector('.pname').textContent = part.name;
      const mute = row.querySelector('.mute');
      const solo = row.querySelector('.solo');
      mute.classList.toggle('on', !!part.mute);
      solo.classList.toggle('on', !!part.solo);
      const vol = row.querySelector('.vol');
      const pan = row.querySelector('.pan');
      vol.value = part.volume;
      pan.value = part.pan || 0;
      mute.onclick = () => { part.mute = !part.mute; mute.classList.toggle('on', part.mute); this.player.applyMixer(); };
      solo.onclick = () => { part.solo = !part.solo; solo.classList.toggle('on', part.solo); this.player.applyMixer(); };
      vol.oninput = () => { part.volume = +vol.value; this.player.applyMixer(); };
      pan.oninput = () => { part.pan = +pan.value; this.player.applyMixer(); };
      m.appendChild(row);
    });
    const master = document.createElement('div');
    master.className = 'mix-row';
    master.style.borderTop = '1px solid var(--line)';
    master.innerHTML = `<div class="mix-head"><span class="pname" style="font-weight:600">Master</span></div>
      <div class="mix-ctl"><label>Vol</label><input type="range" class="mv" min="0" max="1" step="0.01" value="0.9"></div>
      <div class="mix-ctl"><label>Verb</label><input type="range" class="mr" min="0" max="0.7" step="0.01" value="0.22"></div>`;
    master.querySelector('.mv').oninput = (e) => { this.synth.init(); this.synth.setMasterVolume(+e.target.value); };
    master.querySelector('.mr').oninput = (e) => { this.synth.init(); this.synth.setReverb(+e.target.value); };
    m.appendChild(master);
  }

  buildHelpPanel() {
    const h = this.el.help;
    h.innerHTML = '';
    for (const [section, rows] of SHORTCUT_HELP) {
      const t = document.createElement('div');
      t.className = 'sec-title';
      t.textContent = section;
      const table = document.createElement('table');
      table.className = 'key-table';
      table.innerHTML = rows.map(([k, d]) =>
        `<tr><td><kbd>${k}</kbd></td><td style="color:var(--text-dim)">${d}</td></tr>`).join('');
      h.append(t, table);

  buildInspector() {
    const p = this.el.inspector;
    if (!p) return;
    const loc = this.firstSelected();
    const n = this.selection.size;
    if (!n) {
      const part = this.score.parts[this.cursor.partIndex];
      p.innerHTML = `<div class="empty-note">
        <b style="color:var(--text-dim)">Nothing selected.</b><br><br>
        Click a note to edit it, or click an empty part of a staff to select a measure.<br><br>
        Press <kbd>N</kbd> for note input, then type <kbd>A</kbd>–<kbd>G</kbd> or click the staff to write notes.
      </div>`;
      const info = document.createElement('div');
      info.className = 'insp-field';
      info.innerHTML = `<label>Cursor</label><div class="insp-value">${
        part ? part.name : '—'} · bar ${this.cursor.measure + 1} · voice ${this.cursor.voice + 1}</div>`;
      p.appendChild(info);
      return;
    }
    p.innerHTML = '';
    const field = (label, html) => {
      const d = document.createElement('div');
      d.className = 'insp-field';
      d.innerHTML = `<label>${label}</label>${html}`;
      p.appendChild(d);
      return d;
    };

    if (n > 1) {
      field('Selection', `<div class="insp-value">${n} events selected</div>`);
    }
    if (loc) {
      const ev = loc.event;
      const desc = ev.type === 'note'
        ? ev.notes.map((x) => Theory.pitchName(x.pitch, { unicode: true })).join(' + ')
        : 'Rest';
      field('Selected', `<div class="insp-value">${desc}</div>`);
      field('Position', `<div class="insp-value">${loc.part.name} · bar ${loc.measure + 1} · voice ${loc.voice + 1}</div>`);

      const durRow = field('Note value', '<div class="insp-row" id="i-dur"></div>');
      const durEl = durRow.querySelector('#i-dur');
      for (const d of DURATIONS.filter((x) => x.id !== 'breve' && x.id !== '128th')) {
        const b = document.createElement('button');
        b.className = 'chip' + (ev.duration === d.id ? ' on' : '');
        b.innerHTML = noteIcon(d.id, 0, { size: 17 });
        b.dataset.tip = d.label;
        b.onclick = () => this.act('dur:' + d.id);
        durEl.appendChild(b);
      }
      for (let dots = 1; dots <= 2; dots++) {
        const b = document.createElement('button');
        b.className = 'chip' + (ev.dots === dots ? ' on' : '');
        b.textContent = dots === 1 ? '.' : '..';
        b.onclick = () => this.act('dot:' + dots);
        durEl.appendChild(b);
      }

      const artRow = field('Articulation', '<div class="insp-row" id="i-art"></div>');
      const artEl = artRow.querySelector('#i-art');
      for (const a of ARTICULATIONS) {
        const b = document.createElement('button');
        b.className = 'chip' + ((ev.articulations || []).includes(a.id) ? ' on' : '');
        b.innerHTML = glyphIcon(a.glyph, { size: 15 });
        b.dataset.tip = a.label;
        b.onclick = () => this.act('art:' + a.id);
        artEl.appendChild(b);
      }

      const dynRow = field('Dynamic', '<div class="insp-row" id="i-dyn"></div>');
      const dynEl = dynRow.querySelector('#i-dyn');
      for (const d of DYNAMIC_MARKS.slice(0, 10)) {
        const b = document.createElement('button');
        b.className = 'chip' + (ev.dynamic === d.id ? ' on' : '');
        b.innerHTML = dynamicIcon(d.id, { size: 14 });
        b.onclick = () => this.act('dyn:' + d.id);
        dynEl.appendChild(b);
      }

      const stemRow = field('Stem', '<div class="insp-row" id="i-stem"></div>');
      const stemEl = stemRow.querySelector('#i-stem');
      for (const [id, label] of [['auto', 'Auto'], ['up', 'Up'], ['down', 'Down']]) {
        const b = document.createElement('button');
        b.className = 'chip' + ((ev.stemDir || 'auto') === id ? ' on' : '');
        b.textContent = label;
        b.onclick = () => { Edit.setStemDirection(this, this.selectedIds, id); this.render(); };
        stemEl.appendChild(b);
      }
      if (ev.type === 'note') {
        const t = field('Lyrics', '<input type="text" id="i-lyric" placeholder="syllable">');
        const input = t.querySelector('#i-lyric');
        input.value = (ev.lyrics && ev.lyrics[0] && ev.lyrics[0].text) || '';
        input.onchange = () => { Edit.setLyric(this, ev.id, 0, input.value.trim()); this.render(); };
        const c = field('Chord symbol', '<input type="text" id="i-chord" placeholder="Cmaj7">');
        const cin = c.querySelector('#i-chord');
        cin.value = ev.chordSymbol || '';
        cin.onchange = () => { Edit.setChordSymbol(this, ev.id, cin.value.trim()); this.render(); };
        const fb = field('Figured bass', '<input type="text" id="i-fig" placeholder="6 4">');
        const fin = fb.querySelector('#i-fig');
        fin.value = (ev.figures || []).join(' ');
        fin.onchange = () => { Edit.setFigures(this, ev.id, Edit.parseFigures(fin.value)); this.render(); };
        if ((loc.part.staves || 1) > 1) {
          const cs = field('Staff', '<div class="insp-row" id="i-cross"></div>');
          const row = cs.querySelector('#i-cross');
          const home = loc.voice % 2 === 0 ? 0 : 1;
          for (let st = 0; st < loc.part.staves; st++) {
            const b = document.createElement('button');
            const cur = ev.staff === null || ev.staff === undefined ? home : ev.staff;
            b.className = 'chip' + (cur === st ? ' on' : '');
            b.textContent = st === 0 ? 'Upper' : 'Lower';
            b.onclick = () => { Edit.setEventStaff(this, this.selectedIds, st); this.render(); };
            row.appendChild(b);
          }
        }
      }
    }
    if (this.measureSel) {
      const b = document.createElement('button');
      b.className = 'btn';
      b.style.cssText = 'width:100%;margin-top:6px';
      b.textContent = `Measures ${this.measureSel.from + 1}–${this.measureSel.to + 1}`;
      b.disabled = true;
      p.appendChild(b);
    }
  }

  refreshChrome() {
    if (this.undoBtn) {
      this.undoBtn.disabled = !this.history.canUndo;
      this.redoBtn.disabled = !this.history.canRedo;
      this.undoBtn.dataset.tip = this.history.canUndo ? 'Undo ' + this.history.undoLabel : 'Undo';
      this.redoBtn.dataset.tip = this.history.canRedo ? 'Redo ' + this.history.redoLabel : 'Redo';
    }
    const set = (act, on) => {
      const b = document.querySelector(`[data-act="${act}"]`);
      if (b) b.classList.toggle('on', !!on);
    };
    set('noteEntry', this.noteEntry);
    set('dur:' + this.duration, true);
    for (const d of DURATIONS) if (d.id !== this.duration) set('dur:' + d.id, false);
    set('dot:1', this.dots === 1);
    set('dot:2', this.dots === 2);
    set('concertPitch', this.score.concertPitch);
    set('multiBarRests', !!this.score.multiBarRests || this.viewPart !== null);
    set('partView', this.viewPart !== null);
    set('metronome', this.player.metronome);
    set('countIn', this.player.countIn);
    set('loop', !!this.player.loop);
    const pv = document.querySelector('[data-act=partView] .lbl');
    if (pv) pv.textContent = this.viewPart === null ? 'Score' : (this.score.parts[this.viewPart]?.abbrev || 'Part');
  }

  setHint(custom) {
    if (custom) { this.el.hint.innerHTML = custom; return; }
    if (this.noteEntry) {
      const part = this.score.parts[this.cursor.partIndex];
      this.el.hint.innerHTML =
        `<b>Note input</b> — type <kbd>A</kbd>–<kbd>G</kbd>, click the staff, or play your MIDI keyboard. ` +
        `<kbd>1</kbd>–<kbd>7</kbd> note value · <kbd>0</kbd> rest · <kbd>Esc</kbd> to stop. ` +
        `Writing into <b>${part ? part.name : ''}</b>, bar ${this.cursor.measure + 1}, voice ${this.cursor.voice + 1}.`;
      return;
    }
    if (this.selection.size) {
      this.el.hint.innerHTML =
        `<b>${this.selection.size} selected</b> — change the note value with <kbd>1</kbd>–<kbd>7</kbd>, ` +
        `move pitch with <kbd>&uarr;</kbd><kbd>&darr;</kbd>, add marks from the palette above, <kbd>Delete</kbd> to clear.`;
      return;
    }
    this.el.hint.innerHTML =
      `Press <kbd>N</kbd> to start writing notes · click a note to select it · <kbd>Space</kbd> to play · <kbd>?</kbd> for all shortcuts`;
  }

  /* ==================================================================== */
  /*  Commands                                                             */
  /* ==================================================================== */

  act(name) {
    const [cmd, arg] = String(name).split(':');
    const ids = this.selectedIds;
    const needs = () => {
      if (ids.length) return true;
      Dlg.toast('Select a note first', 'err');
      return false;
    };

    switch (cmd) {
      /* --- note values ------------------------------------------------- */
      case 'dur': {
        this.duration = arg;
        if (ids.length) { Edit.setDuration(this, ids, arg, this.dots); this.render(); }
        this.refreshChrome();
        this.setHint();
        return;
      }
      case 'dot': {
        const d = +arg;
        this.dots = this.dots === d ? 0 : d;
        if (ids.length) { Edit.setDuration(this, ids, this.duration, this.dots); this.render(); }
        this.refreshChrome();
        return;
      }
      case 'rest': {
        if (this.noteEntry) {
          this.setCursor(Edit.enterRest(this, this.cursor, { duration: this.duration, dots: this.dots }), { scroll: true });
          this.render();
        } else if (ids.length) {
          Edit.deleteTargets(this, ids, { toRest: true });
          this.render();
        } else {
          this.setNoteEntry(true);
        }
        return;
      }

      /* --- pitch ------------------------------------------------------- */
      case 'acc': {
        if (!needs()) return;
        Edit.setAccidental(this, ids, +arg);
        this.render();
        return;
      }
      case 'alter': {
        if (!needs()) return;
        Edit.alterTargets(this, ids, +arg);
        this.render();
        return;
      }
      case 'respell': {
        if (!needs()) return;
        Edit.respell(this, ids);
        this.render();
        return;
      }
      case 'octave': {
        if (ids.length) {
          Edit.transposeTargets(this, ids, { octaves: arg === 'up' ? 1 : -1 });
          this.render();
        } else if (this.measureSel) {
          this.addSpannerOverSelection(arg === 'up' ? 'octave-up' : 'octave-down');
        } else {
          Dlg.toast('Select notes to move by an octave', 'err');
        }
        return;
      }

      /* --- marks ------------------------------------------------------- */
      case 'art': { if (!needs()) return; Edit.toggleArticulation(this, ids, arg); this.render(); return; }
      case 'orn': { if (!needs()) return; Edit.toggleOrnament(this, ids, arg); this.render(); return; }
      case 'dyn': { if (!needs()) return; Edit.setDynamic(this, ids, arg); this.render(); return; }
      case 'tremolo': { if (!needs()) return; Edit.setTremolo(this, ids, +arg); this.render(); return; }
      case 'arpeggio': { if (!needs()) return; Edit.toggleArpeggio(this, ids); this.render(); return; }
      case 'tie': { if (!needs()) return; Edit.toggleTie(this, ids); this.render(); return; }
      case 'grace': { if (!needs()) return; Edit.toggleGrace(this, ids); this.render(); return; }
      case 'slur': { this.addSpannerOverSelection('slur'); return; }
      case 'hairpin': { this.addSpannerOverSelection(arg === 'dim' ? 'dim' : 'cresc'); return; }
      case 'pedal': { this.addSpannerOverSelection('pedal'); return; }
      case 'tuplet': {
        if (!needs()) return;
        const actual = +arg || 3;
        const normal = actual === 3 ? 2 : actual === 5 ? 4 : actual === 6 ? 4 : actual === 7 ? 4 : 8;
        Edit.makeTuplet(this, ids, actual, normal);
        this.render();
        return;
      }
      case 'crossStaff': {
        if (!needs()) return;
        const ok = Edit.moveAcrossStaff(this, ids, arg === 'up' ? -1 : 1);
        if (!ok) { Dlg.toast('Cross-staff needs an instrument with two staves', 'err'); return; }
        this.render();
        return;
      }
      case 'figuredBass': { this.editFigures(); return; }
      case 'voice': {
        const part = this.score.parts[this.cursor.partIndex];
        const next = (this.cursor.voice + 1) % 4;
        Edit.addVoice(this, this.cursor.partIndex, this.cursor.measure);
        this.setCursor({ voice: next, staff: this.staffForVoice(part, next) });
        this.render();
        Dlg.toast(`Voice ${next + 1}`);
        return;
      }

      /* --- text -------------------------------------------------------- */
      case 'text': { this.addTextTo(arg); return; }
      case 'lyric': { this.editLyric(); return; }
      case 'chordSymbol': { this.editChordSymbol(); return; }
      case 'roman': { this.editRoman(); return; }
      case 'fingering': { this.editFingering(); return; }
      case 'rehearsal': { this.editRehearsal(); return; }
      case 'tempoMark': { this.openTempo(this.cursor.measure); return; }

      /* --- structure --------------------------------------------------- */
      case 'insertMeasure': {
        const at = this.measureSel ? this.measureSel.from : this.cursor.measure;
        Edit.insertMeasures(this, at, 1);
        this.render();
        return;
      }
      case 'appendMeasure': { Edit.appendMeasure(this); this.render(); return; }
      case 'deleteMeasure': {
        const from = this.measureSel ? this.measureSel.from : this.cursor.measure;
        const to = this.measureSel ? this.measureSel.to : this.cursor.measure;
        if (!Edit.removeMeasures(this, from, to - from + 1)) {
          Dlg.toast('A score needs at least one measure', 'err');
          return;
        }
        this.measureSel = null;
        this.setCursor({ measure: Math.min(from, this.score.measures.length - 1), tick: 0 });
        this.render();
        return;
      }
      case 'timeSig': { this.openTimeSignature(this.cursor.measure); return; }
      case 'keySig': { this.openKeySignature(this.cursor.measure); return; }
      case 'clef': { this.openClef(this.cursor.measure, this.cursor.partIndex, this.cursor.staff); return; }
      case 'barline': { this.openBarline(); return; }
      case 'systemBreak': {
        Edit.toggleSystemBreak(this, this.cursor.measure);
        this.render();
        return;
      }

      /* --- clipboard and history --------------------------------------- */
      case 'undo': {
        const label = this.history.undo();
        if (label) { this.selection.clear(); this.render(); Dlg.toast('Undo ' + label); }
        return;
      }
      case 'redo': {
        const label = this.history.redo();
        if (label) { this.selection.clear(); this.render(); Dlg.toast('Redo ' + label); }
        return;
      }
      case 'copy': {
        if (this.measureSel) {
          this.clipboard = Edit.copyRange(this.score, this.measureSel.partIndex, this.measureSel.from, this.measureSel.to);
          Dlg.toast(`Copied ${this.measureSel.to - this.measureSel.from + 1} measure(s)`);
        } else if (ids.length) {
          this.clipboard = Edit.copyEvents(this.score, ids);
          Dlg.toast(`Copied ${ids.length} event(s)`);
        }
        return;
      }
      case 'cut': { this.act('copy'); if (ids.length) { Edit.deleteTargets(this, ids); this.render(); } return; }
      case 'paste': {
        if (!this.clipboard) { Dlg.toast('Nothing to paste', 'err'); return; }
        this.setCursor(Edit.pasteClip(this, this.clipboard, this.cursor));
        this.render();
        return;
      }
      case 'delete': {
        if (ids.length) { Edit.deleteTargets(this, ids); this.selection.clear(); this.render(); }
        return;
      }
      case 'selectAll': {
        this.selectMeasures(this.cursor.partIndex, 0, this.score.measures.length - 1);
        return;
      }

      /* --- transport --------------------------------------------------- */
      case 'playPause': { this.playPause(); return; }
      case 'playFromSelection': { this.playPause({ fromSelection: true }); return; }
      case 'stop': { this.player.stop(); return; }
      case 'rewind': { this.player.stop(); this.gotoMeasure(0); return; }
      case 'metronome': {
        this.player.metronome = !this.player.metronome;
        this.player.invalidate();
        if (this.player.state === 'playing') { const m = this.player.measureAt(this.player.cursor); this.player.stop(); if (m) this.playFrom(m.measure); }
        this.refreshChrome();
        Dlg.toast(this.player.metronome ? 'Metronome on' : 'Metronome off');
        return;
      }
      case 'countIn': {
        this.player.countIn = !this.player.countIn;
        this.refreshChrome();
        Dlg.toast(this.player.countIn ? 'Count-in on' : 'Count-in off');
        return;
      }
      case 'loop': {
        if (this.player.loop) {
          this.player.loop = null;
          Dlg.toast('Loop off');
        } else if (this.measureSel) {
          this.player.loop = { fromMeasure: this.measureSel.from, toMeasure: this.measureSel.to };
          Dlg.toast(`Looping bars ${this.measureSel.from + 1}–${this.measureSel.to + 1}`);
        } else {
          Dlg.toast('Select measures to loop first', 'err');
          return;
        }
        this.refreshChrome();
        return;
      }
      case 'togglePiano': {
        this.el.pianoBar.classList.toggle('collapsed');
        this.refreshChrome();
        return;
      }
      case 'midi': { this.toggleMidi(); return; }

      /* --- view -------------------------------------------------------- */
      case 'noteEntry': { this.setNoteEntry(!this.noteEntry); return; }
      case 'concertPitch': {
        this.score.concertPitch = !this.score.concertPitch;
        this.render();
        Dlg.toast(this.score.concertPitch ? 'Concert pitch' : 'Written (transposed) pitch');
        return;
      }
      case 'partView': { this.togglePartView(); return; }
      case 'multiBarRests': {
        this.score.multiBarRests = !this.score.multiBarRests;
        this.render();
        Dlg.toast(this.score.multiBarRests
          ? 'Multi-bar rests on' + (this.viewPart === null ? '' : ' (always on in parts)')
          : 'Multi-bar rests off' + (this.viewPart === null ? '' : ' \u2014 parts still use them'));
        return;
      }
      case 'addInstrument': {
        Dlg.instrumentDialog((id) => {
          const at = Edit.addPart(this, id);
          this.cursor.partIndex = at;
          this.render();
          this.buildParts();
          this.buildMixer();
          Dlg.toast(`${getInstrument(id).name} added`);
        });
        return;
      }
      case 'zoomIn': { this.zoom(1); return; }
      case 'zoomOut': { this.zoom(-1); return; }

      /* --- files ------------------------------------------------------- */
      case 'new': { this.newScore(); return; }
      case 'open': { this.openFile(); return; }
      case 'save': { Files.saveScoreFile(this.score); this.lastSaved = Date.now(); Dlg.toast('Saved'); return; }
      case 'exportMenu': { this.openExport(); return; }
      case 'print': { window.print(); return; }
      case 'setup': {
        Dlg.scoreSetupDialog(this.score, (props) => {
          this.history.begin('Score setup');
          this.history.touchAll();
          if (props.spatium !== undefined && props.spatium !== this.score.spatium) {
            this.score.autoSize = false;
          }
          Object.assign(this.score, props);
          this.history.commit();
          this.el.title.value = this.score.title;
          this.el.composer.value = this.score.composer;
          this.render();
        });
        return;
      }
      case 'help': { this.showShortcuts(); return; }
      default:
        return;
    }
  }

  /* --------------------------------------------------------- note entry */

  setNoteEntry(on) {
    this.noteEntry = on;
    if (on) {
      this.synth.init();
      const loc = this.firstSelected();
      if (loc) {
        this.cursor = {
          partIndex: loc.partIndex, measure: loc.measure, voice: loc.voice,
          staff: this.staffForVoice(loc.part, loc.voice),
          tick: Model.tickAt(loc.part.measures[loc.measure].voices[loc.voice], loc.index),
        };
      }
      this.clearSelection();
    }
    this.paintCursor();
    this.refreshChrome();
    this.setHint();
  }

  /** Enter a pitch from a letter key, keeping close to the previous note. */
  enterLetter(letter, { chord = false } = {}) {
    const step = Theory.STEP_NAMES.indexOf(letter.toUpperCase());
    if (step < 0) return;
    /* Outside note input, a letter retunes the selected note to the nearest
     * pitch of that name — the behaviour notation software shares. */
    if (!this.noteEntry && this.selection.size) {
      this.retuneSelection(step, { chord });
      return;
    }
    if (!this.noteEntry) this.setNoteEntry(true);
    const part = this.score.parts[this.cursor.partIndex];
    const clef = Model.clefAt(this.score, part, this.cursor.measure, this.cursor.staff);
    /* Pick the octave nearest the last note written, as notation software does. */
    let octave = this.lastOctave ?? Theory.fromDiatonic(Theory.diatonicAtPos(4, clef)).octave;
    const refDia = this.lastDia ?? Theory.diatonicAtPos(4, clef);
    let best = null;
    for (let o = octave - 2; o <= octave + 2; o++) {
      const dia = o * 7 + step;
      if (best === null || Math.abs(dia - refDia) < Math.abs(best - refDia)) best = dia;
    }
    const p = Theory.fromDiatonic(best);
    const fifths = Model.writtenFifths(this.score, part, this.cursor.measure);
    /* An accidental earlier in the bar still applies, so typing F after an
     * F-sharp gives another F-sharp — the note a reader would play. */
    const inForce = Model.alterInForce(
      part, this.cursor.measure, this.cursor.staff, this.cursor.tick, p.step, p.octave,
    );
    const alter = inForce === null ? Theory.keyAlterations(fifths)[step] : inForce;
    this.enterPitch(Theory.pitch(p.step, p.octave, alter), { chord });
  }

  enterPitch(p, { chord = false, silent = false } = {}) {
    if (!this.noteEntry) this.setNoteEntry(true);
    const part = this.score.parts[this.cursor.partIndex];
    if (!part) return;
    const before = this.cursor;
    const next = Edit.enterNote(this, this.cursor, p, {
      chord, duration: this.duration, dots: this.dots,
    });
    this.lastDia = Theory.diatonic(p);
    this.lastOctave = p.octave;
    this.setCursor(next, { scroll: true });
    this.scheduleRender();
    if (!silent) {
      const inst = getInstrument(part.instrumentId);
      this.player.preview(Theory.toMidi(Model.soundingPitch(part, p)), {
        preset: part.synth || inst.synth, velocity: 84, duration: 0.5,
      });
    }
    /* Keep the new note selected so marks can be applied straight away. */
    const voice = Model.getVoice(this.score, before.partIndex, before.measure, before.voice);
    const idx = Model.indexAtTick(voice, before.tick);
    if (idx >= 0) { this.selection.clear(); this.selection.add(voice[idx].id); this.paintSelection(); }
  }

  /** Move every selected note to the nearest pitch with the given letter. */
  retuneSelection(step, { chord = false } = {}) {
    const ids = this.selectedIds;
    this.history.begin(chord ? 'Add note to chord' : 'Change pitch');
    for (const id of ids) {
      const loc = Model.locateEvent(this.score, id);
      if (!loc || loc.event.type !== 'note') continue;
      this.history.touch(loc.partIndex, loc.measure);
      const fifths = Model.writtenFifths(this.score, loc.part, loc.measure);
      const alter = Theory.keyAlterations(fifths)[step];
      const ref = Theory.diatonic(loc.event.notes[0].pitch);
      let best = null;
      for (let o = -1; o <= 9; o++) {
        const dia = o * 7 + step;
        if (best === null || Math.abs(dia - ref) < Math.abs(best - ref)) best = dia;
      }
      const base = Theory.fromDiatonic(best);
      const p = Theory.pitch(base.step, base.octave, alter);
      if (chord) {
        if (!loc.event.notes.some((n) => Theory.toMidi(n.pitch) === Theory.toMidi(p))) {
          loc.event.notes.push({ pitch: p, tie: null, accidental: 'auto', head: 'normal', parenthesized: false });
          loc.event.notes.sort((x, y) => Theory.toMidi(x.pitch) - Theory.toMidi(y.pitch));
        }
      } else {
        loc.event.notes = [{ pitch: p, tie: null, accidental: 'auto', head: 'normal', parenthesized: false }];
      }
    }
    this.history.commit();
    this.render();
    const loc = this.firstSelected();
    if (loc) this.previewEvent(loc);
  }

  stepPitch(dir) {
    const ids = this.selectedIds;
    if (ids.length) {
      Edit.transposeTargets(this, ids, { steps: dir });
      this.render();
      const loc = this.firstSelected();
      if (loc) this.previewEvent(loc);
      return;
    }
    /* With nothing selected, move the entry cursor's staff position. */
    this.moveStaff(dir > 0 ? -1 : 1);
  }

  navigate(dir, { extend = false } = {}) {
    const loc = this.firstSelected();
    if (this.noteEntry && !loc) {
      const grid = durationTicks(this.duration, this.dots);
      this.setCursor(dir > 0
        ? Edit.advanceCursor(this, this.cursor, grid)
        : Edit.retreatCursor(this, this.cursor, grid), { scroll: true });
      return;
    }
    if (!loc) {
      const voice = Model.getVoice(this.score, this.cursor.partIndex, this.cursor.measure, this.cursor.voice);
      if (voice && voice.length) this.select(voice[0].id);
      return;
    }
    const voice = loc.part.measures[loc.measure].voices[loc.voice];
    let idx = loc.index + dir;
    let measure = loc.measure;
    if (idx < 0) {
      if (measure === 0) return;
      measure--;
      const prev = loc.part.measures[measure].voices[loc.voice] || [];
      idx = prev.length - 1;
    } else if (idx >= voice.length) {
      if (measure + 1 >= loc.part.measures.length) return;
      measure++;
      idx = 0;
    }
    const target = loc.part.measures[measure].voices[loc.voice][idx];
    if (!target) return;
    if (extend) this.select(target.id, { add: true });
    else {
      this.select(target.id);
      this.anchorEvent = target.id;
    }
    this.setCursor({
      measure,
      tick: Model.tickAt(loc.part.measures[measure].voices[loc.voice], idx),
    }, { scroll: true });
  }

  navigateMeasure(dir) {
    const m = Math.max(0, Math.min(this.score.measures.length - 1, this.cursor.measure + dir));
    this.gotoMeasure(m);
  }

  gotoMeasure(m) {
    this.setCursor({ measure: m, tick: 0 }, { scroll: true });
    this.selectMeasures(this.cursor.partIndex, m, m);
  }

  moveStaff(dir) {
    const staves = [];
    this.score.parts.forEach((part, pi) => {
      for (let s = 0; s < (part.staves || 1); s++) staves.push({ pi, s });
    });
    const cur = staves.findIndex((x) => x.pi === this.cursor.partIndex && x.s === this.cursor.staff);
    const next = staves[Math.max(0, Math.min(staves.length - 1, cur + dir))];
    if (!next) return;
    this.setCursor({
      partIndex: next.pi, staff: next.s, voice: this.voiceForStaff(next.pi, next.s),
    }, { scroll: true });
    this.buildParts();
    this.setHint();
  }

  addSpannerOverSelection(type) {
    const ids = this.selectedIds;
    if (ids.length < 2) { Dlg.toast('Select at least two notes', 'err'); return; }
    const locs = ids.map((id) => Model.locateEvent(this.score, id)).filter(Boolean);
    locs.sort((a, b) => (a.measure - b.measure) || (a.index - b.index));
    Edit.addSpanner(this, type, locs[0].event.id, locs[locs.length - 1].event.id, {
      label: { slur: 'Slur', cresc: 'Crescendo', dim: 'Diminuendo', pedal: 'Pedal', 'octave-up': '8va', 'octave-down': '8vb' }[type],
    });
    this.render();
  }

  /* -------------------------------------------------------------- text */

  async addTextTo(style) {
    const ids = this.selectedIds;
    if (!ids.length) { Dlg.toast('Select a note first', 'err'); return; }
    const value = await Dlg.promptDialog({
      title: style === 'technique' ? 'Technique text' : 'Expression text',
      label: style === 'technique' ? 'e.g. pizz., con sordino, arco' : 'e.g. dolce, espressivo, rit.',
      placeholder: style === 'technique' ? 'pizz.' : 'dolce',
    });
    if (!value) return;
    Edit.addText(this, [ids[0]], value, style, style === 'technique' ? 'above' : 'below');
    this.render();
  }

  async editLyric() {
    const loc = this.firstSelected();
    if (!loc) { Dlg.toast('Select a note first', 'err'); return; }
    const value = await Dlg.promptDialog({
      title: 'Lyrics', label: 'Syllable for this note',
      value: (loc.event.lyrics && loc.event.lyrics[0] && loc.event.lyrics[0].text) || '',
    });
    if (value === null) return;
    Edit.setLyric(this, loc.event.id, 0, value.trim());
    this.render();
    this.navigate(1);
  }

  async editChordSymbol() {
    const loc = this.firstSelected();
    if (!loc) { Dlg.toast('Select a note first', 'err'); return; }
    const guess = loc.event.type === 'note'
      ? Theory.detectChord(loc.event.notes.map((n) => n.pitch)) : null;
    const value = await Dlg.promptDialog({
      title: 'Chord symbol', label: 'Symbol',
      value: loc.event.chordSymbol || guess || '', placeholder: 'Cmaj7',
    });
    if (value === null) return;
    Edit.setChordSymbol(this, loc.event.id, value.trim());
    this.render();
  }

  async editFigures() {
    const loc = this.firstSelected();
    if (!loc) { Dlg.toast('Select a note first', 'err'); return; }
    const value = await Dlg.promptDialog({
      title: 'Figured bass',
      label: 'Figures, top to bottom \u2014 e.g. "6", "6 4", "#6 5", "7 b5"',
      value: (loc.event.figures || []).join(' '),
      placeholder: '6 4',
    });
    if (value === null) return;
    Edit.setFigures(this, loc.event.id, Edit.parseFigures(value));
    this.render();
    this.navigate(1);
  }

  async editRoman() {
    const loc = this.firstSelected();
    if (!loc) { Dlg.toast('Select a note first', 'err'); return; }
    const value = await Dlg.promptDialog({
      title: 'Roman numeral', label: 'Analysis', value: loc.event.roman || '', placeholder: 'V7/V',
    });
    if (value === null) return;
    Edit.setRoman(this, loc.event.id, value.trim());
    this.render();
  }

  async editFingering() {
    const loc = this.firstSelected();
    if (!loc || loc.event.type !== 'note') { Dlg.toast('Select a note first', 'err'); return; }
    const value = await Dlg.promptDialog({ title: 'Fingering', label: 'Finger', placeholder: '3' });
    if (value === null) return;
    Edit.setFingering(this, loc.event.id, 0, value.trim());
    this.render();
  }

  async editRehearsal() {
    const m = this.cursor.measure;
    const suggested = String.fromCharCode(65 + Math.min(25, this.score.measures.filter((x) => x.rehearsal).length));
    const value = await Dlg.promptDialog({
      title: 'Rehearsal mark', label: `Mark for bar ${m + 1}`,
      value: this.score.measures[m].rehearsal || suggested,
    });
    if (value === null) return;
    Edit.setRehearsalMark(this, m, value.trim());
    this.render();
  }

  /* ---------------------------------------------------- structure dialogs */

  openTimeSignature(measure) {
    Dlg.timeSignatureDialog(Model.timeSigAt(this.score, measure), (ts) => {
      Edit.setTimeSignature(this, measure, ts);
      this.render();
    });
  }

  openKeySignature(measure) {
    Dlg.keySignatureDialog(Model.keySigAt(this.score, measure), (fifths, mode) => {
      Edit.setKeySignature(this, measure, fifths, mode);
      this.render();
    });
  }

  openClef(measure, partIndex, staff) {
    const current = Model.clefAt(this.score, this.score.parts[partIndex], measure, staff);
    Dlg.clefDialog(current, (id) => {
      Edit.setClef(this, partIndex, measure, staff, id);
      this.render();
    });
  }

  openTempo(measure) {
    Dlg.tempoDialog(Model.tempoAt(this.score, measure), (t) => {
      Edit.setTempo(this, measure, t.bpm, t.unit, t.text);
      if (measure === 0) {
        this.el.tempoSlider.value = t.bpm;
        this.el.tempoInput.value = t.bpm;
      }
      this.player.invalidate();
      this.render();
    });
  }

  openBarline() {
    const m = this.measureSel ? this.measureSel.to : this.cursor.measure;
    Dlg.modal({
      title: `Barline — end of bar ${m + 1}`,
      build: (body) => {
        const styles = [
          ['normal', 'Single'], ['double', 'Double'], ['final', 'Final'],
          ['repeat-start', 'Start repeat'], ['repeat-end', 'End repeat'],
          ['repeat-both', 'Both repeats'], ['dashed', 'Dashed'],
        ];
        body.innerHTML = '<div class="insp-row"></div>';
        const row = body.querySelector('.insp-row');
        for (const [id, label] of styles) {
          const b = document.createElement('button');
          b.className = 'chip' + (this.score.measures[m].barline === id ? ' on' : '');
          b.textContent = label;
          b.onclick = () => { Edit.setBarline(this, m, id); this.render(); Dlg.closeModal(); };
          row.appendChild(b);
        }
      },
    });
  }

  /* --------------------------------------------------------- transport */

const TPW = TPQ * 4;

  { id: 'whole', ticks: TPW, beams: 0, stem: false, label: 'Whole' },
  { id: 'half', ticks: TPW / 2, beams: 0, stem: true, label: 'Half' },
  { id: 'quarter', ticks: TPW / 4, beams: 0, stem: true, label: 'Quarter' },
  { id: 'eighth', ticks: TPW / 8, beams: 1, stem: true, label: 'Eighth' },
  { id: '16th', ticks: TPW / 16, beams: 2, stem: true, label: 'Sixteenth' },
  { id: '32nd', ticks: TPW / 32, beams: 3, stem: true, label: 'Thirty-second' },
  { id: '64th', ticks: TPW / 64, beams: 4, stem: true, label: 'Sixty-fourth' },

  return Math.round(t);

  for (const d of DURATIONS) {

      if (Math.round(d.ticks * (2 - Math.pow(2, -dots))) === ticks) {

    if (current.length > 1) result.push(current);
    current = [];

    loc.event.lyrics = loc.event.lyrics.filter((l) => l.verse !== verse);

    existing.syllabic = syllabic;

  const { score, history } = app;
  const loc = locateEvent(score, eventId);
  if (!loc) return;
  history.begin('Chord symbol');
  history.touch(loc.partIndex, loc.measure);
  loc.event.chordSymbol = symbol || null;
  history.commit();
}

function setRoman(app, eventId, text) {
  const { score, history } = app;
  const loc = locateEvent(score, eventId);
  if (!loc) return;
  history.begin('Roman numeral');
  history.touch(loc.partIndex, loc.measure);
  loc.event.roman = text || null;

function setFingering(app, eventId, noteIndex, text) {
  const { score, history } = app;
  const loc = locateEvent(score, eventId);
  if (!loc) return;
  history.begin('Fingering');
  history.touch(loc.partIndex, loc.measure);

  if (text) loc.event.fingerings.push({ note: noteIndex, text });

function toggleGrace(app, targets, type = 'acciaccatura') {
  const { score, history } = app;
  history.begin('Grace note');
  const touched = new Set();
  for (const t of targets) {
    const loc = locateEvent(score, t);
    if (!loc || loc.event.type !== 'note') continue;
    history.touch(loc.partIndex, loc.measure);
    touched.add(loc.partIndex + ':' + loc.measure);
    if (loc.event.grace) {
      loc.event.grace = null;
    } else {
      loc.event.grace = { type, slash: type === 'acciaccatura' };
      loc.event.duration = loc.event.duration === 'quarter' ? 'eighth' : loc.event.duration;
    }
  }
  for (const key of touched) {
    const [pi, m] = key.split(':').map(Number);
    normalizeMeasure(score, score.parts[pi], m);
  }
  history.commit();
}

/* ------------------------------------------------------------------- ties */

function toggleTie(app, targets) {
  const { score, history } = app;
  history.begin('Tie');
  for (const t of targets) {
    const loc = locateEvent(score, t);
    if (!loc || loc.event.type !== 'note') continue;
    history.touch(loc.partIndex, loc.measure);
    const tied = loc.event.notes.some((n) => n.tie === 'start' || n.tie === 'both');
    if (tied) {
      clearTieForward(app, loc);
    } else {
      applyTieForward(app, loc.part, loc.measure, loc.voice, loc.event);
      history.touch(loc.partIndex, Math.min(loc.measure + 1, loc.part.measures.length - 1));
    }
  }
  history.commit();
}

function nextEvent(part, measure, voiceIdx, index) {
  const voice = part.measures[measure].voices[voiceIdx] || [];
  for (let i = index + 1; i < voice.length; i++) if (!voice[i].grace) return { event: voice[i], measure };
  for (let m = measure + 1; m < part.measures.length; m++) {
    const v = part.measures[m].voices[voiceIdx] || [];
    for (const ev of v) if (!ev.grace) return { event: ev, measure: m };
    break;
  }
  return null;
}

function applyTieForward(app, part, measure, voiceIdx, ev) {
  const voice = part.measures[measure].voices[voiceIdx] || [];
  const idx = voice.indexOf(ev);
  const nxt = nextEvent(part, measure, voiceIdx, idx);
  if (!nxt || nxt.event.type !== 'note') return;
  for (const n of ev.notes) {
    const match = nxt.event.notes.find((x) => toMidi(x.pitch) === toMidi(n.pitch));
    if (match) {
      n.tie = n.tie === 'stop' ? 'both' : 'start';
      match.tie = match.tie === 'start' ? 'both' : 'stop';
    }
  }
}

function clearTieForward(app, loc) {
  const nxt = nextEvent(loc.part, loc.measure, loc.voice, loc.index);
  for (const n of loc.event.notes) n.tie = n.tie === 'both' ? 'stop' : n.tie === 'start' ? null : n.tie;
  if (nxt && nxt.event.type === 'note') {
    for (const n of nxt.event.notes) n.tie = n.tie === 'both' ? 'start' : n.tie === 'stop' ? null : n.tie;
  }
}

/* --------------------------------------------------------------- spanners */

function addSpanner(app, type, fromId, toId, opts = {}) {
  const { score, history } = app;
  if (!fromId || !toId) return null;
  const a = locateEvent(score, fromId);
  const b = locateEvent(score, toId);
  if (!a || !b || a.partIndex !== b.partIndex) return null;
  history.begin(opts.label || 'Add line');
  history.touchGlobal();
  const existing = score.spanners.find((s) => s.type === type && s.fromId === fromId && s.toId === toId);
  if (existing) {
    score.spanners = score.spanners.filter((s) => s !== existing);
  } else {
    score.spanners.push({
      id: newId('s'), type, partId: a.part.id, fromId, toId,
      placement: opts.placement || (type === 'slur' ? 'auto' : 'below'), ...opts,
    });
  }
  history.commit();
  return type;
}

function removeSpanners(app, ids) {
  const { score, history } = app;
  history.begin('Remove line');
  history.touchGlobal();
  score.spanners = score.spanners.filter((s) => !ids.includes(s.id));
  history.commit();
}

/* --------------------------------------------------------------- tuplets */

/**
 * Turn the span starting at `targets[0]` into a tuplet.  The tuplet occupies
 * the same total time; `actual` notes now fit where `normal` used to.
 */
function makeTuplet(app, targets, actual, normal) {
  const { score, history } = app;
  if (!targets.length) return;
  const loc = locateEvent(score, targets[0]);
  if (!loc) return;
  history.begin(`${actual}:${normal} tuplet`);
  history.touch(loc.partIndex, loc.measure);
  const ts = timeSigAt(score, loc.measure);
  const voice = loc.part.measures[loc.measure].voices[loc.voice];
  const start = tickAt(voice, loc.index);
  const base = loc.event;
  const span = eventTicks(base);
  /* Each member must last span/actual, so its written value is span/normal. */
  const member = durationForTicks(Math.round(span / normal));
  if (!member) { history.cancel(); return; }
  const tupletId = newId('t');
  const tuplet = { id: tupletId, actual, normal, bracket: true, number: true };
  const events = [];
  for (let i = 0; i < actual; i++) {
    const e = i === 0 && base.type === 'note' ? cloneEvent(base) : makeRest(member.id);
    e.tuplet = { ...tuplet };
    e.duration = member.id;
    e.dots = member.dots;
    e.fullMeasure = false;
    events.push(e);
  }
  spliceSpan(voice, ts, start, span, events);
  normalizeMeasure(score, loc.part, loc.measure);
  history.commit();
}

function removeTuplet(app, targets) {
  const { score, history } = app;
  const loc = targets.length ? locateEvent(score, targets[0]) : null;
  if (!loc || !loc.event.tuplet) return;
  history.begin('Remove tuplet');
  history.touch(loc.partIndex, loc.measure);
  const tid = loc.event.tuplet.id;
  const voice = loc.part.measures[loc.measure].voices[loc.voice];
  const keep = voice.filter((e) => !e.tuplet || e.tuplet.id !== tid);
  const first = voice.find((e) => e.tuplet && e.tuplet.id === tid);
  if (first) {
    first.tuplet = null;
    const at = voice.indexOf(first);
    keep.splice(Math.min(at, keep.length), 0, first);
  }
  voice.length = 0;
  voice.push(...keep);
  normalizeMeasure(score, loc.part, loc.measure);
  history.commit();
}

/* ------------------------------------------------------------- structure */

function setTimeSignature(app, measureIndex, ts) {
  const { score, history } = app;
  history.begin('Time signature');
  history.touchAll();
  score.measures[measureIndex].timeSig = { ...ts };
  /* Re-fill every bar from here until the next explicit change. */
  let end = score.measures.length - 1;
  for (let m = measureIndex + 1; m < score.measures.length; m++) {
    if (score.measures[m].timeSig) { end = m - 1; break; }
  }

    for (let m = measureIndex; m <= end; m++) normalizeMeasure(score, part, m);

  history.commit();
}

  const { score, history } = app;
  history.begin('Key signature');
  history.touchGlobal();
  score.measures[measureIndex].keySig = { fifths, mode };
  history.commit();
}

  const { score, history } = app;
  const part = score.parts[partIndex];
  if (!part) return;
  history.begin('Clef');
  history.touch(partIndex, measureIndex);
  if (measureIndex === 0) {
    if (staff === 1) part.clef2 = clefId; else part.clef = clefId;
    history.touchAll();

  history.commit();

  const { score, history } = app;

  history.commit();

  const { score, history } = app;
  history.begin('Barline');
  history.touchGlobal();
  score.measures[measureIndex].barline = style;
  history.commit();
}

function setRehearsalMark(app, measureIndex, text) {
  const { score, history } = app;
  history.begin('Rehearsal mark');
  history.touchGlobal();
  score.measures[measureIndex].rehearsal = text || null;
  history.commit();
}

function toggleSystemBreak(app, measureIndex) {
  const { score, history } = app;
  history.begin('System break');
  history.touchGlobal();
  const m = score.measures[measureIndex];
  m.systemBreak = !m.systemBreak;
  history.commit();
}

  const { score, history } = app;
  history.begin(count > 1 ? `Insert ${count} measures` : 'Insert measure');
  history.touchAll();
  modelInsertMeasures(score, at, count);
  history.commit();
}

function removeMeasures(app, at, count = 1) {
  const { score, history } = app;
  history.begin(count > 1 ? `Delete ${count} measures` : 'Delete measure');
  history.touchAll();
  const ok = modelRemoveMeasures(score, at, count);
  if (!ok) { history.cancel(); return false; }
  history.commit();
  return true;
}

/* ------------------------------------------------------------------ parts */

function addPart(app, instrumentId, at = null) {
  const { score, history } = app;
  history.begin('Add instrument');
  history.touchAll();
  const part = makePart(instrumentId, score.measures.length);
  let index = at;
  if (index === null) {
    index = score.parts.findIndex((p) => scoreOrder(p.instrumentId) > scoreOrder(instrumentId));
    if (index < 0) index = score.parts.length;
  }
  score.parts.splice(index, 0, part);
  autoScale(score);
  normalizeScore(score);
  history.commit();
  return index;
}

function removePart(app, partIndex) {
  const { score, history } = app;
  if (score.parts.length <= 1) return false;
  history.begin('Remove instrument');
  history.touchAll();
  score.parts.splice(partIndex, 1);
  autoScale(score);
  pruneSpanners(score);
  history.commit();
  return true;
}

function movePart(app, from, to) {
  const { score, history } = app;
  if (to < 0 || to >= score.parts.length || from === to) return;
  history.begin('Reorder instruments');
  history.touchAll();
  const [p] = score.parts.splice(from, 1);
  score.parts.splice(to, 0, p);
  history.commit();
}

function updatePart(app, partIndex, props) {
  const { score, history } = app;
  const part = score.parts[partIndex];
  if (!part) return;
  history.begin('Instrument settings');
  history.touchAll();
  Object.assign(part, props);
  if (props.instrumentId) {
    const inst = getInstrument(props.instrumentId);
    part.name = inst.name;
    part.abbrev = inst.abbrev;
    part.program = inst.program;
    part.synth = inst.synth;
    part.transpose = { ...inst.transpose };
    part.clef = inst.clef;
    part.clef2 = inst.clef2 || null;
    part.staves = inst.staves;

/** Move notes to the other staff of a grand-staff instrument. */
function setEventStaff(app, targets, staff) {
  const { score, history } = app;
  if (!targets.length) return;
  history.begin('Cross-staff');
  for (const t of targets) {
    const loc = locateEvent(score, t);
    if (!loc || (loc.part.staves || 1) < 2) continue;
    history.touch(loc.partIndex, loc.measure);
    const home = loc.voice % 2 === 0 ? 0 : 1;
    const next = staff === null || staff === home ? null
      : Math.max(0, Math.min((loc.part.staves || 1) - 1, staff));
    loc.event.staff = next;
  }
  history.commit();
}

/** Nudge the selection up or down one staff. */
function moveAcrossStaff(app, targets, delta) {
  const { score } = app;
  const loc = targets.length ? locateEvent(score, targets[0]) : null;
  if (!loc || (loc.part.staves || 1) < 2) return false;
  const home = loc.voice % 2 === 0 ? 0 : 1;
  const current = loc.event.staff === null || loc.event.staff === undefined ? home : loc.event.staff;
  setEventStaff(app, targets, current + delta);
  return true;
