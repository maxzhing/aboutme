/* ---------------------------------------------------------- system build */

function buildSystem(score, sys, staves, o, isFirst) {
  const staffItems = staves.map(() => []);
  const extents = staves.map(() => ({ top: 0, bottom: M.staffHeight }));
  const crossWork = [];
  const crossParts = new Set();

  for (let si = 0; si < staves.length; si++) {
    const sv = staves[si];
    const out = staffItems[si];
    for (const mm of sys.measures) {
      const res = layoutMeasureStaff(score, mm, sv, si, o, sys);
      out.push(...res.items);
      extents[si].top = Math.min(extents[si].top, res.top);
      extents[si].bottom = Math.max(extents[si].bottom, res.bottom);
      if ((res.crossChords && res.crossChords.length) || (res.pendingBeams && res.pendingBeams.length)) {
        crossWork.push({ si, sv, out, res });
        crossParts.add(sv.partIndex);
      }
    }
    /* Lift tempo marks clear of anything reaching above the top staff. */
    const tempos = out.filter((i) => i.kind === 'tempo');
    if (tempos.length) {
      const ink = Math.min(0, ...out
        .filter((i) => i.kind !== 'tempo' && i.y !== undefined)
        .map((i) => i.y));
      const y = Math.min(M.tempoY, ink - 1.3);
      for (const t of tempos) t.y = y;
      extents[si].top = Math.min(extents[si].top, y - M.tempoSize);
    }
    /* Align every dynamic on this staff, and tell the hairpins where to go. */
    const dyns = out.filter((i) => i.kind === 'dynamic');
    const figs = out.filter((i) => i.cls === 'figure');
    const figBottom = figs.length ? Math.max(...figs.map((f) => f.y)) + 1.5 : -Infinity;
    const line = dyns.length
      ? Math.max(M.dynamicY, figBottom, ...dyns.map((d) => d.minY || 0))
      : Math.max(M.hairpinY, figBottom);
    for (const d of dyns) d.y = line;
    for (const a of out) if (a.kind === 'anchor') a.meta.dynLine = line;
    if (dyns.length) extents[si].bottom = Math.max(extents[si].bottom, line + 1.4);
  }

  /* Stack staves, honouring what each one actually occupies. */
  const ys = [];
  let y = 0;
  for (let si = 0; si < staves.length; si++) {
    if (si > 0) {
      const samePart = staves[si].partIndex === staves[si - 1].partIndex;
      /* Cross-staff writing lives in the gap, so widen it a little. */
      const cross = samePart && crossParts.has(staves[si].partIndex);
      const gap = samePart ? (cross ? M.crossStaffGap : M.graceStaffGap) : M.staffGap;
      y = ys[si - 1] + Math.max(
        M.staffHeight + gap,
        extents[si - 1].bottom + gap * 0.55 - extents[si].top,
      );
    }
    ys.push(y);
  }

  /* Now that the staves are placed, move the cross-staff notes onto their
   * neighbour and beam the groups that span both. */
  if (crossWork.length) {
    const indexOf = (partIndex, staff) =>
      staves.findIndex((k) => k.partIndex === partIndex && k.staff === staff);
    for (const w of crossWork) {
      for (const c of w.res.crossChords || []) {
        const to = indexOf(w.sv.partIndex, c.crossTo);
        if (to < 0) continue;
        shiftChord(c, ys[to] - ys[w.si]);
      }
      for (const pb of w.res.pendingBeams || []) {
        const shifts = new Set(pb.members.map((c) => c.staffShift || 0));
        const r = shifts.size > 1
          ? layoutCrossBeam(pb.members, pb.events, pb.indices, pb.ts)
          : layoutBeam(pb.members, pb.events, pb.indices, pb.ts, pb.multi, pb.voice);
        w.out.push(...r.items);
        for (const c of pb.members) {
          if (c.beamed || !c.flagCount) continue;
          w.out.push(item('path', {
            d: FLAG_GLYPHS[c.dir === 1 ? 'up' : 'down'](c.flagCount),
            x: c.stemX + (c.dir === 1 ? -M.stem / 2 : M.stem / 2), y: c.stemEndY, cls: 'flag',
          }));
        }
        extents[w.si].top = Math.min(extents[w.si].top, 0);
      }
    }
  }

  const height = ys[ys.length - 1] + Math.max(M.staffHeight, extents[extents.length - 1].bottom)
    - Math.min(0, extents[0].top);
  return { staffItems, ys, extents, height, topPad: -Math.min(0, extents[0].top), sys };
}

/** Move an already-laid-out chord (and everything attached to it) vertically. */
function shiftChord(c, dy) {
  if (!dy) return;
  for (const it of c.items) {
    if (it.y !== undefined) it.y += dy;
    if (it.y1 !== undefined) { it.y1 += dy; it.y2 += dy; }
    if (it.kind === 'beam' || it.kind === 'curve') it.ty = (it.ty || 0) + dy;
    if (it.meta) {
      if (it.meta.notes) for (const n of it.meta.notes) n.y += dy;
      if (it.meta.stemEndY !== undefined && it.meta.stemEndY !== null) it.meta.stemEndY += dy;
      it.meta.staffShift = (it.meta.staffShift || 0) + dy;
    }
  }
  for (const n of c.notes || []) n.y += dy;
  if (c.stemEndY !== null && c.stemEndY !== undefined) c.stemEndY += dy;
  c.top += dy;
  c.bottom += dy;
  c.staffShift = (c.staffShift || 0) + dy;
}

/**
 * Beam a group whose notes are split between two staves.  The beam runs
 * through the gap between them and each chord's stem points at it, so notes
 * above the beam get down-stems and notes below get up-stems.
 */
function layoutCrossBeam(members, events, indices, ts) {
  const items = [];
  const shifts = members.map((c) => c.staffShift || 0);
  const upper = Math.min(...shifts);
  const lower = Math.max(...shifts);
  /* Halfway between the lower edge of the upper staff and the top of the lower. */
  const mid = (upper + M.staffHeight + lower) / 2;

  const pts = members.map((c) => {
    const ys = c.notes.map((n) => n.y);
    return {
      c,
      x: c.x + c.headW / 2,
      hi: Math.min(...ys),
      lo: Math.max(...ys),
      centre: (Math.min(...ys) + Math.max(...ys)) / 2,
    };
  });

  /* A gentle slope following the outer chords, kept inside the gap. */
  const first = pts[0];
  const last = pts[pts.length - 1];
  const dx = Math.max(0.01, last.x - first.x);
  let slope = ((last.centre - first.centre) * 0.2) / dx;
  slope = Math.max(-0.12, Math.min(0.12, slope));
  let intercept = mid - slope * ((first.x + last.x) / 2);
  const beamAt = (x) => slope * x + intercept;
  /* Keep at least a little stem on every chord. */
  const minStem = 1.1;
  for (const p of pts) {
    const y = beamAt(p.x);
    if (p.lo < y && y - p.lo < minStem) intercept += minStem - (y - p.lo);
    if (p.hi > y && p.hi - y < minStem) intercept -= minStem - (p.hi - y);
  }

  const levels = beamLevels(events, indices, 0, ts);
  const maxBeams = Math.max(...levels.map((l) => l.beams));
  const step = M.beam + M.beamGap;
  for (let level = 1; level <= maxBeams; level++) {
    let run = [];
    const flush = () => {
      if (run.length > 1) emitBeam(items, run[0].x, run[run.length - 1].x, level, 1, beamAt, step);
      else if (run.length === 1) {
        const k = pts.indexOf(run[0]);
        const back = k === pts.length - 1;
        emitBeam(items, back ? run[0].x - 1.05 : run[0].x, back ? run[0].x : run[0].x + 1.05,
          level, 1, beamAt, step);
      }
      run = [];
    };
    for (let k = 0; k < pts.length; k++) {
      const has = levels[k].beams >= level;
      const linked = k > 0 && (levels[k].continued || 0) >= level && levels[k - 1].beams >= level;
      if (!has) { flush(); continue; }
      if (run.length && !linked) flush();
      run.push(pts[k]);
    }
    flush();
  }

  let top = Infinity;
  let bottom = -Infinity;
  for (const p of pts) {
    const y = beamAt(p.x);
    /* Point the stem at the beam from whichever side the chord sits on. */
    const above = p.centre < y;
    const dir = above ? -1 : 1;
    const anchor = above ? p.lo : p.hi;
    p.c.beamed = true;
    p.c.dir = dir;
    p.c.stemEndY = y;
    if (p.c.stemItem) {
      p.c.stemItem.x1 = p.x;
      p.c.stemItem.x2 = p.x;
      p.c.stemItem.y1 = anchor - dir * 0.06;
      p.c.stemItem.y2 = y;
    }
    top = Math.min(top, p.hi - 0.6, y - 0.6);
    bottom = Math.max(bottom, p.lo + 0.6, y + 0.6 + (maxBeams - 1) * step);
  }
  return { items, top, bottom };
}

function placeSystem(page, built, x0, y0, sys, score, staves, o) {
  const top = y0 + built.topPad;
  built.ys.forEach((sy, si) => {
    const sv = staves[si];
    const y = top + sy;
    built.staffY = built.staffY || [];
    built.staffY[si] = { partIndex: sv.partIndex, staff: sv.staff, y, index: si };
    /* staff lines, drawn per measure run so breaks are clean */
    const lineEnd = x0 + sys.totalWidth;
    for (let l = 0; l < 5; l++) {
      page.items.push(item('line', {
        x1: x0, y1: y + l, x2: lineEnd, y2: y + l, w: M.staffLine, cls: 'staffline',
      }));
    }
    for (const it of built.staffItems[si]) {
      page.items.push(offsetItem(it, x0, y));
    }
  });

  /* barlines, brackets, names, measure numbers */
  const firstY = top + built.ys[0];
  const lastY = top + built.ys[built.ys.length - 1] + M.staffHeight;
  drawBarlines(page, score, sys, staves, built, x0, top, o, built.extents[0]);
  drawBrackets(page, score, staves, x0, firstY, lastY, built, top);
  if (o.partFilter === null || o.partFilter === undefined) {
    drawPartNames(page, score, staves, built, x0, top, sys, o);
  }
  if (o.showMeasureNumbers) {
    const m0 = sys.measures[0];
    if (m0.index > 0) {
      page.items.push(item('text', {
        x: x0 + m0.x + 0.2, y: firstY - 1.3, str: String(m0.index + 1),
        size: M.measureNumSize, cls: 'measnum', anchor: 'start', italic: true,
      }));
    }
  }
}

function offsetItem(it, dx, dy) {
  const c = { ...it };
  if (c.x !== undefined) c.x += dx;
  if (c.y !== undefined) c.y += dy;
  if (c.x1 !== undefined) { c.x1 += dx; c.x2 += dx; }
  if (c.y1 !== undefined) { c.y1 += dy; c.y2 += dy; }
  /* Beams and ties carry baked path data, so they move by transform. */
  if (c.kind === 'beam' || c.kind === 'curve') { c.tx = (c.tx || 0) + dx; c.ty = (c.ty || 0) + dy; }
  if (c.meta) {
    c.meta = { ...c.meta, staffTop: dy };
    if (c.meta.notes) c.meta.notes = c.meta.notes.map((n) => ({ ...n, x: n.x + dx, y: n.y + dy }));
    if (c.meta.stemX !== undefined && c.meta.stemX !== null) c.meta.stemX += dx;
    if (c.meta.stemEndY !== undefined && c.meta.stemEndY !== null) c.meta.stemEndY += dy;
    if (c.meta.x0 !== undefined) c.meta.x0 += dx;
    if (c.meta.x1 !== undefined) c.meta.x1 += dx;
  }
  return c;
}

/* ------------------------------------------------------------ barlines */

function drawBarlines(page, score, sys, staves, built, x0, top, o, topExtent) {
  const spans = [];
  let i = 0;
  while (i < staves.length) {
    let j = i;
    while (j + 1 < staves.length && staves[j + 1].partIndex === staves[i].partIndex) j++;
    spans.push([i, j]);
    i = j + 1;
  }
  const yTop = (si) => top + built.ys[si];
  const yBot = (si) => top + built.ys[si] + M.staffHeight;

  const drawAt = (x, style, isEnd) => {
    for (const [a, b] of spans) {
      const y1 = yTop(a);
      const y2 = yBot(b);
      if (style === 'final') {
        page.items.push(item('line', { x1: x - M.barlineThick / 2 - M.barlineGap - M.barlineThin, y1, x2: x - M.barlineThick / 2 - M.barlineGap - M.barlineThin, y2, w: M.barlineThin, cls: 'barline' }));
        page.items.push(item('line', { x1: x - M.barlineThick / 2, y1, x2: x - M.barlineThick / 2, y2, w: M.barlineThick, cls: 'barline' }));
      } else if (style === 'double') {
        page.items.push(item('line', { x1: x - 0.45, y1, x2: x - 0.45, y2, w: M.barlineThin, cls: 'barline' }));
        page.items.push(item('line', { x1: x, y1, x2: x, y2, w: M.barlineThin, cls: 'barline' }));
      } else if (style === 'repeat-end' || style === 'repeat-both') {
        page.items.push(item('line', { x1: x - M.barlineThick / 2, y1, x2: x - M.barlineThick / 2, y2, w: M.barlineThick, cls: 'barline' }));
        page.items.push(item('line', { x1: x - M.barlineThick - M.barlineGap, y1, x2: x - M.barlineThick - M.barlineGap, y2, w: M.barlineThin, cls: 'barline' }));
        for (let s = a; s <= b; s++) {
          page.items.push(item('dot', { x: x - M.barlineThick - M.barlineGap - 0.55, y: yTop(s) + 1.5, r: M.repeatDotR, cls: 'barline' }));
          page.items.push(item('dot', { x: x - M.barlineThick - M.barlineGap - 0.55, y: yTop(s) + 2.5, r: M.repeatDotR, cls: 'barline' }));
        }
      } else if (style === 'repeat-start') {
        page.items.push(item('line', { x1: x + M.barlineThick / 2, y1, x2: x + M.barlineThick / 2, y2, w: M.barlineThick, cls: 'barline' }));
        page.items.push(item('line', { x1: x + M.barlineThick + M.barlineGap, y1, x2: x + M.barlineThick + M.barlineGap, y2, w: M.barlineThin, cls: 'barline' }));
        for (let s = a; s <= b; s++) {
          page.items.push(item('dot', { x: x + M.barlineThick + M.barlineGap + 0.55, y: yTop(s) + 1.5, r: M.repeatDotR, cls: 'barline' }));
          page.items.push(item('dot', { x: x + M.barlineThick + M.barlineGap + 0.55, y: yTop(s) + 2.5, r: M.repeatDotR, cls: 'barline' }));
        }
      } else if (style === 'dashed') {
        page.items.push(item('line', { x1: x, y1, x2: x, y2, w: M.barlineThin, cls: 'barline', dash: '0.6 0.5' }));
      } else {
        page.items.push(item('line', { x1: x, y1, x2: x, y2, w: M.barlineThin, cls: 'barline' }));
      }
    }
  };

  /* Opening barline of the system joins all staves. */
  if (staves.length > 1) {
    const y1 = yTop(0);
    const y2 = yBot(staves.length - 1);
    page.items.push(item('line', { x1: x0, y1, x2: x0, y2, w: M.barlineThin, cls: 'barline' }));
  }
  for (const mm of sys.measures) {
    const spec = score.measures[mm.last === undefined ? mm.index : mm.last] || {};
    const startSpec = score.measures[mm.index] || {};
    const x = x0 + mm.x + mm.width;
    drawAt(x, spec.barline || 'normal', true);
    if (startSpec.barline === 'repeat-start' || startSpec.barline === 'repeat-both') {
      drawAt(x0 + mm.x, 'repeat-start', false);
    }
    if (startSpec.rehearsal) {
      page.items.push(item('rehearsal', {
        x: x0 + mm.x + 0.4,
        y: yTop(0) + Math.min(-2.4, (topExtent ? topExtent.top : 0) - 1.0),
        str: startSpec.rehearsal, size: M.rehearsalSize,
        ref: { measure: mm.index, kind: 'rehearsal' },
      }));
    }
  }
}

function drawBrackets(page, score, staves, x0, firstY, lastY, built, top) {
  if (staves.length < 2) return;
  /* A brace joins the staves of one keyboard instrument. */
  let i = 0;
  while (i < staves.length) {
    let j = i;
    while (j + 1 < staves.length && staves[j + 1].partIndex === staves[i].partIndex) j++;
    if (j > i) {
      const y1 = top + built.ys[i];
      const y2 = top + built.ys[j] + M.staffHeight;
      page.items.push(item('brace', { x: x0 - 0.85, y1, y2, cls: 'brace' }));
    }
    i = j + 1;
  }
  /* Square brackets join instrument families. */
  const parts = [];
  const seen = new Set();
  for (const sv of staves) {
    if (seen.has(sv.partIndex)) continue;
    seen.add(sv.partIndex);
    parts.push(sv.part);
  }
  if (parts.length < 2) return;
  const groups = bracketGroups(parts);
  const staffOfPart = (pi) => staves.findIndex((s) => s.part === parts[pi]);
  const lastStaffOfPart = (pi) => {
    let last = -1;
    staves.forEach((s, k) => { if (s.part === parts[pi]) last = k; });
    return last;
  };
  for (const g of groups) {
    const a = staffOfPart(g.start);
    const b = lastStaffOfPart(g.end);
    if (a < 0 || b < 0) continue;
    const y1 = top + built.ys[a] - 0.25;
    const y2 = top + built.ys[b] + M.staffHeight + 0.25;
    page.items.push(item('bracket', { x: x0 - 1.5, y1, y2, cls: 'bracket' }));
  }
}

function drawPartNames(page, score, staves, built, x0, top, sys, o) {
  const isFirstSystem = sys.measures[0].index === 0;
  const seen = new Set();
  for (let si = 0; si < staves.length; si++) {
    const sv = staves[si];
    if (seen.has(sv.partIndex)) continue;
    seen.add(sv.partIndex);
    let last = si;
    for (let k = si; k < staves.length; k++) if (staves[k].partIndex === sv.partIndex) last = k;
    const y = (top + built.ys[si] + top + built.ys[last] + M.staffHeight) / 2;
    const str = isFirstSystem ? sv.part.name : sv.part.abbrev;
    page.items.push(item('text', {
      x: x0 - (staves.length > 1 ? 2.2 : 1.4), y: y + M.partNameSize * 0.34, str,
      size: M.partNameSize, anchor: 'end', cls: 'partname',
      ref: { partIndex: sv.partIndex, kind: 'partname' },
    }));
  }
}



/* ======================================================================== */
/*  Measure contents                                                         */
/* ======================================================================== */

const posY = (pos) => (8 - pos) * 0.5;

function layoutMeasureStaff(score, mm, sv, staffIndex, o, sys) {
  const items = [];
  let top = 0;
  let bottom = M.staffHeight;
  const grow = (t, b) => { top = Math.min(top, t); bottom = Math.max(bottom, b); };

  const clefId = clefAt(score, sv.part, mm.index, sv.staff);
  const clef = CLEFS[clefId] || CLEFS.treble;
  const fifths = displayFifths(score, sv.part, mm.index, o);
  const ts = mm.grid.ts;
  const spec = score.measures[mm.index] || {};

  /* --- clef / key / time ------------------------------------------------ */
  let x = mm.x + M.measurePadLeft;
  const lead = mm.lead;
  if (lead.showClef) {
    const c = clefGlyph(clef);
    items.push(gl(c.name, x, posY(c.pos), { scale: c.scale, cls: 'clef', ref: { measure: mm.index, partIndex: sv.partIndex, staff: sv.staff, kind: 'clef' } }));
    grow(posY(c.pos) + c.top, posY(c.pos) + c.bottom);
    x += 3.4 + M.clefGap;
  }
  if (lead.showKey) {
    const prevKey = mm.index > 0 ? keySigAt(score, mm.index - 1) : { fifths: 0 };
    const prevW = o.concertPitch ? prevKey.fifths : writtenFifthsFor(score, sv.part, prevKey.fifths, o);
    if (lead.cancelCount > 0 && prevW !== fifths) {
      const cancels = keySignatureLayout(prevW, clef).slice(sameSign(prevW, fifths) ? Math.abs(fifths) : 0);
      for (const c of cancels) {
        items.push(gl('accidentalNatural', x, posY(c.pos), { cls: 'keysig' }));
        x += 0.82;
      }
      if (cancels.length) x += 0.2;
    }
    for (const a of keySignatureLayout(fifths, clef)) {
      items.push(gl(accNameFor(a.alter), x, posY(a.pos), {
        cls: 'keysig', ref: { measure: mm.index, partIndex: sv.partIndex, kind: 'keysig' },
      }));
      x += fifths > 0 ? M.keyAccWidth : M.keyAccWidthFlat;
      grow(posY(a.pos) - 1.5, posY(a.pos) + 1.5);
    }
    x += M.keyGap;
  }
  if (lead.showTime) {
    const tw = timeSigWidth(ts);
    items.push(...timeSigItems(ts, x, tw, { measure: mm.index, partIndex: sv.partIndex, kind: 'timesig' }));
    x += tw + M.timeGap;
  }
  if (lead.width > 0) x += M.leadingPad;

  /* --- a multi-bar rest replaces the contents of the block --------------- */
  if (mm.multirest) {
    const left = x + 0.6;
    const right = mm.x + mm.width - M.measurePadRight - 0.6;
    const barTop = 1.5;
    const barBottom = 2.5;
    const serif = 0.19;
    items.push(item('rect', { x: left, y: barTop, w: Math.max(2, right - left), h: barBottom - barTop, cls: 'multirest' }));
    items.push(item('rect', { x: left, y: 1.0, w: serif, h: 2.0, cls: 'multirest' }));
    items.push(item('rect', { x: right - serif, y: 1.0, w: serif, h: 2.0, cls: 'multirest' }));
    const label = String(mm.count);
    const digitW = 1.12;
    let dx = (left + right) / 2 - (label.length * digitW) / 2 + digitW / 2;
    for (const ch of label) {
      items.push(gl('timeSig' + ch, dx, -1.5, { scale: 0.86, cls: 'multirest-num' }));
      dx += digitW;
    }
    grow(-3.0, M.staffHeight);
    items.push(item('anchor', {
      x: left, y: 2,
      ref: { measure: mm.index, partIndex: sv.partIndex, staff: sv.staff, kind: 'multirest' },
      meta: { top, bottom, isRest: true, dir: 1, notes: [] },
    }));
    if (!mm.noteArea) {
      mm.noteArea = { start: left, end: right };
      mm.columns = [{ tick: 0, x: left }];
    }
    return { items, top, bottom, crossChords: [], pendingBeams: [] };
  }

  /* --- column positions -------------------------------------------------- */
  const noteStart = x;
  const avail = mm.x + mm.width - M.measurePadRight - noteStart;
  const natural = mm.grid.width;
  const k = natural > 0 ? Math.max(0.5, avail / natural) : 1;
  const colX = new Map();
  let cx = noteStart + mm.grid.columns[0].leftPad * k + mm.grid.columns[0].graceW * k;
  for (const col of mm.grid.columns) {
    colX.set(col.tick, cx);
    cx += col.advance * k;
  }
  const measureRight = mm.x + mm.width;
  if (!mm.noteArea) {
    mm.noteArea = { start: noteStart, end: measureRight - M.measurePadRight };
    mm.columns = [...colX.entries()].map(([tick, x]) => ({ tick, x }));
  }

  /* --- tempo / rehearsal text (first staff of the system only) ---------- */
  if (staffIndex === 0 && spec.tempo) {
    const t = spec.tempo;
    const label = (t.text ? t.text + '  ' : '') + unitGlyphText(t.unit) + ' = ' + Math.round(t.bpm);
    items.push(item('tempo', {
      x: noteStart - 0.6, y: M.tempoY, str: label, bpm: t.bpm, unit: t.unit, text: t.text,
      size: M.tempoSize, ref: { measure: mm.index, kind: 'tempo' },
    }));
    grow(M.tempoY - M.tempoSize, bottom);
  }

  /* --- voices ------------------------------------------------------------ */
  const pm = sv.part.measures[mm.index];
  if (!pm) return { items, top, bottom };
  const voicesHere = [];
  for (let v = 0; v < pm.voices.length; v++) if (voiceStaff(sv.part, v) === sv.staff) voicesHere.push(v);
  const multi = voicesHere.length > 1;
  /* If another voice is writing onto this staff, its notes fill the bar; an
   * extra whole-bar rest here would be redundant. */
  let receivesCross = false;
  for (let v = 0; v < pm.voices.length; v++) {
    if (voiceStaff(sv.part, v) === sv.staff) continue;
    for (const ev of pm.voices[v]) {
      if (ev.staff !== null && ev.staff !== undefined && ev.staff === sv.staff) { receivesCross = true; break; }
    }
    if (receivesCross) break;
  }

  const crossChords = [];
  const pendingBeams = [];
  /* A cross-staff note is written on its neighbour's staff; we lay it out here
   * and shift it once the staves have been stacked. */
  const staffOf = (ev) => (ev.staff === null || ev.staff === undefined ? sv.staff : ev.staff);
  const clefCache = new Map([[sv.staff, clef]]);
  const clefForStaff = (st) => {
    if (!clefCache.has(st)) {
      clefCache.set(st, CLEFS[clefAt(score, sv.part, mm.index, st)] || clef);
    }
    return clefCache.get(st);
  };

  const accMap = resolveAccidentals(score, sv, mm.index, fifths, o);

  for (const v of voicesHere) {
    const voice = pm.voices[v];
    const chords = [];
    let tick = 0;
    let pendingGrace = [];
    for (let i = 0; i < voice.length; i++) {
      const ev = voice[i];
      if (ev.grace) { pendingGrace.push(ev); continue; }
      const bx = colX.get(tick) ?? noteStart;
      const target = staffOf(ev);
      const ctx = {
        x: bx, clef: clefForStaff(target), fifths, accMap, o, score, sv, ts, tick,
        voiceIndex: v, multi, measure: mm.index, k, measureRight,
        crossTo: target === sv.staff ? null : target,
        isFullMeasure: ev.type === 'rest' && (ev.fullMeasure || voice.length === 1),
        hideRest: receivesCross && voice.every((e) => e.type === 'rest'),
      };
      if (pendingGrace.length) {
        let gx = bx - 0.5;
        for (let gi = pendingGrace.length - 1; gi >= 0; gi--) {
          gx -= 1.45;
          const gc = layoutChord(pendingGrace[gi], { ...ctx, x: gx, grace: true });
          chords.push(gc);
          items.push(...gc.items);
          grow(gc.top, gc.bottom);
        }
        pendingGrace = [];
      }
      const c = layoutChord(ev, ctx);
      c.index = i;
      c.tick = tick;
      c.crossTo = ctx.crossTo;
      chords.push(c);
      items.push(...c.items);
      if (c.crossTo === null) grow(c.top, c.bottom);
      else crossChords.push(c);
      tick += eventTicks(ev);
    }

    /* beams */
    const real = chords.filter((c) => !c.grace);
    const flat = voice.filter((e) => !e.grace);
    const groups = computeBeams(flat, ts);
    for (const g of groups) {
      const members = g.map((idx) => real[idx]).filter(Boolean);
      if (members.length < 2) continue;
      if (members.some((c) => c.crossTo !== null)) {
        /* Wait until the staves are placed: the beam spans both of them. */
        pendingBeams.push({ members, events: flat, indices: g, ts, multi, voice: v });
        continue;
      }
      const r = layoutBeam(members, flat, g, ts, multi, v);
      items.push(...r.items);
      grow(r.top, r.bottom);
    }
    for (const c of real) {
      if (!c.beamed && c.flagCount > 0 && !pendingBeams.some((b) => b.members.includes(c))) {
        const flag = item('path', {
          d: FLAG_GLYPHS[c.dir === 1 ? 'up' : 'down'](c.flagCount),
          x: c.stemX + (c.dir === 1 ? -M.stem / 2 : M.stem / 2), y: c.stemEndY, cls: 'flag',
        });
        items.push(flag);
        if (c.crossTo !== null) c.items.push(flag);
        else grow(Math.min(top, c.stemEndY - 0.4), Math.max(bottom, c.stemEndY + 0.4));
      }
    }

    /* tuplet brackets */
    items.push(...layoutTuplets(chords, multi));

    /* marks that sit outside the staff */
    for (const c of real) {
      const r = layoutMarks(c, multi, ts);
      items.push(...r.items);
      if (c.crossTo !== null) c.items.push(...r.items);
      else grow(r.top, r.bottom);
    }
  }

  return { items, top, bottom, crossChords, pendingBeams };
}

function sameSign(a, b) { return (a >= 0 && b >= 0) || (a <= 0 && b <= 0); }

function writtenFifthsFor(score, part, concertFifths, o) {
  if (o.concertPitch) return concertFifths;
  const t = part.transpose || { chromatic: 0 };
  if (!t.chromatic) return concertFifths;
  let f = concertFifths - ((t.chromatic % 12) * 7) % 12;
  while (f > 7) f -= 12;
  while (f < -7) f += 12;
  return f;
}

function clefGlyph(clef) {
  if (clef.sign === 'G') return { name: 'gClef', pos: (clef.line - 1) * 2, scale: 1, top: -4.4, bottom: 2.9 };
  if (clef.sign === 'F') return { name: 'fClef', pos: (clef.line - 1) * 2, scale: 1, top: -1.2, bottom: 2.7 };
  if (clef.sign === 'C') return { name: 'cClef', pos: (clef.line - 1) * 2, scale: 1, top: -2.1, bottom: 2.1 };
  return { name: 'percClef', pos: 4, scale: 1, top: -1.1, bottom: 1.1 };
}

function unitGlyphText(unit) {
  return { whole: '\u{1D15D}', half: '\u{1D15E}', quarter: '\u{1D15F}', 'quarter.': '\u{1D15F}·', eighth: '\u{1D160}' }[unit] || '\u{1D15F}';
}

function timeSigItems(ts, x, width, ref) {
  const out = [];
  if (ts.symbol === 'common') {
    out.push(gl('timeSigCommon', x + 0.7, 2, { cls: 'timesig', ref }));
    return out;
  }
  if (ts.symbol === 'cut') {
    out.push(gl('timeSigCut', x + 0.7, 2, { cls: 'timesig', ref }));
    return out;
  }
  const topStr = String(ts.beats);
  const botStr = String(ts.beatType);
  const digitW = 1.25;
  const place = (str, y) => {
    let dx = x + (width - str.length * digitW) / 2 + digitW / 2;
    for (const ch of str) {
      out.push(gl('timeSig' + ch, dx, y, { cls: 'timesig', ref }));
      dx += digitW;
    }
  };
  place(topStr, 1);
  place(botStr, 3);
  return out;
}

/* --------------------------------------------------------------- chords */

function layoutChord(ev, ctx) {
  const items = [];
  const grace = !!ctx.grace;
  const scale = grace ? 0.62 : 1;
  const info = durationInfo(ev.duration);
  let top = 0;
  let bottom = M.staffHeight;
  const grow = (t, b) => { top = Math.min(top, t); bottom = Math.max(bottom, b); };

  if (ev.type === 'rest') {
    if (ctx.hideRest) {
      return {
        items, top, bottom, ev, x: ctx.x, isRest: true, grace, flagCount: 0, dir: 1,
        tuplet: ev.tuplet, notes: [], crossTo: null,
      };
    }
    const restName = ctx.isFullMeasure ? 'restWhole' : {
      breve: 'restBreve', whole: 'restWhole', half: 'restHalf', quarter: 'restQuarter',
      eighth: 'restEighth', '16th': 'rest16th', '32nd': 'rest32nd', '64th': 'rest64th',
      '128th': 'rest128th',
    }[ev.duration] || 'restQuarter';
    /* Whole rests hang from the fourth line; half rests sit on the third. */
    let ry = restName === 'restWhole' ? 1 : restName === 'restHalf' ? 2 : 2;
    if (ctx.multi) ry += ctx.voiceIndex % 2 === 0 ? -1 : 1;
    const rx = ctx.isFullMeasure
      ? (ctx.x + ctx.measureRight) / 2 - GLYPHS.restWhole.w / 2
      : ctx.x;
    items.push(gl(restName, rx, ry, {
      cls: 'rest', ref: { eventId: ev.id, measure: ctx.measure, partIndex: ctx.sv.partIndex, voice: ctx.voiceIndex, kind: 'rest' },
    }));
    if (!ctx.isFullMeasure) {
      let dx = rx + GLYPHS[restName].w + 0.28;
      for (let d = 0; d < (ev.dots || 0); d++) {
        items.push(item('dot', { x: dx, y: ry - 0.5, r: M.dotR, cls: 'dot' }));
        dx += M.dotWidth;
      }
    }
    grow(Math.min(0, ry - 2), Math.max(M.staffHeight, ry + 2));
    items.push(item('anchor', {
      x: rx, y: ry, ref: { eventId: ev.id, measure: ctx.measure, partIndex: ctx.sv.partIndex, voice: ctx.voiceIndex, kind: 'rest', staff: ctx.sv.staff },
      meta: { top, bottom, isRest: true, tuplet: ev.tuplet, dir: 1 },
    }));
    return { items, top, bottom, ev, x: rx, isRest: true, grace, flagCount: 0, dir: 1, tuplet: ev.tuplet, notes: [] };
  }

  /* --- pitches and staff positions --------------------------------------- */
  const notes = ev.notes.map((n, ni) => {
    const p = displayPitch(ctx.score, ctx.sv.part, n.pitch, ctx.o);
    const pos = staffPos(p, ctx.clef);
    const resolved = ctx.accMap ? ctx.accMap.get(ev.id + ':' + ni) : null;
    const alter = resolved === undefined ? null : resolved;
    return { n, ni, p, pos, y: posY(pos), alter, head: n.head || 'normal' };
  }).sort((a, b) => a.pos - b.pos);

  /* --- stem direction ---------------------------------------------------- */
  let dir;
  if (ctx.multi) dir = ctx.voiceIndex % 2 === 0 ? 1 : -1;
  else if (ev.stemDir === 'up') dir = 1;
  else if (ev.stemDir === 'down') dir = -1;
  else {
    const lo = notes[0].pos;
    const hi = notes[notes.length - 1].pos;
    const far = Math.abs(hi - 4) >= Math.abs(4 - lo) ? hi : lo;
    dir = far >= 4 ? -1 : 1;
  }

  /* --- seconds are displaced to the far side of the stem ----------------- */
  const headW = (info.ticks >= TPQ * 4 ? GLYPHS.noteheadWhole.w : GLYPHS.noteheadBlack.w) * scale;
  let displaced = false;
  const order = dir === 1 ? notes : [...notes].reverse();
  let prevPos = null;
  let prevDisp = false;
  for (const nd of order) {
    nd.displaced = prevPos !== null && Math.abs(nd.pos - prevPos) === 1 && !prevDisp;
    if (nd.displaced) displaced = true;
    prevDisp = nd.displaced;
    prevPos = nd.pos;
  }
  const anyDisp = displaced;
  const baseX = ctx.x + (anyDisp && dir === -1 ? headW : 0);
  for (const nd of notes) {
    nd.x = baseX + (nd.displaced ? dir * headW : 0);
  }

  /* --- accidentals ------------------------------------------------------- */
  const accs = notes.filter((n) => n.alter !== null);
  if (accs.length) {
    const cols = [];
    const ordered = [...accs].sort((a, b) => a.pos - b.pos).reverse();
    for (const a of ordered) {
      const g = accGlyphFor(a.alter);
      let c = 0;
      while (c < cols.length && cols[c].some((o) => Math.abs(o.pos - a.pos) < 5.6)) c++;
      if (!cols[c]) cols[c] = [];
      cols[c].push(a);
      a.accCol = c;
      a.accW = g.w * scale;
    }
    const colW = cols.map((c) => Math.max(...c.map((a) => a.accW)) + M.accidentalGap);
    for (const a of accs) {
      let off = 0;
      for (let c = 0; c <= a.accCol; c++) off += colW[c];
      const ax = ctx.x - off;
      items.push(gl(accNameFor(a.alter), ax, a.y, {
        scale, cls: 'accidental',
        ref: { eventId: ev.id, noteIndex: a.ni, measure: ctx.measure, partIndex: ctx.sv.partIndex, kind: 'accidental' },
      }));
      grow(a.y - 1.6 * scale, a.y + 1.6 * scale);
    }
  }

  /* --- noteheads and ledger lines ---------------------------------------- */
  const headName = ev.type === 'note' && notes[0].head === 'x' ? 'noteheadX'
    : info.ticks >= TPQ * 8 ? 'noteheadBreve'
      : info.ticks >= TPQ * 4 ? 'noteheadWhole'
        : info.ticks >= TPQ * 2 ? 'noteheadHalf' : 'noteheadBlack';
  const ledgerSet = new Set();
  for (const nd of notes) {
    items.push(gl(headName, nd.x, nd.y, {
      scale, cls: 'notehead' + (nd.n.parenthesized ? ' paren' : ''),
      ref: {
        eventId: ev.id, noteIndex: nd.ni, measure: ctx.measure, partIndex: ctx.sv.partIndex,
        voice: ctx.voiceIndex, staff: ctx.sv.staff, kind: 'note', midi: toMidi(nd.p),
      },
    }));
    for (let p = 10; p <= nd.pos; p += 2) ledgerSet.add(p);
    for (let p = -2; p >= nd.pos; p -= 2) ledgerSet.add(p);
    grow(nd.y - 0.6, nd.y + 0.6);
  }
  const lx0 = Math.min(...notes.map((n) => n.x));
  const lx1 = Math.max(...notes.map((n) => n.x)) + headW;
  for (const p of ledgerSet) {
    const y = posY(p);
    items.push(item('line', {
      x1: lx0 - M.ledgerExtend * scale, y1: y, x2: lx1 + M.ledgerExtend * scale, y2: y,
      w: M.ledger, cls: 'ledger',
    }));
  }

  /* --- dots -------------------------------------------------------------- */
  if (ev.dots) {
    const dotX0 = lx1 + 0.32;
    for (const nd of notes) {
      let dy = nd.pos % 2 === 0 ? nd.y - 0.5 : nd.y;
      let dx = dotX0;
      for (let d = 0; d < ev.dots; d++) {
        items.push(item('dot', { x: dx, y: dy, r: M.dotR * scale, cls: 'dot' }));
        dx += M.dotWidth * scale;
      }
    }
  }

  /* --- stem -------------------------------------------------------------- */
  let stemX = null;
  let stemEndY = null;
  let stemItem = null;
  let flagCount = info.beams;
  if (info.stem) {
    const topN = notes[notes.length - 1];
    const botN = notes[0];
    stemX = dir === 1 ? baseX + headW - M.stem / 2 * scale : baseX + M.stem / 2 * scale;
    const anchorY = dir === 1 ? botN.y : topN.y;
    const tipFrom = dir === 1 ? topN.y : botN.y;
    let len = (grace ? 2.4 : M.stemLength) * scale;
    if (flagCount > 2) len += (flagCount - 2) * 0.72;
    stemEndY = tipFrom - dir * len;
    /* Notes outside the staff have their stems drawn back to the middle line,
     * but a very remote note keeps a plain stem rather than a flagpole. */
    if (!grace) {
      const cap = 5.2;
      if (dir === 1 && stemEndY > 2) stemEndY = Math.max(Math.min(stemEndY, 2), tipFrom - cap);
      if (dir === -1 && stemEndY < 2) stemEndY = Math.min(Math.max(stemEndY, 2), tipFrom + cap);
    }
    stemItem = item('line', {
      x1: stemX, y1: anchorY - dir * 0.06, x2: stemX, y2: stemEndY, w: M.stem * scale, cls: 'stem',
    });
    items.push(stemItem);
    grow(Math.min(stemEndY, top), Math.max(stemEndY, bottom));
  } else {
    flagCount = 0;
  }

  /* --- tremolo ----------------------------------------------------------- */
  if (ev.tremolo && stemX !== null) {
    const midY = (notes[dir === 1 ? 0 : notes.length - 1].y + stemEndY) / 2;
    for (let t = 0; t < ev.tremolo; t++) {
      const ty = midY + dir * t * 0.5 - 0.2;
      items.push(item('tremolo', { x: stemX, y: ty, cls: 'tremolo' }));
    }
  }

  /* --- arpeggio ---------------------------------------------------------- */
  if (ev.arpeggio) {
    const y0 = notes[0].y + 0.6;
    const y1 = notes[notes.length - 1].y - 0.6;
    items.push(item('arpeggio', { x: lx0 - 0.9, y1, y2: y0, cls: 'arpeggio' }));
  }

  /* --- grace-note slash --------------------------------------------------- */
  if (grace && ev.grace && ev.grace.slash && stemX !== null) {
    items.push(item('line', {
      x1: stemX - 0.42, y1: stemEndY + dir * 0.7, x2: stemX + 0.55, y2: stemEndY + dir * 1.45,
      w: 0.1, cls: 'gracedash',
    }));
  }

  items.push(item('anchor', {
    x: baseX, y: notes[0].y,
    ref: {
      eventId: ev.id, measure: ctx.measure, partIndex: ctx.sv.partIndex,
      voice: ctx.voiceIndex, staff: ctx.sv.staff, kind: 'note',
    },
    meta: {
      top, bottom, dir, stemX, stemEndY, headW, x0: lx0, x1: lx1, grace,
      notes: notes.map((n) => ({ ni: n.ni, x: n.x, y: n.y, pos: n.pos, tie: n.n.tie })),
      tuplet: ev.tuplet, ev,
    },
  }));

  return {
    items, top, bottom, ev, dir, stemX, stemEndY, stemItem, notes, headW, grace,
    flagCount, beamed: false, x: baseX, x0: lx0, x1: lx1, headName,
    tuplet: ev.tuplet, isRest: false,
  };
}

/* ---------------------------------------------------------------- beams */

function layoutBeam(members, events, indices, ts, multi, voiceIndex) {
  const items = [];
  let top = 0;
  let bottom = M.staffHeight;

  /* One direction for the whole group, set by the note furthest from centre. */
  let dir;
  if (multi) dir = voiceIndex % 2 === 0 ? 1 : -1;
  else {
    let extreme = 4;
    let best = -1;
    for (const c of members) {
      for (const n of c.notes) {
        const d = Math.abs(n.pos - 4);
        if (d > best) { best = d; extreme = n.pos; }
      }
    }
    dir = extreme > 4 ? -1 : 1;
  }

  const pts = members.map((c) => {
    const ys = c.notes.map((n) => n.y);
    const outer = dir === 1 ? Math.min(...ys) : Math.max(...ys);
    const inner = dir === 1 ? Math.max(...ys) : Math.min(...ys);
    const x = dir === 1 ? c.x + c.headW - M.stem / 2 : c.x + M.stem / 2;
    return { c, x, outer, inner };
  });

  const levelsPre = beamLevels(events, indices, 0, ts);
  const maxBeams = Math.max(...levelsPre.map((l) => l.beams));
  const step = M.beam + M.beamGap;
  /* The shortest stem in the group sets the beam's distance from the notes;
   * extra beams need extra room so the innermost one clears the noteheads. */
  const shortest = Math.max(2.75, 1.5 + (maxBeams - 1) * step);

  const first = pts[0];
  const last = pts[pts.length - 1];
  /* A beam takes up roughly half the interval it spans, never more than a
   * third of the staff, and stays gentle over a long group. */
  let rise = (last.outer - first.outer) * 0.55;
  rise = Math.max(-2.6, Math.min(2.6, rise));
  if (Math.abs(last.outer - first.outer) < 0.26) rise = 0;
  const dx = Math.max(0.01, last.x - first.x);
  let slope = rise / dx;
  const maxSlope = 0.32;
  slope = Math.max(-maxSlope, Math.min(maxSlope, slope));

  /* Slide the beam until the tightest stem is exactly `shortest`. */
  let intercept = dir === 1 ? Infinity : -Infinity;
  for (const p of pts) {
    const c = p.outer - dir * shortest - slope * p.x;
    intercept = dir === 1 ? Math.min(intercept, c) : Math.max(intercept, c);
  }
  const beamAt = (x) => slope * x + intercept;

  const levels = levelsPre;

  for (let level = 1; level <= maxBeams; level++) {
    let run = [];
    const flush = () => {
      if (!run.length) return;
      if (run.length > 1) {
        emitBeam(items, run[0].x, run[run.length - 1].x, level, dir, beamAt, step);
      } else {
        /* A lone secondary beam becomes a stub pointing at the beat. */
        const k = pts.indexOf(run[0]);
        const backwards = k === pts.length - 1 || (k > 0 && levels[k - 1].beams >= level);
        const w = 1.05;
        const x1 = backwards ? run[0].x - w : run[0].x;
        const x2 = backwards ? run[0].x : run[0].x + w;
        emitBeam(items, x1, x2, level, dir, beamAt, step);
      }
      run = [];
    };
    for (let k = 0; k < pts.length; k++) {
      const has = levels[k].beams >= level;
      const linked = k > 0 && (levels[k].continued || 0) >= level && levels[k - 1].beams >= level;
      if (!has) { flush(); continue; }
      if (run.length && !linked) flush();
      run.push(pts[k]);
    }
    flush();
  }

  /* Retarget every stem at the beam. */
  for (const p of pts) {
    const y = beamAt(p.x) + (dir === 1 ? 0 : 0);
    p.c.beamed = true;
    p.c.stemEndY = y;
    p.c.dir = dir;
    if (p.c.stemItem) {
      p.c.stemItem.x1 = p.x;
      p.c.stemItem.x2 = p.x;
      p.c.stemItem.y1 = p.inner - dir * 0.06;
      p.c.stemItem.y2 = y;
    }
    top = Math.min(top, y - 0.6);
    bottom = Math.max(bottom, y + 0.6 + (maxBeams - 1) * step);
  }
  return { items, top, bottom };
}

function emitBeam(items, x1, x2, level, dir, beamAt, step) {
  const off = (level - 1) * step * dir;
  const y1 = beamAt(x1) + off;
  const y2 = beamAt(x2) + off;
  const t = M.beam * dir;
  items.push(item('beam', {
    d: `M${r3(x1)},${r3(y1)}L${r3(x2)},${r3(y2)}L${r3(x2)},${r3(y2 + t)}L${r3(x1)},${r3(y1 + t)}Z`,
    cls: 'beam',
  }));
}

const r3 = (n) => Math.round(n * 1000) / 1000;

/* -------------------------------------------------------------- tuplets */

function layoutTuplets(chords, multi) {
  const items = [];
  const groups = new Map();
  for (const c of chords) {
    if (!c.tuplet) continue;
    if (!groups.has(c.tuplet.id)) groups.set(c.tuplet.id, []);
    groups.get(c.tuplet.id).push(c);
  }
  for (const [, g] of groups) {
    if (g.length < 2) continue;
    const dir = g.find((c) => !c.isRest)?.dir || 1;
    const above = dir === 1;
    const xs0 = Math.min(...g.map((c) => (c.x0 !== undefined ? c.x0 : c.x)));

/** Flagged rests: a slanted stem carrying one blob-and-hook per beam. */
function flagRest(count) {
  const bottom = 1.10;
  const top = bottom - 0.30 - count * 0.82;
  const xTop = 1.02;
  const xBottom = 0.30;
  const stemX = (y) => xTop + ((xBottom - xTop) * (y - top)) / (bottom - top);
  const pts = [];
  const steps = 16;
  for (let i = 0; i <= steps; i++) {
    const y = top + ((bottom - top) * i) / steps;
    pts.push([stemX(y), y, 0.145 - 0.035 * (i / steps)]);
  }
  let d = strokeOutline(pts, { capStart: 'flat' });
  for (let i = 0; i < count; i++) {
    const y = top + 0.22 + i * 0.82;
    const sx = stemX(y);
    d = joinPaths(d, circlePath(sx - 0.60, y + 0.12, 0.235));
    d = joinPaths(d, strokeOutline([
      [sx - 0.60, y + 0.12, 0.16], [sx - 0.30, y - 0.06, 0.15],
      [sx - 0.04, y - 0.12, 0.14], [sx + 0.04, y - 0.06, 0.13],
    ], { capStart: 'flat', capEnd: 'flat' }));
  }
  return d;
}

/* ------------------------------------------------------------------ flags */

/** Stem flags, drawn hanging from (0, 0) at the stem tip, pointing right. */
function flagShape(index, down) {
  const s = down ? -1 : 1;
  const y0 = index * 0.88 * s;
  const pts = [
    [0.0, y0, 0.30],
    [0.34, y0 + 0.40 * s, 0.34],
    [0.62, y0 + 0.94 * s, 0.30],
    [0.70, y0 + 1.52 * s, 0.22],
    [0.56, y0 + 2.02 * s, 0.14],
    [0.30, y0 + 2.34 * s, 0.07],
  ];
  return strokeOutline(pts, { capStart: 'flat' });
}

function flags(count, down) {
  let d = '';
  for (let i = 0; i < count; i++) d = joinPaths(d, flagShape(i, down));
  return d;
}

function zigzag(peaks, tall) {
  const pts = [];
  const w = 0.50;
  const h = tall ? 0.56 : 0.44;
  let x = -w * peaks;
  pts.push([x, h * 0.5, 0.16]);
  for (let i = 0; i < peaks; i++) {
    pts.push([x + w * 0.5, -h * 0.5, 0.18]);
    pts.push([x + w, h * 0.5, 0.16]);
    x += w;
  }
  for (let i = 0; i < peaks; i++) {
    pts.push([x + w * 0.5, -h * 0.5, 0.15]);
    pts.push([x + w, h * 0.5, 0.13]);
    x += w;
  }
  return strokeOutline(pts.slice(0, peaks * 2 + 1), { capStart: 'flat', capEnd: 'flat' });
}

/* ---------------------------------------------------------------- helpers */

function translatePath(d, dx, dy) {
  return d.replace(/(-?\d*\.?\d+),(-?\d*\.?\d+)/g, (m, x, y) =>
    `${Math.round((parseFloat(x) + dx) * 1000) / 1000},${Math.round((parseFloat(y) + dy) * 1000) / 1000}`);
}

function flipY(d) {
  return d.replace(/(-?\d*\.?\d+),(-?\d*\.?\d+)/g, (m, x, y) => `${x},${-parseFloat(y)}`);
}

    if (ev.grace) inner.push(ev.grace.slash ? '<grace slash="yes"/>' : '<grace/>');

    inner.push('</pitch>');

    if (tieStop) inner.push('<tie type="stop"/>');
    if (tieStart) inner.push('<tie type="start"/>');
    inner.push(`<voice>${voice + 1}</voice>`);
    inner.push(`<type>${type}</type>`);
    for (let d = 0; d < (ev.dots || 0); d++) inner.push('<dot/>');
    const alter = accMap.get(ev.id + ':' + ni);
    if (alter !== null && alter !== undefined && ACC_NAMES[String(alter)]) {
      inner.push(`<accidental>${ACC_NAMES[String(alter)]}</accidental>`);
    }
    if (ev.tuplet) {
      inner.push('<time-modification>');
      inner.push(`  <actual-notes>${ev.tuplet.actual}</actual-notes>`);
      inner.push(`  <normal-notes>${ev.tuplet.normal}</normal-notes>`);
      inner.push('</time-modification>');
    }
    if (ev.stemDir && ev.stemDir !== 'auto') inner.push(`<stem>${ev.stemDir}</stem>`);
    if (evStaff) inner.push(`<staff>${evStaff}</staff>`);
    if (beam && ni === 0 && info.beams > 0) inner.push(`<beam number="1">${beam}</beam>`);

    const notations = [];
    if (tieStop) notations.push('  <tied type="stop"/>');
    if (tieStart) notations.push('  <tied type="start"/>');

    if (slur && ni === 0) notations.push(`  <slur type="${slur.fromId === ev.id ? 'start' : 'stop'}" number="1"/>`);

        inner.push(`  <text>${esc(l.text)}</text>`);
        inner.push('</lyric>');

  "js/io/audiofile.js": function (__exp, __req) {
/* Cadenza — offline audio rendering and WAV encoding.
 *
 * Playback and rendering share the same synthesis code; only the audio
 * context differs, so what you export is what you heard.
 */

const { SynthEngine } = __req("js/audio/synth.js");
const { Player } = __req("js/audio/player.js");

/**
 * Render the score (or a measure range) to an AudioBuffer, faster than
 * real time.  `onProgress` is called with 0..1.
 */
async function renderScore(score, { sampleRate = 44100, fromMeasure = 0, tail = 2.5, onProgress } = {}) {
  const probe = new Player();
  probe.setScore(score);
  probe.build(fromMeasure);
  const length = Math.ceil((probe.totalTime + tail) * sampleRate);
  if (length <= 0) throw new Error('Nothing to render.');

  const OfflineCtx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const ctx = new OfflineCtx(2, length, sampleRate);
  const synth = new SynthEngine();
  synth.attach(ctx);

  const anySolo = score.parts.some((p) => p.solo);
  for (const part of score.parts) {
    const audible = anySolo ? part.solo : !part.mute;
    synth.setChannel(part.id, { volume: part.volume, pan: part.pan, mute: !audible });
  }

  /* Everything is scheduled up front; the offline context runs it all. */
  for (const e of probe.events) {
    if (e.metronome) continue;
    const part = score.parts[e.partIndex];
    if (part) {
      const audible = anySolo ? part.solo : !part.mute;
      if (!audible) continue;
    }
    synth.play({
      preset: e.preset, midi: e.midi, velocity: e.velocity, time: e.time + 0.05,
      duration: e.dur, channel: e.channel, articulation: e.articulation,
    });
  }
  if (onProgress) onProgress(0.1);
  const buffer = await ctx.startRendering();
  if (onProgress) onProgress(1);
  return buffer;
}

/** Encode an AudioBuffer as a 16-bit PCM WAV file. */
function encodeWAV(buffer) {
  const channels = buffer.numberOfChannels;
  const frames = buffer.length;
  const rate = buffer.sampleRate;
  const bytesPerSample = 2;
  const blockAlign = channels * bytesPerSample;
  const dataSize = frames * blockAlign;
  const out = new ArrayBuffer(44 + dataSize);
  const view = new DataView(out);

  const ascii = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
  ascii(0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  ascii(8, 'WAVE');
  ascii(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, channels, true);
  view.setUint32(24, rate, true);
  view.setUint32(28, rate * blockAlign, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, 16, true);
  ascii(36, 'data');
  view.setUint32(40, dataSize, true);

  const data = [];
  for (let c = 0; c < channels; c++) data.push(buffer.getChannelData(c));
  let off = 44;
  for (let i = 0; i < frames; i++) {
    for (let c = 0; c < channels; c++) {
      let s = data[c][i];
      s = s < -1 ? -1 : s > 1 ? 1 : s;
      view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      off += 2;
    }
  }
  return new Blob([out], { type: 'audio/wav' });
}

__exp.encodeWAV = encodeWAV;

  "js/io/files.js": function (__exp, __req) {
/* Cadenza — saving, loading and autosave. */

const { serialize, deserialize } = __req("js/core/model.js");
const { importMusicXML } = __req("js/io/musicxml-import.js");

const AUTOSAVE_KEY = 'cadenza.autosave.v1';
const RECENT_KEY = 'cadenza.recent.v1';

function download(filename, data, mime = 'application/octet-stream') {
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);
}

function safeName(title, ext) {
  const base = (title || 'Untitled Score').replace(/[^\w \-.]+/g, '').trim() || 'Score';
  return `${base}.${ext}`;
}

function saveScoreFile(score) {
  download(safeName(score.title, 'cadenza'), serialize(score), 'application/json');
}

/** Open a Cadenza document or a MusicXML file, picking the reader by content. */
function openScoreFile() {
  return new Promise((resolve, reject) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.cadenza,.json,.musicxml,.xml,application/json,application/vnd.recordare.musicxml+xml,text/xml';
    input.onchange = () => {
      const file = input.files && input.files[0];
      if (!file) { reject(new Error('No file chosen')); return; }
      const reader = new FileReader();
      reader.onload = () => {
        const data = String(reader.result);
        try {
          resolve({ score: parseScoreData(data, file.name), name: file.name });
        } catch (err) {
          reject(err);
        }
      };
      reader.onerror = () => reject(reader.error);
      reader.readAsText(file);
    };
    input.click();
  });
}

/** Decide the format from the content rather than trusting the extension. */
function parseScoreData(data, name = '') {
  const head = data.replace(/^\uFEFF/, '').trimStart();
  if (head.startsWith('<')) return importMusicXML(head);
  if (head.startsWith('{')) return deserialize(head);
  if (/\.musicxml$|\.xml$/i.test(name)) return importMusicXML(head);
  throw new Error('Unrecognised file format.');
}

function autosave(score) {
  try {
    localStorage.setItem(AUTOSAVE_KEY, JSON.stringify({ at: Date.now(), score }));
    return true;
  } catch {
    return false;   // quota exceeded or storage disabled
  }
}

function loadAutosave() {
  try {
    const raw = localStorage.getItem(AUTOSAVE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !parsed.score) return null;
    return { at: parsed.at, score: deserialize(parsed.score) };
  } catch {
    return null;
  }
}

function clearAutosave() {
  try { localStorage.removeItem(AUTOSAVE_KEY); } catch { /* storage disabled */ }
}

function rememberSetting(key, value) {
  try { localStorage.setItem('cadenza.pref.' + key, JSON.stringify(value)); } catch { /* ignore */ }
}

function recallSetting(key, fallback) {
  try {
    const raw = localStorage.getItem('cadenza.pref.' + key);
    return raw === null ? fallback : JSON.parse(raw);
  } catch {
    return fallback;
  }
}

__exp.download = download;
__exp.safeName = safeName;
__exp.saveScoreFile = saveScoreFile;
__exp.openScoreFile = openScoreFile;
__exp.parseScoreData = parseScoreData;
__exp.autosave = autosave;
__exp.loadAutosave = loadAutosave;
__exp.clearAutosave = clearAutosave;
__exp.rememberSetting = rememberSetting;
__exp.recallSetting = recallSetting;

/* Cadenza — modal dialogs. */

const { INSTRUMENTS, FAMILIES, ENSEMBLES, getInstrument } = __req("js/core/instruments.js");
const { TIME_SIG_PRESETS } = __req("js/core/rhythm.js");
const { keyName, CLEFS } = __req("js/core/theory.js");

const root = () => document.getElementById('modal-root');

function closeModal() {
  const r = root();
  if (r) r.innerHTML = '';
  document.dispatchEvent(new CustomEvent('cadenza:modalclosed'));
}

/**
 * Show a modal.  `build(body, close)` fills the body; `footer` returns buttons.
 * Escape and backdrop clicks close it.
 */
function modal({ title, build, footer, width = '', onClose }) {
  const r = root();
  r.innerHTML = '';
  const back = document.createElement('div');
  back.className = 'modal-backdrop';
  const box = document.createElement('div');
  box.className = 'modal ' + width;
  box.innerHTML =
    `<div class="modal-head"><h2></h2><button class="tb-btn" data-close aria-label="Close">${UI.close}</button></div>` +
    '<div class="modal-body"></div>';
  box.querySelector('h2').textContent = title;
  const body = box.querySelector('.modal-body');
  /* The key handler is registered below; closing must always remove it, or a
   * stale listener swallows the next Escape the app receives. */
  let onKey = null;
  const close = () => {
    back.remove();
    if (onKey) document.removeEventListener('keydown', onKey, true);
    onKey = null;
    if (onClose) onClose();
    document.dispatchEvent(new CustomEvent('cadenza:modalclosed'));
  };
  build(body, close);
  if (footer) {
    const foot = document.createElement('div');
    foot.className = 'modal-foot';
    footer(foot, close);
    box.appendChild(foot);
  }
  box.querySelector('[data-close]').onclick = close;
  back.appendChild(box);
  back.addEventListener('mousedown', (e) => { if (e.target === back) close(); });
  r.appendChild(back);
  onKey = (e) => {
    if (e.key === 'Escape') { e.stopPropagation(); e.preventDefault(); close(); }
  };
  document.addEventListener('keydown', onKey, true);
  const first = body.querySelector('input, select, button');
  if (first) setTimeout(() => first.focus(), 30);
  return { close, body, box };
}

function toast(message, kind = '') {
  const r = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = message;
  r.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 2400);
  setTimeout(() => el.remove(), 2800);
}

function confirmDialog({ title, message, okLabel = 'OK', danger = false }) {
  return new Promise((resolve) => {
    let done = false;
    modal({
      title,
      width: 'narrow',
      build: (body) => { body.innerHTML = `<p style="margin:0;line-height:1.6">${message}</p>`; },
      footer: (foot, close) => {
        const cancel = document.createElement('button');
        cancel.className = 'btn ghost';
        cancel.textContent = 'Cancel';
        cancel.onclick = () => { done = true; close(); resolve(false); };
        const ok = document.createElement('button');
        ok.className = 'btn primary';
        ok.textContent = okLabel;
        if (danger) ok.style.background = 'var(--danger)';
        ok.onclick = () => { done = true; close(); resolve(true); };
        foot.append(cancel, ok);
      },
      onClose: () => { if (!done) resolve(false); },
    });
  });
}

function promptDialog({ title, label, value = '', placeholder = '', multiline = false, okLabel = 'OK' }) {
  return new Promise((resolve) => {
    let done = false;
    let input;
    modal({
      title,
      width: 'narrow',
      build: (body) => {
        const wrap = document.createElement('div');
        wrap.className = 'insp-field';
        const l = document.createElement('label');
        l.textContent = label;

        input.type = 'text';
        input.value = value;
        input.placeholder = placeholder;
        wrap.append(l, input);

        input.addEventListener('keydown', (e) => {

      footer: (foot, close) => {
        const cancel = document.createElement('button');
        cancel.className = 'btn ghost';
        cancel.textContent = 'Cancel';
        cancel.onclick = () => { done = true; close(); resolve(null); };
        const ok = document.createElement('button');
        ok.className = 'btn primary';
        ok.textContent = okLabel;
        ok.onclick = () => { done = true; close(); resolve(input.value); };
        foot.append(cancel, ok);
      },
      onClose: () => { if (!done) resolve(null); },
    });
  });
}

  "js/ui/piano.js": function (__exp, __req) {
/* Cadenza — on-screen piano.
 *
 * Provides the same entry path as a MIDI keyboard for people who do not have
 * one: click or drag to sound a note, hold to build a chord.
 */

const WHITE_OFFSETS = [0, 2, 4, 5, 7, 9, 11];
const BLACK_AFTER = { 0: 1, 1: 3, 3: 6, 4: 8, 5: 10 };
const NOTE_LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];

class PianoKeyboard {
  constructor(el, opts = {}) {
    this.el = el;
    this.onNote = opts.onNote || (() => {});
    this.onRelease = opts.onRelease || (() => {});
    this.lowOctave = 2;
    this.octaves = 4;
    this.velocity = 88;
    this.down = new Set();
    this.lit = new Map();
    this.pointerDown = false;
    this.keys = new Map();
    el.addEventListener('pointerdown', (e) => this.handleDown(e));
    el.addEventListener('pointermove', (e) => this.handleMove(e));
    window.addEventListener('pointerup', () => this.handleUp());
    window.addEventListener('pointercancel', () => this.handleUp());
    el.addEventListener('contextmenu', (e) => e.preventDefault());
    this.render();
  }

  setRange(lowOctave, octaves) {
    this.lowOctave = Math.max(-1, Math.min(7, lowOctave));
    this.octaves = Math.max(1, Math.min(7, octaves));
    this.render();
  }

  shiftOctave(delta) {
    this.setRange(this.lowOctave + delta, this.octaves);
  }

  render() {
    const el = this.el;
    el.innerHTML = '';
    this.keys.clear();
    const whiteCount = this.octaves * 7 + 1;
    const w = 100 / whiteCount;
    let wi = 0;
    for (let o = 0; o < this.octaves; o++) {
      for (let s = 0; s < 7; s++) {
        const midi = (this.lowOctave + o + 1) * 12 + WHITE_OFFSETS[s];
        this.addKey(midi, 'white', wi * w, w, NOTE_LETTERS[s] + (this.lowOctave + o));
        if (BLACK_AFTER[s] !== undefined) {
          const bm = (this.lowOctave + o + 1) * 12 + BLACK_AFTER[s];
          this.addKey(bm, 'black', (wi + 1) * w - w * 0.29, w * 0.58, '');
        }
        wi++;
      }
    }
    const top = (this.lowOctave + this.octaves + 1) * 12;
    this.addKey(top, 'white', wi * w, w, 'C' + (this.lowOctave + this.octaves));
  }

  addKey(midi, kind, left, width, label) {
    const d = document.createElement('div');
    d.className = 'pkey ' + kind;
    d.style.left = left + '%';
    d.style.width = width + '%';
    d.dataset.midi = String(midi);
    if (label) d.innerHTML = `<span class="kname">${label}</span>`;
    this.el.appendChild(d);
    this.keys.set(midi, d);
  }

  midiAt(e) {
    const el = document.elementFromPoint(e.clientX, e.clientY);
    if (!el || !el.classList.contains('pkey')) return null;
    return +el.dataset.midi;
  }

  handleDown(e) {
    const midi = this.midiAt(e);
    if (midi === null) return;
    e.preventDefault();
    this.el.setPointerCapture?.(e.pointerId);
    this.pointerDown = true;
    this.press(midi, e.shiftKey || e.ctrlKey || e.metaKey);
  }

  handleMove(e) {
    if (!this.pointerDown) return;
    const midi = this.midiAt(e);
    if (midi === null || this.down.has(midi)) return;
    /* Dragging across the keys glissandos, releasing the previous note. */
    for (const m of [...this.down]) this.release(m);
    this.press(midi, false);
  }

  handleUp() {
    if (!this.pointerDown) return;
    this.pointerDown = false;
    for (const m of [...this.down]) this.release(m);
  }

  press(midi, chord) {
    this.down.add(midi);
    const k = this.keys.get(midi);
    if (k) k.classList.add('down');
    this.onNote(midi, this.velocity, chord);
  }

  release(midi) {
    this.down.delete(midi);
    const k = this.keys.get(midi);
    if (k) k.classList.remove('down');
    this.onRelease(midi);
  }

  /** Light a key from an external source (MIDI in, or playback). */
  light(midi, on) {
    const k = this.keys.get(midi);
    if (!k) return;
    k.classList.toggle('lit', !!on);
  }

  clearLights() {
    for (const k of this.keys.values()) k.classList.remove('lit');
  }
}

__exp.PianoKeyboard = PianoKeyboard;
},
  "js/ui/midi.js": function (__exp, __req) {
/* Cadenza — Web MIDI input.
 *
 * Optional: when the browser or the machine has no MIDI, the on-screen piano
 * covers the same ground, so failures here are reported and then ignored.
 */

class MidiInput {
  constructor(opts = {}) {
    this.onNoteOn = opts.onNoteOn || (() => {});
    this.onNoteOff = opts.onNoteOff || (() => {});
    this.onStatus = opts.onStatus || (() => {});
    this.onMessage = opts.onMessage || (() => {});
    this.access = null;
    this.enabled = false;
    this.inputs = [];
    this.selected = 'all';
  }

  get supported() {
    return typeof navigator !== 'undefined' && !!navigator.requestMIDIAccess;
  }

  async enable() {
    if (!this.supported) {
      this.onStatus({ state: 'unsupported', message: 'This browser does not expose Web MIDI.' });
      return false;
    }
    try {
      this.access = await navigator.requestMIDIAccess({ sysex: false });
    } catch (err) {
      this.onStatus({ state: 'denied', message: 'MIDI access was refused.' });
      return false;
    }
    this.enabled = true;
    this.access.onstatechange = () => this.refresh();
    this.refresh();
    return true;
  }

  refresh() {
    if (!this.access) return;
    this.inputs = [...this.access.inputs.values()];
    for (const input of this.inputs) {
      input.onmidimessage = (msg) => this.handle(input, msg);
    }
    this.onStatus({
      state: 'ready',
      devices: this.inputs.map((i) => ({ id: i.id, name: i.name || 'MIDI input' })),
      message: this.inputs.length
        ? `${this.inputs.length} MIDI input${this.inputs.length > 1 ? 's' : ''} connected`
        : 'No MIDI inputs found',
    });
  }

  handle(input, msg) {
    if (this.selected !== 'all' && input.id !== this.selected) return;
    /* Pass the message on untouched as well: recording wants the pedal and the
     * device's own timestamp, which is taken before the page sees the event. */
    this.onMessage(msg.data, msg.timeStamp);
    const [status, a, b] = msg.data;
    const cmd = status & 0xf0;
    if (cmd === 0x90 && b > 0) this.onNoteOn(a, b);
    else if (cmd === 0x80 || (cmd === 0x90 && b === 0)) this.onNoteOff(a);
  }

  disable() {
    for (const input of this.inputs) input.onmidimessage = null;
    this.enabled = false;
    this.onStatus({ state: 'off', message: 'MIDI input off' });
  }
}

__exp.MidiInput = MidiInput;
},

    const perBar = a.timeSig.beats * (4 / a.timeSig.beatType);
    return (time) => {
      const beats = (time - a.beat.phase) / a.beat.period;
      if (!isFinite(beats) || beats < 0) return 1;
      return Math.floor(beats / Math.max(1, perBar)) + 1;

          kind: d.kind,

      listened.note));

    seconds += ((tick - lastTick) / ticksPerQuarter) * (usPerQuarter / 1e6);
    lastTick = tick;
    return seconds;

/* Cadenza — learning from corrections.
 *
 * What this is: a handful of parameters fitted to the changes you make after
 * a transcription — an octave bias per register, how often you end up in
 * triplets, where your hands divide, whether the engine tends to hear notes
 * that were not there, and which way you spell accidentals.  Each one is an
 * online estimate with a learning rate, and each one actually changes what the
 * next transcription produces.
 *
 * What this is not: a trained model.  There is no network here and no
 * training, and calling five running averages "AI" would be a lie that makes
 * the feature sound better than it is.  The summary shown in the interface
 * says exactly what has been observed and how many times, so it can be
 * judged rather than believed.
 */

const { toMidi } = __req("js/core/theory.js");
const { eventTicks } = __req("js/core/rhythm.js");

const KEY = 'cadenza.transcribe.corrections.v1';

/* Weighted towards recent corrections without forgetting the rest: playing
 * changes, and last month's habits should not outvote this week's. */
const RATE = 0.25;

const REGISTERS = [
  { id: 'low', from: 0, to: 47 },
  { id: 'mid', from: 48, to: 71 },
  { id: 'high', from: 72, to: 127 },
];

const registerOf = (midi) => (REGISTERS.find((r) => midi >= r.from && midi <= r.to) || REGISTERS[1]).id;

function blank() {
  return {
    octave: { low: { value: 0, n: 0 }, mid: { value: 0, n: 0 }, high: { value: 0, n: 0 } },
    divisions: {},              // division -> how often it survived correction
    splitCentre: { value: 60, n: 0 },
    spurious: 0,                // notes the engine invented, as seen by deletions
    missed: 0,                  // notes it failed to hear, as seen by additions
    kept: 0,                    // notes accepted untouched
    spelling: { sharp: 0, flat: 0 },
    corrections: 0,
  };
}

class CorrectionModel {
  constructor(storage = null) {
    this.storage = storage !== null ? storage
      : (typeof localStorage !== 'undefined' ? localStorage : null);
    this.data = blank();
    this.load();
  }

  load() {
    if (!this.storage) return;
    try {
      const raw = this.storage.getItem(KEY);
      if (raw) this.data = { ...blank(), ...JSON.parse(raw) };
    } catch (err) {
      this.data = blank();
    }
  }

  save() {
    if (!this.storage) return;
    try {
      this.storage.setItem(KEY, JSON.stringify(this.data));
    } catch (err) { /* a full or disabled store is not worth failing over */ }
  }

  reset() {
    this.data = blank();
    this.save();
  }

  /** Fold one observed correction into the estimates. */
  observe(correction) {
    const d = this.data;
    switch (correction.kind) {
      case 'octave': {
        const r = registerOf(correction.midi);
        const slot = d.octave[r];
        slot.value += (correction.octaves - slot.value) * RATE;
        slot.n++;
        d.corrections++;
        break;
      }
      case 'division': {
        const key = String(correction.division);
        d.divisions[key] = (d.divisions[key] || 0) + 1;
        d.corrections++;
        break;
      }
      case 'staff': {
        /* The note moved hands, so the division between them lies on the
         * other side of it than we supposed. */
        const target = correction.toStaff === 0 ? correction.midi : correction.midi + 1;
        d.splitCentre.value += (target - d.splitCentre.value) * RATE;
        d.splitCentre.n++;
        d.corrections++;
        break;
      }
      case 'spurious': d.spurious++; d.corrections++; break;
      case 'missed': d.missed++; d.corrections++; break;
      case 'kept': d.kept += correction.count || 1; break;
      case 'spelling':
        if (correction.alter > 0) d.spelling.sharp++;
        else if (correction.alter < 0) d.spelling.flat++;
        d.corrections++;
        break;
      default: break;
    }
    this.save();
    return this;
  }

  /** The fitted parameters, with the evidence behind each one. */
  parameters() {
    const d = this.data;
    const seen = d.spurious + d.missed + d.kept;
    /* Hearing notes that were not played says the threshold is too low;
     * missing notes says it is too high.  One correction should nudge, not
     * lurch, so the shift is bounded and needs evidence to reach its limit. */
    let sensitivity = 1;
    if (seen >= 8) {
      const bias = (d.missed - d.spurious) / seen;
      sensitivity = Math.max(0.6, Math.min(1.6, 1 + bias * 0.8));
    }
    const octave = {};
    for (const r of REGISTERS) {
      const slot = d.octave[r.id];
      /* Below three observations an octave bias is one slip, not a habit. */
      octave[r.id] = slot.n >= 3 ? Math.round(slot.value) : 0;
    }
    const total = Object.values(d.divisions).reduce((a, b) => a + b, 0);
    const divisionWeights = {};
    for (const [k, v] of Object.entries(d.divisions)) divisionWeights[k] = v / total;
    return {
      sensitivity,
      octave,
      divisionWeights,
      splitCentre: d.splitCentre.n >= 3 ? Math.round(d.splitCentre.value) : 60,
      spellingLean: d.spelling.sharp === d.spelling.flat ? 0
        : d.spelling.sharp > d.spelling.flat ? 1 : -1,
      evidence: { corrections: d.corrections, notesSeen: seen },
    };
  }

  /** Transcription options adjusted by what has been learned. */
  apply(options = {}) {
    const p = this.parameters();
    const out = { ...options };
    if (options.sensitivity === undefined) out.sensitivity = p.sensitivity;
    if (options.splitCentre === undefined) out.splitCentre = p.splitCentre;
    out.divisionWeights = p.divisionWeights;
    out.octaveBias = p.octave;
    return out;
  }

  /** Move notes by the octave bias learned for their register. */
  adjust(notes) {
    const { octave } = this.parameters();
    for (const n of notes) {
      const shift = octave[registerOf(n.midi)] || 0;
      if (shift) n.midi = Math.max(0, Math.min(127, n.midi + shift * 12));
    }
    return notes;
  }

  /** A plain account of what has been observed, for showing to the user. */
  summary() {
    const p = this.parameters();
    const lines = [];
    for (const r of REGISTERS) {
      const slot = this.data.octave[r.id];
      if (slot.n >= 3 && Math.round(slot.value) !== 0) {
        const dir = slot.value > 0 ? 'up' : 'down';
        lines.push(`${r.id} notes moved ${dir} an octave ${slot.n} times — now transposed to match`);
      }
    }
    const divs = Object.entries(this.data.divisions).sort((a, b) => b[1] - a[1]);
    if (divs.length && divs[0][1] >= 3) {
      lines.push(`beats most often divided into ${divs[0][0]} (${divs[0][1]} corrections)`);
    }
    if (this.data.splitCentre.n >= 3) {
      lines.push(`hands divide around MIDI ${Math.round(this.data.splitCentre.value)} (${this.data.splitCentre.n} moves between staves)`);
    }
    if (p.evidence.notesSeen >= 8 && Math.abs(p.sensitivity - 1) > 0.02) {
      lines.push(p.sensitivity > 1
        ? `listening harder: ${this.data.missed} notes were missing against ${this.data.spurious} invented`
        : `listening more strictly: ${this.data.spurious} notes were invented against ${this.data.missed} missing`);
    }
    if (p.spellingLean) {
      lines.push(`accidentals spelled as ${p.spellingLean > 0 ? 'sharps' : 'flats'}`);
    }
    return {
      corrections: this.data.corrections,
      lines,
      empty: lines.length === 0,
    };
  }
}

/* --------------------------------------------------------------- diffing */

/** Every sounding note in a score, with where it sits. */
function flatten(score) {
  const out = [];
  for (const part of score.parts) {
    part.measures.forEach((pm, m) => {
      pm.voices.forEach((voice, v) => {
        let tick = 0;
        for (const ev of voice) {
          if (ev.type === 'note') {
            for (const n of ev.notes) {
              out.push({
                measure: m,
                tick,
                voice: v,
                staff: ev.staff === null || ev.staff === undefined
                  ? (part.staves > 1 ? v % 2 : 0) : ev.staff,
                midi: toMidi(n.pitch),
                alter: n.pitch.alter,
                duration: ev.duration,
                dots: ev.dots,
                division: ev.tuplet ? ev.tuplet.actual : null,
              });
            }
          }
          if (!ev.grace) tick += eventTicks(ev);
        }
      });
    });
  }
  return out;
}

/**
 * Work out what the user changed.
 *
 * Comparison is by position, not by identity, because editing replaces events.
 * A note in the same place an octave away is a correction of the octave; one
 * that is gone was invented; one that appeared was missed.
 */
function compareScores(before, after) {
  const a = flatten(before);
  const b = flatten(after);
  const corrections = [];
  const usedB = new Set();
  let kept = 0;

  for (const note of a) {
    let match = -1;
    let exact = -1;
    b.forEach((other, i) => {
      if (usedB.has(i)) return;
      if (other.measure !== note.measure || other.tick !== note.tick) return;
      if (other.midi === note.midi) { exact = i; return; }
      if (Math.abs(other.midi - note.midi) % 12 === 0 && match < 0) match = i;
    });
    if (exact >= 0) {
      usedB.add(exact);
      kept++;
      const moved = b[exact];
      if (moved.staff !== note.staff) {
        corrections.push({ kind: 'staff', midi: note.midi, toStaff: moved.staff });
      }
      if (moved.division && moved.division !== note.division) {
        corrections.push({ kind: 'division', division: moved.division });
      }
      if (moved.alter !== note.alter && moved.alter) {
        corrections.push({ kind: 'spelling', alter: moved.alter });
      }
      continue;
    }
    if (match >= 0) {
      usedB.add(match);
      corrections.push({
        kind: 'octave',
        midi: note.midi,
        octaves: (b[match].midi - note.midi) / 12,
      });
      continue;
    }
    corrections.push({ kind: 'spurious', midi: note.midi });
  }
  b.forEach((note, i) => {
    if (!usedB.has(i)) corrections.push({ kind: 'missed', midi: note.midi });
  });
  if (kept) corrections.push({ kind: 'kept', count: kept });
  return corrections;
}

/* Cadenza — keyboard handling.
 *
 * The shortcut set follows the conventions most notation software shares, so
 * muscle memory carries over: number keys pick a note value, letters A–G enter
 * pitches, and the arrow keys move or transpose.
 */

const SHORTCUT_HELP = [
  ['Note entry', [
    ['N', 'Toggle note input mode'],
    ['A – G', 'Enter that pitch (or retune the selected note)'],
    ['1 … 7', 'Note value: 64th, 32nd, 16th, 8th, quarter, half, whole'],
    ['.', 'Dotted note'],

    ['Shift + A–G', 'Add the pitch to the chord'],

    ['S', 'Slur over the selection'],
    ['Ctrl + 3', 'Triplet'],
    ['Esc', 'Leave note input / clear selection'],
  ]],
  ['Pitch', [
    ['↑ ↓', 'Move the note up or down a step'],
    ['Ctrl + ↑ ↓', 'Move by an octave'],
    ['+ / −', 'Raise / lower by a semitone'],
    ['=', 'Natural'],
    ['J', 'Respell enharmonically'],
  ]],
  ['Navigation', [
    ['← →', 'Previous / next note'],
    ['Shift + ← →', 'Extend the selection'],
    ['Tab', 'Next measure'],
    ['Alt + ↑ ↓', 'Previous / next staff'],
    ['Home / End', 'First / last measure'],
    ['Ctrl + A', 'Select the whole part'],
  ]],
  ['Playback', [
    ['Space', 'Play / pause'],
    ['Esc (playing)', 'Stop'],
    ['Ctrl + Space', 'Play from the selection'],
    ['M', 'Metronome'],
    ['L', 'Loop the selection'],
  ]],
  ['Editing', [
    ['Ctrl + Z', 'Undo'],
    ['Ctrl + Shift + Z', 'Redo'],
    ['Ctrl + C / X / V', 'Copy / cut / paste'],
    ['Delete', 'Delete the selection'],
    ['Ctrl + B', 'Add a measure at the end'],
    ['Ctrl + Del', 'Delete the selected measures'],
  ]],
  ['Marks', [
    ['Shift + S', 'Staccato'],
    ['Shift + T', 'Tenuto'],
    ['Shift + V', 'Accent'],
    ['Shift + M', 'Marcato'],
    [';', 'Fermata'],
    ['Shift + R', 'Trill'],
    ['H / Shift + H', 'Crescendo / diminuendo'],
    ['Ctrl + E', 'Expression text'],
    ['Ctrl + L', 'Lyrics'],
    ['Ctrl + K', 'Chord symbol'],
    ['Ctrl + G', 'Figured bass'],
  ]],
  ['File & view', [
    ['Ctrl + S', 'Save'],
    ['Ctrl + O', 'Open'],
    ['Ctrl + P', 'Print / PDF'],
    ['Ctrl + = / −', 'Zoom in / out'],
    ['Ctrl + 0', 'Reset zoom'],
    ['?', 'Show this list'],
  ]],
];

const DURATION_KEYS = {
  1: '64th', 2: '32nd', 3: '16th', 4: 'eighth', 5: 'quarter', 6: 'half', 7: 'whole',
};

function inTextField(e) {
  const t = e.target;
  if (!t) return false;
  const tag = t.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || t.isContentEditable;

  document.addEventListener('keydown', (e) => {
    if (inTextField(e)) return;
    if (document.getElementById('modal-root').children.length && e.key !== 'Escape') return;
    const mod = e.ctrlKey || e.metaKey;
    const k = e.key;
    const lower = typeof k === 'string' ? k.toLowerCase() : '';

    /* --- file and global ------------------------------------------------ */
    if (mod && lower === 's' && !e.shiftKey) { e.preventDefault(); app.act('save'); return; }
    if (mod && lower === 'o') { e.preventDefault(); app.act('open'); return; }
    if (mod && lower === 'p') { e.preventDefault(); app.act('print'); return; }
    if (mod && lower === 'n' && e.shiftKey) { e.preventDefault(); app.act('new'); return; }
    if (mod && (k === '=' || k === '+')) { e.preventDefault(); app.zoom(1); return; }
    if (mod && (k === '-' || k === '_')) { e.preventDefault(); app.zoom(-1); return; }
    if (mod && k === '0') { e.preventDefault(); app.setZoom(4); return; }
    if (mod && lower === 'z') { e.preventDefault(); e.shiftKey ? app.act('redo') : app.act('undo'); return; }
    if (mod && lower === 'y') { e.preventDefault(); app.act('redo'); return; }
    if (mod && lower === 'c') { e.preventDefault(); app.act('copy'); return; }
    if (mod && lower === 'x') { e.preventDefault(); app.act('cut'); return; }
    if (mod && lower === 'v') { e.preventDefault(); app.act('paste'); return; }
    if (mod && lower === 'a') { e.preventDefault(); app.act('selectAll'); return; }
    if (mod && lower === 'b') { e.preventDefault(); app.act('appendMeasure'); return; }
    if (mod && lower === 'e') { e.preventDefault(); app.act('text:expression'); return; }
    if (mod && lower === 'l') { e.preventDefault(); app.act('lyric'); return; }
    if (mod && lower === 'k') { e.preventDefault(); app.act('chordSymbol'); return; }
    if (mod && lower === 'g') { e.preventDefault(); app.act('figuredBass'); return; }
    if (mod && e.altKey && lower === 'v') { e.preventDefault(); app.act('voice'); return; }
    if (mod && (k === 'Delete' || k === 'Backspace')) { e.preventDefault(); app.act('deleteMeasure'); return; }
    if (mod && k === 'Insert') { e.preventDefault(); app.act('insertMeasure'); return; }
    if (mod && ['3', '5', '6', '7', '9'].includes(k)) { e.preventDefault(); app.act('tuplet:' + k); return; }
    if (k === '?' || (e.shiftKey && k === '/')) { e.preventDefault(); app.act('help'); return; }

    if (k === ' ') {
      e.preventDefault();
      app.act(mod ? 'playFromSelection' : 'playPause');
      return;

    if (k === 'Escape') {
      e.preventDefault();
      if (app.player.state === 'playing') app.act('stop');
      else if (app.noteEntry) app.setNoteEntry(false);
      else app.clearSelection();
      return;

    /* --- navigation (before the modifier guard: Ctrl and Shift both bind) -- */
    if (k === 'ArrowUp' || k === 'ArrowDown') {
      e.preventDefault();

      if (mod && e.shiftKey) app.act('crossStaff:' + (dir > 0 ? 'up' : 'down'));
      else if (e.altKey) app.moveStaff(-dir);
      else if (mod) app.act('octave:' + (dir > 0 ? 'up' : 'down'));
      else app.stepPitch(dir);
      return;
    }
    if (k === 'ArrowLeft' || k === 'ArrowRight') {
      e.preventDefault();
      app.navigate(k === 'ArrowRight' ? 1 : -1, { extend: e.shiftKey });
      return;
    }

    if (mod) return;   // leave remaining browser shortcuts alone

    /* --- note values ---------------------------------------------------- */
    if (DURATION_KEYS[k]) { e.preventDefault(); app.act('dur:' + DURATION_KEYS[k]); return; }
    if (k === '.') { e.preventDefault(); app.act('dot:1'); return; }
    if (k === ',') { e.preventDefault(); app.act('dot:2'); return; }
    if (k === '0') { e.preventDefault(); app.act('rest'); return; }

    /* --- pitch entry ---------------------------------------------------- */
    if (/^[a-g]$/.test(lower) && !e.altKey) {
      e.preventDefault();
      app.enterLetter(lower, { chord: e.shiftKey });
      return;
    }

    /* --- marks ---------------------------------------------------------- */
    if (e.shiftKey) {
      const marks = { s: 'art:staccato', t: 'art:tenuto', v: 'art:accent', m: 'art:marcato', r: 'orn:trill', h: 'hairpin:dim' };
      if (marks[lower]) { e.preventDefault(); app.act(marks[lower]); return; }
    }
    if (k === ';') { e.preventDefault(); app.act('art:fermata'); return; }
    if (lower === 'n') { e.preventDefault(); app.act('noteEntry'); return; }
    if (lower === 't') { e.preventDefault(); app.act('tie'); return; }
    if (lower === 's') { e.preventDefault(); app.act('slur'); return; }
    if (lower === 'h') { e.preventDefault(); app.act('hairpin:cresc'); return; }
    if (lower === 'j') { e.preventDefault(); app.act('respell'); return; }
    if (lower === 'm') { e.preventDefault(); app.act('metronome'); return; }
    if (lower === 'l') { e.preventDefault(); app.act('loop'); return; }
    if (k === '/') { e.preventDefault(); app.act('grace'); return; }
    if (k === '+' || k === ']') { e.preventDefault(); app.act('alter:1'); return; }
    if (k === '-' || k === '[') { e.preventDefault(); app.act('alter:-1'); return; }
    if (k === '=') { e.preventDefault(); app.act('acc:0'); return; }

    if (k === 'Tab') { e.preventDefault(); app.navigateMeasure(e.shiftKey ? -1 : 1); return; }
    if (k === 'Home') { e.preventDefault(); app.gotoMeasure(0); return; }
    if (k === 'End') { e.preventDefault(); app.gotoMeasure(app.score.measures.length - 1); return; }
    if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); app.act('delete'); return; }
    if (k === 'Enter') { e.preventDefault(); app.act('appendMeasure'); return; }
  });
}

__exp.installShortcuts = installShortcuts;
__exp.SHORTCUT_HELP = SHORTCUT_HELP;
