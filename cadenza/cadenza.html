<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadenza — Music Notation</title>
<meta name="description" content="A notation and composition workstation that runs in the browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8E%BC%3C/text%3E%3C/svg%3E">
<style>
/* Cadenza — application chrome.
 * Dark tooling around a light page, so the score reads as paper. */

:root {
  --bg: #14161b;
  --panel: #1b1e25;
  --panel-2: #22262f;
  --panel-3: #2a2f3a;
  --line: #2e3441;
  --line-soft: #262b35;
  --text: #d3d8e0;
  --text-dim: #868e9e;
  --text-faint: #5d6473;
  --accent: #5b8def;
  --accent-soft: rgba(91, 141, 239, .18);
  --accent-2: #e8a33d;
  --accent-2-soft: rgba(232, 163, 61, .18);
  --danger: #e0564e;
  --ok: #4bbd8a;
  --paper: #fff;
  --ink: #16181c;
  --sel: #2f6fe0;
  --radius: 6px;
  --ribbon-h: 72px;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --serif: Georgia, "Times New Roman", serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 13px/1.45 var(--font);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, select { font: inherit; color: inherit; }
.hidden { display: none !important; }

#app {
  display: grid;
  grid-template-rows: 44px auto auto 1fr 46px auto 24px;
  height: 100%;
}

/* ------------------------------------------------------------- top bar */

#topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 0 12px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.brand {
  font-weight: 600; letter-spacing: .3px; font-size: 14px;
  display: flex; align-items: center; gap: 7px; white-space: nowrap;
}
.brand-mark { color: var(--accent); font-size: 17px; }
.doc-title-wrap { flex: 1; display: flex; align-items: baseline; gap: 10px; justify-content: center; min-width: 0; }
.doc-title {
  background: transparent; border: 1px solid transparent; border-radius: 5px;
  padding: 3px 8px; font-size: 14px; font-weight: 600; text-align: center;
  max-width: 380px; min-width: 90px; width: 260px;
}
.doc-composer {
  background: transparent; border: 1px solid transparent; border-radius: 5px;
  padding: 3px 8px; font-size: 12px; color: var(--text-dim); text-align: center;
  width: 150px; font-style: italic;
}
.doc-title:hover, .doc-composer:hover { border-color: var(--line); }
.doc-title:focus, .doc-composer:focus { outline: 0; border-color: var(--accent); background: var(--panel-2); }

.tb-group { display: flex; align-items: center; gap: 3px; }
.tb-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px; border-radius: 5px; color: var(--text-dim);
  white-space: nowrap; font-size: 12px;
}
.tb-btn:hover { background: var(--panel-2); color: var(--text); }
.tb-btn:disabled { opacity: .35; cursor: default; }
.tb-btn:disabled:hover { background: none; color: var(--text-dim); }
.tb-btn.on { background: var(--accent-soft); color: #a9c6ff; }
.tb-btn .gi { font-size: 15px; line-height: 1; }

/* -------------------------------------------------------------- ribbon */

#ribbon {
  display: flex; align-items: stretch; flex-wrap: wrap; gap: 0;
  background: var(--panel-2);
  border-bottom: 1px solid var(--line);
}
.grp {
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 4px 9px 2px; border-right: 1px solid var(--line-soft);
  border-bottom: 1px solid var(--line-soft); flex: 0 0 auto;
}
.grp-row { display: flex; align-items: center; gap: 2px; }
.grp-label {
  font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--text-faint); text-align: center; padding-top: 3px; user-select: none;
}
.rb {
  min-width: 27px; height: 29px; padding: 0 4px; border-radius: 5px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--text-dim); position: relative;
}
.rb:hover { background: var(--panel-3); color: var(--text); }
.rb.on { background: var(--accent-soft); color: #a9c6ff; box-shadow: inset 0 0 0 1px rgba(91,141,239,.4); }
.rb.wide { padding: 0 9px; font-size: 12px; gap: 5px; }
.rb svg { display: block; }
.rb .lbl { font-size: 11.5px; }
.rb.dur svg { width: 22px; height: 26px; }
.rb.sym svg { width: 20px; height: 24px; }
.rb:disabled { opacity: .3; cursor: default; }
.rb:disabled:hover { background: none; }
.sepv { width: 1px; background: var(--line-soft); margin: 4px 5px; align-self: stretch; }

/* The one button that starts everything, and the one that brings music in. */
.rb.primary {
  background: var(--accent); color: #fff; padding: 0 12px; gap: 6px; height: 31px;
  font-weight: 600; box-shadow: 0 1px 0 rgba(0,0,0,.25);
}
.rb.primary:hover { background: #6d9bf2; color: #fff; }
.rb.primary.on {
  background: var(--ok); color: #06231a; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);
}
.rb.accent {
  background: var(--accent-2-soft); color: var(--accent-2); padding: 0 12px; gap: 6px; height: 31px;
  box-shadow: inset 0 0 0 1px rgba(232,163,61,.35); font-weight: 600;
}
.rb.accent:hover { background: rgba(232,163,61,.3); color: #ffcf86; }
.grp-more .rb { padding: 0 8px; gap: 5px; }
.grp-end { margin-left: auto; border-right: 0; }

/* ------------------------------------------------------------- palettes */

#palettes {
  max-height: 0; overflow: hidden; background: var(--panel);
  border-bottom: 1px solid var(--line); transition: max-height .16s ease;
}
#palettes.open { max-height: 220px; overflow: auto; }
.palette { display: flex; flex-wrap: wrap; gap: 0; padding: 2px 0; }
.palette.hidden { display: none; }
.pal-grp { padding: 7px 12px 8px; border-right: 1px solid var(--line-soft); }
.pal-grp-label {
  font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--text-faint); padding-bottom: 5px; user-select: none;
}
.pal-row { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }

/* A bar where playing the score back disagreed with the recording. */
.bar-flag { fill: rgba(232, 163, 61, .14); stroke: rgba(232, 163, 61, .5); stroke-width: .12; }

/* A note the transcription was unsure of, so the eye goes there first. */
.uncertain { outline: none; }
.uncertain path, .uncertain ellipse, .uncertain circle, .uncertain rect {
  fill: #b8791f;
}
.uncertain line, .uncertain polyline { stroke: #b8791f; }

/* ----------------------------------------------------------- coach marks */

.coach-layer { position: fixed; inset: 0; z-index: 60; background: rgba(8,10,14,.62); }
.coach-ring {
  position: absolute; border: 2px solid var(--accent-2); border-radius: 8px;
  box-shadow: 0 0 0 4px rgba(232,163,61,.22); pointer-events: none;
}
.coach-mark {
  position: absolute; max-width: 290px; background: var(--accent-2); color: #1a1205;
  font-size: 12.5px; font-weight: 600; line-height: 1.35; padding: 8px 11px;
  border-radius: 7px; box-shadow: 0 6px 20px rgba(0,0,0,.45); pointer-events: none;
}
.coach-done {
  position: absolute; left: 50%; bottom: 42px; transform: translateX(-50%);
  background: var(--panel-3); color: var(--text); padding: 9px 20px; border-radius: 7px;
  font-size: 13px; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,.5);
}
.coach-done:hover { background: var(--accent); color: #fff; }

/* Play and Stop are named, not guessed at. */
.tp-btn.labelled { width: auto; padding: 0 13px; gap: 6px; }
.tp-btn.labelled span { font-size: 12.5px; font-weight: 600; }

/* ------------------------------------------------------ transcribe panel */

.modal.wide { width: min(860px, 94vw); }
.tr-lead { color: var(--text-dim); margin: 0 0 14px; font-size: 13px; line-height: 1.5; }
.tr-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tr-choice {
  display: grid; grid-template-columns: 34px 1fr; grid-template-rows: auto auto;
  gap: 2px 12px; text-align: left; padding: 14px; border-radius: 9px;
  background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line);
}
.tr-choice:hover { background: var(--panel-3); box-shadow: inset 0 0 0 1px var(--accent); }
.tr-choice-icon { grid-row: 1 / 3; align-self: center; color: var(--accent); }
.tr-choice-icon svg { width: 24px; height: 24px; }
.tr-choice-title { font-size: 13.5px; font-weight: 600; color: var(--text); }
.tr-choice-sub { font-size: 11.5px; color: var(--text-dim); }
.tr-honest {
  margin-top: 14px; padding: 11px 13px; border-radius: 8px; background: var(--panel-2);
  font-size: 11.8px; line-height: 1.55; color: var(--text-dim);
}
.tr-honest b { color: var(--text); }
.tr-learned {
  margin-top: 10px; padding: 10px 13px; border-radius: 8px;
  background: rgba(75,189,138,.08); box-shadow: inset 0 0 0 1px rgba(75,189,138,.25);
  font-size: 11.8px; color: var(--text-dim);
}
.tr-learned b { color: var(--ok); }
.tr-learned ul { margin: 6px 0 6px 16px; padding: 0; }
.linkish { color: var(--accent); text-decoration: underline; font-size: 11.5px; padding: 0; }

.tr-record { text-align: center; padding: 26px 0 10px; }
.tr-level {
  height: 10px; border-radius: 5px; background: var(--panel-3); overflow: hidden;
  margin: 0 auto 18px; max-width: 420px;
}
.tr-level-fill { display: block; height: 100%; width: 0; background: var(--ok); transition: width .06s linear; }
.tr-clock { font: 600 30px/1 var(--mono); color: var(--text); letter-spacing: .04em; }
.tr-notecount { font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
.tr-record-actions { display: flex; gap: 10px; justify-content: center; margin-top: 8px; }

.tr-progress { text-align: center; padding: 40px 0; }
.tr-spinner {
  width: 30px; height: 30px; margin: 0 auto 16px; border-radius: 50%;
  border: 3px solid var(--panel-3); border-top-color: var(--accent);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.tr-progress-text { font-size: 13px; color: var(--text-dim); margin-bottom: 14px; }
.tr-progress-track {
  height: 6px; border-radius: 3px; background: var(--panel-3);
  max-width: 340px; margin: 0 auto; overflow: hidden;
}
.tr-progress-fill { display: block; height: 100%; background: var(--accent); transition: width .2s; }

.tr-result { display: grid; grid-template-columns: 1fr 300px; gap: 18px; }
.tr-headline { font-size: 14px; line-height: 1.7; color: var(--text-dim); margin-bottom: 14px; }
.tr-headline b { color: var(--text); font-size: 15px; }
.tr-meters { display: flex; flex-direction: column; gap: 6px; }
.tr-meter { display: grid; grid-template-columns: 54px 1fr 38px; align-items: center; gap: 8px; font-size: 11.5px; }
.tr-meter-label { color: var(--text-dim); }
.tr-meter-track { height: 7px; border-radius: 4px; background: var(--panel-3); overflow: hidden; }
.tr-meter-fill { display: block; height: 100%; }
.tr-meter-fill.good { background: var(--ok); }
.tr-meter-fill.fair { background: var(--accent-2); }
.tr-meter-fill.poor { background: var(--danger); }
.tr-meter-value { text-align: right; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.tr-meter-note { grid-column: 2 / 4; font-size: 10.5px; color: var(--text-faint); }
.tr-shaky {
  margin-top: 14px; padding: 10px 12px; border-radius: 7px; font-size: 12px;
  background: var(--accent-2-soft); color: var(--accent-2);
}
.tr-shaky.good { background: rgba(75,189,138,.1); color: var(--ok); }
.tr-faint { color: var(--text-faint); }
.tr-tweaks { border-left: 1px solid var(--line); padding-left: 18px; }
.tr-tweaks h3 { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--text-faint); margin: 0 0 10px; }
.tr-field { display: block; margin-bottom: 12px; font-size: 12px; }
.tr-field > span { display: block; color: var(--text-dim); margin-bottom: 3px; }
.tr-field small { display: block; color: var(--text-faint); font-size: 10.5px; margin-top: 3px; line-height: 1.4; }
.tr-field select, .tr-field input[type=number] {
  width: 100%; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 5px; padding: 5px 7px;
}
.tr-field input[type=range] { width: 100%; }
.tr-check { display: grid; grid-template-columns: 1fr auto; align-items: center; }
.tr-check small { grid-column: 1 / 3; }
.tr-actions { display: flex; align-items: center; gap: 10px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.tr-spacer { flex: 1; }
.tr-actions .btn svg { vertical-align: -3px; margin-right: 4px; }

/* --------------------------------------------- transcribe: setup and result */

.tr-setup { display: flex; flex-direction: column; gap: 16px; }
.tr-group h3 {
  font-size: 11px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--text-faint); margin: 0 0 2px;
}
.tr-group-tip { margin: 0 0 8px; font-size: 11.5px; color: var(--text-faint); }
.tr-group-items { display: flex; flex-wrap: wrap; gap: 7px; }
.tr-pill {
  padding: 8px 15px; border-radius: 18px; background: var(--panel-2);
  box-shadow: inset 0 0 0 1px var(--line); font-size: 12.5px;
}
.tr-pill:hover { background: var(--panel-3); box-shadow: inset 0 0 0 1px var(--accent); color: var(--text); }
.tr-pill.small { padding: 5px 11px; font-size: 11.5px; border-radius: 14px; }
.tr-presets { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
.tr-or { font-size: 11px; color: var(--text-faint); margin-bottom: 8px; }
.tr-chosen { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; margin-bottom: 12px; }
.tr-chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 6px 5px 11px;
  border-radius: 14px; background: var(--accent-soft); color: #a9c6ff; font-size: 12px;
}
.tr-chip button { color: inherit; font-size: 14px; line-height: 1; padding: 0 3px; }
.tr-catalogue { max-height: 240px; overflow: auto; padding-right: 4px; }
.tr-catalogue h4 {
  font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--text-faint); margin: 10px 0 5px;
}
.tr-forwhat {
  display: flex; align-items: center; gap: 8px; margin-bottom: 14px; padding: 9px 12px;
  border-radius: 7px; background: var(--panel-2); font-size: 12.5px; color: var(--text-dim);
}
.tr-forwhat b { color: var(--text); }

.tr-steps { list-style: none; margin: 0; padding: 0; max-width: 320px; margin: 0 auto; }
.tr-steps li {
  display: flex; align-items: center; gap: 10px; padding: 5px 0;
  font-size: 12.5px; color: var(--text-faint); transition: color .2s;
}
.tr-steps li.doing { color: var(--text); }
.tr-steps li.done { color: var(--text-dim); }
.tr-tick {
  width: 15px; height: 15px; border-radius: 50%; flex: 0 0 auto;
  box-shadow: inset 0 0 0 1.5px var(--line); position: relative;
}
.tr-steps li.done .tr-tick { background: var(--ok); box-shadow: none; }
.tr-steps li.done .tr-tick::after {
  content: ''; position: absolute; left: 4.5px; top: 2px; width: 4px; height: 8px;
  border: solid #06231a; border-width: 0 1.8px 1.8px 0; transform: rotate(42deg);
}
.tr-steps li.doing .tr-tick {
  box-shadow: inset 0 0 0 1.5px var(--accent);
  border-top: 2px solid var(--accent); animation: spin .8s linear infinite;
}
.tr-step-note { margin-left: auto; font-size: 10.5px; color: var(--text-faint); }

.tr-verified {
  margin: 12px 0; padding: 10px 12px; border-radius: 7px; font-size: 11.8px;
  line-height: 1.55; background: rgba(75,189,138,.08);
  box-shadow: inset 0 0 0 1px rgba(75,189,138,.25); color: var(--text-dim);
}
.tr-verified b { color: var(--ok); }
.tr-players { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; font-size: 11.5px; color: var(--text-dim); }
.tr-player b { color: var(--text); }
.tr-ab { display: flex; align-items: center; gap: 8px; margin: 14px 0; flex-wrap: wrap; }
.tr-ab-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-faint); }
.tr-ab .btn svg { vertical-align: -3px; margin-right: 3px; }
.tr-simplified {
  margin-top: 12px; padding: 9px 12px; border-radius: 7px; font-size: 11.8px;
  line-height: 1.5; background: var(--panel-2); color: var(--text-dim);
}
.tr-simplified b { color: var(--text); }
.tr-simplified ul { margin: 5px 0 0 16px; padding: 0; }
.tr-issues { margin-top: 12px; font-size: 12px; }
.tr-issues > b { display: block; margin-bottom: 6px; }
.tr-issues ul { list-style: none; margin: 0 0 6px; padding: 0; }
.tr-issue {
  padding: 5px 9px; border-radius: 5px; margin-bottom: 3px; cursor: pointer;
  background: var(--accent-2-soft); color: var(--accent-2);
}
.tr-issue:hover { background: rgba(232,163,61,.3); }
.tr-issue.uncertain { background: var(--panel-2); color: var(--text-dim); }
.tr-warn { margin-right: 4px; }

@media (max-width: 820px) {
  .tr-choices { grid-template-columns: 1fr; }
  .tr-result { grid-template-columns: 1fr; }
  .tr-tweaks { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 14px; }
}

/* ------------------------------------------------------------ workspace */

#workspace { display: grid; grid-template-columns: 232px 1fr 250px; min-height: 0; }
#left-panel, #right-panel {
  background: var(--panel); display: flex; flex-direction: column; min-height: 0;
}
#left-panel { border-right: 1px solid var(--line); }
#right-panel { border-left: 1px solid var(--line); }
.panel-tabs { display: flex; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
.ptab {
  flex: 1; padding: 8px 6px; font-size: 11.5px; color: var(--text-faint);
  border-bottom: 2px solid transparent;
}
.ptab:hover { color: var(--text); }
.ptab.active { color: var(--text); border-bottom-color: var(--accent); background: var(--panel-2); }
.panel-body { flex: 1; overflow-y: auto; padding: 8px; min-height: 0; }
.panel-body::-webkit-scrollbar, #score-scroll::-webkit-scrollbar { width: 9px; height: 9px; }
.panel-body::-webkit-scrollbar-thumb, #score-scroll::-webkit-scrollbar-thumb {
  background: var(--panel-3); border-radius: 5px;
}

.sec-title {
  font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--text-faint); margin: 10px 2px 5px;
}
.sec-title:first-child { margin-top: 2px; }

/* instrument list */
.part-row {
  display: flex; align-items: center; gap: 7px; padding: 6px 7px;
  border-radius: 5px; cursor: pointer; margin-bottom: 2px;
}
.part-row:hover { background: var(--panel-2); }
.part-row.sel { background: var(--accent-soft); }
.part-row .pname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.part-row .pfam { font-size: 10px; color: var(--text-faint); }
.mini {
  width: 20px; height: 19px; border-radius: 4px; font-size: 9.5px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--panel-3); color: var(--text-faint);
}
.mini:hover { color: var(--text); }
.mini.on { background: var(--accent); color: #fff; }
.mini.solo.on { background: var(--accent-2); color: #241a08; }

/* mixer */
.mix-row { padding: 7px 6px; border-bottom: 1px solid var(--line-soft); }
.mix-head { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
.mix-head .pname { flex: 1; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mix-ctl { display: flex; align-items: center; gap: 7px; }
.mix-ctl label { font-size: 9.5px; color: var(--text-faint); width: 22px; }
input[type=range] {
  -webkit-appearance: none; appearance: none; height: 3px; border-radius: 2px;
  background: var(--panel-3); flex: 1; outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
  background: var(--text-dim); cursor: pointer; border: 0;
}
input[type=range]::-webkit-slider-thumb:hover { background: var(--accent); }
input[type=range]::-moz-range-thumb {
  width: 12px; height: 12px; border-radius: 50%; background: var(--text-dim); border: 0; cursor: pointer;
}

/* inspector */
.insp-field { margin-bottom: 9px; }
.insp-field > label {
  display: block; font-size: 10px; color: var(--text-faint);
  text-transform: uppercase; letter-spacing: .06em; margin-bottom: 3px;
}
.insp-value { font-size: 12.5px; }
.insp-row { display: flex; gap: 5px; flex-wrap: wrap; }
.chip {
  padding: 4px 8px; border-radius: 4px; background: var(--panel-2);
  font-size: 11.5px; color: var(--text-dim); border: 1px solid var(--line);
}
.chip:hover { color: var(--text); border-color: var(--panel-3); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: #a9c6ff; }
select, input[type=text], input[type=number] {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px;
  padding: 5px 7px; width: 100%; font-size: 12px;
}
select:focus, input[type=text]:focus, input[type=number]:focus { outline: 0; border-color: var(--accent); }
.empty-note { color: var(--text-faint); font-size: 12px; line-height: 1.6; padding: 6px 2px; }
kbd {
  font: 11px/1 var(--mono); background: var(--panel-3); color: var(--text);
  border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
  padding: 3px 5px; white-space: nowrap;
}
.key-table { width: 100%; border-collapse: collapse; }
.key-table td { padding: 3px 2px; font-size: 11.5px; vertical-align: top; }
.key-table td:first-child { width: 88px; }
.key-table tr:hover td { color: #fff; }

/* --------------------------------------------------------------- score */

#score-area { position: relative; min-width: 0; background: #3c414b; }
#score-scroll { position: absolute; inset: 0; overflow: auto; outline: none; padding: 26px 20px 40px; }
#score-pages { display: flex; flex-direction: column; align-items: center; gap: 22px; }
.score-page {
  background: var(--paper); box-shadow: 0 3px 16px rgba(0, 0, 0, .45);
  display: block; flex: 0 0 auto;
}
.score-page .pagebg { fill: var(--paper); }
.score-page .ink { fill: var(--ink); }
.score-page .l { stroke: var(--ink); stroke-linecap: butt; }
.score-page text { fill: var(--ink); }
.score-page .beam, .score-page .tie, .score-page .slur { fill: var(--ink); }
.score-page .rehearsal rect { stroke: var(--ink); fill: none; }
.score-page .measnum { fill: #8d8d93; }
.score-page .multirest, .score-page .multirest-num { fill: var(--ink); }
.score-page .partname { fill: #33373d; }
.score-page .staffline { stroke: #1c1f24; }

.score-page .sel { fill: var(--sel) !important; }
.score-page .sel.l, .score-page line.sel { stroke: var(--sel) !important; }
.score-page .hovered { fill: #6f96e8; }
.cursor-rect { fill: var(--accent-2); opacity: .16; }
.entry-caret { fill: var(--accent-2); opacity: .85; }
.play-line { stroke: var(--danger); stroke-width: .22; opacity: .9; }
.play-measure { fill: var(--danger); opacity: .09; }
.loop-band { fill: var(--accent); opacity: .09; }

#score-empty {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 12px; color: var(--text-dim); pointer-events: none;
}

/* ----------------------------------------------------------- transport */

#transport {
  display: flex; align-items: center; gap: 16px; padding: 0 12px;
  background: var(--panel); border-top: 1px solid var(--line);
}
.tp-left, .tp-right { display: flex; align-items: center; gap: 3px; }
.tp-mid { flex: 1; display: flex; align-items: center; gap: 18px; justify-content: center; }
.tp-btn {
  width: 34px; height: 30px; border-radius: 5px; display: inline-flex;
  align-items: center; justify-content: center; color: var(--text-dim);
}
.tp-btn:hover { background: var(--panel-2); color: var(--text); }
.tp-btn.primary { background: var(--accent); color: #fff; width: 42px; }
.tp-btn.primary:hover { background: #6f9cf5; }
.tp-btn.on { background: var(--accent-soft); color: #a9c6ff; }
.tp-field { display: flex; align-items: center; gap: 8px; }
.tp-field label { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); }
#tempo-slider { width: 128px; }
#tempo-input { width: 54px; text-align: center; padding: 3px; }
.tp-field .unit { font-size: 10.5px; color: var(--text-faint); }
.tp-position {
  font: 600 14px/1 var(--mono); color: var(--text); background: var(--panel-2);
  padding: 6px 11px; border-radius: 5px; min-width: 74px; text-align: center;
  border: 1px solid var(--line);
}
.tp-position .sep { color: var(--text-faint); margin: 0 2px; }

/* --------------------------------------------------------- piano bar */

#piano-bar {
  background: var(--panel-2); border-top: 1px solid var(--line);
  display: flex; align-items: stretch; height: 116px; overflow: hidden;
}
#piano-bar.collapsed { height: 0; border-top: 0; }
.pb-controls {
  width: 190px; flex: 0 0 auto; padding: 8px 10px; border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 6px; justify-content: center;
}
.pb-row { display: flex; align-items: center; gap: 6px; }
.pb-row label { font-size: 10px; color: var(--text-faint); width: 42px; }
.pb-keys { flex: 1; position: relative; overflow: hidden; }
.pkey {
  position: absolute; top: 0; border-radius: 0 0 3px 3px; cursor: pointer;
  user-select: none; -webkit-user-select: none;
}
.pkey.white { background: linear-gradient(#fbfbfa, #e8e7e3); border: 1px solid #9aa0a8; height: 100%; z-index: 1; }
.pkey.black { background: linear-gradient(#3a3f49, #15181d); border: 1px solid #0b0d10; height: 62%; z-index: 2; }
.pkey.white.down, .pkey.white.lit { background: linear-gradient(#bcd3ff, #8fb4f6); }
.pkey.black.down, .pkey.black.lit { background: linear-gradient(#5b8def, #33539a); }
.pkey .kname {
  position: absolute; bottom: 3px; left: 0; right: 0; text-align: center;
  font-size: 8.5px; color: #7a808b; pointer-events: none;
}
.pkey.black .kname { color: #6a7280; }

/* -------------------------------------------------------- status bar */

#status-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 0 12px; background: var(--panel); border-top: 1px solid var(--line);
  font-size: 11.5px; color: var(--text-faint);
}
#status-hint b { color: var(--text-dim); font-weight: 500; }
#status-hint kbd { font-size: 10px; padding: 1px 4px; border-bottom-width: 1px; }

/* ------------------------------------------------------------ tooltip */

#tooltip {
  position: fixed; z-index: 900; background: #0e1014; color: var(--text);
  border: 1px solid var(--line); border-radius: 5px; padding: 6px 9px;
  font-size: 11.5px; pointer-events: none; max-width: 260px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .5); line-height: 1.45;
}
#tooltip .tk { color: var(--text-faint); margin-left: 7px; font-family: var(--mono); font-size: 10.5px; }

/* ------------------------------------------------------------- modals */

.modal-backdrop {
  position: fixed; inset: 0; background: rgba(8, 9, 12, .68); z-index: 1000;
  display: flex; align-items: center; justify-content: center; padding: 24px;
  backdrop-filter: blur(2px);
}
.modal {
  background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
  box-shadow: 0 18px 60px rgba(0, 0, 0, .6); width: 100%; max-width: 620px;
  max-height: 88vh; display: flex; flex-direction: column; overflow: hidden;
}
.modal.wide { max-width: 860px; }
.modal.narrow { max-width: 420px; }
.modal-head {
  padding: 14px 18px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.modal-body { padding: 16px 18px; overflow-y: auto; }
.modal-foot {
  padding: 12px 18px; border-top: 1px solid var(--line);
  display: flex; justify-content: flex-end; gap: 8px; background: var(--panel-2);
}
.btn {
  padding: 7px 15px; border-radius: 5px; background: var(--panel-3);
  color: var(--text); font-size: 12.5px; border: 1px solid var(--line);
}
.btn:hover { background: #333a46; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #6f9cf5; }
.btn.ghost { background: none; border-color: transparent; color: var(--text-dim); }
.btn.ghost:hover { color: var(--text); background: var(--panel-2); }

.field-grid { display: grid; grid-template-columns: 118px 1fr; gap: 9px 12px; align-items: center; }
.field-grid > label { font-size: 12px; color: var(--text-dim); }
.ens-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 7px; }
.ens-card {
  padding: 10px 11px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--panel-2); text-align: left;
}
.ens-card:hover { border-color: var(--panel-3); }
.ens-card.on { border-color: var(--accent); background: var(--accent-soft); }
.ens-card .en { font-size: 12.5px; font-weight: 500; display: block; margin-bottom: 2px; }
.ens-card .ec { font-size: 10.5px; color: var(--text-faint); }

.inst-picker { display: grid; grid-template-columns: 150px 1fr; gap: 12px; min-height: 300px; }
.inst-fams { border-right: 1px solid var(--line); padding-right: 10px; }
.inst-fam { display: block; width: 100%; text-align: left; padding: 6px 8px; border-radius: 5px; font-size: 12px; color: var(--text-dim); }
.inst-fam:hover { background: var(--panel-2); color: var(--text); }
.inst-fam.on { background: var(--accent-soft); color: #a9c6ff; }
.inst-list { max-height: 330px; overflow-y: auto; }
.inst-item { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 7px 9px; border-radius: 5px; font-size: 12.5px; }
.inst-item:hover { background: var(--panel-2); }
.inst-item .rng { font-size: 10px; color: var(--text-faint); font-family: var(--mono); }

#toast-root { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); z-index: 1200; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.toast {
  background: #0e1014; border: 1px solid var(--line); border-radius: 6px;
  padding: 8px 14px; font-size: 12.5px; box-shadow: 0 8px 26px rgba(0,0,0,.5);
  animation: toastin .18s ease;
}
.toast.err { border-color: var(--danger); color: #ffb9b5; }
.toast.ok { border-color: var(--ok); }
@keyframes toastin { from { opacity: 0; transform: translateY(6px); } }

#app.loading #workspace, #app.loading #ribbon { opacity: .3; pointer-events: none; }
#app.loading #palettes { display: none; }

/* Compact layout: fold the side panels away on small screens. */
@media (max-width: 1180px) {
  #workspace { grid-template-columns: 196px 1fr 0; }
  #right-panel { display: none; }
}
@media (max-width: 900px) {
  #workspace { grid-template-columns: 0 1fr 0; }
  #left-panel { display: none; }
  .doc-composer { display: none; }
}

@media print {
  #topbar, #ribbon, #palettes, #left-panel, #right-panel, #transport, #piano-bar, #status-bar { display: none !important; }
  #app { display: block; height: auto; }
  #score-area, #score-scroll { position: static; overflow: visible; background: #fff; padding: 0; }
  #score-pages { gap: 0; }
  .score-page { box-shadow: none; page-break-after: always; }
  body { background: #fff; overflow: visible; }
}

/* The record of how a transcription was arrived at: every stage, in order.
   Folded away by default — it is for when something is wrong. */
.tr-trace { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.tr-trace > summary {
  cursor: pointer; font-weight: 600; color: var(--text);
  padding: 4px 0; list-style: none; user-select: none;
}
.tr-trace > summary::before { content: '▸ '; color: var(--muted); }
.tr-trace[open] > summary::before { content: '▾ '; }
.tr-trace > summary::-webkit-details-marker { display: none; }
.tr-stage { margin: 10px 0 0; }
.tr-stage b { display: block; color: var(--text); font-size: 12px; }
.tr-trace .tr-faint { color: var(--text-faint); font-size: 11px; }
.tr-stage pre {
  margin: 4px 0 0; padding: 7px 9px; overflow-x: auto;
  background: var(--bg); border: 1px solid var(--line-soft); border-radius: 5px;
  font: 11px/1.55 var(--mono);
  color: var(--text); white-space: pre;
}

</style>

<div id="app" class="loading">

  <header id="topbar">

  <nav id="ribbon" aria-label="Editing tools"></nav>

  <main id="workspace">
    <aside id="left-panel">
      <div class="panel-tabs" id="left-tabs">
        <button class="ptab active" data-tab="parts">Instruments</button>
        <button class="ptab" data-tab="mixer">Mixer</button>
      </div>
      <div class="panel-body" id="parts-panel"></div>
      <div class="panel-body hidden" id="mixer-panel"></div>

      <div id="score-scroll" tabindex="0" aria-label="Score">
        <div id="score-pages"></div>
      </div>
      <div id="score-empty" class="hidden"></div>
    </div>

    <aside id="right-panel">
      <div class="panel-tabs">
        <button class="ptab active" data-tab="inspector">Properties</button>
        <button class="ptab" data-tab="help">Shortcuts</button>
      </div>
      <div class="panel-body" id="inspector-panel"></div>
      <div class="panel-body hidden" id="help-panel"></div>
    </aside>
  </main>

  <footer id="transport">
    <div class="tp-left" id="tp-buttons"></div>
    <div class="tp-mid">
      <div class="tp-field">
        <label for="tempo-slider">Tempo</label>

        <span class="unit">bpm</span>

    </div>

  <section id="piano-bar">

  <div id="status-bar">
    <span id="status-hint">Loading…</span>
    <span id="status-right"></span>
  </div>

  <div id="tooltip" role="tooltip" hidden></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
</div>

            list.push({
              page: pi, x: sys.x + mm.x, y: sys.top ?? sys.y, w: mm.width,
              h: sys.height, sys, mm, runFrom: mm.index, runTo: last,
            });
            this.measureRects.set(m, list);
          }
        }
      }
    });
  }

  pageSVG(index) {
    return this.el.pages.querySelector(`svg[data-page="${index}"]`);
  }

  /* ----------------------------------------------------------- selection */

  paintSelection() {
    this.el.pages.querySelectorAll('.sel').forEach((n) => n.classList.remove('sel'));
    this.el.pages.querySelectorAll('.loop-band').forEach((n) => n.remove());
    for (const id of this.selection) {
      this.el.pages.querySelectorAll(`[data-ev="${id}"]`).forEach((n) => n.classList.add('sel'));
    }
    if (this.measureSel) {
      for (let m = this.measureSel.from; m <= this.measureSel.to; m++) {
        for (const r of this.measureRects.get(m) || []) {
          const svg = this.pageSVG(r.page);
          const ov = svg && svg.querySelector('.overlay');
          if (!ov) continue;
          ov.insertAdjacentHTML('beforeend',
            `<rect class="loop-band" x="${r.x}" y="${r.y - 1}" width="${r.w}" height="${r.h + 2}"/>`);
        }
      }
    }
  }

  select(ids, { add = false } = {}) {
    if (!add) this.selection.clear();
    for (const id of Array.isArray(ids) ? ids : [ids]) if (id) this.selection.add(id);
    this.measureSel = null;
    this.paintSelection();
    this.buildInspector();
    this.setHint();
  }

  selectMeasures(partIndex, from, to) {
    this.selection.clear();
    const a = Math.min(from, to);
    const b = Math.max(from, to);
    this.measureSel = { partIndex, from: a, to: b };
    for (const id of Edit.eventsInRange(this.score, partIndex, a, b)) this.selection.add(id);
    this.render();
  }

  clearSelection() {
    this.selection.clear();
    this.measureSel = null;
    this.paintSelection();
    this.buildInspector();
  }

  get selectedIds() { return [...this.selection]; }

  firstSelected() {
    const id = this.selectedIds[0];
    return id ? Model.locateEvent(this.score, id) : null;
  }

  /* -------------------------------------------------------- entry cursor */

  paintCursor() {
    const svgs = this.el.pages.querySelectorAll('svg');
    svgs.forEach((s) => s.querySelectorAll('.entry-caret,.cursor-rect').forEach((n) => n.remove()));
    if (!this.noteEntry) return;
    const rect = this.cursorRect();
    if (!rect) return;
    const svg = this.pageSVG(rect.page);
    const ov = svg && svg.querySelector('.overlay');
    if (!ov) return;
    ov.insertAdjacentHTML('beforeend',
      `<rect class="entry-caret" x="${rect.x - 0.1}" y="${rect.y - 1.1}" width="0.22" height="${Metrics.staffHeight + 2.2}"/>` +
      `<rect class="cursor-rect" x="${rect.x - 0.9}" y="${rect.y - 1.1}" width="2.4" height="${Metrics.staffHeight + 2.2}"/>`);
  }

  /** Where the entry cursor sits on the page, in staff spaces. */
  cursorRect() {
    const rects = this.measureRects.get(this.cursor.measure);
    if (!rects || !rects.length) return null;
    const r = rects[0];
    const staffY = this.staffYFor(r, this.cursor.partIndex, this.cursor.staff);
    if (staffY === null) return null;
    const x = this.tickToX(r, this.cursor.tick);
    return { page: r.page, x, y: staffY };
  }

  staffYFor(rect, partIndex, staff) {
    const s = (rect.sys.staves || []).find((k) => k.partIndex === partIndex && k.staff === staff);
    if (s) return s.y;
    const any = (rect.sys.staves || []).find((k) => k.partIndex === partIndex);
    return any ? any.y : (rect.sys.staves && rect.sys.staves[0] ? rect.sys.staves[0].y : null);
  }

  tickToX(rect, tick) {
    const mm = rect.mm;
    const cols = mm.columns || [];
    if (cols.length) {
      let best = cols[0];
      for (const c of cols) if (c.tick <= tick) best = c;
      const next = cols.find((c) => c.tick > tick);
      if (next && next.tick > best.tick) {
        const f = (tick - best.tick) / (next.tick - best.tick);
        return rect.sys.x + best.x + (next.x - best.x) * f;
      }
      const area = mm.noteArea || { start: 0, end: mm.width };
      const total = measureTicks(Model.timeSigAt(this.score, mm.index));
      if (tick > best.tick && total > best.tick) {
        const f = (tick - best.tick) / (total - best.tick);
        return rect.sys.x + best.x + (area.end - best.x) * f;
      }
      return rect.sys.x + best.x;
    }
    const area = mm.noteArea || { start: mm.x, end: mm.x + mm.width };
    const total = measureTicks(Model.timeSigAt(this.score, mm.index));
    return rect.sys.x + area.start + ((area.end - area.start) * tick) / Math.max(1, total);
  }

  setCursor(next, { scroll = false } = {}) {
    this.cursor = { ...this.cursor, ...next };
    this.paintCursor();
    this.setHint();
    if (scroll) this.scrollCursorIntoView();
  }

  scrollCursorIntoView() {
    const r = this.cursorRect();
    if (!r) return;
    const svg = this.pageSVG(r.page);
    if (!svg) return;
    const sp = this.spatiumPx;
    const box = svg.getBoundingClientRect();
    const scr = this.el.scroll.getBoundingClientRect();
    const y = box.top + r.y * sp - scr.top + this.el.scroll.scrollTop;
    if (y < this.el.scroll.scrollTop + 40 || y > this.el.scroll.scrollTop + scr.height - 90) {
      this.el.scroll.scrollTo({ top: Math.max(0, y - scr.height / 2), behavior: 'smooth' });
    }
  }

  /* --------------------------------------------------------- hit testing */

  /** Convert a pointer event into score coordinates. */
  locate(e) {
    const svg = e.target.closest ? e.target.closest('svg.score-page') : null;
    if (!svg) return null;
    const page = +svg.dataset.page;
    const pt = svg.createSVGPoint();
    pt.x = e.clientX;
    pt.y = e.clientY;
    const ctm = svg.getScreenCTM();
    if (!ctm) return null;
    const p = pt.matrixTransform(ctm.inverse());
    const pg = this.layout.pages[page];
    if (!pg) return null;

    let sys = null;
    for (const s of pg.systems) {
      const top = (s.top ?? s.y) - 6;
      const bottom = (s.top ?? s.y) + s.height + 6;
      if (p.y >= top && p.y <= bottom) { sys = s; break; }
    }
    if (!sys) {
      /* Fall back to the nearest system so clicks in the gutter still work. */
      let best = null;
      let bestD = Infinity;
      for (const s of pg.systems) {
        const d = Math.abs(p.y - ((s.top ?? s.y) + s.height / 2));
        if (d < bestD) { bestD = d; best = s; }
      }
      sys = best;
    }
    if (!sys) return null;

    let staff = null;
    let bestD = Infinity;
    for (const k of sys.staves || []) {
      const centre = k.y + Metrics.staffHeight / 2;
      const d = Math.abs(p.y - centre);
      if (d < bestD) { bestD = d; staff = k; }
    }
    if (!staff) return null;

    let mm = sys.measures[0];
    for (const m of sys.measures) if (sys.x + m.x <= p.x + 0.5) mm = m;

    const rect = { page, x: sys.x + mm.x, y: staff.y, w: mm.width, sys, mm };
    const tick = this.xToTick(rect, p.x);
    const posStep = Math.round((8 - (p.y - staff.y) * 2));
    const clefId = Model.clefAt(this.score, this.score.parts[staff.partIndex], mm.index, staff.staff);
    const dia = Theory.diatonicAtPos(posStep, clefId);
    const base = Theory.fromDiatonic(dia);
    const fifths = Model.writtenFifths(this.score, this.score.parts[staff.partIndex], mm.index);
    const alter = Theory.keyAlterations(this.score.concertPitch ? Model.keySigAt(this.score, mm.index).fifths : fifths)[base.step];
    return {
      page, x: p.x, y: p.y, sys, measure: mm.index, mm,
      partIndex: staff.partIndex, staff: staff.staff, staffY: staff.y,
      tick, staffPos: posStep, pitch: Theory.pitch(base.step, base.octave, alter),
    };
  }

  xToTick(rect, x) {
    const mm = rect.mm;
    const total = measureTicks(Model.timeSigAt(this.score, mm.index));
    const cols = mm.columns || [];
    const rel = x - rect.sys.x;
    const area = mm.noteArea || { start: mm.x, end: mm.x + mm.width };
    let tick;
    if (cols.length > 1) {
      let prev = cols[0];
      let next = null;
      for (const c of cols) {
        if (c.x <= rel) prev = c; else { next = c; break; }
      }
      const endX = next ? next.x : area.end;
      const endT = next ? next.tick : total;
      const span = Math.max(0.01, endX - prev.x);
      tick = prev.tick + ((rel - prev.x) / span) * (endT - prev.tick);
    } else {
      const span = Math.max(0.01, area.end - area.start);
      tick = ((rel - area.start) / span) * total;
    }
    /* Snap to the grid implied by the current note value. */
    const grid = Math.max(60, durationTicks(this.duration, 0));
    const snapped = Math.round(tick / grid) * grid;
    return Math.max(0, Math.min(total - 1, snapped));
  }

  /* ------------------------------------------------------ score pointer */

  bindScoreEvents() {
    const scroll = this.el.scroll;
    scroll.addEventListener('pointerdown', (e) => this.onScorePointerDown(e));
    scroll.addEventListener('dblclick', (e) => this.onScoreDoubleClick(e));
    scroll.addEventListener('wheel', (e) => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        this.zoom(e.deltaY < 0 ? 1 : -1);
      }
    }, { passive: false });
    scroll.addEventListener('mousemove', (e) => this.onScoreHover(e));
  }

  onScoreHover(e) {
    const el = e.target.closest && e.target.closest('[data-ev]');
    this.el.pages.querySelectorAll('.hovered').forEach((n) => n.classList.remove('hovered'));
    if (el && !this.selection.has(el.dataset.ev)) {
      this.el.pages.querySelectorAll(`[data-ev="${el.dataset.ev}"]`).forEach((n) => n.classList.add('hovered'));
    }
  }

  onScorePointerDown(e) {
    if (e.button !== 0) return;
    this.el.scroll.focus({ preventScroll: true });
    const hit = e.target.closest && e.target.closest('[data-ev]');
    const loc = this.locate(e);

    if (this.noteEntry && loc) {
      /* In note-entry mode a click writes a note where you clicked. */
      this.setCursor({
        partIndex: loc.partIndex, staff: loc.staff, measure: loc.measure,
        tick: loc.tick, voice: this.voiceForStaff(loc.partIndex, loc.staff),
      });
      this.enterPitch(loc.pitch, { chord: e.shiftKey });
      return;
    }

    if (hit) {
      const id = hit.dataset.ev;
      if (e.shiftKey && this.anchorEvent) this.selectRangeTo(id);
      else this.select(id, { add: e.metaKey || e.ctrlKey });
      this.anchorEvent = id;
      const loc2 = Model.locateEvent(this.score, id);
      if (loc2) {
        this.setCursor({
          partIndex: loc2.partIndex, measure: loc2.measure, voice: loc2.voice,
          staff: this.staffForVoice(loc2.part, loc2.voice),
          tick: Model.tickAt(loc2.part.measures[loc2.measure].voices[loc2.voice], loc2.index),
        });
        if (loc2.event.type === 'note') this.previewEvent(loc2);
      }
      return;
    }

    if (loc) {
      const kind = e.target.dataset ? e.target.dataset.k : null;
      if (kind === 'timesig') { this.openTimeSignature(loc.measure); return; }
      if (kind === 'keysig') { this.openKeySignature(loc.measure); return; }
      if (kind === 'clef') { this.openClef(loc.measure, loc.partIndex, loc.staff); return; }
      if (kind === 'tempo') { this.openTempo(loc.measure); return; }
      if (e.shiftKey && this.measureSel && this.measureSel.partIndex === loc.partIndex) {
        this.selectMeasures(loc.partIndex, this.measureSel.from, loc.measure);
      } else {
        this.selectMeasures(loc.partIndex, loc.measure, loc.measure);
      }
      this.setCursor({
        partIndex: loc.partIndex, staff: loc.staff, measure: loc.measure,
        tick: loc.tick, voice: this.voiceForStaff(loc.partIndex, loc.staff),
      });
      return;
    }
    this.clearSelection();
  }

  onScoreDoubleClick(e) {
    const loc = this.locate(e);
    if (!loc) return;
    if (!this.noteEntry) {
      this.setNoteEntry(true);
      this.setCursor({
        partIndex: loc.partIndex, staff: loc.staff, measure: loc.measure,
        tick: loc.tick, voice: this.voiceForStaff(loc.partIndex, loc.staff),
      });
    }
  }

  selectRangeTo(id) {
    const a = Model.locateEvent(this.score, this.anchorEvent);
    const b = Model.locateEvent(this.score, id);
    if (!a || !b || a.partIndex !== b.partIndex) { this.select(id); return; }
    const ids = [];
    const lo = Math.min(a.measure, b.measure);
    const hi = Math.max(a.measure, b.measure);
    for (let m = lo; m <= hi; m++) {
      const voice = b.part.measures[m].voices[b.voice] || [];
      for (const ev of voice) {
        const before = m === lo && a.measure === lo && voice.indexOf(ev) < Math.min(a.index, b.index) && a.measure === b.measure;
        if (!before) ids.push(ev.id);
      }
    }
    this.select(ids);
  }

  voiceForStaff(partIndex, staff) {
    const part = this.score.parts[partIndex];
    if (!part || (part.staves || 1) < 2) return 0;
    return staff === 1 ? 1 : 0;
  }

  staffForVoice(part, voice) {
    if ((part.staves || 1) < 2) return 0;
    return voice % 2 === 0 ? 0 : 1;
  }

  previewEvent(loc) {
    if (loc.event.type !== 'note') return;
    const inst = getInstrument(loc.part.instrumentId);
    for (const n of loc.event.notes) {
      this.player.preview(Theory.toMidi(Model.soundingPitch(loc.part, n.pitch)), {
        preset: loc.part.synth || inst.synth, velocity: 80, duration: 0.45,
      });
    }
  }

  /* ==================================================================== */
  /*  Chrome: top bar, ribbon, transport, panels                          */
  /* ==================================================================== */

  buildTopBar() {
    const left = document.getElementById('file-actions');
    const right = document.getElementById('top-right');
    const mk = (act, icon, tip, key, label) => {
      const b = document.createElement('button');
      b.className = 'tb-btn';
      b.dataset.act = act;
      b.innerHTML = icon + (label ? `<span>${label}</span>` : '');
      b.dataset.tip = tip;
      if (key) b.dataset.key = key;
      b.onclick = () => this.act(act);
      return b;
    };
    left.append(
      mk('new', UI.new, 'New score', 'Ctrl Shift N', 'New'),
      mk('open', UI.open, 'Open a Cadenza file', 'Ctrl O', 'Open'),
      mk('save', UI.save, 'Save to a file', 'Ctrl S', 'Save'),
      mk('exportMenu', UI.export, 'Export MusicXML, MIDI, audio, SVG', '', 'Export'),
      mk('setup', UI.print, 'Score setup: title, page size, staff size', '', 'Setup'),
    );
    right.append(
      mk('undo', UI.undo, 'Undo', 'Ctrl Z'),
      mk('redo', UI.redo, 'Redo', 'Ctrl Shift Z'),
      mk('zoomOut', UI.zoomOut, 'Zoom out', 'Ctrl -'),
      mk('zoomIn', UI.zoomIn, 'Zoom in', 'Ctrl +'),
      mk('help', UI.help, 'Keyboard shortcuts', '?'),
    );
    this.undoBtn = right.querySelector('[data-act=undo]');
    this.redoBtn = right.querySelector('[data-act=redo]');
  }

  /**
   * The toolbar, and the palettes under it.
   *
   * The bar holds what is used constantly.  Everything else is one click away
   * behind a named heading, which is not the same as being hidden: a palette
   * says what it contains before you open it, and closes again when you are
   * done with it.
   */
  buildRibbon() {
    const bar = this.el.ribbon;
    bar.innerHTML = '';

    const button = (it) => {
      const b = document.createElement('button');
      b.className = 'rb' + (it.wide ? ' wide' : '') + (it.primary ? ' primary' : '');
      b.dataset.act = it.act;
      b.dataset.tip = it.tip;
      if (it.key) b.dataset.key = it.key;
      b.innerHTML = this.iconFor(it.icon) + (it.label ? `<span class="lbl">${it.label}</span>` : '');
      b.onclick = () => this.act(it.act);
      return b;
    };

    for (const grp of ESSENTIALS) {
      const g = document.createElement('section');
      g.className = 'grp';
      const row = document.createElement('div');
      row.className = 'grp-row';
      for (const it of grp.items) row.appendChild(button(it));
      g.appendChild(row);
      if (grp.label) {
        const label = document.createElement('div');
        label.className = 'grp-label';
        label.textContent = grp.label;
        g.appendChild(label);
      }
      bar.appendChild(g);
    }

    /* The palettes, named so nothing has to be hunted for. */
    const more = document.createElement('section');
    more.className = 'grp grp-more';
    const row = document.createElement('div');
    row.className = 'grp-row';
    for (const pal of PALETTES) {
      const b = document.createElement('button');
      b.className = 'rb pal-tab';
      b.dataset.pal = pal.id;
      b.dataset.tip = pal.tip;
      b.innerHTML = this.iconFor(pal.icon) + `<span class="lbl">${pal.label}</span>`;
      b.onclick = () => this.togglePalette(pal.id);
      row.appendChild(b);
    }
    more.appendChild(row);
    const label = document.createElement('div');
    label.className = 'grp-label';
    label.textContent = 'More';
    more.appendChild(label);
    bar.appendChild(more);

    /* Transcribe sits on its own at the end: it is a different kind of act
     * from everything to its left — it brings music in rather than editing
     * what is there. */
    const end = document.createElement('section');
    end.className = 'grp grp-end';
    const endRow = document.createElement('div');
    endRow.className = 'grp-row';
    const tb = document.createElement('button');
    tb.className = 'rb wide accent';
    tb.dataset.act = 'transcribe';
    tb.dataset.tip = 'Turn a recording, a MIDI file or your playing into notation';
    tb.innerHTML = UI.transcribe + '<span class="lbl">Transcribe</span>';
    tb.onclick = () => this.act('transcribe');
    endRow.appendChild(tb);
    end.appendChild(endRow);
    bar.appendChild(end);

    this.buildPalettes();
    this.refreshChrome();
  }

  buildPalettes() {
    const host = this.el.palette;
    if (!host) return;
    host.innerHTML = '';
    for (const pal of PALETTES) {
      const sheet = document.createElement('div');
      sheet.className = 'palette hidden';
      sheet.dataset.pal = pal.id;
      for (const grp of pal.groups) {
        const g = document.createElement('section');
        g.className = 'pal-grp';
        const head = document.createElement('div');
        head.className = 'pal-grp-label';
        head.textContent = grp.label;
        const row = document.createElement('div');
        row.className = 'pal-row';
        for (const it of grp.items) {
          const b = document.createElement('button');
          b.className = 'rb' + (it.wide ? ' wide' : '');
          b.dataset.act = it.act;
          b.dataset.tip = it.tip;
          if (it.key) b.dataset.key = it.key;
          b.innerHTML = this.iconFor(it.icon) + (it.label ? `<span class="lbl">${it.label}</span>` : '');
          b.onclick = () => this.act(it.act);
          row.appendChild(b);
        }
        g.append(head, row);
        sheet.appendChild(g);
      }
      host.appendChild(sheet);
    }
  }

  togglePalette(id) {
    const next = this.openPaletteId === id ? null : id;
    this.openPaletteId = next;
    for (const sheet of this.el.palette.querySelectorAll('.palette')) {
      sheet.classList.toggle('hidden', sheet.dataset.pal !== next);
    }
    for (const tab of this.el.ribbon.querySelectorAll('.pal-tab')) {
      tab.classList.toggle('on', tab.dataset.pal === next);
    }
    this.el.palettes.classList.toggle('open', !!next);
    Files.rememberSetting('palette', next || '');
    this.scheduleRender();
  }

  iconFor(spec) {
    const [kind, a, b] = String(spec).split(':');
    if (kind === 'note') return noteIcon(a, b ? +b : 0, { size: 24 });
    if (kind === 'glyph') return glyphIcon(a, { size: 21 });
    if (kind === 'dyn') return dynamicIcon(a, { size: 19 });
    return UI[a] || '';
  }

  buildTransport() {
    const left = document.getElementById('tp-buttons');
    const right = document.getElementById('tp-toggles');
    const mk = (act, icon, tip, key, cls = 'tp-btn') => {
      const b = document.createElement('button');
      b.className = cls;
      b.dataset.act = act;
      b.dataset.tip = tip;
      if (key) b.dataset.key = key;
      b.innerHTML = icon;
      b.onclick = () => this.act(act);
      return b;
    };
    left.append(
      mk('rewind', UI.rewind, 'Return to the beginning', 'Home'),
      mk('playPause', UI.play + '<span>Play</span>', 'Play the score from the cursor', 'Space', 'tp-btn primary labelled'),
      mk('stop', UI.stop + '<span>Stop</span>', 'Stop and return to where playback began', 'Esc', 'tp-btn labelled'),
    );
    this.playBtn = left.querySelector('[data-act=playPause]');
    right.append(
      mk('metronome', UI.metronome, 'Metronome click', 'M'),
      mk('countIn', UI.countin, 'Count-in bar before playback'),
      mk('loop', UI.loop, 'Loop the selected measures', 'L'),
      mk('togglePiano', UI.keyboard, 'Show or hide the piano keyboard'),
      mk('midi', UI.midi, 'Connect a MIDI keyboard'),
    );

    const sync = (v) => {
      const bpm = Math.max(20, Math.min(300, Math.round(v)));
      this.el.tempoSlider.value = bpm;
      this.el.tempoInput.value = bpm;
      Edit.setTempo(this, 0, bpm, this.score.measures[0].tempo?.unit || 'quarter',
        this.score.measures[0].tempo?.text ?? Model.tempoText(bpm));
      this.player.invalidate();
      this.scheduleRender();
    };
    this.el.tempoSlider.addEventListener('input', (e) => sync(+e.target.value));
    this.el.tempoInput.addEventListener('change', (e) => sync(+e.target.value));
  }

  buildPianoBar() {
    const c = this.el.pbControls;
    c.innerHTML = `
      <div class="pb-row"><label>Octave</label>
        <button class="mini" data-oct="-1">&minus;</button>
        <span id="pb-oct" style="font-size:11px;width:34px;text-align:center">C2–C6</span>
        <button class="mini" data-oct="1">+</button></div>
      <div class="pb-row"><label>Level</label>
        <input id="pb-vel" type="range" min="16" max="127" value="88"></div>
      <div class="pb-row">
        <button class="mini" id="pb-mode" style="width:auto;padding:0 8px">Preview</button>
        <span style="font-size:10px;color:var(--text-faint)">click keys to hear</span></div>`;
    this.piano = new PianoKeyboard(this.el.pianoKeys, {
      onNote: (midi, vel, chord) => this.onPianoNote(midi, vel, chord),
    });
    const label = c.querySelector('#pb-oct');
    const syncLabel = () => {
      label.textContent = `C${this.piano.lowOctave}–C${this.piano.lowOctave + this.piano.octaves}`;
    };
    c.querySelectorAll('[data-oct]').forEach((b) => {
      b.onclick = () => { this.piano.shiftOctave(+b.dataset.oct); syncLabel(); };
    });
    c.querySelector('#pb-vel').oninput = (e) => { this.piano.velocity = +e.target.value; };
    const mode = c.querySelector('#pb-mode');
    mode.onclick = () => {
      this.pianoInserts = !this.pianoInserts;
      mode.textContent = this.pianoInserts ? 'Insert' : 'Preview';
      mode.classList.toggle('on', this.pianoInserts);
      this.setHint();
    };
    syncLabel();
  }

  onPianoNote(midi, velocity, chord) {
    const part = this.score.parts[this.cursor.partIndex] || this.score.parts[0];
    const inst = getInstrument(part.instrumentId);
    this.player.preview(midi, { preset: part.synth || inst.synth, velocity, duration: 0.7 });
    if (this.pianoInserts || this.noteEntry) {
      const written = Model.writtenPitch(part, this.midiToPitch(midi, part));
      this.enterPitch(written, { chord, silent: true });
    }
  }

  /** Spell a MIDI number using the key in force, so entry reads correctly. */
  midiToPitch(midi, part) {
    const fifths = Model.keySigAt(this.score, this.cursor.measure).fifths;
    const pc = ((midi % 12) + 12) % 12;
    const SHARP_PC = { 0: [0, 0], 2: [1, 0], 4: [2, 0], 5: [3, 0], 7: [4, 0], 9: [5, 0], 11: [6, 0], 1: [0, 1], 3: [1, 1], 6: [3, 1], 8: [4, 1], 10: [5, 1] };
    const FLAT_PC = { 0: [0, 0], 2: [1, 0], 4: [2, 0], 5: [3, 0], 7: [4, 0], 9: [5, 0], 11: [6, 0], 1: [1, -1], 3: [2, -1], 6: [4, -1], 8: [5, -1], 10: [6, -1] };
    const [step, alter] = (fifths < 0 ? FLAT_PC : SHARP_PC)[pc];
    const natural = Theory.STEP_SEMITONES[step];
    let octave = Math.floor(midi / 12) - 1;
    if (natural + alter !== pc) octave += (natural + alter > pc) ? -1 : 1;
    return Theory.pitch(step, octave, alter);
  }

  bindPanelTabs() {
    document.querySelectorAll('.panel-tabs').forEach((tabs) => {
      tabs.querySelectorAll('.ptab').forEach((tab) => {
        tab.onclick = () => {
          tabs.querySelectorAll('.ptab').forEach((t) => t.classList.remove('active'));
          tab.classList.add('active');
          const panel = tabs.parentElement;
          panel.querySelectorAll('.panel-body').forEach((b) => b.classList.add('hidden'));
          const map = {
            parts: 'parts-panel', mixer: 'mixer-panel',
            inspector: 'inspector-panel', help: 'help-panel',
          };
          const target = document.getElementById(map[tab.dataset.tab]);
          if (target) target.classList.remove('hidden');
        };
      });
    });
    this.buildParts();
    this.buildMixer();
  }

  bindTitleFields() {
    this.el.title.addEventListener('change', () => {
      this.history.begin('Title');
      this.history.touchAll();
      this.score.title = this.el.title.value;
      this.history.commit();
      this.scheduleRender();
    });
    this.el.composer.addEventListener('change', () => {
      this.history.begin('Composer');
      this.history.touchAll();
      this.score.composer = this.el.composer.value;
      this.history.commit();
      this.scheduleRender();
    });
  }

  initTooltips() {
    const tip = this.el.tooltip;
    let timer = null;
    const show = (el) => {
      const text = el.dataset.tip;
      if (!text) return;
      const key = el.dataset.key;
      tip.innerHTML = `<span></span>${key ? `<span class="tk">${key}</span>` : ''}`;
      tip.firstChild.textContent = text;
      tip.hidden = false;
      const r = el.getBoundingClientRect();
      const t = tip.getBoundingClientRect();
      let x = r.left + r.width / 2 - t.width / 2;
      x = Math.max(6, Math.min(window.innerWidth - t.width - 6, x));
      let y = r.bottom + 7;
      if (y + t.height > window.innerHeight - 6) y = r.top - t.height - 7;
      tip.style.left = x + 'px';
      tip.style.top = y + 'px';
    };
    document.addEventListener('mouseover', (e) => {
      const el = e.target.closest && e.target.closest('[data-tip]');
      clearTimeout(timer);
      if (!el) { tip.hidden = true; return; }
      timer = setTimeout(() => show(el), 320);
    });
    document.addEventListener('mouseout', () => { clearTimeout(timer); tip.hidden = true; });
    document.addEventListener('mousedown', () => { clearTimeout(timer); tip.hidden = true; });
  }

  /** Listen to raw MIDI as well as the note events, for recording. */
  onMidi(fn) { this.midiTaps.add(fn); }

  offMidi(fn) { this.midiTaps.delete(fn); }

  async initMidi() {
    this.midi = new MidiInput({
      onMessage: (data, stamp) => { for (const fn of this.midiTaps) fn(data, stamp); },
      onNoteOn: (midi, vel) => {
        this.midiHeld.add(midi);
        this.piano.light(midi, true);
        this.onPianoNote(midi, vel, this.midiHeld.size > 1);
      },
      onNoteOff: (midi) => {
        this.midiHeld.delete(midi);
        this.piano.light(midi, false);
      },
      onStatus: (s) => {
        this.midiStatus = s;
        const btn = document.querySelector('[data-act=midi]');
        if (btn) btn.classList.toggle('on', s.state === 'ready' && (s.devices || []).length > 0);
        if (s.state === 'ready') Dlg.toast(s.message, (s.devices || []).length ? 'ok' : '');
        else if (s.message) Dlg.toast(s.message, 'err');
      },
    });
  }

  /* ------------------------------------------------------------- panels */

  buildParts() {
    const p = this.el.parts;
    if (!p) return;
    p.innerHTML = '<div class="sec-title">Instruments</div>';
    this.score.parts.forEach((part, i) => {
      const row = document.createElement('div');
      row.className = 'part-row' + (this.cursor.partIndex === i ? ' sel' : '');
      const inst = getInstrument(part.instrumentId);
      row.innerHTML = `<span class="pname"></span><span class="pfam"></span>` +
        `<button class="mini" data-a="up" data-tip="Move up">&uarr;</button>` +
        `<button class="mini" data-a="del" data-tip="Remove instrument">&times;</button>`;
      row.querySelector('.pname').textContent = part.name;
      row.querySelector('.pfam').textContent = inst.family;
      row.onclick = (e) => {
        if (e.target.dataset.a) return;
        this.setCursor({ partIndex: i, staff: 0, voice: 0 });
        this.buildParts();
        if (this.viewPart !== null) { this.viewPart = i; this.render(); }
      };
      row.querySelector('[data-a=up]').onclick = (e) => {
        e.stopPropagation();
        Edit.movePart(this, i, Math.max(0, i - 1));
        this.render();
        this.buildParts();
        this.buildMixer();
      };
      row.querySelector('[data-a=del]').onclick = async (e) => {
        e.stopPropagation();
        if (this.score.parts.length <= 1) { Dlg.toast('A score needs at least one instrument', 'err'); return; }
        const ok = await Dlg.confirmDialog({
          title: 'Remove instrument',
          message: `Remove <b>${part.name}</b> and all of its music?`,
          okLabel: 'Remove', danger: true,
        });
        if (!ok) return;
        Edit.removePart(this, i);
        this.cursor.partIndex = Math.min(this.cursor.partIndex, this.score.parts.length - 1);
        this.render();
        this.buildParts();
        this.buildMixer();
      };
      p.appendChild(row);
    });
    const add = document.createElement('button');
    add.className = 'chip';
    add.style.cssText = 'width:100%;margin-top:8px;padding:7px';
    add.textContent = '+  Add instrument';
    add.onclick = () => this.act('addInstrument');
    p.appendChild(add);
  }

  buildMixer() {
    const m = this.el.mixer;
    if (!m) return;
    m.innerHTML = '<div class="sec-title">Mixer</div>';
    this.score.parts.forEach((part, i) => {
      const row = document.createElement('div');
      row.className = 'mix-row';
      row.innerHTML = `
        <div class="mix-head">
          <span class="pname"></span>
          <button class="mini mute" data-tip="Mute">M</button>
          <button class="mini solo" data-tip="Solo">S</button>
        </div>
        <div class="mix-ctl"><label>Vol</label><input type="range" class="vol" min="0" max="1" step="0.01"></div>
        <div class="mix-ctl"><label>Pan</label><input type="range" class="pan" min="-1" max="1" step="0.02"></div>`;
      row.querySelector('.pname').textContent = part.name;
      const mute = row.querySelector('.mute');
      const solo = row.querySelector('.solo');
      mute.classList.toggle('on', !!part.mute);
      solo.classList.toggle('on', !!part.solo);
      const vol = row.querySelector('.vol');
      const pan = row.querySelector('.pan');
      vol.value = part.volume;
      pan.value = part.pan || 0;
      mute.onclick = () => { part.mute = !part.mute; mute.classList.toggle('on', part.mute); this.player.applyMixer(); };
      solo.onclick = () => { part.solo = !part.solo; solo.classList.toggle('on', part.solo); this.player.applyMixer(); };
      vol.oninput = () => { part.volume = +vol.value; this.player.applyMixer(); };
      pan.oninput = () => { part.pan = +pan.value; this.player.applyMixer(); };
      m.appendChild(row);
    });
    const master = document.createElement('div');
    master.className = 'mix-row';
    master.style.borderTop = '1px solid var(--line)';
    master.innerHTML = `<div class="mix-head"><span class="pname" style="font-weight:600">Master</span></div>
      <div class="mix-ctl"><label>Vol</label><input type="range" class="mv" min="0" max="1" step="0.01" value="0.9"></div>
      <div class="mix-ctl"><label>Verb</label><input type="range" class="mr" min="0" max="0.7" step="0.01" value="0.22"></div>`;
    master.querySelector('.mv').oninput = (e) => { this.synth.init(); this.synth.setMasterVolume(+e.target.value); };
    master.querySelector('.mr').oninput = (e) => { this.synth.init(); this.synth.setReverb(+e.target.value); };
    m.appendChild(master);
  }

  buildHelpPanel() {
    const h = this.el.help;
    h.innerHTML = '';
    const tour = document.createElement('button');
    tour.className = 'btn ghost';
    tour.style.cssText = 'width:100%;margin-bottom:12px';
    tour.textContent = 'Show me around again';
    tour.onclick = () => this.showCoachMarks();
    h.appendChild(tour);
    for (const [section, rows] of SHORTCUT_HELP) {
      const t = document.createElement('div');
      t.className = 'sec-title';
      t.textContent = section;
      const table = document.createElement('table');
      table.className = 'key-table';
      table.innerHTML = rows.map(([k, d]) =>
        `<tr><td><kbd>${k}</kbd></td><td style="color:var(--text-dim)">${d}</td></tr>`).join('');
      h.append(t, table);
    }
