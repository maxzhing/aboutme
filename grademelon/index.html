<!DOCTYPE html>
<html lang="en">

<style>
/* ==========================================================================
   Grade Melon — MCPS grade calculator
   One file, no dependencies, works offline.
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}

/* ---------- skins: each supplies an accent trio + a neutral tint ---------- */
:root{
  --acc:#f43f5e; --acc2:#fb7185; --acc3:#22a35a; --tint:#f43f5e; --skin-glow:#ff8fa3;
}
[data-palette="melon"]{--acc:#f43f5e;--acc2:#fb7185;--acc3:#22a35a;--tint:#f43f5e;--skin-glow:#ff8fa3}
[data-palette="midnight"]{--acc:#6366f1;--acc2:#a5b4fc;--acc3:#22d3ee;--tint:#6366f1;--skin-glow:#818cf8}
[data-palette="sunset"]{--acc:#f97316;--acc2:#fdba74;--acc3:#e11d48;--tint:#fb7185;--skin-glow:#fb923c}
[data-palette="ocean"]{--acc:#0ea5e9;--acc2:#7dd3fc;--acc3:#14b8a6;--tint:#0ea5e9;--skin-glow:#38bdf8}
[data-palette="grape"]{--acc:#a855f7;--acc2:#d8b4fe;--acc3:#ec4899;--tint:#a855f7;--skin-glow:#c084fc}
[data-palette="matcha"]{--acc:#16a34a;--acc2:#86efac;--acc3:#65a30d;--tint:#22c55e;--skin-glow:#4ade80}
[data-palette="candy"]{--acc:#ec4899;--acc2:#f9a8d4;--acc3:#8b5cf6;--tint:#ec4899;--skin-glow:#f472b6}
[data-palette="ember"]{--acc:#dc2626;--acc2:#fca5a5;--acc3:#f59e0b;--tint:#ef4444;--skin-glow:#f87171}
[data-palette="mint"]{--acc:#14b8a6;--acc2:#5eead4;--acc3:#0ea5e9;--tint:#14b8a6;--skin-glow:#2dd4bf}
[data-palette="mono"]{--acc:#475569;--acc2:#94a3b8;--acc3:#0f172a;--tint:#64748b;--skin-glow:#94a3b8}

/* ---------- light (default) ---------- */
:root{
  color-scheme:light;
  --bg:      color-mix(in srgb, var(--tint) 5%,  #f6f6f8);
  --bg-2:    color-mix(in srgb, var(--tint) 8%,  #eeeef2);
  --card:    color-mix(in srgb, var(--tint) 1.5%,#ffffff);
  --card-2:  color-mix(in srgb, var(--tint) 5%,  #fbfbfd);
  --glass:   color-mix(in srgb, var(--tint) 4%,  rgba(255,255,255,.78));
  --ink:     color-mix(in srgb, var(--tint) 12%, #0b0d12);
  --ink-2:   color-mix(in srgb, var(--tint) 10%, #39404d);
  --muted:   color-mix(in srgb, var(--tint) 8%,  #6b7280);
  --faint:   color-mix(in srgb, var(--tint) 8%,  #a3aab6);
  --line:    color-mix(in srgb, var(--tint) 10%, #e4e6ec);
  --line-2:  color-mix(in srgb, var(--tint) 14%, #cfd3dd);
  --A:#15803d; --B:#2563eb; --C:#a16207; --D:#c026d3; --E:#9f1239;
  --shadow-1:0 1px 2px rgba(15,20,30,.05),0 6px 16px -10px rgba(15,20,30,.15);
  --shadow-2:0 2px 6px rgba(15,20,30,.06),0 18px 40px -18px rgba(15,20,30,.24);
  --shadow-3:0 6px 14px rgba(15,20,30,.08),0 36px 70px -26px rgba(15,20,30,.34);
  --glow:0 0 0 0 transparent;
  --r-s:10px; --r:16px; --r-l:22px; --r-xl:30px;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.22,.85,.28,1);
  --spring:cubic-bezier(.34,1.5,.64,1);
}
[data-classic="1"]{--A:#22c55e;--B:#3b82f6;--C:#eab308;--D:#f97316;--E:#ef4444}

/* ---------- dark ---------- */
[data-theme="dark"]{
  color-scheme:dark;
  --bg:      color-mix(in srgb, var(--tint) 7%,  #0a0b0f);
  --bg-2:    color-mix(in srgb, var(--tint) 9%,  #0f1116);
  --card:    color-mix(in srgb, var(--tint) 7%,  #14161c);
  --card-2:  color-mix(in srgb, var(--tint) 10%, #1a1d25);
  --glass:   color-mix(in srgb, var(--tint) 8%,  rgba(16,18,24,.76));
  --ink:     color-mix(in srgb, var(--tint) 6%,  #eef1f6);
  --ink-2:   color-mix(in srgb, var(--tint) 8%,  #c3c9d4);
  --muted:   color-mix(in srgb, var(--tint) 10%, #8b93a3);
  --faint:   color-mix(in srgb, var(--tint) 10%, #5b6373);
  --line:    color-mix(in srgb, var(--tint) 12%, #232732);
  --line-2:  color-mix(in srgb, var(--tint) 16%, #313747);
  --A:#19a855; --B:#3b82f6; --C:#bd8c0c; --D:#d946ef; --E:#fb4a68;
  --shadow-1:0 1px 2px rgba(0,0,0,.5),0 6px 16px -10px rgba(0,0,0,.7);
  --shadow-2:0 2px 6px rgba(0,0,0,.5),0 18px 40px -18px rgba(0,0,0,.8);
  --shadow-3:0 6px 14px rgba(0,0,0,.55),0 36px 70px -26px rgba(0,0,0,.9);
}
[data-theme="dark"][data-classic="1"]{--A:#4ade80;--B:#60a5fa;--C:#facc15;--D:#fb923c;--E:#f87171}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:      color-mix(in srgb, var(--tint) 7%,  #0a0b0f);
    --bg-2:    color-mix(in srgb, var(--tint) 9%,  #0f1116);
    --card:    color-mix(in srgb, var(--tint) 7%,  #14161c);
    --card-2:  color-mix(in srgb, var(--tint) 10%, #1a1d25);
    --glass:   color-mix(in srgb, var(--tint) 8%,  rgba(16,18,24,.76));
    --ink:     color-mix(in srgb, var(--tint) 6%,  #eef1f6);
    --ink-2:   color-mix(in srgb, var(--tint) 8%,  #c3c9d4);
    --muted:   color-mix(in srgb, var(--tint) 10%, #8b93a3);
    --faint:   color-mix(in srgb, var(--tint) 10%, #5b6373);
    --line:    color-mix(in srgb, var(--tint) 12%, #232732);
    --line-2:  color-mix(in srgb, var(--tint) 16%, #313747);
    --A:#19a855; --B:#3b82f6; --C:#bd8c0c; --D:#d946ef; --E:#fb4a68;
    --shadow-1:0 1px 2px rgba(0,0,0,.5),0 6px 16px -10px rgba(0,0,0,.7);
    --shadow-2:0 2px 6px rgba(0,0,0,.5),0 18px 40px -18px rgba(0,0,0,.8);
    --shadow-3:0 6px 14px rgba(0,0,0,.55),0 36px 70px -26px rgba(0,0,0,.9);
  }
  :root:not([data-theme="light"])[data-classic="1"]{--A:#4ade80;--B:#60a5fa;--C:#facc15;--D:#fb923c;--E:#f87171}
}

html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15.5px;line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc);text-decoration:none}
h1,h2,h3,h4{margin:0;font-weight:800;line-height:1.14;letter-spacing:-.025em;text-wrap:balance}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:8px}
::selection{background:color-mix(in srgb,var(--acc) 28%,transparent)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--faint)}

/* ---------- aurora backdrop ---------- */
#aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--bg)}
#aurora i{position:absolute;display:block;border-radius:50%;filter:blur(96px);opacity:.16}
#aurora i:nth-child(1){width:54vw;height:54vw;left:-14vw;top:-18vw;background:radial-gradient(circle,var(--acc),transparent 70%);animation:d1 36s var(--ease) infinite alternate}
#aurora i:nth-child(2){width:46vw;height:46vw;right:-12vw;top:4vh;background:radial-gradient(circle,var(--acc3),transparent 70%);opacity:.12;animation:d2 44s var(--ease) infinite alternate}
#aurora i:nth-child(3){width:62vw;height:62vw;left:24vw;bottom:-34vw;background:radial-gradient(circle,var(--skin-glow),transparent 72%);opacity:.1;animation:d3 50s var(--ease) infinite alternate}
@keyframes d1{to{transform:translate3d(11vw,9vh,0) scale(1.2)}}
@keyframes d2{to{transform:translate3d(-10vw,13vh,0) scale(1.24)}}
@keyframes d3{to{transform:translate3d(-13vw,-9vh,0) scale(1.14)}}

/* ---------- app shell: sidebar + main ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:20px 14px;
  background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.7);backdrop-filter:blur(18px) saturate(1.7);
  border-right:1px solid var(--line);z-index:40}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px;font-weight:800;font-size:1.28rem;
  letter-spacing:-.035em;color:var(--ink)}
.brand:hover{text-decoration:none}
.brand small{display:block;font-family:var(--mono);font-size:.56rem;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin-top:2px}
.melon{width:36px;height:36px;flex:none;filter:drop-shadow(0 3px 6px color-mix(in srgb,var(--acc) 40%,transparent))}
.melon .seed{animation:seed .75s var(--spring) backwards}
.melon .seed:nth-of-type(2){animation-delay:.09s}
.melon .seed:nth-of-type(3){animation-delay:.18s}
@keyframes seed{from{transform:translateY(-8px) scale(.2);opacity:0}}
.navlink{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;border:0;width:100%;
  background:transparent;color:var(--muted);font-weight:600;font-size:.92rem;cursor:pointer;text-align:left;
  transition:color .18s,background .18s,transform .18s var(--spring)}
.navlink svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.navlink:hover{color:var(--ink);background:var(--card-2);transform:translateX(3px)}
.navlink[aria-current="true"]{color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));
  box-shadow:0 6px 18px -6px color-mix(in srgb,var(--acc) 70%,transparent)}
#nav{display:flex;flex-direction:column;gap:3px}
.side .spacer{flex:1}
.side .foot{font-size:.7rem;color:var(--faint);padding:0 8px;line-height:1.6}
main{min-width:0;padding:26px 30px 80px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;gap:4px;padding:9px 12px;
    border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand{padding:0 8px 0 2px;font-size:1.05rem;white-space:nowrap;flex:none}
  .brand small{display:none}
  .melon{width:30px;height:30px}
  #nav{flex-direction:row;gap:2px;flex:1}
  .navlink{width:auto;padding:9px 12px;font-size:.85rem}
  .navlink span{display:none}
  .navlink svg{width:20px;height:20px}
  .side .spacer,.side .foot{display:none}
  main{padding:18px 16px 70px}
}

/* ---------- generic ---------- */
.stack{display:grid;gap:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.muted{color:var(--muted)}.tiny{font-size:.77rem}.small{font-size:.87rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow-1)}
.pad{padding:22px}
@media (max-width:560px){.pad{padding:16px}}
.eyebrow{font-family:var(--mono);font-size:.67rem;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.sec-title{font-family:var(--mono);font-size:.67rem;font-weight:500;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.sec-title::after{content:'';flex:1;height:1px;background:var(--line)}
.divider{height:1px;background:var(--line);margin:18px 0}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.pagehead h1{font-size:clamp(1.6rem,3.4vw,2.15rem)}
.pagehead .sub{color:var(--muted);font-size:.9rem;margin-top:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 17px;border-radius:12px;
  border:1px solid var(--line-2);background:var(--card);color:var(--ink);font-weight:700;font-size:.87rem;
  cursor:pointer;white-space:nowrap;transition:transform .2s var(--spring),box-shadow .2s,border-color .18s,background .18s,color .18s}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.btn:active{transform:translateY(0) scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff;
  box-shadow:0 6px 18px -8px color-mix(in srgb,var(--acc) 80%,transparent)}
.btn-primary:hover{color:#fff;box-shadow:0 10px 26px -8px color-mix(in srgb,var(--acc) 85%,transparent)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--card-2);color:var(--ink);box-shadow:none}
.btn-sm{padding:7px 12px;font-size:.8rem;border-radius:10px}
.btn-icon{padding:9px;width:38px;height:38px}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}
label.fld{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:.68rem;font-weight:500;
  text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
input[type=text],input[type=number],select,textarea{background:var(--card-2);border:1px solid var(--line-2);
  border-radius:11px;padding:10px 12px;font-size:.92rem;font-weight:600;color:var(--ink);width:100%;
  transition:border-color .18s,box-shadow .18s,background .18s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);background:var(--card);
  box-shadow:0 0 0 3.5px color-mix(in srgb,var(--acc) 20%,transparent)}
textarea{font-family:var(--mono);font-size:.81rem;line-height:1.62;resize:vertical;min-height:180px;font-weight:400}
.note{background:var(--card-2);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;font-size:.86rem;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;background:var(--card-2);
  border:1px solid var(--line);font-family:var(--mono);font-size:.7rem;font-weight:500;color:var(--ink-2)}
.g-A{color:var(--A)}.g-B{color:var(--B)}.g-C{color:var(--C)}.g-D{color:var(--D)}.g-E{color:var(--E)}
.bg-A{background:var(--A)}.bg-B{background:var(--B)}.bg-C{background:var(--C)}.bg-D{background:var(--D)}.bg-E{background:var(--E)}.bg-N{background:var(--faint)}

/* ---------- gradebook: class cards ---------- */
.gbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:16px}
.gbcard{position:relative;display:flex;flex-direction:column;gap:14px;padding:20px;border-radius:var(--r-l);
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-1);cursor:pointer;text-align:left;
  overflow:hidden;transition:transform .3s var(--spring),box-shadow .3s,border-color .2s;
  animation:cardin .42s var(--ease) backwards}
@keyframes cardin{from{opacity:0;transform:translateY(16px) scale(.97)}}
.gbcard::before{content:'';position:absolute;inset:0 0 auto 0;height:4px;background:var(--gc,var(--faint));
  transform:scaleX(var(--gscale,1));transform-origin:left;transition:transform .8s var(--ease)}
.gbcard::after{content:'';position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,var(--gc,var(--acc)),transparent 70%);opacity:.09;pointer-events:none;
  transition:opacity .3s,transform .5s var(--ease)}
.gbcard:hover{transform:translateY(-6px);box-shadow:var(--shadow-3);border-color:color-mix(in srgb,var(--gc,var(--acc)) 40%,var(--line))}
.gbcard:hover::after{opacity:.17;transform:scale(1.25)}
.gbcard .gb-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.gbcard .gb-per{font-family:var(--mono);font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:5px}
.gbcard .gb-name{font-size:1.09rem;font-weight:800;letter-spacing:-.02em;line-height:1.22;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gbcard .gb-teacher{font-size:.81rem;color:var(--muted);margin-top:4px}
.gbcard .gb-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:auto}
.gbcard .gb-grade{font-size:2.05rem;font-weight:800;letter-spacing:-.045em;line-height:1;color:var(--gc)}
.gbcard .gb-grade em{font-style:normal;font-family:var(--mono);font-size:.92rem;font-weight:600;letter-spacing:-.01em;
  color:var(--ink-2);margin-left:7px}
.gbcard .spark{width:96px;height:34px;flex:none;opacity:.95}
.gbcard .spark path{fill:none;stroke:var(--gc);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.gbcard .spark .fill{fill:var(--gc);opacity:.13;stroke:none}
.gbcard .gb-tag{display:inline-block;font-family:var(--mono);font-size:.6rem;font-weight:600;
  text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:99px;margin-left:7px;
  background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.gb-actions{position:absolute;top:12px;right:12px;display:flex;gap:5px;z-index:3;
  opacity:0;transform:translateY(-5px);transition:opacity .2s var(--ease),transform .2s var(--ease)}
.gbcard:hover .gb-actions,.gbcard:focus-within .gb-actions{opacity:1;transform:none}
@media (hover:none){.gb-actions{opacity:1;transform:none}}
.gb-act{width:31px;height:31px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;cursor:pointer;color:var(--muted);padding:0;
  transition:color .18s,border-color .18s,transform .18s var(--spring)}
.gb-act:hover{color:var(--acc);border-color:var(--acc);transform:scale(1.12)}
.gb-act.del:hover{color:var(--E);border-color:var(--E)}
.gb-act svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gbtable .rowacts{display:flex;gap:6px;justify-content:flex-end}
.gbcard.add{align-items:center;justify-content:center;border-style:dashed;background:transparent;box-shadow:none;
  color:var(--acc);font-weight:700;min-height:168px;gap:8px}
.gbcard.add::before,.gbcard.add::after{display:none}
.gbcard.add svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}

/* table view */
.gbtable{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem}
.gbtable th{text-align:left;font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line)}
.gbtable td{padding:13px 14px;border-bottom:1px solid var(--line)}
.gbtable tbody tr{cursor:pointer;transition:background .16s}

.gbtable .tgrade{font-weight:800;font-size:1.05rem}

/* ---------- command bar ---------- */
.topline{display:flex;justify-content:flex-end;margin-bottom:18px}
.cmdwrap{position:relative;flex:1;min-width:190px;max-width:520px}
@media (max-width:900px){.topline{margin-bottom:14px}.cmdwrap{max-width:none}}
.cmdbar{display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:13px;background:var(--card);
  border:1px solid var(--line);box-shadow:var(--shadow-1);transition:border-color .18s,box-shadow .18s}
.cmdbar:focus-within{border-color:var(--acc);box-shadow:0 0 0 3.5px color-mix(in srgb,var(--acc) 18%,transparent)}
.cmdbar svg{width:17px;height:17px;flex:none;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.cmdbar input{border:0;background:transparent;padding:0;font-size:.9rem;font-weight:500;box-shadow:none!important}
.cmdbar kbd{font-family:var(--mono);font-size:.66rem;color:var(--muted);background:var(--card-2);
  border:1px solid var(--line);border-radius:6px;padding:2px 6px;flex:none}
.cmdres{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--card);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--shadow-3);z-index:70;overflow:hidden;animation:pop .2s var(--ease)}
.cmdres .ans{padding:15px 17px;font-size:.92rem;line-height:1.55;border-bottom:1px solid var(--line)}
.cmdres .ans b{color:var(--acc)}
.cmdres .hits{max-height:260px;overflow:auto}
.cmdres .hit{display:flex;align-items:center;gap:11px;padding:11px 17px;cursor:pointer;border:0;background:none;
  width:100%;text-align:left;font-size:.88rem;color:var(--ink);transition:background .14s}
.cmdres .hit:hover,.cmdres .hit[aria-selected="true"]{background:var(--card-2)}
.cmdres .hit .k{margin-left:auto;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.cmdres .foot{padding:9px 17px;font-size:.74rem;color:var(--muted);background:var(--card-2);border-top:1px solid var(--line)}

/* ---------- at a glance ---------- */
.glance{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center}
.glance .say{font-size:clamp(1.3rem,2.6vw,1.75rem);font-weight:800;letter-spacing:-.03em;line-height:1.18;margin-bottom:7px}
.glance .sub{color:var(--muted);font-size:.9rem}
.glance .tally{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.ltag{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-weight:800;
  font-size:.82rem;color:#fff}
.goalpick{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:none}
.goalpick select{width:auto;min-width:180px;font-size:.85rem;padding:8px 11px}
@media (max-width:860px){.glance{grid-template-columns:1fr;justify-items:start;gap:18px}
  .goalpick{align-items:stretch;width:100%}.goalpick select{width:100%}}

/* ---------- focus list ---------- */
.focus{display:grid;gap:10px}
.focusrow{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px;
  border-radius:var(--r);background:var(--card-2);border:1px solid var(--line);cursor:pointer;text-align:left;
  transition:transform .22s var(--spring),border-color .2s,box-shadow .2s;width:100%}
.focusrow:hover{transform:translateX(4px);border-color:var(--line-2);box-shadow:var(--shadow-1)}
.focusrow .rank{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;
  font-size:.86rem;background:var(--card);border:1px solid var(--line);color:var(--muted);flex:none}
.focusrow:first-child .rank{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
.focusrow .fname{font-weight:800;font-size:.98rem;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.focusrow .fwhy{font-size:.84rem;color:var(--muted);margin-top:4px;line-height:1.45}
.focusrow .fgrade{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.focusrow .fgrade b{font-size:1.35rem;font-weight:800;letter-spacing:-.03em;display:block;line-height:1}
.focusrow .fgrade span{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-family:var(--mono);
  font-size:.64rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.badge.good{color:var(--A);border-color:color-mix(in srgb,var(--A) 40%,transparent);background:color-mix(in srgb,var(--A) 11%,transparent)}
.badge.warn{color:var(--C);border-color:color-mix(in srgb,var(--C) 40%,transparent);background:color-mix(in srgb,var(--C) 11%,transparent)}
.badge.bad{color:var(--E);border-color:color-mix(in srgb,var(--E) 40%,transparent);background:color-mix(in srgb,var(--E) 11%,transparent)}
.badge.info{color:var(--B);border-color:color-mix(in srgb,var(--B) 40%,transparent);background:color-mix(in srgb,var(--B) 11%,transparent)}
.badge.muted{color:var(--muted);border-color:var(--line-2);background:var(--card-2)}
@media (max-width:560px){
  .focusrow{grid-template-columns:auto 1fr;gap:11px;padding:13px}
  .focusrow .fgrade{grid-column:2;text-align:left;margin-top:6px;display:flex;align-items:baseline;gap:8px}
  .focusrow .fgrade b{display:inline;font-size:1.15rem}
  .focusrow:hover{transform:none}
}
.oppbar{display:flex;align-items:center;gap:7px;margin-top:7px}
.oppbar .track{width:76px;height:6px;border-radius:99px;background:var(--line);overflow:hidden;flex:none}
.oppbar .track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));
  transition:width .7s var(--ease)}
.oppbar .lab{font-family:var(--mono);font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- insight list ---------- */
.ins{display:grid;gap:9px}
.insrow{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);
  background:var(--card-2);border:1px solid var(--line);font-size:.89rem;line-height:1.5}
.insrow .dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px}
.insrow.good .dot{background:var(--A)}.insrow.warn .dot{background:var(--C)}
.insrow.bad .dot{background:var(--E)}.insrow.info .dot{background:var(--B)}.insrow.muted .dot{background:var(--faint)}
.insrow .cta{margin-left:auto;flex:none}

.checkgrid{display:grid;gap:8px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.87rem;line-height:1.5}
.chk span:first-child{flex:none;font-weight:800;width:16px;text-align:center}
.chk.ok span:first-child{color:var(--A)}
.chk.warn span:first-child{color:var(--C)}
.impbanner{border-color:color-mix(in srgb,var(--acc) 34%,var(--line))}

/* ---------- filter chips ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip-btn{padding:7px 14px;border-radius:99px;border:1px solid var(--line-2);background:var(--card);cursor:pointer;
  font-weight:650;font-size:.82rem;color:var(--muted);transition:transform .18s var(--spring),color .18s,border-color .18s,background .18s}
.chip-btn:hover{transform:translateY(-2px);color:var(--ink)}
.chip-btn[aria-pressed="true"]{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
.chip-btn .n{opacity:.7;font-family:var(--mono);font-size:.74rem;margin-left:5px}

/* ---------- stat strip ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stat{padding:16px 18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);
  box-shadow:var(--shadow-1);position:relative;overflow:hidden}
.stat .k{font-family:var(--mono);font-size:.64rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:1.85rem;font-weight:800;letter-spacing:-.04em;margin-top:5px;font-variant-numeric:tabular-nums;line-height:1.05}
.stat .d{font-size:.76rem;color:var(--muted);margin-top:2px}
@media (max-width:620px){.gpa-stat{grid-column:1/-1}.stat .v{font-size:1.6rem}}
.ringbtn{background:none;border:0;padding:6px;cursor:pointer;display:grid;justify-items:center;gap:5px;
  border-radius:18px;transition:transform .22s var(--spring),background .18s}
.ringbtn:hover{transform:translateY(-3px);background:var(--card-2)}
.gparing{width:74px;height:74px;flex:none;position:relative}
.gparing svg{width:100%;height:100%;transform:rotate(-90deg)}
.gparing .t{fill:none;stroke:var(--line);stroke-width:9}
.gparing .p{fill:none;stroke:url(#gpagrad);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease)}
.gparing .m{position:absolute;inset:0;display:grid;place-content:center;font-weight:800;font-size:1rem;
  font-variant-numeric:tabular-nums;letter-spacing:-.03em}

/* ---------- grade ring ---------- */
.ring{position:relative;width:172px;height:172px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .track{fill:none;stroke:var(--line);stroke-width:14}
.ring .prog{fill:none;stroke:url(#ringgrad);stroke-width:14;stroke-linecap:round;
  transition:stroke-dashoffset 1.05s var(--ease);filter:drop-shadow(0 0 9px color-mix(in srgb,var(--gc) 42%,transparent))}
.ring .tick{stroke:var(--card);stroke-width:2.6}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.ring .lt{font-size:3.5rem;font-weight:800;letter-spacing:-.055em;transition:color .4s}
.ring .pc{font-family:var(--mono);font-size:1rem;font-weight:600;color:var(--ink-2);margin-top:7px;font-variant-numeric:tabular-nums}
.ring .cap{font-family:var(--mono);font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.hero h2{font-size:1.75rem;margin-bottom:4px}
.hero .meta{color:var(--muted);font-size:.88rem;margin-bottom:14px}
.headline{font-size:.96rem;color:var(--ink-2);margin-bottom:17px;min-height:1.4em}
.headline b{color:var(--acc)}
@media (max-width:760px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.hero .txt{width:100%}.ring{width:154px;height:154px}}

/* ---------- trend chart ---------- */
.chartwrap{position:relative}
.chart{width:100%;display:block;overflow:visible;touch-action:pan-y}
.chart .band{opacity:.1}
.chart .bandline{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.chart .bandlabel{font-family:var(--mono);font-size:9.5px;fill:var(--muted);letter-spacing:.05em}
.chart .line{fill:none;stroke:var(--acc);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 2px 6px color-mix(in srgb,var(--acc) 34%,transparent))}
.chart .dot{fill:var(--card);stroke:var(--acc);stroke-width:2.3}
.chart .lastdot{fill:var(--acc);stroke:var(--card);stroke-width:2.6}
.chart .lastpulse{fill:var(--acc);opacity:.32;animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{0%{r:5;opacity:.4}70%,100%{r:15;opacity:0}}
.chart .cross{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3;opacity:0;transition:opacity .15s}
.chart .hit{fill:transparent}
.chart .xlabel{font-family:var(--mono);font-size:9.5px;fill:var(--muted)}
.chartwrap.live .cross{opacity:.75}
@keyframes draw{to{stroke-dashoffset:0}}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:9px 13px;border-radius:11px;
  font-size:.79rem;line-height:1.42;box-shadow:var(--shadow-2);opacity:0;transform:translate(-50%,-118%);
  transition:opacity .14s;max-width:240px;z-index:5;font-weight:600}
.tip.on{opacity:1}
.tip .t-sub{opacity:.7;font-size:.72rem;font-weight:500}
.chart-empty{display:grid;place-items:center;height:180px;color:var(--muted);font-size:.87rem;text-align:center}

/* ---------- category donuts ---------- */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
.catcard{display:flex;align-items:center;gap:15px;padding:15px;border-radius:var(--r);background:var(--card-2);
  border:1px solid var(--line);transition:transform .26s var(--spring),border-color .2s}
.catcard:hover{transform:translateY(-3px);border-color:var(--line-2)}
.donut{width:64px;height:64px;flex:none;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .dtrack{fill:none;stroke:var(--line);stroke-width:8.5}
.donut .dprog{fill:none;stroke-width:8.5;stroke-linecap:round;transition:stroke-dashoffset .95s var(--ease)}
.donut .dmid{position:absolute;inset:0;display:grid;place-content:center;font-family:var(--mono);font-size:.7rem;
  font-weight:600;font-variant-numeric:tabular-nums}
.catcard .cname{font-weight:700;font-size:.9rem;line-height:1.25;margin-bottom:4px}
.catcard .cmeta{font-family:var(--mono);font-size:.71rem;color:var(--muted)}
.wbadge{display:inline-block;font-family:var(--mono);font-size:.65rem;font-weight:600;color:#fff;
  background:linear-gradient(135deg,var(--acc),var(--acc2));padding:2px 8px;border-radius:99px;margin-right:7px}

.wifrow{display:flex;align-items:center;gap:14px}
.wifrow input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:8px;border-radius:99px;padding:0;border:0;cursor:pointer;
  background:linear-gradient(90deg,var(--acc) var(--fill,90%),var(--line) var(--fill,90%))}
.wifrow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;
  background:var(--card);border:3px solid var(--acc);cursor:grab;box-shadow:var(--shadow-1);transition:transform .18s var(--spring)}
.wifrow input[type=range]::-webkit-slider-thumb:active{transform:scale(1.22);cursor:grabbing}
.wifrow input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--card);
  border:3px solid var(--acc);cursor:grab}
.wifnum{display:flex;align-items:center;gap:5px;flex:none}
.wifnum input{width:74px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.wifnum span{color:var(--muted);font-weight:700}
.wifout{margin-top:16px;padding:16px 18px;border-radius:var(--r);border:1px solid var(--line-2);
  background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 12%,var(--card)),color-mix(in srgb,var(--acc3) 9%,var(--card)))}
.wifout .line{font-size:1.35rem;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.wifout .arrow{color:var(--muted);font-weight:600}
.wifout .verdict{font-size:.89rem;color:var(--ink-2);margin-top:7px}

/* ---------- assignment rows ---------- */
.arows{display:grid;gap:9px}
.arow{display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:center;padding:13px 15px;
  border-radius:var(--r);background:var(--card-2);border:1px solid var(--line);
  transition:transform .2s var(--ease),box-shadow .2s,opacity .2s,border-color .2s;
  animation:rowin .44s var(--ease) backwards}
@keyframes rowin{from{opacity:0;transform:translateY(10px)}}
.arow:hover{box-shadow:var(--shadow-1);border-color:var(--line-2)}
.arow.off{opacity:.42}
.arow.hypo{border-color:color-mix(in srgb,var(--acc) 48%,transparent);background:color-mix(in srgb,var(--acc) 6%,var(--card-2))}
.tick-btn{width:26px;height:26px;flex:none;border-radius:9px;border:2px solid var(--line-2);background:var(--card);
  cursor:pointer;display:grid;place-items:center;padding:0;transition:background .2s,border-color .2s,transform .2s var(--spring)}
.tick-btn:hover{transform:scale(1.13)}
.tick-btn[aria-pressed="true"]{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent}
.tick-btn svg{width:15px;height:15px;stroke:#fff;stroke-width:3.3;fill:none;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:22;stroke-dashoffset:22}
.tick-btn[aria-pressed="true"] svg{stroke-dashoffset:0;transition:stroke-dashoffset .32s var(--ease) .04s}
.a-main{min-width:0}
.a-name{font-weight:700;font-size:.92rem;display:flex;align-items:center;gap:7px;flex-wrap:wrap;line-height:1.3}
.a-name .nmtext{outline:none;border-radius:5px}
.a-sub{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:5px;font-family:var(--mono);font-size:.71rem;color:var(--muted)}
.a-sub .catdot{width:8px;height:8px;border-radius:50%;flex:none}
.a-sub select{width:auto;padding:2px 6px;font-size:.72rem;background:transparent;border:0;font-weight:500;font-family:var(--mono)}
.tag{font-family:var(--mono);font-size:.59rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 7px;border-radius:6px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.tag.mod{background:var(--C)}.tag.miss{background:var(--E)}.tag.ex{background:var(--faint)}
.tag.un{background:transparent;color:var(--muted);border:1px solid var(--line-2)}
.a-right{display:flex;align-items:center;gap:11px}
.scorebox{display:flex;align-items:center;gap:3px}
.scorebox input{width:68px;padding:6px 8px;text-align:right;font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.scorebox .sl{color:var(--faint);font-weight:700}
.a-pct{font-weight:800;font-size:1.02rem;min-width:60px;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.a-impact{font-family:var(--mono);font-size:.73rem;min-width:52px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.a-impact.up{color:var(--A)}.a-impact.down{color:var(--E)}
.rowbtn{background:none;border:0;color:var(--faint);cursor:pointer;padding:5px;border-radius:8px;font-size:.95rem;
  line-height:1;transition:color .18s,background .18s,transform .18s}
.rowbtn:hover{color:var(--E);background:color-mix(in srgb,var(--E) 12%,transparent);transform:scale(1.15)}
.rowbtn.reset:hover{color:var(--C);background:color-mix(in srgb,var(--C) 14%,transparent)}
.rowbtn.slide:hover{color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.slider{grid-column:1/-1;display:flex;align-items:center;gap:11px;margin-top:4px;
  animation:slidein .3s var(--ease)}
@keyframes slidein{from{opacity:0;transform:translateY(-5px)}}
.slider input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:7px;border-radius:99px;padding:0;border:0;cursor:pointer;
  background:linear-gradient(90deg,var(--acc) var(--fill,100%),var(--line) var(--fill,100%))}
.slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:21px;height:21px;border-radius:50%;
  background:var(--card);border:3px solid var(--acc);cursor:grab;box-shadow:var(--shadow-1);transition:transform .18s var(--spring)}
.slider input[type=range]::-webkit-slider-thumb:active{transform:scale(1.28);cursor:grabbing}
.slider input[type=range]::-moz-range-thumb{width:21px;height:21px;border-radius:50%;background:var(--card);
  border:3px solid var(--acc);cursor:grab;box-shadow:var(--shadow-1)}
.slider .slabel{font-family:var(--mono);font-size:.72rem;color:var(--muted);min-width:52px;text-align:right}
@media (max-width:640px){
  .arow{grid-template-columns:auto 1fr;gap:10px}
  .a-right{grid-column:1/-1;justify-content:space-between;padding-left:37px}
  .a-pct{min-width:0}
}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 55%,transparent);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:120;display:grid;place-items:center;padding:20px;
  animation:fade .22s var(--ease)}
@keyframes fade{from{opacity:0}}
.modal{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-3);
  width:min(620px,100%);max-height:86vh;overflow:auto;animation:pop .34s var(--spring)}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.94)}}
.modal header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 22px 0}
.modal header h3{font-size:1.24rem}
.modal .body{padding:18px 22px 22px}
.modal .x{background:var(--card-2);border:1px solid var(--line);width:34px;height:34px;border-radius:50%;
  cursor:pointer;display:grid;place-items:center;color:var(--muted);font-size:1rem;transition:.2s var(--spring)}
.modal .x:hover{transform:rotate(90deg);color:var(--ink)}
.toggle{position:relative;display:inline-flex;align-items:center;cursor:pointer;flex:none}
.toggle input{position:absolute;opacity:0;width:0;height:0}
.toggle .tr{width:44px;height:25px;border-radius:99px;background:var(--line-2);transition:background .24s;position:relative}
.toggle .tr::after{content:'';position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;
  background:#fff;transition:transform .28s var(--spring);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle input:checked + .tr{background:linear-gradient(135deg,var(--acc),var(--acc2))}

/* ---------- theme picker ---------- */

.skin:hover{transform:translateY(-3px)}

.skin .sw i{position:absolute;inset:0;display:block}
.skin .sw i:nth-child(1){width:50%}
.skin .sw i:nth-child(2){left:50%;width:28%}

.segbar button[aria-current="true"]{background:var(--card);color:var(--acc);box-shadow:var(--shadow-1)}

input[type=color]{width:46px;height:38px;padding:3px;border-radius:10px;border:1px solid var(--line-2);
  background:var(--card-2);cursor:pointer}

/* ---------- misc ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:15px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:13px}

.empty .big{font-size:3.2rem;margin-bottom:12px;display:inline-block;animation:bob 3.6s ease-in-out infinite}

.scale{width:100%;border-collapse:collapse;font-size:.88rem}
.scale th,.scale td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left}
.scale th{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);font-weight:500}
.scale td{font-variant-numeric:tabular-nums}
.scale td:first-child{font-weight:800;font-size:1.06rem;width:54px}
.semchart{width:100%;border-collapse:separate;border-spacing:3px;font-size:.86rem;text-align:center}
.semchart th,.semchart td{padding:9px 6px;font-weight:700;border-radius:9px;width:16%;white-space:nowrap}
.semchart th{font-family:var(--mono);background:var(--card-2);font-size:.68rem;text-transform:uppercase;
  letter-spacing:.08em;color:var(--muted);font-weight:500}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,190%);background:var(--ink);color:var(--bg);
  padding:13px 22px;border-radius:14px;font-size:.87rem;font-weight:700;box-shadow:var(--shadow-3);z-index:200;
  transition:transform .44s var(--spring);max-width:calc(100% - 34px);display:flex;align-items:center;gap:14px}

  border-radius:9px;font-size:.79rem;font-weight:800;cursor:pointer}

  display:flex;justify-content:space-between;align-items:center;gap:10px}

  border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .26s var(--ease);flex:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}

}
#printArea{display:none}

  border-bottom:2px solid var(--line-2);padding-bottom:14px}

<script>
"use strict";
/* ==================================================================
   Grade Melon
   State + MCPS grade math + StudentVUE paste parser
   ================================================================== */
const GM = (() => {

const KEY = 'grademelon.v1';
const uid = () => Math.random().toString(36).slice(2,10);
const $  = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : null; };
const round2 = n => Math.round(n*100)/100;

/* ---------------- MCPS grading scale ---------------- */
const CUTS = [['A',89.5],['B',79.5],['C',69.5],['D',59.5],['E',-Infinity]];
const POINTS = {A:4,B:3,C:2,D:1,E:0};
const letterFor = p => p === null ? null : CUTS.find(c => p >= c[1])[0];
/* Points needed to reach the next letter up */
const nextCut = p => { for (let i=CUTS.length-1;i>=0;i--) if (CUTS[i][1] > p) return CUTS[i]; return null; };

/* MCPS semester grade: average the two marking periods' quality points, round a .5 UP */
const semesterGrade = (a,b) => {
  const avg = (POINTS[a] + POINTS[b]) / 2;
  const pts = Math.ceil(avg - 1e-9);
  return Object.keys(POINTS).find(k => POINTS[k] === pts);
};

/* ---------------- default categories ---------------- */
const DEFAULT_CATS = () => ([
  { id:uid(), name:'All Tasks / Assessments', weight:90 },
  { id:uid(), name:'Practice / Preparation',  weight:10 }
]);

/* Match a pasted category name to one of the class's categories */
const norm = s => String(s||'').toLowerCase().replace(/[^a-z]/g,'');
const ALIASES = [
  { keys:['alltasksassessments','alltasks','alltask','assessments','assessment','at','summative','majorassessments','tasksassessments'], name:'All Tasks / Assessments', weight:90 },
  { keys:['practicepreparation','practiceprep','practice','preparation','pp','homework','hw','formative','classwork','practiceandpreparation'], name:'Practice / Preparation', weight:10 }
];
function canonical(raw){
  const n = norm(raw);
  for (const a of ALIASES) if (a.keys.includes(n)) return a;
  for (const a of ALIASES) if (a.keys.some(k => k.length > 3 && (n.includes(k) || k.includes(n)))) return a;
  return null;
}

/* ==================================================================
   PARSER — StudentVUE / Synergy gradebook paste
   ================================================================== */
const RE = {
  week   : /^week\s*\d*\s*[-–—:]?\s*(\d{1,2})\/(\d{1,2})\/(\d{2,4})/i,
  anchor : /^(.*?)\|\s*(-?\d+(?:\.\d+)?)\s*(?:points?|pts?)\b/i,
  anchor2: /^([A-Za-z][A-Za-z .,'&\/-]{1,60}?)\s+(-?\d+(?:\.\d+)?)\s*(?:points?|pts?)\s*$/i,
  month  : /^(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?$/i,
  day    : /^([0-3]?\d)$/,
  pct    : /^(-?\d+(?:\.\d+)?)\s*%$/,
  numOnly: /^(-?\d+(?:\.\d+)?)$/,
  outOf  : /^(-?\d+(?:\.\d+)?)\s*(?:\/|out\s*of)\s*(\d+(?:\.\d+)?)$/i,
  flag   : /^(missing|late|absent|incomplete|excused|exempt|not\s*graded|ungraded|no\s*count|n\/a)$/i,
  prefix : /^\s*(AT|PP)\s*[-–:]\s*/i,
  due    : /\bdue\s+(\d{1,2}\/\d{1,2}(?:\/\d{2,4})?)/i,
  itemcnt: /^\(?\d+\s*items?\)?$/i
};
const MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};

function parseGradebook(raw){
  const lines = String(raw||'').replace(/\r/g,'').replace(/ /g,' ')
    .split('\n').map(l => l.replace(/\s+/g,' ').trim());

  const items = [];
  const seenCats = new Map();
  let year = new Date().getFullYear();
  let firstAnchor = -1;

  const isAnchor = l => RE.anchor.test(l) || (RE.anchor2.test(l) && /[a-z]{3}/i.test(l));
  const matchAnchor = l => l.match(RE.anchor) || l.match(RE.anchor2);

  for (let i = 0; i < lines.length; i++){
    const L = lines[i];
    const wk = L.match(RE.week);
    if (wk){ let y = +wk[3]; if (y < 100) y += 2000; year = y; continue; }
    if (!isAnchor(L)) continue;
    if (firstAnchor < 0) firstAnchor = i;

    const m = matchAnchor(L);
    let catName  = m[1].replace(/[|•\-–—\s]+$/,'').replace(/^[|•\s]+/,'').trim();
    let possible = parseFloat(m[2]);
    if (!catName) catName = 'Uncategorized';

    /* --- walk back for name + date --- */
    let name = '', mon = null, day = null;
    let j = i - 1;
    while (j >= 0 && !lines[j]) j--;
    if (j >= 0 && !RE.week.test(lines[j]) && !RE.month.test(lines[j]) && !RE.day.test(lines[j]) && !RE.itemcnt.test(lines[j])){
      name = lines[j]; j--;
    }
    while (j >= 0 && !lines[j]) j--;
    if (j >= 0 && RE.day.test(lines[j])){ day = +lines[j]; j--; while (j >= 0 && !lines[j]) j--; }
    if (j >= 0 && RE.month.test(lines[j])) mon = MONTHS[lines[j].toLowerCase().replace(/[^a-z]/g,'').slice(0,4)] ?? MONTHS[lines[j].toLowerCase().slice(0,3)];
    if (!name) name = 'Untitled assignment';

    /* --- walk forward for score / percent / flags --- */
    let earned = null, pct = null, flags = [];
    for (let k = i + 1; k < lines.length && k <= i + 7; k++){
      const s = lines[k];
      if (!s) continue;
      if (isAnchor(s) || RE.week.test(s) || RE.month.test(s)) break;
      let mm;
      if ((mm = s.match(RE.outOf))){ earned = parseFloat(mm[1]); possible = parseFloat(mm[2]); continue; }
      if ((mm = s.match(RE.pct)))  { pct = parseFloat(mm[1]); continue; }
      if (RE.flag.test(s))         { flags.push(s.toLowerCase()); continue; }
      if ((mm = s.match(RE.numOnly))){ if (earned === null) earned = parseFloat(mm[1]); continue; }
      break;
    }
    if (earned === null && pct !== null && possible > 0) earned = round2(possible * pct / 100);

    const excused = flags.some(f => /excused|exempt|no count/.test(f));
    const missing = flags.some(f => /missing/.test(f));

    let date = null;
    if (mon !== null && mon !== undefined && day) date = new Date(year, mon, day).getTime();
    else { const d = name.match(RE.due); if (d){ const p = d[1].split('/'); date = new Date(p[2] ? (+p[2] < 100 ? 2000 + +p[2] : +p[2]) : year, +p[0]-1, +p[1]).getTime(); } }

    seenCats.set(catName, (seenCats.get(catName)||0) + 1);
    items.push({
      id: uid(), name, catName, date,
      possible: Number.isFinite(possible) ? possible : 0,
      earned, graded: earned !== null,
      included: !excused, missing, excused,
      hypo: false, origEarned: earned, origPossible: Number.isFinite(possible) ? possible : 0
    });
  }

  /* --- guess a class name from the text above the first assignment --- */
  let guess = '';
  if (firstAnchor > 0){
    const head = lines.slice(0, Math.max(0, firstAnchor - 3)).filter(Boolean)
      .filter(l => !RE.week.test(l) && !RE.month.test(l) && !RE.day.test(l) && !RE.itemcnt.test(l)
                && !/^(grade|assignment|score|points|due|date|category|home|grades|gradebook|calendar|attendance|student|report|marking\s*period|week)/i.test(l)
                && /[a-z]{3}/i.test(l) && l.length < 70);
    if (head.length) guess = head[head.length-1]
      .replace(/^\s*(course|class|subject|period)\s*\d*\s*[:\-–]\s*/i,'')
      .replace(/\s*\(.*\)\s*$/,'').trim();
  }
  return { items, cats:[...seenCats.keys()], guess };
}

/* ==================================================================
   GRADE MATH — MCPS weighted categories
   ================================================================== */
function computeClass(cls, opts = {}){
  const skipId = opts.skipId || null;
  const extra  = opts.extra  || null;   // {catId, earned, possible} hypothetical add-on

  const cats = cls.categories.map(c => {
    let earned = 0, possible = 0, count = 0;
    for (const a of cls.assignments){
      if (a.catId !== c.id) continue;
      if (!a.included || !a.graded) continue;
      if (a.id === skipId) continue;
      earned += (num(a.earned) ?? 0);
      possible += (num(a.possible) ?? 0);
      count++;
    }
    if (extra && extra.catId === c.id){ earned += extra.earned; possible += extra.possible; count++; }
    const active = possible > 0;
    return { cat:c, earned:round2(earned), possible:round2(possible), count, active,
             pct: active ? (earned / possible) * 100 : null };
  });

  const active = cats.filter(c => c.active && c.cat.weight > 0);
  const totalW = active.reduce((s,c) => s + c.cat.weight, 0);
  let pct = null;
  if (totalW > 0) pct = active.reduce((s,c) => s + c.pct * c.cat.weight, 0) / totalW;

  return { cats, pct, totalW, letter: letterFor(pct),
           usedWeights: active.map(c => ({name:c.cat.name, w:round2(c.cat.weight / totalW * 100)})) };
}

/* Minimum score on a future assignment needed to hit a target percent */
function scoreNeeded(cls, catId, possible, target){
  if (!(possible > 0)) return null;
  const at = x => { const r = computeClass(cls, { extra:{catId, earned:x, possible} }); return r.pct ?? 0; };
  if (at(possible * 2) < target) return { impossible:true, best: at(possible), max: possible };
  let lo = -possible * 2, hi = possible * 2;
  for (let i = 0; i < 90; i++){ const mid = (lo + hi) / 2; if (at(mid) >= target) hi = mid; else lo = mid; }
  return { need: Math.max(0, hi), possible, over: hi > possible, freebie: hi <= 0 };
}



/* ==================================================================
   STATE
   ================================================================== */
const SKINS = [
  ['melon','Watermelon','#f43f5e','#fb7185','#22a35a'],
  ['midnight','Midnight','#6366f1','#a5b4fc','#22d3ee'],
  ['sunset','Sunset','#f97316','#fdba74','#e11d48'],
  ['ocean','Ocean','#0ea5e9','#7dd3fc','#14b8a6'],
  ['grape','Grape','#a855f7','#d8b4fe','#ec4899'],
  ['matcha','Matcha','#16a34a','#86efac','#65a30d'],
  ['candy','Candy','#ec4899','#f9a8d4','#8b5cf6'],
  ['ember','Ember','#dc2626','#fca5a5','#f59e0b'],
  ['mint','Mint','#14b8a6','#5eead4','#0ea5e9'],
  ['mono','Slate','#475569','#94a3b8','#0f172a']
];
let S = { classes:[], active:null, theme:'auto', skin:'melon', accent:'', classic:false,
          gbView:'card', term:'Q1', gpaBump:1, goal:'gpa' };
const ui = { paste:false, settings:false, sort:'date', q:'', sliderFor:null, pasteText:'', modal:null, filter:'all', editing:null };
let undoStack = [], lastLetter = null, chartT = null;

function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e){}
  if (!Array.isArray(S.classes)) S.classes = [];
  S.classes.forEach(c => {
    c.categories = Array.isArray(c.categories) && c.categories.length ? c.categories : DEFAULT_CATS();
    c.assignments = Array.isArray(c.assignments) ? c.assignments : [];
    if (c.weighted === undefined) c.weighted = isWeighted(c.name);
  });
  if (!S.active || !S.classes.some(c => c.id === S.active)) S.active = S.classes[0]?.id || null;
}
const activeClass = () => S.classes.find(c => c.id === S.active) || null;
/* the original marks a course weighted from its title */
const isWeighted = name => /\b(AP|IB|Hon|Honors|Magnet|Mag)\b/i.test(String(name||''));

function newClass(name, period){
  const c = { id:uid(), name:name || 'New class', teacher:'', period:period || '', term:S.term,
              categories:DEFAULT_CATS(), assignments:[], weighted:isWeighted(name) };
  S.classes.push(c); save(); return c;
}
function catFor(cls, name){
  const found = cls.categories.find(c => norm(c.name) === norm(name));
  if (found) return found;
  const canon = canonical(name);
  if (canon){
    const byCanon = cls.categories.find(c => norm(c.name) === norm(canon.name));
    if (byCanon) return byCanon;
    const nc = { id:uid(), name:canon.name, weight:canon.weight };
    cls.categories.push(nc); return nc;
  }
  const nc = { id:uid(), name, weight:0 };
  cls.categories.push(nc); return nc;
}

const dateLabel = ts => ts ? new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'}) : '—';
const gcolor = L => L ? `var(--${L})` : 'var(--faint)';

const gpaPoints = (L, weighted) => (POINTS[L] ?? 0) + (weighted && POINTS[L] !== undefined ? +S.gpaBump : 0);

function schoolGPA(){
  const graded = S.classes.map(c => ({ c, r:computeClass(c) })).filter(x => x.r.letter);
  if (!graded.length) return null;
  const un = graded.reduce((s,x) => s + (POINTS[x.r.letter] ?? 0), 0) / graded.length;
  const w  = graded.reduce((s,x) => s + gpaPoints(x.r.letter, x.c.weighted), 0) / graded.length;
  return { un, w, n:graded.length };
}

const Confetti = (() => {
  const cv = $('#confetti'); const ctx = cv.getContext('2d');
  let parts = [], raf = null;
  function resize(){
    const d = Math.min(devicePixelRatio || 1, 2);
    cv.width = innerWidth*d; cv.height = innerHeight*d;
    cv.style.width = innerWidth+'px'; cv.style.height = innerHeight+'px';
    ctx.setTransform(d,0,0,d,0,0);
  }
  addEventListener('resize', resize); resize();
  function burst(n){
    if (reduced()) return;
    const cs = getComputedStyle(document.documentElement);
    const COLORS = ['--acc','--acc2','--acc3','--skin-glow'].map(v => cs.getPropertyValue(v).trim() || '#f43f5e')
      .concat(['#121814','#fff8f2']);
    for (let i = 0; i < (n||96); i++) parts.push({
      x: innerWidth/2 + (Math.random()-.5)*240, y: innerHeight*0.34,
      vx:(Math.random()-.5)*13, vy:-(Math.random()*13+7),
      w:5+Math.random()*8, h:4+Math.random()*7, seed: Math.random() < .35,
      rot:Math.random()*6.283, vr:(Math.random()-.5)*.36,
      c:COLORS[(Math.random()*COLORS.length)|0], life:0 });
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    parts = parts.filter(p => p.life < 200 && p.y < innerHeight+60);
    for (const p of parts){
      p.life++; p.vy += .34; p.vx *= .994; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, 1 - p.life/200); ctx.fillStyle = p.c;
      if (p.seed){ ctx.beginPath(); ctx.ellipse(0,0,p.w/2,p.h/1.4,0,0,6.283); ctx.fill(); }
      else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    }
    if (parts.length) raf = requestAnimationFrame(tick);
    else { raf = null; ctx.clearRect(0,0,innerWidth,innerHeight); }
  }
  return { burst };
})();

/* ==================================================================
   INSIGHTS ENGINE
   Deterministic. Every number below comes from the gradebook — nothing
   here guesses, and nothing here is motivational filler.
   ================================================================== */
function classRemaining(cls){
  const byCat = {}; let total = 0, count = 0;
  for (const a of cls.assignments){
    if (a.graded || !a.included || a.excused) continue;
    const p = num(a.possible) || 0;
    if (p <= 0) continue;
    byCat[a.catId] = (byCat[a.catId] || 0) + p; total += p; count++;
  }
  return { byCat, total, count };
}
/* score `fraction` on everything still ungraded */
function projectAll(cls, fraction){
  const rem = classRemaining(cls);
  if (!rem.total) return computeClass(cls);
  const extra = Object.entries(rem.byCat).map(([catId,p]) =>
    ({ id:'proj_'+catId, catId, earned:p*fraction, possible:p, graded:true, included:true }));
  return computeClass({ categories:cls.categories, assignments:cls.assignments.filter(a => a.graded || !a.included).concat(extra) });
}
/* what this one assignment does to the class grade at a given score */
function projectOne(cls, id, fraction){
  const sub = { categories:cls.categories, assignments:cls.assignments.map(x =>
    x.id === id ? { ...x, earned:(num(x.possible)||0)*fraction, graded:true, included:true } : x) };
  return computeClass(sub).pct;
}
function trendOf(cls){
  const pts = trendSeries(cls);
  if (pts.length < 3) return { dir:'flat', delta:0, n:pts.length, enough:false };
  const k = Math.min(4, pts.length - 1);
  const delta = pts[pts.length-1].pct - pts[pts.length-1-k].pct;
  return { dir: delta > .75 ? 'up' : delta < -.75 ? 'down' : 'flat', delta, n:pts.length, enough:true, over:k };
}

const STATUS = {
  safe:    { label:'Safe',       tone:'good', note:'Comfortably inside this letter.' },
  close:   { label:'Close',      tone:'warn', note:'Within reach of the next letter.' },
  risk:    { label:'At risk',    tone:'bad',  note:'The current letter could slip.' },
  locked:  { label:'Locked in',  tone:'info', note:'Remaining work cannot change the letter.' },
  unknown: { label:'No grades',  tone:'muted',note:'Nothing graded yet.' }
};

function analyze(cls){
  const r = computeClass(cls);
  const rem = classRemaining(cls);
  const trend = trendOf(cls);
  const missing = cls.assignments.filter(a => a.missing && a.included).length;
  const out = { r, rem, trend, missing, insights:[], opp:0, oppBand:'low', status:'unknown' };
  if (r.pct === null){
    out.insights.push({ sev:'muted', text:'Nothing is graded in this class yet, so there is no grade to work with.' });
    return out;
  }
  const cur = r.letter;
  const here = CUTS.find(c => c[1] <= r.pct);
  const below = CUTS[CUTS.findIndex(c => c[0] === here[0]) + 1];
  const nc = nextCut(r.pct);
  const best = projectAll(cls, 1), worst = projectAll(cls, 0);
  out.best = best.pct; out.worst = worst.pct;
  out.bestL = letterFor(best.pct); out.worstL = letterFor(worst.pct);
  out.toNext = nc ? nc[1] - r.pct : null;
  out.nextL = nc ? nc[0] : null;
  out.cushion = here[1] > -Infinity ? r.pct - here[1] : null;
  out.dropL = below ? below[0] : null;
  out.canReachNext = nc ? best.pct >= nc[1] : false;

  /* the realistic path: keep scoring what you have been scoring lately */
  const recent = cls.assignments.filter(a => a.graded && a.included && num(a.possible) > 0)
    .sort((x,y) => (y.date||0) - (x.date||0)).slice(0,5);
  const recentAvg = recent.length
    ? recent.reduce((s,a) => s + num(a.earned)/num(a.possible), 0) / recent.length
    : r.pct/100;
  out.recentAvg = recentAvg * 100;
  const expected = rem.total ? projectAll(cls, recentAvg) : r;
  out.expected = expected.pct; out.expectedL = letterFor(expected.pct);

  /* status — where you are actually heading, not the worst thing imaginable */
  if (out.bestL === out.worstL) out.status = 'locked';
  else if (POINTS[out.expectedL] < POINTS[cur]) out.status = 'risk';
  else if (nc && out.toNext <= 2.5 && out.canReachNext) out.status = 'close';
  else out.status = 'safe';

  /* opportunity — is your time worth spending here, and why */
  const inPlay = Math.min(1, (best.pct - worst.pct) / 12);
  let opp = 0, kind = 'none';
  if (nc && out.canReachNext){
    const proximity = Math.max(0, 1 - out.toNext / 8);
    const power = Math.min(1, ((best.pct - r.pct) / Math.max(out.toNext, .01)) / 3);
    opp = 0.55 * proximity + 0.45 * power; kind = 'raise';
  }
  if (out.status === 'risk' && 0.72 > opp){ opp = 0.72; kind = 'protect'; }
  if (missing && 0.5 + Math.min(.3, missing * .1) > opp){ opp = 0.5 + Math.min(.3, missing * .1); kind = 'recover'; }
  if (inPlay * 0.34 > opp){ opp = inPlay * 0.34; kind = 'room'; }
  if (out.status === 'locked'){ opp = Math.min(opp, .05); kind = 'locked'; }
  out.opp = Math.round(opp * 100);
  out.oppKind = kind;
  out.oppLabel = { raise:'Can reach the next letter', protect:'Worth protecting', recover:'Missing work to recover',
                   room:'Still movable', locked:'Locked in', none:'Nothing to gain' }[kind];
  out.oppBand = out.opp >= 60 ? 'high' : out.opp >= 28 ? 'medium' : 'low';

  /* insights — each one states the number it is based on */
  if (nc && out.canReachNext && out.toNext <= 2.5)
    out.insights.push({ sev:'good', key:'close',
      text:`You are ${out.toNext.toFixed(2)} points from ${article(nc[0])} ${nc[0]}. Remaining work can cover that.`,
      cta:{ label:'See what you need', act:'optimize' } });
  else if (nc && !out.canReachNext && rem.total > 0)
    out.insights.push({ sev:'info', key:'unreachable',
      text:`${article(nc[0])[0].toUpperCase()+article(nc[0]).slice(1)} ${nc[0]} is out of reach from the work listed — 100% on everything left tops out at ${best.pct.toFixed(2)}%.` });
  if (out.status === 'locked' && rem.total > 0)
    out.insights.push({ sev:'info', key:'locked',
      text:`This letter is settled: everything left still lands you between ${worst.pct.toFixed(2)}% and ${best.pct.toFixed(2)}% — all ${out.bestL}.` });
  if (out.status === 'locked' && rem.total === 0)
    out.insights.push({ sev:'info', key:'nowork',
      text:`Nothing is ungraded here, so ${r.pct.toFixed(2)}% holds until your teacher posts more work.` });
  if (out.status === 'risk')
    out.insights.push({ sev:'warn', key:'risk',
      text:`Keep scoring what you have lately (${out.recentAvg.toFixed(1)}%) and the ${rem.count} ungraded item${rem.count===1?'':'s'} land you on ${out.expected.toFixed(2)}% — ${out.expectedL}, down from ${cur}.` });
  else if (POINTS[out.worstL] < POINTS[cur] && rem.total > 0 && out.cushion !== null && out.cushion < 4)
    out.insights.push({ sev:'info', key:'floor',
      text:`Only ${out.cushion.toFixed(2)} points of cushion — zeros on the ${rem.count} ungraded item${rem.count===1?'':'s'} would drop you to ${out.worstL}.` });
  if (trend.enough && trend.dir === 'down')
    out.insights.push({ sev:'warn', key:'down',
      text:`Down ${Math.abs(trend.delta).toFixed(2)} points over the last ${trend.over} graded assignments.` });
  if (trend.enough && trend.dir === 'up')
    out.insights.push({ sev:'good', key:'up',
      text:`Up ${trend.delta.toFixed(2)} points over the last ${trend.over} graded assignments.` });
  if (missing)
    out.insights.push({ sev:'bad', key:'missing',
      text:`${missing} assignment${missing===1?' is':'s are'} marked missing. Those are usually the cheapest points to get back.` });
  if (out.oppKind === 'room' && rem.total > 0)
    out.insights.push({ sev:'info', key:'room',
      text:`${rem.total} points are still ungraded — enough to land anywhere between ${worst.pct.toFixed(2)}% and ${best.pct.toFixed(2)}%.` });
  /* the single most useful upcoming assignment */
  const up = upcomingImpact(cls);
  if (up.length){
    const t = up[0];
    if (t.swing >= .5) out.insights.push({ sev:'info', key:'biggest',
      text:`${t.a.name.slice(0,44)} is the one that moves the needle — the gap between a 100 and a 0 on it is ${t.swing.toFixed(2)} points of your grade.`,
      cta:{ label:'Show assignments', act:'scrollRows' } });
  }
  /* weakest category that actually carries weight */
  const weak = r.cats.filter(c => c.active && c.cat.weight > 0).sort((a,b) => a.pct - b.pct)[0];
  if (weak && r.cats.filter(c => c.active).length > 1 && weak.pct < r.pct - 3)
    out.insights.push({ sev:'info', key:'category',
      text:`${weak.cat.name} is your weakest category at ${weak.pct.toFixed(2)}%, and it is ${weak.cat.weight}% of the grade.` });
  if (!out.insights.length)
    out.insights.push({ sev:'good', key:'stable', text:`Nothing needs attention here — ${cur} with ${out.cushion !== null ? out.cushion.toFixed(2)+' points of cushion' : 'room to spare'}.` });
  return out;
}

/* ungraded assignments ranked by how much they can swing the grade */
function upcomingImpact(cls){
  const base = computeClass(cls).pct;
  if (base === null) return [];
  return cls.assignments
    .filter(a => !a.graded && a.included && num(a.possible) > 0)
    .map(a => {
      const hi = projectOne(cls, a.id, 1), lo = projectOne(cls, a.id, 0);
      return { a, hi, lo, swing: (hi ?? 0) - (lo ?? 0), gain: (hi ?? 0) - base, loss: base - (lo ?? 0) };
    })
    .sort((x,y) => y.swing - x.swing);
}

/* stable order for the grid: by period, then the order they were added */
function classRows(){
  return S.classes.map((c,i) => ({ c, a:analyze(c), i }))
    .sort((x,y) => {
      const px = num(x.c.period), py = num(y.c.period);
      if (px !== null && py !== null && px !== py) return px - py;
      if (px !== null && py === null) return -1;
      if (px === null && py !== null) return 1;
      return x.i - y.i;
    });
}
/* ranked by how much your time can actually move the grade */
function analyzeAll(){
  return classRows().sort((x,y) => y.a.opp - x.a.opp || (x.a.r.pct ?? 999) - (y.a.r.pct ?? 999));
}

/* ==================================================================
   MULTI-CLASS PASTE — split one paste into several classes
   ================================================================== */
const isAnchorLine = l => RE.anchor.test(l) || (RE.anchor2.test(l) && /[a-z]{3}/i.test(l));
const HEADER_SKIP = /^(home|grade|grades|gradebook|attendance|calendar|student|report|documents?|schedule|marking\s*period|quarter|semester|term|assignment|score|points|due|date|category|total|weight|week|current|progress|class\s*grade|teacher)\b/i;

function splitClasses(text){
  const lines = String(text||'').replace(/\r/g,'').replace(/ /g,' ')
    .split('\n').map(l => l.replace(/\s+/g,' ').trim());
  const used = new Array(lines.length).fill(false);
  for (let i = 0; i < lines.length; i++){
    if (!isAnchorLine(lines[i])) continue;
    used[i] = true;
    let j = i-1, taken = 0;
    while (j >= 0 && taken < 3){
      if (!lines[j]){ j--; continue; }
      if (RE.week.test(lines[j])) break;
      used[j] = true; taken++;
      if (RE.month.test(lines[j])) break;
      j--;
    }
    for (let k = i+1; k < lines.length && k <= i+6; k++){
      const s = lines[k];
      if (!s) continue;
      if (isAnchorLine(s) || RE.week.test(s) || RE.month.test(s)) break;
      if (RE.pct.test(s) || RE.outOf.test(s) || RE.numOnly.test(s) || RE.flag.test(s)){ used[k] = true; continue; }
      break;
    }
  }
  const heads = [];
  for (let i = 0; i < lines.length; i++){
    const l = lines[i];
    if (!l || used[i]) continue;
    if (RE.week.test(l) || RE.itemcnt.test(l) || RE.month.test(l) || RE.day.test(l) || RE.pct.test(l)) continue;
    if (!/[a-z]{3}/i.test(l) || l.length > 80) continue;
    if (HEADER_SKIP.test(l)) continue;
    let hasWork = false;
    for (let k = i+1; k < Math.min(lines.length, i+10); k++) if (isAnchorLine(lines[k])){ hasWork = true; break; }
    if (hasWork) heads.push(i);
  }
  if (heads.length < 2) return null;
  const chunks = [];
  for (let h = 0; h < heads.length; h++){
    const from = heads[h], to = h+1 < heads.length ? heads[h+1] : lines.length;
    const body = lines.slice(from, to);
    if (!body.some(isAnchorLine)) continue;
    chunks.push({ header:lines[from], text:body.join('\n') });
  }
  return chunks.length >= 2 ? chunks : null;
}
function cleanCourseName(h){
  return String(h||'').replace(/^\s*(period|per\.?|pd\.?)\s*(\d+)\s*[:\-–]?\s*/i,'')
    .replace(/^\s*(course|class|subject)\s*[:\-–]\s*/i,'').replace(/\s*\(.*\)\s*$/,'').trim();
}
const periodFrom = h => (String(h||'').match(/\b(?:period|per\.?|pd\.?)\s*(\d+)/i) || [])[1] || '';

/* ==================================================================
   IMPORT
   ================================================================== */
function importInto(cls, text, replace, quiet, rep){
  const { items, guess } = parseGradebook(text);
  if (!items.length) return 0;
  const wasSample = !!cls.sample;
  if (replace || wasSample) cls.assignments = [];
  const key = a => (a.name + '|' + a.possible + '|' + (a.date||'')).toLowerCase();
  const have = new Set(cls.assignments.map(key));
  let added = 0;
  for (const it of items){
    if (have.has(key(it))){ if (rep) rep.dupes++; continue; }
    const cat = catFor(cls, it.catName);
    if (rep && !cat.weight) rep.noWeight.add(cat.name);
    if (rep){ if (it.graded) rep.graded++; else rep.ungraded++; if (it.missing) rep.missing++; if (it.excused) rep.excused++; }
    const row = { ...it, catId:cat.id };
    cls.assignments.push(row);
    if (rep) (rep.newIds[cls.id] = rep.newIds[cls.id] || []).push(row.id);
    have.add(key(it)); added++;
  }
  if (wasSample){ delete cls.sample; cls.name = guess || 'My class'; cls.teacher = ''; cls.period = ''; }
  else if (guess && /^(new class|untitled|my class)$/i.test(cls.name)) cls.name = guess;
  cls.weighted = isWeighted(cls.name);
  return added;
}

function newReport(){ return { classes:[], added:0, graded:0, ungraded:0, missing:0, excused:0, dupes:0,
  noWeight:new Set(), changes:[], newIds:{} }; }
/* of the rows that just arrived, which one moved the grade most? */
function biggestCause(cls, ids){
  if (!ids || !ids.length) return null;
  const now = computeClass(cls).pct;
  if (now === null) return null;
  let best = null;
  for (const id of ids){
    const a = cls.assignments.find(x => x.id === id);
    if (!a || !a.graded || !a.included) continue;
    const without = computeClass(cls, { skipId:id }).pct;
    if (without === null) continue;
    const d = now - without;
    if (!best || Math.abs(d) > Math.abs(best.d)) best = { a, d };
  }
  return best;
}
function finishReport(rep, quiet){
  rep.noWeight = [...rep.noWeight];
  if (!quiet){ S.lastImport = { ...rep, when:Date.now() }; }
  save();
}
function importPaste(text, replace, quiet){
  const rep = newReport();
  const chunks = splitClasses(text);
  if (chunks){
    const before = JSON.parse(JSON.stringify(S.classes));
    S.classes = S.classes.filter(c => !c.sample);
    let made = 0, total = 0;
    for (const ch of chunks){
      const nm = cleanCourseName(ch.header) || 'Class ' + (made+1);
      let cls = S.classes.find(c => norm(c.name) === norm(nm));
      const before = cls ? computeClass(cls).pct : null;
      if (!cls){ cls = newClass(nm, periodFrom(ch.header)); made++; }
      const n = importInto(cls, ch.text, replace, true, rep);
      total += n;
      const after = computeClass(cls).pct;
      rep.classes.push({ id:cls.id, name:cls.name, n, before, after });
      if (before !== null && after !== null && Math.abs(after-before) > .01)
      rep.changes.push({ id:cls.id, name:cls.name, before, after, cause:biggestCause(cls, rep.newIds[cls.id]) });
    }
    rep.added = total;
    S.active = S.classes[0]?.id || null;
    ui.paste = false; ui.pasteText = '';
    finishReport(rep, quiet); render();
    toast(`Added ${made} class${made===1?'':'es'} · ${total} assignments`,
      { label:'Undo', run(){ S.classes = before; S.active = S.classes[0]?.id||null; render(); } });
    return total;
  }
  let cls = activeClass();
  if (!cls || ui.forceNewClass){ cls = newClass('New class'); S.active = cls.id; ui.forceNewClass = false; }
  const before = cls.assignments.slice(), beforeName = cls.name;
  const beforePct = computeClass(cls).pct;
  const added = importInto(cls, text, replace, quiet, rep);
  if (!added && !cls.assignments.length){ if (!quiet) toast("That doesn't look like a gradebook — see Help"); return 0; }
  const afterPct = computeClass(cls).pct;
  rep.added = added;
  rep.classes.push({ id:cls.id, name:cls.name, n:added, before:beforePct, after:afterPct });
  if (beforePct !== null && afterPct !== null && Math.abs(afterPct-beforePct) > .01)
    rep.changes.push({ id:cls.id, name:cls.name, before:beforePct, after:afterPct, cause:biggestCause(cls, rep.newIds[cls.id]) });
  ui.paste = false; ui.pasteText = '';
  finishReport(rep, quiet); render(); lastLetter = computeClass(cls).letter;
  if (!quiet) toast(`Imported ${added} assignment${added===1?'':'s'}`,
    { label:'Undo', run(){ cls.assignments = before; cls.name = beforeName; render(); } });
  return added;
}

/* ==================================================================
   SHARED-ELEMENT TRANSITION (FLIP)
   ================================================================== */
function flipTo(fromEl, run, targetSel){
  if (reduced() || !fromEl){ run(); return; }
  const first = fromEl.getBoundingClientRect();
  const clone = fromEl.cloneNode(true);
  Object.assign(clone.style, { position:'fixed', left:first.left+'px', top:first.top+'px',
    width:first.width+'px', height:first.height+'px', margin:'0', zIndex:'110', pointerEvents:'none',
    borderRadius:getComputedStyle(fromEl).borderRadius });
  document.body.appendChild(clone);
  run();
  const target = $(targetSel || '#classHero');
  if (!target){ clone.remove(); return; }
  const last = target.getBoundingClientRect();
  const anim = clone.animate([
    { transform:'none', opacity:1 },
    { transform:`translate(${last.left-first.left}px, ${last.top-first.top}px) scale(${(last.width/first.width).toFixed(3)}, ${(last.height/first.height).toFixed(3)})`, opacity:0 }
  ], { duration:440, easing:'cubic-bezier(.22,.85,.28,1)' });
  anim.onfinish = () => clone.remove();
  target.animate([{ opacity:0, transform:'scale(.95)' },{ opacity:1, transform:'none' }],
    { duration:400, easing:'cubic-bezier(.22,.85,.28,1)' });
}

const GOALS = [
  ['gpa',       'Maximize my GPA'],
  ['allA',      "Get all A's"],
  ['raiseLow',  'Raise my lowest class'],
  ['protect',   "Protect the A's I have"],
  ['understand','Just help me understand']
];
const FILTERS = [
  ['all',    'All',              () => true],
  ['attn',   'Needs attention',  x => x.a.status === 'risk' || x.a.missing > 0 || x.a.trend.dir === 'down'],
  ['close',  'Close to next',    x => x.a.status === 'close'],
  ['as',     "A's",              x => x.a.r.letter === 'A'],
  ['under',  'Below 90%',        x => x.a.r.pct !== null && x.a.r.pct < 89.5],
  ['down',   'Trending down',    x => x.a.trend.dir === 'down'],
  ['whatif', 'What-if active',   x => whatIfCount(x.c) > 0]
];

function glanceSay(rows){
  const graded = rows.filter(x => x.a.r.pct !== null);
  if (!graded.length) return { say:'Paste your grades to get started.', sub:'Nothing is graded yet.' };
  const g = schoolGPA();
  const risky = graded.filter(x => x.a.status === 'risk').length;
  const closeN = graded.filter(x => x.a.status === 'close').length;
  const allA = graded.every(x => x.a.r.letter === 'A');
  const ab = graded.filter(x => 'AB'.includes(x.a.r.letter)).length;
  const low = graded.filter(x => 'DE'.includes(x.a.r.letter)).length;
  let say;
  if (allA) say = "Straight A's. Keep it there.";
  else if (risky) say = `${risky} class${risky===1?'':'es'} ${risky===1?'is':'are'} heading the wrong way.`;
  else if (low) say = `${low} class${low===1?'':'es'} ${low===1?'needs':'need'} the most work.`;
  else if (closeN) say = `${closeN} class${closeN===1?'':'es'} within reach of the next letter.`;
  else if (ab === graded.length) say = "You're doing well.";
  else say = "Mostly steady, one class trailing.";
  const counts = ['A','B','C','D','E'].map(L => [L, graded.filter(x => x.a.r.letter === L).length]).filter(([,n]) => n);
  return { say, sub:`${graded.length} graded class${graded.length===1?'':'es'}`, counts };
}

/* one line saying why this class is where it is in the list */
const KIND_KEY = { raise:'close', protect:'risk', recover:'missing', room:'room', locked:'locked' };
function whyLine(x, goal){
  const a = x.a;
  if (a.r.pct === null) return 'Nothing graded yet.';
  if (goal === 'understand') return `${a.r.pct.toFixed(2)}% — ${STATUS[a.status].note}`;
  /* lead with the reason this class ranked where it did */
  const want = KIND_KEY[a.oppKind];
  const pick = a.insights.find(i => i.key === want)
    || a.insights.find(i => ['locked','nowork','unreachable'].includes(i.key))
    || a.insights[0];
  return pick ? pick.text : `${a.r.pct.toFixed(2)}% right now.`;
}

function focusList(){
  const goal = S.goal || 'gpa';
  let list = analyzeAll().filter(x => x.a.r.pct !== null);
  const riskRank = x => x.a.status === 'risk' ? 3 : x.a.status === 'close' ? 2 : x.a.status === 'safe' ? 1 : 0;
  if (goal === 'raiseLow')        list.sort((x,y) => x.a.r.pct - y.a.r.pct);
  else if (goal === 'protect')    list.sort((x,y) => riskRank(y) - riskRank(x) || (x.a.cushion ?? 99) - (y.a.cushion ?? 99));
  else if (goal === 'understand') list.sort((x,y) => y.a.r.pct - x.a.r.pct);
  else if (goal === 'allA')       list.sort((x,y) => (y.a.r.letter === 'A' ? -1 : 0) - (x.a.r.letter === 'A' ? -1 : 0) || y.a.opp - x.a.opp);
  return list;
}
