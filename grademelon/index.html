/* ==================================================================
   ASSISTANT — answers from the gradebook, never from invention.
   Rules-based intent matching, not a language model: if the data does
   not support an answer it says so rather than guessing.
   ================================================================== */
function findClass(text){
  const t = norm(text); if (!t) return null;
  let best = null, score = 0;
  for (const c of S.classes){
    const n = norm(c.name); let sc = 0;
    if (n === t) sc = 200;
    else if (t.length >= 3 && n.includes(t)) sc = 90 + t.length;
    else if (n.length >= 3 && t.includes(n)) sc = 80 + n.length;
    else {
      const ts = String(text).toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length > 2);
      const ns = String(c.name).toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length > 1);
      sc = ts.filter(w => ns.some(x => x.startsWith(w) || w.startsWith(x))).length * 25;
    }
    if (sc > score){ score = sc; best = c; }
  }
  return score >= 25 ? best : null;
}
const LETTER_WORDS = { 'a':'A','an a':'A','b':'B','a b':'B','c':'C','a c':'C','d':'D','a d':'D' };
function wantedLetter(q){
  const m = q.match(/\b(?:get|make|reach|keep|hit|earn|finish with|to)?\s*an?\s*([abcde])\b/i);
  if (m) return m[1].toUpperCase();
  const m2 = q.match(/\b([abcde])\s*(?:in|for)\b/i);
  if (m2) return m2[1].toUpperCase();
  return null;
}
function wantedPct(q){ const m = q.match(/(\d{1,3}(?:\.\d+)?)\s*%/); return m ? parseFloat(m[1]) : null; }

function ask(q){
  const raw = String(q||'').trim();
  const low = raw.toLowerCase();
  if (!raw) return null;
  const acts = [];
  const cls = findClass(raw.replace(/^(what|how|which|can|show|why|do)\b/i,''));
  const a = cls ? analyze(cls) : null;
  const say = t => ({ answer:t, hits:acts });

  /* straight navigation */
  if (/^(gpa|my gpa|show (my )?gpa)$/.test(low) || /\bgpa\b/.test(low) && !cls){
    const g = schoolGPA();
    if (!g) return say(`Nothing is graded yet, so there is no GPA to show.`);
    acts.push({ label:'Open GPA', act:()=>go('gpa') });
    return say(`<b>${g.w.toFixed(3)}</b> weighted, <b>${g.un.toFixed(3)}</b> unweighted, across ${g.n} graded class${g.n===1?'':'es'}.`);
  }
  if (/\bsemester\b/.test(low)){ acts.push({ label:'Open semester', act:()=>go('semester') });
    return say(`The semester grade comes from your two marking period letters — averaged, ties rounding up.`); }
  if (/\b(theme|colour|color|dark mode|look)\b/.test(low)){ acts.push({ label:'Open Look & feel', act:themeModal });
    return say(`Themes, light/dark and a custom accent colour live in Look & feel.`); }
  if (/\b(help|how do i|instructions|paste)\b/.test(low) && !cls){ acts.push({ label:'Open help', act:()=>go('help') });
    return say(`Copy your assignment list out of StudentVUE and press Ctrl/⌘ + V anywhere on this page.`); }

  /* biggest-impact assignment */
  if (/\b(assignment|test|quiz|which one)\b/.test(low) && /\b(matter|impact|biggest|most)\b/.test(low)){
    const target = cls || focusList()[0]?.c;
    if (!target) return say(`Add a class first.`);
    const up = upcomingImpact(target);
    if (!up.length) return say(`Everything in <b>${esc(target.name)}</b> is already graded, so no single assignment is still in play.`);
    const t = up[0];
    acts.push({ label:`Open ${target.name}`, act:()=>openClass(target.id, null) });
    return say(`In <b>${esc(target.name)}</b>: <b>${esc(String(t.a.name).slice(0,48))}</b>. A 100 on it is worth ${t.gain>=0?'+':''}${t.gain.toFixed(2)} points; a 0 costs you ${t.loss.toFixed(2)}.`);
  }
  /* what should I do */
  if (/\b(what should i|study|focus|priorit|work on|do next|matters)\b/.test(low)){
    const f = focusList();
    if (!f.length) return say(`Nothing is graded yet, so there is nothing to prioritise.`);
    const t = f[0];
    acts.push({ label:`Open ${t.c.name}`, act:()=>openClass(t.c.id, null) });
    acts.push({ label:'Make a study plan', act:planModal });
    return say(`<b>${esc(t.c.name)}</b> first. ${esc(whyLine(t, S.goal||'gpa'))}`);
  }
  /* classes below a number */
  const belowM = low.match(/\b(below|under|less than)\s*(\d{1,3})/);
  if (belowM){
    const lim = +belowM[2];
    const list = classRows().filter(x => x.a.r.pct !== null && x.a.r.pct < lim);
    if (!list.length) return say(`No class is below ${lim}%.`);
    acts.push({ label:'Show them', act:()=>{ ui.filter='under'; go('gradebook'); } });
    return say(`${list.length} below ${lim}%: ${list.map(x => `<b>${esc(x.c.name)}</b> ${x.a.r.pct.toFixed(2)}%`).join(', ')}.`);
  }
  /* why did my grade drop */
  if (/\b(why|drop|fell|went down|lower)\b/.test(low)){
    const target = cls || classRows().map(x=>x).sort((x,y)=>(x.a.trend.delta)-(y.a.trend.delta))[0]?.c;
    if (!target) return say(`Add a class first.`);
    const an = analyze(target), pts = trendSeries(target);
    if (!an.trend.enough) return say(`<b>${esc(target.name)}</b> has only ${pts.length} graded assignment${pts.length===1?'':'s'} — not enough to show a direction yet.`);
    const worst = pts.slice(1).map((p,i) => ({ p, drop: pts[i].pct - p.pct })).sort((x,y) => y.drop - x.drop)[0];
    acts.push({ label:`Open ${target.name}`, act:()=>openClass(target.id, null) });
    if (an.trend.dir === 'down' && worst && worst.drop > 0.05)
      return say(`<b>${esc(target.name)}</b> is down ${Math.abs(an.trend.delta).toFixed(2)} points over the last ${an.trend.over} graded assignments. The single biggest drop was after <b>${esc(String(worst.p.a.name).slice(0,44))}</b> — it took ${worst.drop.toFixed(2)} points off.`);
    return say(`<b>${esc(target.name)}</b> is not falling — it is ${an.trend.dir === 'up' ? `up ${an.trend.delta.toFixed(2)}` : 'flat'} over the last ${an.trend.over} graded assignments.`);
  }

  /* everything below wants a class */
  if (!cls){
    const f = focusList();
    if (!S.classes.length) return say(`Nothing is in here yet. Paste a gradebook and ask again.`);
    if (f.length){ acts.push({ label:`Open ${f[0].c.name}`, act:()=>openClass(f[0].c.id, null) }); }
    return say(`I could not tell which class you meant. Try naming one — ${S.classes.slice(0,3).map(c=>`<b>${esc(c.name)}</b>`).join(', ')}.`);
  }
  acts.push({ label:`Open ${cls.name}`, act:()=>openClass(cls.id, null) });
  if (a.r.pct === null) return say(`<b>${esc(cls.name)}</b> has nothing graded yet.`);

  /* what if I get everything right */
  if (/\b(100|perfect|everything|all of it|ace)\b/.test(low) && /\b(what if|if i)\b/.test(low)){
    const best = a.best;
    return say(`100% on every ungraded item in <b>${esc(cls.name)}</b> takes it from ${a.r.pct.toFixed(2)}% to <b>${best.toFixed(2)}%</b> — ${letterFor(best)}.`);
  }
  if (/\bclose\b/.test(low) || /\bhow am i\b/.test(low)){
    if (!a.nextL) return say(`<b>${esc(cls.name)}</b> is at ${a.r.pct.toFixed(2)}% — top of the scale.`);
    return say(`<b>${esc(cls.name)}</b> is ${a.r.pct.toFixed(2)}% — ${a.toNext.toFixed(2)} points from ${article(a.nextL)} ${a.nextL}. ${a.canReachNext ? 'Remaining work can cover it.' : `From the work listed it tops out at ${a.best.toFixed(2)}%.`}`);
  }
  /* can I still get an X */
  const want = wantedLetter(low), wantPct = wantedPct(low);
  const targetPct = wantPct !== null ? wantPct : (want ? (CUTS.find(c => c[0] === want) || [])[1] : null);
  if (targetPct !== null && /\b(need|get|reach|still|can i|close|what do i|how much)\b/.test(low)){
    if (a.r.pct >= targetPct)
      return say(`You are already there — <b>${esc(cls.name)}</b> is ${a.r.pct.toFixed(2)}%, above ${targetPct}%.`);
    if (a.rem.total === 0)
      return say(`Nothing is ungraded in <b>${esc(cls.name)}</b>, so ${a.r.pct.toFixed(2)}% is where it sits until your teacher posts more.`);
    const res = neededFraction(cls, a.rem.byCat, targetPct);
    acts.push({ label:'Open the solver', act:()=>{ S.active = cls.id; go('class'); setTimeout(optimizeModal, 260); } });
    if (res.impossible)
      return say(`Not reachable. Even 100% on all ${a.rem.total} remaining points in <b>${esc(cls.name)}</b> tops out at <b>${res.best.toFixed(2)}%</b>. Your realistic ceiling is ${letterFor(res.best)}.`);
    return say(`You need to average <b>${(res.f*100).toFixed(1)}%</b> on the ${a.rem.total} points still to come in <b>${esc(cls.name)}</b>. That lands you at ${res.result.toFixed(2)}%.`);
  }
  /* fallback: the class summary */
  return say(`<b>${esc(cls.name)}</b> is ${a.r.pct.toFixed(2)}% — ${a.r.letter}. ${esc(a.insights[0]?.text || '')}`);
}

/* "what do I need on everything that's left" — solved across all categories at once */
function neededFraction(cls, remaining, target){
  const at = f => {
    let sub = { categories:cls.categories, assignments:cls.assignments.slice() };
    for (const [catId, rem] of Object.entries(remaining)){
      if (!(rem > 0)) continue;
      sub.assignments.push({ id:'sim'+catId, catId, earned:f*rem, possible:rem, graded:true, included:true });
    }
    return computeClass(sub).pct ?? 0;
  };
  if (at(1) < target) return { impossible:true, best:at(1) };
  if (at(0) >= target) return { freebie:true, floor:at(0) };
  let lo = 0, hi = 1;
  for (let i = 0; i < 60; i++){ const mid = (lo+hi)/2; if (at(mid) >= target) hi = mid; else lo = mid; }
  return { f:hi, result:at(hi) };
}

function updateOptimize(){
  const cls = activeClass(); const out = $('#optOut'); if (!cls || !out) return;
  const tsel = $('#optTarget').value;
  $('#optCustomWrap').hidden = tsel !== 'custom';
  const target = tsel === 'custom' ? (num($('#optCustom').value) ?? 90) : num(tsel);
  const remaining = {};
  $$('.optrem').forEach(i => { remaining[i.dataset.rem] = num(i.value) ?? 0; });
  const totalRem = Object.values(remaining).reduce((s,v) => s+v, 0);
  const why = $('#optWhy'), brk = $('#optBreak');
  if (!totalRem){ out.textContent = '—'; why.textContent = 'Put in the points still to come.'; brk.innerHTML = ''; return; }
  const res = neededFraction(cls, remaining, target);
  if (res.impossible){
    const bl = letterFor(res.best);
    out.textContent = 'Not reachable';
    why.innerHTML = `Even 100% on all ${totalRem} remaining points tops out at <b>${res.best.toFixed(2)}%</b> — ${bl}.
      Your best realistic target is that <b>${res.best.toFixed(2)}% ${bl}</b>, so put the effort into the assessments that are left rather than the grade you can't reach.`;
    const alt = [89.5,79.5,69.5,59.5].filter(v => v <= res.best && v > (computeClass(cls).pct ?? 0))[0];
    brk.innerHTML = alt ? `<span class="chip">Reachable instead: ${letterFor(alt)} at ${alt}%</span>` : '';
    return;
  }
  if (res.freebie){
    out.textContent = "Already locked in";
    why.innerHTML = `Even a <b>0</b> on all ${totalRem} remaining points leaves you at <b>${res.floor.toFixed(2)}%</b>.`;
    brk.innerHTML = ''; return;
  }
  const pct = res.f*100;
  out.innerHTML = `${pct.toFixed(1)}% <span style="font-size:1rem;font-weight:700;color:var(--muted)">on everything left</span>`;
  why.innerHTML = `Average that across the remaining ${totalRem} points and you finish on <b>${res.result.toFixed(2)}%</b> — ${letterFor(res.result)}.`;
  brk.innerHTML = cls.categories.filter(c => remaining[c.id] > 0).map(c =>
    `<span class="chip">${esc(c.cat?c.cat.name:c.name)}: ${(res.f*remaining[c.id]).toFixed(1)} / ${remaining[c.id]}</span>`).join('');
}

    for (const cat of c.categories) if (!cat.weight) odd.push(`${c.name}: "${cat.name}" has no weight, so it counts for nothing`);
    for (const a of c.assignments){

        <select id="planMins">${[30,45,60,90,120,180,240].map(v=>`<option value="${v}" ${v==mins?'selected':''}>${v<60?v+' minutes':(v/60)+' hour'+(v>60?'s':'')}</option>`).join('')}</select></label>
    </div>

function renderPlan(){
  const out = $('#planOut'); if (!out) return;
  const mins = num($('#planMins')?.value) ?? 120;
  S.planMins = mins; save();
  const cands = analyzeAll().filter(x => x.a.r.pct !== null)
    .map(x => ({ x, w: x.a.opp + x.a.missing*18 + (x.a.status === 'risk' ? 30 : 0) + (x.a.trend.dir === 'down' ? 12 : 0) }))
    .filter(c => c.w > 0)
    .sort((a,b) => b.w - a.w).slice(0, 4);
  if (!cands.length){
    out.innerHTML = `<div class="note">Nothing here needs the time. Every class is either locked in or already where you want it — spend the time on something else.</div>`;
    return;
  }
  const tot = cands.reduce((s,c) => s + c.w, 0);
  let left = mins;
  const slots = cands.map((c,i) => {
    let m = i === cands.length-1 ? left : Math.max(15, Math.round(mins * c.w/tot / 5) * 5);
    m = Math.min(m, left); left -= m; return { ...c, m };
  }).filter(sl => sl.m >= 10);
  out.innerHTML = `<div class="focus">${slots.map((sl,i) => {
    const a = sl.x.a, why = a.missing ? `${a.missing} missing assignment${a.missing===1?'':'s'} — usually the cheapest points on the board.`

function gpaWhatIf(kind){
  const rows = classRows().filter(x => x.a.r.letter);
  if (!rows.length) return { out:'—', why:'Nothing is graded yet.' };
  const g = schoolGPA();
  const up = L => ['E','D','C','B','A'][Math.min(4, ['E','D','C','B','A'].indexOf(L) + 1)];
  let letters = rows.map(x => ({ L:x.a.r.letter, w:x.c.weighted, n:x.c.name }));
  let note = '';
  if (kind === 'allA'){ letters = letters.map(l => ({ ...l, L:'A' })); note = 'every class an A'; }
  else if (kind === 'allUp'){ letters = letters.map(l => ({ ...l, L:up(l.L) })); note = 'each class one letter higher'; }
  else if (kind === 'oneUp'){
    const i = letters.reduce((lo,l,idx,arr) => POINTS[l.L] < POINTS[arr[lo].L] ? idx : lo, 0);
    note = `${letters[i].n} from ${letters[i].L} to ${up(letters[i].L)}`;
    letters = letters.map((l,idx) => idx === i ? { ...l, L:up(l.L) } : l);
  }
  else if (kind === 'weighted'){ letters = letters.concat([{ L:'A', w:true, n:'a new weighted course' }]); note = 'one more weighted course at an A'; }
  else note = 'exactly what you have now';
  const un = letters.reduce((s,l) => s + (POINTS[l.L] ?? 0), 0) / letters.length;
  const w  = letters.reduce((s,l) => s + gpaPoints(l.L, l.w), 0) / letters.length;
  const d = g ? w - g.w : 0;
  return { out:`${w.toFixed(3)} <span style="font-size:1rem;font-weight:700;color:var(--muted)">weighted · ${un.toFixed(3)} unweighted</span>`,
           why:`With ${note}: ${d>=0?'+':''}${d.toFixed(3)} on your weighted GPA${g?` (from ${g.w.toFixed(3)})`:''}.` };
}

function refreshNumbers(opts){
  const cls = activeClass(); if (!cls) return;
  const r = computeClass(cls);
  const ring = $('#view-class .ring');
  if (ring){
    ring.style.setProperty('--gc', gcolor(r.letter));
    ring.querySelector('.prog').setAttribute('stroke-dashoffset',
      (RING_C*(1-Math.max(0,Math.min(100,r.pct??0))/100)).toFixed(2));
    const lt = ring.querySelector('.lt'); lt.textContent = r.letter || '–'; lt.style.color = gcolor(r.letter);
    ring.querySelector('.pc').textContent = r.pct === null ? 'no grades' : r.pct.toFixed(2)+'%';
  }
  const hl = $('#headline'); if (hl) hl.innerHTML = headlineHTML(r);
  const cl = $('#catList'); if (cl) cl.innerHTML = catListHTML(cls, r);
  $$('#view-class .arow').forEach(row => {
    const a = cls.assignments.find(x => x.id === row.dataset.id); if (!a) return;
    const p = pctOf(a), L = p === null ? null : letterFor(p);
    const pc = row.querySelector('.a-pct');
    if (pc){ pc.textContent = p === null ? '—' : p.toFixed(1)+'%'; pc.style.color = p === null ? 'var(--muted)' : gcolor(L); }
    const dot = row.querySelector('.catdot'); if (dot) dot.style.background = gcolor(L);
    const ic = row.querySelector('.a-impact');
    if (ic){ let t = '—', k = '';
      if (a.graded && a.included && r.pct !== null){
        const w = computeClass(cls, { skipId:a.id });
        if (w.pct !== null){ const dd = r.pct-w.pct; k = dd > .004 ? 'up' : dd < -.004 ? 'down' : ''; t = (dd>=0?'+':'')+dd.toFixed(2); } }
      ic.textContent = t; ic.className = 'a-impact ' + k; }
    row.classList.toggle('off', !a.included);
    const tb = row.querySelector('.tick-btn'); if (tb) tb.setAttribute('aria-pressed', String(!!a.included));
    const mod = isModified(a);
    const nameCell = row.querySelector('.a-name');
    let tag = nameCell && nameCell.querySelector('.tag.mod');
    if (nameCell && mod && !tag){ tag = document.createElement('span'); tag.className = 'tag mod'; tag.textContent = 'edited';
      nameCell.querySelector('[data-name]').after(tag); }
    else if (tag && !mod) tag.remove();
    const right = row.querySelector('.a-right');
    let rb = right && right.querySelector('[data-reset]');
    if (right && mod && !rb){ rb = document.createElement('button'); rb.className = 'rowbtn reset';
      rb.dataset.reset = a.id; rb.setAttribute('aria-label','Reset score'); rb.textContent = '↺';
      right.insertBefore(rb, right.querySelector('[data-del]')); }
    else if (rb && !mod) rb.remove();
  });
  const ha = $('#heroActions'), wn = whatIfCount(cls);
  if (ha && +ha.dataset.n !== wn){ ha.innerHTML = heroActionsHTML(cls); ha.dataset.n = wn; }
  clearTimeout(chartT); chartT = setTimeout(paintChart, 260);
  renderWif(); save();
  if (!opts || !opts.quiet){
    const L = r.letter;
    if (lastLetter && L && POINTS[L] > POINTS[lastLetter]){ Confetti.burst(); toast(`That's ${article(L)} ${L}. 🍉`); }
    lastLetter = L;
  } else lastLetter = r.letter;
}

const systemDark = () => matchMedia('(prefers-color-scheme: dark)').matches;

function mixHex(hex, withHex, amt){
  const p = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
  try { const a = p(hex), b = p(withHex);
    return '#' + a.map((v,i) => Math.round(v + (b[i]-v)*amt).toString(16).padStart(2,'0')).join('');
  } catch(e){ return hex; }
}
function applyTheme(){
  const root = document.documentElement;
  if (S.theme === 'auto') delete root.dataset.theme; else root.dataset.theme = S.theme;
  root.dataset.palette = S.skin;

  if (S.accent){

    root.style.setProperty('--tint', S.accent);
    root.style.setProperty('--acc2', mixHex(S.accent,'#ffffff',.34));
    root.style.setProperty('--acc3', mixHex(S.accent,'#22a35a',.55));
    root.style.setProperty('--skin-glow', mixHex(S.accent,'#ffffff',.24));
  } else ['--acc','--tint','--acc2','--acc3','--skin-glow'].forEach(v => root.style.removeProperty(v));
  const mt = $('meta[name=theme-color]');
  if (mt) mt.setAttribute('content', getComputedStyle(root).getPropertyValue('--acc').trim() || '#f43f5e');

function handleAct(e){
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (!act) return false;
  const cls = activeClass();
  switch (act){
    case 'dismissImport': S.lastImport = null; render(); return true;
    case 'fixweights': {
      const bad = S.classes.find(c => c.categories.some(x => !x.weight));
      if (bad){ S.active = bad.id; render(); classModal(bad.id); }
      return true; }
    case 'addclass': { const c = newClass('New class'); S.active = c.id; render(); classModal(c.id); return true; }
    case 'pasteNew': ui.paste = true; ui.forceNewClass = false; render();
      $('#pastePanel')?.scrollIntoView({block:'center',behavior:'smooth'}); $('#pasteBox')?.focus(); return true;
    case 'paste': ui.paste = true; render();
      $('#pastePanel')?.scrollIntoView({block:'center',behavior:'smooth'}); $('#pasteBox')?.focus(); return true;
    case 'pasteClose': ui.paste = false; ui.pasteText = ''; render(); return true;
    case 'import': importPaste($('#pasteBox').value, false); return true;
    case 'importReplace':
      if (cls && cls.assignments.length && !confirm(`Delete the ${cls.assignments.length} assignments in ${cls.name} and import fresh?`)) return true;
      importPaste($('#pasteBox').value, true); return true;
    case 'back': go('gradebook'); return true;
    case 'optimize': optimizeModal(); return true;
    case 'scrollRows': $('#rowList')?.scrollIntoView({ block:'start', behavior:'smooth' }); return true;
    case 'fillOpen': fillModal(); return true;
    case 'fillGo': {
      const p = num($('#fillPct').value) ?? 100; let n = 0;
      cls.assignments.forEach(a => { if (!a.graded && num(a.possible) > 0){
        a.earned = round2(num(a.possible)*p/100); a.graded = true; a.hypo = true; a.included = true; n++; } });
      closeModal(); render(); toast(n ? `Filled ${n} at ${p}%` : 'Nothing to fill'); return true; }
    case 'addrow': addAssignment(); return true;
    case 'clearwhatif':
      cls.assignments = cls.assignments.filter(a => !a.hypo);
      cls.assignments.forEach(a => { a.earned = a.origEarned; a.possible = a.origPossible; a.graded = a.origEarned !== null; });
      render(); refreshNumbers({quiet:true}); toast('Back to your real grades'); return true;
    case 'settings': classModal(S.active); return true;
    case 'addcat': cls.categories.push({ id:uid(), name:'New category', weight:0 });
      if (ui.editing) classModal(ui.editing); else render(); return true;
    case 'resetcats': {
      const keep = cls.categories.slice(0,2);
      cls.categories = DEFAULT_CATS();
      cls.assignments.forEach(a => {
        const old = keep.find(k => k.id === a.catId);
        const canon = canonical(old?.name || '') || canonical(String(a.name).replace(RE.prefix,'$1'));
        const target = cls.categories.find(c => norm(c.name) === norm(canon?.name || 'All Tasks / Assessments'));
        a.catId = (target || cls.categories[0]).id;
      });
      if (ui.editing) classModal(ui.editing); else render(); return true; }
    case 'clearsample':
      S.classes = S.classes.filter(c => !c.sample);
      S.active = S.classes[0]?.id || null; lastLetter = null;
      go('gradebook'); toast('Cleared — paste your own'); return true;
    case 'clearAccent': S.accent = ''; applyTheme(); themeModal(); save(); return true;
  }
  return false;
}

});

  if (e.key === 'Escape' && ui.modal){ closeModal(); render(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){
    const el = document.activeElement;
    if (el && (/INPUT|TEXTAREA/.test(el.tagName) || el.isContentEditable)) return;
    if (undoStack.length){ e.preventDefault(); undoDelete(); }
  }
});
addEventListener('resize', () => { clearTimeout(chartT); chartT = setTimeout(paintChart, 180); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.theme === 'auto'){ applyTheme(); paintChart(); } });

async function doExport(){
  const json = JSON.stringify(S, null, 2);
  const filename = 'grade-melon-backup-' + new Date().toISOString().slice(0,10) + '.json';
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch(err){}
  if (dl){ try { await dl.save({ filename, data:json }); toast('Backup saved'); }
    catch(err){ toast(err && err.code === 'declined' ? 'Backup cancelled' : 'Could not save here'); } return; }
  const blob = new Blob([json], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  URL.revokeObjectURL(a.href); toast('Backup downloaded');
}
$('#fileIn').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { try { const d = JSON.parse(rd.result); if (!d.classes) throw 0;
      S = Object.assign(S, d); load(); applyTheme(); lastLetter = null; closeModal(); go('gradebook'); toast('Backup restored');
    } catch(err){ toast('That is not a Grade Melon backup'); } };
  rd.readAsText(f); e.target.value = '';
});

const firstVisit = !localStorage.getItem(KEY);
load();
applyTheme();
if (firstVisit && !S.classes.length) loadDemo(true);
go('gradebook');

return { go, openClass, loadDemo, parseGradebook, splitClasses, computeClass, semesterGrade, letterFor,
         scoreNeeded, neededFraction, trendSeries, paintChart, schoolGPA, applyTheme,
         analyze, analyzeAll, classRows, focusList, ask, findClass, renderWif, buildReport, printReport,
         gpaWhatIf, dataCheckModal, biggestCause, upcomingImpact, projectAll, projectOne, classRemaining, trendOf, STATUS,
         confetti:() => Confetti.burst(), state:() => S, setState:o => { S = Object.assign(S,o); applyTheme(); render(); } };
})();
